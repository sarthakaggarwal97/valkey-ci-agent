extends: [valkey.liveness]
id: proposed.wait-prerepl-setslot
deployment:
  modes: [standalone]
metadata:
  description: CLUSTER SETSLOT on a primary with a replica blocks the client in BLOCKED_WAIT
    for pre-replication and re-executes it after the unblock; repeated SETSLOTs re-block
    the same client through the stored list node
components:
- use: valkey.action.commands
  id: setslot
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 3
    timeout_s: 20
    commands:
    - {command: [CLUSTER, REPLICATE, "<node.0.id>"], node: 2, expect: {equals: OK}}
    - {command: [INFO, replication], node: 2, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [SET, foo, bar], expect: {equals: OK}}
    - {command: [WAIT, 1, 0], expect: {equals: 1}}
    - {command: [CLUSTER, SETSLOT, 12182, MIGRATING, "<node.1.id>"], expect: {equals: OK}}
    - {command: [CLUSTER, SETSLOT, 12182, STABLE], expect: {equals: OK}}
    - {command: [CLUSTER, SETSLOT, 12182, MIGRATING, "<node.1.id>"], expect: {equals: OK}}
    - {command: [CLUSTER, SETSLOT, 12182, STABLE], expect: {equals: OK}}
    - {command: [CLUSTER, SETSLOT, 0, NODE, "<node.1.id>"], expect: {equals: OK}}
    - {command: [CLUSTER, COUNTKEYSINSLOT, 12182], expect: {equals: 1}}
    - {command: [PING], node: 2, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [setslot.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: setslot}
