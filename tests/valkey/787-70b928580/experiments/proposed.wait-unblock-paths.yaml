extends: [valkey.liveness]
id: proposed.wait-unblock-paths
deployment:
  modes: [standalone]
metadata:
  description: Drive every WAIT/WAITAOF unblock path (timeout, error, demotion, ack-satisfied)
    and re-block the same clients, so a stale or missing stored list node trips the
    new asserts
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: waits
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    server_config: {appendonly: "yes", appendfsync: everysec}
    timeout_s: 15
    commands:
    - {command: [SET, k1, v1], expect: {equals: OK}}
    - {command: [WAIT, 0, 0], expect: {equals: 0}}
    - {raw: "WAIT 1 150\r\n", connection: w1, expect: {equals: 0}}
    - {raw: "WAIT 1 150\r\n", connection: w1, expect: {equals: 0}}
    - {raw: "WAITAOF 1 1 0\r\n", connection: w2, expect: {exists: false}}
    - {command: [CONFIG, SET, appendonly, no], expect: {equals: OK}}
    - {connection: w2, read: true, expect: {contains: "appendonly is disabled"}}
    - {raw: "WAIT 1 150\r\n", connection: w2, expect: {equals: 0}}
    - {raw: "WAIT 1 0\r\n", connection: w3, expect: {exists: false}}
    - {raw: "WAIT 1 0\r\n", connection: w4, expect: {exists: false}}
    - {raw: "WAIT 1 0\r\n", connection: w5, expect: {exists: false}}
    - {command: [REPLICAOF, "<node.1.host>", "<node.1.port>"], expect: {equals: OK}}
    - {connection: w3, read: true, expect: {contains: UNBLOCKED}}
    - {connection: w4, read: true, expect: {contains: UNBLOCKED}}
    - {connection: w5, read: true, expect: {contains: UNBLOCKED}}
    - {command: [REPLICAOF, NO, ONE], expect: {equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [SET, k2, v2], expect: {equals: OK}}
    - {command: [WAIT, 1, 0], expect: {equals: 1}}
    - {command: [CONFIG, SET, appendonly, yes], expect: {equals: OK}}
    - {command: [SET, k3, v3], expect: {equals: OK}}
    - {command: [WAITAOF, 1, 0, 0], expect: {equals: [1, 0]}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [waits.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: waits}
