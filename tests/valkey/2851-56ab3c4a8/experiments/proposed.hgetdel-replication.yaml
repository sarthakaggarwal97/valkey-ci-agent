extends: [valkey.liveness]
id: proposed.hgetdel-replication
deployment:
  modes: [standalone]
metadata:
  description: HGETDEL propagated verbatim to a live replica, which must apply the
    deletions, key removal and volatile-field tracking itself
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: repl
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - {command: [HSET, h, a, '1', b, '2', c, '3'], expect: {equals: 3}}
    - {command: [HEXPIRE, h, 1000, FIELDS, 1, a], expect: {equals: [1]}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [HGET, h, c], node: 1, wait_s: 30, expect: {equals: '3'}}
    - {command: [HGETDEL, h, FIELDS, 2, a, nope], expect_difference: true, expect: {
        equals: ['1', null]}}
    - {command: [HEXISTS, h, a], node: 1, wait_s: 15, expect_difference: true, expect: {
        equals: 0}}
    - {command: [HGETDEL, h, FIELDS, 2, b, c], expect_difference: true, expect: {
        equals: ['2', '3']}}
    - {command: [EXISTS, h], node: 1, wait_s: 15, expect_difference: true, expect: {
        equals: 0}}
    - {command: [HSET, h2, k, v], expect: {equals: 1}}
    - {command: [HGET, h2, k], node: 1, wait_s: 15, expect: {equals: v}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
