extends: [valkey.liveness]
id: proposed.repl-pipeline-chain
deployment:
  modes: [standalone]
metadata:
  description: MULTI/EXEC batches, a 200-command script-effect burst, and a >32KB
    argument stream down a 3-node replication chain; reploff bookkeeping (qb_applied)
    must stay exact on both builds and no node may hit the new asserts
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: chain
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 3
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
    - {command: [SET, seed, x], expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [REPLICAOF, <node.1.host>, <node.1.port>], node: 2, expect: {equals: OK}}
    - {command: [INFO, replication], node: 2, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [MULTI], expect: {equals: OK}}
    - {command: [SET, k1, v1], expect: {equals: QUEUED}}
    - {command: [SET, k2, ""], expect: {equals: QUEUED}}
    - {command: [DEL, nosuchkey], expect: {equals: QUEUED}}
    - {command: [EXEC], expect: {equals: [OK, OK, 0]}}
    - {command: [EVAL, "for i=1,200 do redis.call('SET', 'bulk:' .. i, 'v' .. i) end\
          \ return 200", 0], expect: {equals: 200}}
    - {command: [EVAL, "redis.call('SET', KEYS[1], string.rep('x', 100000)) return\
          \ 1", 1, big], expect: {equals: 1}}
    - {command: [MULTI], expect: {equals: OK}}
    - {command: [SET, k3, v3], expect: {equals: QUEUED}}
    - {command: [APPEND, k3, "-more"], expect: {equals: QUEUED}}
    - {command: [EXEC], expect: {equals: [OK, 7]}}
    - {command: [STRLEN, big], node: 2, wait_s: 30, expect: {equals: 100000}}
    - {command: [GET, "bulk:200"], node: 2, wait_s: 30, expect: {equals: v200}}
    - {command: [GET, k3], node: 2, wait_s: 30, expect: {equals: "v3-more"}}
    - {command: [GET, k2], node: 2, wait_s: 30, expect: {equals: ""}}
    - {command: [GET, k1], node: 1, wait_s: 30, expect: {equals: v1}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [chain.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: chain}
