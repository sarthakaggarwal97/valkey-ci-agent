extends: [valkey.liveness]
id: proposed.slot-migration-import-pipeline
deployment:
  modes: [standalone]
metadata:
  description: Atomic slot migration streams a 2000-key snapshot, a 40KB value, and
    a live MULTI/EXEC batch through the SYNCSLOTS import client, whose backfilled
    ESTABLISH must keep qb_applied and reploff exact on both builds
components:
- use: valkey.action.commands
  id: migrate
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 2
    timeout_s: 60
    server_config: {rdb-key-save-delay: 500}
    commands:
    - {command: [SET, "{a}:k1", v1], expect: {equals: OK}}
    - {command: [SET, "{a}:empty", ""], expect: {equals: OK}}
    - {command: [SETRANGE, "{a}:big", 39999, x], expect: {equals: 40000}}
    - {command: [RPUSH, "{a}:list", a, b, c], expect: {equals: 3}}
    - {command: [EVAL, "for i=1,2000 do redis.call('SET', '{a}:seed' .. i, string.rep('y',\
          \ 100)) end return 2000", 0], expect: {equals: 2000}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 15000, 16383, NODE, <node.1.id>],
      expect: {equals: OK}}
    - {command: [MULTI], expect: {equals: OK}}
    - {command: [SET, "{a}:k2", v2], expect: {equals: QUEUED}}
    - {command: [APPEND, "{a}:k1", "-x"], expect: {equals: QUEUED}}
    - {command: [SET, "{a}:k3", v3], expect: {equals: QUEUED}}
    - {command: [EXEC], expect: {equals: [OK, 4, OK]}}
    - {command: [GET, "{a}:k2"], node: 1, wait_s: 60, expect: {equals: v2}}
    - {command: [GET, "{a}:k1"], node: 1, expect: {equals: "v1-x"}}
    - {command: [STRLEN, "{a}:big"], node: 1, expect: {equals: 40000}}
    - {command: [LRANGE, "{a}:list", 0, -1], node: 1, expect: {equals: [a, b, c]}}
    - {command: [GET, "{a}:empty"], node: 1, expect: {equals: ""}}
    - {command: [STRLEN, "{a}:seed2000"], node: 1, expect: {equals: 100}}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], compare: skip}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [migrate.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: migrate}
