scenario_id: ai-6ed8bfb423c8
seed: 13
experiment:
  id: valkey.cluster-chaos
  inputs:
    command_rate: 2000
    keys_per_slot: 10
    waves:
    - - op: kill
        target: replica
        signal: SIGKILL
      - op: failover
        shard: 0
        delay_s: 2
