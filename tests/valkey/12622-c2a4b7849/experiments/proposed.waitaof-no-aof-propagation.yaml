extends: [valkey.liveness]
id: proposed.waitaof-no-aof-propagation
deployment:
  modes: [standalone]
metadata:
  description: >-
    WAITAOF after replication-only propagation (DEBUG REPLICATE raises master_repl_offset
    with nothing to fsync) returns on the fixed build; the parent hangs until the
    WAITAOF timeout and reports 0 local acks.
inputs:
  properties:
    appendfsync: {type: string, enum: [everysec, always], default: everysec}
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: waitaof
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    server_config:
      appendonly: "yes"
      appendfsync: {$ref: inputs.appendfsync}
    timeout_s: 90
    commands:
    - {command: [SET, x, 1], expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, compare: skip, wait_s: 30, expect: {
        contains: "master_link_status:up"}}
    - {command: [WAITAOF, 1, 1, 10000], wait_s: 30, expect: {equals: [1, 1]}}
    - {command: [DEBUG, REPLICATE, SET, y, 1], expect: {equals: OK}}
    - {command: [GET, y], node: 1, wait_s: 10, expect: {equals: "1"}}
    - {command: [WAITAOF, 1, 1, 3000], expect_difference: true, expect: {equals: [
          1, 1]}}
    - {command: [SET, z, 1], expect: {equals: OK}}
    - {command: [WAITAOF, 1, 1, 10000], wait_s: 30, expect: {equals: [1, 1]}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [waitaof.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: waitaof}
