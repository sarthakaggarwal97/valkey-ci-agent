extends: [valkey.liveness]
id: proposed.cancel-slot-migration-snapshotting
deployment:
  modes: [standalone, cluster]
metadata:
  description: Aborting a slot export while its snapshot child is active must not
    crash the source
inputs:
  required: [parent]
  properties:
    parent:
      type: environment_reference
      reference_kinds: [artifacts]
    resp: {type: integer, enum: [2, 3], default: 2}
    save_delay_us: {type: integer, default: 600000}
components:
- use: valkey.action.commands
  id: migrate
  config:
    compare_with: {$ref: inputs.parent}
    cluster: true
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 30
    server_config:
      rdb-key-save-delay: {$ref: inputs.save_delay_us}
      cluster-allow-replica-migration: "no"
    commands:
    - {command: [SET, "{6ZJ}:k01", v], node: 0, expect: {equals: OK}}
    - {command: [SET, "{6ZJ}:k02", v], node: 0, expect: {equals: OK}}
    - {command: [SET, "{6ZJ}:k03", v], node: 0, expect: {equals: OK}}
    - {command: [SET, "{6ZJ}:k04", v], node: 0, expect: {equals: OK}}
    - {command: [SET, "{6ZJ}:k05", v], node: 0, expect: {equals: OK}}
    - {command: [SET, "{6ZJ}:k06", v], node: 0, expect: {equals: OK}}
    - {command: [SET, "{6ZJ}:k07", v], node: 0, expect: {equals: OK}}
    - {command: [SET, "{6ZJ}:k08", v], node: 0, expect: {equals: OK}}
    - {command: [SET, "{6ZJ}:k09", v], node: 0, expect: {equals: OK}}
    - {command: [SET, "{6ZJ}:k10", v], node: 0, expect: {equals: OK}}
    - {command: [SET, "{6ZJ}:k11", v], node: 0, expect: {equals: OK}}
    - {command: [SET, "{6ZJ}:k12", v], node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 16383, 16383, NODE, "<node.1.id>"],
      node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], node: 0, wait_s: 25, expect: {contains: snapshotting},
      compare: skip}
    - {command: [CLUSTER, CANCELSLOTMIGRATIONS], node: 0, expect: {equals: OK}}
    - {command: [PING], node: 0, expect_difference: true, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_evidence:
- {evidence_id: valkey.command.sequence, source: migrate}
