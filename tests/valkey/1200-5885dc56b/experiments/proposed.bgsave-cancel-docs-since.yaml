extends: [valkey.liveness]
id: proposed.bgsave-cancel-docs-since
deployment:
  modes: [standalone]
metadata:
  description: COMMAND DOCS BGSAVE reports the CANCEL option and its history entry
    as since 8.1.0, not 8.0.0
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: docs
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    timeout_s: 10
    commands:
    - {command: [COMMAND, DOCS, BGSAVE], expect_difference: true, expect: {contains: "8.1.0"}}
    - {command: [BGSAVE, CANCEL], expect: {error: "not in progress"}}
    - {command: [SET, k, v], expect: {equals: OK}}
    - {command: [COMMAND, COUNT], compare: skip, expect: {min: 100}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [docs.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: docs}
