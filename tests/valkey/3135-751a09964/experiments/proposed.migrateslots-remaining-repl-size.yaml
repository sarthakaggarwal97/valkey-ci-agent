extends: [valkey.liveness]
id: proposed.migrateslots-remaining-repl-size
deployment:
  modes: [standalone]
metadata:
  description: CLUSTER GETSLOTMIGRATIONS gains a remaining_repl_size field on export,
    import and tracking-only jobs, and the export pause threshold now compares raw
    reply_bytes against slot-migration-max-failover-repl-bytes
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    max_repl_bytes: {type: integer, minimum: -1, maximum: 1073741824, default: 0}
components:
- use: valkey.action.commands
  id: migrate
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 3
    resp: {$ref: inputs.resp}
    server_config: {slot-migration-max-failover-repl-bytes: {$ref: inputs.max_repl_bytes}}
    timeout_s: 60
    commands:
    - {command: [DEBUG, SLOTMIGRATION, PREVENT-PAUSE, 1], node: 0, expect: {equals: OK}}
    - {command: [SET, "{6ZJ}:k1", v1], node: 0, expect: {equals: OK}}
    - {command: [SET, "{6ZJ}:k2", v2], node: 0, expect: {equals: OK}}
    - {command: [SET, "{6ZJ}:k3", v3], node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, REPLICATE, "<node.1.id>"], node: 2, expect: {equals: OK}}
    - {command: [INFO, replication], node: 2, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 16383, 16383, NODE, "<node.1.id>"],
      node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, COUNTKEYSINSLOT, 16383], node: 1, wait_s: 30, expect: {
        equals: 3}}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], node: 0, expect_difference: true, expect: {
        contains: remaining_repl_size}}
    - {command: [PING], node: 0, expect: {equals: PONG}}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], node: 1, expect_difference: true, expect: {
        contains: remaining_repl_size}}
    - {command: [PING], node: 1, expect: {equals: PONG}}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], node: 2, wait_s: 15, expect_difference: true,
      expect: {contains: remaining_repl_size}}
    - {command: [PING], node: 2, expect: {equals: PONG}}
    - {command: [DEBUG, SLOTMIGRATION, PREVENT-PAUSE, 0], node: 0, expect: {equals: OK}}
    - {command: [GET, "{6ZJ}:k1"], node: 1, wait_s: 60, expect: {equals: v1}}
    - {command: [GET, "{6ZJ}:k3"], node: 1, expect: {equals: v3}}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], node: 0, expect_difference: true, expect: {
        contains: remaining_repl_size}}
    - {command: [PING], node: 0, expect: {equals: PONG}}
    - {command: [PING], node: 1, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [migrate.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: migrate}
