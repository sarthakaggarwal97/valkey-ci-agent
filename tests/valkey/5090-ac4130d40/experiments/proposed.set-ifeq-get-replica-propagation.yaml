extends: [valkey.liveness]
id: proposed.set-ifeq-get-replica-propagation
deployment:
  modes: [standalone]
metadata:
  description: SET GET with an IFEQ/IFNE comparison value spelled GET must keep the
    comparison value when propagated to a replica
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: repl
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [SET, foo, GET], node: 0, expect: {equals: OK}}
    - {command: [SET, foo, bar, IFEQ, GET, GET], node: 0, expect: {equals: GET}}
    - {command: [SET, ifne_key, start], node: 0, expect: {equals: OK}}
    - {command: [SET, ifne_key, baz, ifne, get, get], node: 0, expect: {equals: start}}
    - {command: [SET, GET, GET], node: 0, expect: {equals: OK}}
    - {command: [SET, GET, repl, IFEQ, GET, GET, GET], node: 0, expect: {equals: GET}}
    - {command: [WAIT, 1, 10000], node: 0, expect: {equals: 1}}
    - {command: [GET, foo], node: 1, expect_difference: true, expect: {equals: bar}}
    - {command: [GET, ifne_key], node: 1, expect_difference: true, expect: {equals: baz}}
    - {command: [GET, GET], node: 1, expect_difference: true, expect: {equals: repl}}
    - {command: [SET, sanity, v], node: 0, expect: {equals: OK}}
    - {command: [GET, sanity], node: 1, wait_s: 10, expect: {equals: v}}
    checks:
      acl: true
      compat: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
