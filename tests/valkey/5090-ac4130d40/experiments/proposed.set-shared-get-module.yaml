extends: [valkey.liveness]
id: proposed.set-shared-get-module
deployment:
  modes: [standalone]
metadata:
  description: RM_Call SET passing one object as both the IFEQ/IFNE comparison value
    and the GET option, compared against the parent
components:
- use: valkey.action.commands
  id: shared
  config:
    compare_with: {$ref: artifacts.parent.binary}
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    timeout_s: 30
    commands:
    - {command: [SET, k, GET], expect: {equals: OK}}
    - {command: [test.set_shared_get, k, newval, IFEQ], expect_difference: true, expect: {
        equals: GET}}
    - {command: [GET, k], expect_difference: true, expect: {equals: newval}}
    - {command: [test.set_shared_get, k, other, IFEQ], expect_difference: true, expect: {
        equals: newval}}
    - {command: [GET, k], expect_difference: true, expect: {equals: newval}}
    - {command: [test.set_shared_get, k, third, IFNE], expect_difference: true, expect: {
        equals: newval}}
    - {command: [GET, k], expect_difference: true, expect: {equals: third}}
    - {command: [SET, k, plain], expect: {equals: OK}}
    - {command: [GET, k], expect: {equals: plain}}
    checks:
      acl: true
      compat: true
      variants: true
required_events: [shared.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: shared}
