extends: [valkey.liveness]
id: proposed.primary-link-kill-resync
deployment:
  modes: [standalone]
metadata:
  description: CLIENT KILL/LIST TYPE primary acts on the replica's primary-link client
    (parent rejects the type) and the killed link reconnects with a resync
components:
- use: valkey.action.commands
  id: linkkill
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 90
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [SET, k1, v1], node: 0, expect: {equals: OK}}
    - {command: [GET, k1], node: 1, wait_s: 15, expect: {equals: v1}}
    - {command: [CLIENT, LIST, TYPE, primary], node: 1, expect_difference: true, expect: {
        contains: "flags=M"}}
    - {command: [CLIENT, KILL, TYPE, primary], node: 1, expect_difference: true, expect: {
        equals: 1}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [SET, k2, v2], node: 0, expect: {equals: OK}}
    - {command: [GET, k2], node: 1, wait_s: 15, expect: {equals: v2}}
    - {command: [CLIENT, KILL, TYPE, master], node: 1, expect: {equals: 1}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [SET, k3, v3], node: 0, expect: {equals: OK}}
    - {command: [GET, k3], node: 1, wait_s: 15, expect: {equals: v3}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [linkkill.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: linkkill}
