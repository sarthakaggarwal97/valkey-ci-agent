extends: [valkey.liveness]
id: proposed.repl-error-reply-paths
deployment:
  modes: [standalone]
metadata:
  description: Error replies cross the replication link in both directions (afterErrorReply
    primary/replica naming) and both nodes stay alive
components:
- use: valkey.action.commands
  id: replerr
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 90
    commands:
    - {command: [CONFIG, SET, replica-read-only, no], node: 1, expect: {equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [SET, k, 10], node: 0, expect: {equals: OK}}
    - {command: [GET, k], node: 1, wait_s: 15, expect: {equals: "10"}}
    - {command: [DEL, k], node: 1, expect: {equals: 1}}
    - {command: [LPUSH, k, a], node: 1, expect: {equals: 1}}
    - {command: [INCR, k], node: 0, expect: {equals: 11}}
    - {command: [SET, marker, done], node: 0, expect: {equals: OK}}
    - {command: [GET, marker], node: 1, wait_s: 15, expect: {equals: done}}
    - {command: [TYPE, k], node: 1, expect: {equals: list}}
    - {command: [PING], node: 1, expect: {equals: PONG}}
    - {command: [SYNC], node: 0, connection: repl, compare: skip}
    - {command: [EXEC], node: 0, connection: repl, compare: skip}
    - {command: [PING], node: 0, expect: {equals: PONG}}
    - {command: [GET, marker], node: 0, expect: {equals: done}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [replerr.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: replerr}
