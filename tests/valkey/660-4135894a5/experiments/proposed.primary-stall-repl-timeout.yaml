extends: [valkey.base]
id: proposed.primary-stall-repl-timeout
deployment:
  modes: [standalone, cluster]
  replicas_per_primary: {minimum: 1}
metadata:
  description: SIGSTOP the primary past repl-timeout; the replica logs the renamed
    PRIMARY timeout, frees the link, times out the reconnect handshake (undoConnectWithPrimary),
    and resyncs after SIGCONT with no acknowledged write lost
inputs:
  properties:
    pause_s: {type: number, default: 15}
components:
- use: valkey.fault.process-signal
  id: stall-primary
  config:
    when_event: warm-up.completed
    instance: primary
    signal: SIGSTOP
    pause_s: {$ref: inputs.pause_s}
- use: valkey.action.sleep
  id: warm-up
  depends_on: [writes, stall-primary]
  config: {seconds: 3}
- use: valkey.action.sleep
  id: settle
  depends_on: [warm-up]
  config: {seconds: 30}
- use: valkey.observer.log
  id: repl-logs
  config:
    instances: replicas
    expect:
    - {pattern: "PRIMARY timeout: no data nor PING received", evidence_id: valkey.log.primary-timeout,
      required: true}
    - {pattern: "Timeout connecting to the PRIMARY|Primary did not respond to command\
        \ during SYNC handshake", evidence_id: valkey.log.handshake-timeout}
required_events: [warm-up.completed]
required_evidence:
- {evidence_id: valkey.fault.injected, source: stall-primary}
- {evidence_id: valkey.log.primary-timeout, source: repl-logs}
