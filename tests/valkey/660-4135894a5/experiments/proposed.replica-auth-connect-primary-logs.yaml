extends: [valkey.liveness]
id: proposed.replica-auth-connect-primary-logs
deployment:
  modes: [standalone]
metadata:
  description: A replica that fails AUTH and then fails to connect drives the renamed
    Unable to AUTH to PRIMARY and Unable to connect to PRIMARY log paths of the build
    under test
components:
- use: valkey.action.commands
  id: repl
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 25
    commands:
    - {command: [CONFIG, SET, masterauth, wrongpass], node: 1, expect: {equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, compare: skip, wait_s: 10, expect: {
        contains: "master_link_status:down"}}
    - {command: [REPLICAOF, NO, ONE], node: 1, expect: {equals: OK}}
    - {command: [CONFIG, SET, masterauth, ""], node: 1, expect: {equals: OK}}
    - {command: [REPLICAOF, nonexistent.invalid, 6400], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, compare: skip, wait_s: 10, expect: {
        contains: "master_link_status:down"}}
    - {command: [REPLICAOF, NO, ONE], node: 1, expect: {equals: OK}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
