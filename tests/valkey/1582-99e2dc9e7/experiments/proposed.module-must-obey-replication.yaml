extends: [valkey.liveness]
id: proposed.module-must-obey-replication
deployment:
  modes: [standalone]
metadata:
  description: VM_MustObeyClient returns 1 on a replica executing a replicated module
    command (plain and inside MULTI/EXEC) and 0 for a normal client
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: obey
  config:
    compare_with: {$ref: artifacts.parent.binary}
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - {command: [propagate-test.obeyed], node: 0, expect_difference: true, expect: {
        equals: 0}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [propagate-test.incr, k1], node: 0, expect: {equals: 1}}
    - {command: [GET, k1], node: 1, wait_s: 30, expect: {equals: "1"}}
    - {command: [propagate-test.obeyed], node: 1, expect_difference: true, expect: {
        equals: 1}}
    - {command: [propagate-test.obeyed], node: 0, expect_difference: true, expect: {
        equals: 0}}
    - {command: [MULTI], node: 0, expect: {equals: OK}}
    - {command: [propagate-test.incr, k1], node: 0, expect: {equals: QUEUED}}
    - {command: [EXEC], node: 0, expect: {equals: [2]}}
    - {command: [GET, k1], node: 1, wait_s: 30, expect: {equals: "2"}}
    - {command: [propagate-test.obeyed], node: 1, expect_difference: true, expect: {
        equals: 2}}
    checks:
      acl: true
      compat: true
      variants: true
required_events: [obey.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: obey}
