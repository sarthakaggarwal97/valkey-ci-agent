extends: [valkey.liveness]
id: proposed.check-rdb-stats
deployment:
  modes: [standalone]
metadata:
  description: valkey-check-rdb --stats/--format/--output profiling of the change
    vs its parent over every value type, both zset encodings, a high DB id, and oversized
    collections
inputs:
  required: [parent]
  properties:
    parent:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "The parent commit's build, {$ref: artifacts.parent.binary}"
    format: {type: string, enum: [table, info, csv], default: info}
    stats_match: {type: string, default: "db.9.type.string.keys.total:1"}
components:
- use: valkey.action.tools
  id: check-rdb
  config:
    compare_with: {$ref: inputs.parent}
    server: true
    timeout_s: 90
    ignore: ['^\d+:[A-Z] .*\n']
    runs:
    - {tool: valkey-cli, args: [-p, $port, FUNCTION, LOAD, "#!lua name=mylib\nserver.register_function('myfunc',\
          \ function(keys, args) return 1 end)"], expect: {stdout: {contains: mylib}}}
    - {tool: valkey-cli, args: [-p, $port, -n, 0, SET, s1, hello], expect: {stdout: {
          equals: "OK\n"}}}
    - {tool: valkey-cli, args: [-p, $port, -n, 0, EVAL, "redis.call('set', KEYS[1],\
          \ string.rep('x', 2000000)); return 1", 1, big], expect: {stdout: {equals: "1\n"}}}
    - {tool: valkey-cli, args: [-p, $port, -n, 1, EVAL, "for i=1,250000 do redis.call('rpush',\
          \ KEYS[1], i) end return 1", 1, biglist], expect: {stdout: {equals: "1\n"}}}
    - {tool: valkey-cli, args: [-p, $port, -n, 2, SADD, set1, a, b, c], expect: {
        stdout: {equals: "3\n"}}}
    - {tool: valkey-cli, args: [-p, $port, -n, 3, ZADD, z_lp, 1, m], expect: {stdout: {
          equals: "1\n"}}}
    - {tool: valkey-cli, args: [-p, $port, -n, 4, ZADD, z_sl, 1, aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa],
      expect: {stdout: {equals: "1\n"}}}
    - {tool: valkey-cli, args: [-p, $port, -n, 5, HSET, h1, f, v], expect: {stdout: {
          equals: "1\n"}}}
    - {tool: valkey-cli, args: [-p, $port, -n, 6, XADD, st1, "*", f, v], expect: {
        stdout: {contains: "-"}}}
    - {tool: valkey-cli, args: [-p, $port, -n, 9, SET, k9, v9], expect: {stdout: {
          equals: "OK\n"}}}
    - {tool: valkey-cli, args: [-p, $port, SAVE], expect: {stdout: {equals: "OK\n"}}}
    - {tool: valkey-check-rdb, args: [dump.rdb], expect_difference: true, expect: {
        exit: {equals: 0}, stdout: {contains: functions}}}
    - {tool: valkey-check-rdb, args: [dump.rdb, --stats, --format, {$ref: inputs.format}],
      expect_difference: true, expect: {exit: {equals: 0}, stdout: {contains: {$ref: inputs.stats_match}}}}
    - {tool: valkey-check-rdb, args: [dump.rdb, --stats, --output, stats.out, --format,
        {$ref: inputs.format}], expect_difference: true, expect: {exit: {equals: 0}}}
required_evidence:
- {evidence_id: valkey.tool.runs, source: check-rdb}
