extends: [valkey.liveness]
id: proposed.forkless-sync-progress-compare
deployment:
  modes: [standalone]
metadata:
  description: During a forkless diskless full sync, INFO reports current_save_keys_total,
    a non-negative forkless_estimated_seconds_remaining, and nonzero forkless debug
    progress; the parent reports 0 / -1 / 0
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: forkless-sync-info
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 90
    server_config:
      forkless-infrastructure-enabled: "yes"
      forkless-policy: prefer-forkless
      repl-diskless-sync: "yes"
      repl-diskless-sync-delay: 0
      enable-debug-command: "yes"
    commands:
    - {command: [DEBUG, POPULATE, "10000"], node: 0, expect: {equals: OK}}
    - {command: [CONFIG, SET, rdb-key-save-delay, "1500"], node: 0, expect: {equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [EVAL, "local i=redis.call('INFO','persistence') if string.match(i,'rdb_bgsave_in_progress:1')\
          \ then return 1 else return 0 end", "0"], node: 0, wait_s: 20, expect: {
        equals: 1}}
    - {command: [EVAL, "local i=redis.call('INFO','persistence') local p=string.match(i,'current_save_keys_processed:(%d+)')\
          \ if p and tonumber(p)>0 then return 1 else return 0 end", "0"], node: 0,
      wait_s: 20, expect: {equals: 1}}
    - {command: [EVAL, "local i=redis.call('INFO','persistence') local t=string.match(i,'current_save_keys_total:(%d+)')\
          \ return tonumber(t)", "0"], node: 0, expect_difference: true, expect: {
        equals: 10000}}
    - {command: [EVAL, "local i=redis.call('INFO','persistence') local e=string.match(i,'forkless_estimated_seconds_remaining:(%-?%d+)')\
          \ if e and tonumber(e)>=0 then return 1 else return 0 end", "0"], node: 0,
      expect_difference: true, expect: {equals: 1}}
    - {command: [EVAL, "local i=redis.call('INFO','debug') local p=string.match(i,'forkless_dbentries_processed:(%d+)')\
          \ if p and tonumber(p)>0 then return 1 else return 0 end", "0"], node: 0,
      expect_difference: true, expect: {equals: 1}}
    - {command: [CONFIG, SET, rdb-key-save-delay, "0"], node: 0, expect: {equals: OK}}
    - {command: [EVAL, "local i=redis.call('INFO','replication') if string.match(i,'master_link_status:up')\
          \ then return 1 else return 0 end", "0"], node: 1, wait_s: 60, expect: {
        equals: 1}}
    - {command: [DBSIZE], node: 1, expect: {equals: 10000}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [forkless-sync-info.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: forkless-sync-info}
