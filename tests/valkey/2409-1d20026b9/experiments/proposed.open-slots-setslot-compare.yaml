extends: [valkey.liveness]
id: proposed.open-slots-setslot-compare
deployment:
  modes: [standalone]
metadata:
  description: CLUSTER SETSLOT MIGRATING/IMPORTING/STABLE/NODE lifecycle on boundary
    slots 0 and 16383 with ASK/MOVED redirects, compared across builds after the open-slots
    dict rewrite
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: setslot
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - {command: [SET, foo, v1], expect: {equals: OK}}
    - {command: [CLUSTER, SETSLOT, 0, MIGRATING, "<node.1.id>"], expect: {equals: OK}}
    - {command: [CLUSTER, SETSLOT, 16383, MIGRATING, "<node.1.id>"], expect: {equals: OK}}
    - {command: [CLUSTER, SETSLOT, 12182, MIGRATING, "<node.1.id>"], expect: {equals: OK}}
    - {command: [CLUSTER, SETSLOT, 0, IMPORTING, "<node.0.id>"], node: 1, expect: {
        equals: OK}}
    - {command: [CLUSTER, SETSLOT, 16383, IMPORTING, "<node.0.id>"], node: 1, expect: {
        equals: OK}}
    - {command: [CLUSTER, SETSLOT, 12182, IMPORTING, "<node.0.id>"], node: 1, expect: {
        equals: OK}}
    - {command: [CLUSTER, NODES], compare: skip, expect: {contains: "[0->-"}}
    - {command: [CLUSTER, NODES], compare: skip, expect: {contains: "[16383->-"}}
    - {command: [CLUSTER, NODES], node: 1, compare: skip, expect: {contains: "[0-<-"}}
    - {command: [CLUSTER, NODES], node: 1, compare: skip, expect: {contains: "[16383-<-"}}
    - {command: [GET, foo], expect: {equals: v1}}
    - {command: [GET, "{foo}missing"], compare: skip, expect: {error: "ASK 12182"}}
    - {command: [GET, "{foo}missing"], node: 1, compare: skip, expect: {error: "MOVED\
          \ 12182"}}
    - {command: [ASKING], node: 1, expect: {equals: OK}}
    - {command: [GET, "{foo}missing"], node: 1, expect: {exists: false}}
    - {command: [CLUSTER, COUNTKEYSINSLOT, 12182], expect: {equals: 1}}
    - {command: [CLUSTER, SETSLOT, 0, STABLE], expect: {equals: OK}}
    - {command: [CLUSTER, SETSLOT, 0, STABLE], node: 1, expect: {equals: OK}}
    - {command: [CLUSTER, SETSLOT, 12182, STABLE], expect: {equals: OK}}
    - {command: [CLUSTER, SETSLOT, 12182, STABLE], node: 1, expect: {equals: OK}}
    - {command: [GET, "{foo}missing"], expect: {exists: false}}
    - {command: [CLUSTER, SETSLOT, 16383, NODE, "<node.1.id>"], node: 1, expect: {
        equals: OK}}
    - {command: [CLUSTER, SETSLOT, 16383, NODE, "<node.1.id>"], expect: {equals: OK}}
    - {command: [CLUSTER, COUNTKEYSINSLOT, 16383], node: 1, expect: {equals: 0}}
    - {command: [CLUSTER, SLOTS], node: 1}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [setslot.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: setslot}
