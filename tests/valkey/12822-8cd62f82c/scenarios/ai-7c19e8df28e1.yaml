scenario_id: ai-7c19e8df28e1
seed: 7200
experiment:
  id: valkey.cluster-chaos
  inputs:
    keys_per_slot: 20
    command_rate: 2000
    waves:
    - - op: kill
        target: replica
        signal: SIGKILL
      - op: failover
