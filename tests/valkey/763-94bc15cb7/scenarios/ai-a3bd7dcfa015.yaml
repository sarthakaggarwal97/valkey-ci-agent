scenario_id: ai-a3bd7dcfa015
seed: 104
experiment:
  id: valkey.replication-chaos
  inputs:
    mutation_rate: 500
    mutable_keys: 100
    stable_keys: 500
    value_size: 512
    command_rate: 200
    waves:
    - - op: kill
        target: replica
        delay_s: 0.5
      - op: restart
        target: killed
        delay_s: 1.5
