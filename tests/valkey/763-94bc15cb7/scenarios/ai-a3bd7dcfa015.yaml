        target: primary
        signal: SIGKILL
        delay_s: 0.5
deployment:
  mode: standalone
  replicas_per_primary: 3
  base_port: 7300
  server_config:
    io-threads: 2
    io-threads-do-reads: 'yes'
    events-per-io-thread: 0
