extends: [valkey.liveness]
id: proposed.rdb-hfe-bad-expiry-restore
deployment:
  modes: [standalone]
metadata:
  description: RESTORE of a HASH_2 payload whose field expiry is < -1 must free field,
    value and the partial object (no leak)
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: restore
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    timeout_s: 15
    commands:
    - {command: [DEBUG, set-skip-checksum-validation, "1"], expect: {equals: OK}}
    - {command: [RESTORE, h, "0", !!binary "FgEBZgF2/v///////1AAAAAAAAAAAAAA"], expect: {
        error: "Bad data format"}}
    - {command: [EXISTS, h], expect: {equals: 0}}
    - {command: [PING], expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [restore.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: restore}
