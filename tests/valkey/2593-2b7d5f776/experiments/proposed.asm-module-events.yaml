extends: [valkey.liveness]
id: proposed.asm-module-events
deployment:
  modes: [standalone]
metadata:
  description: Atomic slot migration fires the new module server events (start, complete,
    abort on source and target) with the right node IDs, job name consistency and
    slot ranges; the parent build fires none
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: asm-events
  config:
    compare_with: {$ref: artifacts.parent.binary}
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    cluster: true
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 15
    commands:
    - {command: [SET, foo, v1], expect: {equals: OK}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 12182, 12182, NODE, <node.1.id>],
      expect: {equals: OK}}
    - {command: [hooks.event_last, atomic-slot-migration-export-start-slotranges],
      expect_difference: true, expect: {equals: 12182-12182}}
    - {command: [hooks.event_last, atomic-slot-migration-export-start-target], expect_difference: true,
      expect: {equals: <node.1.id>}}
    - {command: [GET, foo], node: 1, wait_s: 30, expect: {equals: v1}}
    - {command: [hooks.event_last, atomic-slot-migration-import-complete-source],
      node: 1, expect_difference: true, expect: {equals: <node.0.id>}}
    - {command: [hooks.event_last, atomic-slot-migration-import-complete-slotranges],
      node: 1, expect_difference: true, expect: {equals: 12182-12182}}
    - {command: [hooks.event_last, atomic-slot-migration-export-complete-target],
      node: 0, wait_s: 10, expect_difference: true, expect: {equals: <node.1.id>}}
    - {command: [DEBUG, SLOTMIGRATION, PREVENT-PAUSE, 1], expect: {equals: OK}}
    - {command: [SET, bar, v2], expect: {equals: OK}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 5061, 5061, NODE, <node.1.id>],
      expect: {equals: OK}}
    - {command: [hooks.event_last, atomic-slot-migration-import-start-slotranges],
      node: 1, wait_s: 10, expect_difference: true, expect: {equals: 5061-5061}}
    - {command: [CLUSTER, CANCELSLOTMIGRATIONS], expect: {equals: OK}}
    - {command: [hooks.event_last, atomic-slot-migration-export-abort-slotranges],
      wait_s: 10, expect_difference: true, expect: {equals: 5061-5061}}
    - {command: [hooks.event_last, atomic-slot-migration-import-abort-slotranges],
      node: 1, wait_s: 10, expect_difference: true, expect: {equals: 5061-5061}}
    - {command: [GET, bar], expect: {equals: v2}}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], expect_difference: true, expect: {contains: target_node}}
    checks:
      acl: true
      compat: true
      variants: true
required_events: [asm-events.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: asm-events}
