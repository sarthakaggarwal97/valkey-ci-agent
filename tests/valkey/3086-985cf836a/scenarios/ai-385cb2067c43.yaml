scenario_id: ai-385cb2067c43
seed: 104
experiment:
  id: valkey.cluster-chaos
  inputs:
    command_rate: 2000
    keys_per_slot: 10
    waves:
    - - op: kill
        target: replica
        signal: SIGKILL
      - op: failover
        shard: 0
        delay_s: 1.0
