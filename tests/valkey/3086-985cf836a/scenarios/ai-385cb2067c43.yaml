    cluster-slot-stats-enabled: 'yes'
    commandlog-request-larger-than: -1
    io-threads: 4
    min-io-threads-avoid-copy-reply: 2
    min-string-size-avoid-copy-reply: 1
    min-string-size-avoid-copy-reply-threaded: 1
