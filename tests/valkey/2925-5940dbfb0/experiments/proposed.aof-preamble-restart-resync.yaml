extends: [valkey.liveness]
id: proposed.aof-preamble-restart-resync
deployment:
  modes: [standalone]
metadata:
  description: >
    After the revert of partial sync after loading an AOF with RDB preamble, a replica
    restarted from its AOF must full sync (the parent partial syncs), and a primary
    restarted from its AOF must come back with no replid2/second_repl_offset and offset
    0 (the parent restores them and its replica partial syncs).
inputs:
  properties:
    dual_channel: {type: string, enum: ["yes", "no"], default: "no"}
components:
- use: valkey.action.commands
  id: aof-restart
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    server_config:
      appendonly: "yes"
      aof-use-rdb-preamble: "yes"
      repl-ping-replica-period: 10000
      dual-channel-replication-enabled: {$ref: inputs.dual_channel}
    timeout_s: 240
    commands:
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [CONFIG, REWRITE], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [SET, k0, v0], expect: {equals: OK}}
    - {command: [SET, k1, v1], expect: {equals: OK}}
    - {command: [SET, k2, v2], expect: {equals: OK}}
    - {command: [SET, k3, v3], expect: {equals: OK}}
    - {command: [SET, k4, v4], expect: {equals: OK}}
    - {command: [SET, k5, v5], expect: {equals: OK}}
    - {command: [SET, k6, v6], expect: {equals: OK}}
    - {command: [SET, k7, v7], expect: {equals: OK}}
    - {command: [SET, k8, v8], expect: {equals: OK}}
    - {command: [SET, k9, v9], expect: {equals: OK}}
    - {command: [GET, k9], node: 1, wait_s: 30, expect: {equals: v9}}
    - {command: [BGREWRITEAOF], node: 1, expect: {contains: rewriting}}
    - {command: [INFO, persistence], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "aof_rewrite_in_progress:0"}}
    - {restart: true, node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 60, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [INFO, stats], node: 0, expect_difference: true, expect: {contains: "sync_full:2"}}
    - {command: [DBSIZE], node: 1, expect: {equals: 10}}
    - {command: [BGREWRITEAOF], node: 0, expect: {contains: rewriting}}
    - {command: [INFO, persistence], node: 0, wait_s: 30, compare: skip, expect: {
        contains: "aof_rewrite_in_progress:0"}}
    - {restart: true, node: 0, expect: {equals: OK}}
    - {command: [INFO, replication], node: 0, expect_difference: true, expect: {contains: "master_replid2:0000000000000000000000000000000000000000"}}
    - {command: [INFO, replication], node: 0, expect_difference: true, expect: {contains: "second_repl_offset:-1"}}
    - {command: [INFO, replication], node: 0, expect_difference: true, expect: {contains: "master_repl_offset:0"}}
    - {command: [INFO, replication], node: 1, wait_s: 60, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [INFO, stats], node: 0, expect_difference: true, expect: {contains: "sync_full:1"}}
    - {command: [SET, after, restartedok], node: 0, expect: {equals: OK}}
    - {command: [GET, after], node: 1, wait_s: 30, expect: {equals: restartedok}}
    - {command: [DBSIZE], node: 1, expect: {equals: 11}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [aof-restart.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: aof-restart}
