extends: [valkey.liveness]
id: proposed.rdb-replica-restart-cached-primary
deployment:
  modes: [standalone]
metadata:
  description: A replica restarted from an RDB holding replication info restores replid/offset,
    caches its primary and partial-resyncs (loadDataFromDisk replica branch)
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: replica-restart
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    nodes: 2
    timeout_s: 120
    server_config:
      appendonly: "no"
      repl-ping-replica-period: 10000
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [SET, k1, v1], node: 0, expect: {equals: OK}}
    - {command: [SET, k2, v2], node: 0, expect: {equals: OK}}
    - {command: [WAIT, 1, 10000], node: 0, expect: {equals: 1}}
    - {command: [CONFIG, REWRITE], node: 1, expect: {equals: OK}}
    - {command: [SAVE], node: 1, expect: {equals: OK}}
    - {restart: true, node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 60, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [GET, k2], node: 1, expect: {equals: v2}}
    - {command: [INFO, stats], node: 0, wait_s: 30, compare: skip, expect: {contains: "sync_partial_ok:1"}}
    - {command: [INFO, stats], node: 0, compare: skip, expect: {contains: "sync_full:1"}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [replica-restart.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: replica-restart}
