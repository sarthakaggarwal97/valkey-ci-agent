extends: [valkey.liveness]
id: proposed.client-reply-no-multi
deployment:
  modes: [standalone]
metadata:
  description: >-
    CLIENT REPLY inside MULTI is rejected with the generic NO_MULTI error and, unlike
    before, poisons the transaction so EXEC aborts with EXECABORT and queued commands
    never run.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: seq
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    timeout_s: 10
    commands:
    - {command: [MULTI], expect: {equals: OK}}
    - {command: [SET, k1, v1], expect: {equals: QUEUED}}
    - {command: [CLIENT, REPLY, ON], expect_difference: true, expect: {error: "not\
          \ allowed inside a transaction"}}
    - {command: [SET, k2, v2], expect: {equals: QUEUED}}
    - {command: [EXEC], expect_difference: true, expect: {error: "EXECABORT"}}
    - {command: [GET, k1], expect_difference: true, expect: {exists: false}}
    - {command: [GET, k2], expect_difference: true, expect: {exists: false}}
    - {command: [MULTI], expect: {equals: OK}}
    - {command: [CLIENT, REPLY, SKIP], expect_difference: true, expect: {error: "not\
          \ allowed inside a transaction"}}
    - {command: [EXEC], expect_difference: true, expect: {error: "EXECABORT"}}
    - {command: [MULTI], expect: {equals: OK}}
    - {command: [CLIENT, REPLY, OFF], expect_difference: true, expect: {error: "not\
          \ allowed inside a transaction"}}
    - {command: [EXEC], expect_difference: true, expect: {error: "EXECABORT"}}
    - {command: [MULTI], expect: {equals: OK}}
    - {command: [SET, k3, v3], expect: {equals: QUEUED}}
    - {command: [CLIENT, REPLY, ON], expect_difference: true, expect: {error: "not\
          \ allowed inside a transaction"}}
    - {command: [DISCARD], expect: {equals: OK}}
    - {command: [GET, k3], expect: {exists: false}}
    - {command: [SET, k4, v4], expect: {equals: OK}}
    - {command: [GET, k4], expect: {equals: v4}}
    - {command: [MULTI], expect: {equals: OK}}
    - {command: [client, reply, on], expect_difference: true, expect: {error: "not\
          \ allowed inside a transaction"}}
    - {command: [RESET], expect: {equals: RESET}}
    - {command: [CLIENT, REPLY, ON], expect: {equals: OK}}
    - {command: [EXEC], expect: {error: "without MULTI"}}
    - {command: [MULTI], expect: {equals: OK}}
    - {command: [SET, k5, v5], expect: {equals: QUEUED}}
    - {command: [EXEC], expect: {equals: [OK]}}
    - {command: [GET, k5], expect: {equals: v5}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [seq.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: seq}
