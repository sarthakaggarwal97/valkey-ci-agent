extends: [valkey.liveness]
id: proposed.debug-reload-loadaof-blocked-during-sync-load
deployment:
  modes: [standalone]
metadata:
  description: DEBUG RELOAD and DEBUG LOADAOF are rejected while a replica is loading
    an RDB from a full sync
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: load
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 60
    server_config:
      repl-diskless-sync: "no"
      repl-diskless-load: disabled
      save: ""
      appendonly: "no"
    commands:
    - {command: [CONFIG, SET, rdbcompression, "no"], node: 0, expect: {equals: OK}}
    - {command: [DEBUG, POPULATE, 20000, seed, 400], node: 0, expect: {equals: OK}}
    - {command: [CONFIG, SET, key-load-delay, 2000], node: 1, expect: {equals: OK}}
    - {command: [CONFIG, SET, loading-process-events-interval-bytes, 1024], node: 1,
      expect: {equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [GET, nosuchkey], node: 1, connection: probe, wait_s: 30, expect: {
        error: "LOADING"}}
    - {raw: "DEBUG RELOAD\r\n", node: 1, connection: probe, expect_difference: true,
      expect: {error: "LOADING"}}
    - {command: [DEBUG, LOADAOF], node: 1, connection: probe, expect_difference: true,
      expect: {error: "LOADING"}}
    - {command: [CONFIG, SET, key-load-delay, 0], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 40, expect: {contains: "master_link_status:up"},
      compare: skip}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [load.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: load}
