extends: [valkey.liveness]
id: proposed.debug-loadaof-disk-loading
metadata:
  description: DEBUG LOADAOF while a replica is loading an RDB from a disk-based full
    sync must return -LOADING instead of reentrantly flushing/emptying/loading mid-load
deployment:
  modes: [standalone]
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: seq
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    nodes: 2
    timeout_s: 120
    server_config:
      repl-diskless-sync: "no"
      repl-diskless-sync-delay: "0"
      repl-diskless-load: "disabled"
      key-load-delay: 700
    commands:
    - {command: [DEBUG, POPULATE, 60000], node: 0, expect: {equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, persistence], node: 1, compare: skip, wait_s: 90, expect: {
        contains: "loading:1"}}
    - {command: [DEBUG, LOADAOF], node: 1, expect_difference: true, expect: {error: "loading\
          \ the dataset in memory"}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [seq.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: seq}
