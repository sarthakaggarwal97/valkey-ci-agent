extends: [valkey.liveness]
id: proposed.debug-populate-blocked-while-loading
metadata:
  description: DEBUG POPULATE on a replica loading a full-resync RDB returns -LOADING
    on the change build, where the parent still populates the half-loaded dataset
deployment:
  modes: [standalone]
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    repl_diskless_sync: {type: string, enum: ["yes", "no"], default: "no"}
    repl_diskless_load: {type: string, enum: [disabled, on-empty-db, swapdb], default: disabled}
components:
- use: valkey.action.commands
  id: seq
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    nodes: 2
    timeout_s: 60
    server_config:
      repl-diskless-sync: {$ref: inputs.repl_diskless_sync}
      repl-diskless-sync-delay: "0"
      repl-diskless-load: {$ref: inputs.repl_diskless_load}
      key-load-delay: "40000"
    commands:
    - {command: [DEBUG, POPULATE, 300], node: 0, expect: {equals: OK}}
    - {command: [SET, gate, v], node: 0, expect: {equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [GET, gate], node: 1, wait_s: 45, expect: {error: "LOADING"}}
    - {command: [DEBUG, POPULATE, 1], node: 1, expect_difference: true, expect: {
        error: "LOADING"}}
    - {command: [PING], node: 1, wait_s: 45, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [seq.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: seq}
