extends: [valkey.liveness]
id: proposed.debug-populate-loading-resync
deployment:
  modes: [standalone]
metadata:
  description: DEBUG POPULATE sent to a replica mid-resync is rejected with -LOADING
    on the change, while the parent still populates keys during the load
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    diskless_load: {type: string, enum: [swapdb, disabled], default: disabled}
    diskless_sync: {type: string, enum: ["yes", "no"], default: "no"}
components:
- use: valkey.action.commands
  id: populate-while-loading
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 20
    server_config:
      key-load-delay: 25000
      loading-process-events-interval-bytes: 1024
      repl-diskless-sync: {$ref: inputs.diskless_sync}
      repl-diskless-sync-delay: 0
      repl-diskless-load: {$ref: inputs.diskless_load}
    commands:
    - {command: [DEBUG, POPULATE, 8000, loadkey, 128], node: 0, expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [DEBUG, POPULATE, 100, injected, 16], node: 1, wait_s: 30, expect_difference: true,
      expect: {error: "LOADING"}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [populate-while-loading.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: populate-while-loading}
