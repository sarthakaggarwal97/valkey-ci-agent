extends: [valkey.liveness]
id: proposed.cluster-reset-soft-replica-shard-id
deployment:
  modes: [standalone]
metadata:
  description: A replica that runs CLUSTER RESET SOFT must leave its primary's shard
    and form a shard of its own, visible to itself and every other node, surviving
    a restart, and merging back cleanly when it replicates again
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    lazyfree_user_flush: {type: string, enum: ["yes", "no"], default: "no"}
components:
- use: valkey.action.commands
  id: reset-soft
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 3
    resp: {$ref: inputs.resp}
    server_config: {lazyfree-lazy-user-flush: {$ref: inputs.lazyfree_user_flush}}
    timeout_s: 60
    commands:
    - {command: [SET, k1, v1], node: 0, expect: {equals: OK}}
    - {command: [SET, k2, v2], node: 0, expect: {equals: OK}}
    - {command: [SET, k3, v3], node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, REPLICATE, "<node.0.id>"], node: 1, wait_s: 30, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [DBSIZE], node: 1, wait_s: 30, expect: {equals: 3}}
    - {command: [EVAL, "return #redis.call('cluster','shards')", 0], node: 0, wait_s: 30,
      expect: {equals: 2}}
    - {command: [CLUSTER, MYSHARDID], node: 1, compare: skip}
    - {command: [CLUSTER, RESET, SOFT], node: 1, expect: {equals: OK}}
    - {command: [DBSIZE], node: 1, wait_s: 30, expect: {equals: 0}}
    - {command: [CLUSTER, MYSHARDID], node: 1, compare: skip}
    - {command: [EVAL, "return #redis.call('cluster','shards')", 0], node: 0, wait_s: 15,
      expect_difference: true, expect: {equals: 3}}
    - {command: [EVAL, "return #redis.call('cluster','shards')", 0], node: 2, wait_s: 15,
      expect_difference: true, expect: {equals: 3}}
    - {command: [CLUSTER, MEET, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [EVAL, "return #redis.call('cluster','shards')", 0], node: 1, wait_s: 15,
      expect_difference: true, expect: {equals: 3}}
    - {restart: true, node: 1, expect: {equals: OK}}
    - {command: [EVAL, "return #redis.call('cluster','shards')", 0], node: 1, wait_s: 15,
      expect_difference: true, expect: {equals: 3}}
    - {command: [EVAL, "return #redis.call('cluster','shards')", 0], node: 0, wait_s: 15,
      expect_difference: true, expect: {equals: 3}}
    - {command: [CLUSTER, REPLICATE, "<node.0.id>"], node: 1, wait_s: 30, expect: {
        equals: OK}}
    - {command: [EVAL, "return #redis.call('cluster','shards')", 0], node: 0, wait_s: 30,
      expect: {equals: 2}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [reset-soft.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: reset-soft}
