extends: [valkey.base]
id: proposed.cluster-link-accept-storm
deployment:
  modes: [cluster]
  replicas_per_primary: {minimum: 1}
metadata:
  description: SIGKILL a cluster node and restart it so every peer reconnects at once;
    throttled cluster bus accepts must still bring all links back up with no acknowledged
    write lost
inputs:
  properties:
    target: {type: string, enum: [replica, primary], default: replica}
    signal: {type: string, enum: [SIGKILL, SIGTERM], default: SIGKILL}
    settle_s: {type: number, minimum: 1, maximum: 60, default: 10}
components:
- use: valkey.fault.process-signal
  id: kill-node
  config:
    when_event: warm-up.completed
    instance: {$ref: inputs.target}
    signal: {$ref: inputs.signal}
    restart_mode: immediate
- use: valkey.action.sleep
  id: warm-up
  depends_on: [writes, kill-node]
  config: {seconds: 2}
- use: valkey.action.sleep
  id: settle
  depends_on: [warm-up]
  config: {seconds: {$ref: inputs.settle_s}}
- use: valkey.oracle.ledger
  id: data
  config: {workload: writes, loss_window_s: 2.5}
required_events: [warm-up.completed, kill-node.recovered]
required_evidence:
- {evidence_id: valkey.fault.injected, source: kill-node}
