extends: [valkey.liveness]
id: proposed.setslot-multi-no-block
deployment:
  modes: [standalone, cluster]
metadata:
  description: CLUSTER SETSLOT MIGRATING inside MULTI/EXEC on a primary that has an
    online replica must return, not crash on an assertion
inputs:
  required: [parent]
  properties:
    parent:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "The parent commit's build, {$ref: artifacts.parent.binary}"
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: setslot
  config:
    compare_with: {$ref: inputs.parent}
    cluster: true
    nodes: 3
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - {command: [CLUSTER, REPLICATE, "<node.0.id>"], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 0, wait_s: 45, compare: skip, expect: {
        contains: "state=online"}}
    - {command: [MULTI], node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, SETSLOT, 609, MIGRATING, "<node.2.id>"], node: 0, expect: {
        equals: QUEUED}}
    - {command: [EXEC], node: 0, expect_difference: true, expect: {equals: [OK]}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_evidence:
- {evidence_id: valkey.command.sequence, source: setslot}
