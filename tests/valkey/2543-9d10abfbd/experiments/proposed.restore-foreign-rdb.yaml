extends: [valkey.liveness]
id: proposed.restore-foreign-rdb
deployment:
  modes: [standalone]
metadata:
  description: RESTORE of foreign-version DUMP payloads under rdb-version-check relaxed
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: restore
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server_config: {rdb-version-check: relaxed}
    resp: {$ref: inputs.resp}
    timeout_s: 10
    commands:
    - {command: [DEBUG, SET-SKIP-CHECKSUM-VALIDATION, "1"], expect: {equals: OK}}
    - {command: [RESTORE, kstr, "0", !!binary "AAVoZWxsbwwAAAAAAAAAAAA="], expect_difference: true,
      expect: {equals: OK}}
    - {command: [GET, kstr], expect_difference: true, expect: {equals: hello}}
    - {command: [RESTORE, kbad, "0", !!binary "FgwAAAAAAAAAAAA="], expect_difference: true,
      expect: {error: "Unsupported foreign data type"}}
    - {command: [EXISTS, kbad], expect: {equals: 0}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_evidence:
- {evidence_id: valkey.command.sequence, source: restore}
