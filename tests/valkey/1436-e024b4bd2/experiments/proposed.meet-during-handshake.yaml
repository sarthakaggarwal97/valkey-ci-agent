extends: [valkey.liveness]
id: proposed.meet-during-handshake
deployment:
  modes: [standalone, cluster]
metadata:
  description: A duplicate MEET on a link whose node is already in handshake state
    is dropped, not asserted on
inputs:
  required: [parent]
  properties:
    parent:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "The parent commit's build, {$ref: artifacts.parent.binary}"
    node_timeout:
      type: integer
      default: 1000
      description: cluster-node-timeout on both private nodes; also the handshake-timeout
        re-MEET cadence
components:
- use: valkey.action.commands
  id: meet
  config:
    compare_with: {$ref: inputs.parent}
    cluster: true
    nodes: 2
    timeout_s: 60
    server_config: {cluster-node-timeout: {$ref: inputs.node_timeout}}
    commands:
    - {command: [CLUSTER, RESET, HARD], node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, RESET, HARD], node: 1, expect: {equals: OK}}
    - {command: [DEBUG, DROP-CLUSTER-PACKET-FILTER, 1], node: 0, expect: {equals: OK}}
    - {command: [DEBUG, DROP-CLUSTER-PACKET-FILTER, 1], node: 1, expect: {equals: OK}}
    - {command: [CLUSTER, MEET, "<node.0.host>", "<node.0.port>", "<node.0.cluster-port>"],
      node: 1, expect: {equals: OK}}
    - {command: [PING], node: 0, wait_s: 30, expect_difference: true, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [meet.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: meet}
