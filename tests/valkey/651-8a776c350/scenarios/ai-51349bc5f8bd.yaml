        shard: 1
        force: true
        timeout_s: 30
      - op: failover
        shard: 2
        timeout_s: 30
    - - op: failover
        shard: 0
        force: true
        timeout_s: 30
      - op: failover
        shard: 1
        timeout_s: 30
      - op: failover
        shard: 2
        force: true
        timeout_s: 30
    validation:
      blocking_on_failure: false
      stabilization_wait: 3.0
      validation_timeout: 30.0
      cluster_status_config:
        acceptable_states:
        - ok
        - unknown
      replication_config:
        max_acceptable_lag: 15.0
