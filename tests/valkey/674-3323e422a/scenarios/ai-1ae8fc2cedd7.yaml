# Checked with `valkey-fuzzer validate`; run it with `valkey-fuzzer run`.
scenario_id: ai-1ae8fc2cedd7
seed: 6744
experiment:
  id: valkey.cluster-chaos
  inputs:
    keys_per_slot: 10
    command_rate: 100
    waves:
    - - op: kill
        target: any
        signal: SIGKILL
      - op: failover
        shard: 0
        delay_s: 1.5
      - op: failover
        shard: 2
        force: true
        delay_s: 0.5
    - - op: failover
        shard: 1
        force: true
      - op: kill
        target: replica
        after: 0
        delay_s: 1
deployment:
  mode: cluster
  primaries: 3
  replicas_per_primary: 2
  base_port: 7300
  server_config:
    io-threads: 4
    io-threads-do-reads: 'yes'
    lazyfree-lazy-user-del: 'yes'
    lazyfree-lazy-expire: 'yes'
    lazyfree-lazy-server-del: 'yes'
    replica-lazy-flush: 'yes'
    maxmemory: 512mb
    maxmemory-policy: allkeys-lru
