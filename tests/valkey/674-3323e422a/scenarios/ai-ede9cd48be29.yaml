# Proposed by valkey-ci-agent for valkey-io/valkey 0cc16d029899..3323e422ad0c.
# Checked with `valkey-fuzzer validate`; run it with `valkey-fuzzer run`.
scenario_id: ai-ede9cd48be29
seed: 6743
experiment:
  id: valkey.replication-chaos
  inputs:
    mutation_rate: 1500
    mutable_keys: 500
    stable_keys: 500
    value_size: 16384
    command_rate: 100
    waves:
    - - op: kill
        target: replica
        signal: SIGKILL
      - op: restart
        target: killed
        delay_s: 1.0
    - - op: stall
        target: replica
        duration_s: 1.5
      - op: kill
        target: primary
        signal: SIGKILL
        delay_s: 0.5
    - - op: promote
        target: replica
        mode: graceful
      - op: backlog_pressure
        repl_backlog_size: 16384
        output_limit: 65536
        duration_s: 2.0
        delay_s: 0.2
deployment:
  mode: standalone
  replicas_per_primary: 2
  base_port: 7200
  server_config:
    io-threads: 4
    io-threads-do-reads: 'yes'
    lazyfree-lazy-user-del: 'yes'
    lazyfree-lazy-expire: 'yes'
    lazyfree-lazy-server-del: 'yes'
    replica-lazy-flush: 'yes'
    maxmemory: 512mb
    maxmemory-policy: allkeys-lru
