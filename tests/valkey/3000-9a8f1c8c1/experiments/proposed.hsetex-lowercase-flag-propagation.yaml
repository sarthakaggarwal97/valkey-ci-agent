extends: [valkey.liveness]
id: proposed.hsetex-lowercase-flag-propagation
deployment:
  modes: [standalone]
metadata:
  description: >-
    HSETEX with a lowercase NX/XX/FNX/FXX validation flag must strip that flag before
    propagating to replicas; the parent leaks it (strcmp vs strcasecmp) so a replica
    whose state differs re-evaluates the condition and drops the write. A second node
    is made a writable replica inside the sequence, its copy of three keys is diverged,
    then the primary runs HSETEX with lowercase xx/fxx/nx; reads on the replica differ
    between the two builds.
inputs:
  required: [parent]
  properties:
    parent:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "The parent commit's build, {$ref: artifacts.parent.binary}"
    resp: {type: integer, enum: [2, 3], default: 2}
    hash_max: {type: integer, default: 128}
components:
- use: valkey.action.commands
  id: hsetex
  config:
    compare_with: {$ref: inputs.parent}
    resp: {$ref: inputs.resp}
    nodes: 2
    timeout_s: 40
    server_config:
      replica-read-only: "no"
      hash-max-listpack-entries: {$ref: inputs.hash_max}
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 20, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [HSET, hxx, keep, v0], node: 0, expect: {equals: 1}}
    - {command: [HSET, hfxx, f2, orig, keep2, kv], node: 0, expect: {equals: 2}}
    - {command: [WAIT, 1, 3000], node: 0, expect: {equals: 1}}
    - {command: [DEL, hxx], node: 1, expect: {equals: 1}}
    - {command: [HDEL, hfxx, f2], node: 1, expect: {equals: 1}}
    - {command: [HSET, hnx, other, ov], node: 1, expect: {equals: 1}}
    - {command: [HSETEX, hxx, xx, PXAT, "99999999999999", FIELDS, 1, f1, v1], node: 0,
      expect: {equals: 1}}
    - {command: [HSETEX, hfxx, fxx, PXAT, "99999999999999", FIELDS, 1, f2, newv],
      node: 0, expect: {equals: 1}}
    - {command: [HSETEX, hnx, nx, PXAT, "99999999999999", FIELDS, 1, fa, va], node: 0,
      expect: {equals: 1}}
    - {command: [WAIT, 1, 3000], node: 0, expect: {equals: 1}}
    - {command: [HGET, hxx, f1], node: 1, expect_difference: true, expect: {equals: v1}}
    - {command: [HGET, hfxx, f2], node: 1, expect_difference: true, expect: {equals: newv}}
    - {command: [HGET, hnx, fa], node: 1, expect_difference: true, expect: {equals: va}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [hsetex.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: hsetex}
