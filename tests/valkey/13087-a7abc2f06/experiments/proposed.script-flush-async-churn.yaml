extends: [valkey.base]
id: proposed.script-flush-async-churn
deployment:
  modes: [standalone]
metadata:
  description: Cache more than 64 scripts and SCRIPT FLUSH in ASYNC, bare and SYNC
    modes repeatedly under the key-value workload; the change closes the old lua interpreter
    on the bio thread (ASYNC, dict > 64) or on the main thread with malloc_trim (SYNC)
    while new scripts run on the fresh interpreter, and the bio job must drain
components:
- use: valkey.action.commands
  id: flush-churn
  config:
    instances: primary
    timeout_s: 15
    commands:
