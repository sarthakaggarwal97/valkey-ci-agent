extends: [valkey.liveness]
id: proposed.geosearch-bypolygon-pole-centroid
deployment:
  modes: [standalone]
metadata:
  description: >-
    GEOSEARCH/GEOSEARCHSTORE BYPOLYGON whose vertex centroid falls outside the geohash
    latitude range (a pole, or near-pole) must fall back to the bounding-box center
    instead of searching with an uninitialized geohash, which silently drops members
    on the parent build.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: polygeo
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    timeout_s: 15
    commands:
    - {command: [GEOADD, points, 0, 45, a, 10, -20, b, 0, -60, c], expect: {equals: 3}}
    - {command: [GEOSEARCH, points, BYPOLYGON, 4, -20, -30, 20, -30, 20, 50, -20,
        50, ASC], expect: {equals: [b, a]}}
    - {command: [GEOSEARCH, points, BYPOLYGON, 4, -90, -30, 90, -30, 90, 85, -90,
        85, ASC], expect_difference: true, expect: {equals: [a, b]}}
    - {command: [GEOSEARCH, points, BYPOLYGON, 4, -90, -1, 90, -1, 90, -85, -90, -85,
        ASC], expect_difference: true, expect: {equals: [c, b]}}
    - {command: [GEOSEARCHSTORE, dest, points, BYPOLYGON, 4, -90, -30, 90, -30, 90,
        85, -90, 85], expect_difference: true, expect: {equals: 2}}
    - {command: [SORT, dest, ALPHA], expect_difference: true, expect: {equals: [a,
          b]}}
    - {command: [GEOADD, points, 0, 75, d], expect: {equals: 1}}
    - {command: [GEOSEARCH, points, BYPOLYGON, 4, -90, 70, 90, 70, 89, 85, -89, 85,
        ASC], expect_difference: true, expect: {equals: [d]}}
    - {command: [GEOSEARCH, points, FROMMEMBER, a, BYRADIUS, 100, km, ASC], expect: {
        equals: [a]}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [polygeo.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: polygeo}
