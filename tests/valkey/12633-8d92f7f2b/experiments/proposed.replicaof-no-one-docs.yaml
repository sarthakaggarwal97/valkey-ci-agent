extends: [valkey.liveness]
id: proposed.replicaof-no-one-docs
deployment:
  modes: [standalone]
metadata:
  description: >-
    COMMAND DOCS for REPLICAOF and SLAVEOF gains a oneof argument tree (host-port
    block | NO ONE pure-token block); REPLICAOF runtime behaviour (NO ONE, host/port,
    port range, arity, case-insensitivity) must be unchanged.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: docs
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    nodes: 2
    timeout_s: 60
    commands:
    - {command: [COMMAND, DOCS, REPLICAOF], expect_difference: true, expect: {contains: no-one}}
    - {command: [COMMAND, DOCS, SLAVEOF], expect_difference: true, expect: {contains: no-one}}
    - {command: [COMMAND, INFO, REPLICAOF], expect: {contains: replicaof}}
    - {command: [COMMAND, INFO, SLAVEOF], expect: {contains: slaveof}}
    - {command: [SET, k, v], expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [GET, k], node: 1, wait_s: 10, expect: {equals: v}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {contains: Already
          connected}}
    - {command: [REPLICAOF, NO, ONE], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 10, compare: skip, expect: {
        contains: "role:master"}}
    - {command: [SET, k2, v2], node: 1, expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [slaveof, no, one], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 10, compare: skip, expect: {
        contains: "role:master"}}
    - {command: [REPLICAOF, NO, 1], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, compare: skip, expect: {contains: "master_host:NO"}}
    - {command: [REPLICAOF, NO, ONE], node: 1, expect: {equals: OK}}
    - {command: [REPLICAOF, h, 65536], node: 1, expect: {error: Invalid master port}}
    - {command: [REPLICAOF, h, -1], node: 1, expect: {error: Invalid master port}}
    - {command: [REPLICAOF, h, 2147483648], node: 1, expect: {error: Invalid master
          port}}
    - {command: [REPLICAOF, NO], node: 1, expect: {error: wrong number of arguments}}
    - {command: [REPLICAOF, NO, ONE, extra], node: 1, expect: {error: wrong number
          of arguments}}
    - {command: [SLAVEOF], node: 1, expect: {error: wrong number of arguments}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [docs.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: docs}
