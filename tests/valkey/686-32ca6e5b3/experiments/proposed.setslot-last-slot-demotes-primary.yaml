extends: [valkey.liveness]
id: proposed.setslot-last-slot-demotes-primary
deployment:
  modes: [standalone]
metadata:
  description: A slot moved between two primaries that both have modern replicas,
    so every SETSLOT runs the blocked replication path on its node; moving the slot
    back takes the source's last slot inside the blocked SETSLOT and it demotes itself
    to a replica
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: moveback
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 4
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - {command: [CLUSTER, REPLICATE, "<node.0.id>"], node: 2, expect: {equals: OK}}
    - {command: [CLUSTER, REPLICATE, "<node.1.id>"], node: 3, expect: {equals: OK}}
    - {command: [INFO, replication], node: 2, compare: skip, wait_s: 30, expect: {
        contains: "master_link_status:up"}}
    - {command: [INFO, replication], node: 3, compare: skip, wait_s: 30, expect: {
        contains: "master_link_status:up"}}
    - {command: [INFO, replication], node: 0, compare: skip, wait_s: 30, expect: {
        contains: "connected_slaves:1"}}
    - {command: [INFO, replication], node: 1, compare: skip, wait_s: 30, expect: {
        contains: "connected_slaves:1"}}
    - {command: [CLUSTER, SETSLOT, "0", IMPORTING, "<node.0.id>"], node: 1, expect: {
        equals: OK}}
    - {command: [CLUSTER, SETSLOT, "0", MIGRATING, "<node.1.id>"], node: 0, expect: {
        equals: OK}}
    - {command: [CLUSTER, SETSLOT, "0", NODE, "<node.1.id>"], node: 1, expect: {equals: OK}}
    - {command: [CLUSTER, SETSLOT, "0", NODE, "<node.1.id>"], node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, SETSLOT, "0", IMPORTING, "<node.1.id>"], node: 0, expect: {
        equals: OK}}
    - {command: [CLUSTER, SETSLOT, "0", MIGRATING, "<node.0.id>"], node: 1, expect: {
        equals: OK}}
    - {command: [CLUSTER, SETSLOT, "0", NODE, "<node.0.id>"], node: 1, expect: {equals: OK}}
    - {command: [CLUSTER, SETSLOT, "0", NODE, "<node.0.id>"], node: 0, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, compare: skip, wait_s: 30, expect: {
        contains: "role:slave"}}
    - {command: [PING], node: 3, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [moveback.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: moveback}
