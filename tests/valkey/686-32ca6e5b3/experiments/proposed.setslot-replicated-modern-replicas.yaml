extends: [valkey.liveness]
id: proposed.setslot-replicated-modern-replicas
deployment:
  modes: [standalone]
metadata:
  description: CLUSTER SETSLOT on a primary whose replicas all report version >= 8.0.0
    takes the replicate-then-block path (forceCommandPropagation + blockClientForReplicaAck)
    for every SETSLOT arm, including a replica at the exact 8.0.0 version boundary
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: setslot
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 3
    resp: {$ref: inputs.resp}
    timeout_s: 60
    server_config: {repl-diskless-sync-delay: 0}
    commands:
    - {command: [CLUSTER, REPLICATE, "<node.0.id>"], node: 2, expect: {equals: OK}}
    - {command: [INFO, replication], node: 2, compare: skip, wait_s: 30, expect: {
        contains: "master_link_status:up"}}
    - {command: [INFO, replication], node: 0, compare: skip, wait_s: 30, expect: {
        contains: "connected_slaves:1"}}
    - {command: [CLUSTER, NODES], node: 0, compare: skip, wait_s: 30, expect: {contains: "slave"}}
    - {command: [REPLCONF, VERSION, "8.0.0"], node: 0, connection: fake, expect: {
        equals: OK}}
    - {command: [PSYNC, "?", "-1"], node: 0, connection: fake, compare: skip}
    - {command: [CLUSTER, SETSLOT, "5", MIGRATING, "<node.1.id>"], node: 0, expect: {
        equals: OK}}
    - {command: [CLUSTER, SETSLOT, "5", STABLE], node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, SETSLOT, "7", IMPORTING, "<node.0.id>"], node: 1, expect: {
        equals: OK}}
    - {command: [CLUSTER, SETSLOT, "7", MIGRATING, "<node.1.id>", TIMEOUT, "60000"],
      node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, SETSLOT, "7", NODE, "<node.1.id>"], node: 1, expect: {equals: OK}}
    - {command: [CLUSTER, SETSLOT, "7", NODE, "<node.1.id>", TIMEOUT, "0"], node: 0,
      expect: {equals: OK}}
    - {command: [CLUSTER, SLOTS], node: 0}
    - {command: [PING], node: 2, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [setslot.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: setslot}
