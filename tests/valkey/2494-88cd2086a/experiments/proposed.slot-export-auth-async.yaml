extends: [valkey.liveness]
id: proposed.slot-export-auth-async
deployment:
  modes: [standalone]
metadata:
  description: >-
    Slot export AUTH made asynchronous (SEND_AUTH/READ_AUTH_RESPONSE split): with
    the target's event loop stalled the job must park in the new reading-auth-response
    state instead of blocking the source, fail with the target's AUTH error in its
    status message, and a correctly authenticated migration must still complete end
    to end.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: auth-async
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 15
    commands:
    - {command: [SET, foo, v1], node: 0, expect: {equals: OK}}
    - {command: [CONFIG, SET, primaryauth, wrongpass], node: 0, expect: {equals: OK}}
    - {raw: "DEBUG SLEEP 2\r\n", connection: sleeper, node: 1}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 12182, 12182, NODE, <node.1.id>],
      node: 0, wait_s: 10, expect: {equals: OK}}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], node: 0, wait_s: 8, expect_difference: true,
      expect: {contains: reading-auth-response}}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], node: 0, wait_s: 30, compare: skip,
      expect: {contains: failed}}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], node: 0, expect_difference: true, expect: {
        contains: "Failed to AUTH to target node: -ERR"}}
    - {connection: sleeper, node: 1, read: true}
    - {command: [CONFIG, SET, requirepass, sekret], node: 1, expect: {equals: OK}}
    - {command: [CONFIG, SET, primaryauth, sekret], node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 12182, 12182, NODE, <node.1.id>],
      node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], node: 0, wait_s: 60, compare: skip,
      expect: {contains: success}}
    - {command: [GET, foo], node: 0, expect: {error: MOVED}}
    - {command: [GET, foo], node: 1, expect: {equals: v1}}
    - {command: [CONFIG, SET, requirepass, ""], node: 1, expect: {equals: OK}}
    - {command: [CONFIG, SET, primaryauth, ""], node: 0, expect: {equals: OK}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [auth-async.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: auth-async}
