extends: [valkey.base]
id: proposed.repl-throttle-stall
deployment:
  modes: [standalone]
  replicas_per_primary: {minimum: 1}
metadata:
  description: >-
    Stall a replica under writes with repl throttling enabled: the repl throttler
    must queue writing clients and the timer must release every one (throttlerTimeProc
    release path) with no crash, no hung client, and no acknowledged write lost.
inputs:
  properties:
    pause_s: {type: number, minimum: 0.5, maximum: 30, default: 3}
components:
- use: valkey.fault.process-signal
  id: stall-replica
  config:
    when_event: warm-up.completed
    instance: replica
    signal: SIGSTOP
    pause_s: {$ref: inputs.pause_s}
- use: valkey.action.sleep
  id: warm-up
  depends_on: [writes, stall-replica]
  config: {seconds: 1}
- use: valkey.action.poll
  id: throttled-clients
  depends_on: [warm-up]
  config:
    instances: primaries
    section: throttling
    field: total_throttled_commands
    predicate: {min: 1}
    timeout_s: 30
- use: valkey.action.poll
  id: throttle-released
  depends_on: [throttled-clients]
  config:
    instances: primaries
    section: throttling
    field: repl_throttle_rate
    predicate: {max: -1}
    timeout_s: 120
- use: valkey.action.sleep
  id: settle
  depends_on: [throttle-released]
  config: {seconds: 2}
- use: valkey.oracle.ledger
  id: data
  config: {workload: writes, converge_timeout_s: 120}
required_events: [warm-up.completed, stall-replica.injected]
required_evidence:
- {evidence_id: valkey.fault.injected, source: stall-replica}
- {evidence_id: valkey.poll.satisfied, source: throttled-clients}
- {evidence_id: valkey.poll.satisfied, source: throttle-released}
