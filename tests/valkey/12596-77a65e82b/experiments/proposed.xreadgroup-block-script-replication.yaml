extends: [valkey.liveness]
id: proposed.xreadgroup-block-script-replication
deployment:
  modes: [standalone]
metadata:
  description: XREADGROUP with BLOCK inside EVAL on a primary delivers to the consumer's
    PEL and the delivery replicates to a replica
components:
- use: valkey.action.commands
  id: script-repl
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 60
    commands:
    - {command: [XADD, s, 1-1, a, 1], node: 0, expect: {equals: 1-1}}
    - {command: [XGROUP, CREATE, s, g, "0"], node: 0, expect: {equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [SET, sync-probe, ready], node: 0, expect: {equals: OK}}
    - {command: [GET, sync-probe], node: 1, wait_s: 30, expect: {equals: ready}}
    - command:
      - EVAL
      - |
        local r = redis.pcall('xreadgroup','GROUP','g','consumer1','BLOCK','0','STREAMS',KEYS[1],'>')
        if r == false then return 'NIL' end
        if type(r) == 'table' and r.err then return 'ERR' end
        return 'ENTRIES:' .. #r[1][2]
      - "1"
      - s
      node: 0
      expect_difference: true
      expect: {equals: "ENTRIES:1"}
    - {command: [XPENDING, s, g], node: 0, expect_difference: true, expect: {contains: consumer1}}
    - {command: [XPENDING, s, g], node: 1, wait_s: 20, expect_difference: true, expect: {
        contains: consumer1}}
    - {command: [XACK, s, g, 1-1], node: 0, expect_difference: true, expect: {equals: 1}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [script-repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: script-repl}
