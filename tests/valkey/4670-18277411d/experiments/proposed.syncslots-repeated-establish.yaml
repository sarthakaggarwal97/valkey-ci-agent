extends: [valkey.liveness]
id: proposed.syncslots-repeated-establish
deployment:
  modes: [standalone, cluster]
metadata:
  description: A repeated CLUSTER SYNCSLOTS ESTABLISH on an already-established slot-import
    connection is rejected and the connection dropped
inputs:
  required: [parent]
  properties:
    parent:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "The parent commit's build, {$ref: artifacts.parent.binary}"
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: establish
  config:
    compare_with: {$ref: inputs.parent}
    cluster: true
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 20
    commands:
    - {command: [CLUSTER, SYNCSLOTS, ESTABLISH, SOURCE, "<node.0.id>", NAME, aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa,
        SLOTSRANGE, 16383, 16383], node: 1, connection: job, expect: {equals: OK}}
    - {command: [CLUSTER, SYNCSLOTS, ESTABLISH, SOURCE, "<node.0.id>", NAME, aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa,
        SLOTSRANGE, 10923, 10923], node: 1, connection: job, expect_difference: true,
      expect: {exists: false}}
    - {command: [PING], node: 1, expect: {equals: PONG}}
    - {command: [CLUSTER, INFO], node: 1, compare: skip}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_evidence:
- {evidence_id: valkey.command.sequence, source: establish}
