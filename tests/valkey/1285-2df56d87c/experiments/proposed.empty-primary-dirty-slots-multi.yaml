extends: [valkey.liveness]
id: proposed.empty-primary-dirty-slots-multi
deployment:
  modes: [standalone]
metadata:
  description: A primary that loses its last three slots at once to another shard
    must delete the dirty keys of every lost slot
components:
- use: valkey.action.commands
  id: dirty-slots
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 2
    timeout_s: 60
    commands:
    - {command: [CONFIG, SET, cluster-allow-replica-migration, no], node: 1, expect: {
        equals: OK}}
    - {command: [CLUSTER, BUMPEPOCH], node: 1, compare: skip, expect: {error: false}}
    - {command: [CLUSTER, SETSLOT, "0", NODE, "<node.1.id>"], node: 1, expect: {equals: OK}}
    - {command: [CLUSTER, SETSLOT, "5061", NODE, "<node.1.id>"], node: 1, expect: {
        equals: OK}}
    - {command: [CLUSTER, SETSLOT, "12182", NODE, "<node.1.id>"], node: 1, expect: {
        equals: OK}}
    - {command: [SET, key_977613, a], node: 1, wait_s: 30, expect: {equals: OK}}
    - {command: [SET, bar, b], node: 1, expect: {equals: OK}}
    - {command: [SET, foo, c], node: 1, expect: {equals: OK}}
    - {command: [DBSIZE], node: 1, expect: {equals: 3}}
    - {command: [GET, foo], node: 0, wait_s: 30, compare: skip, expect: {error: MOVED}}
    - {command: [CLUSTER, BUMPEPOCH], node: 0, compare: skip, expect: {error: false}}
    - {command: [CLUSTER, SETSLOT, "0", NODE, "<node.0.id>"], node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, SETSLOT, "5061", NODE, "<node.0.id>"], node: 0, expect: {
        equals: OK}}
    - {command: [CLUSTER, SETSLOT, "12182", NODE, "<node.0.id>"], node: 0, expect: {
        equals: OK}}
    - {command: [DBSIZE], node: 1, wait_s: 30, expect_difference: true, expect: {
        equals: 0}}
    - {command: [PING], node: 1, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [dirty-slots.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: dirty-slots}
