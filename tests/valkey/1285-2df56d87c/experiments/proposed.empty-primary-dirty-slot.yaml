extends: [valkey.liveness]
id: proposed.empty-primary-dirty-slot
deployment:
  modes: [standalone]
metadata:
  description: A primary that loses its last slot to another shard in a bad migration
    must delete the dirty keys it kept
components:
- use: valkey.action.commands
  id: dirty-slot
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 2
    timeout_s: 60
    commands:
    - {command: [CONFIG, SET, cluster-allow-replica-migration, no], node: 1, expect: {
        equals: OK}}
    - {command: [CLUSTER, BUMPEPOCH], node: 1, compare: skip, expect: {error: false}}
    - {command: [CLUSTER, SETSLOT, "0", NODE, "<node.1.id>"], node: 1, expect: {equals: OK}}
    - {command: [SET, key_977613, dirty], node: 1, wait_s: 30, expect: {equals: OK}}
    - {command: [SET, "{key_977613}:b", dirty2], node: 1, expect: {equals: OK}}
    - {command: [CLUSTER, COUNTKEYSINSLOT, "0"], node: 1, expect: {equals: 2}}
    - {command: [GET, key_977613], node: 0, wait_s: 30, compare: skip, expect: {error: MOVED}}
    - {command: [CLUSTER, BUMPEPOCH], node: 0, compare: skip, expect: {error: false}}
    - {command: [CLUSTER, SETSLOT, "0", NODE, "<node.0.id>"], node: 0, expect: {equals: OK}}
    - {command: [DBSIZE], node: 1, wait_s: 30, expect_difference: true, expect: {
        equals: 0}}
    - {command: [CLUSTER, COUNTKEYSINSLOT, "0"], node: 1, expect_difference: true,
      expect: {equals: 0}}
    - {command: [CLUSTER, GETKEYSINSLOT, "0", "10"], node: 1, expect_difference: true,
      compare: unordered, expect: {equals: []}}
    - {command: [PING], node: 1, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [dirty-slot.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: dirty-slot}
