extends: [valkey.liveness]
id: proposed.zset-listpack-update-replication
deployment:
  modes: [standalone]
metadata:
  description: Listpack zset score updates through the new in-place path propagate
    to a replica over streaming replication and survive a second full sync that serializes
    the mutated listpack into an RDB; replies compared against the parent build
components:
- use: valkey.action.commands
  id: repl
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: 2
    timeout_s: 90
    server_config: {zset-max-listpack-entries: 128, zset-max-listpack-value: 64}
    commands:
    - {command: [ZADD, z, 1, a, 2, b, 2, c, 3, d], expect: {equals: 4}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [ZADD, z, 2, a], expect: {equals: 0}}
    - {command: [ZADD, z, 0.5, d], expect: {equals: 0}}
    - {command: [ZINCRBY, z, 2.25, b], expect: {equals: "4.25"}}
    - {command: [ZADD, z, 1, c], expect: {equals: 0}}
    - {command: [ZRANGE, z, 0, -1, WITHSCORES], expect: {equals: [d, "0.5", c, "1",
          a, "2", b, "4.25"]}}
    - {command: [ZRANGE, z, 0, -1, WITHSCORES], node: 1, wait_s: 30, expect: {equals: [
          d, "0.5", c, "1", a, "2", b, "4.25"]}}
    - {command: [OBJECT, ENCODING, z], node: 1, compare: skip, expect: {equals: listpack}}
    - {command: [REPLICAOF, NO, ONE], node: 1, expect: {equals: OK}}
    - {command: [ZADD, z, 5, d], expect: {equals: 0}}
    - {command: [ZINCRBY, z, -4, b], expect: {equals: "0.25"}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [ZRANGE, z, 0, -1, WITHSCORES], node: 0, expect: {equals: [b, "0.25",
          c, "1", a, "2", d, "5"]}}
    - {command: [ZRANGE, z, 0, -1, WITHSCORES], node: 1, wait_s: 30, expect: {equals: [
          b, "0.25", c, "1", a, "2", d, "5"]}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
