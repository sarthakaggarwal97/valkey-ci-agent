extends: [valkey.liveness]
id: proposed.hash-expired-field-conversion-repl
deployment:
  modes: [standalone]
metadata:
  description: >-
    Listpack-to-hashtable conversion of a hash holding an expired-but-unreaped field,
    on a primary with a live replica. The replica applies the converting write under
    POLICY_IGNORE_EXPIRE and keeps the expired field, so a parent primary that drops
    it during conversion never propagates the deletion and HLEN diverges for the life
    of the link; the fixed primary carries it, the reaper deletes it, propagates HDEL,
    and both converge.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: repl
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    server_config: {hash-max-listpack-value: 64}
    timeout_s: 180
    commands:
    - {command: [DEBUG, SET-ACTIVE-EXPIRE, 0], node: 0, expect: {equals: OK}}
    - {command: [DEBUG, SET-ACTIVE-EXPIRE, 0], node: 1, expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [HSET, myhash, f1, v1, f2, v2, f4, v4], node: 0, expect: {equals: 3}}
    - {command: [HPEXPIRE, myhash, 1, FIELDS, 1, f1], node: 0, expect: {equals: [
          1]}}
    - {command: [HPEXPIRE, myhash, 100000, FIELDS, 1, f4], node: 0, expect: {equals: [
          1]}}
    - {command: [HEXISTS, myhash, f1], node: 0, wait_s: 5, expect: {equals: 0}}
    - {command: [HLEN, myhash], node: 0, expect: {equals: 3}}
    - {command: [HLEN, myhash], node: 1, wait_s: 10, expect: {equals: 3}}
    - {command: [HSET, myhash, f3, "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"],
      node: 0, expect: {equals: 1}}
    - {command: [OBJECT, ENCODING, myhash], node: 0, compare: skip, expect: {equals: hashtable}}
    - {command: [HLEN, myhash], node: 0, expect_difference: true, expect: {equals: 4}}
    - {command: [HLEN, myhash], node: 1, wait_s: 10, expect: {equals: 4}}
    - {command: [OBJECT, ENCODING, myhash], node: 1, compare: skip, expect: {equals: hashtable}}
    - {command: [DEBUG, SET-ACTIVE-EXPIRE, 1], node: 0, expect: {equals: OK}}
    - {command: [DEBUG, SET-ACTIVE-EXPIRE, 1], node: 1, expect: {equals: OK}}
    - {command: [HLEN, myhash], node: 0, wait_s: 15, expect: {equals: 3}, compare: skip}
    - {command: [HLEN, myhash], node: 1, wait_s: 15, expect_difference: true, expect: {
        equals: 3}}
    - {command: [HKEYS, myhash], node: 1, compare: unordered, expect: {equals: [f2,
          f3, f4]}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
