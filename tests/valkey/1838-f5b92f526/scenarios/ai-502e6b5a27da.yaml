scenario_id: ai-502e6b5a27da
seed: 202
experiment:
  id: valkey.replication-chaos
  inputs:
    mutation_rate: 800
    mutable_keys: 300
    stable_keys: 500
    value_size: 16384
    wait_replicas: 1
    waves:
