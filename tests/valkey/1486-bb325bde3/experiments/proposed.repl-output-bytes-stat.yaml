extends: [valkey.liveness]
id: proposed.repl-output-bytes-stat
deployment:
  modes: [standalone]
metadata:
  description: total_net_repl_output_bytes counts the command stream the primary writes
    to a replica after CONFIG RESETSTAT
components:
- use: valkey.action.commands
  id: stat
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 60
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [CONFIG, RESETSTAT], node: 0, expect: {equals: OK}}
    - {command: [SET, k, v], node: 0, expect: {equals: OK}}
    - {command: [GET, k], node: 1, wait_s: 30, expect: {equals: v}}
    - {command: [EVAL, "local i = redis.call('INFO','stats') local v = string.match(i,\
          \ 'total_net_repl_output_bytes:(%d+)') if tonumber(v) > 0 then return 1\
          \ else return 0 end", 0], node: 0, expect_difference: true, expect: {equals: 1}}
    - {command: [SET, k2, v2], node: 0, expect: {equals: OK}}
    - {command: [GET, k2], node: 1, wait_s: 30, expect: {equals: v2}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [stat.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: stat}
