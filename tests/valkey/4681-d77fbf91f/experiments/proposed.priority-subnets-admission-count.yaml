extends: [valkey.liveness]
id: proposed.priority-subnets-admission-count
deployment:
  modes: [standalone]
metadata:
  description: >-
    Admission-time priority counting (networking.c:2116-2119): a client admitted while
    its IP matches priority-subnets sets priority_source and increments connected_priority_clients;
    dynamic CONFIG SET priority-subnets no longer reclassifies existing clients, demotes
    the replication link, or recomputes the counter, and the counter decrements 1:1
    only for subnet-admitted clients.
components:
- use: valkey.action.commands
  id: seq
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    server_config: {maxclients-reserved: 100}
    timeout_s: 60
    commands:
    - {command: [CONFIG, SET, priority-subnets, 127.0.0.0/8], expect: {equals: OK}}
    - {command: [INFO, clients], expect_difference: true, expect: {contains: "connected_priority_clients:0"}}
    - {command: [PING], connection: prio, expect: {equals: PONG}}
    - {command: [INFO, clients], expect_difference: true, expect: {contains: "connected_priority_clients:1"}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [INFO, clients], expect_difference: true, expect: {contains: "connected_priority_clients:2"}}
    - {command: [CONFIG, SET, priority-subnets, 192.0.2.0/24], expect: {equals: OK}}
    - {command: [CLIENT, LIST, FLAGS, H], expect_difference: true, expect: {contains: "flags="}}
    - {command: [INFO, clients], expect_difference: true, expect: {contains: "connected_priority_clients:2"}}
    - {command: [REPLICAOF, NO, ONE], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 0, wait_s: 30, compare: skip, expect: {
        contains: "connected_slaves:0"}}
    - {command: [INFO, clients], expect_difference: true, expect: {contains: "connected_priority_clients:1"}}
    - {command: [QUIT], connection: prio, expect: {exists: false}}
    - {command: [INFO, clients], wait_s: 10, compare: skip, expect: {contains: "connected_priority_clients:0"}}
    - {command: [CONFIG, SET, priority-subnets, ""], expect: {equals: OK}}
    - {command: [PING], expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [seq.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: seq}
