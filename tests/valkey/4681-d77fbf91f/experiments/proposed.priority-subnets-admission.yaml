extends: [valkey.liveness]
id: proposed.priority-subnets-admission
deployment:
  modes: [standalone]
metadata:
  description: >-
    Dynamic CONFIG SET priority-subnets must not demote replica links or reclassify
    existing clients, and connected_priority_clients counts only subnet-admitted clients
    (issue #4674). On the parent, changing priority-subnets demotes the replica link
    (CLIENT LIST FLAGS H goes empty) and recomputes the counter over all clients.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: prio
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    nodes: 2
    timeout_s: 60
    commands:
    - {command: [SET, 'seed:k', v1], expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [CLIENT, LIST, FLAGS, H], node: 0, expect: {contains: "flags="}, compare: skip}
    - {command: [CONFIG, SET, priority-subnets, "127.0.0.1/32"], node: 0, expect: {
        equals: OK}}
    - {command: [INFO, clients], node: 0, expect_difference: true, expect: {contains: "connected_priority_clients:0"}}
    - {command: [PING], connection: c2, node: 0, expect: {equals: PONG}}
    - {command: [INFO, clients], node: 0, expect_difference: true, expect: {contains: "connected_priority_clients:1"}}
    - {command: [CONFIG, SET, priority-subnets, "192.0.2.0/24"], node: 0, expect: {
        equals: OK}}
    - {command: [CLIENT, LIST, FLAGS, H], node: 0, expect_difference: true, expect: {
        contains: "flags="}}
    - {command: [INFO, clients], node: 0, expect_difference: true, expect: {contains: "connected_priority_clients:1"}}
    - {command: [CONFIG, SET, priority-subnets, ""], node: 0, expect: {equals: OK}}
    - {command: [CLIENT, LIST, FLAGS, H], node: 0, expect_difference: true, expect: {
        contains: "flags="}}
    - {command: [GET, 'seed:k'], node: 1, expect: {equals: v1}}
    - {command: [QUIT], connection: c2, node: 0, expect: {equals: OK}}
    - {command: [INFO, clients], node: 0, wait_s: 10, expect: {contains: "connected_priority_clients:0"},
      compare: skip}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [prio.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: prio}
