extends: [valkey.liveness]
id: proposed.wait-in-script-woff
deployment:
  modes: [standalone]
metadata:
  description: WAIT and WAITAOF inside a script (EVAL and FCALL) use the calling client's
    write offset, not the fake client's zero, so a stalled replica is not counted
    as acknowledged
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: wait-script
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 15
    server_config: {appendonly: "yes", appendfsync: everysec}
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [INFO, replication], node: 0, wait_s: 30, expect: {contains: "state=online"},
      compare: skip}
    - {command: [FUNCTION, LOAD, "#!lua name=waitlib\nserver.register_function('waitfn',\
          \ function(keys, args) return server.call('wait', '2', '0') end)"], node: 0,
      expect: {equals: waitlib}}
    - {raw: "DEBUG SLEEP 8\r\n", node: 1, connection: stall}
    - {command: [SET, foo, bar], node: 0, expect: {equals: OK}}
    - {command: [WAITAOF, 1, 0, 0], node: 0, expect: {equals: [1, 0]}}
    - {command: [EVAL, "return server.call('wait', '2', '0')", 0], node: 0, expect_difference: true,
      expect: {equals: 0}}
    - {command: [EVAL, "return server.call('waitaof', '1', '2', '0')", 0], node: 0,
      expect_difference: true, expect: {equals: [1, 0]}}
    - {command: [FCALL, waitfn, 0], node: 0, expect_difference: true, expect: {equals: 0}}
    - {command: [EVAL, "return server.call('wait', '2', '0')", 0], node: 0, wait_s: 30,
      expect: {equals: 1}}
    - {command: [EVAL, "return server.call('waitaof', '1', '2', '0')", 0], node: 0,
      wait_s: 30, expect: {equals: [1, 1]}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [wait-script.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: wait-script}
