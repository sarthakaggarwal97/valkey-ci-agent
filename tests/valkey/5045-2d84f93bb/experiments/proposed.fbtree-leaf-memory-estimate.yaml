extends: [valkey.liveness]
id: proposed.fbtree-leaf-memory-estimate
deployment:
  modes: [standalone]
metadata:
  description: >-
    MEMORY USAGE of btree-encoded zsets now counts leaf nodes exactly instead of extrapolating
    from the first 16 leaves; trees with uneven leaf fill must diverge from the parent's
    sampled estimate, and heavy delete/pop/range-delete churn must not drift or underflow
    the new leaf counter
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: zmem
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server_config: {zset-max-listpack-entries: 0}
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - {command: [EVAL, "for i=0,4999 do redis.call('ZADD', KEYS[1], i, 'm'..i) end\
          \ return redis.call('ZCARD', KEYS[1])", 1, z], expect: {equals: 5000}}
    - {command: [OBJECT, ENCODING, z], compare: skip, expect: {equals: btree}}
    - {command: [MEMORY, USAGE, z, SAMPLES, 0], compare: skip, expect: {min: 50000,
        max: 50000000}}
    - {command: [EVAL, "local n=0 for i=1000,4999,2 do n=n+redis.call('ZREM', KEYS[1],\
          \ 'm'..i) end return n", 1, z], expect: {equals: 2000}}
    - {command: [MEMORY, USAGE, z, SAMPLES, 0], expect_difference: true, expect: {
        min: 50000, max: 50000000}}
    - {command: [ZCARD, z], expect: {equals: 3000}}
    - {command: [EVAL, "for i=0,4999 do redis.call('ZADD', KEYS[1], i, 'm'..i) end\
          \ return redis.call('ZCARD', KEYS[1])", 1, z2], expect: {equals: 5000}}
    - {command: [EVAL, "local n=0 for i=1,3999,2 do n=n+redis.call('ZREM', KEYS[1],\
          \ 'm'..i) end return n", 1, z2], expect: {equals: 2000}}
    - {command: [MEMORY, USAGE, z2, SAMPLES, 0], expect_difference: true, expect: {
        min: 50000, max: 50000000}}
    - {command: [EVAL, "for i=0,2999 do redis.call('ZADD', KEYS[1], i, 'm'..i) end\
          \ return redis.call('ZCARD', KEYS[1])", 1, z3], expect: {equals: 3000}}
    - {command: [EVAL, "local t=redis.call('ZPOPMIN', KEYS[1], 400) return #t", 1,
        z3], expect: {equals: 800}}
    - {command: [EVAL, "local t=redis.call('ZPOPMAX', KEYS[1], 400) return #t", 1,
        z3], expect: {equals: 800}}
    - {command: [ZREMRANGEBYSCORE, z3, 1200, 1800], expect: {equals: 601}}
    - {command: [ZREMRANGEBYRANK, z3, 0, 99], expect: {equals: 100}}
    - {command: [EVAL, "for i=800,1000 do redis.call('ZINCRBY', KEYS[1], 100000, 'm'..i)\
          \ end return redis.call('ZCARD', KEYS[1])", 1, z3], expect: {equals: 1499}}
    - {command: [MEMORY, USAGE, z3, SAMPLES, 0], compare: skip, expect: {min: 10000,
        max: 50000000}}
    - {command: [ZREMRANGEBYSCORE, z3, "-inf", "+inf"], expect: {equals: 1499}}
    - {command: [EXISTS, z3], expect: {equals: 0}}
    - {command: [EVAL, "for i=0,199 do redis.call('ZADD', KEYS[1], i, 'm'..i) end\
          \ return redis.call('ZCARD', KEYS[1])", 1, z3], expect: {equals: 200}}
    - {command: [MEMORY, USAGE, z3, SAMPLES, 0], compare: skip, expect: {min: 1000,
        max: 2000000}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [zmem.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: zmem}
