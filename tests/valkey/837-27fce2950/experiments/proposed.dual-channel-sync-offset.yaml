extends: [valkey.liveness]
id: proposed.dual-channel-sync-offset
deployment:
  modes: [standalone]
metadata:
  description: >
    After a dual-channel full sync the replica must adopt the primary's replication
    offset and ID (replicationResurrectProvisionalPrimary fix): a replica promoted
    right after the sync must advertise the sync offset in ROLE, not 0. Pings are
    disabled so offsets are deterministic.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: dual-sync
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 3
    resp: {$ref: inputs.resp}
    timeout_s: 90
    server_config:
      dual-channel-replication-enabled: "yes"
      repl-diskless-sync: "yes"
      repl-diskless-sync-delay: 0
      repl-ping-replica-period: 3600
    commands:
    - {command: [SET, base, v0], node: 0, expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, compare: skip, wait_s: 30, expect: {
        contains: "master_link_status:up"}}
    - {command: [SET, k1, aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa], node: 0, expect: {equals: OK}}
    - {command: [SET, k2, bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb], node: 0, expect: {equals: OK}}
    - {command: [SET, marker, done], node: 0, expect: {equals: OK}}
    - {command: [GET, marker], node: 1, wait_s: 30, expect: {equals: done}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 2, expect: {equals: OK}}
    - {command: [INFO, replication], node: 2, compare: skip, wait_s: 30, expect: {
        contains: "master_link_status:up"}}
    - {command: [GET, marker], node: 2, expect: {equals: done}}
    - {command: [REPLICAOF, NO, ONE], node: 2, expect: {equals: OK}}
    - {command: [ROLE], node: 2, expect_difference: true, expect: {exists: true}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [dual-sync.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: dual-sync}
