extends: [valkey.liveness]
id: proposed.slot-migration-export-iothreads
deployment:
  modes: [standalone]
metadata:
  description: >-
    CLUSTER MIGRATESLOTS export with IO threads active: writes to the migrating slot
    while the snapshot child runs must stay buffered on the export client without
    being offloaded to an IO thread, and the target must end with exactly the seeded
    keys plus the deltas.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    io_threads: {type: integer, minimum: 2, maximum: 16, default: 4}
    key_save_delay_us: {type: integer, minimum: 0, maximum: 200000, default: 20000}
components:
- use: valkey.action.commands
  id: migrate
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 30
    server_config:
      io-threads: {$ref: inputs.io_threads}
      io-threads-always-active: "yes"
      rdb-key-save-delay: {$ref: inputs.key_save_delay_us}
    commands:
    - {command: [MSET, "{6ZJ}k0", v0, "{6ZJ}k1", v1, "{6ZJ}k2", v2, "{6ZJ}k3", v3,
        "{6ZJ}k4", v4, "{6ZJ}k5", v5, "{6ZJ}k6", v6, "{6ZJ}k7", v7, "{6ZJ}k8", v8,
        "{6ZJ}k9", v9, "{6ZJ}k10", v10, "{6ZJ}k11", v11, "{6ZJ}k12", v12, "{6ZJ}k13",
        v13, "{6ZJ}k14", v14, "{6ZJ}k15", v15, "{6ZJ}k16", v16, "{6ZJ}k17", v17, "{6ZJ}k18",
        v18, "{6ZJ}k19", v19], expect: {equals: OK}}
    - {command: [MSET, "{6ZJ}k20", v20, "{6ZJ}k21", v21, "{6ZJ}k22", v22, "{6ZJ}k23",
        v23, "{6ZJ}k24", v24, "{6ZJ}k25", v25, "{6ZJ}k26", v26, "{6ZJ}k27", v27, "{6ZJ}k28",
        v28, "{6ZJ}k29", v29, "{6ZJ}k30", v30, "{6ZJ}k31", v31, "{6ZJ}k32", v32, "{6ZJ}k33",
        v33, "{6ZJ}k34", v34, "{6ZJ}k35", v35, "{6ZJ}k36", v36, "{6ZJ}k37", v37, "{6ZJ}k38",
        v38, "{6ZJ}k39", v39], expect: {equals: OK}}
    - {command: [MSET, "{6ZJ}k40", v40, "{6ZJ}k41", v41, "{6ZJ}k42", v42, "{6ZJ}k43",
        v43, "{6ZJ}k44", v44, "{6ZJ}k45", v45, "{6ZJ}k46", v46, "{6ZJ}k47", v47, "{6ZJ}k48",
        v48, "{6ZJ}k49", v49, "{6ZJ}k50", v50, "{6ZJ}k51", v51, "{6ZJ}k52", v52, "{6ZJ}k53",
        v53, "{6ZJ}k54", v54, "{6ZJ}k55", v55, "{6ZJ}k56", v56, "{6ZJ}k57", v57, "{6ZJ}k58",
        v58, "{6ZJ}k59", v59], expect: {equals: OK}}
    - {command: [SETRANGE, "{6ZJ}p0", 4096, x], expect: {equals: 4097}}
    - {command: [SETRANGE, "{6ZJ}p1", 4096, x], expect: {equals: 4097}}
    - {command: [SETRANGE, "{6ZJ}p2", 4096, x], expect: {equals: 4097}}
    - {command: [SETRANGE, "{6ZJ}p3", 4096, x], expect: {equals: 4097}}
    - {command: [SETRANGE, "{6ZJ}p4", 4096, x], expect: {equals: 4097}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 16383, 16383, NODE, "<node.1.id>"],
      expect: {equals: OK}}
    - {command: [CLUSTER, COUNTKEYSINSLOT, 16383], node: 1, wait_s: 60, expect: {
        min: 1}}
    - {command: [SETRANGE, "{6ZJ}b0", 8192, x], expect: {equals: 8193}}
    - {command: [SETRANGE, "{6ZJ}b1", 8192, x], expect: {equals: 8193}}
    - {command: [SETRANGE, "{6ZJ}b2", 8192, x], expect: {equals: 8193}}
    - {command: [SETRANGE, "{6ZJ}b3", 8192, x], expect: {equals: 8193}}
    - {command: [SETRANGE, "{6ZJ}b4", 8192, x], expect: {equals: 8193}}
    - {command: [SETRANGE, "{6ZJ}b5", 8192, x], expect: {equals: 8193}}
    - {command: [SETRANGE, "{6ZJ}b6", 8192, x], expect: {equals: 8193}}
    - {command: [SETRANGE, "{6ZJ}b7", 8192, x], expect: {equals: 8193}}
    - {command: [SETRANGE, "{6ZJ}b8", 8192, x], expect: {equals: 8193}}
    - {command: [SETRANGE, "{6ZJ}b9", 8192, x], expect: {equals: 8193}}
    - {command: [SETRANGE, "{6ZJ}b10", 8192, x], expect: {equals: 8193}}
    - {command: [SETRANGE, "{6ZJ}b11", 8192, x], expect: {equals: 8193}}
    - {command: [SETRANGE, "{6ZJ}b12", 8192, x], expect: {equals: 8193}}
    - {command: [SETRANGE, "{6ZJ}b13", 8192, x], expect: {equals: 8193}}
    - {command: [SETRANGE, "{6ZJ}b14", 8192, x], expect: {equals: 8193}}
    - {command: [SETRANGE, "{6ZJ}b15", 8192, x], expect: {equals: 8193}}
    - {command: [SETRANGE, "{6ZJ}b16", 8192, x], expect: {equals: 8193}}
    - {command: [SETRANGE, "{6ZJ}b17", 8192, x], expect: {equals: 8193}}
    - {command: [SETRANGE, "{6ZJ}b18", 8192, x], expect: {equals: 8193}}
    - {command: [SETRANGE, "{6ZJ}b19", 8192, x], expect: {equals: 8193}}
    - {command: [SET, "{6ZJ}k0", w0], expect: {equals: OK}}
    - {command: [SET, "{6ZJ}k1", w1], expect: {equals: OK}}
    - {command: [SET, "{6ZJ}k2", w2], expect: {equals: OK}}
    - {command: [SET, "{6ZJ}k3", w3], expect: {equals: OK}}
    - {command: [SET, "{6ZJ}k4", w4], expect: {equals: OK}}
    - {command: [DEL, "{6ZJ}k59"], expect: {equals: 1}}
    - {command: [GET, "{6ZJ}k0"], node: 1, wait_s: 120, expect: {equals: w0}}
    - {command: [GET, "{6ZJ}k4"], node: 1, expect: {equals: w4}}
    - {command: [GET, "{6ZJ}k5"], node: 1, expect: {equals: v5}}
    - {command: [GET, "{6ZJ}k20"], node: 1, expect: {equals: v20}}
    - {command: [GET, "{6ZJ}k40"], node: 1, expect: {equals: v40}}
    - {command: [GET, "{6ZJ}k59"], node: 1, expect: {equals: null}}
    - {command: [STRLEN, "{6ZJ}b0"], node: 1, expect: {equals: 8193}}
    - {command: [STRLEN, "{6ZJ}b19"], node: 1, expect: {equals: 8193}}
    - {command: [STRLEN, "{6ZJ}p0"], node: 1, expect: {equals: 4097}}
    - {command: [CLUSTER, COUNTKEYSINSLOT, 16383], node: 1, expect: {equals: 84}}
    - {command: [CLUSTER, COUNTKEYSINSLOT, 16383], wait_s: 60, expect: {equals: 0}}
    - {command: [GET, "{6ZJ}k1"], expect: {error: MOVED}}
    - {command: [PING], node: 1, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [migrate.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: migrate}
