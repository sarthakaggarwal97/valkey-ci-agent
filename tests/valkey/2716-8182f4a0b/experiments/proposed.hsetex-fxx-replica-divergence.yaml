extends: [valkey.liveness]
id: proposed.hsetex-fxx-replica-divergence
deployment:
  modes: [standalone]
metadata:
  description: A failed HSETEX FXX on a missing key must not create a primary-only
    ghost key that never reaches the replica
components:
- use: valkey.action.commands
  id: hsetex-repl
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 60
    commands:
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [HSET, seed, f, v], expect: {equals: 1}}
    - {command: [HSETEX, ghost, EX, 100, FXX, FIELDS, 1, f, v], expect: {equals: 0}}
    - {command: [HSETEX, seed, EX, 100, FXX, FIELDS, 1, f, v2], expect: {equals: 1}}
    - {command: [HGET, seed, f], node: 1, wait_s: 30, expect: {equals: v2}}
    - {command: [EXISTS, ghost], node: 0, expect_difference: true, expect: {equals: 0}}
    - {command: [EXISTS, ghost], node: 1, expect: {equals: 0}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [hsetex-repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: hsetex-repl}
