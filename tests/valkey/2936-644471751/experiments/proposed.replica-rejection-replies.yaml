extends: [valkey.liveness]
id: proposed.replica-rejection-replies
deployment:
  modes: [standalone]
metadata:
  description: Read-only replica, CLIENT CAPA redirect and stale-data rejections,
    the replication-side rejection call sites the change touched, replies compared
    across builds
components:
- use: valkey.action.commands
  id: replrej
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    server_config: {repl-serve-stale-data: "no"}
    timeout_s: 60
    commands:
    - {command: [SET, k, v], expect: {equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [GET, k], node: 1, wait_s: 10, expect: {equals: v}}
    - {command: [SET, k2, v2], node: 1, expect: {error: "READONLY"}}
    - {command: [CLIENT, CAPA, redirect], node: 1, connection: redir, expect: {equals: OK}}
    - {command: [SET, k3, v3], node: 1, connection: redir, expect: {error: "REDIRECT"}}
    - {command: [REPLICAOF, "<node.1.host>", "1"], node: 1, expect: {equals: OK}}
    - {command: [GET, k], node: 1, wait_s: 10, expect: {error: "MASTERDOWN"}}
    - {command: [REPLICAOF, NO, ONE], node: 1, expect: {equals: OK}}
    - {command: [PING], node: 1, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [replrej.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: replrej}
