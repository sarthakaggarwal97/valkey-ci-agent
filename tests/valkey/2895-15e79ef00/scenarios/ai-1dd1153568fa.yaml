scenario_id: ai-1dd1153568fa
seed: 106
experiment:
  id: valkey.cluster-chaos
  inputs:
    command_rate: 500
    keys_per_slot: 10
    waves:
    - - op: kill
        target: replica
        signal: SIGKILL
      - op: failover
        shard: 0
        delay_s: 0.5
