extends: [valkey.base]
id: proposed.bio-lazyfree-burst
deployment:
  modes: [standalone]
metadata:
  description: >-
    Bursts of FLUSHDB ASYNC lazy-free jobs across ten databases push the new bio mutexQueue/fifo
    past 7 queued jobs (multi-block growth, multi-block pop, block release, single-block
    memmove pops as it drains), and appendfsync/appendonly toggles call bioDrainWorker
    with AOF fsync and close jobs pending, all under a concurrent key-value workload
    judged by the ledger, deployment-state and liveness oracles.
components:
- use: valkey.action.commands
  id: burst
  config:
    timeout_s: 180
    commands:
    - {command: [SELECT, "1"], expect: {equals: OK}}
    - {command: [DEBUG, POPULATE, "50000"], expect: {equals: OK}}
    - {command: [SELECT, "2"], expect: {equals: OK}}
