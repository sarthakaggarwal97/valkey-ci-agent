extends: [valkey.liveness]
id: proposed.replicaof-failover-short-log
deployment:
  modes: [standalone]
metadata:
  description: REPLICAOF, REPLICAOF NO ONE, and PSYNC FAILOVER (via FAILOVER TO) run
    the paths switched to catClientInfoShortString on two private standalone nodes;
    replies compared across builds
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    io_threads: {type: integer, enum: [1, 4], default: 1}
components:
- use: valkey.action.commands
  id: repl
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    server_config: {io-threads: {$ref: inputs.io_threads}}
    timeout_s: 15
    commands:
    - {command: [CLIENT, SETNAME, repl-admin], node: 1, expect: {equals: OK}}
    - {command: [CLIENT, SETINFO, lib-name, fuzz-lib], node: 1, expect: {equals: OK}}
    - {command: [PSYNC, "0000000000000000000000000000000000000000", 0, FAILOVER],
      node: 1, connection: psync, expect: {error: "master"}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [PSYNC, "0000000000000000000000000000000000000000", 0, FAILOVER],
      node: 1, connection: psync, expect: {error: "must match"}}
    - {command: [SET, k1, v1], expect: {equals: OK}}
    - {command: [GET, k1], node: 1, wait_s: 10, expect: {equals: v1}}
    - {command: [FAILOVER, TO, "<node.1.host>", "<node.1.port>"], expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "role:master"},
      compare: skip}
    - {command: [INFO, replication], node: 0, wait_s: 30, expect: {contains: "role:slave"},
      compare: skip}
    - {command: [INFO, replication], node: 0, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [SET, k2, v2], node: 1, expect: {equals: OK}}
    - {command: [GET, k2], node: 0, wait_s: 10, expect: {equals: v2}}
    - {command: [CONFIG, SET, hide-user-data-from-log, yes], node: 0, expect: {equals: OK}}
    - {command: [REPLICAOF, NO, ONE], node: 0, expect: {equals: OK}}
    - {command: [INFO, replication], node: 0, wait_s: 30, expect: {contains: "role:master"},
      compare: skip}
    - {command: [REPLICAOF, "<node.1.host>", "<node.1.port>"], node: 0, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 0, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [REPLICAOF, NO, ONE], node: 1, expect: {equals: OK}}
    - {command: [GET, k2], node: 0, wait_s: 10, expect: {equals: v2}}
    - {command: [PING], expect: {equals: PONG}}
    - {command: [PING], node: 1, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
