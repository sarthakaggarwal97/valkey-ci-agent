extends: [valkey.liveness]
id: proposed.command-cache-module-compare
deployment:
  modes: [standalone]
metadata:
  description: COMMAND caches with module commands registered through VM_CreateCommand,
    which now invalidates the global cache; module command info cached and verified
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: modcache
  config:
    compare_with: {$ref: artifacts.parent.binary}
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    server_config: {enable-debug-assert: "yes"}
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
    - {command: [COMMAND, COUNT], expect: {min: 100}}
    - {command: [COMMAND], compare: skip}
    - {command: [COMMAND], compare: skip}
    - {command: [COMMAND, INFO, test.basics]}
    - {command: [COMMAND, INFO, test.basics]}
    - {command: [COMMAND, INFO, test.getresp, GET, no-such-command]}
    - {command: [HELLO, 3], compare: skip}
    - {command: [COMMAND, INFO, test.basics]}
    - {command: [COMMAND], compare: skip}
    - {command: [COMMAND], compare: skip}
    - {command: [COMMAND, COUNT], expect: {min: 100}}
    - {command: [HELLO, 2], compare: skip}
    - {command: [COMMAND, INFO, test.basics]}
    - {command: [PING], expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      variants: true
required_events: [modcache.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: modcache}
