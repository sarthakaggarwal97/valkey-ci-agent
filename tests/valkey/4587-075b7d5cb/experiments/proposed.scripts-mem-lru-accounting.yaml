extends: [valkey.liveness]
id: proposed.scripts-mem-lru-accounting
deployment:
  modes: [standalone]
metadata:
  description: used_memory_scripts_eval counts the LRU SHA copies on the fixed build;
    a Lua reader returns deltas across EVAL fills and SCRIPT LOAD promotions
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    cluster: {type: boolean, default: false}
components:
- use: valkey.action.commands
  id: mem
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    cluster: {$ref: inputs.cluster}
    timeout_s: 60
    commands:
    - command: [EVAL, "local i=redis.call('INFO','memory') local m=tonumber(string.match(i,'used_memory_scripts_eval:(%d+)'))\
          \ local b=tonumber(redis.call('GET',KEYS[1]) or 0) redis.call('SET',KEYS[1],m)\
          \ return m-b", 1, base]
      expect_difference: true
      expect: {min: 1}
    - {command: [EVAL, "return 1", 0], expect: {equals: 1}}
    - {command: [EVAL, "return 2", 0], expect: {equals: 2}}
    - {command: [EVAL, "return 3", 0], expect: {equals: 3}}
