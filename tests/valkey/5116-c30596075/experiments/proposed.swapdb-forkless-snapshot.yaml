extends: [valkey.liveness]
id: proposed.swapdb-forkless-snapshot
deployment:
  modes: [standalone]
metadata:
  description: >
    SWAPDB from a script that disabled replication, during a forkless BGSAVE stretched
    by rdb-key-save-delay. The parent never notifies the iterator (notification lived
    in the replication path), so its snapshot duplicates db0 into db1 and loses db1's
    keys; the fixed build notifies from dbSwapDatabases and snapshots each DB's own
    pre-swap keys. The restart reloads the snapshot RDB for inspection.
inputs:
  properties:
    repl: {type: string, enum: [REPL_NONE, REPL_AOF], default: REPL_NONE}
components:
- use: valkey.action.commands
  id: swap
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server_config:
      forkless-infrastructure-enabled: "yes"
      bgsave-default-method: forkless
      save: ""
    timeout_s: 90
    commands:
    - {command: [EVAL, "for i=0,499 do server.call('set','db0:'..i,'x') end return\
          \ server.call('dbsize')", "0"], expect: {equals: 500}}
    - {command: [SELECT, "1"], expect: {equals: OK}}
    - {command: [EVAL, "for i=0,499 do server.call('set','db1:'..i,'x') end return\
          \ server.call('dbsize')", "0"], expect: {equals: 500}}
    - {command: [SELECT, "0"], expect: {equals: OK}}
    - {command: [CONFIG, SET, rdb-key-save-delay, "10000"], expect: {equals: OK}}
    - {command: [BGSAVE], expect: {contains: "Background saving started"}}
    - {command: [INFO, persistence], wait_s: 10, compare: skip, expect: {contains: "rdb_bgsave_in_progress:1"}}
    - command:
      - EVAL
      - "server.set_repl(server[ARGV[1]]); return server.call('swapdb','0','1')"
      - "0"
      - {$ref: inputs.repl}
      expect: {equals: OK}
    - {command: [CONFIG, SET, rdb-key-save-delay, "0"], expect: {equals: OK}}
    - {command: [INFO, persistence], wait_s: 30, compare: skip, expect: {contains: "rdb_bgsave_in_progress:0"}}
    - {command: [INFO, persistence], compare: skip, expect: {contains: "rdb_last_bgsave_status:ok"}}
    - {command: [EXISTS, "db1:0"], expect: {equals: 1}}
    - {restart: true, expect: {equals: OK}}
    - {command: [SELECT, "0"], expect: {equals: OK}}
    - {command: [DBSIZE], expect: {equals: 500}}
    - {command: [EXISTS, "db0:0", "db0:499"], expect: {equals: 2}}
    - {command: [SELECT, "1"], expect: {equals: OK}}
    - {command: [EXISTS, "db1:0", "db1:250", "db1:499"], expect_difference: true,
      expect: {equals: 3}}
    - {command: [EXISTS, "db0:0"], expect_difference: true, expect: {equals: 0}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [swap.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: swap}
