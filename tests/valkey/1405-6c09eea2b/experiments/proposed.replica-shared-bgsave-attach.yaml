extends: [valkey.liveness]
id: proposed.replica-shared-bgsave-attach
deployment:
  modes: [standalone]
metadata:
  description: A second replica attaches to an in-progress disk BGSAVE started for
    the first replica, exercising copyReplicaOutputBuffer on the lazily allocated
    repl_data
components:
- use: valkey.action.commands
  id: seq
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 3
    timeout_s: 120
    commands:
    - {command: [CONFIG, SET, repl-diskless-sync, 'no'], node: 0, expect: {equals: OK}}
    - {command: [CONFIG, SET, repl-diskless-sync-delay, '0'], node: 0, expect: {equals: OK}}
    - {command: [CONFIG, SET, rdb-key-save-delay, '100'], node: 0, expect: {equals: OK}}
    - {command: [DEBUG, POPULATE, '50000'], node: 0, expect: {equals: OK}}
    - {command: [REPLICAOF, '<node.0.host>', '<node.0.port>'], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, persistence], node: 0, wait_s: 20, expect: {contains: 'rdb_bgsave_in_progress:1'},
      compare: skip}
    - {command: [SET, marker, v1], node: 0, expect: {equals: OK}}
    - {command: [REPLICAOF, '<node.0.host>', '<node.0.port>'], node: 2, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 60, expect: {contains: 'master_link_status:up'},
      compare: skip}
    - {command: [INFO, replication], node: 2, wait_s: 60, expect: {contains: 'master_link_status:up'},
      compare: skip}
    - {command: [CONFIG, SET, rdb-key-save-delay, '0'], node: 0, expect: {equals: OK}}
    - {command: [GET, marker], node: 2, wait_s: 15, expect: {equals: v1}}
    - {command: [GET, marker], node: 1, wait_s: 15, expect: {equals: v1}}
    - {command: [INFO, replication], node: 0, wait_s: 15, expect: {contains: 'connected_slaves:2'},
      compare: skip}
    checks:
      acl: true
      compat: true
      variants: true
required_events: [seq.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: seq}
