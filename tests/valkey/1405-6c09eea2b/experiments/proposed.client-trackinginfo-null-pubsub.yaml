extends: [valkey.liveness]
id: proposed.client-trackinginfo-null-pubsub
deployment:
  modes: [standalone]
metadata:
  description: CLIENT TRACKINGINFO on a fresh connection that never used pub/sub or
    tracking
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: trackinginfo
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    timeout_s: 10
    commands:
    - {command: [CLIENT, TRACKINGINFO], expect_difference: true, expect: {exists: true}}
    - {command: [PING], expect_difference: true, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_evidence:
- {evidence_id: valkey.command.sequence, source: trackinginfo}
