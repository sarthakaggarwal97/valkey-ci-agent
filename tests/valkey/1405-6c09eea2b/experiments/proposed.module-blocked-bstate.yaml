extends: [valkey.liveness]
id: proposed.module-blocked-bstate
deployment:
  modes: [standalone]
metadata:
  description: blockedclient.so through the lazily-created bstate and module_data
    - async RM_Call promises on temp clients, fire-and-forget promise released with
    the temp client, module block timeout with NULL callback, WAIT inside RM_Call
    with a replica
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: modblk
  config:
    compare_with: {$ref: artifacts.parent.binary}
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 15
    commands:
    - {command: [acquire_gil], expect: {equals: OK}}
    - {raw: "do_rm_call_async blpop k2 0\r\n", connection: m1}
    - {command: [LPUSH, k2, vv], expect: {equals: 1}}
    - {read: true, connection: m1, expect: {equals: [[k2, vv]]}}
    - {command: [do_rm_call_fire_and_forget, blpop, fk, 0], expect: {equals: Blocked}}
    - {command: [LPUSH, fk, fv], expect: {equals: 1}}
    - {command: [LLEN, fk], expect: {equals: 0}}
    - {command: [do_rm_call_async, blpop, nokey, 1], expect: {equals: null}}
    - {raw: "unblock_by_timer 2000 100\r\n", connection: ub}
    - {command: [DEBUG, SLEEP, 2]}
    - {read: true, connection: ub}
    - {command: [unblock_by_timer, 100, 10000], expect: {equals: OK}}
    - {command: [do_fake_bg_true]}
    - {command: [do_rm_call, ping], expect: {equals: PONG}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 60, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [wait_and_do_rm_call, SET, wk, wv], expect: {equals: OK}}
    - {command: [GET, wk], expect: {equals: wv}}
    checks:
      acl: true
      compat: true
      variants: true
required_events: [modblk.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: modblk}
