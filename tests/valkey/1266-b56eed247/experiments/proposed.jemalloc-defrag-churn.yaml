extends: [valkey.liveness]
id: proposed.jemalloc-defrag-churn
deployment:
  modes: [standalone]
metadata:
  description: >-
    Drive active defrag through the new allocator_defrag.c mallctl-based implementation
    (allocatorDefragInit, allocatorShouldDefrag, allocatorDefragGetFragSmallbins,
    allocatorDefragAlloc/Free) under small-bin and large-allocation churn, and compare
    behaviour and data integrity against the parent build's patched-jemalloc je_get_defrag_hint
    path.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    cluster: {type: boolean, default: false}
components:
- use: valkey.action.commands
  id: defrag
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    cluster: {$ref: inputs.cluster}
    timeout_s: 60
    server_config:
      hash-max-listpack-entries: 0
      active-defrag-ignore-bytes: 1
      active-defrag-threshold-lower: 0
      active-defrag-cycle-min: 25
      active-defrag-cycle-max: 75
    commands:
    - {command: [PING], expect: {equals: PONG}}
    - command:
      - EVAL
      - |-
        for i=0,59999 do
          local sz
          if i % 97 == 0 then sz = 20000 else sz = 1 + (i % 16) * 16 end
          redis.call('SET', 'k'..i, string.rep('A', sz))
        end
        return redis.call('DBSIZE')
      - "0"
      expect: {equals: 60000}
    - command:
      - EVAL
      - |-
        for i=0,1999 do
          for j=0,19 do
            redis.call('HSET', 'h'..i, 'f'..j, string.rep('B', 24))
          end
        end
        return redis.call('DBSIZE')
      - "0"
      expect: {equals: 62000}
    - command:
      - EVAL
      - |-
        local n = 0
        for i=1,59999,2 do n = n + redis.call('DEL', 'k'..i) end
        return n
      - "0"
      expect: {equals: 30000}
    - command:
      - EVAL
      - |-
        local n = 0
        for i=1,1999,2 do n = n + redis.call('DEL', 'h'..i) end
        return n
      - "0"
      expect: {equals: 1000}
    - {command: [CONFIG, SET, activedefrag, "yes"], expect: {equals: OK}}
    - {command: [INFO, memory], compare: skip}
    - {command: [BLPOP, defrag-wait, "1"]}
    - {command: [BLPOP, defrag-wait, "1"]}
    - {command: [BLPOP, defrag-wait, "1"]}
    - {command: [INFO, stats], compare: skip}
    - {command: [BLPOP, defrag-wait, "1"]}
    - {command: [BLPOP, defrag-wait, "1"]}
    - command:
      - EVAL
      - |-
        local ok, bad = 0, 0
        for i=0,59998,2 do
          local sz
          if i % 97 == 0 then sz = 20000 else sz = 1 + (i % 16) * 16 end
          if redis.call('GET', 'k'..i) == string.rep('A', sz) then ok = ok + 1 else bad = bad + 1 end
        end
        return {ok, bad}
      - "0"
      expect: {equals: [30000, 0]}
    - command:
      - EVAL
      - |-
        local bad = 0
        local want = string.rep('B', 24)
        for i=0,1998,2 do
          for j=0,19 do
            if redis.call('HGET', 'h'..i, 'f'..j) ~= want then bad = bad + 1 end
          end
        end
        return bad
      - "0"
      expect: {equals: 0}
    - command:
      - EVAL
      - |-
        for i=0,59998,2 do
          redis.call('SET', 'k'..i, string.rep('C', 1 + ((i + 5) % 16) * 16))
        end
        return redis.call('DBSIZE')
      - "0"
      expect: {equals: 31000}
    - {command: [BLPOP, defrag-wait, "1"]}
    - {command: [BLPOP, defrag-wait, "1"]}
    - command:
      - EVAL
      - |-
        local ok, bad = 0, 0
        for i=0,59998,2 do
          if redis.call('GET', 'k'..i) == string.rep('C', 1 + ((i + 5) % 16) * 16) then ok = ok + 1 else bad = bad + 1 end
        end
        return {ok, bad}
      - "0"
      expect: {equals: [30000, 0]}
    - {command: [DBSIZE], expect: {equals: 31000}}
    - {command: [INFO, stats], compare: skip}
    - {command: [CONFIG, SET, activedefrag, "no"], expect: {equals: OK}}
    - {command: [PING], expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [defrag.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: defrag}
