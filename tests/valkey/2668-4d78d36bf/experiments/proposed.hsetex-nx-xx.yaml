extends: [valkey.liveness]
id: proposed.hsetex-nx-xx
deployment:
  modes: [standalone]
metadata:
  description: HSETEX NX/XX key-level conditions; the parent rejects them as a syntax
    error, the change applies them
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: nxxx
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    timeout_s: 10
    commands:
    - {command: [HSETEX, h, NX, FIELDS, 2, f1, v1, f2, v2], expect_difference: true,
      expect: {equals: 1}}
    - {command: [HGET, h, f1], expect_difference: true, expect: {equals: v1}}
    - {command: [HSETEX, h, NX, FIELDS, 1, f1, X], expect_difference: true, expect: {
        equals: 0}}
    - {command: [HGET, h, f1], expect_difference: true, expect: {equals: v1}}
    - {command: [HSETEX, g, XX, FIELDS, 1, f1, v1], expect_difference: true, expect: {
        equals: 0}}
    - {command: [EXISTS, g], expect: {equals: 0}}
    - {command: [HSET, g, f1, old1], expect: {equals: 1}}
    - {command: [HSETEX, g, XX, FIELDS, 1, f1, new1], expect_difference: true, expect: {
        equals: 1}}
    - {command: [HGET, g, f1], expect_difference: true, expect: {equals: new1}}
    - {command: [HSETEX, h2, EX, 100, NX, FNX, FIELDS, 1, a, 1], expect_difference: true,
      expect: {equals: 1}}
    - {command: [HGET, h2, a], expect_difference: true, expect: {equals: "1"}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [nxxx.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: nxxx}
