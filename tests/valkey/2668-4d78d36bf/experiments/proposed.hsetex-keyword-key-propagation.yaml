extends: [valkey.liveness]
id: proposed.hsetex-keyword-key-propagation
deployment:
  modes: [standalone]
metadata:
  description: HSETEX EX on a key literally named NX; the argv rebuild strips the
    key from the propagated command, so the replica diverges
components:
- use: valkey.action.commands
  id: prop
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 30
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [HSETEX, NX, EX, 100, FIELDS, 1, f, v1], node: 0, expect: {equals: 1}}
    - {command: [HGET, NX, f], node: 0, expect: {equals: v1}}
    - {command: [WAIT, 1, 5000], node: 0, compare: skip, expect: {min: 0}}
    - {command: [HGET, NX, f], node: 1, expect_difference: true, expect: {equals: v1}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [prop.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: prop}
