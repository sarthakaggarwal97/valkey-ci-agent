extends: [valkey.liveness]
id: proposed.migration-failover-interplay
deployment:
  modes: [standalone]
metadata:
  description: Manual failovers in the migration target shard and the migration source
    shard while slots are half-migrated - migrating and importing states must follow
    the new primaries and the migration must finalize
components:
- use: valkey.action.commands
  id: migfail
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 5
    server_config: {cluster-node-timeout: 5000}
    timeout_s: 90
    commands:
    - {command: [CLUSTER, REPLICATE, <node.0.id>], node: 1, expect: {equals: OK}}
    - {command: [CLUSTER, REPLICATE, <node.2.id>], node: 3, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [INFO, replication], node: 3, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [CLUSTER, SETSLOT, 12182, IMPORTING, <node.0.id>], node: 2, expect: {
        equals: OK}}
    - {command: [CLUSTER, SETSLOT, 12182, MIGRATING, <node.2.id>], node: 0, expect: {
        equals: OK}}
    - {command: [CLUSTER, FAILOVER], node: 3, expect: {equals: OK}}
    - {command: [ROLE], node: 3, wait_s: 30, expect: {contains: master}, compare: skip}
    - {command: [CLUSTER, NODES], node: 0, wait_s: 25, expect_difference: true, expect: {
        contains: "[12182->-<node.3.id>]"}}
    - {command: [CLUSTER, SETSLOT, 12182, NODE, <node.3.id>], node: 3, expect_difference: true,
      expect: {equals: OK}}
    - {command: [GET, foo], node: 3, wait_s: 20, expect_difference: true, expect: {
        equals: null}}
    - {command: [CLUSTER, SETSLOT, 5061, IMPORTING, <node.0.id>], node: 4, expect: {
        equals: OK}}
    - {command: [CLUSTER, SETSLOT, 5061, MIGRATING, <node.4.id>], node: 0, expect: {
        equals: OK}}
    - {command: [CLUSTER, FAILOVER], node: 1, expect: {equals: OK}}
    - {command: [ROLE], node: 1, wait_s: 30, expect: {contains: master}, compare: skip}
    - {command: [CLUSTER, NODES], node: 1, wait_s: 25, expect_difference: true, expect: {
        contains: "[5061->-<node.4.id>]"}}
    - {command: [CLUSTER, NODES], node: 4, wait_s: 25, expect_difference: true, expect: {
        contains: "[5061-<-<node.1.id>]"}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [migfail.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: migfail}
