extends: [valkey.liveness]
id: proposed.half-migrated-slot
deployment:
  modes: [standalone]
metadata:
  description: Half-finished slot migrations repaired via gossip - importing primary
    takes over a relinquished slot, cross-shard claims clear stale migrating and importing
    states, dirty slots are flushed
components:
- use: valkey.action.commands
  id: halfmig
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 4
    server_config: {cluster-node-timeout: 5000}
    timeout_s: 60
    commands:
    - {command: [CLUSTER, SETSLOT, 12182, IMPORTING, <node.0.id>], node: 1, expect: {
        equals: OK}}
    - {command: [CLUSTER, SETSLOT, 12182, MIGRATING, <node.1.id>], node: 0, expect: {
        equals: OK}}
    - {command: [CLUSTER, SETSLOT, 12182, NODE, <node.1.id>], node: 0, expect: {equals: OK}}
    - {command: [GET, foo], node: 1, wait_s: 20, expect_difference: true, expect: {
        equals: null}}
    - {command: [SET, bar, v1], node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, SETSLOT, 5061, IMPORTING, <node.0.id>], node: 2, expect: {
        equals: OK}}
    - {command: [CLUSTER, SETSLOT, 5061, NODE, <node.2.id>], node: 2, expect: {equals: OK}}
    - {command: [DBSIZE], node: 0, wait_s: 20, expect: {equals: 0}}
    - {command: [CLUSTER, SETSLOT, 866, MIGRATING, <node.3.id>], node: 0, expect: {
        equals: OK}}
    - {command: [CLUSTER, SETSLOT, 866, IMPORTING, <node.0.id>], node: 2, expect: {
        equals: OK}}
    - {command: [CLUSTER, SETSLOT, 866, NODE, <node.2.id>], node: 2, expect: {equals: OK}}
    - {command: [CLUSTER, NODES], node: 0, wait_s: 20, expect: {contains: "<node.2.id>"},
      compare: skip}
    - {command: [CLUSTER, SETSLOT, 7000, IMPORTING, <node.2.id>], node: 3, expect: {
        equals: OK}}
    - {command: [CLUSTER, SETSLOT, 7000, MIGRATING, <node.3.id>], node: 2, expect: {
        equals: OK}}
    - {command: [CLUSTER, SETSLOT, 7000, NODE, <node.1.id>], node: 1, expect: {equals: OK}}
    - {command: [CLUSTER, NODES], node: 3, wait_s: 20, expect_difference: true, expect: {
        contains: "<node.1.id>"}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [halfmig.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: halfmig}
