extends: [valkey.liveness]
id: proposed.subreplica-fold
deployment:
  modes: [standalone]
metadata:
  description: A replication chain (node2 replicating node1 replicating node0) must
    be folded by the per-packet sub-replica safeguard, reattaching node2 directly
    to node0
components:
- use: valkey.action.commands
  id: chain
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 3
    server_config: {cluster-node-timeout: 5000}
    timeout_s: 60
    commands:
    - {command: [CLUSTER, REPLICATE, <node.1.id>], node: 2, expect: {equals: OK}}
    - {command: [INFO, replication], node: 2, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [CLUSTER, REPLICATE, <node.0.id>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 0, wait_s: 40, expect: {contains: "connected_slaves:2"},
      compare: skip}
    - {command: [CLUSTER, NODES], node: 2, wait_s: 30, expect: {contains: "myself,slave\
          \ <node.0.id>"}, compare: skip}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [chain.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: chain}
