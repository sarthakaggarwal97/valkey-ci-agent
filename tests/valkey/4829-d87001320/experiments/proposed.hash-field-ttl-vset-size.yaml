extends: [valkey.liveness]
id: proposed.hash-field-ttl-vset-size
deployment:
  modes: [standalone]
metadata:
  description: >
    Hash field TTL churn across every vset bucket encoding (SINGLE, VECTOR, RAX, and
    a >127 same-expiry HT time bucket), with removals, persists, cross-bucket TTL
    updates, bounded active-expiry reaping down to empty, AOF rewrite (which feeds
    hashTypeVolatileCount/vsetSize into the HMSET batch count), a restart reload,
    and a replica fed from the replication stream. enable-debug-assert makes vsetSize
    cross-check the tracked size against a full bucket walk. The MEMORY USAGE probe
    shows the hashtable metadata grew from 8 to 16 bytes, proving the run reached
    the change.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    appendonly: {type: string, enum: ["yes", "no"], default: "yes"}
    appendfsync: {type: string, enum: [always, everysec, "no"], default: everysec}
    listpack_entries: {type: integer, minimum: 0, maximum: 512, default: 0}
components:
- use: valkey.action.commands
  id: churn
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    nodes: 2
    timeout_s: 300
    server_config:
      enable-debug-assert: "yes"
      aof-use-rdb-preamble: "no"
      hash-max-listpack-entries: {$ref: inputs.listpack_entries}
      appendonly: {$ref: inputs.appendonly}
      appendfsync: {$ref: inputs.appendfsync}
    commands:
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, compare: skip, wait_s: 30, expect: {
        contains: "master_link_status:up"}}
    - {command: [HSET, m, f1, LLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLL,
        f2, v, f3, v, f4, v, f5, v], expect: {equals: 5}}
    - {command: [OBJECT, ENCODING, m], compare: skip, expect: {equals: hashtable}}
    - {command: [MEMORY, USAGE, m, SAMPLES, 0], expect_difference: true, expect: {
        min: 200}}
    - {command: [HSET, h, s1, v], expect: {equals: 1}}
    - {command: [HPEXPIREAT, h, 9999999999000, FIELDS, 1, s1], expect: {equals: [
          1]}}
    - {command: [HPEXPIRETIME, h, FIELDS, 1, s1], expect: {equals: [9999999999000]}}
    - {command: [HPERSIST, h, FIELDS, 1, s1], expect: {equals: [1]}}
    - {command: [HTTL, h, FIELDS, 1, s1], expect: {equals: [-1]}}
    - {command: [HSET, h, b01, v, b02, v, b03, v, b04, v, b05, v, b06, v, b07, v,
        b08, v, b09, v, b10, v, b11, v, b12, v, b13, v, b14, v, b15, v, b16, v, b17,
        v, b18, v, b19, v, b20, v], expect: {equals: 20}}
    - {command: [HPEXPIREAT, h, 9999999991000, FIELDS, 5, b01, b02, b03, b04, b05],
      expect: {equals: [1, 1, 1, 1, 1]}}
    - {command: [HPEXPIREAT, h, 9999999992000, FIELDS, 5, b06, b07, b08, b09, b10],
      expect: {equals: [1, 1, 1, 1, 1]}}
    - {command: [HPEXPIREAT, h, 9999999993000, FIELDS, 5, b11, b12, b13, b14, b15],
      expect: {equals: [1, 1, 1, 1, 1]}}
    - {command: [HPEXPIREAT, h, 9999999994000, FIELDS, 5, b16, b17, b18, b19, b20],
      expect: {equals: [1, 1, 1, 1, 1]}}
    - {command: [HPEXPIREAT, h, 9999999992000, FIELDS, 1, b01], expect: {equals: [
          1]}}
    - {command: [HDEL, h, b02, b03], expect: {equals: 2}}
    - {command: [HSETEX, h, KEEPTTL, FIELDS, 1, b04, w], expect: {equals: 1}}
    - {command: [HPEXPIRETIME, h, FIELDS, 4, b01, b04, b06, b16], expect: {equals: [
          9999999992000, 9999999991000, 9999999992000, 9999999994000]}}
    - command: [HSETEX, h, PXAT, 9999999995000, FIELDS, 130, a001, x, a002, x, a003,
        x, a004, x, a005, x, a006, x, a007, x, a008, x, a009, x, a010, x, a011, x,
        a012, x, a013, x, a014, x, a015, x, a016, x, a017, x, a018, x, a019, x, a020,
        x, a021, x, a022, x, a023, x, a024, x, a025, x, a026, x, a027, x, a028, x,
