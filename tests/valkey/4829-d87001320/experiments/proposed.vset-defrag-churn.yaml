extends: [valkey.liveness]
id: proposed.vset-defrag-churn
deployment:
  modes: [standalone]
metadata:
  description: Active defrag over hashes whose volatile sets are a root VECTOR, a
    RAX of vector buckets and a RAX holding a hashtable bucket, so cron runs vsetScanDefrag
    (new vset-struct signature) and defragHashTypeEntry drives same-expiry vsetUpdateEntry;
    aggressive defrag config and idle expiry waits give the cycle time to run, replies
    compared against the parent
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: defrag
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server_config: {hash-max-listpack-entries: 0, enable-debug-assert: 'yes', activedefrag: 'yes',
      active-defrag-ignore-bytes: 1, active-defrag-threshold-lower: 0, active-defrag-cycle-min: 60,
      active-defrag-cycle-max: 90, hz: 50}
    resp: {$ref: inputs.resp}
    timeout_s: 180
    commands:
    - {command: [HSETEX, r, PXAT, 33177117600000, FIELDS, 8, r1a, 1, r1b, 1, r1c,
        1, r1d, 1, r1e, 1, r1f, 1, r1g, 1, r1h, 1], expect: {equals: 1}}
