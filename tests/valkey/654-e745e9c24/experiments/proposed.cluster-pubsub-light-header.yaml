extends: [valkey.liveness]
id: proposed.cluster-pubsub-light-header
deployment:
  modes: [standalone]
metadata:
  description: Cross-node PUBLISH and SPUBLISH delivery over the cluster bus with
    the light header, compared against the parent's full-header path
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: pubsub
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 15
    commands:
    - {command: [SUBSCRIBE, ch1], node: 1, connection: sub, expect: {equals: [subscribe,
          ch1, 1]}}
    - {command: [SUBSCRIBE, ""], node: 1, connection: sub0, expect: {equals: [subscribe,
          "", 1]}}
    - {command: [PUBLISH, ch1, hello-light], node: 0, expect: {equals: 0}}
    - {command: [PUBLISH, "", ""], node: 0, expect: {equals: 0}}
    - {read: true, node: 1, connection: sub, expect: {equals: [[message, ch1, hello-light]]}}
    - {read: true, node: 1, connection: sub0, expect: {equals: [[message, "", ""]]}}
    - {command: [PUBLISH, ch1, ""],
      node: 0, expect: {equals: 0}}
    - {read: true, node: 1, connection: sub, expect: {equals: [[message, ch1, ""]]}}
    - {command: [CLUSTER, REPLICATE, "<node.0.id>"], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [SSUBSCRIBE, sch], node: 1, connection: ssub, expect: {equals: [ssubscribe,
          sch, 1]}}
    - {command: [SPUBLISH, sch, shard-light-payload], node: 0, expect: {equals: 0}}
    - {read: true, node: 1, connection: ssub, expect: {equals: [[smessage, sch, shard-light-payload]]}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [pubsub.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: pubsub}
