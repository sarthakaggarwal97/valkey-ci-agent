extends: [valkey.liveness]
id: proposed.zset-btree-deeptree-prefix-compare
deployment:
  modes: [standalone]
metadata:
  description: Multi-level B+tree zsets with long shared member prefixes, mass re-scores
    and drains, compared across builds
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    listpack_entries: {type: integer, enum: [0, 128], default: 0}
components:
- use: valkey.action.commands
  id: deep
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    timeout_s: 60
    server_config:
      zset-max-listpack-entries: {$ref: inputs.listpack_entries}
      zset-max-listpack-value: 64
      enable-debug-command: "yes"
    commands:
    - command:
      - EVAL
      - |
        for i=0,4999 do
          redis.call('ZADD','deep',i*0.25,string.format('m%07d',i))
        end
        return redis.call('ZCARD','deep')
      - "0"
      expect: {equals: 5000}
    - command: [OBJECT, ENCODING, deep]
      expect_difference: true
      expect: {equals: btree}
    - command: [DEBUG, HTSTATS-KEY, deep]
      compare: skip
      expect: {error: false}
    - command: [DEBUG, DIGEST-VALUE, deep]
      expect: {error: false}
    - command: [ZCOUNT, deep, 100, 200]
      expect: {equals: 401}
    - command: [ZRANGEBYSCORE, deep, "(612.25", "(750.5", LIMIT, 5, 50]
      expect: {exists: true}
    - command: [ZRANK, deep, m0002449]
      expect: {equals: 2449}
    - command: [ZREVRANK, deep, m0002449]
      expect: {equals: 2550}
    - command: [ZRANGE, deep, 2900, 3100, WITHSCORES]
      expect: {exists: true}
    - command:
      - EVAL
      - |
        local ch=0
        for i=0,1999,2 do
          ch=ch+redis.call('ZADD','deep','XX','CH',100000-i,string.format('m%07d',i))
        end
        return ch
      - "0"
      expect: {equals: 1000}
    - command: [ZRANGE, deep, -5, -1, WITHSCORES]
      expect: {exists: true}
    - command: [ZREMRANGEBYRANK, deep, 1000, 3999]
      expect: {equals: 3000}
    - command: [ZCARD, deep]
      expect: {equals: 2000}
    - command:
      - EVAL
      - |
        for i=1,999 do redis.call('ZPOPMIN','deep') end
        return redis.call('ZCARD','deep')
      - "0"
      expect: {equals: 1001}
    - command:
      - EVAL
      - |
        for i=1,1000 do redis.call('ZPOPMAX','deep') end
        return redis.call('ZCARD','deep')
      - "0"
      expect: {equals: 1}
    - command: [ZRANGE, deep, 0, -1, WITHSCORES]
      expect: {exists: true}
    - command: [DEL, deep]
      expect: {equals: 1}
    - command:
      - EVAL
      - |
        local p=string.rep('P',300)
        for i=1,400 do
          redis.call('ZADD','pfx',0,p..string.format('%05d',i))
        end
        redis.call('ZADD','pfx',0,p)
        return redis.call('ZCARD','pfx')
      - "0"
      expect: {equals: 401}
    - command: [ZLEXCOUNT, pfx, "-", "+"]
      expect: {equals: 401}
    - command: [ZRANGEBYLEX, pfx, "-", "+", LIMIT, 0, 3]
      expect: {exists: true}
    - command:
      - EVAL
      - |
        local p=string.rep('P',300)
        return #redis.call('ZRANGEBYLEX','pfx','['..p..'00100','('..p..'00200')
      - "0"
      expect: {equals: 100}
    - command:
      - EVAL
      - |
        return redis.call('ZRANK','pfx',string.rep('P',300))
      - "0"
      expect: {equals: 0}
    - command: [DEBUG, HTSTATS-KEY, pfx]
      compare: skip
      expect: {error: false}
    - command: [DEBUG, DIGEST-VALUE, pfx]
      expect: {error: false}
    - command:
      - EVAL
      - |
        local p=string.rep('P',300)
        for i=1,400 do
          redis.call('ZADD','pfx',i%7,p..string.format('%05d',i))
        end
        return redis.call('ZCARD','pfx')
      - "0"
      expect: {equals: 401}
    - command: [ZRANGEBYSCORE, pfx, 3, 3, LIMIT, 0, 2]
      expect: {exists: true}
    - command: [ZREMRANGEBYSCORE, pfx, 1, 4]
      expect: {equals: 229}
    - command:
      - EVAL
      - |
        for i=1,172 do redis.call('ZPOPMAX','pfx') end
        return redis.call('ZCARD','pfx')
      - "0"
      expect: {equals: 0}
    - command: [EXISTS, pfx]
      expect: {equals: 0}
    checks:
      acl: true
      compat: true
      variants: true
required_events: [deep.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: deep}
