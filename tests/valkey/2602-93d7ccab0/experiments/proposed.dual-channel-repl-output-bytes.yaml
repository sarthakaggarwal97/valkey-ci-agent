extends: [valkey.liveness]
id: proposed.dual-channel-repl-output-bytes
deployment:
  modes: [standalone]
metadata:
  description: A dual-channel full sync adds the RDB child's socket bytes to total_net_repl_output_bytes;
    the parent build leaves them uncounted
inputs:
  required: [parent]
  properties:
    parent:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "The parent commit's build, {$ref: artifacts.parent.binary}"
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: dual-sync
  config:
    compare_with: {$ref: inputs.parent}
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 120
    server_config:
      repl-diskless-sync: "yes"
      repl-diskless-sync-delay: "0"
      dual-channel-replication-enabled: "yes"
      rdbcompression: "no"
    commands:
    - {command: [DEBUG, POPULATE, "2000"], expect: {equals: OK}}
    - {command: [CONFIG, RESETSTAT], expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [EVAL, "local i=redis.call('INFO','replication') return string.match(i,'master_link_status:(%a+)')",
        "0"], node: 1, wait_s: 30, expect: {equals: up}}
    - {command: [EVAL, "local i=redis.call('INFO','stats') return string.match(i,'sync_full:(%d+)')",
        "0"], wait_s: 30, expect: {equals: "1"}}
    - {command: [EVAL, "local i=redis.call('INFO','stats') local v=tonumber(string.match(i,'total_net_repl_output_bytes:(%d+)'))\
          \ if v>20000 then return 'counted' else return 'not-counted' end", "0"],
      wait_s: 30, expect_difference: true, expect: {equals: counted}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [dual-sync.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: dual-sync}
