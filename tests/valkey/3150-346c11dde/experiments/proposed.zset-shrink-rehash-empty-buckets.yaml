extends: [valkey.liveness]
id: proposed.zset-shrink-rehash-empty-buckets
deployment:
  modes: [standalone]
metadata:
  description: Shrink-rehash of a large zset hashtable skips empty buckets; the new
    build finishes the 4096-bucket shrink within 2000 ops, the parent cannot, and
    no entry is lost
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: shrink
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server_config: {zset-max-listpack-entries: 0, activerehashing: "no", save: ""}
    resp: {$ref: inputs.resp}
    timeout_s: 120
    commands:
    - {command: [EVAL, "for i=0,19999 do redis.call('zadd', KEYS[1], i, i) end return\
          \ redis.call('zcard', KEYS[1])", 1, myzset], expect: {equals: 20000}}
    - {command: [DEBUG, HTSTATS-KEY, myzset, full], compare: skip, expect: {contains: "top-level\
          \ buckets: 4096"}}
    - {command: [DEBUG, DICT-RESIZING, 0], expect: {equals: OK}}
    - {command: [ZREMRANGEBYRANK, myzset, 2, -1], expect: {equals: 19998}}
    - {command: [DEBUG, DICT-RESIZING, 1], expect: {equals: OK}}
    - {command: [ZREM, myzset, 1], expect: {equals: 1}}
    - {command: [ZCARD, myzset], expect: {equals: 1}}
    - {command: [OBJECT, ENCODING, myzset], compare: skip, expect: {equals: skiplist}}
    - {command: [DEBUG, HTSTATS-KEY, myzset], compare: skip, expect: {contains: "rehashing\
          \ index: 0"}}
    - {command: [DEBUG, HTSTATS-KEY, myzset], compare: skip, expect: {contains: "table\
          \ size: 7"}}
    - {command: [ZSCORE, myzset, "0"], expect: {in: ["0", 0]}}
    - {command: [EVAL, "for i=0,1999 do redis.call('zadd', KEYS[1], i, i) end return\
          \ redis.call('zcard', KEYS[1])", 1, myzset], expect: {equals: 2000}}
    - {command: [DEBUG, HTSTATS-KEY, myzset], expect_difference: true, expect: {contains: "rehashing\
          \ index: -1"}}
    - {command: [ZCARD, myzset], expect: {equals: 2000}}
    - {command: [ZRANGE, myzset, 0, -1]}
    - {command: [EVAL, "local t=redis.call('zrange', KEYS[1], 0, -1) local s=0 for\
          \ i=1,#t do s=s+tonumber(t[i]) end return s", 1, myzset], expect: {equals: 1999000}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [shrink.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: shrink}
