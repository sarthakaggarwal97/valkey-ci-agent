extends: [valkey.liveness]
id: proposed.dict-wrapper-replica
deployment:
  modes: [standalone]
metadata:
  description: >-
    MIGRATE socket cache (migrateCacheDictType) and the writable-replica expire tracking
    dict (replicaKeysWithExpire, dictAddOrFind plus dictSetKey) behave identically
    on the hashtable-backed dict wrapper.
components:
- use: valkey.action.commands
  id: repl
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 60
    commands:
    - {command: [SET, mkey, mval], expect: {equals: OK}}
    - {command: [MIGRATE, <node.1.host>, <node.1.port>, mkey, 0, 5000], expect: {
        equals: OK}}
    - {command: [GET, mkey], node: 1, expect: {equals: mval}}
    - {command: [EXISTS, mkey], expect: {equals: 0}}
    - {command: [SET, mkey2, mval2], expect: {equals: OK}}
    - {command: [MIGRATE, <node.1.host>, <node.1.port>, mkey2, 0, 5000], expect: {
        equals: OK}}
    - {command: [INFO, stats], compare: skip, expect: {contains: "migrate_cached_sockets:1"}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [SET, rkey, rval], expect: {equals: OK}}
    - {command: [GET, rkey], node: 1, wait_s: 10, expect: {equals: rval}}
    - {command: [CONFIG, SET, replica-read-only, no], node: 1, expect: {equals: OK}}
    - {command: [SET, localexp, v1], node: 1, expect: {equals: OK}}
    - {command: [PEXPIRE, localexp, 200], node: 1, expect: {equals: 1}}
    - {command: [SET, localexp2, v2, PX, 150], node: 1, expect: {equals: OK}}
    - {command: [INFO, stats], node: 1, compare: skip, expect: {contains: slave_expires_tracked_keys}}
    - {command: [EXISTS, localexp], node: 1, wait_s: 15, expect: {equals: 0}}
    - {command: [EXISTS, localexp2], node: 1, wait_s: 15, expect: {equals: 0}}
    - {command: [SET, pexp, v, PX, 100], expect: {equals: OK}}
    - {command: [EXISTS, pexp], node: 1, wait_s: 15, expect: {equals: 0}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
