extends: [valkey.liveness]
id: proposed.function-flush-engine-abi-compare
deployment:
  modes: [standalone]
metadata:
  description: FUNCTION FLUSH with a module scripting engine (HELLO) loaded beside
    Lua; the new per-engine reset_env iteration must flush both engines and release
    the Lua function VM
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: engines
  config:
    compare_with: {$ref: artifacts.parent.binary}
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
    - {command: [FUNCTION, LOAD, "#!hello name=mylib\nFUNCTION foo\nARGS 0\nRETURN\n\
          FUNCTION bar\nCONSTI 432\nRETURN"], expect: {equals: mylib}}
    - {command: [FCALL, foo, 0, 123], expect: {equals: 123}}
    - {command: [FCALL, bar, 0], expect: {equals: 432}}
    - {command: [FUNCTION, LOAD, "#!lua name=heavy1\nlocal big = {} for i=1,400 do\
          \ big[i] = string.rep('a', 8192) .. i end server.register_function('h1',\
          \ function() return #big end)"], expect: {equals: heavy1}}
    - {command: [FUNCTION, LOAD, "#!lua name=heavy2\nlocal big = {} for i=1,400 do\
          \ big[i] = string.rep('b', 8192) .. i end server.register_function('h2',\
          \ function() return #big end)"], expect: {equals: heavy2}}
    - {command: [FUNCTION, LOAD, "#!lua name=heavy3\nlocal big = {} for i=1,400 do\
          \ big[i] = string.rep('c', 8192) .. i end server.register_function('h3',\
          \ function() return #big end)"], expect: {equals: heavy3}}
    - {command: [FCALL, h1, 0], expect: {equals: 400}}
    - {command: [FUNCTION, FLUSH, ASYNC], expect: {equals: OK}}
    - {command: [FCALL, foo, 0, 123], expect: {error: "Function not found"}}
    - {command: [FCALL, h1, 0], expect: {error: "Function not found"}}
    - {command: [EVAL, "local info = server.call('INFO','memory') local m = tonumber(string.match(info,\
          \ 'used_memory_vm_functions:(%d+)')) if m ~= nil and m < 5000000 then return\
          \ 1 else return 0 end", 0], expect_difference: true, expect: {equals: 1}}
    - {command: [FUNCTION, LOAD, "#!hello name=mylib\nFUNCTION foo\nARGS 0\nRETURN\n\
          FUNCTION bar\nCONSTI 432\nRETURN"], expect: {equals: mylib}}
    - {command: [FCALL, bar, 0], expect: {equals: 432}}
    - {command: [FUNCTION, LOAD, "#!lua name=heavy1\nlocal big = {} for i=1,400 do\
          \ big[i] = string.rep('a', 8192) .. i end server.register_function('h1',\
          \ function() return #big end)"], expect: {equals: heavy1}}
    - {command: [FCALL, h1, 0], expect: {equals: 400}}
    - {command: [FUNCTION, FLUSH, SYNC], expect: {equals: OK}}
    - {command: [FUNCTION, LIST], expect: {equals: []}}
    - {command: [FUNCTION, LOAD, "#!hello name=mylib\nFUNCTION foo\nARGS 0\nRETURN\n\
          FUNCTION bar\nCONSTI 432\nRETURN"], expect: {equals: mylib}}
    - {command: [FCALL, foo, 0, 55], expect: {equals: 55}}
    checks:
      acl: true
      compat: true
      variants: true
required_events: [engines.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: engines}
