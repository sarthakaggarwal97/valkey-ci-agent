extends: [valkey.liveness]
id: proposed.acl-db-log-dbid-resp3
deployment:
  modes: [standalone]
metadata:
  description: ACL LOG object carries the exact denied dbid for COPY over RESP3, where
    entries reply as maps
components:
- use: valkey.action.commands
  id: log3
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server_config: {databases: 256}
    resp: 3
    timeout_s: 10
    commands:
    - {command: [ACL, SETUSER, dbuser, on, ">pass", "~*", "&*", "+@all", "db=0,1"],
      expect: {equals: OK}}
    - {command: [AUTH, dbuser, pass], connection: u, expect: {equals: OK}}
    - {command: [SET, src, hello], connection: u, expect: {equals: OK}}
    - {command: [ACL, LOG, RESET], expect: {equals: OK}}
    - {command: [COPY, src, dst, DB, 2], connection: u, expect: {error: "NOPERM"}}
    - {command: [ACL, LOG], expect_difference: true, expect: {contains: "'object':\
          \ '2'"}}
    - {command: [ACL, LOG, RESET], expect: {equals: OK}}
    - {command: [COPY, src, dst, DB, 1, DB, 2, REPLACE], connection: u, expect: {
        error: "NOPERM"}}
    - {command: [ACL, LOG], expect_difference: true, expect: {contains: "'object':\
          \ '2'"}}
    - {command: [ACL, LOG, RESET], expect: {equals: OK}}
    - {command: [COPY, src, dst, REPLACE, DB, 255], connection: u, expect: {error: "NOPERM"}}
    - {command: [ACL, LOG], expect_difference: true, expect: {contains: "'object':\
          \ '255'"}}
    - {command: [ACL, LOG, RESET], expect: {equals: OK}}
    - {command: [SELECT, 2], connection: u, expect: {error: "NOPERM"}}
    - {command: [ACL, LOG], compare: skip, expect: {contains: "'object': '2'"}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [log3.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: log3}
