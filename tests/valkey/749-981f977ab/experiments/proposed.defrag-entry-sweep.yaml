extends: [valkey.liveness]
id: proposed.defrag-entry-sweep
deployment:
  modes: [standalone]
metadata:
  description: Force active defrag over a fragmented keyspace of embedded entries
    (db keys) and chained normal entries (big hash, big zset, expires), driving the
    rewritten dictDefragBucket normal and embedded branches and the normal branch
    of dictGetNextRef, then verify the data survived relocation intact
components:
- use: valkey.action.commands
  id: sweep
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server_config: {hash-max-listpack-entries: 8, zset-max-listpack-entries: 8}
    resp: 2
    timeout_s: 120
    commands:
    - {command: [CONFIG, SET, active-defrag-threshold-lower, 0], expect: {equals: OK}}
    - {command: [CONFIG, SET, active-defrag-ignore-bytes, 1], expect: {equals: OK}}
    - {command: [CONFIG, SET, active-defrag-cycle-min, 40], expect: {equals: OK}}
    - {command: [CONFIG, SET, active-defrag-cycle-max, 99], expect: {equals: OK}}
    - {command: [DEBUG, POPULATE, 150000], expect: {equals: OK}}
    - {command: [EVAL, "local n=0 for i=0,149999 do if i%3~=0 then n=n+redis.call('DEL','key(colon)'..i)\
          \ end end return n", 0], expect: {equals: 100000}}
    - {command: [EVAL, "for i=1,20000 do redis.call('HSET','h','f'..i,string.rep('x',(i%37)+1))\
          \ end return redis.call('HLEN','h')", 0], expect: {equals: 20000}}
    - {command: [EVAL, "local n=0 for i=1,20000,2 do n=n+redis.call('HDEL','h','f'..i)\
          \ end return n", 0], expect: {equals: 10000}}
    - {command: [EVAL, "for i=1,20000 do redis.call('ZADD','z',i,'m'..i..string.rep('y',i%29))\
          \ end return redis.call('ZCARD','z')", 0], expect: {equals: 20000}}
    - {command: [EVAL, "local n=0 for i=1,20000,2 do n=n+redis.call('ZREM','z','m'..i..string.rep('y',i%29))\
          \ end return n", 0], expect: {equals: 10000}}
    - {command: [EVAL, "local n=0 for i=0,149999,3 do n=n+redis.call('PEXPIRE','key(colon)'..i,7200000)\
          \ end return n", 0], expect: {equals: 50000}}
    - {command: [CONFIG, SET, activedefrag, yes], expect: {equals: OK}}
    - {command: [EVAL, "local s=redis.call('INFO','stats') local h=tonumber(string.match(s,'active_defrag_hits(colon)(%d+)'))\
          \ if h and h>0 then return 1 end return 0", 0], wait_s: 45, expect: {equals: 1}}
    - {command: [CONFIG, SET, activedefrag, no], expect: {equals: OK}}
    - {command: [HLEN, h], expect: {equals: 10000}}
    - {command: [HGET, h, f2], expect: {equals: "xxx"}}
    - {command: [ZCARD, z], expect: {equals: 10000}}
    - {command: [ZSCORE, z, m58], expect: {equals: "58"}}
    - {command: [DBSIZE], expect: {equals: 50002}}
    - {command: [GET, "key:3"], expect: {equals: "value:3"}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [sweep.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: sweep}
