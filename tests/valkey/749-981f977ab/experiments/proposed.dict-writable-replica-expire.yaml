extends: [valkey.liveness]
id: proposed.dict-writable-replica-expire
deployment:
  modes: [standalone]
metadata:
  description: Writable-replica expires drive the rewritten dictSetKey dispatch and
    the unsigned-integer entry value get/set paths in replicaKeysWithExpire, compared
    against the parent build
components:
- use: valkey.action.commands
  id: repl-expire
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 60
    commands:
    - {command: [SET, rk, v0], expect: {equals: OK}}
    - {command: [SELECT, 1], expect: {equals: OK}}
    - {command: [SET, rk, v1], expect: {equals: OK}}
    - {command: [SELECT, 0], expect: {equals: OK}}
    - {command: [REPLICAOF, '<node.0.host>', '<node.0.port>'], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: 'master_link_status:up'}}
    - {command: [CONFIG, SET, replica-read-only, no], node: 1, expect: {equals: OK}}
    - {command: [GET, rk], node: 1, wait_s: 20, expect: {equals: v0}}
    - {command: [EXPIRE, rk, 100], node: 1, expect: {equals: 1}}
    - {command: [SELECT, 1], node: 1, expect: {equals: OK}}
    - {command: [GET, rk], node: 1, wait_s: 20, expect: {equals: v1}}
    - {command: [EXPIRE, rk, 1], node: 1, expect: {equals: 1}}
    - {command: [EXISTS, rk], node: 1, wait_s: 30, expect: {equals: 0}}
    - {command: [SELECT, 0], node: 1, expect: {equals: OK}}
    - {command: [TTL, rk], node: 1, compare: skip, expect: {min: 1}}
    - {command: [EXISTS, rk], node: 1, expect: {equals: 1}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [repl-expire.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl-expire}
