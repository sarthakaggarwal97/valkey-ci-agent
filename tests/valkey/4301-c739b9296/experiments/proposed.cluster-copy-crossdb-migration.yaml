extends: [valkey.liveness]
id: proposed.cluster-copy-crossdb-migration
deployment:
  modes: [standalone, cluster]
metadata:
  description: Cross-DB COPY routing during a migrating slot blocks an order-independent
    DB clause and rejects a valueless DB token instead of reading out of bounds
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: copy
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 20
    commands:
    - {command: [SET, "{123456789}key1", v1], expect: {equals: OK}}
    - {command: [SET, "{123456789}key2", v2], expect: {equals: OK}}
    - {command: [CLUSTER, SETSLOT, 12739, MIGRATING, "<node.1.id>"], expect: {equals: OK}}
    - {command: [COPY, "{123456789}key1", "{123456789}key2", REPLACE, DB, 7], expect_difference: true,
      expect: {error: "TRYAGAIN"}}
    - {command: [COPY, "{123456789}key1", "{123456789}key2", DB, 0, DB, 7], expect_difference: true,
      expect: {error: "TRYAGAIN"}}
    - {command: [COPY, "{123456789}key1", "{123456789}key2", DB], expect_difference: true,
      expect: {error: "syntax error"}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_evidence:
- {evidence_id: valkey.command.sequence, source: copy}
