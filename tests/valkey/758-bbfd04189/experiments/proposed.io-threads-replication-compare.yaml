extends: [valkey.liveness]
id: proposed.io-threads-replication-compare
deployment:
  modes: [standalone]
metadata:
  description: Full sync, disconnect, resync and a raw PSYNC handshake between two
    nodes running 8 IO threads, exercising waitForClientIO before the client becomes
    a replica
components:
- use: valkey.action.commands
  id: repl
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server_config: {io-threads: 8}
    nodes: 2
    resp: 2
    timeout_s: 60
    commands:
    - {command: [CONFIG, SET, events-per-io-thread, "0"], expect_difference: true,
      expect: {equals: OK}}
    - {command: [CONFIG, SET, events-per-io-thread, "0"], node: 1, expect_difference: true,
      expect: {equals: OK}}
    - {command: [SET, k1, v1], expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [SET, k2, v2], expect: {equals: OK}}
    - {command: [GET, k2], node: 1, wait_s: 30, expect: {equals: v2}}
    - {command: [GET, k1], node: 1, expect: {equals: v1}}
    - {command: [REPLICAOF, NO, ONE], node: 1, expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [SET, k3, v3], expect: {equals: OK}}
    - {command: [GET, k3], node: 1, wait_s: 30, expect: {equals: v3}}
    - {raw: "REPLCONF listening-port 9999\r\nPSYNC ? -1\r\n", connection: fake, compare: skip}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
