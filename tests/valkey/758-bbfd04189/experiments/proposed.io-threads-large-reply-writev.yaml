extends: [valkey.liveness]
id: proposed.io-threads-large-reply-writev
deployment:
  modes: [standalone]
metadata:
  description: Large replies on clients offloaded to active IO threads exercise the
    writevToClient multi-block loop, the NET_MAX_WRITES_PER_EVENT segmentation and
    empty-block skip
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: bigio
  config:
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
    - {command: [SETRANGE, big, "1048575", x], expect: {equals: 1048576}}
    - {command: [STRLEN, big], expect: {equals: 1048576}}
    - {command: [APPEND, big2, ""], expect: {equals: 0}}
    - {command: [SETRANGE, big2, "524287", y], expect: {equals: 524288}}
    - {command: [GET, big], expect: {exists: true}}
    - {command: [GET, big], expect: {exists: true}}
    - {command: [GET, big], connection: c2, expect: {exists: true}}
    - {command: [GET, big2], connection: c3, expect: {exists: true}}
    - {command: [GET, big], connection: c4, expect: {exists: true}}
    - {command: [MGET, big, big2, big], connection: c5, expect: {exists: true}}
    - {command: [GET, big2], expect: {exists: true}}
    - {command: [STRLEN, big2], expect: {equals: 524288}}
required_events: [bigio.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: bigio}
