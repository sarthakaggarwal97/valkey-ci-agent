extends: [valkey.liveness]
id: proposed.module-block-timeout
deployment:
  modes: [standalone]
metadata:
  description: RM_BlockClient without keys must honour timeout_ms; the parent never
    set bstate.timeout, so a module-blocked client never timed out
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: blocktimeout
  config:
    compare_with: {$ref: artifacts.parent.binary}
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 15
    commands:
    - {command: [block.debug, 3000, 200], expect_difference: true, expect: {equals: "Request\
          \ timedout"}}
    - {command: [block.debug, 100, 2000], compare: skip, expect: {min: 0}}
    - {command: [block.debug_no_track, 3000, 1], expect_difference: true, expect: {
        equals: "Request timedout"}}
    - {command: [block.debug, 2000, -1], expect_difference: true, expect: {equals: "Request\
          \ timedout"}}
    - {command: [block.debug, 10, 9223372036854775807], expect: {error: "timeout is\
          \ out of range"}}
    - {raw: "block.block 2000\r\n", connection: blocker}
    - {command: [block.is_blocked], expect: {equals: 1}}
    - {command: [block.is_blocked], wait_s: 8, expect_difference: true, expect: {
        equals: 0}}
    - {read: true, connection: blocker, expect_difference: true, expect: {equals: [
          "Timed out"]}}
    - {command: [block.release, bye], expect_difference: true, expect: {error: "No\
          \ blocked client"}}
    checks:
      acl: true
      compat: true
      variants: true
required_events: [blocktimeout.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: blocktimeout}
