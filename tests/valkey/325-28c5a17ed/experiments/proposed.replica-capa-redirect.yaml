extends: [valkey.liveness]
id: proposed.replica-capa-redirect
deployment:
  modes: [standalone]
metadata:
  description: A standalone replica redirects reads and writes of a capa-redirect
    client to its primary; READONLY exempts reads only, capa survives RESET, and a
    redirected EXEC does not discard the transaction
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    replica_read_only: {type: string, enum: ["yes", "no"], default: "yes"}
components:
- use: valkey.action.commands
  id: redirect
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    server_config: {replica-read-only: {$ref: inputs.replica_read_only}}
    timeout_s: 15
    commands:
    - {command: [CLIENT, CAPA, redirect], node: 1, connection: tx, expect_difference: true,
      expect: {equals: OK}}
    - {command: [MULTI], node: 1, connection: tx, expect: {equals: OK}}
    - {command: [SET, txkey, v1], node: 1, connection: tx, expect: {equals: QUEUED}}
    - {command: [SET, foo, bar], node: 0, expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [GET, foo], node: 1, wait_s: 30, expect: {equals: bar}}
    - {command: [SET, k2, v2], node: 1}
    - {command: [CLIENT, CAPA, redirect], node: 1, expect_difference: true, expect: {
        equals: OK}}
    - {command: [SET, foo, quux], node: 1, expect_difference: true, expect: {error: "REDIRECT"}}
    - {command: [GET, foo], node: 1, expect_difference: true, expect: {error: ":<node.0.port>"}}
    - {command: [PING], node: 1, expect: {equals: PONG}}
    - {command: [ECHO, hi], node: 1, expect: {equals: hi}}
    - {command: [READONLY], node: 1, expect_difference: true, expect: {equals: OK}}
    - {command: [GET, foo], node: 1, expect: {equals: bar}}
    - {command: [SET, foo, x], node: 1, expect_difference: true, expect: {error: "REDIRECT"}}
    - {command: [READWRITE], node: 1, expect_difference: true, expect: {equals: OK}}
    - {command: [GET, foo], node: 1, expect_difference: true, expect: {error: "REDIRECT"}}
    - {command: [RESET], node: 1, expect: {equals: RESET}}
    - {command: [GET, foo], node: 1, expect_difference: true, expect: {error: "REDIRECT"}}
    - {command: [EXEC], node: 1, connection: tx, expect_difference: true, expect: {
        error: "REDIRECT"}}
    - {command: [EXEC], node: 1, connection: tx, expect_difference: true, expect: {
        error: "REDIRECT"}}
    - {command: [DISCARD], node: 1, connection: tx, expect_difference: true, expect: {
        equals: OK}}
    - {command: [EXEC], node: 1, connection: tx, expect: {error: "without MULTI"}}
    - {command: [CLIENT, CAPA, redirect], node: 1, connection: tx2, expect_difference: true,
      expect: {equals: OK}}
    - {command: [MULTI], node: 1, connection: tx2, expect: {equals: OK}}
    - {command: [SET, foo, y], node: 1, connection: tx2, expect_difference: true,
      expect: {error: "REDIRECT"}}
    - {command: [GET, foo], node: 1, connection: tx2, expect_difference: true, expect: {
        error: "REDIRECT"}}
    - {command: [PING], node: 1, connection: tx2, expect: {equals: QUEUED}}
    - {command: [EXEC], node: 1, connection: tx2, expect_difference: true, expect: {
        equals: [PONG]}}
    - {command: [GET, foo], node: 0, expect: {equals: bar}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [redirect.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: redirect}
