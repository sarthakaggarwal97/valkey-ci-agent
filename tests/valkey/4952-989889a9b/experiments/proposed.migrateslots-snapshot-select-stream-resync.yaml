extends: [valkey.liveness]
id: proposed.migrateslots-snapshot-select-stream-resync
deployment:
  modes: [standalone]
metadata:
  description: >
    Only the streamed writes before the first SELECT the parent emits on the migration
    link are misapplied by the parent build: a db 5 write resyncs the link's db, and
    later db 0 writes land correctly on both builds.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    databases: {type: integer, minimum: 16, maximum: 256, default: 16}
components:
- use: valkey.action.commands
  id: migrate
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 2
    resp: {$ref: inputs.resp}
    server_config:
      cluster-databases: {$ref: inputs.databases}
    timeout_s: 180
    commands:
    - {command: [SET, "{foo}pad0", p], expect: {equals: OK}}
    - {command: [SET, "{foo}pad1", p], expect: {equals: OK}}
    - {command: [SET, "{foo}pad2", p], expect: {equals: OK}}
    - {command: [SET, "{foo}pad3", p], expect: {equals: OK}}
    - {command: [SET, "{foo}pad4", p], expect: {equals: OK}}
    - {command: [SELECT, "15"], expect: {equals: OK}}
    - {command: [SET, "{foo}balance", "500"], expect: {equals: OK}}
    - {command: [SELECT, "0"], expect: {equals: OK}}
    - {command: [CONFIG, SET, rdb-key-save-delay, "200000"], expect: {equals: OK}}
    - {command: [DEBUG, SLOTMIGRATION, PREVENT-PAUSE, "1"], expect: {equals: OK}}
    - {command: [DEBUG, SLOTMIGRATION, PREVENT-PAUSE, "1"], node: 1, expect: {equals: OK}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, "12182", "12182", NODE, "<node.1.id>"],
      expect: {equals: OK}}
    - {command: [CLUSTER, COUNTKEYSINSLOT, "12182"], node: 1, wait_s: 60, expect: {
        min: 1}}
    - {command: [SET, "{foo}s1", v1], expect: {equals: OK}}
    - {command: [SELECT, "5"], expect: {equals: OK}}
    - {command: [SET, "{foo}s2", v2], expect: {equals: OK}}
    - {command: [SELECT, "0"], expect: {equals: OK}}
    - {command: [SET, "{foo}s3", v3], expect: {equals: OK}}
    - {command: [CONFIG, SET, rdb-key-save-delay, "0"], expect: {equals: OK}}
    - {command: [DEBUG, SLOTMIGRATION, PREVENT-PAUSE, "0"], expect: {equals: OK}}
    - {command: [DEBUG, SLOTMIGRATION, PREVENT-PAUSE, "0"], node: 1, expect: {equals: OK}}
    - {command: [CLUSTER, COUNTKEYSINSLOT, "12182"], wait_s: 60, expect: {equals: 0}}
    - {command: [GET, "{foo}s1"], node: 1, wait_s: 15, expect_difference: true, expect: {
        equals: v1}}
    - {command: [GET, "{foo}s3"], node: 1, expect: {equals: v3}}
    - {command: [SELECT, "5"], node: 1, expect: {equals: OK}}
    - {command: [GET, "{foo}s2"], node: 1, expect: {equals: v2}}
    - {command: [SELECT, "15"], node: 1, expect: {equals: OK}}
    - {command: [GET, "{foo}s1"], node: 1, expect_difference: true, expect: {exists: false}}
    - {command: [GET, "{foo}balance"], node: 1, expect: {equals: "500"}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [migrate.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: migrate}
