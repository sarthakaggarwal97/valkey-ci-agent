extends: [valkey.liveness]
id: proposed.benchmark-rps-cluster
deployment:
  modes: [standalone]
metadata:
  description: valkey-benchmark --cluster with --rps against a one-node cluster, where
    thread count defaults to the node count and per-thread paused-client lists carry
    the rate limiting
components:
- use: valkey.action.tools
  id: bench-rps-cluster
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server: true
    cluster: true
    timeout_s: 90
    runs:
    - {tool: valkey-benchmark, args: [-p, $port, --cluster, -t, set, -n, 2000, -c,
        20, --rps, 1000, -q], expect_difference: true, expect: {exit: {equals: 0},
        stdout: {contains: requests per second}}}
    - {tool: valkey-benchmark, args: [-p, $port, --cluster, --threads, 3, -t, set,
        -n, 3000, -c, 30, -P, 4, --rps, 1500, -q], expect_difference: true, expect: {
        exit: {equals: 0}, stdout: {contains: requests per second}}}
    - {tool: valkey-benchmark, args: [-p, $port, --cluster, -t, set, -n, 20, -c, 40,
        --rps, 40, -q], expect_difference: true, expect: {exit: {equals: 0}, stdout: {
          contains: requests per second}}}
required_events: [bench-rps-cluster.completed]
required_evidence:
- {evidence_id: valkey.tool.runs, source: bench-rps-cluster}
