extends: [valkey.liveness]
id: proposed.slot-migration-hz1-roundtrip
deployment:
  modes: [standalone]
metadata:
  description: At hz 1 an atomic slot migration export must still reach its snapshot
    (cron ACKs no longer starve it); migrate a slot to the other node and back
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: migrate
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 90
    commands:
    - {command: [CONFIG, SET, hz, "1"], node: 0, expect: {equals: OK}}
    - {command: [CONFIG, SET, hz, "1"], node: 1, expect: {equals: OK}}
    - {command: [CLUSTER, KEYSLOT, "{foo}:1"], node: 0, expect: {equals: 12182}}
    - {command: [MSET, "{foo}:1", v1, "{foo}:2", v2, "{foo}:3", v3, "{foo}:4", v4,
        "{foo}:5", v5], node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, COUNTKEYSINSLOT, "12182"], node: 0, expect: {equals: 5}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, "12182", "12182", NODE, "<node.1.id>"],
      node: 0, wait_s: 10, expect: {equals: OK}}
    - {command: [CLUSTER, COUNTKEYSINSLOT, "12182"], node: 1, wait_s: 45, expect_difference: true,
      expect: {equals: 5}}
    - {command: [GET, "{foo}:1"], node: 0, wait_s: 40, expect_difference: true, expect: {
        error: "MOVED"}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, "12182", "12182", NODE, "<node.0.id>"],
      node: 1, wait_s: 20, expect_difference: true, expect: {equals: OK}}
    - {command: [GET, "{foo}:1"], node: 0, wait_s: 40, expect: {equals: v1}}
    - {command: [CLUSTER, COUNTKEYSINSLOT, "12182"], node: 1, wait_s: 30, expect: {
        equals: 0}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [migrate.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: migrate}
