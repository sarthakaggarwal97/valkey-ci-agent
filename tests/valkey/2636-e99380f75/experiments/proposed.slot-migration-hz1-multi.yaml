extends: [valkey.liveness]
id: proposed.slot-migration-hz1-multi
deployment:
  modes: [standalone]
metadata:
  description: At hz 1, two concurrent slot export jobs (a wide populated range and
    a tagged slot) must both snapshot and complete, with a BGSAVE child occupying
    the fork at migration start
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: migrate-multi
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 90
    commands:
    - {command: [CONFIG, SET, hz, "1"], node: 0, expect: {equals: OK}}
    - {command: [CONFIG, SET, hz, "1"], node: 1, expect: {equals: OK}}
    - {command: [DEBUG, POPULATE, "3000"], node: 0, expect: {equals: OK}}
    - {command: [MSET, "{foo}:1", v1, "{foo}:2", v2, "{foo}:3", v3, "{foo}:4", v4,
        "{foo}:5", v5], node: 0, expect: {equals: OK}}
    - {command: [BGSAVE], node: 0, expect: {contains: "Background saving started"}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, "0", "4999", NODE, "<node.1.id>",
        SLOTSRANGE, "12182", "12182", NODE, "<node.1.id>"], node: 0, wait_s: 10, expect: {
        equals: OK}}
    - {command: [CLUSTER, COUNTKEYSINSLOT, "12182"], node: 1, wait_s: 45, expect_difference: true,
      expect: {equals: 5}}
    - {command: [DBSIZE], node: 1, wait_s: 40, expect_difference: true, expect: {
        min: 500}}
    - {command: [CLUSTER, COUNTKEYSINSLOT, "12182"], node: 0, wait_s: 15, expect_difference: true,
      expect: {equals: 0}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [migrate-multi.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: migrate-multi}
