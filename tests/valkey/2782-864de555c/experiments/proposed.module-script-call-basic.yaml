extends: [valkey.liveness]
id: proposed.module-script-call-basic
deployment:
  modes: [standalone]
metadata:
  description: ValkeyModule_Call from the HELLO scripting engine runs server commands
    and returns their replies
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: scall
  config:
    compare_with: {$ref: artifacts.parent.binary}
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 15
    commands:
    - {command: [EVAL, "#!hello\nFUNCTION f\nCONSTS x\nCONSTI 43\nCONSTI 2\nCALL SET\n\
          RETURN\n", "0"], expect_difference: true, expect: {equals: OK}}
    - {command: [GET, x], expect_difference: true, expect: {equals: "43"}}
    - {command: [EVAL, "#!hello\nFUNCTION f\nCONSTS hello\nCONSTI 1\nCALL PING\nRETURN\n",
        "0"], expect_difference: true, expect: {equals: hello}}
    - {command: [EVAL, "#!hello\nFUNCTION f\nCONSTI 0\nCALL PING\nRETURN\n", "0"],
      expect_difference: true, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      variants: true
required_events: [scall.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: scall}
