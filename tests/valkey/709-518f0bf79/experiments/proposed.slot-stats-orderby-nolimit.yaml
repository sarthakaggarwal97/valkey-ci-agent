extends: [valkey.liveness]
id: proposed.slot-stats-orderby-nolimit
deployment:
  modes: [standalone]
metadata:
  description: CLUSTER SLOT-STATS ORDERBY without LIMIT must not read an uninitialized
    limit value
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: slotstats
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
    - {command: [CLUSTER, SLOT-STATS, ORDERBY, key-count, LIMIT, 5, DESC], expect: {
        exists: true}}
    - {command: [CLUSTER, SLOT-STATS, ORDERBY, key-count, DESC], expect_difference: true,
      expect: {exists: true}}
    - {command: [PING], expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_evidence:
- {evidence_id: valkey.command.sequence, source: slotstats}
