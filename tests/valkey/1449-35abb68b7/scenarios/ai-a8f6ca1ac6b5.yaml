scenario_id: ai-a8f6ca1ac6b5
seed: 11003
experiment:
  id: valkey.replication-chaos
  inputs:
    mutation_rate: 1500
    value_size: 1024
    wait_replicas: 1
    waves:
    - - op: stall
        target: replica
        duration_s: 2.0
      - op: kill
        target: primary
        signal: SIGKILL
        delay_s: 0.5
    - - op: promote
        target: replica
        mode: force
        split_s: 0.5
    - - op: repoint
        target: replica
        to: replica
      - op: backlog_pressure
        repl_backlog_size: 16384
        output_limit: 65536
        duration_s: 2.0
        delay_s: 0.2
deployment:
  mode: standalone
  replicas_per_primary: 3
  base_port: 7200
  server_config:
    io-threads: 4
    events-per-io-thread: 0
