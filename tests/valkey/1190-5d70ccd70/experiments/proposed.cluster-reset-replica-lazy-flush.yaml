extends: [valkey.liveness]
id: proposed.cluster-reset-replica-lazy-flush
deployment:
  modes: [standalone]
metadata:
  description: >-
    A replica's CLUSTER RESET flushes its dataset asynchronously under lazyfree-lazy-user-flush
    yes (lazyfreed_objects climbs on the candidate, stays 0 on the parent), stays
    synchronous under no, leaves DBSIZE 0 at once either way, and the reset node rejoins
    the cluster and full-syncs again afterwards.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    appendonly: {type: string, enum: ["no", "yes"], default: "no"}
    concurrency: {type: integer, minimum: 0, maximum: 16, default: 0}
components:
- use: valkey.action.commands
  id: reset
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 3
    resp: {$ref: inputs.resp}
    timeout_s: 15
    server_config:
      appendonly: {$ref: inputs.appendonly}
      cluster-node-timeout: 5000
    checks:
      concurrency: {$ref: inputs.concurrency}
    commands:
    - {command: [CONFIG, SET, lazyfree-lazy-user-flush, "yes"], node: 1, expect: {
        equals: OK}}
    - {command: [CONFIG, SET, lazyfree-lazy-user-flush, "no"], node: 2, expect: {
        equals: OK}}
    - {command: [DEBUG, POPULATE, 200000], node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, REPLICATE, "<node.0.id>"], node: 1, expect: {equals: OK}}
    - {command: [CLUSTER, REPLICATE, "<node.0.id>"], node: 2, expect: {equals: OK}}
    - {command: [DBSIZE], node: 1, wait_s: 30, expect: {equals: 200000}}
    - {command: [DBSIZE], node: 2, wait_s: 30, expect: {equals: 200000}}
    - {command: [CLUSTER, RESET, SOFT], node: 1, expect: {equals: OK}}
    - {command: [DBSIZE], node: 1, expect: {equals: 0}}
    - {command: [EVAL, "local i=redis.call('INFO','memory') local m=string.match(i,'lazyfreed_objects:(%d+)')\
          \ if m and tonumber(m)>=100000 then return 1 else return 0 end", 0], node: 1,
      wait_s: 10, expect_difference: true, expect: {equals: 1}}
    - {command: [CLUSTER, RESET, HARD], node: 2, expect: {equals: OK}}
    - {command: [DBSIZE], node: 2, expect: {equals: 0}}
    - {command: [EVAL, "local i=redis.call('INFO','memory') local m=string.match(i,'lazyfreed_objects:(%d+)')\
          \ if m and tonumber(m)==0 then return 1 else return 0 end", 0], node: 2,
      expect: {equals: 1}}
    - {command: [CLUSTER, MEET, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [CLUSTER, REPLICATE, "<node.0.id>"], node: 1, wait_s: 30, expect: {
        equals: OK}}
    - {command: [DBSIZE], node: 1, wait_s: 60, expect: {equals: 200000}}
    - {command: [PING], node: 0, expect: {equals: PONG}}
    - {command: [PING], node: 1, expect: {equals: PONG}}
    - {command: [PING], node: 2, expect: {equals: PONG}}
required_events: [reset.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: reset}
