extends: [valkey.liveness]
id: proposed.standalone-failover-psync
deployment:
  modes: [standalone]
metadata:
  description: REPLICAOF and coordinated FAILOVER (synced and FORCE-timeout) still
    pass full_sync_required=0 and keep the cached-primary psync behavior
components:
- use: valkey.action.commands
  id: failover
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 15
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [INFO, stats], node: 0, compare: skip, expect: {contains: "sync_partial_err:1"}}
    - {command: [SET, k1, v1], node: 0, expect: {equals: OK}}
    - {command: [WAIT, 1, 5000], node: 0, expect: {equals: 1}}
    - {command: [FAILOVER, TO, "<node.1.host>", "<node.1.port>"], node: 0, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 0, wait_s: 30, compare: skip, expect: {
        contains: "role:slave"}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "role:master"}}
    - {command: [INFO, stats], node: 1, compare: skip, expect: {contains: "sync_partial_ok:1"}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "state=online"}}
    - {command: [DEBUG, SLEEP, 5], node: 0, connection: blocker, compare: skip}
    - {command: [SET, k2, v2], node: 1, expect: {equals: OK}}
    - {command: [FAILOVER, TO, "<node.0.host>", "<node.0.port>", FORCE, TIMEOUT, 1000],
      node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 0, wait_s: 60, compare: skip, expect: {
        contains: "role:master"}}
    - {command: [INFO, replication], node: 1, wait_s: 60, compare: skip, expect: {
        contains: "role:slave"}}
    - {command: [INFO, replication], node: 1, wait_s: 60, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [GET, k1], node: 0, expect: {equals: v1}}
    - {connection: blocker, node: 0, read: true, compare: skip}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [failover.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: failover}
