extends: [valkey.liveness]
id: proposed.forced-failover-timeout
deployment:
  modes: [standalone]
metadata:
  description: Standalone FAILOVER TO FORCE with a short timeout against a stalled
    replica takes the timeout-expired forced path and the old primary demotes and
    relinks
inputs:
  required: [parent]
  properties:
    parent:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "The parent commit's build, {$ref: artifacts.parent.binary}"
components:
- use: valkey.action.commands
  id: forcedfo
  config:
    compare_with: {$ref: inputs.parent}
    nodes: 2
    timeout_s: 120
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 0, wait_s: 60, expect: {contains: "state=online"},
      compare: skip}
    - {command: [SET, k1, v1], node: 0, expect: {equals: OK}}
    - {command: [DEBUG, SLEEP, "5"], node: 1, connection: stall, expect: {equals: OK}}
    - {command: [SET, k2, v2], node: 0, expect: {equals: OK}}
    - {command: [SET, k3, v3], node: 0, expect: {equals: OK}}
    - {command: [FAILOVER, TO, "<node.1.host>", "<node.1.port>", FORCE, TIMEOUT, "100"],
      node: 0, expect: {equals: OK}}
    - {command: [INFO, replication], node: 0, wait_s: 60, expect: {contains: "role:slave"},
      compare: skip}
    - {command: [INFO, replication], node: 1, wait_s: 60, expect: {contains: "role:master"},
      compare: skip}
    - {command: [INFO, replication], node: 0, wait_s: 60, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [PING], node: 1, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [forcedfo.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: forcedfo}
