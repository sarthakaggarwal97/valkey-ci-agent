extends: [valkey.liveness]
id: proposed.ffc-cli-timeout-compare
deployment:
  modes: [standalone]
metadata:
  description: valkey-cli -t timeout parsing, now ffc.h instead of strtod, compared
    against the parent's valkey-cli
components:
- use: valkey.action.tools
  id: cli
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server: true
    runs:
    - {tool: valkey-cli, args: [-t, "5", -p, $port, PING], expect: {exit: {equals: 0},
        stdout: {contains: PONG}}}
    - {tool: valkey-cli, args: [-t, "5.", -p, $port, PING], expect: {exit: {equals: 0},
        stdout: {contains: PONG}}}
    - {tool: valkey-cli, args: [-t, "0x10", -p, $port, PING], expect_difference: true,
      expect: {exit: {equals: 1}, stderr: {contains: "Invalid connection timeout"}}}
    - {tool: valkey-cli, args: [-t, " 5", -p, $port, PING], expect_difference: true,
      expect: {exit: {equals: 1}, stderr: {contains: "Invalid connection timeout"}}}
required_evidence:
- {evidence_id: valkey.tool.runs, source: cli}
