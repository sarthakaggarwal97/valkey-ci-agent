extends: [valkey.liveness]
id: proposed.lua-string-hash-murmur
deployment:
  modes: [standalone]
metadata:
  description: >
    Lua string interning after the MurmurHash3 change in luaS_newlstr: tail lengths
    0-3, unaligned substring pointers into the block loop, 100k-string interning churn
    across luaS_resize rehashes, empty and binary keys, dead string resurrection,
    all compared against the parent build; pairs() iteration order over string-keyed
    tables is the reply the hash change alters, marked expect_difference.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: luahash
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - command:
      - EVAL
      - "local parts = {} for i = 0, 9 do parts[#parts+1] = string.rep('z', i) end\
        \ return table.concat(parts, '|')"
      - "0"
      expect: {equals: "|z|zz|zzz|zzzz|zzzzz|zzzzzz|zzzzzzz|zzzzzzzz|zzzzzzzzz"}
    - command:
      - EVAL
      - "local s = string.rep('abcdefgh', 4096) local acc = 0 for off = 1, 64 do local\
        \ sub = string.sub(s, off, off + 16381) acc = acc + #sub end return acc"
      - "0"
      expect: {equals: 1048448}
    - command:
      - EVAL
      - "local n = 0 for i = 1, 100000 do local s = 'str:' .. i .. ':' .. string.rep('q',\
        \ i % 7) if #s >= 6 then n = n + 1 end end return n"
      - "0"
      expect: {equals: 100000}
    - command:
      - EVAL
      - "local t = {} t[''] = 'empty' local b = string.char(0,1,2,3,0,255) t[b] =\
        \ 'bin' return {t[''], t[b], #b}"
      - "0"
      expect: {equals: [empty, bin, 6]}
    - command:
      - EVAL
      - "local a = 'resur:' .. 12345 a = nil pcall(collectgarbage, 'collect') local\
        \ b = 'resur:' .. 12345 return b"
      - "0"
      expect: {equals: "resur:12345"}
    - command:
      - EVAL
      - "return {KEYS[1], #ARGV[1], ARGV[1]}"
      - "1"
      - somekey
      - !!binary "AAECAwQ="
      expect:
        equals:
        - somekey
        - 5
        - !!binary "AAECAwQ="
    - command:
      - EVAL
      - "local t = {} for i = 1, 24 do t['k' .. string.rep('x', i) .. i] = i end local\
        \ r = {} for k in pairs(t) do r[#r+1] = k end return table.concat(r, ',')"
      - "0"
      expect_difference: true
      expect: {contains: "kx1"}
    - command:
      - EVAL
      - "local t = {} for i = 1, 16 do t[string.rep('A', 29 + i)] = i end local r\
        \ = {} for k in pairs(t) do r[#r+1] = #k end return table.concat(r, ',')"
      - "0"
      expect_difference: true
      expect: {contains: "30"}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [luahash.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: luahash}
