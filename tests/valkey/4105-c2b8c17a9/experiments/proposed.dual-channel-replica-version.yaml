extends: [valkey.liveness]
id: proposed.dual-channel-replica-version
deployment:
  modes: [standalone]
metadata:
  description: >-
    Dual-channel full sync of a hash with field TTLs. The fixed replica sends its
    version in the RDB-channel REPLCONF, so the primary picks RDB >= 80 and the sync
    succeeds; the parent's RDB-channel client reports no version, the primary falls
    back to RDB 11, cannot serialize the HFE hash ("Can't store key"), and the full
    sync never completes.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: hfe-sync
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 90
    server_config:
      dual-channel-replication-enabled: "yes"
      repl-diskless-sync: "yes"
      repl-diskless-sync-delay: "0"
    commands:
    - {command: [HSET, myhash, field1, value1, field2, value2, field3, value3], node: 0,
      expect: {equals: 3}}
    - {command: [HEXPIRE, myhash, 3600, FIELDS, 3, field1, field2, field3], node: 0,
      expect: {equals: [1, 1, 1]}}
    - {command: [OBJECT, ENCODING, myhash], node: 0, compare: skip}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [HGET, myhash, field1], node: 1, wait_s: 30, expect_difference: true,
      expect: {equals: value1}}
    - {command: [HGET, myhash, field2], node: 1, expect_difference: true, expect: {
        equals: value2}}
    - {command: [SET, k1, v1], node: 0, expect: {equals: OK}}
    - {command: [GET, k1], node: 1, wait_s: 20, expect_difference: true, expect: {
        equals: v1}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [hfe-sync.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: hfe-sync}
