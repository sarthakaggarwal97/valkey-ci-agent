extends: [valkey.liveness]
id: proposed.dual-channel-user-auth-handshake
deployment:
  modes: [standalone]
metadata:
  description: Dual-channel full sync with primaryuser+primaryauth, aborted mid-handshake
    and retried, replies compared across builds
inputs:
  required: [parent]
  properties:
    parent:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "The parent commit's build, {$ref: artifacts.parent.binary}"
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: sync
  config:
    compare_with: {$ref: inputs.parent}
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - {command: [SET, k1, v1], node: 0, expect: {equals: OK}}
    - {command: [ACL, SETUSER, repluser, on, ">replpass", "~*", "&*", "+@all"], node: 0,
      expect: {equals: OK}}
    - {command: [CONFIG, SET, dual-channel-replication-enabled, "yes"], node: 0, expect: {
        equals: OK}}
    - {command: [CONFIG, SET, repl-diskless-sync, "yes"], node: 0, expect: {equals: OK}}
    - {command: [CONFIG, SET, repl-diskless-sync-delay, "2"], node: 0, expect: {equals: OK}}
    - {command: [CONFIG, SET, dual-channel-replication-enabled, "yes"], node: 1, expect: {
        equals: OK}}
    - {command: [CONFIG, SET, primaryuser, repluser], node: 1, expect: {equals: OK}}
    - {command: [CONFIG, SET, primaryauth, replpass], node: 1, expect: {equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 0, wait_s: 15, compare: skip, expect: {
        contains: "state=wait_bgsave"}}
    - {command: [REPLICAOF, NO, ONE], node: 1, expect: {equals: OK}}
    - {command: [CONFIG, SET, repl-diskless-sync-delay, "0"], node: 0, expect: {equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [GET, k1], node: 1, wait_s: 30, expect: {equals: v1}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [SET, k2, v2], node: 0, expect: {equals: OK}}
    - {command: [GET, k2], node: 1, wait_s: 10, expect: {equals: v2}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [sync.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: sync}
