extends: [valkey.liveness]
id: proposed.dual-channel-auth-fullsync
deployment:
  modes: [standalone]
metadata:
  description: >-
    Dual-channel full sync driven through the refactored rdb-channel handshake with
    AUTH: a wrong primaryauth first (the handshake aborts and retries), then the right
    one; the replica must reach master_link_status:up with the primary's dataset,
    identically on the change and its parent. The diskless_delay input holds BGSAVE
    so the replica receives empty $ENDOFF keepalives, the new C_RETRY path in dualChannelReplHandleEndOffsetResponse.
inputs:
  properties:
    diskless_delay:
      type: string
      enum: ["0", "5"]
      default: "0"
      description: repl-diskless-sync-delay on both private servers
components:
- use: valkey.action.commands
  id: sync
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    server_config:
      dual-channel-replication-enabled: "yes"
      repl-diskless-sync: "yes"
      repl-diskless-sync-delay: {$ref: inputs.diskless_delay}
    timeout_s: 180
    commands:
    - {command: [SET, k1, v1], node: 0, expect: {equals: OK}}
    - {command: [DEBUG, POPULATE, "20000"], node: 0, expect: {equals: OK}}
    - {command: [CONFIG, SET, requirepass, pw-945-refactor], node: 0, expect: {equals: OK}}
    - {command: [CONFIG, SET, primaryauth, wrong-password], node: 1, expect: {equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, compare: skip, expect: {contains: "master_link_status:down"}}
    - {command: [CONFIG, SET, primaryauth, pw-945-refactor], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 90, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [GET, k1], node: 1, expect: {equals: v1}}
    - {command: [DBSIZE], node: 1, expect: {equals: 20001}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [sync.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: sync}
