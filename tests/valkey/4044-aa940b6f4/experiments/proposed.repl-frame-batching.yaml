extends: [valkey.liveness]
id: proposed.repl-frame-batching
deployment:
  modes: [standalone]
metadata:
  description: Writes straddling the 256-byte inline threshold of the batched replication
    frame arrive byte-exact on a live replica, compared across builds
components:
- use: valkey.action.commands
  id: repl
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 60
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [WAIT, 1, 2000], wait_s: 60, expect: {equals: 1}}
    - {command: [SET, empty, ""], expect: {equals: OK}}
    - {command: [SET, v255, "0123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789abcde"],
      expect: {equals: OK}}
    - {command: [SET, v256, "0123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789abcdef"],
      expect: {equals: OK}}
    - {command: [SET, v257, "0123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789abcdefg"],
      expect: {equals: OK}}
    - {command: [SET, v600, ""],
      expect: {equals: OK}}
    - {command: [MSET, m1, x, m2, "",
        m3, y], expect: {equals: OK}}
    - {command: [RPUSH, biglist, e1, e2, e3, e4, e5, e6, e7, e8, e9, e10, e11, e12],
      expect: {equals: 12}}
    - {command: [EXPIRE, v600, 10000], expect: {equals: 1}}
    - {command: [MULTI], expect: {equals: OK}}
    - {command: [SET, t1, 1], expect: {equals: QUEUED}}
    - {command: [INCR, t1], expect: {equals: QUEUED}}
    - {command: [EXEC], expect: {equals: [OK, 2]}}
    - {command: [WAIT, 1, 10000], wait_s: 30, expect: {equals: 1}}
    - {command: [GET, empty], node: 1, expect: {equals: ""}}
    - {command: [STRLEN, v255], node: 1, expect: {equals: 255}}
    - {command: [GETRANGE, v255, 250, 254], node: 1, expect: {equals: abcde}}
    - {command: [STRLEN, v256], node: 1, expect: {equals: 256}}
    - {command: [GETRANGE, v256, 250, 255], node: 1, expect: {equals: abcdef}}
    - {command: [STRLEN, v257], node: 1, expect: {equals: 257}}
    - {command: [GETRANGE, v257, 250, 256], node: 1, expect: {equals: abcdefg}}
    - {command: [STRLEN, v600], node: 1, expect: {equals: 600}}
    - {command: [GETRANGE, v600, 590, 599], node: 1, expect: {equals: "0123456789"}}
    - {command: [STRLEN, m2], node: 1, expect: {equals: 300}}
    - {command: [GETRANGE, m2, 290, 299], node: 1, expect: {equals: "0123456789"}}
    - {command: [LRANGE, biglist, 0, -1], node: 1, expect: {contains: e12}}
    - {command: [TTL, v600], node: 1, compare: skip, expect: {min: 9000}}
    - {command: [GET, t1], node: 1, expect: {equals: "2"}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
