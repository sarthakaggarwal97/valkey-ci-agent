extends: [valkey.liveness]
id: proposed.migrateslots-dbsize-multislot
deployment:
  modes: [standalone]
metadata:
  description: DBSIZE after a multi-range import and a second concurrent import onto
    a third node, with TTL keys so the expires kvstore takes the same path; the parent
    double-counts every imported slot
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: multimigrate
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 3
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - {command: [CLUSTER, KEYSLOT, "{hello}1"], expect: {equals: 866}}
    - {command: [CLUSTER, KEYSLOT, "{bar}1"], expect: {equals: 5061}}
    - {command: [CLUSTER, KEYSLOT, "{foo}1"], expect: {equals: 12182}}
    - {command: [MSET, "{hello}1", a, "{hello}2", b, "{hello}3", c, "{hello}4", d],
      expect: {equals: OK}}
    - {command: [SET, "{foo}1", a], expect: {equals: OK}}
    - {command: [SET, "{foo}2", b, EX, 10000], expect: {equals: OK}}
    - {command: [SET, "{foo}3", c], expect: {equals: OK}}
    - {command: [SET, "{foo}4", d, EX, 10000], expect: {equals: OK}}
    - {command: [MSET, "{bar}1", a, "{bar}2", b, "{bar}3", c, "{bar}4", d], expect: {
        equals: OK}}
    - {command: [DBSIZE], expect: {equals: 12}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 866, 866, 12182, 12182, NODE,
        "<node.1.id>"], wait_s: 30, expect: {equals: OK}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 5061, 5061, NODE, "<node.2.id>"],
      wait_s: 30, expect: {equals: OK}}
    - {command: [CLUSTER, COUNTKEYSINSLOT, 866], node: 1, wait_s: 30, expect: {equals: 4}}
    - {command: [CLUSTER, COUNTKEYSINSLOT, 12182], node: 1, wait_s: 30, expect: {
        equals: 4}}
    - {command: [CLUSTER, COUNTKEYSINSLOT, 5061], node: 2, wait_s: 30, expect: {equals: 4}}
    - {command: [CLUSTER, COUNTKEYSINSLOT, 866], wait_s: 30, expect: {equals: 0}}
    - {command: [CLUSTER, COUNTKEYSINSLOT, 12182], wait_s: 30, expect: {equals: 0}}
    - {command: [CLUSTER, COUNTKEYSINSLOT, 5061], wait_s: 30, expect: {equals: 0}}
    - {command: [DBSIZE], expect: {equals: 0}}
    - {command: [DBSIZE], node: 1, expect_difference: true, expect: {equals: 8}}
    - {command: [DBSIZE], node: 2, expect_difference: true, expect: {equals: 4}}
    - {command: [MGET, "{foo}1", "{foo}2", "{foo}3", "{foo}4"], node: 1, expect: {
        equals: [a, b, c, d]}}
    - {command: [MGET, "{bar}1", "{bar}2", "{bar}3", "{bar}4"], node: 2, expect: {
        equals: [a, b, c, d]}}
    - {command: [DEL, "{hello}1", "{hello}2", "{hello}3", "{hello}4"], node: 1, expect: {
        equals: 4}}
    - {command: [DEL, "{foo}1", "{foo}2", "{foo}3", "{foo}4"], node: 1, expect: {
        equals: 4}}
    - {command: [DBSIZE], node: 1, expect_difference: true, expect: {equals: 0}}
    - {command: [DEL, "{bar}1", "{bar}2", "{bar}3", "{bar}4"], node: 2, expect: {
        equals: 4}}
    - {command: [DBSIZE], node: 2, expect_difference: true, expect: {equals: 0}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [multimigrate.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: multimigrate}
