extends: [valkey.liveness]
id: proposed.xackdel-aof-restart
deployment:
  modes: [standalone]
metadata:
  description: XACKDEL/XDELEX are rewritten as XACK/XDEL in the AOF; stream, PEL and
    dangling-ref state after a restart compared against the parent
components:
- use: valkey.action.commands
  id: aof
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server_config: {appendonly: 'yes', appendfsync: always}
    timeout_s: 90
    commands:
    - {command: [XADD, a, '1-1', f, v], expect: {equals: '1-1'}}
    - {command: [XADD, a, '2-2', f, v], expect: {equals: '2-2'}}
    - {command: [XADD, a, '3-3', f, v], expect: {equals: '3-3'}}
    - {command: [XGROUP, CREATE, a, g1, '0'], expect: {equals: OK}}
    - {command: [XGROUP, CREATE, a, g2, '0'], expect: {equals: OK}}
    - {command: [XREADGROUP, GROUP, g1, c, COUNT, 3, STREAMS, a, '>']}
    - {command: [XREADGROUP, GROUP, g2, c, COUNT, 3, STREAMS, a, '>']}
    - {command: [XACKDEL, a, g1, KEEPREF, IDS, 1, '1-1'], expect_difference: true,
      expect: {equals: [1]}}
    - {command: [XACKDEL, a, g1, DELREF, IDS, 1, '2-2'], expect_difference: true,
      expect: {equals: [1]}}
    - {command: [XDELEX, a, ACKED, IDS, 1, '3-3'], expect_difference: true, expect: {
        equals: [2]}}
    - {restart: true, expect: {equals: OK}}
    - {command: [XLEN, a], expect_difference: true, expect: {equals: 1}}
    - {command: [XPENDING, a, g1], expect_difference: true, expect: {equals: [1, '3-3',
          '3-3', [[c, '1']]]}}
    - {command: [XPENDING, a, g2], expect_difference: true, expect: {equals: [2, '1-1',
          '3-3', [[c, '2']]]}}
    - {command: [XDELEX, a, ACKED, IDS, 1, '3-3'], expect_difference: true, expect: {
        equals: [2]}}
    - {command: [XACK, a, g1, '3-3'], expect: {equals: 1}}
    - {command: [XACK, a, g2, '1-1'], expect: {equals: 1}}
    - {command: [XACK, a, g2, '3-3'], expect: {equals: 1}}
    - {command: [XDELEX, a, ACKED, IDS, 1, '3-3'], expect_difference: true, expect: {
        equals: [1]}}
    - {command: [XLEN, a], expect_difference: true, expect: {equals: 0}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [aof.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: aof}
