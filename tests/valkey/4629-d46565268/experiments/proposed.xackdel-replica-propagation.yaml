extends: [valkey.liveness]
id: proposed.xackdel-replica-propagation
deployment:
  modes: [standalone]
metadata:
  description: XACKDEL/XDELEX on a primary propagate as XACK/XDEL to a same-build
    replica, also inside MULTI/EXEC; replica stream and PEL state compared against
    the parent
components:
- use: valkey.action.commands
  id: repl
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 90
    commands:
    - {command: [REPLICAOF, '<node.0.host>', '<node.0.port>'], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: 'master_link_status:up'}}
    - {command: [XADD, m, '1-1', f, v], node: 0, expect: {equals: '1-1'}}
    - {command: [XADD, m, '2-2', f, v], node: 0, expect: {equals: '2-2'}}
    - {command: [XGROUP, CREATE, m, g1, '0'], node: 0, expect: {equals: OK}}
    - {command: [XGROUP, CREATE, m, g2, '0'], node: 0, expect: {equals: OK}}
    - {command: [XREADGROUP, GROUP, g1, ca, COUNT, 2, STREAMS, m, '>'], node: 0}
    - {command: [XREADGROUP, GROUP, g2, cb, COUNT, 2, STREAMS, m, '>'], node: 0}
    - {command: [XACKDEL, m, g1, DELREF, IDS, 1, '1-1'], node: 0, expect_difference: true,
      expect: {equals: [1]}}
    - {command: [XDELEX, m, ACKED, IDS, 1, '2-2'], node: 0, expect_difference: true,
      expect: {equals: [2]}}
    - {command: [XACK, m, g1, '2-2'], node: 0, expect: {equals: 1}}
    - {command: [XACKDEL, m, g2, ACKED, IDS, 1, '2-2'], node: 0, expect_difference: true,
      expect: {equals: [1]}}
    - {command: [MULTI], node: 0, expect: {equals: OK}}
    - {command: [XADD, m2, '1-1', f, v], node: 0, expect: {equals: QUEUED}}
    - {command: [XGROUP, CREATE, m2, g, '0'], node: 0, expect: {equals: QUEUED}}
    - {command: [XREADGROUP, GROUP, g, c, COUNT, 1, STREAMS, m2, '>'], node: 0, expect: {
        equals: QUEUED}}
    - {command: [XDELEX, m2, DELREF, IDS, 1, '1-1'], node: 0, expect_difference: true,
      expect: {equals: QUEUED}}
    - {command: [EXEC], node: 0, compare: skip}
    - {command: [EXISTS, m2], node: 0, expect_difference: true, expect: {equals: 1}}
    - {command: [WAIT, 1, 10000], node: 0, expect: {equals: 1}}
    - {command: [XLEN, m], node: 1, expect_difference: true, expect: {equals: 0}}
    - {command: [XPENDING, m, g1, '-', '+', 10], node: 1, expect_difference: true,
      expect: {equals: []}}
    - {command: [XPENDING, m, g2, '-', '+', 10], node: 1, expect_difference: true,
      expect: {equals: []}}
    - {command: [EXISTS, m2], node: 1, expect_difference: true, expect: {equals: 1}}
    - {command: [XPENDING, m2, g, '-', '+', 10], node: 1, expect_difference: true,
      expect: {equals: []}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
