extends: [valkey.liveness]
id: proposed.cli-pubsub-auto-exit
deployment:
  modes: [standalone]
metadata:
  description: valkey-cli leaves subscribed mode when every channel, pattern, and
    shard-channel subscription is gone, tracked across SUBSCRIBE/PSUBSCRIBE/SSUBSCRIBE,
    RESET, and RESP2/RESP3, observed via the new :get pubsub
inputs:
  properties:
    cluster:
      type: boolean
      default: false
      description: run each side's private server as a one-node cluster serving all
        slots
components:
- use: valkey.action.tools
  id: cli-pubsub
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server: true
    cluster: {$ref: inputs.cluster}
    timeout_s: 60
    runs:
    - tool: valkey-cli
      args: [-p, $port]
      stdin: |
        :get pubsub
        SUBSCRIBE ch1 ch2
        :get pubsub
        UNSUBSCRIBE ch1
        :get pubsub
        UNSUBSCRIBE ch2
        :get pubsub
        PSUBSCRIBE news.*
        :get pubsub
        PUNSUBSCRIBE
        :get pubsub
        SSUBSCRIBE s1
        :get pubsub
        SUNSUBSCRIBE
        :get pubsub
        PING
      expect_difference: true
      expect:
        exit: {equals: 0}
        stdout:
          equals: |
            0
            subscribe
            ch1
            1
            subscribe
            ch2
            2
            1
            unsubscribe
            ch1
            1
            1
            unsubscribe
            ch2
            0
            0
            psubscribe
            news.*
            1
            1
            punsubscribe
            news.*
            0
            0
            ssubscribe
            s1
            1
            1
            sunsubscribe
            s1
            0
            0
            PONG
    - tool: valkey-cli
      args: [-p, $port, -3]
      stdin: |
        :get pubsub
        SUBSCRIBE ch1
        PUBLISH ch1 hello
        SSUBSCRIBE s1
        :get pubsub
        UNSUBSCRIBE
        :get pubsub
        SPUBLISH s1 world
        SUNSUBSCRIBE
        :get pubsub
        PING
      expect_difference: true
      expect:
        exit: {equals: 0}
        stdout:
          equals: |
            0
            subscribe
            ch1
            1
            message
            ch1
            hello
            1
            ssubscribe
            s1
            1
            1
            unsubscribe
            ch1
            0
            1
            smessage
            s1
            world
            1
            sunsubscribe
            s1
            0
            0
            PONG
    - tool: valkey-cli
      args: [-p, $port]
      stdin: |
        SUBSCRIBE ch1
        :get pubsub
        RESET
        :get pubsub
        SSUBSCRIBE s1
        SUNSUBSCRIBE s1
        :get pubsub
        UNSUBSCRIBE ch1
        :get pubsub
        PING
      expect_difference: true
      expect:
        exit: {equals: 0}
        stdout:
          equals: |
            subscribe
            ch1
            1
            1
            RESET
            0
            ssubscribe
            s1
            1
            sunsubscribe
            s1
            0
            0
            unsubscribe
            ch1
            0
            0
            PONG
required_evidence:
- {evidence_id: valkey.tool.runs, source: cli-pubsub}
