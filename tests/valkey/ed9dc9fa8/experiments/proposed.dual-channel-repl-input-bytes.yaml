extends: [valkey.liveness]
id: proposed.dual-channel-repl-input-bytes
deployment:
  modes: [standalone]
metadata:
  description: After a dual-channel diskless full sync, the replica's total_net_repl_input_bytes
    counts the rdb-channel payload
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    diskless_load: {type: string, enum: [on-empty-db, swapdb], default: swapdb}
components:
- use: valkey.action.commands
  id: dualsync
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 60
    server_config:
      dual-channel-replication-enabled: "yes"
      repl-diskless-sync: "yes"
      repl-diskless-sync-delay: 0
      repl-diskless-load: {$ref: inputs.diskless_load}
      rdbcompression: "no"
      repl-compression: "no"
    commands:
    - {command: [SETRANGE, big1, 65535, x], node: 0, expect: {equals: 65536}}
    - {command: [SETRANGE, big2, 65535, x], node: 0, expect: {equals: 65536}}
    - {command: [SETRANGE, big3, 65535, x], node: 0, expect: {equals: 65536}}
    - {command: [SET, marker, done], node: 0, expect: {equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [GET, marker], node: 1, wait_s: 10, expect: {equals: done}}
    - {command: [INFO, stats], node: 1, compare: skip}
    - node: 1
      expect_difference: true
      expect: {equals: 1}
      command:
      - EVAL_RO
      - "local s = redis.call('INFO','stats') local v = tonumber(string.match(s,'total_net_repl_input_bytes:(%d+)'))\
        \ if v and v > 65536 then return 1 else return 0 end"
      - "0"
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [dualsync.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: dualsync}
