extends: [valkey.liveness]
id: proposed.rand-nonlistpack-encodings
deployment:
  modes: [standalone]
metadata:
  description: HRANDFIELD and ZRANDMEMBER with a count on hashtable- and skiplist-encoded
    keys; the random replies are recorded (per-process hash seed) and the collections
    are checked intact across builds, which catches the use-after-free, double-free
    or assert the dict-to-hashtable rewrite of the temporary reply table could introduce
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: rand
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    server_config: {hash-max-listpack-entries: 0, zset-max-listpack-entries: 0}
    timeout_s: 20
    commands:
    - {command: [HSET, h, f0, v0, f1, v1, f2, v2, f3, v3, f4, v4, f5, v5, f6, v6,
        f7, v7, f8, v8, f9, v9, f10, v10, f11, v11], expect: {equals: 12}}
    - {command: [OBJECT, ENCODING, h], compare: skip, expect: {equals: hashtable}}
    - {command: [HRANDFIELD, h, 9, WITHVALUES], compare: skip}
    - {command: [HRANDFIELD, h, 3, WITHVALUES], compare: skip}
    - {command: [HRANDFIELD, h, 9], compare: skip}
    - {command: [HRANDFIELD, h, -15, WITHVALUES], compare: skip}
    - {command: [HRANDFIELD, h, 2147483647], compare: skip}
    - {command: [HLEN, h], expect: {equals: 12}}
    - {command: [HGETALL, h], compare: unordered-pairs}
    - {command: [ZADD, z, 0, m0, 1, m1, 2, m2, 3, m3, 4, m4, 5, m5, 6, m6, 7, m7,
        8, m8, 9, m9, 10, m10, 11, m11], expect: {equals: 12}}
    - {command: [OBJECT, ENCODING, z], compare: skip, expect: {equals: skiplist}}
    - {command: [ZRANDMEMBER, z, 9, WITHSCORES], compare: skip}
    - {command: [ZRANDMEMBER, z, 3, WITHSCORES], compare: skip}
    - {command: [ZRANDMEMBER, z, 9], compare: skip}
    - {command: [ZRANDMEMBER, z, -15, WITHSCORES], compare: skip}
    - {command: [ZCARD, z], expect: {equals: 12}}
    - {command: [ZRANGE, z, 0, -1, WITHSCORES]}
    checks: {variants: true, replica: true, concurrency: 4, faults: true}
required_evidence:
- {evidence_id: valkey.command.sequence, source: rand}
