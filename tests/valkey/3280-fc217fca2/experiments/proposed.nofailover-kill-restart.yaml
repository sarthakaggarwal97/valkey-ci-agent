extends: [valkey.base]
id: proposed.nofailover-kill-restart
deployment:
  modes: [cluster]
  replicas_per_primary: {minimum: 1}
metadata:
  description: SIGKILL and restart a node in a NOFAILOVER cluster; it must reload
    the nodes.conf the changed save path wrote, rejoin, and lose no acknowledged write
inputs:
  properties:
    instance: {type: string, enum: [primary, replica], default: replica}
    signal: {type: string, enum: [SIGKILL, SIGTERM], default: SIGKILL}
components:
- use: valkey.fault.process-signal
  id: kill-node
  config:
    when_event: warm-up.completed
    instance: {$ref: inputs.instance}
    signal: {$ref: inputs.signal}
    restart_mode: immediate
- use: valkey.action.sleep
  id: warm-up
  depends_on: [writes, kill-node]
  config: {seconds: 3}
- use: valkey.action.sleep
  id: settle
  depends_on: [warm-up]
  config: {seconds: 6}
- use: valkey.oracle.ledger
  id: data
  config: {workload: writes, loss_window_s: 2.5}
required_events: [warm-up.completed]
required_evidence:
- {evidence_id: valkey.fault.injected, source: kill-node}
