extends: [valkey.liveness]
id: proposed.hll-dense-compress-merge
deployment:
  modes: [standalone]
metadata:
  description: PFMERGE with dense sources drives hllDenseCompress and hllMergeDense
    through the restructured SIMD dispatch (AVX2 taken and not taken), replies compared
    across builds
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    hll_sparse_max_bytes: {type: integer, default: 3000}
components:
- use: valkey.action.commands
  id: hll
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server_config: {hll-sparse-max-bytes: {$ref: inputs.hll_sparse_max_bytes}}
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
    - {command: [PFADD, src1, a1, a2, a3, a4, a5, a6, a7, a8, a9, a10, a11, a12, a13,
        a14, a15, a16, a17, a18, a19, a20, a21, a22, a23, a24, a25, a26, a27, a28,
        a29, a30, a31, a32, a33, a34, a35, a36, a37, a38, a39, a40, a41, a42, a43,
        a44, a45, a46, a47, a48, a49, a50], expect: {equals: 1}}
    - {command: [PFADD, src1, b1, b2, b3, b4, b5, b6, b7, b8, b9, b10, b11, b12, b13,
        b14, b15, b16, b17, b18, b19, b20, b21, b22, b23, b24, b25, b26, b27, b28,
        b29, b30, b31, b32, b33, b34, b35, b36, b37, b38, b39, b40, b41, b42, b43,
        b44, b45, b46, b47, b48, b49, b50], expect: {equals: 1}}
    - {command: [PFADD, src2, c1, c2, c3, c4, c5, c6, c7, c8, c9, c10, c11, c12, c13,
        c14, c15, c16, c17, c18, c19, c20, c21, c22, c23, c24, c25, c26, c27, c28,
        c29, c30, c31, c32, c33, c34, c35, c36, c37, c38, c39, c40, c41, c42, c43,
        c44, c45, c46, c47, c48, c49, c50], expect: {equals: 1}}
    - {command: [PFADD, src2, ""], expect: {in: [0, 1]}}
    - {command: [PFDEBUG, TODENSE, src1], expect: {in: [0, 1]}}
    - {command: [PFDEBUG, ENCODING, src1], expect: {equals: dense}}
    - {command: [PFCOUNT, src1], expect: {min: 85, max: 115}}
    - {command: [PFMERGE, dest, src1, src2], expect: {equals: OK}}
    - {command: [PFDEBUG, ENCODING, dest], expect: {equals: dense}}
    - {command: [PFCOUNT, dest], expect: {min: 130, max: 175}}
    - {command: [PFDEBUG, GETREG, dest]}
    - {command: [PFDEBUG, SIMD, OFF], expect: {in: [enabled, disabled]}}
    - {command: [PFMERGE, dest2, src1, src2], expect: {equals: OK}}
    - {command: [PFCOUNT, dest2], expect: {min: 130, max: 175}}
    - {command: [PFDEBUG, GETREG, dest2]}
    - {command: [PFDEBUG, SIMD, ON], expect: {in: [enabled, disabled]}}
    - {command: [PFMERGE, dest, dest, dest, missing, src1, src1], expect: {equals: OK}}
    - {command: [PFMERGE, dest, dest], expect: {equals: OK}}
    - {command: [PFCOUNT, dest], expect: {min: 130, max: 175}}
    - {command: [PFADD, dest3, z1], expect: {equals: 1}}
    - {command: [PFMERGE, dest3, src1], expect: {equals: OK}}
    - {command: [PFDEBUG, ENCODING, dest3], expect: {equals: dense}}
    - {command: [PFCOUNT, dest3, dest, src2], expect: {min: 130, max: 185}}
    - {command: [SET, nothll, hello], expect: {equals: OK}}
    - {command: [PFMERGE, dest, nothll], expect: {error: WRONGTYPE}}
    - {command: [PFDEBUG, GETREG, dest]}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [hll.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: hll}
