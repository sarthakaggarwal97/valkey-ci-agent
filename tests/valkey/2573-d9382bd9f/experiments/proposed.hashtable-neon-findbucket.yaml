extends: [valkey.liveness]
id: proposed.hashtable-neon-findbucket
deployment:
  modes: [standalone]
metadata:
  description: >-
    Differential stress of hashtable findBucket() against the parent build. The ARM
    NEON fast path added by this change must return exactly what the scalar lookup
    returns for every shape it can see: a large main dict through grow and shrink
    rehash, chained buckets forced by inserting while a slow fork blocks table resizing
    (the chained bucket's last slot holds a child pointer the presence check must
    skip), hashtable-encoded hash and set field tables, empty keys and fields, misses,
    and the expires table. Every key is verified individually via Lua loops, so one
    wrong lookup out of 100k shows up. On a non-NEON runner both sides take the same
    path and the sequence is a harmless equivalence check.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    activerehashing: {type: string, enum: ["yes", "no"], default: "yes"}
    cluster: {type: boolean, default: false}
components:
- use: valkey.action.commands
  id: ht
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    cluster: {$ref: inputs.cluster}
    timeout_s: 120
    server_config:
      hash-max-listpack-entries: 0
      set-max-listpack-entries: 0
      activerehashing: {$ref: inputs.activerehashing}
    commands:
    - {command: [DEBUG, POPULATE, 100000], expect: {equals: OK}}
    - {command: [DBSIZE], expect: {equals: 100000}}
    - command:
      - EVAL
      - local bad=0 for i=0,99999 do if redis.call('GET','key:'..i) ~= 'value:'..i
        then bad=bad+1 end end return bad
      - 0
      expect: {equals: 0}
    - {command: [GET, 'key:0'], expect: {equals: 'value:0'}}
    - {command: [GET, 'key:99999'], expect: {equals: 'value:99999'}}
    - command:
      - EVAL
      - local n=0 for i=0,9999 do n=n+redis.call('EXISTS','miss:'..i) end return n
      - 0
      expect: {equals: 0}
    - command:
      - EVAL
      - local n=0 for i=0,49999 do n=n+redis.call('DEL','key:'..i) end return n
      - 0
      expect: {equals: 50000}
    - {command: [DBSIZE], expect: {equals: 50000}}
    - command:
      - EVAL
      - local bad=0 for i=0,99999 do local e=redis.call('EXISTS','key:'..i) if (i<50000
        and e==1) or (i>=50000 and e==0) then bad=bad+1 end end return bad
      - 0
      expect: {equals: 0}
    - {command: [CONFIG, SET, rdb-key-save-delay, 1000], expect: {equals: OK}}
    - {command: [BGSAVE], expect: {contains: 'Background saving started'}}
    - {command: [DEBUG, POPULATE, 60000, 'fork:'], expect: {equals: OK}}
    - {command: [DBSIZE], expect: {equals: 110000}}
    - command:
      - EVAL
      - local bad=0 for i=0,59999 do if redis.call('GET','fork:'..i) ~= 'value:'..i
        then bad=bad+1 end end return bad
      - 0
      expect: {equals: 0}
    - command:
      - EVAL
      - local n=0 for i=0,59998,2 do n=n+redis.call('DEL','fork:'..i) end return n
      - 0
      expect: {equals: 30000}
    - command:
      - EVAL
      - local bad=0 for i=0,59999 do local e=redis.call('EXISTS','fork:'..i) if (i%2==0
        and e==1) or (i%2==1 and e==0) then bad=bad+1 end end return bad
      - 0
      expect: {equals: 0}
    - {command: [CONFIG, SET, rdb-key-save-delay, 0], expect: {equals: OK}}
    - command:
      - EVAL
      - for i=0,19999 do redis.call('HSET','bigh','f'..i,'v'..i) end return redis.call('HLEN','bigh')
      - 0
      expect: {equals: 20000}
    - command:
      - EVAL
      - local bad=0 for i=0,19999 do if redis.call('HGET','bigh','f'..i) ~= 'v'..i
        then bad=bad+1 end end return bad
      - 0
      expect: {equals: 0}
    - command:
      - EVAL
      - local n=0 for i=0,9999 do n=n+redis.call('HDEL','bigh','f'..i) end return
        n
      - 0
      expect: {equals: 10000}
    - {command: [HLEN, bigh], expect: {equals: 10000}}
    - command:
      - EVAL
      - local bad=0 for i=0,19999 do local e=redis.call('HEXISTS','bigh','f'..i) if
        (i<10000 and e==1) or (i>=10000 and e==0) then bad=bad+1 end end return bad
      - 0
      expect: {equals: 0}
    - command:
      - EVAL
      - for i=0,19999 do redis.call('SADD','bigs','m'..i) end return redis.call('SCARD','bigs')
      - 0
      expect: {equals: 20000}
    - command:
      - EVAL
      - local bad=0 for i=0,19999 do if redis.call('SISMEMBER','bigs','m'..i) ~= 1
        then bad=bad+1 end end return bad
      - 0
      expect: {equals: 0}
    - command:
      - EVAL
      - local n=0 for i=0,9999 do n=n+redis.call('SREM','bigs','m'..i) end return
        n
      - 0
      expect: {equals: 10000}
    - {command: [SCARD, bigs], expect: {equals: 10000}}
    - {command: [SET, '', emptyval], expect: {equals: OK}}
    - {command: [GET, ''], expect: {equals: emptyval}}
    - {command: [EXISTS, ''], expect: {equals: 1}}
    - {command: [DEL, ''], expect: {equals: 1}}
    - {command: [HSET, bigh, '', vempty], expect: {equals: 1}}
    - {command: [HGET, bigh, ''], expect: {equals: vempty}}
    - {command: [HDEL, bigh, ''], expect: {equals: 1}}
    - command:
      - EVAL
      - for i=0,4999 do redis.call('SET','ex:'..i,'v','EX',10000) end return 1
      - 0
      expect: {equals: 1}
    - command:
      - EVAL
      - local bad=0 for i=0,4999 do if redis.call('TTL','ex:'..i) <= 0 then bad=bad+1
        end end return bad
      - 0
      expect: {equals: 0}
    - command:
      - EVAL
      - local n=0 for i=0,4999 do n=n+redis.call('PERSIST','ex:'..i) end return n
      - 0
      expect: {equals: 5000}
    - {command: [DBSIZE], expect: {equals: 85002}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [ht.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: ht}
