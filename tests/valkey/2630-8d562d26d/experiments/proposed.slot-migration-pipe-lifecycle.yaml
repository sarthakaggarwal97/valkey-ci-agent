extends: [valkey.liveness]
id: proposed.slot-migration-pipe-lifecycle
deployment:
  modes: [standalone]
metadata:
  description: Atomic slot migration (CLUSTER MIGRATESLOTS) run to completion, cancelled
    mid-snapshot, and interrupted by FLUSHALL killing the snapshot child, so the slot_migration_pipe_read
    fd the change now closes in the child is created, used, torn down and re-created;
    replies compared against the parent build, crashes and fd-cleanup asserts caught
    on the candidate
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    appendonly: {type: string, enum: ["no", "yes"], default: "no"}
components:
- use: valkey.action.commands
  id: migrate
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 2
    resp: {$ref: inputs.resp}
    server_config: {appendonly: {$ref: inputs.appendonly}}
    timeout_s: 30
    commands:
    - {command: [DEBUG, POPULATE, 20000], node: 0, expect: {equals: OK}}
    - {command: [SET, foo, v1], node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 10000, 16383, NODE, "<node.1.id>"],
      node: 0, expect: {equals: OK}}
    - {command: [GET, foo], node: 1, wait_s: 60, expect: {equals: v1}}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], node: 0, compare: skip}
    - {command: [CONFIG, SET, rdb-key-save-delay, 300], node: 1, expect: {equals: OK}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 10000, 16383, NODE, "<node.0.id>"],
      node: 1, expect: {equals: OK}}
    - {command: [INFO, persistence], node: 1, wait_s: 20, expect: {contains: "slot_migration_fork_in_progress:1"},
      compare: skip}
    - {command: [CLUSTER, CANCELSLOTMIGRATIONS], node: 1, expect: {equals: OK}}
    - {command: [INFO, persistence], node: 1, wait_s: 20, expect: {contains: "slot_migration_fork_in_progress:0"},
      compare: skip}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 10000, 16383, NODE, "<node.0.id>"],
      node: 1, expect: {equals: OK}}
    - {command: [INFO, persistence], node: 1, wait_s: 20, expect: {contains: "slot_migration_fork_in_progress:1"},
      compare: skip}
    - {command: [FLUSHALL, SYNC], node: 1, expect: {equals: OK}}
    - {command: [SET, foo, v2], node: 0, wait_s: 60, expect: {equals: OK}}
    - {command: [GET, foo], node: 0, expect: {equals: v2}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_evidence:
- {evidence_id: valkey.command.sequence, source: migrate}
