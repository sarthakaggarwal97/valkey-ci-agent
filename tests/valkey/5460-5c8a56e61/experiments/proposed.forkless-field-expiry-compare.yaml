extends: [valkey.liveness]
id: proposed.forkless-field-expiry-compare
deployment:
  modes: [standalone]
metadata:
  description: Field-expiry HDELs during a forkless full sync; replica field counts
    compared across the fix and its parent (valkey-io/valkey#5460)
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    hash_listpack_entries: {type: integer, enum: [0, 128], default: 128}
components:
- use: valkey.action.commands
  id: field-expiry
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 120
    server_config:
      forkless-infrastructure-enabled: "yes"
      forkless-policy: prefer-forkless
      repl-diskless-sync: "yes"
      repl-diskless-sync-delay: 0
      enable-debug-command: "yes"
      save: ""
      hash-max-listpack-entries: {$ref: inputs.hash_listpack_entries}
    commands:
    - command: [DEBUG, POPULATE, 2000, "a", 10]
      expect: {equals: OK}
    - command: [EVAL, "for i=0,199 do redis.call('HSET','h:'..i,'f0','v','f1','v','f2','v','f3','v','f4','v','keep1','v','keep2','v')\
          \ end return 200", "0"]
      expect: {equals: 200}
    - command: [CONFIG, SET, rdb-key-save-delay, 4000]
      expect: {equals: OK}
    - command: [REPLICAOF, <node.0.host>, <node.0.port>]
      node: 1
      expect: {equals: OK}
    - command: [EVAL, "for i=0,199 do redis.call('HPEXPIRE','h:'..i,1000,'FIELDS',5,'f0','f1','f2','f3','f4')\
          \ end return 200", "0"]
      expect: {equals: 200}
    - command: [EVAL, "local n=0 for i=0,199 do if redis.call('HLEN','h:'..i)==2 then\
          \ n=n+1 end end return n", "0"]
      wait_s: 90
      expect: {equals: 200}
    - command: [CONFIG, SET, rdb-key-save-delay, 0]
      expect: {equals: OK}
    - command: [INFO, replication]
      node: 1
      wait_s: 60
      compare: skip
      expect: {contains: "master_link_status:up"}
    - command: [WAIT, 1, 15000]
      expect: {min: 1}
    - command: [EVAL_RO, "local n=0 for i=0,199 do if redis.call('HLEN','h:'..i)==2\
          \ then n=n+1 end end return n", "0"]
      node: 1
      wait_s: 30
      expect_difference: true
      expect: {equals: 200}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [field-expiry.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: field-expiry}
