extends: [valkey.base]
id: proposed.forkless-field-expiry-sync
deployment:
  modes: [standalone]
  replicas_per_primary: {minimum: 1}
metadata:
  description: Hash field expiry and lazy key expiry while a forkless full sync scans;
    every expired field's HDEL must reach the replicas (valkey-io/valkey#5460)
inputs:
  properties:
    field_ttl_ms: {type: integer, minimum: 100, maximum: 10000, default: 2500}
    key_save_delay_us: {type: integer, minimum: 0, maximum: 20000, default: 3000}
startup_overlays:
- overlay_id: forkless-sync
  server_config:
    forkless-infrastructure-enabled: "yes"
    forkless-policy: prefer-forkless
    repl-diskless-sync: "yes"
    repl-diskless-sync-delay: 0
    enable-debug-command: "yes"
components:
- use: valkey.action.commands
  id: sync-chaos
  depends_on: [writes]
  config:
    instances: primary
    timeout_s: 90
    commands:
    - command: [EVAL, "for i=0,199 do redis.call('HSET','h:'..i,'f0','v','f1','v','f2','v','f3','v','f4','v','keep1','v','keep2','v')\
          \ end return 200", "0"]
      expect: {equals: 200}
    - command: [SET, "exp:1", v, PX, 2000]
      expect: {equals: OK}
    - command: [SET, "exp:2", v, PX, 1500]
      expect: {equals: OK}
    - command: [CONFIG, SET, rdb-key-save-delay, {$ref: inputs.key_save_delay_us}]
      expect: {equals: OK}
    - command: [DEBUG, CHANGE-REPL-ID]
      expect: {equals: OK}
    - command: [CLIENT, KILL, TYPE, replica]
      expect: {min: 1}
    - command: [EVAL, "for i=0,199 do redis.call('HPEXPIRE','h:'..i,ARGV[1],'FIELDS',5,'f0','f1','f2','f3','f4')\
          \ end return 200", "0", {$ref: inputs.field_ttl_ms}]
      expect: {equals: 200}
    - command: [SET, "nk:1", v1]
      expect: {equals: OK}
    - command: [EXISTS, "exp:1"]
      wait_s: 20
      expect: {equals: 0}
    - command: [MULTI]
      expect: {equals: OK}
    - command: [SET, "nk:2", v2]
      expect: {equals: QUEUED}
    - command: [GET, "exp:2"]
      expect: {equals: QUEUED}
    - command: [EXEC]
      expect: {exists: true}
    - command: [EVAL, "local n=0 for i=0,199 do if redis.call('HLEN','h:'..i)==2 then\
          \ n=n+1 end end return n", "0"]
      wait_s: 60
      expect: {equals: 200}
    - command: [CONFIG, SET, rdb-key-save-delay, 0]
      expect: {equals: OK}
- use: valkey.action.commands
  id: verify-replica
  depends_on: [sync-chaos]
  config:
    instances: replicas
    timeout_s: 120
    commands:
    - command: [INFO, replication]
      wait_s: 60
      expect: {contains: "master_link_status:up"}
    - command: [EVAL_RO, "local n=0 for i=0,199 do if redis.call('HLEN','h:'..i)==2\
          \ then n=n+1 end end return n", "0"]
      wait_s: 60
      expect: {equals: 200}
    - command: [GET, "nk:1"]
      wait_s: 20
      expect: {equals: v1}
    - command: [GET, "nk:2"]
      wait_s: 20
      expect: {equals: v2}
required_events: [sync-chaos.completed, verify-replica.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: sync-chaos}
- {evidence_id: valkey.command.sequence, source: verify-replica}
