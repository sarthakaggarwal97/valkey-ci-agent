extends: [valkey.liveness]
id: proposed.slot-import-db-select
deployment:
  modes: [standalone]
metadata:
  description: During an atomic slot import the proxied stream and the target's own
    writes must each leave the target's replica in the right db; the parent interleaved
    them without SELECT bookkeeping
components:
- use: valkey.action.commands
  id: dbsel
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 3
    timeout_s: 60
    server_config: {cluster-databases: 16}
    commands:
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 16383, 16383, NODE, "<node.1.id>"],
      expect: {equals: OK}}
    - {command: [SET, "{6ZJ}owned", v], node: 1, wait_s: 60, expect: {equals: OK}}
    - {command: [CLUSTER, REPLICATE, "<node.0.id>"], node: 2, expect: {equals: OK}}
    - {command: [INFO, replication], node: 2, wait_s: 60, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [READONLY], node: 2, expect: {equals: OK}}
    - {command: [SELECT, 1], expect: {equals: OK}}
    - {command: [SET, "{06S}pre", v], expect: {equals: OK}}
    - {command: [SELECT, 0], expect: {equals: OK}}
    - {command: [SELECT, 2], node: 1, expect: {equals: OK}}
    - {command: [SET, "{6ZJ}snap1", v], node: 1, expect: {equals: OK}}
    - {command: [SET, "{6ZJ}snap2", v], node: 1, expect: {equals: OK}}
    - {command: [DEBUG, SLOTMIGRATION, PREVENT-PAUSE, 1], expect: {equals: OK}}
    - {command: [DEBUG, SLOTMIGRATION, PREVENT-PAUSE, 1], node: 1, expect: {equals: OK}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 16383, 16383, NODE, "<node.0.id>"],
      node: 1, expect: {equals: OK}}
    - {command: [SELECT, 2], expect: {equals: OK}}
    - {command: [CLUSTER, COUNTKEYSINSLOT, 16383], wait_s: 60, expect: {equals: 2}}
    - {command: [SET, "{6ZJ}incr1", v], node: 1, expect: {equals: OK}}
    - {command: [CLUSTER, COUNTKEYSINSLOT, 16383], wait_s: 60, expect: {equals: 3}}
    - {command: [SELECT, 1], expect: {equals: OK}}
    - {command: [SET, "{06S}a", v], expect: {equals: OK}}
    - {command: [SELECT, 0], expect: {equals: OK}}
    - {command: [SET, "{06S}b", v], expect: {equals: OK}}
    - {command: [SET, "{6ZJ}incr2", v], node: 1, expect: {equals: OK}}
    - {command: [SELECT, 2], expect: {equals: OK}}
    - {command: [CLUSTER, COUNTKEYSINSLOT, 16383], wait_s: 60, expect: {equals: 4}}
    - {command: [SELECT, 0], expect: {equals: OK}}
    - {command: [DEBUG, SLOTMIGRATION, PREVENT-PAUSE, 0], expect: {equals: OK}}
    - {command: [DEBUG, SLOTMIGRATION, PREVENT-PAUSE, 0], node: 1, expect: {equals: OK}}
    - {command: [SET, "{6ZJ}afterprobe", v], node: 1, wait_s: 60, expect: {error: "MOVED"}}
    - {command: [SELECT, 5], expect: {equals: OK}}
    - {command: [SET, "{06S}done", v], expect: {equals: OK}}
    - {command: [SELECT, 0], expect: {equals: OK}}
    - {command: [SELECT, 5], node: 2, expect: {equals: OK}}
    - {command: [GET, "{06S}done"], node: 2, wait_s: 60, expect: {equals: v}}
    - {command: [SELECT, 1], node: 2, expect: {equals: OK}}
    - {command: [GET, "{06S}a"], node: 2, expect_difference: true, expect: {equals: v}}
    - {command: [SELECT, 2], node: 2, expect: {equals: OK}}
    - {command: [GET, "{06S}a"], node: 2, expect_difference: true, expect: {equals: null}}
    - {command: [GET, "{6ZJ}incr2"], node: 2, wait_s: 30, expect_difference: true,
      expect: {equals: v}}
    - {command: [SELECT, 0], node: 2, expect: {equals: OK}}
    - {command: [GET, "{6ZJ}incr2"], node: 2, expect_difference: true, expect: {equals: null}}
    - {command: [GET, "{06S}b"], node: 2, expect: {equals: v}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [dbsel.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: dbsel}
