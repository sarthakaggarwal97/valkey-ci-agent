extends: [valkey.liveness]
id: proposed.hash-expiry-replication
deployment:
  modes: [standalone]
metadata:
  description: HINCRBY/HINCRBYFLOAT now replicate as HSETEX PXAT so the replica keeps
    the field TTL, and HSETEX KEEPTTL over an expired field propagates an explicit
    HDEL; primary and replica built inside the sequence and compared against the parent
    build
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: repl
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    server_config: {notify-keyspace-events: KEA}
    resp: {$ref: inputs.resp}
    timeout_s: 15
    commands:
    - {command: [DEBUG, SET-ACTIVE-EXPIRE, 0], node: 0, expect: {equals: OK}}
    - {command: [DEBUG, SET-ACTIVE-EXPIRE, 0], node: 1, expect: {equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [SUBSCRIBE, "__keyevent@0__:hincrby"], node: 1, connection: rinc}
    - {command: [SUBSCRIBE, "__keyevent@0__:hdel"], node: 1, connection: rdel}
    - {command: [HSETEX, h, PXAT, 33177609600000, FIELDS, 2, f1, 5, f2, 10], expect: {
        equals: 1}}
    - {command: [HGET, h, f1], node: 1, wait_s: 10, expect: {equals: "5"}}
    - {command: [HINCRBYFLOAT, h, f1, 2.5], expect: {equals: "7.5"}}
    - {command: [HINCRBY, h, f2, 7], expect: {equals: 17}}
    - {command: [HGET, h, f1], node: 1, wait_s: 10, expect: {equals: "7.5"}}
    - {command: [HGET, h, f2], node: 1, wait_s: 10, expect: {equals: "17"}}
    - {command: [HPEXPIRETIME, h, FIELDS, 1, f1], node: 1, expect_difference: true,
      expect: {equals: [33177609600000]}}
    - {command: [HPEXPIRETIME, h, FIELDS, 1, f1], node: 0, expect: {equals: [33177609600000]}}
    - {read: true, node: 1, connection: rinc, expect_difference: true, expect: {equals: []}}
    - {command: [HSETEX, h, PX, 50, FIELDS, 1, kt, v1], expect: {equals: 1}}
    - {command: [DEBUG, SLEEP, 0.1], expect: {equals: OK}}
    - {command: [HSETEX, h, KEEPTTL, FIELDS, 1, kt, v2], expect: {equals: 1}}
    - {command: [HGET, h, kt], node: 1, wait_s: 10, expect: {equals: v2}}
    - {read: true, node: 1, connection: rdel, expect_difference: true, expect: {equals: [
          [message, "__keyevent@0__:hdel", h]]}}
    - {command: [HTTL, h, FIELDS, 1, kt], node: 1, expect: {equals: [-1]}}
    - {command: [MULTI], expect: {equals: OK}}
    - {command: [HINCRBY, h, f2, 1], expect: {equals: QUEUED}}
    - {command: [HINCRBYFLOAT, h, f1, 0.5], expect: {equals: QUEUED}}
    - {command: [EXEC], expect: {equals: [18, "8"]}}
    - {command: [HGET, h, f2], node: 1, wait_s: 10, expect: {equals: "18"}}
    - {command: [HGET, h, f1], node: 1, wait_s: 10, expect: {equals: "8"}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
