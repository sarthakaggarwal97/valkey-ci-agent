extends: [valkey.liveness]
id: proposed.hash-hincrby-expired-propagation
deployment:
  modes: [standalone]
metadata:
  description: HINCRBY on an expired field of a volatile hash is propagated as HSET
    to a real replica; the parent propagates HINCRBY verbatim
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: prop
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    server_config: {notify-keyspace-events: KEA}
    resp: {$ref: inputs.resp}
    timeout_s: 20
    commands:
    - {command: [DEBUG, SET-ACTIVE-EXPIRE, '0'], node: 0, expect: {equals: OK}}
    - {command: [DEBUG, SET-ACTIVE-EXPIRE, '0'], node: 1, expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [SUBSCRIBE, "__keyevent@0__:hincrby"], node: 1, connection: rincr}
    - {command: [SUBSCRIBE, "__keyevent@0__:hset"], node: 1, connection: rhset}
    - {command: [HSETEX, hi, EX, '100', FIELDS, '1', keep, '1'], node: 0, expect: {
        equals: 1}}
    - {command: [HSETEX, hi, PX, '50', FIELDS, '1', ctr, '7'], node: 0, expect: {
        equals: 1}}
    - {command: [HEXISTS, hi, ctr], node: 0, wait_s: 8, expect: {equals: 0}}
    - {command: [HINCRBY, hi, ctr, '5'], node: 0, expect: {equals: 5}}
    - {command: [WAIT, '1', '2000'], node: 0, wait_s: 10, expect: {equals: 1}}
    - {read: true, connection: rincr, node: 1, expect_difference: true, expect: {
        equals: []}}
    - {read: true, connection: rhset, node: 1, expect_difference: true, expect: {
        contains: hset}}
    - {command: [HGET, hi, ctr], node: 0, expect: {equals: '5'}}
    - {command: [HTTL, hi, FIELDS, '1', ctr], node: 0, expect: {equals: [-1]}}
    - {command: [HGET, hi, keep], node: 0, expect: {equals: '1'}}
    checks:
      acl: true
      compat: true
      variants: true
required_events: [prop.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: prop}
