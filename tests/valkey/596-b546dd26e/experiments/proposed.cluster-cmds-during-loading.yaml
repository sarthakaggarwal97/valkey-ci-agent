extends: [valkey.liveness]
id: proposed.cluster-cmds-during-loading
deployment:
  modes: [standalone, cluster]
metadata:
  description: CLUSTER NODES/INFO/MYID/MYSHARDID answer while the dataset loads on
    the fixed build; the parent rejects them with -LOADING, inside and outside MULTI,
    in cluster and non-cluster mode
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: cluster-loading
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 300
    commands:
    - {command: [DEBUG, POPULATE, 60000], node: 0, expect: {equals: OK}}
    - {command: [CONFIG, SET, key-load-delay, 300], node: 1, expect: {equals: OK}}
    - {command: [CONFIG, SET, loading-process-events-interval-bytes, 1024], node: 1,
      expect: {equals: OK}}
    - {command: [CLUSTER, REPLICATE, "<node.0.id>"], node: 1, wait_s: 30, expect: {
        equals: OK}}
    - {command: [INFO, persistence], node: 1, compare: skip, wait_s: 60, expect: {
        contains: "loading:1"}}
    - {command: [CLUSTER, NODES], node: 1, expect_difference: true, expect: {error: false}}
    - {command: [CLUSTER, INFO], node: 1, expect_difference: true, expect: {contains: "cluster_enabled:1"}}
    - {command: [CLUSTER, MYID], node: 1, expect_difference: true, expect: {error: false}}
    - {command: [CLUSTER, MYSHARDID], node: 1, expect_difference: true, expect: {
        error: false}}
    - {command: [CLUSTER, SHARDS], node: 1, compare: skip, expect: {error: false}}
    - {command: [CLUSTER, COUNTKEYSINSLOT, 0], node: 1, expect: {error: "LOADING"}}
    - {command: [MULTI], node: 1, expect: {equals: OK}}
    - {command: [CLUSTER, MYID], node: 1, expect_difference: true, expect: {equals: QUEUED}}
    - {command: [CLUSTER, NODES], node: 1, expect_difference: true, expect: {equals: QUEUED}}
    - {command: [EXEC], node: 1, expect_difference: true, expect: {error: false}}
    - {command: [INFO, persistence], node: 1, compare: skip, wait_s: 120, expect: {
        contains: "loading:0"}}
    - {command: [DBSIZE], node: 1, expect: {min: 60000}}
    - {command: [CLUSTER, MYID], node: 1, expect: {error: false}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
- use: valkey.action.commands
  id: standalone-loading
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 300
    commands:
    - {command: [DEBUG, POPULATE, 60000], node: 0, expect: {equals: OK}}
    - {command: [CONFIG, SET, key-load-delay, 300], node: 1, expect: {equals: OK}}
    - {command: [CONFIG, SET, loading-process-events-interval-bytes, 1024], node: 1,
      expect: {equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, persistence], node: 1, compare: skip, wait_s: 60, expect: {
        contains: "loading:1"}}
    - {command: [CLUSTER, NODES], node: 1, expect_difference: true, expect: {error: "cluster\
          \ support disabled"}}
    - {command: [CLUSTER, INFO], node: 1, expect_difference: true, expect: {error: "cluster\
          \ support disabled"}}
    - {command: [CLUSTER, MYID], node: 1, expect_difference: true, expect: {error: "cluster\
          \ support disabled"}}
    - {command: [CLUSTER, MYSHARDID], node: 1, expect_difference: true, expect: {
        error: "cluster support disabled"}}
    - {command: [CLUSTER, COUNTKEYSINSLOT, 0], node: 1, expect: {error: "LOADING"}}
    - {command: [INFO, persistence], node: 1, compare: skip, wait_s: 120, expect: {
        contains: "loading:0"}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [cluster-loading.completed, standalone-loading.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: cluster-loading}
- {evidence_id: valkey.command.sequence, source: standalone-loading}
