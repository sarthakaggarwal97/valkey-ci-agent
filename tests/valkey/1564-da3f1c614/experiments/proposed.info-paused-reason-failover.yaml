extends: [valkey.liveness]
id: proposed.info-paused-reason-failover
deployment:
  modes: [standalone]
metadata:
  description: paused_reason during a stalled FAILOVER (end LLONG_MAX) layered over
    CLIENT PAUSE, and after FAILOVER ABORT
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: failover-reason
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 20
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [INFO, clients], node: 0, expect_difference: true, expect: {contains: "paused_reason:none"}}
    - {raw: "DEBUG SLEEP 8\r\n", node: 1, connection: sleeper}
    - {command: [SET, k, v], node: 0, expect: {equals: OK}}
    - {command: [CLIENT, PAUSE, 60000, WRITE], node: 0, expect: {equals: OK}}
    - {command: [INFO, clients], node: 0, expect_difference: true, expect: {contains: "paused_reason:client_pause"}}
    - {command: [FAILOVER], node: 0, expect: {equals: OK}}
    - {command: [INFO, clients], node: 0, expect_difference: true, expect: {contains: "paused_reason:failover_in_progress"}}
    - {command: [INFO, clients], node: 0, expect_difference: true, expect: {contains: "paused_actions:write"}}
    - {command: [FAILOVER, ABORT], node: 0, expect: {equals: OK}}
    - {command: [INFO, clients], node: 0, expect_difference: true, expect: {contains: "paused_reason:client_pause"}}
    - {command: [CLIENT, UNPAUSE], node: 0, expect: {equals: OK}}
    - {command: [INFO, clients], node: 0, wait_s: 10, expect_difference: true, expect: {
        contains: "paused_reason:none"}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [failover-reason.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: failover-reason}
