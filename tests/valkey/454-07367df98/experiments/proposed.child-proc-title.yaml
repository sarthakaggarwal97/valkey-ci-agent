extends: [valkey.liveness]
id: proposed.child-proc-title
deployment:
  modes: [standalone]
metadata:
  description: >-
    Module fork (VM_Fork), BGSAVE (rdbSaveBackground) and diskless full sync (rdbSaveToSlavesSockets)
    children survive the new valkey-* proc titles and complete identically on the
    change and its parent.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: forks
  config:
    compare_with: {$ref: artifacts.parent.binary}
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    server_config:
      repl-diskless-sync: "yes"
      repl-diskless-sync-delay: "0"
    resp: {$ref: inputs.resp}
    nodes: 2
    timeout_s: 120
    commands:
    - {command: [SET, k1, v1], expect: {equals: OK}}
    - {command: [FORK.CREATE, 31, 200000], compare: skip, expect: {min: 1}}
    - {command: [FORK.EXITCODE], wait_s: 20, expect: {equals: 31}}
    - {command: [BGSAVE], expect: {contains: "Background saving started"}}
    - {command: [INFO, persistence], compare: skip, wait_s: 20, expect: {contains: "rdb_changes_since_last_save:0"}}
    - {command: [INFO, persistence], compare: skip, expect: {contains: "rdb_last_bgsave_status:ok"}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, compare: skip, wait_s: 30, expect: {
        contains: "master_link_status:up"}}
    - {command: [GET, k1], node: 1, wait_s: 10, expect: {equals: v1}}
    - {command: [FORK.CREATE, 7, 3000000], compare: skip, expect: {min: 1}}
    - {command: [FORK.KILL], expect: {equals: 1}}
    - {command: [SET, k2, v2], expect: {equals: OK}}
    - {command: [GET, k2], node: 1, wait_s: 10, expect: {equals: v2}}
    checks:
      acl: true
      compat: true
      variants: true
required_events: [forks.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: forks}
