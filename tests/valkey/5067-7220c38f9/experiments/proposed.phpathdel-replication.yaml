extends: [valkey.liveness]
id: proposed.phpathdel-replication
deployment:
  modes: [standalone]
metadata:
  description: PHPATHDEL exact and delete-all propagate to a replica, binary paths,
    descendants preserved
components:
- use: valkey.action.commands
  id: repl
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 60
    commands:
    - {command: [REPLICAOF, '<node.0.host>', '<node.0.port>'], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: 'master_link_status:up'}}
    - {command: [PHSET, exact-tree, '', fields, 1, f, root], node: 0, expect: {equals: OK}}
    - {command: [PHSET, exact-tree, !!binary 'AGH/', fields, 2, f, one, g, two], node: 0,
      expect: {equals: OK}}
    - {command: [PHSET, exact-tree, !!binary 'AGH/AA==', fields, 1, f, child], node: 0,
      expect: {equals: OK}}
    - {command: [PHPATHDEL, exact-tree, !!binary 'AGH/'], node: 0, expect_difference: true,
      expect: {equals: 1}}
    - {command: [WAIT, 1, 5000], node: 0, expect: {equals: 1}}
    - {command: [PHPATHEXISTS, exact-tree, !!binary 'AGH/'], node: 1, expect_difference: true,
      expect: {equals: 0}}
    - {command: [PHGET, exact-tree, !!binary 'AGH/AA==', f], node: 1, expect: {equals: [
          child]}}
    - {command: [PHPATHCOUNT, exact-tree], node: 1, expect_difference: true, expect: {
        equals: 2}}
    - {command: [PHPATHDEL, exact-tree, '', WITHSUBPATHS], node: 0, expect_difference: true,
      expect: {equals: 2}}
    - {command: [WAIT, 1, 5000], node: 0, expect: {equals: 1}}
    - {command: [EXISTS, exact-tree], node: 1, expect_difference: true, expect: {
        equals: 0}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
