extends: [valkey.liveness]
id: proposed.exec-getkeys-static-buffer
deployment:
  modes: [standalone]
metadata:
  description: COMMAND GETKEYS on an EXEC with more than 256 conditions returns every
    condition key in order, not garbage past the static buffer
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: getkeys
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    timeout_s: 20
    commands:
