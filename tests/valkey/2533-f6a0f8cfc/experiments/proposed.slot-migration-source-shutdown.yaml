extends: [valkey.liveness]
id: proposed.slot-migration-source-shutdown
deployment:
  modes: [standalone]
metadata:
  description: >-
    SIGTERM shutdown of the migration source while the SLOT_MIGRATION child is snapshotting:
    finishShutdown must detect and kill the slot migration child, the node restarts
    cleanly, its in-memory job log is empty, and the import side fails its job.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: restart-source
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - {command: [DEBUG, POPULATE, 3000], expect: {equals: OK}}
    - {command: [CONFIG, SET, rdb-key-save-delay, 2000], expect: {equals: OK}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 0, 16383, NODE, <node.1.id>],
      expect: {equals: OK}}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], wait_s: 20, expect: {contains: snapshotting},
      compare: skip}
    - {command: [INFO, persistence], expect_difference: true, expect: {contains: "slot_migration_fork_in_progress:1"},
      compare: skip}
    - {restart: true, node: 0}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], node: 1, wait_s: 60, expect: {contains: failed},
      compare: skip}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], node: 0, expect: {equals: []}}
    - {command: [SET, after-restart, '1'], node: 0, wait_s: 15, expect: {equals: OK}}
    - {command: [GET, after-restart], node: 0, expect: {equals: '1'}}
    checks:
      acl: true
      compat: true
      variants: true
required_events: [restart-source.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: restart-source}
