extends: [valkey.liveness]
id: proposed.slot-migration-target-restart
deployment:
  modes: [standalone]
metadata:
  description: Restart the migration target mid-snapshot so the source hits the new
    slotMigrationPipeRead/Write error paths (freeClient of the target, killSlotMigrationChild),
    then a retry must succeed
components:
- use: valkey.action.commands
  id: target-restart
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 2
    resp: 2
    timeout_s: 30
    commands:
    - {command: [SET, foo, v1], expect: {equals: OK}}
    - {command: [DEBUG, POPULATE, 20000, "k{foo}"], expect: {equals: OK}}
    - {command: [CONFIG, SET, rdb-key-save-delay, 200], expect: {equals: OK}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 12182, 12182, NODE, "<node.1.id>"],
      expect: {equals: OK}}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], wait_s: 15, expect: {contains: snapshotting},
      compare: skip}
    - {restart: true, node: 1}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], wait_s: 60, expect: {contains: failed},
      compare: skip}
    - {command: [CONFIG, SET, rdb-key-save-delay, 0], expect: {equals: OK}}
    - {command: [DEBUG, SLEEP, 1], expect: {equals: OK}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 12182, 12182, NODE, "<node.1.id>"],
      expect: {equals: OK}}
    - {command: [GET, foo], node: 1, wait_s: 30, expect: {equals: v1}}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], expect_difference: true, expect: {contains: cow_size}}
    - {command: [PING], expect: {equals: PONG}}
    - {command: [PING], node: 1, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [target-restart.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: target-restart}
