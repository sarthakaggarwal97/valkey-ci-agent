extends: [valkey.liveness]
id: proposed.slot-migration-lifecycle
deployment:
  modes: [standalone]
metadata:
  description: Atomic slot migration end to end on the new CHILD_TYPE_SLOT_MIGRATION
    fork; BGSAVE is refused with a different error while the slot migration child
    runs, and CLUSTER GETSLOTMIGRATIONS gains a cow_size field
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: migrate
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 20
    commands:
    - {command: [SET, foo, v1], expect: {equals: OK}}
    - {command: [DEBUG, POPULATE, 20000, "k{foo}"], expect: {equals: OK}}
    - {command: [CONFIG, SET, rdb-key-save-delay, 200], expect: {equals: OK}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 12182, 12182, NODE, "<node.1.id>"],
      expect: {equals: OK}}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], wait_s: 15, expect: {contains: snapshotting},
      compare: skip}
    - {command: [BGSAVE], expect_difference: true, expect: {error: "Another child\
          \ process is active"}}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], wait_s: 90, expect: {contains: success},
      compare: skip}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], expect_difference: true, expect: {contains: cow_size}}
    - {command: [GET, foo], node: 1, wait_s: 20, expect: {equals: v1}}
    - {command: [DBSIZE], node: 1, wait_s: 15, expect: {equals: 20001}}
    - {command: [DBSIZE], node: 0, wait_s: 30, expect: {equals: 0}}
    - {command: [PING], expect: {equals: PONG}}
    - {command: [PING], node: 1, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [migrate.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: migrate}
