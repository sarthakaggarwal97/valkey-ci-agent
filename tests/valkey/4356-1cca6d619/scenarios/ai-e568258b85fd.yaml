scenario_id: ai-e568258b85fd
seed: 43608
experiment:
  id: valkey.replication-chaos
  inputs:
    mutation_rate: 600
    value_size: 1024
    wait_replicas: 1
    waves:
    - - op: stall
        target: replica
        duration_s: 2.0
    - - op: promote
        target: replica
        mode: graceful
    - - op: backlog_pressure
