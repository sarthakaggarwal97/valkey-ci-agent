extends: [valkey.liveness]
id: proposed.lua-async-flush-gc-race
deployment:
  modes: [standalone]
metadata:
  description: "SCRIPT FLUSH ASYNC with >64 cached scripts queues the old Lua interpreter\
    \ to a bio thread while new EVALs run on the fresh interpreter; the parent ran\
    \ lua_gc on the live global context (a cross-thread GC race), the fixed build\
    \ gc's the context it closes."
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: flush
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - {command: [SCRIPT, LOAD, "return 1"], expect: {exists: true}}
    - {command: [SCRIPT, LOAD, "return 2"], expect: {exists: true}}
    - {command: [SCRIPT, LOAD, "return 3"], expect: {exists: true}}
