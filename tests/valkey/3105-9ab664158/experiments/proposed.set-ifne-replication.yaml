extends: [valkey.liveness]
id: proposed.set-ifne-replication
deployment:
  modes: [standalone]
metadata:
  description: SET IFNE writes, including the PXAT rewrite and GET stripping, reach
    a replica intact
components:
- use: valkey.action.commands
  id: repl
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 90
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [SET, k, v1], expect: {equals: OK}}
    - {command: [SET, k, v2, IFNE, v1, EX, 100], expect_difference: true, expect: {
        equals: OK}}
    - {command: [SET, k2, a, IFNE, zzz], expect_difference: true, expect: {equals: OK}}
    - {command: [SET, k, nope, IFNE, v2], expect_difference: true, expect: {equals: null}}
    - {command: [SET, k3, old], expect: {equals: OK}}
    - {command: [SET, k3, new, GET, IFNE, wrong, EX, 50], expect_difference: true,
      expect: {equals: old}}
    - {command: [WAIT, 1, 10000], expect: {equals: 1}}
    - {command: [GET, k], node: 1, expect_difference: true, expect: {equals: v2}}
    - {command: [TTL, k], node: 1, compare: skip, expect: {min: 90, max: 100}}
    - {command: [GET, k2], node: 1, expect_difference: true, expect: {equals: a}}
    - {command: [GET, k3], node: 1, expect_difference: true, expect: {equals: new}}
    - {command: [TTL, k3], node: 1, compare: skip, expect: {min: 40, max: 50}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
