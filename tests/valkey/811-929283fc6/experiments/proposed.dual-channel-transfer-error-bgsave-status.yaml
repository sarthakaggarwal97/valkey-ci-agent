extends: [valkey.liveness]
id: proposed.dual-channel-transfer-error-bgsave-status
deployment:
  modes: [standalone]
metadata:
  description: A dual-channel RDB transfer aborted mid-sync must not flip rdb_last_bgsave_status
    and block writes under stop-writes-on-bgsave-err
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: dual-channel-abort
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 30
    server_config:
      dual-channel-replication-enabled: "yes"
      repl-diskless-sync: "yes"
      repl-diskless-sync-delay: 0
      save: "3600 1"
      stop-writes-on-bgsave-err: "yes"
      appendonly: "no"
    commands:
    - {command: [DEBUG, POPULATE, 1000], expect: {equals: OK}}
    - {command: [CONFIG, SET, rdb-key-save-delay, 20000], expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, persistence], wait_s: 30, compare: skip, expect: {contains: "rdb_bgsave_in_progress:1"}}
    - {command: [CLIENT, KILL, TYPE, replica], compare: skip, expect: {min: 1}}
    - {command: [REPLICAOF, NO, ONE], node: 1, expect: {equals: OK}}
    - {command: [CONFIG, SET, rdb-key-save-delay, 0], expect: {equals: OK}}
    - {command: [INFO, persistence], wait_s: 60, compare: skip, expect: {contains: "rdb_bgsave_in_progress:0"}}
    - {command: [SET, write-after-abort, v1], expect_difference: true, expect: {error: false}}
    - {command: [GET, write-after-abort], expect_difference: true, expect: {equals: v1}}
    - {command: [BGSAVE], compare: skip, expect: {error: false}}
    - {command: [INFO, persistence], wait_s: 30, compare: skip, expect: {contains: "rdb_last_bgsave_status:ok"}}
    - {command: [SET, write-after-recovery, v2], expect: {equals: OK}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [dual-channel-abort.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: dual-channel-abort}
