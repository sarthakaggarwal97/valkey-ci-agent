extends: [valkey.liveness]
id: proposed.clients-timer-overload-info
deployment:
  modes: [standalone]
metadata:
  description: 211 connected clients at hz 1 push clientsTimeProc past MAX_CLIENTS_PER_CYCLE
    so it reschedules at the required rate; INFO server/clients read clients_hz and
    getExpensiveClientsInfo, and the idle-client timeout proves clientsCron still
    reaps clients on the new timer
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: overload
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server_config: {hz: 1}
    resp: {$ref: inputs.resp}
    timeout_s: 10
    commands:
