extends: [valkey.liveness]
id: proposed.dual-channel-full-sync-compare
deployment:
  modes: [standalone]
metadata:
  description: Full sync over the new dual channel (RDB channel plus main-channel
    PSYNC) compared against the parent's single-channel full sync, plus the new REPLCONF
    options, DEBUG subcommands, config and INFO fields
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: dual-sync
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 90
    server_config:
      enable-protected-configs: "yes"
      repl-diskless-sync: "yes"
      repl-diskless-sync-delay: 0
    commands:
    - {command: [CONFIG, SET, dual-channel-replication-enabled, "yes"], expect_difference: true,
      expect: {equals: OK}}
    - {command: [CONFIG, SET, dual-channel-replication-enabled, "yes"], node: 1, expect_difference: true,
      expect: {equals: OK}}
    - {command: [DEBUG, SLEEP-AFTER-FORK-SECONDS, "0.5"], expect_difference: true,
      expect: {equals: OK}}
    - {command: [DEBUG, DELAY-RDB-CLIENT-FREE-SECONDS, "5"], expect_difference: true,
      expect: {equals: OK}}
    - {command: [REPLCONF, rdb-channel, "1"], connection: probe, expect_difference: true,
      expect: {equals: OK}}
    - {command: [REPLCONF, rdb-channel, "7"], connection: probe, expect_difference: true,
      expect: {error: true}}
    - {command: [REPLCONF, set-rdb-client-id, "93372036854775807"], connection: probe,
      expect_difference: true, expect: {error: "Unrecognized RDB client id"}}
    - {command: [REPLCONF, capa, eof, capa, psync2, capa, dual-channel], connection: probe,
      expect: {equals: OK}}
    - {command: [SET, k1, v1], expect: {equals: OK}}
    - {command: [RPUSH, biglist, a, b, c, d, e, f, g, h], expect: {equals: 8}}
    - {command: [SET, "", empty-key-value], expect: {equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 40, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [GET, k1], node: 1, expect: {equals: v1}}
    - {command: [LRANGE, biglist, 0, -1], node: 1, expect: {equals: [a, b, c, d, e,
          f, g, h]}}
    - {command: [GET, ""], node: 1, expect: {equals: empty-key-value}}
    - {command: [SET, k2, v2], expect: {equals: OK}}
    - {command: [GET, k2], node: 1, wait_s: 15, expect: {equals: v2}}
    - {command: [INFO, replication], node: 1, expect_difference: true, expect: {contains: "replicas_repl_buffer_size:"}}
    - {command: [INFO, replication], expect_difference: true, expect: {contains: "replicas_waiting_psync:"}}
    - {command: [REPLICAOF, NO, ONE], node: 1, expect: {equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 40, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [GET, k2], node: 1, expect: {equals: v2}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [dual-sync.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: dual-sync}
