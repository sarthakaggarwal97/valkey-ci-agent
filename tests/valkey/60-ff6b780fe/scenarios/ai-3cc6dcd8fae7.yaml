scenario_id: ai-3cc6dcd8fae7
seed: 7501
experiment:
  id: valkey.replication-chaos
  inputs:
    mutation_rate: 400
    value_size: 4096
    stable_keys: 1000
    mutable_keys: 300
    waves:
    - - op: kill
        target: replica
        signal: SIGKILL
        delay_s: 0.5
      - op: restart
        target: killed
        delay_s: 1.5
    - - op: repoint
        target: replica
        to: replica
      - op: backlog_pressure
        repl_backlog_size: 16384
        output_limit: 65536
        duration_s: 2.0
        delay_s: 0.2
