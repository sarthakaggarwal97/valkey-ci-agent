extends: [valkey.liveness]
id: proposed.module-command-table-compare
deployment:
  modes: [standalone]
metadata:
  description: Module command registration and ACL enforcement on module commands
    under the retyped command hashtables (current_name key for server.commands, fullname
    for orig_commands), compared with the parent
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: modcmds
  config:
    compare_with: {$ref: artifacts.parent.binary}
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 15
    commands:
    - {command: [datatype.set, k, 1, one], expect: {equals: OK}}
    - {command: [datatype.get, k], expect: {equals: [1, one]}}
    - {command: [TYPE, k], expect: {equals: test___dt}}
    - {command: [datatype.set, k2, 2, two], expect: {equals: OK}}
    - {command: [datatype.swap, k, k2], expect: {equals: OK}}
    - {command: [datatype.get, k], expect: {equals: [2, two]}}
    - {command: [datatype.get, missing]}
    - {command: [COMMAND, INFO, datatype.get]}
    - {command: [ACL, SETUSER, mu, on, nopass, "~*", "&*", "-@all", "+datatype.get",
        "+acl"], expect: {equals: OK}}
    - {command: [AUTH, mu, x], expect: {equals: OK}}
    - {command: [ACL, WHOAMI], expect: {equals: mu}}
    - {command: [datatype.get, k], expect: {equals: [2, two]}}
    - {command: [datatype.set, k, 9, nine], expect: {error: NOPERM}}
    - {command: [AUTH, default, x], expect: {equals: OK}}
    - {command: [datatype.get, k], expect: {equals: [2, two]}}
    checks:
      acl: true
      compat: true
      variants: true
required_events: [modcmds.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: modcmds}
