extends: [valkey.liveness]
id: proposed.module-skip-validation-replication
deployment:
  modes: [standalone]
metadata:
  description: VM_Replicate with SKIP_COMMAND_VALIDATION set (propagate.so at the
    change) propagates timer, thread, detached-context and mixed commands to a replica
    exactly as the parent's validated path does
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: repl
  config:
    compare_with: {$ref: artifacts.parent.binary}
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    nodes: 2
    timeout_s: 15
    commands:
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, compare: skip, wait_s: 30, expect: {
        contains: "master_link_status:up"}}
    - {command: [propagate-test.simple], expect: {equals: OK}}
    - {command: [GET, counter-1], expect: {equals: null}}
    - {command: [GET, counter-1], node: 1, wait_s: 15, expect: {equals: "1"}}
    - {command: [GET, counter-2], node: 1, wait_s: 15, expect: {equals: "1"}}
    - {command: [propagate-test.mixed], expect: {equals: OK}}
    - {command: [GET, using-call], expect: {equals: "1"}}
    - {command: [GET, counter-1], node: 1, wait_s: 15, expect: {equals: "2"}}
    - {command: [GET, counter-2], node: 1, wait_s: 15, expect: {equals: "2"}}
    - {command: [GET, using-call], node: 1, wait_s: 15, expect: {equals: "1"}}
    - {command: [GET, after-call], node: 1, wait_s: 15, expect: {equals: "1"}}
    - {command: [propagate-test.timer], expect: {equals: OK}}
    - {command: [GET, timer], node: 1, wait_s: 20, expect: {equals: "3"}}
    - {command: [propagate-test.thread], expect: {equals: OK}}
    - {command: [SELECT, 9], node: 1, expect: {equals: OK}}
    - {command: [GET, a-from-thread], node: 1, wait_s: 20, expect: {equals: "3"}}
    - {command: [GET, b-from-thread], node: 1, wait_s: 20, expect: {equals: "3"}}
    - {command: [GET, thread-call], node: 1, wait_s: 20, expect: {equals: "3"}}
    - {command: [propagate-test.detached-thread], expect: {equals: OK}}
    - {command: [GET, thread-detached-before], node: 1, wait_s: 20, expect: {equals: "1"}}
    - {command: [GET, thread-detached-after], node: 1, wait_s: 20, expect: {equals: "1"}}
    - {command: [SELECT, 0], node: 1, expect: {equals: OK}}
    - {command: [propagate-test.incr, vkey], expect: {equals: 1}}
    - {command: [GET, vkey], node: 1, wait_s: 15, expect: {equals: "1"}}
    - {command: [propagate-test.obeyed], node: 1, wait_s: 10, expect: {equals: 1}}
    checks:
      acl: true
      compat: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
