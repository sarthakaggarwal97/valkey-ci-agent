extends: [valkey.liveness]
id: proposed.credential-redaction-on-reject
deployment:
  modes: [standalone]
metadata:
  description: HELLO, AUTH and MIGRATE credentials are redacted in the commandlog
    even when argument validation rejects the command
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: redact
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server_config: {slowlog-log-slower-than: 0}
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
    - {command: [HELLO, "4", AUTH, defuser, s3cret-pw-one], expect: {error: "unsupported\
          \ protocol version"}}
    - {command: [SLOWLOG, GET, "1"], expect_difference: true, expect: {contains: "(redacted)"}}
    - {command: [HELLO, "3", AUTH, s3cret-pw-two], expect: {error: "Syntax error in\
          \ HELLO option"}}
    - {command: [SLOWLOG, GET, "1"], expect_difference: true, expect: {contains: "(redacted)"}}
    - {command: [HELLO, notanumber, AUTH, defuser, s3cret-pw-three], expect: {error: "Protocol\
          \ version is not an integer"}}
    - {command: [SLOWLOG, GET, "1"], expect_difference: true, expect: {contains: "(redacted)"}}
    - {command: [HELLO, "9999999999999999999999", AUTH, "", ""], expect: {error: "Protocol\
          \ version is not an integer"}}
    - {command: [SLOWLOG, GET, "1"], expect_difference: true, expect: {contains: "(redacted)"}}
    - {command: [AUTH, defuser, s3cret-pw-four, extra-arg], expect: {error: "syntax\
          \ error"}}
    - {command: [SLOWLOG, GET, "1"], expect_difference: true, expect: {contains: "(redacted)"}}
    - {command: [AUTH, p01, p02, p03, p04, p05, p06, p07, p08, p09, p10, p11, p12,
        p13, p14, p15, p16, p17, p18, p19, p20, p21, p22, p23, p24, p25, p26, p27,
        p28, p29, p30, p31, p32, p33, s3cret-p34], expect: {error: "syntax error"}}
    - {command: [SLOWLOG, GET, "1"], expect_difference: true, expect: {contains: "(redacted)"}}
    - {command: [MIGRATE, 127.0.0.1, "1", somekey, "9", "100", BOGUS, AUTH, s3cret-pw-five],
      expect: {error: "syntax error"}}
    - {command: [SLOWLOG, GET, "1"], expect_difference: true, expect: {contains: "(redacted)"}}
    - {command: [MIGRATE, 127.0.0.1, "1", somekey, "9", "100", AUTH2, s3cret-user-six],
      expect: {error: "syntax error"}}
    - {command: [SLOWLOG, GET, "1"], expect_difference: true, expect: {contains: "(redacted)"}}
    - {command: [PING], expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [redact.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: redact}
