extends: [valkey.liveness]
id: proposed.syncslots-establish-errors
deployment:
  modes: [standalone, cluster]
metadata:
  description: Reworded CLUSTER SYNCSLOTS ESTABLISH validation errors and the new
    SYNCSLOTS FINISH subcommand, compared across builds
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: syncslots
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 20
    commands:
    - {command: [CLUSTER, SETSLOT, 0, MIGRATING, "<node.1.id>"], node: 0, expect: {
        equals: OK}}
    - {command: [CLUSTER, SYNCSLOTS, ESTABLISH, SOURCE, "<node.1.id>", NAME, aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa,
        SLOTSRANGE, 0, 0], node: 0, expect_difference: true, expect: {error: "Slots\
          \ are being manually migrated"}}
    - {command: [CLUSTER, SETSLOT, 0, STABLE], node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, SYNCSLOTS, FINISH, STATE, success, NAME, bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb],
      node: 0, connection: finish, expect_difference: true, expect: {equals: OK}}
    - {command: [CLUSTER, REPLICATE, "<node.0.id>"], node: 1, expect: {equals: OK}}
    - {command: [CLUSTER, SYNCSLOTS, ESTABLISH, SOURCE, "<node.0.id>", NAME, aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa,
        SLOTSRANGE, 0, 0], node: 1, expect_difference: true, expect: {error: "Slot\
          \ migration can only be used on primary nodes"}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [syncslots.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: syncslots}
