extends: [valkey.liveness]
id: proposed.io-thread-active-time-info
deployment:
  modes: [standalone]
metadata:
  description: INFO cpu gains used_active_time_io_thread_<N> for every spawned I/O
    thread, the fields track runtime io-threads resizing, and resizing never deadlocks
    the reworked I/O thread wait loop
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: iotime
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server_config: {io-threads: 4, events-per-io-thread: 0, enable-debug-command: "yes"}
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - {command: [SET, k0, v0], expect: {equals: OK}}
    - {command: [SET, k1, v1], connection: c1, expect: {equals: OK}}
    - {command: [SET, k2, v2], connection: c2, expect: {equals: OK}}
    - {command: [SET, k3, v3], connection: c3, expect: {equals: OK}}
    - {command: [INCR, ctr], connection: c1, expect: {equals: 1}}
    - {command: [INCR, ctr], connection: c2, expect: {equals: 2}}
    - {command: [INCR, ctr], connection: c3, expect: {equals: 3}}
    - {command: [GET, k0], expect: {equals: v0}}
    - {command: [INFO, cpu], expect_difference: true, expect: {contains: used_active_time_io_thread_1}}
    - {command: [INFO, cpu], expect_difference: true, expect: {contains: used_active_time_io_thread_3}}
    - {command: [CONFIG, SET, io-threads, 1], expect: {equals: OK}}
    - {command: [INFO, cpu], compare: skip}
    - {command: [SET, k4, v4], expect: {equals: OK}}
    - {command: [CONFIG, SET, io-threads, 6], expect: {equals: OK}}
    - {command: [SET, k5, v5], connection: c1, expect: {equals: OK}}
    - {command: [SET, k6, v6], connection: c2, expect: {equals: OK}}
    - {command: [GET, k5], connection: c3, expect: {equals: v5}}
    - {command: [INFO, cpu], expect_difference: true, expect: {contains: used_active_time_io_thread_5}}
    - {command: [CONFIG, SET, io-threads, 2], expect: {equals: OK}}
    - {command: [SET, k7, v7], expect: {equals: OK}}
    - {command: [INFO, cpu], expect_difference: true, expect: {contains: used_active_time_io_thread_1}}
    - {command: [GET, k7], expect: {equals: v7}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [iotime.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: iotime}
