extends: [valkey.liveness]
id: proposed.errorstats-overflow
deployment:
  modes: [standalone]
metadata:
  description: >
    Past 128 distinct error prefixes, new custom (Lua/FCALL) errors are tracked under
    ERRORSTATS_OVERFLOW while non-custom errors and already-tracked custom errors
    keep their own counters; the parent build instead disables errorstats (ERRORSTATS_DISABLED).
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: errstats
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - {command: [CONFIG, RESETSTAT], expect: {equals: OK}}
    - {command: [EVAL, "return {err=ARGV[1]..' e'}", 0, a000]}
