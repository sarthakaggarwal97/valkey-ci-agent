extends: [valkey.liveness]
id: proposed.replication-handshake-compare
deployment:
  modes: [standalone]
metadata:
  description: REPLICAOF handshake, full sync, WAIT, good-replica accounting (min-slaves-to-write
    alias) and promotion compared between the change and its parent
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: repl
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 90
    commands:
    - {command: [SET, k1, v1], node: 0, expect: {equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [GET, k1], node: 1, wait_s: 30, expect: {equals: v1}}
    - {command: [SET, k2, v2], node: 0, expect: {equals: OK}}
    - {command: [WAIT, "1", "10000"], node: 0, wait_s: 30, expect: {equals: 1}}
    - {command: [GET, k2], node: 1, expect: {equals: v2}}
    - {command: [SET, kro, v], node: 1, expect: {error: "READONLY"}}
    - {command: [CONFIG, SET, slave-read-only, "no"], node: 1, expect: {equals: OK}}
    - {command: [SET, kro, v], node: 1, expect: {equals: OK}}
    - {command: [CONFIG, SET, min-slaves-to-write, "1"], node: 0, expect: {equals: OK}}
    - {command: [SET, k4, v4], node: 0, wait_s: 15, expect: {equals: OK}}
    - {command: [REPLICAOF, NO, ONE], node: 1, expect: {equals: OK}}
    - {command: [SET, k6, v6], node: 0, wait_s: 30, expect: {error: "NOREPLICAS"}}
    - {command: [CONFIG, SET, min-slaves-to-write, "0"], node: 0, expect: {equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [SET, k7, v7], node: 0, expect: {equals: OK}}
    - {command: [GET, k7], node: 1, wait_s: 30, expect: {equals: v7}}
    - {command: [ROLE], node: 1, compare: skip}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
