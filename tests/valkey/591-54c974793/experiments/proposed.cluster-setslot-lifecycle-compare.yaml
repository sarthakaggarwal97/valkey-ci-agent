extends: [valkey.liveness]
id: proposed.cluster-setslot-lifecycle-compare
deployment:
  modes: [standalone]
metadata:
  description: CLUSTER SETSLOT role checks, replica-ack forced replication, demotion
    on losing the last slot, and CLUSTER FORGET of own primary, compared across builds
components:
- use: valkey.action.commands
  id: setslot
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 3
    timeout_s: 120
    commands:
    - {command: [CLUSTER, REPLICATE, "<node.0.id>"], node: 2, expect: {equals: OK}}
    - {command: [WAIT, 1, 500], node: 0, wait_s: 60, expect: {min: 1}}
    - {command: [CLUSTER, SETSLOT, 5, MIGRATING, "<node.1.id>"], node: 2, expect: {
        error: "only with masters"}}
    - {command: [CLUSTER, SETSLOT, 5, MIGRATING, "<node.1.id>"], node: 1, expect: {
        error: "not the owner of hash slot"}}
    - {command: [CLUSTER, SETSLOT, 5, MIGRATING, "<node.2.id>"], node: 0, expect: {
        error: "not a master"}}
    - {command: [CLUSTER, SETSLOT, 5, IMPORTING, "<node.2.id>"], node: 1, expect: {
        error: "not a master"}}
    - {command: [CLUSTER, SETSLOT, 5, NODE, "<node.2.id>"], node: 1, expect: {error: "not\
          \ a master"}}
    - {command: [CLUSTER, SETSLOT, 100, IMPORTING, "<node.0.id>"], node: 1, expect: {
        equals: OK}}
    - {command: [CLUSTER, SETSLOT, 100, MIGRATING, "<node.1.id>"], node: 0, expect: {
        equals: OK}}
    - {command: [CLUSTER, SETSLOT, 100, NODE, "<node.1.id>"], node: 1, expect: {equals: OK}}
    - {command: [CLUSTER, SETSLOT, 100, NODE, "<node.1.id>"], node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, COUNTKEYSINSLOT, 100], node: 1, expect: {equals: 0}}
    - {command: [CLUSTER, SETSLOT, 100, NODE, "<node.0.id>"], node: 1, expect: {equals: OK}}
    - {command: [ROLE], node: 1, compare: skip}
    - {command: [CLUSTER, FORGET, "<node.0.id>"], node: 2, expect: {error: "Can't\
          \ forget my master"}}
    - {command: [CLUSTER, FORGET, "<node.1.id>"], node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, INFO], node: 2, compare: skip, wait_s: 30, expect: {contains: "cluster_known_nodes:2"}}
    - {command: [PING], node: 0, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [setslot.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: setslot}
