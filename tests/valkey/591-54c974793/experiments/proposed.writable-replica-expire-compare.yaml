extends: [valkey.liveness]
id: proposed.writable-replica-expire-compare
deployment:
  modes: [standalone]
metadata:
  description: Writable-replica expire tracking and active expiry, SWAPDB and FLUSHALL
    flushing the tracked list, FLUSHALL save with save points, DEBUG REPLICATE, replicaof
    config rewrite, oom-score-adj ordering warning, and eviction with a replica attached,
    compared across builds
components:
- use: valkey.action.commands
  id: wrepl
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    server_config: {save: "3600 1"}
    timeout_s: 180
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [WAIT, 1, 500], node: 0, wait_s: 60, expect: {min: 1}}
    - {command: [CONFIG, SET, replica-read-only, no], node: 1, expect: {equals: OK}}
    - {command: [SET, wlocal, v1], node: 1, expect: {equals: OK}}
    - {command: [PEXPIRE, wlocal, 80], node: 1, expect: {equals: 1}}
    - {command: [SET, wlocal2, v2, PX, 90], node: 1, expect: {equals: OK}}
    - {command: [SELECT, 1], node: 1, expect: {equals: OK}}
    - {command: [SET, wdb1, v3, PX, 70], node: 1, expect: {equals: OK}}
    - {command: [SELECT, 0], node: 1, expect: {equals: OK}}
    - {command: [EXISTS, wlocal], node: 1, wait_s: 20, expect: {equals: 0}}
    - {command: [EXISTS, wlocal2], node: 1, wait_s: 20, expect: {equals: 0}}
    - {command: [SET, wkeep, v, EX, 100], node: 1, expect: {equals: OK}}
    - {command: [SWAPDB, 0, 1], node: 1, expect: {equals: OK}}
    - {command: [SET, wkeep2, v, EX, 100], node: 1, expect: {equals: OK}}
    - {command: [FLUSHALL], node: 1, expect: {equals: OK}}
    - {command: [DEBUG, REPLICATE, SET, injected, 42], node: 0, expect: {equals: OK}}
    - {command: [GET, injected], node: 1, wait_s: 15, expect: {equals: "42"}}
    - {command: [CONFIG, GET, replicaof], node: 1, compare: skip}
    - {command: [CONFIG, REWRITE], node: 1, expect: {equals: OK}}
    - {command: [CONFIG, REWRITE], node: 0, expect: {equals: OK}}
    - {command: [CONFIG, SET, oom-score-adj, yes], node: 0, expect: {equals: OK}}
    - {command: [CONFIG, SET, oom-score-adj-values, "100 50 25"], node: 0, expect: {
        equals: OK}}
    - {command: [CONFIG, SET, oom-score-adj, no], node: 0, expect: {equals: OK}}
    - {command: [FLUSHALL, SYNC], node: 0, expect: {equals: OK}}
    - {command: [CONFIG, SET, maxmemory-policy, allkeys-random], node: 0, expect: {
        equals: OK}}
    - {command: [CONFIG, SET, maxmemory, 3mb], node: 0, expect: {equals: OK}}
    - {command: [DEBUG, POPULATE, 60000], node: 0, expect: {equals: OK}}
    - {command: [PING], node: 0, expect: {equals: PONG}}
    - {command: [DBSIZE], node: 0, compare: skip}
    - {command: [CONFIG, SET, maxmemory, 0], node: 0, expect: {equals: OK}}
    - {command: [CONFIG, SET, maxmemory-policy, noeviction], node: 0, expect: {equals: OK}}
    - {command: [PING], node: 1, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [wrepl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: wrepl}
