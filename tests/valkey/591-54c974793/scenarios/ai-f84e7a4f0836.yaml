        target: any
        signal: SIGKILL
      - op: failover
        shard: 3
        force: true
        delay_s: 1.0
    validation:
      stabilization_wait: 10
      validation_timeout: 90
deployment:
  mode: cluster
  primaries: 4
  replicas_per_primary: 2
  base_port: 7700
  server_config:
    cluster-node-timeout: 3000
