scenario_id: ai-f84e7a4f0836
seed: 707
experiment:
  id: valkey.cluster-chaos
  inputs:
    command_rate: 200
    keys_per_slot: 3
    waves:
    - - op: kill
        target: primary
        signal: SIGKILL
      - op: kill
        target: replica
        signal: SIGTERM
        delay_s: 0.3
    - - op: failover
        shard: 1
        force: true
      - op: failover
        shard: 2
        delay_s: 0.5
