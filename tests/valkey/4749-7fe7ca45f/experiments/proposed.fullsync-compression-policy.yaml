extends: [valkey.liveness]
id: proposed.fullsync-compression-policy
deployment:
  modes: [standalone]
metadata:
  description: SYNC without EOF capability is rejected under a whole-stream rdbcompression
    codec, and the wire codec negotiation walks down to the strongest codec the replica
    accepts instead of dropping to plaintext
inputs:
  properties:
    rdbcompression: {type: string, enum: [lz4, zstd], default: lz4}
components:
- use: valkey.action.commands
  id: policy
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    server_config:
      repl-diskless-sync: "no"
      repl-ping-replica-period: 1
    timeout_s: 120
    commands:
    - {command: [SET, "big:1", "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"],
      expect: {equals: OK}}
    - {command: [SET, "big:2", "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"],
      expect: {equals: OK}}
    - {command: [CONFIG, SET, rdbcompression, {$ref: inputs.rdbcompression}], node: 0,
      expect: {equals: OK}}
    - {command: [SYNC], connection: oldsync, node: 0, expect_difference: true, expect: {
        error: "without EOF capability"}}
    - {command: [CONFIG, SET, repl-compression, zstd], node: 0, expect: {equals: OK}}
    - {command: [CONFIG, SET, repl-compression, lz4], node: 1, expect: {equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [INFO, replication], node: 0, wait_s: 15, expect_difference: true,
      expect: {contains: "repl_compression=lz4"}}
    - {command: [GET, "big:1"], node: 1, wait_s: 10, expect: {equals: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [policy.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: policy}
