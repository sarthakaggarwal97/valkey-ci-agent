extends: [valkey.liveness]
id: proposed.set-ttl-propagation
deployment:
  modes: [standalone]
metadata:
  description: SET key value EX/PX/EXAT now rewrites argv[3..4] in place instead of
    the whole vector for PXAT propagation; verify the propagated form reaches a replica
    and the AOF intact, and that SETEX/NX/GET/MULTI/EVAL and expire-parse errors behave
    identically
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: setttl
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    server_config: {appendonly: "yes", appendfsync: always}
    timeout_s: 30
    commands:
    - {command: [SET, k_exat, v1, EXAT, 4102444800], expect: {equals: OK}}
    - {command: [PEXPIRETIME, k_exat], expect: {equals: 4102444800000}}
    - {command: [SET, k_ex, v2, EX, 100000], expect: {equals: OK}}
    - {command: [PEXPIRETIME, k_ex], compare: skip, expect: {min: 1700000000000}}
    - {command: [SET, k_px, v3, PX, 100000000], expect: {equals: OK}}
    - {command: [set, k_case, !!binary 'AGJpbgA=', ex, 100000], expect: {equals: OK}}
    - {command: [SET, k_nx, v5, NX, EX, 100000], expect: {equals: OK}}
    - {command: [SET, k_exat, v6, GET, EXAT, 4102444801], expect: {equals: v1}}
    - {command: [PEXPIRETIME, k_exat], expect: {equals: 4102444801000}}
    - {command: [MULTI], expect: {equals: OK}}
    - {command: [SET, k_m, v7, EX, 100000], expect: {equals: QUEUED}}
    - {command: [EXEC], expect: {equals: [OK]}}
    - {command: [EVAL, "return redis.call('SET', KEYS[1], ARGV[1], 'EX', 100000)",
        1, k_lua, v8], expect: {equals: OK}}
    - {command: [SET, k_dead, v9, EXAT, 1000000000], expect: {equals: OK}}
    - {command: [EXISTS, k_dead], expect: {equals: 0}}
    - {command: [SETEX, k_setex, 100000, v10], expect: {equals: OK}}
    - {command: [SET, k_err, v, EX, 0], expect: {error: "invalid expire"}}
    - {command: [SET, k_err, v, EX, 9223372036854775807], expect: {error: true}}
    - {command: [SET, k_err, v, EX, 100, PXAT, 4102444800000], expect: {error: true}}
    - {command: [EXISTS, k_err], expect: {equals: 0}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, compare: skip, wait_s: 30, expect: {
        contains: "master_link_status:up"}}
    - {command: [GET, k_exat], node: 1, wait_s: 30, expect: {equals: v6}}
    - {command: [PEXPIRETIME, k_exat], node: 1, expect: {equals: 4102444801000}}
    - {command: [GET, k_case], node: 1, expect: {equals: !!binary 'AGJpbgA='}}
    - {command: [PEXPIRETIME, k_case], node: 1, compare: skip, expect: {min: 1700000000000}}
    - {command: [GET, k_lua], node: 1, expect: {equals: v8}}
    - {command: [PEXPIRETIME, k_lua], node: 1, compare: skip, expect: {min: 1700000000000}}
    - {command: [PEXPIRETIME, k_m], node: 1, compare: skip, expect: {min: 1700000000000}}
    - {command: [PEXPIRETIME, k_px], node: 1, compare: skip, expect: {min: 1700000000000}}
    - {command: [GET, k_nx], node: 1, expect: {equals: v5}}
    - {command: [EXISTS, k_dead], node: 1, expect: {equals: 0}}
    - {command: [PEXPIRETIME, k_setex], node: 1, compare: skip, expect: {min: 1700000000000}}
    - {restart: true, expect: {equals: OK}}
    - {command: [GET, k_exat], expect: {equals: v6}}
    - {command: [PEXPIRETIME, k_exat], expect: {equals: 4102444801000}}
    - {command: [GET, k_case], expect: {equals: !!binary 'AGJpbgA='}}
    - {command: [PEXPIRETIME, k_ex], compare: skip, expect: {min: 1700000000000}}
    - {command: [GET, k_m], expect: {equals: v7}}
    - {command: [GET, k_lua], expect: {equals: v8}}
    - {command: [GET, k_nx], expect: {equals: v5}}
    - {command: [EXISTS, k_dead], expect: {equals: 0}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [setttl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: setttl}
