extends: [valkey.liveness]
id: proposed.hash-field-ttl-aof-rewrite
deployment:
  modes: [standalone]
metadata:
  description: AOF rewrite of a listpack hash carrying field TTLs emits HSETEX/HMSET
    and reloads unchanged
inputs:
  properties:
    appendfsync: {type: string, enum: [always, everysec, no], default: everysec}
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: aofrw
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    timeout_s: 30
    server_config:
      appendonly: "yes"
      aof-use-rdb-preamble: "no"
      appendfsync: {$ref: inputs.appendfsync}
      hash-max-listpack-entries: 128
      hash-max-listpack-value: 64
    commands:
    - {command: [HSET, h, f1, v1, f2, v2, f3, v3, f4, v4], expect: {equals: 4}}
    - {command: [HEXPIRE, h, 100000, FIELDS, 2, f1, f4], expect: {equals: [1, 1]}}
    - {command: [OBJECT, ENCODING, h], expect_difference: true, expect: {equals: listpack}}
    - {command: [INFO, persistence], wait_s: 20, compare: skip, expect: {contains: "aof_rewrite_in_progress:0"}}
    - {command: [BGREWRITEAOF], expect: {contains: started}}
    - {command: [INFO, persistence], wait_s: 20, compare: skip, expect: {contains: "aof_last_bgrewrite_status:ok"}}
    - {restart: true, expect: {equals: OK}}
    - {command: [OBJECT, ENCODING, h], expect_difference: true, expect: {equals: listpack}}
    - {command: [HLEN, h], expect: {equals: 4}}
    - {command: [HGETALL, h], compare: unordered-pairs}
    - {command: [HGET, h, f2], expect: {equals: v2}}
    - {command: [HTTL, h, FIELDS, 2, f1, f4], compare: skip, expect: {exists: true}}
    - {command: [HTTL, h, FIELDS, 2, f2, f3], expect: {equals: [-1, -1]}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [aofrw.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: aofrw}
