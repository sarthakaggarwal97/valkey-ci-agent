extends: [valkey.liveness]
id: proposed.promoted-writable-replica-expire-leak
deployment:
  modes: [standalone]
metadata:
  description: >-
    A writable replica takes direct writes of keys with expiration (SET EX, EXPIRE,
    an empty key name, a keyword-named key), is promoted to primary via FAILOVER,
    and the fixed build drains slave_expires_tracked_keys to 0 while the parent leaks
    the tracking dict; the keys themselves and their TTLs must survive the cleanup.
components:
- use: valkey.action.commands
  id: promote-leak
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: 2
    timeout_s: 15
    commands:
    - {command: [SET, base_key, v0], node: 0, expect: {equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [CONFIG, SET, replica-read-only, no], node: 1, expect: {equals: OK}}
    - {command: [SET, expire_key_0, v, EX, 1000], node: 1, expect: {equals: OK}}
    - {command: [SET, expire_key_1, v, EX, 1000], node: 1, expect: {equals: OK}}
    - {command: [SET, expire_key_2, v, EX, 1000], node: 1, expect: {equals: OK}}
    - {command: [SET, expire_key_3, v, EX, 1000], node: 1, expect: {equals: OK}}
    - {command: [SET, expire_key_4, v, EX, 1000], node: 1, expect: {equals: OK}}
    - {command: [SET, expire_key_5, v, EX, 1000], node: 1, expect: {equals: OK}}
    - {command: [SET, expire_key_6, v, EX, 1000], node: 1, expect: {equals: OK}}
    - {command: [SET, expire_key_7, v, EX, 1000], node: 1, expect: {equals: OK}}
    - {command: [SET, '', v, EX, 1000], node: 1, expect: {equals: OK}}
    - {command: [SET, fields, v], node: 1, expect: {equals: OK}}
    - {command: [EXPIRE, fields, 1000], node: 1, expect: {equals: 1}}
    - {command: [INFO, stats], node: 1, expect: {contains: "slave_expires_tracked_keys:10"},
      compare: skip}
    - {command: [FAILOVER, TO, "<node.1.host>", "<node.1.port>"], node: 0, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 0, wait_s: 30, expect: {contains: "role:slave"},
      compare: skip}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "role:master"},
      compare: skip}
    - {command: [INFO, stats], node: 1, wait_s: 20, expect: {contains: "slave_expires_tracked_keys:0"},
      expect_difference: true}
    - {command: [GET, expire_key_0], node: 1, expect: {equals: v}}
    - {command: [TTL, expire_key_0], node: 1, expect: {min: 900}, compare: skip}
    - {command: [TTL, fields], node: 1, expect: {min: 900}, compare: skip}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [promote-leak.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: promote-leak}
