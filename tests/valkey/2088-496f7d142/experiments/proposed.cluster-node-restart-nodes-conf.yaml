extends: [valkey.base]
id: proposed.cluster-node-restart-nodes-conf
deployment:
  modes: [cluster]
  replicas_per_primary: {minimum: 1}
metadata:
  description: Kill a cluster node under writes and restart it at once; it must reload
    the nodes.conf written by the sdscatfmt save path, rejoin, and lose no acknowledged
    write
inputs:
  properties:
    instance: {type: string, enum: [primary, replica], default: primary}
    signal: {type: string, enum: [SIGKILL, SIGTERM], default: SIGKILL}
components:
- use: valkey.fault.process-signal
  id: kill-node
  config:
    when_event: warm-up.completed
    instance: {$ref: inputs.instance}
    signal: {$ref: inputs.signal}
    restart: true
    restart_mode: immediate
- use: valkey.action.sleep
  id: warm-up
  depends_on: [writes, kill-node]
  config: {seconds: 2}
- use: valkey.action.sleep
  id: settle
  depends_on: [warm-up]
  config: {seconds: 5}
- use: valkey.oracle.ledger
  id: data
  config: {workload: writes, loss_window_s: 2.5}
required_events: [warm-up.completed, kill-node.recovered]
required_evidence:
- {evidence_id: valkey.fault.injected, source: kill-node}
