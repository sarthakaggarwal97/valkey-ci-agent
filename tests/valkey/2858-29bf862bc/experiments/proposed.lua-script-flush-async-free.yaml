extends: [valkey.liveness]
id: proposed.lua-script-flush-async-free
deployment:
  modes: [standalone]
metadata:
  description: SCRIPT FLUSH ASYNC frees a large eval script cache on a background
    thread, acquiring and releasing the module GIL
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: flush
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
    - {command: [SCRIPT, LOAD, "return 1"], expect: {exists: true}}
    - {command: [SCRIPT, LOAD, "return 2"], expect: {exists: true}}
    - {command: [SCRIPT, LOAD, "return 3"], expect: {exists: true}}
