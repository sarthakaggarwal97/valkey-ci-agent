extends: [valkey.liveness]
id: proposed.repl-throttle-teardown-on-last-replica
deployment:
  modes: [standalone]
metadata:
  description: Repl throttler tears down immediately when the last replica disconnects,
    instead of lingering and throttling writes with no replica attached
components:
- use: valkey.action.commands
  id: teardown
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 60
    server_config:
      repl-throttling-enabled: "yes"
      repl-backlog-size: "1mb"
      client-output-buffer-limit: "replica 8mb 1mb 10000"
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [DEBUG, SLEEP, "9"], node: 1, connection: stall}
    - {command: [EVAL, "for i=1,16 do redis.call('SET', KEYS[1]..i, string.rep('x',\
          \ 65536)) end", 1, "k:a:"], node: 0}
    - {command: [EVAL, "for i=1,16 do redis.call('SET', KEYS[1]..i, string.rep('x',\
          \ 65536)) end", 1, "k:b:"], node: 0}
    - {command: [INFO, throttling], node: 0, wait_s: 10, compare: skip, expect: {
        contains: "repl_throttle_activation_events:1"}}
    - {command: [CLIENT, KILL, TYPE, replica], node: 0, compare: skip, expect: {min: 1}}
    - {command: [INFO, throttling], node: 0, wait_s: 5, expect_difference: true, expect: {
        contains: "repl_throttle_rate:-1.00"}}
    - {command: [SET, after, ok], node: 0, expect: {equals: OK}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [teardown.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: teardown}
