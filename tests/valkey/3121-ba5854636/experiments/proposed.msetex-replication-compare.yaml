extends: [valkey.liveness]
id: proposed.msetex-replication-compare
deployment:
  modes: [standalone]
metadata:
  description: MSETEX propagates to a live replica as PXAT with the right absolute
    expiry, including a past EXAT
components:
- use: valkey.action.commands
  id: repl
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 30
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [MSETEX, 2, k1, v1, k2, v2, EX, 100], expect_difference: true, expect: {
        equals: 1}}
    - {command: [MSETEX, 1, pk, pv, PX, 100000], expect_difference: true, expect: {
        equals: 1}}
    - {command: [MSETEX, 1, ek, ev, EXAT, 99999999999], expect_difference: true, expect: {
        equals: 1}}
    - {command: [MSETEX, 2, nk1, a, nk2, b, NX, PX, 90000], expect_difference: true,
      expect: {equals: 1}}
    - {command: [MSETEX, 1, kt, kv, EX, 100], expect_difference: true, expect: {equals: 1}}
    - {command: [MSETEX, 1, kt, kv2, KEEPTTL], expect_difference: true, expect: {
        equals: 1}}
    - {command: [WAIT, 1, 2000], wait_s: 15, expect: {min: 1}}
    - {command: [GET, k1], node: 1, expect_difference: true, expect: {equals: v1}}
    - {command: [GET, k2], node: 1, expect_difference: true, expect: {equals: v2}}
    - {command: [PTTL, k1], node: 1, expect_difference: true, expect: {min: 1000,
        max: 100000}}
    - {command: [PTTL, pk], node: 1, expect_difference: true, expect: {min: 1000,
        max: 100000}}
    - {command: [TTL, ek], node: 1, expect_difference: true, expect: {min: 1, max: 99999999999}}
    - {command: [PTTL, nk1], node: 1, expect_difference: true, expect: {min: 1000,
        max: 90000}}
    - {command: [GET, nk2], node: 1, expect_difference: true, expect: {equals: b}}
    - {command: [GET, kt], node: 1, expect_difference: true, expect: {equals: kv2}}
    - {command: [PTTL, kt], node: 1, expect_difference: true, expect: {min: 1000,
        max: 100000}}
    - {command: [MSETEX, 1, pastk, pv, EXAT, 1], expect_difference: true, expect: {
        equals: 1}}
    - {command: [WAIT, 1, 2000], wait_s: 15, expect: {min: 1}}
    - {command: [EXISTS, pastk], node: 1, expect: {equals: 0}}
    - {command: [PING], node: 1, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
