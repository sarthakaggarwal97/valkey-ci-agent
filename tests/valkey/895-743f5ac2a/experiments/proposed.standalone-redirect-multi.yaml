extends: [valkey.liveness]
id: proposed.standalone-redirect-multi
deployment:
  modes: [standalone]
metadata:
  description: >-
    Standalone -REDIRECT inside MULTI on a capa-redirect replica: EXEC that is redirected
    discards the transaction, and a queued command that is redirected flags it so
    EXEC answers EXECABORT
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: redirect-multi
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - {command: [CLIENT, CAPA, REDIRECT], node: 1, expect: {equals: OK}}
    - {command: [MULTI], node: 1, expect: {equals: OK}}
    - {command: [SET, foo, bar], node: 1, expect: {equals: QUEUED}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, connection: admin,
      expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, connection: admin, wait_s: 30, compare: skip,
      expect: {contains: "master_link_status:up"}}
    - {command: [EXEC], node: 1, compare: skip, expect: {error: REDIRECT}}
    - {command: [EXEC], node: 1, expect_difference: true, expect: {error: "EXEC without\
          \ MULTI"}}
    - {command: [MULTI], node: 1, expect_difference: true, expect: {equals: OK}}
    - {command: [PING], node: 1, expect: {equals: QUEUED}}
    - {command: [SET, k2, v2], node: 1, compare: skip, expect: {error: REDIRECT}}
    - {command: [GET, foo], node: 1, compare: skip, expect: {error: REDIRECT}}
    - {command: [EXEC], node: 1, expect_difference: true, expect: {error: EXECABORT}}
    - {command: [DISCARD], node: 1, expect_difference: true, expect: {error: "DISCARD\
          \ without MULTI"}}
    - {command: [REPLICAOF, NO, ONE], node: 1, connection: admin, expect: {equals: OK}}
    - {command: [MULTI], node: 1, expect: {equals: OK}}
    - {command: [SET, local, val], node: 1, expect: {equals: QUEUED}}
    - {command: [EXEC], node: 1, expect: {equals: [OK]}}
    - {command: [GET, local], node: 1, expect: {equals: val}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [redirect-multi.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: redirect-multi}
