extends: [valkey.liveness]
id: proposed.wait-waitaof-compare
deployment:
  modes: [standalone]
metadata:
  description: WAIT and WAITAOF ack, timeout and error paths after the BLOCKED_WAIT
    consolidation, compared across builds
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: waits
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
    - {command: [SET, k, v1], expect: {equals: OK}}
    - {command: [WAIT, 0, 0], expect: {equals: 0}}
    - {command: [WAIT, 1, 100], expect: {equals: 0}}
    - {command: [WAIT, 1, -1], expect: {error: true}}
    - {command: [WAITAOF, 0, 1, 100], expect: {equals: [0, 0]}}
    - {command: [WAITAOF, 1, 0, 100], expect: {error: "appendonly is disabled"}}
    - {command: [WAITAOF, 2, 0, 100], expect: {error: true}}
    - {command: [CONFIG, SET, appendonly, yes], node: 1, expect: {equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [SET, k, v2], expect: {equals: OK}}
    - {command: [WAIT, 1, 5000], wait_s: 30, expect: {equals: 1}}
    - {command: [WAIT, 2, 100], expect: {equals: 1}}
    - {command: [WAITAOF, 0, 1, 5000], wait_s: 30, expect: {equals: [0, 1]}}
    - {command: [CONFIG, SET, appendonly, yes], expect: {equals: OK}}
    - {command: [SET, k, v3], expect: {equals: OK}}
    - {command: [WAITAOF, 1, 1, 5000], wait_s: 30, expect: {equals: [1, 1]}}
    - {command: [WAITAOF, 0, 2, 100], expect: {equals: [1, 1]}}
    - {command: [PING], expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [waits.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: waits}
