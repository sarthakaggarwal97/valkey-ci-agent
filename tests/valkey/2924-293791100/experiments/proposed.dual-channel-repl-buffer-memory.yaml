extends: [valkey.liveness]
id: proposed.dual-channel-repl-buffer-memory
deployment:
  modes: [standalone]
metadata:
  description: >-
    INFO MEMORY gains mem_replicas_repl_buffer (folded into mem_total_replication_buffers)
    and MEMORY STATS gains replicas.repl.buffer (map length 33 -> 34). The fields
    are zero on an idle server, positive on a replica while it buffers the main-channel
    stream during a dual-channel full sync, and zero again once the buffer is streamed
    into the db and freed.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: seq
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 120
    server_config:
      dual-channel-replication-enabled: "yes"
      repl-diskless-sync: "yes"
      repl-diskless-sync-delay: 0
      repl-backlog-size: 1mb
      client-output-buffer-limit: "replica 0 0 0"
      loading-process-events-interval-bytes: 1024
    commands:
    - {command: [INFO, memory], expect_difference: true, expect: {contains: "mem_replicas_repl_buffer:"}}
    - command: [EVAL, "local t = server.call('MEMORY','STATS') for j=1,#t,2 do if\
          \ t[j]=='replicas.repl.buffer' then if tonumber(t[j+1])==0 then return 1\
          \ end return 2 end end return 0", 0]
      expect_difference: true
      expect: {equals: 1}
    - command: [EVAL, "local t = server.call('MEMORY','STATS') return #t/2", 0]
      expect_difference: true
      expect: {equals: 34}
    - {command: [MEMORY, STATS], compare: skip}
    - {command: [CONFIG, SET, rdb-key-save-delay, 5000], expect: {equals: OK}}
    - {command: [DEBUG, POPULATE, 2000, "key:", 3000], expect: {equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - command: [EVAL, "local i = server.call('INFO','persistence') if string.find(i,'rdb_bgsave_in_progress:1',1,true)\
          \ then return 1 end return 0", 0]
      wait_s: 20
      expect: {equals: 1}
    - command: [EVAL, "local v = string.rep('x',1000000) for j=1,40 do server.call('SET','big'..j,v)\
          \ end return 40", 0]
      expect: {equals: 40}
    - command: [EVAL, "local i = server.call('INFO','memory') local m = string.match(i,'mem_total_replication_buffers:(%d+)')\
          \ if m and tonumber(m)<10000000 then return 1 end return 0", 0]
      wait_s: 40
      expect: {equals: 1}
    - {command: [INFO, memory], node: 1, expect_difference: true, expect: {contains: "mem_replicas_repl_buffer:"}}
    - command: [EVAL, "local i = server.call('INFO','memory') local m = string.match(i,'mem_replicas_repl_buffer:(%d+)')\
          \ if m==nil then return 0 end local t = string.match(i,'mem_total_replication_buffers:(%d+)')\
          \ if tonumber(m)>0 and t and tonumber(t)>=tonumber(m) then return 1 end\
          \ return 2", 0]
      node: 1
      wait_s: 5
      expect_difference: true
      expect: {equals: 1}
    - command: [EVAL, "local i = server.call('INFO','replication') if string.find(i,'state=online',1,true)\
          \ then return 1 end return 0", 0]
      wait_s: 60
      expect: {equals: 1}
    - command: [EVAL, "local i = server.call('INFO','memory') local m = string.match(i,'mem_replicas_repl_buffer:(%d+)')\
          \ if m==nil then return 0 end if tonumber(m)==0 then return 1 end return\
          \ 2", 0]
      node: 1
      expect_difference: true
      expect: {equals: 1}
    - command: [EVAL, "local t = server.call('MEMORY','STATS') for j=1,#t,2 do if\
          \ t[j]=='replicas.repl.buffer' then if tonumber(t[j+1])==0 then return 1\
          \ end return 2 end end return 0", 0]
      node: 1
      expect_difference: true
      expect: {equals: 1}
    - command: [EVAL, "local i = server.call('INFO','replication') local m = string.match(i,'replicas_repl_buffer_peak:(%d+)')\
          \ if m and tonumber(m)>=1000000 then return 1 end return 0", 0]
      node: 1
      expect: {equals: 1}
    - {command: [DBSIZE], node: 1, expect: {equals: 2040}}
    - {command: [MEMORY, STATS], node: 1, compare: skip}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [seq.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: seq}
