extends: [valkey.liveness]
id: proposed.dual-channel-toggle-unprotected
deployment:
  modes: [standalone]
metadata:
  description: CONFIG SET dual-channel-replication-enabled is no longer protected;
    toggling it mid full sync on the primary or the replica leaves the running sync
    method intact and the sync completes
inputs:
  properties:
    initial: {type: string, enum: ["yes", "no"], default: "no", description: dual-channel-replication-enabled
        both servers start with}
    toggled: {type: string, enum: ["yes", "no"], default: "yes", description: the
        value the sequence toggles to mid-sync}
components:
- use: valkey.action.commands
  id: toggle
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 15
    server_config:
      dual-channel-replication-enabled: {$ref: inputs.initial}
      repl-diskless-sync-delay: 0
      save: ""
      appendonly: "no"
    commands:
    - {command: [CONFIG, SET, dual-channel-replication-enabled, {$ref: inputs.initial}],
      expect_difference: true, expect: {equals: OK}}
    - {command: [DEBUG, POPULATE, 1000], expect: {equals: OK}}
    - {command: [CONFIG, SET, rdb-key-save-delay, 5000], expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, persistence], wait_s: 30, expect: {contains: "rdb_bgsave_in_progress:1"},
      compare: skip}
    - {command: [CONFIG, SET, dual-channel-replication-enabled, {$ref: inputs.toggled}],
      expect_difference: true, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 90, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [GET, "key:1"], node: 1, expect: {equals: "value:1"}}
    - {command: [REPLICAOF, NO, ONE], node: 1, expect: {equals: OK}}
    - {command: [DEBUG, CHANGE-REPL-ID], expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, persistence], wait_s: 30, expect: {contains: "rdb_bgsave_in_progress:1"},
      compare: skip}
    - {command: [CONFIG, SET, dual-channel-replication-enabled, {$ref: inputs.toggled}],
      node: 1, expect_difference: true, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 90, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [SET, marker, round2], expect: {equals: OK}}
    - {command: [GET, marker], node: 1, wait_s: 10, expect: {equals: round2}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [toggle.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: toggle}
