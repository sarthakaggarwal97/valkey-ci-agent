extends: [valkey.liveness]
id: proposed.unshare-shared-int-replica
deployment:
  modes: [standalone]
metadata:
  description: >-
    A replica that stored a replicated shared integer unshares it on a touched read
    once maxmemory plus an LFU policy is set on the replica, and later replicated
    overwrites and deletes of the duplicated object stay consistent (no double free,
    no stale shared object).
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: replica-unshare
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    nodes: 2
    timeout_s: 120
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [SET, a, 1], node: 0, expect: {equals: OK}}
    - {command: [GET, a], node: 1, wait_s: 30, expect: {equals: "1"}}
    - {command: [OBJECT, REFCOUNT, a], node: 1, expect: {min: 2}}
    - {command: [CONFIG, SET, maxmemory, 1073741824], node: 1, expect: {equals: OK}}
    - {command: [CONFIG, SET, maxmemory-policy, allkeys-lfu], node: 1, expect: {equals: OK}}
    - {command: [GET, a], node: 1, expect: {equals: "1"}}
    - {command: [OBJECT, REFCOUNT, a], node: 1, expect_difference: true, expect: {
        equals: 1}}
    - {command: [SET, a, 9], node: 0, expect: {equals: OK}}
    - {command: [GET, a], node: 1, wait_s: 30, expect: {equals: "9"}}
    - {command: [OBJECT, REFCOUNT, a], node: 1, expect: {equals: 1}}
    - {command: [DEL, a], node: 0, expect: {equals: 1}}
    - {command: [EXISTS, a], node: 1, wait_s: 30, expect: {equals: 0}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [replica-unshare.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: replica-unshare}
