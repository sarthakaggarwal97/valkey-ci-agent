extends: [valkey.liveness]
id: proposed.rax-stream-alloc
deployment:
  modes: [standalone]
metadata:
  description: >-
    Rax alloc_size tracking (#688): build and shred streams, groups and PELs with
    boundary IDs so every raxGenericInsert/raxRemove branch runs, and compare MEMORY
    USAGE (now raxAllocSize) with the parent's old estimate; the max bound catches
    a size_t underflow in the new accounting.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    node_max_entries: {type: integer, enum: [1, 3, 100], default: 1}
components:
- use: valkey.action.commands
  id: rax
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server_config: {stream-node-max-entries: {$ref: inputs.node_max_entries}}
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - {command: [XADD, s, 1-1, f, v], expect: {equals: "1-1"}}
    - {command: [XADD, s, 1-2, f, v], expect: {equals: "1-2"}}
    - {command: [XADD, s, 1-3, f, v], expect: {equals: "1-3"}}
    - {command: [XADD, s, 2-0, f, v], expect: {equals: "2-0"}}
    - {command: [XADD, s, 2-1, f, v], expect: {equals: "2-1"}}
    - {command: [XADD, s, 3-0, f, v], expect: {equals: "3-0"}}
    - {command: [XADD, s, 255-0, f, v], expect: {equals: "255-0"}}
    - {command: [XADD, s, 256-0, f, v], expect: {equals: "256-0"}}
    - {command: [XADD, s, 65535-0, f, v], expect: {equals: "65535-0"}}
    - {command: [XADD, s, 65536-0, f, v], expect: {equals: "65536-0"}}
    - {command: [XADD, s, 2147483647-0, f, v], expect: {equals: "2147483647-0"}}
    - {command: [XADD, s, 2147483648-0, f, v], expect: {equals: "2147483648-0"}}
    - {command: [XADD, s, 4294967295-0, f, v], expect: {equals: "4294967295-0"}}
    - {command: [XADD, s, 4294967296-0, f, v], expect: {equals: "4294967296-0"}}
    - {command: [XADD, s, 4294967296-1, f, v], expect: {equals: "4294967296-1"}}
    - {command: [XADD, s, 4294967297-0, f, v], expect: {equals: "4294967297-0"}}
    - {command: [XADD, s, 99999999999-0, f, v], expect: {equals: "99999999999-0"}}
    - {command: [XADD, s, 99999999999-1, f, v], expect: {equals: "99999999999-1"}}
    - {command: [XADD, s, 99999999999-18446744073709551615, f, v], expect: {equals: "99999999999-18446744073709551615"}}
    - {command: [XADD, s, 18446744073709551614-0, f, v], expect: {equals: "18446744073709551614-0"}}
    - {command: [XADD, s, 18446744073709551614-1, f, v], expect: {equals: "18446744073709551614-1"}}
    - {command: [XLEN, s], expect: {equals: 21}}
    - {command: [XINFO, STREAM, s], expect: {exists: true}}
    - {command: [MEMORY, USAGE, s, SAMPLES, 0], expect_difference: true, expect: {
        min: 100, max: 100000000}}
    - {command: [XGROUP, CREATE, s, g1, 0], expect: {equals: OK}}
    - {command: [XGROUP, CREATE, s, g2, 0], expect: {equals: OK}}
    - {command: [XREADGROUP, GROUP, g1, alice, COUNT, 8, STREAMS, s, ">"], expect: {
        exists: true}}
    - {command: [XREADGROUP, GROUP, g1, bob, COUNT, 8, STREAMS, s, ">"], expect: {
        exists: true}}
    - {command: [XREADGROUP, GROUP, g2, carol, COUNT, 25, STREAMS, s, ">"], expect: {
        exists: true}}
    - {command: [MEMORY, USAGE, s, SAMPLES, 0], expect_difference: true, expect: {
        min: 100, max: 100000000}}
    - {command: [XACK, s, g1, 1-1, 1-2, 1-3, 2-0], expect: {equals: 4}}
    - {command: [XCLAIM, s, g1, bob, 0, 2-1, 3-0], expect: {exists: true}}
    - {command: [XAUTOCLAIM, s, g2, dan, 0, 0, COUNT, 25], expect: {exists: true}}
    - {command: [XACK, s, g2, 1-1, 1-2, 1-3], expect: {equals: 3}}
    - {command: [XPENDING, s, g1], expect: {exists: true}}
    - {command: [XDEL, s, 1-1, 1-2, 1-3, 2-0, 2-1, 3-0, 255-0, 256-0, 65535-0, 65536-0],
      expect: {equals: 10}}
    - {command: [MEMORY, USAGE, s, SAMPLES, 0], expect_difference: true, expect: {
        min: 100, max: 100000000}}
    - {command: [XGROUP, DELCONSUMER, s, g1, bob], expect: {equals: 10}}
    - {command: [XGROUP, DESTROY, s, g2], expect: {equals: 1}}
    - {command: [XTRIM, s, MAXLEN, 0], expect: {equals: 11}}
    - {command: [XLEN, s], expect: {equals: 0}}
    - {command: [MEMORY, USAGE, s, SAMPLES, 0], expect_difference: true, expect: {
        min: 100, max: 100000000}}
    - {command: [XADD, s2, 1-1, f, v], expect: {equals: "1-1"}}
    - {command: [XADD, s2, 1-18446744073709551615, f, v], expect: {equals: "1-18446744073709551615"}}
    - {command: [XADD, s2, 18446744073709551615-18446744073709551614, f, v], expect: {
        equals: "18446744073709551615-18446744073709551614"}}
    - {command: [XADD, s2, 18446744073709551615-18446744073709551615, f, v], expect: {
        equals: "18446744073709551615-18446744073709551615"}}
    - {command: [XADD, s2, "*", f, v], expect: {error: true}}
    - {command: [MEMORY, USAGE, s2, SAMPLES, 0], expect_difference: true, expect: {
        min: 100, max: 100000000}}
    - {command: [XDEL, s2, 1-1, 1-18446744073709551615, 18446744073709551615-18446744073709551614,
        18446744073709551615-18446744073709551615], expect: {equals: 4}}
    - {command: [MEMORY, USAGE, s2, SAMPLES, 0], expect_difference: true, expect: {
        min: 50, max: 100000000}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [rax.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: rax}
