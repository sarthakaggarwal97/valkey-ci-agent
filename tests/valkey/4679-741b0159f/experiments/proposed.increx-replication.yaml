extends: [valkey.liveness]
id: proposed.increx-replication
deployment:
  modes: [standalone]
metadata:
  description: INCREX PERSIST/SATURATE/ENX rewritten-SET propagation verified on a
    live replica, compared with the parent build
components:
- use: valkey.action.commands
  id: repl
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 60
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [SET, a, 10, EX, 500], expect: {equals: OK}}
    - {command: [INCREX, a, PERSIST], expect_difference: true, expect: {equals: [
          11, 1]}}
    - {command: [SET, b, 10], expect: {equals: OK}}
    - {command: [INCREX, b, BYINT, 5, UBOUND, 12, SATURATE], expect_difference: true,
      expect: {equals: [12, 2]}}
    - {command: [SET, c, 10, EX, 500], expect: {equals: OK}}
    - {command: [INCREX, c, EX, 100, ENX], expect_difference: true, expect: {equals: [
          11, 1]}}
    - {command: [SET, d, 10, EX, 500], expect: {equals: OK}}
    - {command: [INCREX, d, BYINT, 5], expect: {equals: [15, 5]}}
    - {command: [SET, e, 10], expect: {equals: OK}}
    - {command: [INCREX, e, BYINT, 5, UBOUND, 5], expect_difference: true, expect: {
        equals: [10, 0]}}
    - {command: [WAIT, 1, 10000], wait_s: 30, expect: {equals: 1}}
    - {command: [GET, a], node: 1, expect_difference: true, expect: {equals: "11"}}
    - {command: [TTL, a], node: 1, expect_difference: true, expect: {equals: -1}}
    - {command: [GET, b], node: 1, expect_difference: true, expect: {equals: "12"}}
    - {command: [TTL, b], node: 1, expect: {equals: -1}}
    - {command: [GET, c], node: 1, expect_difference: true, expect: {equals: "11"}}
    - {command: [TTL, c], node: 1, compare: skip, expect: {min: 300, max: 500}}
    - {command: [GET, d], node: 1, expect: {equals: "15"}}
    - {command: [TTL, d], node: 1, compare: skip, expect: {min: 300, max: 500}}
    - {command: [GET, e], node: 1, expect: {equals: "10"}}
    - {command: [TTL, e], node: 1, expect: {equals: -1}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
