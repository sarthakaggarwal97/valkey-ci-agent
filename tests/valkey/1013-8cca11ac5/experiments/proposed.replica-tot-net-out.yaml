extends: [valkey.liveness]
id: proposed.replica-tot-net-out
deployment:
  modes: [standalone]
metadata:
  description: A replica client's tot-net-out in CLIENT LIST counts each streamed
    byte once, not twice
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    dual_channel: {type: string, enum: ["yes", "no"], default: "no"}
components:
- use: valkey.action.commands
  id: totnetout
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 120
    server_config:
      repl-ping-replica-period: 3600
      repl-timeout: 3600
      repl-diskless-sync-delay: 0
      dual-channel-replication-enabled: {$ref: inputs.dual_channel}
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [EVAL, "redis.call('set', KEYS[1], string.rep('a', 1000000)) return\
          \ 1", 1, big], node: 0, expect: {equals: 1}}
    - {command: [WAIT, 1, 10000], node: 0, expect: {equals: 1}}
    - {command: [CLIENT, LIST, TYPE, replica], node: 0, expect_difference: true, expect: {
        contains: "tot-net-out=1"}}
    - {command: [EVAL, "redis.call('set', KEYS[1], string.rep('a', 1000000)) return\
          \ 1", 1, big2], node: 0, expect: {equals: 1}}
    - {command: [WAIT, 1, 10000], node: 0, expect: {equals: 1}}
    - {command: [CLIENT, LIST, TYPE, replica], node: 0, expect_difference: true, expect: {
        contains: "tot-net-out=2"}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [totnetout.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: totnetout}
