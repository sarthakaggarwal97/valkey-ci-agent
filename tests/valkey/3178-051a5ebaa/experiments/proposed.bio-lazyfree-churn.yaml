extends: [valkey.base]
id: proposed.bio-lazyfree-churn
deployment:
  modes: [standalone]
  replicas_per_primary: {minimum: 1}
metadata:
  description: Flood the BIO lazy-free and AOF queues with UNLINKed large collections
    and AOF toggles while a replica is killed and restarted; the peek-then-pop worker
    loop must process every job without panic, leak or lost write
inputs:
  properties:
    signal: {type: string, enum: [SIGKILL, SIGTERM, SIGSTOP], default: SIGKILL}
components:
- use: valkey.fault.process-signal
  id: kill-replica
  config:
    when_event: warm-up.completed
    instance: replica
    signal: {$ref: inputs.signal}
    restart_mode: immediate
- use: valkey.action.sleep
  id: warm-up
  depends_on: [writes, kill-replica]
  config: {seconds: 2}
- use: valkey.action.commands
  id: churn
  depends_on: [warm-up]
  config:
    instances: primaries
    timeout_s: 60
    commands:
    - {command: [CONFIG, SET, appendonly, "yes"], expect: {equals: OK}}
    - {command: [RPUSH, q1, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a,
        a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a,
        a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a,
        a, a, a, a, a, a, a, a, a, a, a, a], expect: {equals: 80}}
    - {command: [UNLINK, q1], expect: {equals: 1}}
    - {command: [RPUSH, q2, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a,
        a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a,
        a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a,
        a, a, a, a, a, a, a, a, a, a, a, a], expect: {equals: 80}}
    - {command: [UNLINK, q2], expect: {equals: 1}}
    - {command: [RPUSH, q3, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a,
        a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a,
        a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a,
        a, a, a, a, a, a, a, a, a, a, a, a], expect: {equals: 80}}
    - {command: [UNLINK, q3], expect: {equals: 1}}
    - {command: [BGREWRITEAOF], expect: {error: false}}
    - {command: [RPUSH, q4, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a,
        a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a,
        a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a,
        a, a, a, a, a, a, a, a, a, a, a, a], expect: {equals: 80}}
    - {command: [UNLINK, q4], expect: {equals: 1}}
    - {command: [RPUSH, q5, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a,
        a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a, a,
