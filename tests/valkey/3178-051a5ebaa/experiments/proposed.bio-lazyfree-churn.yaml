        x89, x90, x91, x92, x93, x94, x95, x96, x97, x98, x99, x100, x101, x102, x103,
        x104, x105, x106, x107, x108, x109, x110, x111, x112, x113, x114, x115, x116,
        x117, x118, x119, x120, x121, x122, x123, x124, x125, x126, x127, x128, x129,
        x130, x131, x132, x133, x134, x135, x136, x137, x138, x139, x140], expect: {
        equals: 140}}
    - {command: [UNLINK, s1], expect: {equals: 1}}
    - {command: [CONFIG, SET, appendonly, "no"], expect: {equals: OK}}
- use: valkey.action.sleep
  id: settle
  depends_on: [churn]
  config: {seconds: 3}
- use: valkey.oracle.ledger
  id: data
  config: {workload: writes, loss_window_s: 2.5}
required_events: [warm-up.completed, churn.completed]
required_evidence:
- {evidence_id: valkey.fault.injected, source: kill-replica}
- {evidence_id: valkey.command.sequence, source: churn}
