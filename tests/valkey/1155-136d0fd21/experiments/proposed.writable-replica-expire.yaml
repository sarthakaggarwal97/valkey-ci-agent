extends: [valkey.liveness]
id: proposed.writable-replica-expire
deployment:
  modes: [standalone]
metadata:
  description: A full sync loads the primary's RDB on the replica through dbAddRDBLoad,
    then a writable replica expires its own volatile key via expireReplicaKeys, driving
    the dbFindExpires and deleteExpiredKeyAndPropagate wrappers, compared with the
    parent build
components:
- use: valkey.action.commands
  id: replexp
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 90
    commands:
    - {command: [SET, base1, v], expect: {equals: OK}}
    - {command: [SET, base2, v], expect: {equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [CONFIG, SET, replica-read-only, no], node: 1, expect: {equals: OK}}
    - {command: [SET, wkey, wv, PX, 100], node: 1, expect: {equals: OK}}
    - {command: [DBSIZE], node: 1, wait_s: 30, expect: {equals: 2}}
    - {command: [EXISTS, wkey], node: 1, expect: {equals: 0}}
    - {command: [GET, base1], node: 1, expect: {equals: v}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [replexp.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: replexp}
