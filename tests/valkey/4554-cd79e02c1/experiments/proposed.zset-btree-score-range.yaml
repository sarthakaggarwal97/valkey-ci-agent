extends: [valkey.liveness]
id: proposed.zset-btree-score-range
deployment:
  modes: [standalone]
metadata:
  description: >-
    Btree zset range resolution compared against the parent build: exclusive and inclusive
    score bounds landing inside duplicate-score runs that span several 61-item leaves
    (ZCOUNT/ZREMRANGEBYSCORE over/under-count on the parent), and the deleteRangeCore
    false-empty short-circuit that made ZREMRANGEBYLEX delete nothing when both boundary
    leaves are locally untouched but middle leaves are fully in range.
