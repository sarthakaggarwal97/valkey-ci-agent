extends: [valkey.liveness]
id: proposed.copy-acl-db-bypass
deployment:
  modes: [standalone]
metadata:
  description: COPY DB-clause ACL bypass (REPLACE-before-DB and repeated DB) is rejected
    on the fixed build
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: copyseq
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    timeout_s: 10
    commands:
    - {command: [ACL, SETUSER, copyuser, on, nopass, "+@all", "~*", "db=0,1"], expect: {
        equals: OK}}
    - {command: [SET, src, val], expect: {equals: OK}}
    - {command: [AUTH, copyuser, pw], expect: {equals: OK}}
    - {command: [COPY, src, allowed, DB, "1"], expect: {equals: 1}}
    - {command: [COPY, src, bypass_replace, REPLACE, DB, "2"], expect_difference: true,
      expect: {error: "NOPERM"}}
    - {command: [COPY, src, bypass_repeat, DB, "1", DB, "2"], expect_difference: true,
      expect: {error: "NOPERM"}}
    - {command: [COPY, src, denied, DB, "2"], expect: {error: "NOPERM"}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_evidence:
- {evidence_id: valkey.command.sequence, source: copyseq}
