extends: [valkey.liveness]
id: proposed.syncslots-finish-already-finished
deployment:
  modes: [standalone]
metadata:
  description: >
    A swapdb full sync fails a replica's import tracking job locally; the target primary's
    replicated CLUSTER SYNCSLOTS FINISH FAILED for the same job must then be ignored
    (the job is already failed), so the replica keeps its local failure message instead
    of re-finishing the job. A second migration then succeeds and the replica must
    still take the primary's FINISH SUCCESS for a job it failed locally (a different
    outcome).
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    dual_channel: {type: string, enum: ["yes", "no"], default: "no"}
components:
- use: valkey.action.commands
  id: finish
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 3
    resp: {$ref: inputs.resp}
    timeout_s: 30
    server_config:
      repl-diskless-sync: "yes"
      repl-diskless-sync-delay: 0
      repl-diskless-load: swapdb
      dual-channel-replication-enabled: {$ref: inputs.dual_channel}
    commands:
    - {command: [SET, "{6ZJ}:k", v1], node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, REPLICATE, "<node.1.id>"], node: 2, expect: {equals: OK}}
    - {command: [INFO, replication], node: 2, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [DEBUG, SLOTMIGRATION, PREVENT-PAUSE, 1], node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 16383, 16383, NODE, "<node.1.id>"],
      node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], node: 1, wait_s: 30, expect: {contains: "waiting-for-paused"},
      compare: skip}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], node: 2, wait_s: 30, expect: {contains: "occurring-on-primary"},
      compare: skip}
    - {command: [DEBUG, CHANGE-REPL-ID], node: 1, expect: {equals: OK}}
    - {command: [CLIENT, KILL, TYPE, replica], node: 1, expect: {min: 1}, compare: skip}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], node: 2, wait_s: 60, expect: {contains: "Full\
          \ resynchronization occurred"}, compare: skip}
    - {command: [INFO, replication], node: 2, wait_s: 60, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [FLUSHALL, SYNC], node: 1, expect: {equals: OK}}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], node: 1, wait_s: 30, expect: {contains: "Data\
          \ was flushed"}, compare: skip}
    - {command: [WAIT, 1, 15000], node: 1, expect: {min: 1}, compare: skip}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], node: 2, expect_difference: true, expect: {
        contains: "Full resynchronization occurred"}}
    - {command: [GET, "{6ZJ}:k"], node: 0, expect: {equals: v1}}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], node: 0, wait_s: 30, expect: {contains: "failed"},
      compare: skip}
    - {command: [DEBUG, SLOTMIGRATION, PREVENT-PAUSE, 0], node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 16382, 16382, NODE, "<node.1.id>"],
      node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], node: 2, wait_s: 60, expect: {contains: "success"},
      compare: skip}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], node: 1, wait_s: 60, expect: {contains: "success"},
      compare: skip}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [finish.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: finish}
