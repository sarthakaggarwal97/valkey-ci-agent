extends: [valkey.liveness]
id: proposed.full-sync-dirty-replica
deployment:
  modes: [standalone]
metadata:
  description: Full sync onto a replica that already holds keys and a function library;
    the flush now runs inside rdbLoadRio after version validation and functionsLibCtx
    is reinitialized there
inputs:
  properties:
    diskless_sync: {type: string, enum: ["yes", "no"], default: "yes"}
    diskless_load: {type: string, enum: [disabled, on-empty-db, swapdb], default: on-empty-db}
    lazy_flush: {type: string, enum: ["yes", "no"], default: "no"}
components:
- use: valkey.action.commands
  id: fullsync
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    server_config:
      repl-diskless-sync: {$ref: inputs.diskless_sync}
      repl-diskless-sync-delay: "0"
      repl-diskless-load: {$ref: inputs.diskless_load}
      replica-lazy-flush: {$ref: inputs.lazy_flush}
    timeout_s: 60
    commands:
    - {command: [SET, primarykey, pv], expect: {equals: OK}}
    - {command: [FUNCTION, LOAD, "#!lua name=libnew\nserver.register_function{function_name='f_new',\
          \ callback=function(keys, args) return 1 end, flags={'no-writes'}}"], expect: {
        equals: libnew}}
    - {node: 1, command: [SET, replicaoldkey, old], expect: {equals: OK}}
    - {node: 1, command: [FUNCTION, LOAD, "#!lua name=libold\nserver.register_function{function_name='f_old',\
          \ callback=function(keys, args) return 0 end, flags={'no-writes'}}"], expect: {
        equals: libold}}
    - {node: 1, command: [REPLICAOF, <node.0.host>, <node.0.port>], expect: {equals: OK}}
    - {node: 1, command: [INFO, replication], wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {node: 1, command: [GET, primarykey], expect: {equals: pv}}
    - {node: 1, command: [EXISTS, replicaoldkey], expect: {equals: 0}}
    - {node: 1, command: [FCALL_RO, f_new, 0], expect: {equals: 1}}
    - {node: 1, command: [FCALL_RO, f_old, 0], expect: {error: true}}
    - {node: 1, command: [DBSIZE], expect: {equals: 1}}
    - {command: [SET, afterkey, av], expect: {equals: OK}}
    - {node: 1, command: [GET, afterkey], wait_s: 10, expect: {equals: av}}
    checks:
      acl: true
      compat: true
      variants: true
required_events: [fullsync.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: fullsync}
