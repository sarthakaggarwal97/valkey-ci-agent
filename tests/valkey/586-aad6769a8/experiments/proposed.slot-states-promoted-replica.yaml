extends: [valkey.liveness]
id: proposed.slot-states-promoted-replica
deployment:
  modes: [standalone]
metadata:
  description: A replica that inherited a migrating slot state through full sync is
    promoted with a graceful CLUSTER FAILOVER, keeps answering ASK redirects for the
    open slot, and the migration completes end to end
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    diskless_sync: {type: string, enum: ["yes", "no"], default: "no"}
    diskless_load: {type: string, enum: [disabled, on-empty-db, swapdb], default: disabled}
components:
- use: valkey.action.commands
  id: promote
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 3
    resp: {$ref: inputs.resp}
    timeout_s: 240
    server_config:
      repl-diskless-sync: {$ref: inputs.diskless_sync}
      repl-diskless-sync-delay: 0
      repl-diskless-load: {$ref: inputs.diskless_load}
    commands:
    - {command: [SET, "{aga}stay", v1], node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, SETSLOT, 609, MIGRATING, "<node.1.id>"], node: 0, wait_s: 60,
      expect: {equals: OK}}
    - {command: [CLUSTER, SETSLOT, 609, IMPORTING, "<node.0.id>"], node: 1, wait_s: 60,
      expect: {equals: OK}}
    - {command: [CLUSTER, REPLICATE, "<node.0.id>"], node: 2, wait_s: 60, expect: {
        equals: OK}}
    - {command: [CLUSTER, NODES], node: 2, wait_s: 60, compare: skip, expect: {contains: "609->-"}}
    - {command: [CLUSTER, FAILOVER], node: 2, wait_s: 60, expect: {equals: OK}}
    - {command: [INFO, replication], node: 2, wait_s: 60, compare: skip, expect: {
        contains: "role:master"}}
    - {command: [CLUSTER, NODES], node: 2, wait_s: 60, compare: skip, expect: {contains: "609->-"}}
    - {command: [GET, "{aga}missing"], node: 2, wait_s: 30, compare: skip, expect: {
        error: "ASK 609"}}
    - {command: [MIGRATE, "<node.1.host>", "<node.1.port>", "{aga}stay", 0, 5000],
      node: 2, wait_s: 30, expect: {equals: OK}}
    - {command: [CLUSTER, SETSLOT, 609, NODE, "<node.1.id>"], node: 1, wait_s: 60,
      expect: {equals: OK}}
    - {command: [CLUSTER, SETSLOT, 609, NODE, "<node.1.id>"], node: 2, wait_s: 60,
      expect: {equals: OK}}
    - {command: [GET, "{aga}stay"], node: 2, wait_s: 60, compare: skip, expect: {
        error: "MOVED 609"}}
    - {command: [GET, "{aga}stay"], node: 1, wait_s: 60, expect: {equals: v1}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [promote.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: promote}
