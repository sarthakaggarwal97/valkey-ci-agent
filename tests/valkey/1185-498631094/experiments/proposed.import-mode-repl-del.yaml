extends: [valkey.liveness]
id: proposed.import-mode-repl-del
deployment:
  modes: [standalone]
metadata:
  description: An import-mode primary propagates no DEL for expired keys, so its replica
    keeps them; after import mode ends, lazy expiration propagates the DEL and the
    replica converges
components:
- use: valkey.action.commands
  id: repl
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 60
    commands:
    - {command: [CONFIG, SET, import-mode, yes], expect_difference: true, expect: {
        equals: OK}}
    - {command: [CLIENT, IMPORT-SOURCE, ON], expect_difference: true, expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [SET, k, v, PX, 1], expect: {equals: OK}}
    - {command: [DEBUG, SLEEP, "0.3"], expect: {equals: OK}}
    - {command: [GET, k], connection: plain}
    - {command: [WAIT, "1", "2000"], expect: {equals: 1}}
    - {command: [DBSIZE], expect_difference: true, expect: {equals: 1}}
    - {command: [DBSIZE], node: 1, expect_difference: true, expect: {equals: 1}}
    - {command: [GET, k], expect_difference: true, expect: {equals: v}}
    - {command: [CONFIG, SET, import-mode, no], expect_difference: true, expect: {
        equals: OK}}
    - {command: [GET, k], connection: plain}
    - {command: [WAIT, "1", "2000"], expect: {equals: 1}}
    - {command: [DBSIZE], expect: {equals: 0}}
    - {command: [DBSIZE], node: 1, expect: {equals: 0}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
