extends: [valkey.liveness]
id: proposed.c11-lazyfree-scripts-flush
deployment:
  modes: [standalone]
metadata:
  description: SCRIPT FLUSH ASYNC over 65 cached scripts frees the Lua scripts dict
    in a bio thread, driving the C11 lazyfree_objects/lazyfreed_objects atomics
components:
- use: valkey.action.commands
  id: scripts
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server_config: {lazyfree-lazy-user-flush: 'yes'}
    timeout_s: 20
    commands:
    - {command: [SCRIPT, LOAD, 'return 1']}
    - {command: [SCRIPT, LOAD, 'return 2']}
    - {command: [SCRIPT, LOAD, 'return 3']}
