extends: [valkey.liveness]
id: proposed.c11-errorstats-async-free
deployment:
  modes: [standalone]
metadata:
  description: CONFIG RESETSTAT on a >64-node errorstats rax takes the async branch
    of freeErrorsRadixTreeAsync, so the bio lazyfree thread runs lazyFreeErrors and
    updates the C11 lazyfree_objects/lazyfreed_objects atomics while the main thread
    keeps serving
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: errstats
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
    - {command: [EVAL, "return redis.error_reply('E10 x')", 0], expect: {error: E10}}
    - {command: [EVAL, "return redis.error_reply('E11 x')", 0], expect: {error: E11}}
    - {command: [EVAL, "return redis.error_reply('E12 x')", 0], expect: {error: E12}}
