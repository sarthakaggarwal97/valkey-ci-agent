extends: [valkey.liveness]
id: proposed.dict-resize-thresholds
deployment:
  modes: [standalone]
metadata:
  description: Dict resize threshold change (#12948) shown against the parent build
    with DEBUG HTSTATS - inline shrink at 1:8 vs 1:10, forced expand under a BGSAVE
    child at 4x vs over 5x, forced shrink under a child at 1:32 vs 1:50 at the new
    rehash-allowed boundary, and the serverCron htNeedsShrink path on cluster slot
    dicts
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: shrink-enable
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server_config: {enable-debug-command: "yes", save: ""}
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - command: [MSET, "a:0", v, "a:1", v, "a:2", v, "a:3", v, "a:4", v, "a:5", v,
        "a:6", v, "a:7", v, "a:8", v, "a:9", v, "a:10", v, "a:11", v, "a:12", v, "a:13",
        v, "a:14", v, "a:15", v, "a:16", v, "a:17", v, "a:18", v, "a:19", v, "a:20",
        v, "a:21", v, "a:22", v, "a:23", v, "a:24", v, "a:25", v, "a:26", v, "a:27",
        v, "a:28", v, "a:29", v, "a:30", v, "a:31", v]
      expect: {equals: OK}
    - command: [EXISTS, "a:0", "a:1", "a:2", "a:3", "a:4", "a:5", "a:6", "a:7", "a:8",
        "a:9", "a:10", "a:11", "a:12", "a:13", "a:14", "a:15", "a:16", "a:17", "a:18",
        "a:19"]
      expect: {equals: 20}
    - command: [DEL, "a:4", "a:5", "a:6", "a:7", "a:8", "a:9", "a:10", "a:11", "a:12",
        "a:13", "a:14", "a:15", "a:16", "a:17", "a:18", "a:19", "a:20", "a:21", "a:22",
        "a:23", "a:24", "a:25", "a:26", "a:27", "a:28", "a:29", "a:30", "a:31"]
      expect: {equals: 28}
    - command: [EXISTS, "a:0", "a:1", "a:2", "a:3", "a:0", "a:1", "a:2", "a:3", "a:0",
        "a:1", "a:2", "a:3"]
      expect: {equals: 12}
    - command: [DEBUG, HTSTATS, "0"]
      expect_difference: true
      expect: {contains: "table size: 4"}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
- use: valkey.action.commands
  id: expand-avoid
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server_config: {enable-debug-command: "yes", save: ""}
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - {command: [SET, "b:0", v], expect: {equals: OK}}
    - {command: [CONFIG, SET, rdb-key-save-delay, "30000000"], expect: {equals: OK}}
    - {command: [BGSAVE], expect: {contains: "Background saving started"}}
    - command: [MSET, "b:1", v, "b:2", v, "b:3", v, "b:4", v, "b:5", v, "b:6", v,
        "b:7", v, "b:8", v, "b:9", v, "b:10", v, "b:11", v, "b:12", v, "b:13", v,
        "b:14", v, "b:15", v, "b:16", v, "b:17", v]
