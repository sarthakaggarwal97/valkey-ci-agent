    - command: [EXISTS, "b:1", "b:2", "b:3", "b:4", "b:5", "b:6", "b:7", "b:8"]
      expect: {equals: 8}
    - command: [DEBUG, HTSTATS, "0"]
      expect_difference: true
      expect: {contains: "table size: 32"}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
