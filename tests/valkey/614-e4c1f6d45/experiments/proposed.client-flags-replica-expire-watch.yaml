extends: [valkey.liveness]
id: proposed.client-flags-replica-expire-watch
deployment:
  modes: [standalone]
metadata:
  description: dirty_cas from an expired watched key and FLUSHDB, and the primary
    flag in replica-side expireIfNeeded and writable-replica expires
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: wexp
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 15
    commands:
    - {command: [DEBUG, SET-ACTIVE-EXPIRE, 0], expect: {equals: OK}}
    - {command: [DEBUG, SET-ACTIVE-EXPIRE, 0], node: 1, expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [SET, wk, v1, PX, 80], expect: {equals: OK}}
    - {command: [WATCH, wk], expect: {equals: OK}}
    - {command: [DEBUG, SLEEP, 0.3], connection: tick, expect: {equals: OK}}
    - {command: [MULTI], expect: {equals: OK}}
    - {command: [SET, other, 1], expect: {equals: QUEUED}}
    - {command: [EXEC], expect: {equals: null}}
    - {command: [GET, other], expect: {equals: null}}
    - {command: [SET, wk, v2], expect: {equals: OK}}
    - {command: [GET, wk], node: 1, wait_s: 10, expect: {equals: v2}}
    - {command: [CONFIG, SET, replica-read-only, no], node: 1, expect: {equals: OK}}
    - {command: [SET, rk, rv, EX, 100], node: 1, expect: {equals: OK}}
    - {command: [GET, rk], node: 1, expect: {equals: rv}}
    - {command: [SET, fk, 1], expect: {equals: OK}}
    - {command: [WATCH, fk], expect: {equals: OK}}
    - {command: [FLUSHDB], expect: {equals: OK}}
    - {command: [MULTI], expect: {equals: OK}}
    - {command: [PING], expect: {equals: QUEUED}}
    - {command: [EXEC], expect: {equals: null}}
    - {command: [PING], node: 1, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      variants: true
required_events: [wexp.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: wexp}
