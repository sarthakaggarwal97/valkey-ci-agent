extends: [valkey.liveness]
id: proposed.client-flags-setslot-replica-ack
deployment:
  modes: [standalone, cluster]
metadata:
  description: CLUSTER SETSLOT on a primary with a replica (blockClientForReplicaAck
    sets pending_command) and a READONLY client blocked on a stream key on the replica
    (clusterRedirectBlockedClientIfNeeded readonly path)
components:
- use: valkey.action.commands
  id: setslot
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 3
    timeout_s: 20
    commands:
    - {command: [CLUSTER, REPLICATE, "<node.0.id>"], node: 2, expect: {equals: OK}}
    - {command: [INFO, replication], node: 2, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [READONLY], node: 2, connection: ro, expect: {equals: OK}}
    - {raw: "XREAD BLOCK 0 STREAMS s $\r\n", node: 2, connection: ro}
    - {command: [DEBUG, SLEEP, 0.3], node: 2}
    - {command: [CLUSTER, SETSLOT, 100, MIGRATING, "<node.1.id>"], node: 0, expect: {
        equals: OK}}
    - {command: [CLUSTER, SETSLOT, 100, STABLE], node: 0, expect: {equals: OK}}
    - {command: [XADD, s, "*", f, v], node: 0, compare: skip}
    - {command: [WAIT, 1, 5000], node: 0, expect: {min: 1}}
    - {command: [DEBUG, SLEEP, 0.3], node: 2}
    - {read: true, node: 2, connection: ro, compare: skip}
    - {command: [PING], node: 2, expect: {equals: PONG}}
    - {command: [PING], node: 0, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      variants: true
required_events: [setslot.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: setslot}
