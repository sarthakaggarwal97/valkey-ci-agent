extends: [valkey.liveness]
id: proposed.tracking-prefix-overhead-eviction
deployment:
  modes: [standalone]
metadata:
  description: >-
    getClientMemoryUsage now counts tracking-prefix rax overhead as numnodes * (sizeof(raxNode)
    + sizeof(raxNode*)) = 12 bytes/node instead of the old multiplied form 32 bytes/node.
    A client registering 1000 distinct BCAST prefixes builds ~2100 rax nodes: the
    parent estimates ~85KB for that client, the fix ~43KB. With maxmemory-clients
    at 80kb the parent evicts the tracking client and the fixed build keeps it, so
    the tracking connection stays alive only on the change.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: trk
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
    - {command: [PING], connection: sub, expect: {equals: PONG}}
