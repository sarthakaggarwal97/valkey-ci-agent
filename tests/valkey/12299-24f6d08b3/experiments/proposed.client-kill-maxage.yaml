extends: [valkey.liveness]
id: proposed.client-kill-maxage
deployment:
  modes: [standalone]
metadata:
  description: CLIENT KILL MAXAGE kills only connections at least maxage seconds old;
    the parent rejects the option
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: maxage
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    nodes: 2
    timeout_s: 60
    commands:
    - {command: [CLIENT, KILL, MAXAGE, str], expect_difference: true, expect: {error: "not\
          \ an integer"}}
    - {command: [CLIENT, KILL, MAXAGE, "9999999999999999999"], expect_difference: true,
      expect: {error: "not an integer"}}
    - {command: [CLIENT, KILL, MAXAGE, "-1"], expect_difference: true, expect: {error: "greater\
          \ than 0"}}
    - {command: [CLIENT, KILL, MAXAGE, "0"], expect_difference: true, expect: {error: "greater\
          \ than 0"}}
    - {command: [CLIENT, KILL, MAXAGE], expect: {error: "syntax error"}}
    - {command: [ACL, SETUSER, dummy, on, nopass, "+ping"], expect: {equals: OK}}
    - {command: [AUTH, dummy, ""], connection: old, expect: {equals: OK}}
    - {command: [DEBUG, SLEEP, "2"], expect: {equals: OK}}
    - {command: [AUTH, dummy, ""], connection: young, expect: {equals: OK}}
    - {command: [CLIENT, KILL, USER, dummy, MAXAGE, "9223372036854775807"], expect_difference: true,
      expect: {equals: 0}}
    - {command: [CLIENT, KILL, USER, dummy, MAXAGE, "1", MAXAGE, "9223372036854775807"],
      expect_difference: true, expect: {equals: 0}}
    - {command: [CLIENT, KILL, USER, dummy, MAXAGE, "1"], expect_difference: true,
      expect: {equals: 1}}
    - {command: [PING], connection: young, expect: {equals: PONG}}
    - {command: [PING], connection: old, expect_difference: true, expect: {exists: false}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [DEBUG, SLEEP, "2"], expect: {equals: OK}}
    - {command: [CLIENT, KILL, TYPE, replica, MAXAGE, "9223372036854775807"], expect_difference: true,
      expect: {equals: 0}}
    - {command: [CLIENT, KILL, TYPE, replica, MAXAGE, "1"], expect_difference: true,
      expect: {equals: 1}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [maxage.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: maxage}
