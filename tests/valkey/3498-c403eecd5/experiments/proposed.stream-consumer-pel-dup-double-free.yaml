extends: [valkey.liveness]
id: proposed.stream-consumer-pel-dup-double-free
deployment:
  modes: [standalone]
metadata:
  description: RESTORE of a stream whose consumer PEL has a duplicate entry must not
    double-free
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: restore
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server_config: {sanitize-dump-payload: no}
    resp: {$ref: inputs.resp}
    timeout_s: 10
    commands:
    - {command: [DEBUG, SET-SKIP-CHECKSUM-VALIDATION, "1"], expect: {equals: OK}}
    - command: [RESTORE, _stream, "0", !!binary "DwEQAAAAAAAAAAEAAAAAAAAAATY2AAAADwACAQABAQGFZmllbGQGAAECAQABAAGGdmFsdWUxBwQBAgEBAQABhnZhbHVlMgcEAf8CAgEBB215Z3JvdXACAQIAAAAAAAAAAQAAAAAAAAABmzZjip0BAAABAAAAAAAAAgAAAAAAAAABAZs2Y4qdAQAAAQEFQWxpY2WbNmOKnQEAAAIAAAAAAAAAAQAAAAAAAAABAAAAAAAAAQAAAAAAAAABAQkAAAAAAAAAAAA="]
      expect_difference: true
      expect: {error: "Bad data format"}
    - {command: [PING], expect_difference: true, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [restore.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: restore}
