extends: [valkey.liveness]
id: proposed.volatile-eviction-slot-lookup
deployment:
  modes: [standalone]
metadata:
  description: >
    Under volatile-lru/volatile-lfu maxmemory pressure, keys sampled from db->expires[slot]
    are looked up in db->dict[slot] (known slot instead of calculateKeySlot). Drive
    evictions on a cluster-mode server with TTL keys spread across many slots and
    compare against the parent build; a wrong slot would make dictFind return NULL
    and dictGetVal crash.
inputs:
  properties:
    policy: {type: string, enum: [volatile-lru, volatile-lfu], default: volatile-lru}
    cluster: {type: boolean, default: true}
    lazyfree: {type: string, enum: ["no", "yes"], default: "no"}
components:
- use: valkey.action.commands
  id: evict
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: {$ref: inputs.cluster}
    resp: 2
    timeout_s: 180
    server_config:
      maxmemory-policy: {$ref: inputs.policy}
      lazyfree-lazy-eviction: {$ref: inputs.lazyfree}
      maxmemory-samples: 10
    commands:
    - {command: [SETRANGE, s1, 99999, x], expect: {equals: 100000}}
    - {command: [SETRANGE, s2, 99999, x], expect: {equals: 100000}}
    - {command: [SETRANGE, s3, 99999, x], expect: {equals: 100000}}
    - {command: [SETRANGE, v01, 399999, x], expect: {equals: 400000}}
    - {command: [EXPIRE, v01, 10000], expect: {equals: 1}}
    - {command: [SETRANGE, v02, 399999, x], expect: {equals: 400000}}
    - {command: [EXPIRE, v02, 10000], expect: {equals: 1}}
    - {command: [SETRANGE, v03, 399999, x], expect: {equals: 400000}}
