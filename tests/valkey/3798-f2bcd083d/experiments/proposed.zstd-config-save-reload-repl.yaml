extends: [valkey.liveness]
id: proposed.zstd-config-save-reload-repl
deployment:
  modes: [standalone]
metadata:
  description: >
    CONFIG SET rdbcompression/repl-compression zstd is accepted only by the zstd build;
    a zstd-compressed RDB survives SAVE and a restart; a replica negotiates a zstd
    link, full-syncs an 8MB dataset, and follows a 4MB post-sync stream that crosses
    several bounded-frame boundaries.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: zstd
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    nodes: 2
    timeout_s: 120
    server_config:
      enable-debug-command: "yes"
      repl-diskless-sync: "yes"
      repl-diskless-sync-delay: "0"
    commands:
    - {command: [CONFIG, SET, rdbcompression, zstd], node: 0, expect_difference: true,
      expect: {equals: OK}}
    - {command: [CONFIG, GET, rdbcompression], node: 0, expect_difference: true, expect: {
        equals: [rdbcompression, zstd]}}
    - {command: [SETRANGE, big1, 2097152, x], node: 0, expect: {equals: 2097153}}
    - {command: [SETRANGE, big2, 1048576, y], node: 0, expect: {equals: 1048577}}
    - {command: [SET, small, hello], node: 0, expect: {equals: OK}}
    - {command: [SAVE], node: 0, expect: {equals: OK}}
    - {restart: true, node: 0, expect: {equals: OK}}
    - {command: [STRLEN, big1], node: 0, expect: {equals: 2097153}}
    - {command: [STRLEN, big2], node: 0, expect: {equals: 1048577}}
    - {command: [GET, small], node: 0, expect: {equals: hello}}
    - {command: [DBSIZE], node: 0, expect: {equals: 3}}
    - {command: [DEBUG, POPULATE, 2000, "popkey:", 4096], node: 0, expect: {equals: OK}}
    - {command: [CONFIG, SET, repl-compression, zstd], node: 0, expect_difference: true,
      expect: {equals: OK}}
    - {command: [CONFIG, SET, repl-compression, zstd], node: 1, expect_difference: true,
      expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, compare: skip, wait_s: 60, expect: {
        contains: "master_link_status:up"}}
    - command:
      - EVAL
      - "for i=1,1000 do redis.call('SET', 'bulk:' .. i, string.rep('x', 4096)) end\
        \ return 1"
      - "0"
      node: 0
      expect: {equals: 1}
    - {command: [WAIT, 1, 30000], node: 0, expect: {equals: 1}}
    - {command: [STRLEN, "bulk:1000"], node: 1, expect: {equals: 4096}}
    - {command: [STRLEN, big1], node: 1, expect: {equals: 2097153}}
    - {command: [GET, small], node: 1, expect: {equals: hello}}
    - {command: [DBSIZE], node: 1, expect: {equals: 3003}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [zstd.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: zstd}
