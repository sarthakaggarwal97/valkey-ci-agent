extends: [valkey.liveness]
id: proposed.testrdb-module-save-load-compare
deployment:
  modes: [standalone]
metadata:
  description: testrdb module-type keys cycled through SAVE+restart and a full sync,
    change's and parent's module build compared on one Valkey build; the GetContextFromIO
    the change adds to testrdb_type_load must not crash or leak a module context
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: reload
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    nodes: 2
    server_config: {appendonly: "no"}
    timeout_s: 30
    commands:
    - {command: [testrdb.set.key, k1, hello], expect: {equals: 1}}
    - {command: [testrdb.set.key, k2, ""], expect: {equals: 1}}
    - {command: [testrdb.set.key, k3, !!binary "AAECAwQFBgcICQ=="], expect: {equals: 1}}
    - {command: [testrdb.set.key, k4, xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx],
      expect: {equals: 1}}
    - {command: [TYPE, k1], expect: {equals: test__rdb}}
    - {command: [SAVE], expect: {equals: OK}}
    - {restart: true, expect: {equals: OK}}
    - {command: [testrdb.get.key, k1], expect: {equals: hello}}
    - {command: [testrdb.get.key, k2], expect: {equals: ""}}
    - {command: [testrdb.get.key, k3], expect: {equals: !!binary "AAECAwQFBgcICQ=="}}
    - {command: [testrdb.set.key, k1, hello-v2], expect: {equals: 1}}
    - {command: [DEL, k2], expect: {equals: 1}}
    - {command: [SAVE], expect: {equals: OK}}
    - {restart: true, expect: {equals: OK}}
    - {command: [testrdb.get.key, k1], expect: {equals: hello-v2}}
    - {command: [EXISTS, k2], expect: {equals: 0}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [testrdb.get.key, k1], node: 1, expect: {equals: hello-v2}}
    - {command: [testrdb.get.key, k4], node: 1, expect: {equals: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx}}
    checks:
      acl: true
      variants: true
required_events: [reload.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: reload}
