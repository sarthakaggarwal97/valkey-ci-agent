extends: [valkey.liveness]
id: proposed.hsetex-keepttl-expired-replica
deployment:
  modes: [standalone]
metadata:
  description: HSETEX KEEPTTL over lazily-expired fields propagates explicit HDELs
    so a real replica drops the stale TTLs; primary and replica state compared across
    builds
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: repl
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 15
    commands:
    - {command: [DEBUG, SET-ACTIVE-EXPIRE, 0], expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [HSETEX, h, PX, 10, FIELDS, 2, f1, v1, f2, v2], expect: {equals: 1}}
    - {command: [DEBUG, SLEEP, 0.3], expect: {equals: OK}}
    - {command: [HSETEX, h, KEEPTTL, FIELDS, 2, f1, n1, f2, n2], expect: {equals: 1}}
    - {command: [WAIT, 1, 5000], expect: {equals: 1}}
    - {command: [HGETALL, h], compare: unordered-pairs, expect: {exists: true}}
    - {command: [HTTL, h, FIELDS, 2, f1, f2], expect: {equals: [-1, -1]}}
    - {command: [HGETALL, h], node: 1, compare: unordered-pairs, expect: {exists: true}}
    - {command: [HTTL, h, FIELDS, 2, f1, f2], node: 1, expect: {equals: [-1, -1]}}
    - {command: [HSET, h2, a, "1"], expect: {equals: 1}}
    - {command: [HSETEX, h2, EXAT, 1, FIELDS, 2, a, x, b, y], expect_difference: true,
      expect: {equals: 1}}
    - {command: [WAIT, 1, 5000], expect: {equals: 1}}
    - {command: [EXISTS, h2], node: 1, expect: {equals: 0}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
