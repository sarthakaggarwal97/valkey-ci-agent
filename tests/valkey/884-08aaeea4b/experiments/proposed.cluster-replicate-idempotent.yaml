extends: [valkey.liveness]
id: proposed.cluster-replicate-idempotent
deployment:
  modes: [standalone]
metadata:
  description: CLUSTER REPLICATE naming the node's current primary is a no-op on the
    fix; the parent drops the replication link and forces a needless full resync.
    Also repeats the command while the handshake is still in progress.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    diskless: {type: string, enum: ["yes", "no"], default: "no"}
components:
- use: valkey.action.commands
  id: replicate
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 3
    resp: {$ref: inputs.resp}
    server_config:
      repl-diskless-sync: {$ref: inputs.diskless}
    timeout_s: 15
    commands:
    - {command: [SET, k1, v1], node: 0, expect: {equals: OK}}
    - {command: [RPUSH, biglist, a, b, c, d, e, f, g, h], node: 0, expect: {equals: 8}}
    - {command: [CLUSTER, REPLICATE, <node.0.id>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [INFO, stats], node: 0, wait_s: 30, expect: {contains: "sync_full:1\r"},
      compare: skip}
    - {command: [CLUSTER, REPLICATE, <node.0.id>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, expect_difference: true, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [INFO, stats], node: 0, expect_difference: true, expect: {contains: "sync_full:1\r"},
      compare: skip}
    - {command: [READONLY], node: 1, expect: {equals: OK}}
    - {command: [GET, k1], node: 1, expect: {equals: v1}}
    - {command: [CLUSTER, REPLICATE, <node.0.id>], node: 2, expect: {equals: OK}}
    - {command: [CLUSTER, REPLICATE, <node.0.id>], node: 2, expect: {equals: OK}}
    - {command: [CLUSTER, REPLICATE, <node.0.id>], node: 2, expect: {equals: OK}}
    - {command: [INFO, replication], node: 2, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [CLUSTER, REPLICATE, <node.2.id>], node: 1, expect: {error: "only\
          \ replicate a master"}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [replicate.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: replicate}
