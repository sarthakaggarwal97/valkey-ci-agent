extends: [valkey.liveness]
id: proposed.dual-channel-debug-and-handshake
deployment:
  modes: [standalone]
metadata:
  description: DEBUG PAUSE-AFTER-FORK replaces SLEEP-AFTER-FORK-SECONDS, and a dual-channel
    full sync still completes end to end on both builds
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: seq
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 60
    server_config:
      dual-channel-replication-enabled: "yes"
      repl-diskless-sync: "yes"
      repl-diskless-sync-delay: 0
    commands:
    - {command: [DEBUG, PAUSE-AFTER-FORK, 1], node: 0, expect_difference: true, expect: {
        equals: OK}}
    - {command: [DEBUG, PAUSE-AFTER-FORK, 0], node: 0, expect_difference: true, expect: {
        equals: OK}}
    - {command: [DEBUG, SLEEP-AFTER-FORK-SECONDS, 0], node: 0, expect_difference: true,
      expect: {error: true}}
    - {command: [SET, k1, v1], node: 0, expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [GET, k1], node: 1, wait_s: 10, expect: {equals: v1}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [seq.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: seq}
