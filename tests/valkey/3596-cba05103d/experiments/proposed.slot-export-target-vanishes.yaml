extends: [valkey.liveness]
id: proposed.slot-export-target-vanishes
deployment:
  modes: [standalone, cluster]
metadata:
  description: CLUSTER MIGRATESLOTS whose target node leaves the source's view must
    not crash the source (connectSlotExportJob NULL-target guard)
inputs:
  required: [parent]
  properties:
    parent:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "The parent commit's build, {$ref: artifacts.parent.binary}"
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: migrate
  config:
    compare_with: {$ref: inputs.parent}
    cluster: true
    nodes: 3
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 0, 0, NODE, "<node.2.id>"], node: 0,
      expect: {equals: OK}}
    - {command: [CLUSTER, FORGET, "<node.2.id>"], node: 1, expect: {equals: OK}}
    - {command: [CLUSTER, FORGET, "<node.2.id>"], node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], node: 0, compare: skip}
    - {command: [PING], node: 0, expect: {equals: PONG}}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], node: 0, compare: skip}
    - {command: [PING], node: 0, expect: {equals: PONG}}
    - {command: [PING], node: 1, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [migrate.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: migrate}
