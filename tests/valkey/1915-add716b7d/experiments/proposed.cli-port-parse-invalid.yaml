extends: [valkey.liveness]
id: proposed.cli-port-parse-invalid
deployment:
  modes: [standalone]
metadata:
  description: valkey-cli -p rejects strings that atoi parses to 0 (non-numeric, empty,
    "00", "0x50") with "Invalid server port.", still accepts the literal "0" and valid
    ports, and keeps the old range checks
components:
- use: valkey.action.tools
  id: cli-port
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server: true
    timeout_s: 20
    runs:
    - {tool: valkey-cli, args: [-p, notaport, PING], expect_difference: true, expect: {
        exit: {equals: 1}, stderr: {contains: "Invalid server port"}}}
    - {tool: valkey-cli, args: [-p, "", PING], expect_difference: true, expect: {
        exit: {equals: 1}, stderr: {contains: "Invalid server port"}}}
    - {tool: valkey-cli, args: [-p, "00", PING], expect_difference: true, expect: {
        exit: {equals: 1}, stderr: {contains: "Invalid server port"}}}
    - {tool: valkey-cli, args: [-p, "0x50", PING], expect_difference: true, expect: {
        exit: {equals: 1}, stderr: {contains: "Invalid server port"}}}
    - {tool: valkey-cli, args: [-p, "0", PING], expect: {exit: {equals: 1}, stderr: {
          contains: "Could not connect"}}}
    - {tool: valkey-cli, args: [-p, "65536", PING], expect: {exit: {equals: 1}, stderr: {
          contains: "Invalid server port"}}}
    - {tool: valkey-cli, args: [-p, "-1", PING], expect: {exit: {equals: 1}, stderr: {
          contains: "Invalid server port"}}}
    - {tool: valkey-cli, args: [-p, $port, PING], expect: {exit: {equals: 0}, stdout: {
          equals: "PONG\n"}}}
required_evidence:
- {evidence_id: valkey.tool.runs, source: cli-port}
