extends: [valkey.liveness]
id: proposed.replica-requirepass-resync
deployment:
  modes: [standalone]
metadata:
  description: Replication with requirepass on both nodes; the primary link is killed
    and resurrected, so the primary client on the replica must carry CLIENT_AUTHENTICATED
    through replicationCreateMasterClient and replicationResurrectCachedMaster
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: repl
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - {command: [PING], node: 1, expect: {equals: PONG}}
    - {command: [SET, k1, v1], expect: {equals: OK}}
    - {command: [CONFIG, SET, requirepass, reqsecret], expect: {equals: OK}}
    - {command: [CONFIG, SET, primaryauth, reqsecret], node: 1, expect: {equals: OK}}
    - {command: [CONFIG, SET, requirepass, reqsecret], node: 1, expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, compare: skip, wait_s: 30, expect: {
        contains: "master_link_status:up"}}
    - {command: [GET, k1], node: 1, wait_s: 10, expect: {equals: v1}}
    - {command: [SET, k2, v2], expect: {equals: OK}}
    - {command: [GET, k2], node: 1, wait_s: 10, expect: {equals: v2}}
    - {command: [CLIENT, KILL, TYPE, master], node: 1, compare: skip, expect: {min: 0}}
    - {command: [INFO, replication], node: 1, compare: skip, wait_s: 30, expect: {
        contains: "master_link_status:up"}}
    - {command: [SET, k3, v3], expect: {equals: OK}}
    - {command: [GET, k3], node: 1, wait_s: 10, expect: {equals: v3}}
    - {command: [ACL, WHOAMI], node: 1, expect: {equals: default}}
    checks:
      acl: true
      compat: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
