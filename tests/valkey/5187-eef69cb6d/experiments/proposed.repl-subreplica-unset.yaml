extends: [valkey.liveness]
id: proposed.repl-subreplica-unset
deployment:
  modes: [standalone]
metadata:
  description: A replica running REPLICAOF NO ONE sent by one of its own sub-replicas
    survives instead of crashing in disconnectReplicas
components:
- use: valkey.action.commands
  id: subreplica
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server_config: {save: ""}
    nodes: 2
    timeout_s: 40
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 20, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {raw: "SYNC\r\n", node: 1, connection: fake}
    - {raw: "REPLICAOF NO ONE\r\n", node: 1, connection: fake}
    - {command: [INFO, replication], node: 1, wait_s: 20, compare: skip, expect: {
        contains: "role:master"}}
    - {command: [PING], node: 1, wait_s: 20, expect_difference: true, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [subreplica.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: subreplica}
