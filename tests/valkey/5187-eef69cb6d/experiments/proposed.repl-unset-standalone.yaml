extends: [valkey.liveness]
id: proposed.repl-unset-standalone
deployment:
  modes: [standalone]
metadata:
  description: A replica running REPLICAOF NO ONE fed through its own primary link
    survives instead of crashing
components:
- use: valkey.action.commands
  id: unset
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server_config: {save: ""}
    nodes: 2
    timeout_s: 40
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 20, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [DEBUG, REPLICATE, REPLICAOF, NO, ONE], node: 0, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 20, compare: skip, expect: {
        contains: "role:master"}}
    - {command: [PING], node: 1, wait_s: 20, expect_difference: true, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [unset.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: unset}
