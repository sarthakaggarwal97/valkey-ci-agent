extends: [valkey.liveness]
id: proposed.repl-set-standalone
deployment:
  modes: [standalone]
metadata:
  description: A replica switching primary via REPLICAOF fed through its own primary
    link survives instead of crashing
components:
- use: valkey.action.commands
  id: setprimary
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server_config: {save: ""}
    nodes: 3
    timeout_s: 40
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 20, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [DEBUG, REPLICATE, REPLICAOF, "<node.2.host>", "<node.2.port>"], node: 0,
      expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 20, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [PING], node: 1, wait_s: 20, expect_difference: true, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [setprimary.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: setprimary}
