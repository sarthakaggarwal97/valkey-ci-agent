extends: [valkey.liveness]
id: proposed.replica-shardid-divergence-restart
deployment:
  modes: [standalone]
metadata:
  description: A replica that runs CLUSTER REPLICATE right after a fresh MEET, before
    it learned its primary's shard id, gossips a diverging shard id; the parent persists
    it in the primary's nodes.conf, so restarting the primary crash-loops there, while
    the fixed build rejects the update and restarts cleanly (valkey-io/valkey
inputs:
  properties:
    online_pattern:
      type: string
      enum: ["state=online", "connected_slaves:1"]
      default: "state=online"
      description: how far replication must get before the primary restarts
components:
- use: valkey.action.commands
  id: divergence
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 2
    timeout_s: 60
    commands:
    - {command: [CLUSTER, RESET, HARD], node: 1, expect: {equals: OK}}
    - {command: [CLUSTER, MEET, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [CLUSTER, REPLICATE, "<node.0.id>"], node: 1, wait_s: 30, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 0, wait_s: 30, compare: skip, expect: {
        contains: {$ref: inputs.online_pattern}}}
    - {restart: true, node: 0, expect_difference: true, expect: {equals: OK}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [divergence.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: divergence}
