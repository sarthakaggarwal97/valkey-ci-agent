extends: [valkey.liveness]
id: proposed.callargv-lua-forkless
deployment:
  modes: [standalone]
metadata:
  description: EVAL writes through the now-public VM_CallArgv while a forkless save
    holds keys - the new would_block/EAGAIN path must not surface INUSE or EAGAIN
    to scripts and the write must apply synchronously; runs on the deployment, judged
    by expect alone
components:
- use: valkey.action.commands
  id: lua-forkless
  config:
    timeout_s: 30
    commands:
    - {command: [SET, held-key, original], expect: {equals: OK}}
    - {command: [SET, held-key2, original2], expect: {equals: OK}}
    - {command: [SET, held-key3, original3], expect: {equals: OK}}
    - {command: [CONFIG, SET, rdb-key-save-delay, "5000000"], expect: {equals: OK}}
    - {command: [BGSAVE], expect: {equals: "Background saving started"}}
    - {command: [INFO, persistence], wait_s: 10, expect: {contains: "rdb_current_bgsave_type:forkless"}}
    - {command: [EVAL, "return redis.call('SET', KEYS[1], ARGV[1])", "1", held-key,
        from-lua], expect: {equals: OK}}
    - {command: [EVAL, "return redis.call('GET', KEYS[1])", "1", held-key], expect: {
        equals: from-lua}}
    - {command: [EVAL, "local r = redis.pcall('SET', KEYS[1], 'x') if r.err then return\
          \ r.err end return r.ok", "1", held-key2], expect: {equals: OK}}
    - {command: [CONFIG, SET, rdb-key-save-delay, "0"], expect: {equals: OK}}
    - {command: [INFO, persistence], wait_s: 60, expect: {contains: "rdb_bgsave_in_progress:0"}}
    - {command: [GET, held-key], expect: {equals: from-lua}}
    - {command: [GET, held-key2], expect: {equals: x}}
required_events: [lua-forkless.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: lua-forkless}
