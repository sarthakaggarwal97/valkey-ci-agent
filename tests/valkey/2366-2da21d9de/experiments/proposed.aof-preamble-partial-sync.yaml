extends: [valkey.liveness]
id: proposed.aof-preamble-partial-sync
deployment:
  modes: [standalone]
metadata:
  description: >-
    After BGREWRITEAOF persists replication info in the AOF preamble, a restarted
    primary restores it as replid2/second_repl_offset with a rebased offset and accepts
    a partial resync, and a restarted replica resumes with PSYNC instead of a full
    sync; the parent build restores nothing and always full-syncs. Also probes that
    an AOF tail written after the rewrite is not double-applied by the partial resync
    (non-idempotent APPEND/RPUSH).
components:
- use: valkey.action.commands
  id: primary-restart
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 180
    server_config: {appendonly: "yes", aof-use-rdb-preamble: "yes", appendfsync: always,
      repl-ping-replica-period: 10000}
    commands:
    - {command: [SET, k1, v1], node: 0, expect: {equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [INFO, persistence], node: 1, wait_s: 30, expect: {contains: "aof_rewrite_in_progress:0"},
      compare: skip}
    - {command: [SET, k2, v2], node: 0, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "master_repl_offset:52"},
      compare: skip}
    - {command: [BGREWRITEAOF], node: 1, expect: {contains: rewriting}, compare: skip}
    - {command: [INFO, persistence], node: 1, wait_s: 30, expect: {contains: "aof_rewrite_in_progress:0"},
      compare: skip}
    - {command: [INFO, persistence], node: 1, expect: {contains: "aof_last_bgrewrite_status:ok"},
      compare: skip}
    - {restart: true, node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, expect_difference: true, expect: {contains: "master_repl_offset:52"}}
    - {command: [INFO, replication], node: 1, expect_difference: true, expect: {contains: "second_repl_offset:53"}}
    - {command: [REPLICAOF, "<node.1.host>", "<node.1.port>"], node: 0, expect: {
        equals: OK}}
    - {command: [INFO, stats], node: 1, wait_s: 30, expect_difference: true, expect: {
        contains: "sync_partial_ok:1"}}
    - {command: [INFO, stats], node: 1, expect_difference: true, expect: {contains: "sync_full:0"}}
    - {command: [INFO, replication], node: 0, wait_s: 60, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [SET, sentinel, done], node: 1, expect: {equals: OK}}
    - {command: [GET, sentinel], node: 0, wait_s: 30, expect: {equals: done}}
    - {command: [GET, k1], node: 0, expect: {equals: v1}}
    - {command: [GET, k2], node: 0, expect: {equals: v2}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
- use: valkey.action.commands
  id: replica-restart
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 180
    server_config: {appendonly: "yes", aof-use-rdb-preamble: "yes", appendfsync: everysec,
      repl-ping-replica-period: 10000}
    commands:
    - {command: [SET, base, x], node: 0, expect: {equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [CONFIG, REWRITE], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [INFO, persistence], node: 1, wait_s: 30, expect: {contains: "aof_rewrite_in_progress:0"},
      compare: skip}
    - {command: [RPUSH, mylist, a, b, c], node: 0, expect: {equals: 3}}
    - {command: [APPEND, acc, abc], node: 0, expect: {equals: 3}}
    - {command: [LLEN, mylist], node: 1, wait_s: 30, expect: {equals: 3}}
    - {command: [BGREWRITEAOF], node: 1, expect: {contains: rewriting}, compare: skip}
    - {command: [INFO, persistence], node: 1, wait_s: 30, expect: {contains: "aof_rewrite_in_progress:0"},
      compare: skip}
    - {command: [INFO, persistence], node: 1, expect: {contains: "aof_last_bgrewrite_status:ok"},
      compare: skip}
    - {command: [APPEND, acc, def], node: 0, expect: {equals: 6}}
    - {command: [RPUSH, mylist, d], node: 0, expect: {equals: 4}}
    - {command: [GET, acc], node: 1, wait_s: 30, expect: {equals: abcdef}}
    - {restart: true, node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 60, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [INFO, stats], node: 0, wait_s: 30, expect_difference: true, expect: {
        contains: "sync_partial_ok:1"}}
    - {command: [INFO, stats], node: 0, expect_difference: true, expect: {contains: "sync_full:1"}}
    - {command: [SET, sentinel, done], node: 0, expect: {equals: OK}}
    - {command: [GET, sentinel], node: 1, wait_s: 30, expect: {equals: done}}
    - {command: [LLEN, mylist], node: 1, expect: {equals: 4}}
    - {command: [GET, acc], node: 1, expect: {equals: abcdef}}
    - {command: [LRANGE, mylist, 0, -1], node: 1, expect: {equals: [a, b, c, d]}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [primary-restart.completed, replica-restart.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: primary-restart}
- {evidence_id: valkey.command.sequence, source: replica-restart}
