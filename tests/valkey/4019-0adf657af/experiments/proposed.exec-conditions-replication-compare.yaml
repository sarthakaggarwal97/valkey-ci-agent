extends: [valkey.liveness]
id: proposed.exec-conditions-replication-compare
deployment:
  modes: [standalone]
metadata:
  description: Conditional EXEC on a primary with a live replica - committed transactions
    replicate, failed conditions replicate nothing, an NX lazy-expire DEL reaches
    the replica
components:
- use: valkey.action.commands
  id: repl
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 60
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [SET, cond, value], expect: {equals: OK}}
    - {command: [MULTI], expect: {equals: OK}}
    - {command: [SET, k1, v1], expect: {equals: QUEUED}}
    - {command: [EXEC, IFEQ, cond, value], expect_difference: true, expect: {equals: [
          OK]}}
    - {command: [MULTI], expect: {equals: OK}}
    - {command: [SET, k2, v2], expect: {equals: QUEUED}}
    - {command: [EXEC, IFNE, cond, value], expect_difference: true, expect: {equals: null}}
    - {command: [PSETEX, exp, 50, v], expect: {equals: OK}}
    - {command: [DEBUG, SLEEP, 0.2], expect: {equals: OK}}
    - {command: [MULTI], expect: {equals: OK}}
    - {command: [SET, k3, v3], expect: {equals: QUEUED}}
    - {command: [EXEC, NX, exp], expect_difference: true, expect: {equals: [OK]}}
    - {command: [WAIT, 1, 5000], expect: {equals: 1}}
    - {command: [GET, k1], node: 1, wait_s: 10, expect_difference: true, expect: {
        equals: v1}}
    - {command: [GET, k2], node: 1, expect: {exists: false}}
    - {command: [GET, k3], node: 1, wait_s: 10, expect_difference: true, expect: {
        equals: v3}}
    - {command: [GET, exp], node: 1, expect: {exists: false}}
    - {command: [GET, cond], node: 1, wait_s: 10, expect: {equals: value}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
