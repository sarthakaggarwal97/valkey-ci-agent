extends: [valkey.liveness]
id: proposed.replica-ask-tryagain
deployment:
  modes: [standalone]
metadata:
  description: After READONLY, replicas of migrating/importing primaries return ASK,
    TRYAGAIN and MOVED like their primary instead of serving stale reads
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: redirects
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 4
    resp: {$ref: inputs.resp}
    timeout_s: 240
    server_config: {cluster-allow-replica-migration: "no"}
    commands:
    - {command: [CLUSTER, REPLICATE, "<node.0.id>"], node: 2, wait_s: 30, expect: {
        equals: OK}}
    - {command: [CLUSTER, REPLICATE, "<node.1.id>"], node: 3, wait_s: 30, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 2, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [INFO, replication], node: 3, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [SET, "{aga}1", v1], node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, SETSLOT, "609", IMPORTING, "<node.0.id>"], node: 1, wait_s: 30,
      expect: {equals: OK}}
    - {command: [CLUSTER, SETSLOT, "609", MIGRATING, "<node.1.id>"], node: 0, wait_s: 30,
      expect: {equals: OK}}
    - {command: [CLUSTER, NODES], node: 2, wait_s: 30, compare: skip, expect: {contains: "[609->-"}}
    - {command: [CLUSTER, NODES], node: 3, wait_s: 30, compare: skip, expect: {contains: "[609-<-"}}
    - {command: [READONLY], node: 2, expect: {equals: OK}}
    - {command: [GET, "{aga}1"], node: 2, wait_s: 30, expect: {equals: v1}}
    - {command: [GET, aga], node: 2, expect_difference: true, expect: {error: "ASK\
          \ 609"}}
    - {command: [MGET, "{aga}1", aga], node: 2, expect_difference: true, expect: {
        error: "TRYAGAIN"}}
    - {command: [MULTI], node: 2, expect: {equals: OK}}
    - {command: [GET, aga], node: 2, expect_difference: true, expect: {error: "ASK\
          \ 609"}}
    - {command: [EXEC], node: 2, expect_difference: true, expect: {error: "EXECABORT"}}
    - {command: [MIGRATE, "<node.1.host>", "<node.1.port>", aga, "0", "100"], node: 2,
      expect_difference: true, expect: {error: "ASK 609"}}
    - {command: [READWRITE], node: 2, expect: {equals: OK}}
    - {command: [GET, aga], node: 2, expect: {error: "MOVED 609"}}
    - {command: [READONLY], node: 3, expect: {equals: OK}}
    - {command: [ASKING], node: 3, expect: {equals: OK}}
    - {command: [MGET, "{aga}1", aga], node: 3, expect: {error: "TRYAGAIN"}}
    - {command: [READWRITE], node: 3, expect: {equals: OK}}
    - {command: [ASKING], node: 3, expect: {equals: OK}}
    - {command: [GET, aga], node: 3, expect_difference: true, expect: {error: "MOVED\
          \ 609"}}
    - {command: [ASKING], node: 3, expect: {equals: OK}}
    - {command: [SET, aga, x], node: 3, expect_difference: true, expect: {error: "MOVED\
          \ 609"}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [redirects.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: redirects}
