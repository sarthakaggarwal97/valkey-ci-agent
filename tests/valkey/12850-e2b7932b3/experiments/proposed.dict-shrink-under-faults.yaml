extends: [valkey.base]
id: proposed.dict-shrink-under-faults
deployment:
  modes: [standalone]
metadata:
  description: Mass-create then mass-delete and mass-expire so the db and expires
    dicts shrink and rehash on the deployment under a live workload, a BGSAVE, active
    expiry, and a SIGKILL plus AOF reload of the primary; the ledger, deployment-state
    and liveness oracles judge
components:
- use: valkey.action.commands
  id: churn
  config:
    instances: primary
    timeout_s: 30
    commands:
    - {command: [EVAL, "for i=1,20000 do redis.call('set','mk:'..i,'v') end return\
          \ 20000", 0], expect: {equals: 20000}}
    - {command: [EVAL, "for i=1,10000 do redis.call('set','mt:'..i,'v','PX',2000)\
          \ end return 10000", 0], expect: {equals: 10000}}
- use: valkey.action.sleep
  id: warm-up
  depends_on: [writes, churn, kill-primary]
  config: {seconds: 1}
- use: valkey.action.bgsave
  id: save
  depends_on: [warm-up]
  config: {instances: primary, expect: ok, capture_rdb: false, timeout_s: 90}
- use: valkey.action.commands
  id: mass-delete
  depends_on: [save]
  config:
    instances: primary
    timeout_s: 30
    commands:
    - {command: [EVAL, "local n=0 for i=1,20000 do n=n+redis.call('del','mk:'..i)\
          \ end for i=1,10000 do redis.call('del','mt:'..i) end return n", 0], expect: {
        equals: 20000}}
- use: valkey.action.sleep
  id: expire-wait
  depends_on: [mass-delete]
  config: {seconds: 4}
- use: valkey.fault.process-signal
  id: kill-primary
  config:
    when_event: expire-wait.completed
    instance: primary
    signal: SIGKILL
    restart: true
    restart_mode: immediate
- use: valkey.action.sleep
  id: settle
  depends_on: [expire-wait]
  config: {seconds: 5}
- use: valkey.oracle.ledger
  id: data
  config: {workload: writes, loss_window_s: 2.5, loss_window_faults: [kill-primary]}
required_events: [warm-up.completed, expire-wait.completed]
required_evidence:
- {evidence_id: valkey.fault.injected, source: kill-primary}
- {evidence_id: valkey.command.sequence, source: churn}
