extends: [valkey.liveness]
id: proposed.functions-resync-compare
deployment:
  modes: [standalone]
metadata:
  description: Diskless full sync onto a replica that already holds a 100-function
    library, twice, then FUNCTION FLUSH ASYNC and SYNC; replies compared across builds
inputs:
  properties:
    repl_diskless_load: {type: string, enum: [disabled, on-empty-db, swapdb], default: swapdb}
    replica_lazy_flush: {type: string, enum: ["yes", "no"], default: "yes"}
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: resync
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 30
    server_config:
      repl-diskless-load: {$ref: inputs.repl_diskless_load}
      repl-diskless-sync: "yes"
      repl-diskless-sync-delay: "0"
      replica-lazy-flush: {$ref: inputs.replica_lazy_flush}
    commands:
    - command: [FUNCTION, LOAD, "#!lua name=biglib\nfor i=1,100 do server.register_function{function_name='f'\
          \ .. i, callback=function() return i end, flags={'no-writes'}} end"]
      expect: {equals: biglib}
    - {command: [DEBUG, POPULATE, 5000], expect: {equals: OK}}
    - command: [FUNCTION, LOAD, "#!lua name=oldlib\nfor i=1,100 do server.register_function{function_name='g'\
          \ .. i, callback=function() return 'old' end, flags={'no-writes'}} end"]
      node: 1
      expect: {equals: oldlib}
    - {command: [FCALL_RO, g1, 0], node: 1, expect: {equals: old}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [FCALL_RO, f1, 0], node: 1, wait_s: 15, expect: {equals: 1}}
    - {command: [FCALL_RO, g1, 0], node: 1, expect: {error: "Function not found"}}
    - {command: [DBSIZE], node: 1, wait_s: 15, expect: {equals: 5000}}
    - {command: [DEBUG, CHANGE-REPL-ID], expect: {equals: OK}}
    - {command: [CLIENT, KILL, TYPE, replica], expect: {equals: 1}}
    - {command: [INFO, stats], wait_s: 30, expect: {contains: "sync_full:2"}, compare: skip}
    - {command: [FCALL_RO, f1, 0], node: 1, wait_s: 15, expect: {equals: 1}}
    - {command: [DBSIZE], node: 1, wait_s: 15, expect: {equals: 5000}}
    - {command: [FUNCTION, FLUSH, ASYNC], expect: {equals: OK}}
    - {command: [FCALL_RO, f1, 0], node: 1, wait_s: 15, expect: {error: "Function\
          \ not found"}}
    - command: [FUNCTION, LOAD, "#!lua name=biglib\nfor i=1,100 do server.register_function{function_name='f'\
          \ .. i, callback=function() return i end, flags={'no-writes'}} end"]
      expect: {equals: biglib}
    - {command: [FUNCTION, FLUSH, SYNC], expect: {equals: OK}}
    - {command: [FCALL_RO, f1, 0], expect: {error: "Function not found"}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [resync.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: resync}
