extends: [valkey.liveness]
id: proposed.benchmark-function-script-overflow
deployment:
  modes: [standalone]
metadata:
  description: valkey-benchmark function_load with more functions than fit in the
    64K script buffer overflows the heap on the parent build
inputs:
  properties:
    num_functions: {type: integer, default: 20000, minimum: 1, maximum: 2147483647}
components:
- use: valkey.action.tools
  id: bench
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server: true
    timeout_s: 60
    runs:
    - tool: valkey-benchmark
      args: [-h, 127.0.0.1, -p, $port, -n, 1, -c, 1, -t, function_load, --num-functions,
        {$ref: inputs.num_functions}]
      expect_difference: true
      expect: {stderr: {contains: "Error from server"}}
required_evidence:
- {evidence_id: valkey.tool.runs, source: bench}
