extends: [valkey.liveness]
id: proposed.waitaof-in-scripts
deployment:
  modes: [standalone]
metadata:
  description: >
    WAITAOF runs inside EVAL/EVAL_RO/FCALL/FCALL_RO after the NOSCRIPT flag was removed,
    returns immediately via CLIENT_DENY_BLOCKING instead of blocking the script, its
    own argument/replica/appendonly errors surface from scripts, and WAIT and WAITAOF
    joined the @blocking ACL category.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    appendfsync: {type: string, enum: [always, everysec, "no"], default: always}
components:
- use: valkey.action.commands
  id: aof-off
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    nodes: 2
    timeout_s: 60
    commands:
    - command: [EVAL, "return redis.pcall('waitaof','0','1','0')", "0"]
      expect_difference: true
      expect: {equals: [0, 0]}
    - command: [EVAL, "return redis.call('waitaof','1','0','0')", "0"]
      expect_difference: true
      expect: {error: "appendonly is disabled"}
    - command: [EVAL, "return redis.call('waitaof','2','0','0')", "0"]
      expect_difference: true
      expect: {error: "out of range"}
    - command: [EVAL_RO, "return redis.call('waitaof','0','1','0')", "0"]
      expect_difference: true
      expect: {equals: [0, 0]}
    - command: [EVAL, "return redis.call('wait','0','0')", "0"]
      expect: {equals: 0}
    - command:
      - FUNCTION
      - LOAD
      - "#!lua name=waitlib\nredis.register_function('waf', function(keys, args) return\
        \ redis.call('waitaof','0','1','0') end)\nredis.register_function{function_name='wafro',\
        \ callback=function(keys, args) return redis.call('waitaof','0','1','0') end,\
        \ flags={'no-writes'}}"
      expect: {equals: waitlib}
    - command: [FCALL, waf, "0"]
      expect_difference: true
      expect: {equals: [0, 0]}
    - command: [FCALL_RO, wafro, "0"]
      expect_difference: true
      expect: {equals: [0, 0]}
    - command: [ACL, SETUSER, noblock, on, nopass, "~*", "+@all", "-@blocking"]
      expect: {equals: OK}
    - {command: [AUTH, noblock, x], connection: acl, expect: {equals: OK}}
    - command: [WAIT, "0", "0"]
      connection: acl
      expect_difference: true
      expect: {error: "no permissions"}
    - command: [WAITAOF, "0", "0", "0"]
      connection: acl
      expect_difference: true
      expect: {error: "no permissions"}
    - command: [EVAL, "return redis.call('wait','0','0')", "0"]
      connection: acl
      expect_difference: true
      expect: {error: "no permissions"}
    - command: [ACL, CAT, blocking]
      compare: unordered
      expect_difference: true
      expect: {contains: waitaof}
    - command: [COMMAND, INFO, waitaof]
      expect_difference: true
      expect: {exists: true}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - command: [INFO, replication]
      node: 1
      wait_s: 30
      compare: skip
      expect: {contains: "master_link_status:up"}
    - command: [EVAL, "return redis.call('waitaof','0','1','0')", "0"]
      node: 1
      expect_difference: true
      expect: {error: "replica instances"}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
- use: valkey.action.commands
  id: aof-on
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server_config:
      appendonly: "yes"
      appendfsync: {$ref: inputs.appendfsync}
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - command: [EVAL, "redis.call('set', KEYS[1], 'v') return redis.call('waitaof','1','0','0')",
        "1", k]
      expect_difference: true
      expect: {equals: [0, 0]}
    - {command: [GET, k], expect: {equals: v}}
    - command: [EVAL, "redis.call('set', KEYS[1], 'w') return redis.call('waitaof','0','1','0')",
        "1", k]
      expect_difference: true
      expect: {equals: [0, 0]}
    - command: [WAITAOF, "1", "0", "100"]
      compare: skip
    - {command: [GET, k], expect: {equals: w}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [aof-off.completed, aof-on.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: aof-off}
- {evidence_id: valkey.command.sequence, source: aof-on}
