extends: [valkey.liveness]
id: proposed.replication-handshake-busy-primary-compare
deployment:
  modes: [standalone]
metadata:
  description: Replica handshake PING answered with -BUSY by a primary stuck in a
    long Lua script; the replica must log the PING error, abort, retry, and converge
    once the script ends
components:
- use: valkey.action.commands
  id: busy
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 90
    commands:
    - {command: [CONFIG, SET, busy-reply-threshold, "100"], node: 0, expect: {equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [EVAL, "local x=0 for i=1,200000000 do x=x+1 end return x", "0"],
      node: 0, expect: {equals: 200000000}}
    - {command: [INFO, errorstats], node: 0, wait_s: 15, expect: {contains: errorstat_BUSY},
      compare: skip}
    - {command: [INFO, replication], node: 1, wait_s: 60, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [SET, k, v1], node: 0, expect: {equals: OK}}
    - {command: [GET, k], node: 1, wait_s: 10, expect: {equals: v1}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [busy.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: busy}
