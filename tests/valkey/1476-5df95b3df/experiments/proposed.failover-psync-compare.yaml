extends: [valkey.liveness]
id: proposed.failover-psync-compare
deployment:
  modes: [standalone]
metadata:
  description: Coordinated FAILOVER TO makes the old primary send PSYNC ... FAILOVER;
    roles must swap and data converge on both builds
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    dual_channel: {type: string, enum: ["yes", "no"], default: "no"}
    diskless_sync: {type: string, enum: ["yes", "no"], default: "no"}
components:
- use: valkey.action.commands
  id: failover
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 30
    server_config:
      dual-channel-replication-enabled: {$ref: inputs.dual_channel}
      repl-diskless-sync: {$ref: inputs.diskless_sync}
    commands:
    - {command: [SET, k1, v1], node: 0, expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [FAILOVER, TO, <node.1.host>, <node.1.port>], node: 0, expect: {equals: OK}}
    - {command: [INFO, replication], node: 0, wait_s: 30, expect: {contains: "role:slave"},
      compare: skip}
    - {command: [INFO, replication], node: 0, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "role:master"},
      compare: skip}
    - {command: [INFO, replication], node: 0, wait_s: 15, expect: {contains: "master_failover_state:no-failover"},
      compare: skip}
    - {command: [SET, k2, v2], node: 1, expect: {equals: OK}}
    - {command: [GET, k2], node: 0, wait_s: 10, expect: {equals: v2}}
    - {command: [GET, k1], node: 1, expect: {equals: v1}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [failover.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: failover}
