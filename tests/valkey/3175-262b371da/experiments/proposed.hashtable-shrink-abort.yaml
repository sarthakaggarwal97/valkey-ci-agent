extends: [valkey.liveness]
id: proposed.hashtable-shrink-abort
deployment:
  modes: [standalone]
metadata:
  description: >-
    Deterministically drive the new shrink-rehash abort (abortShrinkIfNeeded/swapTables)
    on zset, hash and set hashtables and compare every reply with the parent build.
    Each round grows a collection to 60 entries (capacity 112), deletes all but one
    so a shrink rehash to a 7-slot ht1 starts, freezes incremental rehash steps with
    DEBUG DICT-RESIZING 0, then inserts 36 entries: insert 35 pushes ht1 past MAX_FILL_PERCENT_HARD
    (7*500/100=35), so the candidate swaps the tables and restarts rehashing as an
    expand while the parent keeps chaining into the tiny ht1. Rehash is then unfrozen
    and reads/removals verify no entry was lost or duplicated by the swap.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    cluster: {type: boolean, default: false}
components:
- use: valkey.action.commands
  id: shrink-abort
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    cluster: {$ref: inputs.cluster}
    timeout_s: 60
    server_config:
      enable-debug-command: "yes"
      zset-max-listpack-entries: 0
      hash-max-listpack-entries: 0
      set-max-listpack-entries: 0
      set-max-intset-entries: 0
    commands:
    - {command: [DEBUG, HASHTABLE-CAN-ABORT-SHRINK, 1], expect_difference: true, expect: {
        equals: OK}}
    - {command: [ZADD, z, 0, m0, 1, m1, 2, m2, 3, m3, 4, m4, 5, m5, 6, m6, 7, m7,
        8, m8, 9, m9, 10, m10, 11, m11, 12, m12, 13, m13, 14, m14, 15, m15, 16, m16,
        17, m17, 18, m18, 19, m19, 20, m20, 21, m21, 22, m22, 23, m23, 24, m24, 25,
        m25, 26, m26, 27, m27, 28, m28, 29, m29, 30, m30, 31, m31, 32, m32, 33, m33,
        34, m34, 35, m35, 36, m36, 37, m37, 38, m38, 39, m39, 40, m40, 41, m41, 42,
        m42, 43, m43, 44, m44, 45, m45, 46, m46, 47, m47, 48, m48, 49, m49, 50, m50,
        51, m51, 52, m52, 53, m53, 54, m54, 55, m55, 56, m56, 57, m57, 58, m58, 59,
        m59], expect: {equals: 60}}
    - {command: [ZSCORE, z, m0], expect: {equals: "0"}}
    - {command: [ZSCORE, z, m1], expect: {equals: "1"}}
    - {command: [ZSCORE, z, m2], expect: {equals: "2"}}
    - {command: [ZSCORE, z, m3], expect: {equals: "3"}}
    - {command: [ZSCORE, z, m4], expect: {equals: "4"}}
    - {command: [ZSCORE, z, m5], expect: {equals: "5"}}
