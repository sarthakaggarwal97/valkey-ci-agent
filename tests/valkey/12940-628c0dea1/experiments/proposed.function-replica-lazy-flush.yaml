extends: [valkey.liveness]
id: proposed.function-replica-lazy-flush
deployment:
  modes: [standalone]
metadata:
  description: >-
    A server holding a 100-function library becomes a replica of an empty primary
    with replica-lazy-flush yes; the full resync empties its functions ctx through
    freeFunctionsAsync and the bio lazyFreeFunctionsCtx path, compared against the
    parent build.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: replsync
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    server_config: {replica-lazy-flush: "yes"}
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - command:
      - FUNCTION
      - LOAD
      - |
        #!lua name=biglib
        for i=1,100 do
          redis.register_function{function_name='f' .. i, callback=function(keys, args) return i end, flags={'no-writes'}}
        end
      node: 1
      expect: {equals: biglib}
    - {command: [FCALL, f1, "0"], node: 1, expect: {equals: 1}}
    - {command: [SET, k, v], node: 0, expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, compare: skip, wait_s: 30, expect: {
        contains: "master_link_status:up"}}
    - {command: [FCALL_RO, f1, "0"], node: 1, expect: {error: "Function not found"}}
    - {command: [GET, k], node: 1, expect: {equals: v}}
    - {command: [INFO, memory], node: 1, compare: skip, wait_s: 20, expect: {contains: "lazyfree_pending_objects:0"}}
    - {command: [FUNCTION, STATS], node: 1}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [replsync.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: replsync}
