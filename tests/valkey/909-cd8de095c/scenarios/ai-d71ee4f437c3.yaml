scenario_id: ai-d71ee4f437c3
seed: 105
experiment:
  id: valkey.replication-chaos
  inputs:
    mutation_rate: 400
    value_size: 1024
    stable_keys: 2000
    waves:
    - - op: kill
        target: replica
        delay_s: 0.2
      - op: restart
        target: killed
        delay_s: 0.8
    - - op: stall
        target: replica
        duration_s: 1.5
      - op: kill
        target: primary
        signal: SIGKILL
        delay_s: 0.5
    - - op: promote
        target: replica
        mode: graceful
      - op: kill
        target: replica
        delay_s: 0.5
      - op: restart
        target: killed
        delay_s: 1.5
    - - op: backlog_pressure
        repl_backlog_size: 16384
        output_limit: 65536
        duration_s: 2.0
        delay_s: 0.2
deployment:
  mode: standalone
  replicas_per_primary: 2
  base_port: 7400
  server_config:
    repl-diskless-load: flush-before-load
    repl-diskless-sync: 'yes'
    repl-diskless-sync-delay: 0
