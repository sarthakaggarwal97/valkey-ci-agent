extends: [valkey.liveness]
id: proposed.repl-diskless-load-flush-before-load
deployment:
  modes: [standalone]
metadata:
  description: >-
    flush-before-load is accepted, flushes the replica's non-empty dataset as diskless
    load begins, and a sync aborted mid-load leaves the replica empty; the parent
    rejects the option and keeps its data or completes a disk-based sync
inputs:
  properties:
    dual_channel: {type: string, enum: ["yes", "no"], default: "no"}
components:
- use: valkey.action.commands
  id: flush-load
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 60
    server_config:
      save: ""
      rdbcompression: "no"
      repl-diskless-sync: "yes"
      repl-diskless-sync-delay: 0
      dual-channel-replication-enabled: {$ref: inputs.dual_channel}
    commands:
    - {command: [DEBUG, POPULATE, "201", "replica:"], node: 1, expect: {equals: OK}}
    - {command: [DBSIZE], node: 1, expect: {equals: 201}}
    - {command: [DEBUG, POPULATE, "200", "master:", "100000"], node: 0, expect: {
        equals: OK}}
    - {command: [CONFIG, SET, rdb-key-save-delay, "10000"], node: 0, expect: {equals: OK}}
    - {command: [CONFIG, SET, repl-diskless-load, flush-before-load], node: 1, expect_difference: true,
      expect: {equals: OK}}
    - {command: [CONFIG, GET, repl-diskless-load], node: 1, expect_difference: true,
      expect: {contains: flush-before-load}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [DBSIZE], node: 1, wait_s: 20, expect_difference: true, expect: {
        error: "LOADING"}}
    - {command: [CONFIG, SET, repl-diskless-sync-delay, "600"], node: 0, expect: {
        equals: OK}}
    - {command: [CLIENT, KILL, TYPE, replica], node: 0, compare: skip}
    - {command: [DBSIZE], node: 1, wait_s: 20, expect_difference: true, expect: {
        equals: 0}}
    - {command: [PING], node: 1, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [flush-load.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: flush-load}
