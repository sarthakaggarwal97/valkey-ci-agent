extends: [valkey.liveness]
id: proposed.repl-transfer-size-info-truncation
deployment:
  modes: [standalone]
metadata:
  description: INFO master_sync_total_bytes stays positive during a >2GiB disk-based
    (bio thread) RDB download; the parent truncates off_t to int and reports a negative
    size
inputs:
  properties:
    dual_channel:
      type: string
      enum: ["no", "yes"]
      default: "no"
components:
- use: valkey.action.commands
  id: sync-info
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 420
    server_config:
      proto-max-bulk-len: 2684354560
      rdbcompression: "no"
      repl-diskless-sync: "no"
      repl-diskless-load: disabled
      dual-channel-replication-enabled: {$ref: inputs.dual_channel}
      repl-timeout: 120
    commands:
    - {command: [SETRANGE, big, 2148000000, x], node: 0, expect: {equals: 2148000001}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - command:
      - EVAL
      - "local info = redis.call('INFO','replication') local v = string.match(info,'master_sync_total_bytes:([%-%d]+)')\
        \ if not v then return 'no-transfer' end local n = tonumber(v) if n < 0 then\
        \ return 'negative' end if n > 2147483647 then return 'big' end return 'small'"
      - "0"
      node: 1
      wait_s: 90
      expect_difference: true
      expect: {equals: big}
    - {command: [INFO, replication], node: 1, wait_s: 120, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [STRLEN, big], node: 1, expect: {equals: 2148000001}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [sync-info.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: sync-info}
