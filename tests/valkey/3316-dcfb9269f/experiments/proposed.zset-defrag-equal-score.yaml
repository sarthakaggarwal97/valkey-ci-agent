extends: [valkey.liveness]
id: proposed.zset-defrag-equal-score
deployment:
  modes: [standalone, cluster]
metadata:
  description: Active defrag over fragmented skiplist-encoded zsets with equal scores
    must not crash or corrupt the set
inputs:
  properties:
    num_keys: {type: integer, default: 1, minimum: 1, maximum: 100000}
    members_per_key: {type: integer, default: 200000, minimum: 2, maximum: 2000000}
    value_pad: {type: integer, default: 240, minimum: 1, maximum: 4096}
    defrag_seconds: {type: number, default: 25, minimum: 1, maximum: 300}
components:
- use: valkey.action.commands
  id: setup
  config:
    timeout_s: 240
    commands:
    - {command: [CONFIG, SET, active-defrag-ignore-bytes, "1", active-defrag-threshold-lower,
        "0", active-defrag-cycle-min, "25", active-defrag-cycle-max, "75", active-defrag-cycle-us,
        "50000"], expect: {equals: OK}}
    - {command: [EVAL, "local nk=tonumber(ARGV[1]); local n=tonumber(ARGV[2]); local\
          \ pad=string.rep('A',tonumber(ARGV[3])); for kk=1,nk do local key='z:'..kk;\
          \ for i=1,n do redis.call('ZADD',key,0,pad..i) end end; return 'OK'", "1",
        "z:1", {$ref: inputs.num_keys}, {$ref: inputs.members_per_key}, {$ref: inputs.value_pad}],
      expect: {equals: OK}}
    - {command: [EVAL, "local nk=tonumber(ARGV[1]); local n=tonumber(ARGV[2]); local\
          \ pad=string.rep('A',tonumber(ARGV[3])); for kk=1,nk do local key='z:'..kk;\
          \ for i=2,n,2 do redis.call('ZREM',key,pad..i) end end; return 'OK'", "1",
        "z:1", {$ref: inputs.num_keys}, {$ref: inputs.members_per_key}, {$ref: inputs.value_pad}],
      expect: {equals: OK}}
    - {command: [CONFIG, SET, activedefrag, "yes"], expect: {equals: OK}}
- use: valkey.action.sleep
  id: defrag-time
  depends_on: [setup]
  config: {seconds: {$ref: inputs.defrag_seconds}}
- use: valkey.action.commands
  id: verify
  depends_on: [defrag-time]
  config:
    timeout_s: 60
    commands:
    - {command: [CONFIG, SET, activedefrag, "no"], expect: {equals: OK}}
    - {command: [EVAL, "local pad=string.rep('A',tonumber(ARGV[1])); local c=redis.call('ZCARD','z:1');\
          \ if c<1 then return redis.error_reply('empty') end; if redis.call('ZSCORE','z:1',pad..'1')~='0'\
          \ then return redis.error_reply('badscore') end; return 'OK'", "1", "z:1",
        {$ref: inputs.value_pad}], expect: {equals: OK}}
    - {command: [PING], expect: {equals: PONG}}
required_evidence:
- {evidence_id: valkey.command.sequence, source: setup}
- {evidence_id: valkey.command.sequence, source: verify}
