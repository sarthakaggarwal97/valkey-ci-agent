extends: [valkey.liveness]
id: proposed.debug-clusterlink-kill-null
deployment:
  modes: [standalone, cluster]
metadata:
  description: DEBUG CLUSTERLINK KILL on a node whose link is NULL (the myself node)
    must not crash
inputs:
  properties:
    direction: {type: string, enum: [to, from, all], default: all}
components:
- use: valkey.action.commands
  id: killlink
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    timeout_s: 10
    commands:
    - {command: [CLUSTER, MYID], node: 0, expect: {equals: "<node.0.id>"}}
    - {command: [DEBUG, CLUSTERLINK, KILL, {$ref: inputs.direction}, "<node.0.id>"],
      node: 0, expect_difference: true, expect: {equals: OK}}
    - {command: [PING], node: 0, expect_difference: true, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [killlink.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: killlink}
