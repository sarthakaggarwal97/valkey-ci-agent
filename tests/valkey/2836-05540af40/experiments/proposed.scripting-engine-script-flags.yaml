extends: [valkey.liveness]
id: proposed.scripting-engine-script-flags
deployment:
  modes: [standalone]
metadata:
  description: >
    Module scripting-engine functions declared read-only (f_flags = VMSE_SCRIPT_FLAG_NO_WRITES
    via helloscripting's new RFUNCTION) are enforced everywhere the flag matters:
    write commands are blocked inside them, FCALL_RO accepts them, FUNCTION LIST reports
    no-writes, they run on a read-only replica and under maxmemory OOM, and a REPLACE
    that drops the flag makes the function writable again. Unflagged module functions
    and Lua shebang flags (which now share the same enum values) must behave identically
    on both builds.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: flags
  config:
    compare_with: {$ref: artifacts.parent.binary}
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    nodes: 2
    timeout_s: 30
    commands:
    - {command: [SET, x, 42], expect: {equals: OK}}
    - {command: [FUNCTION, LOAD, "#!hello name=rord\nRFUNCTION roget\nCONSTS x\nCONSTI\
          \ 1\nCALL GET\nRETURN"], expect_difference: true, expect: {equals: rord}}
    - {command: [FUNCTION, LOAD, "#!hello name=rowr\nRFUNCTION rowrite\nCONSTS y\n\
          CONSTI 43\nCONSTI 2\nCALL SET\nRETURN"], expect_difference: true, expect: {
        equals: rowr}}
    - {command: [FUNCTION, LOAD, "#!hello name=wrlib\nFUNCTION wset\nCONSTS y\nCONSTS\
          \ v1\nCONSTI 2\nCALL SET\nRETURN"], expect: {equals: wrlib}}
    - {command: [FCALL, roget, 0], expect_difference: true, expect: {equals: 42}}
    - {command: [FCALL, rowrite, 0], expect_difference: true, expect: {error: "Write\
          \ commands are not allowed"}}
    - {command: [FCALL_RO, roget, 0], expect_difference: true, expect: {equals: 42}}
    - {command: [FCALL_RO, wset, 0], expect: {error: "Can not execute a script with\
          \ write flag"}}
    - {command: [FCALL, wset, 0], expect: {equals: OK}}
    - {command: [GET, y], expect: {equals: v1}}
    - {command: [FUNCTION, LIST, LIBRARYNAME, rord], expect_difference: true, expect: {
        contains: no-writes}}
    - {command: [FUNCTION, LIST, LIBRARYNAME, wrlib], expect: {contains: wset}}
    - {command: [EVAL, "#!lua flags=no-writes\nreturn server.call('SET', KEYS[1],\
          \ 'v')", 1, k], expect: {error: "Write commands are not allowed"}}
    - {command: [EVAL, "#!lua flags=no-writes,allow-oom\nreturn server.call('GET',\
          \ KEYS[1])", 1, x], expect: {equals: 42}}
    - {command: [CONFIG, SET, maxmemory, 1], expect: {equals: OK}}
    - {command: [FCALL, roget, 0], expect_difference: true, expect: {equals: 42}}
    - {command: [FCALL, wset, 0], expect: {error: OOM}}
    - {command: [CONFIG, SET, maxmemory, 0], expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [FCALL, roget, 0], node: 1, expect_difference: true, expect: {equals: 42}}
    - {command: [FCALL_RO, roget, 0], node: 1, expect_difference: true, expect: {
        equals: 42}}
    - {command: [FCALL, rowrite, 0], node: 1, expect_difference: true, expect: {error: "Write\
          \ commands are not allowed"}}
    - {command: [FCALL, wset, 0], node: 1, expect: {error: READONLY}}
    - {command: [FUNCTION, LOAD, REPLACE, "#!hello name=rowr\nFUNCTION rowrite\nCONSTS\
          \ y\nCONSTI 43\nCONSTI 2\nCALL SET\nRETURN"], expect: {equals: rowr}}
    - {command: [FCALL, rowrite, 0], expect: {equals: OK}}
    checks:
      acl: true
      compat: true
      variants: true
required_events: [flags.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: flags}
