extends: [valkey.liveness]
id: proposed.hash-copy-expired-replication
deployment:
  modes: [standalone]
metadata:
  description: COPY of a hash holding an expired-but-unreaped field keeps a replica
    in sync; on the parent the primary drops the field, the replica keeps it, and
    the deletion is never propagated
components:
- use: valkey.action.commands
  id: replcopy
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    server_config: {hash-max-listpack-entries: 0}
    timeout_s: 15
    commands:
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [DEBUG, SET-ACTIVE-EXPIRE, 0], node: 0, expect: {equals: OK}}
    - {command: [DEBUG, SET-ACTIVE-EXPIRE, 0], node: 1, expect: {equals: OK}}
    - {command: [HSET, h, f1, v1, f2, v2], node: 0, expect: {equals: 2}}
    - {command: [HPEXPIRE, h, 1, FIELDS, 1, f1], node: 0, expect: {equals: [1]}}
    - {command: [HEXISTS, h, f1], node: 0, wait_s: 10, expect: {equals: 0}}
    - {command: [OBJECT, ENCODING, h], node: 0, compare: skip, expect: {equals: hashtable}}
    - {command: [COPY, h, c], node: 0, expect: {equals: 1}}
    - {command: [WAIT, 1, 200], node: 0, wait_s: 15, expect: {equals: 1}}
    - {command: [HLEN, c], node: 0, expect_difference: true, expect: {equals: 2}}
    - {command: [HLEN, c], node: 1, expect: {equals: 2}}
    - {command: [DEBUG, SET-ACTIVE-EXPIRE, 1], node: 0, expect: {equals: OK}}
    - {command: [HLEN, c], node: 0, wait_s: 20, expect: {equals: 1}}
    - {command: [WAIT, 1, 200], node: 0, wait_s: 15, expect: {equals: 1}}
    - {command: [HLEN, c], node: 1, wait_s: 20, expect_difference: true, expect: {
        equals: 1}}
    - {command: [HLEN, h], node: 1, wait_s: 20, expect: {equals: 1}}
    - {command: [HKEYS, c], node: 1, compare: unordered, expect: {equals: [f2]}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [replcopy.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: replcopy}
