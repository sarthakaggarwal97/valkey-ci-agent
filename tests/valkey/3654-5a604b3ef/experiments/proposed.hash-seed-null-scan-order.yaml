extends: [valkey.liveness]
id: proposed.hash-seed-null-scan-order
deployment:
  modes: [standalone]
metadata:
  description: >-
    With a hash-seed holding an embedded NUL, the fixed build derives the SipHash
    seed from the full bytes while the parent truncates at the first NUL, so the deterministic
    SCAN/HSCAN/SSCAN/ZSCAN/KEYS iteration order differs between the builds, before
    and after CONFIG REWRITE plus restart.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    hash_seed:
      type: string
      default: '"valkey\x00AAAAA"'
      description: hash-seed config file value, double-quoted with \x00 escapes so
        the server decodes an embedded NUL byte
components:
- use: valkey.action.commands
  id: scan-order
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    timeout_s: 60
    server_config:
      hash-seed: {$ref: inputs.hash_seed}
      hash-max-listpack-entries: 0
      set-max-listpack-entries: 0
      zset-max-listpack-entries: 0
    commands:
    - {command: [CONFIG, GET, hash-seed], expect: {exists: true}}
    - {command: [DEBUG, POPULATE, 200], expect: {equals: OK}}
    - {command: [HSET, h, "f:0", 0, "f:1", 1, "f:2", 2, "f:3", 3, "f:4", 4, "f:5",
        5, "f:6", 6, "f:7", 7, "f:8", 8, "f:9", 9, "f:10", 10, "f:11", 11, "f:12",
        12, "f:13", 13, "f:14", 14, "f:15", 15, "f:16", 16, "f:17", 17, "f:18", 18,
        "f:19", 19, "f:20", 20, "f:21", 21, "f:22", 22, "f:23", 23], expect: {equals: 24}}
    - {command: [SADD, s, "m:0", "m:1", "m:2", "m:3", "m:4", "m:5", "m:6", "m:7",
        "m:8", "m:9", "m:10", "m:11", "m:12", "m:13", "m:14", "m:15", "m:16", "m:17",
        "m:18", "m:19", "m:20", "m:21", "m:22", "m:23"], expect: {equals: 24}}
    - {command: [ZADD, z, 0, "m:0", 1, "m:1", 2, "m:2", 3, "m:3", 4, "m:4", 5, "m:5",
        6, "m:6", 7, "m:7", 8, "m:8", 9, "m:9", 10, "m:10", 11, "m:11", 12, "m:12",
        13, "m:13", 14, "m:14", 15, "m:15", 16, "m:16", 17, "m:17", 18, "m:18", 19,
        "m:19", 20, "m:20", 21, "m:21", 22, "m:22", 23, "m:23"], expect: {equals: 24}}
    - {command: [DBSIZE], expect: {equals: 203}}
    - {command: [SCAN, 0, COUNT, 1000], expect_difference: true, expect: {exists: true}}
    - {command: [SCAN, 0, COUNT, 16], expect_difference: true, expect: {exists: true}}
    - {command: [KEYS, "key:*"], expect_difference: true, expect: {exists: true}}
    - {command: [HSCAN, h, 0, COUNT, 1000], expect_difference: true, expect: {exists: true}}
    - {command: [SSCAN, s, 0, COUNT, 1000], expect_difference: true, expect: {exists: true}}
    - {command: [ZSCAN, z, 0, COUNT, 1000], expect_difference: true, expect: {exists: true}}
    - {command: [CONFIG, REWRITE], expect: {equals: OK}}
    - {restart: true, expect: {equals: OK}}
    - {command: [CONFIG, GET, hash-seed], expect: {exists: true}}
    - {command: [DEBUG, POPULATE, 200], expect: {equals: OK}}
    - {command: [SCAN, 0, COUNT, 1000], expect_difference: true, expect: {exists: true}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [scan-order.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: scan-order}
