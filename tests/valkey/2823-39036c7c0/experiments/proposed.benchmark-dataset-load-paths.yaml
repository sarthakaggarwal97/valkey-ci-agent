extends: [valkey.liveness]
id: proposed.benchmark-dataset-load-paths
deployment:
  modes: [standalone]
metadata:
  description: valkey-benchmark loads CSV datasets (default extension, quoted and
    ragged rows, maxdocs cap) and generates commands; the parent build has no --dataset
components:
- use: valkey.action.tools
  id: bench
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server: true
    files:
      data.txt: "name,age\nalice,30\nbob,25\n"
      quoted.csv: "a,b,c\n\"x\",\"y\",z\np,q\n"
      capped.csv: "k,v\nk1,v1\nk2,v2\nk3,v3\n"
    runs:
    - {tool: valkey-benchmark, args: [-q, -n, 10, -c, 1, -r, 100, -p, "$port", --dataset,
        data.txt, SET, "doc:__rand_int__", "__field:name__"], expect_difference: true,
      expect: {exit: {equals: 0}}}
    - {tool: valkey-benchmark, args: [-q, -n, 10, -c, 1, -p, "$port", --dataset, quoted.csv,
        SET, "k:__field:a__", "__field:c__"], expect_difference: true, expect: {exit: {
          equals: 0}}}
    - {tool: valkey-benchmark, args: [-q, -n, 10, -c, 1, -p, "$port", --dataset, capped.csv,
        --maxdocs, 2, SET, "k:__field:k__", "__field:v__"], expect_difference: true,
      expect: {exit: {equals: 0}}}
required_evidence:
- {evidence_id: valkey.tool.runs, source: bench}
