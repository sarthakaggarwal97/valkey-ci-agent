extends: [valkey.liveness]
id: proposed.hrandfield-ht-subtract
deployment:
  modes: [standalone]
metadata:
  description: HRANDFIELD with a positive count on a hashtable-encoded hash drives
    CASE 3, which builds a temporary dict with a stack hashTypeIterator and then subtracts
    random elements.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    count: {type: integer, default: 10}
components:
- use: valkey.action.commands
  id: hrand
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    server_config: {hash-max-listpack-entries: 8, hash-max-listpack-value: 64}
    timeout_s: 15
    commands:
    - {command: [HSET, h, f0, v0, f1, v1, f2, v2, f3, v3, f4, v4, f5, v5, f6, v6,
        f7, v7, f8, v8, f9, v9, f10, v10, f11, v11, f12, v12, f13, v13, f14, v14,
        f15, v15, f16, v16, f17, v17, f18, v18, f19, v19], expect: {equals: 20}}
    - {command: [OBJECT, ENCODING, h], compare: skip, expect: {equals: hashtable}}
    - {command: [HRANDFIELD, h, {$ref: inputs.count}], compare: skip, expect: {exists: true}}
    - {command: [HRANDFIELD, h, {$ref: inputs.count}, WITHVALUES], compare: skip,
      expect: {exists: true}}
    - {command: [HLEN, h], expect: {equals: 20}}
    - {command: [HGETALL, h], compare: unordered-pairs, expect: {exists: true}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [hrand.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: hrand}
