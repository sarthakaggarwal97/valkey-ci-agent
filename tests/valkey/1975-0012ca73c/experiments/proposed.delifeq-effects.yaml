extends: [valkey.liveness]
id: proposed.delifeq-effects
deployment:
  modes: [standalone]
metadata:
  description: A DELIFEQ delete must replicate to a replica, break a WATCH, fire the
    del keyspace event, and be refused on a read-only replica
components:
- use: valkey.action.commands
  id: effects
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    server_config: {notify-keyspace-events: "KEg"}
    timeout_s: 90
    commands:
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [SET, k, repltest], expect: {equals: OK}}
    - {command: [EXISTS, k], node: 1, wait_s: 10, expect: {equals: 1}}
    - {command: [DELIFEQ, k, repltest], node: 1, expect_difference: true, expect: {
        error: "READONLY"}}
    - {command: [SUBSCRIBE, "__keyevent@0__:del"], connection: sub, expect: {contains: subscribe}}
    - {command: [SET, notikey, nval], expect: {equals: OK}}
    - {command: [DELIFEQ, k, repltest], expect_difference: true, expect: {equals: 1}}
    - {command: [DELIFEQ, notikey, nval], expect_difference: true, expect: {equals: 1}}
    - {command: [EXISTS, k], expect_difference: true, expect: {equals: 0}}
    - {command: [EXISTS, k], node: 1, wait_s: 8, expect: {equals: 0}}
    - {connection: sub, read: true, expect: {contains: notikey}}
    - {command: [SET, w, watched], expect: {equals: OK}}
    - {command: [WATCH, w], expect: {equals: OK}}
    - {command: [DELIFEQ, w, watched], connection: other, expect_difference: true,
      expect: {equals: 1}}
    - {command: [MULTI], expect: {equals: OK}}
    - {command: [GET, w], expect: {equals: QUEUED}}
    - {command: [EXEC], expect_difference: true, expect: {exists: false}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [effects.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: effects}
