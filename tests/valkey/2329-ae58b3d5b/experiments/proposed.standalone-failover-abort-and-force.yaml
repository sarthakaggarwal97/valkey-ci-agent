extends: [valkey.liveness]
id: proposed.standalone-failover-abort-and-force
deployment:
  modes: [standalone]
metadata:
  description: >-
    An aborted FAILOVER (timeout, no force) leaves blocked clients blocked via clearFailoverState(false);
    a forced FAILOVER after timeout enters FAILOVER_IN_PROGRESS through updateFailoverStatus's
    force path with disconnect_blocked=false, and a stream-blocked redirect-capable
    client is redirected only when the failover completes (parent kills it with -UNBLOCKED).
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: failover-paths
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    nodes: 2
    timeout_s: 20
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 60, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [CLIENT, CAPA, REDIRECT], node: 0, connection: xr, expect: {equals: OK}}
    - {raw: "XREAD BLOCK 0 STREAMS st 0-0\r\n", node: 0, connection: xr}
    - {command: [CLIENT, CAPA, REDIRECT], node: 0, connection: bl, expect: {equals: OK}}
    - {raw: "BLPOP bk 0\r\n", node: 0, connection: bl}
    - {command: [INFO, clients], node: 0, wait_s: 10, expect: {contains: "blocked_clients:2"},
      compare: skip}
    - {raw: "DEBUG SLEEP 4\r\n", node: 1, connection: sleeper}
    - {command: [INFO, replication], node: 0, wait_s: 15, expect: {contains: "lag=2"},
      compare: skip}
    - {command: [SET, k, v1], node: 0, expect: {equals: OK}}
    - {command: [FAILOVER, TO, "<node.1.host>", "<node.1.port>", TIMEOUT, 400], node: 0,
      expect: {equals: OK}}
    - {command: [INFO, replication], node: 0, wait_s: 30, expect: {contains: "master_failover_state:no-failover"},
      compare: skip}
    - {command: [INFO, replication], node: 0, wait_s: 10, expect: {contains: "role:master"},
      compare: skip}
    - {command: [LPUSH, bk, hello], node: 0, expect: {equals: 1}}
    - {read: true, node: 0, connection: bl, expect: {contains: hello}}
    - {command: [INFO, replication], node: 0, wait_s: 30, expect: {contains: "lag=0"},
      compare: skip}
    - {raw: "DEBUG SLEEP 4\r\n", node: 1, connection: sleeper}
    - {command: [INFO, replication], node: 0, wait_s: 15, expect: {contains: "lag=2"},
      compare: skip}
    - {command: [SET, k, v2], node: 0, expect: {equals: OK}}
    - {command: [FAILOVER, TO, "<node.1.host>", "<node.1.port>", FORCE, TIMEOUT, 400],
      node: 0, expect: {equals: OK}}
    - {command: [INFO, replication], node: 0, wait_s: 60, expect: {contains: "master_failover_state:no-failover"},
      compare: skip}
    - {command: [INFO, replication], node: 0, wait_s: 60, expect: {contains: "role:slave"},
      compare: skip}
    - {read: true, node: 0, connection: xr, expect_difference: true, expect: {contains: REDIRECT}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [failover-paths.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: failover-paths}
