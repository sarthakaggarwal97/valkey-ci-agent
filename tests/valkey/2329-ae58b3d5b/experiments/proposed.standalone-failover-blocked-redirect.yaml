extends: [valkey.liveness]
id: proposed.standalone-failover-blocked-redirect
deployment:
  modes: [standalone]
metadata:
  description: After a standalone FAILOVER or REPLICAOF demotes the primary, a capa-redirect
    client blocked on keys gets -REDIRECT to the new primary, a readonly client blocked
    on a read stays blocked and is served by replication, and others get -UNBLOCKED;
    the parent disconnects them all with -UNBLOCKED
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: failover
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 15
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [CLIENT, CAPA, REDIRECT], node: 0, connection: blk-redirect, expect: {
        equals: OK}}
    - {raw: "BLPOP mylist 0\r\n", node: 0, connection: blk-redirect}
    - {raw: "BRPOP otherlist 0\r\n", node: 0, connection: blk-plain}
    - {command: [CLIENT, CAPA, REDIRECT], node: 0, connection: blk-ro, expect: {equals: OK}}
    - {command: [READONLY], node: 0, connection: blk-ro, expect: {equals: OK}}
    - {raw: "XREAD BLOCK 0 STREAMS mystream 0-0\r\n", node: 0, connection: blk-ro}
    - {command: [INFO, clients], node: 0, wait_s: 10, expect: {contains: "blocked_clients:3"},
      compare: skip}
    - {command: [FAILOVER, TO, "<node.1.host>", "<node.1.port>"], node: 0, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 0, wait_s: 30, expect: {contains: "master_failover_state:no-failover"},
      compare: skip}
    - {command: [INFO, replication], node: 0, wait_s: 30, expect: {contains: "role:slave"},
      compare: skip}
    - {read: true, node: 0, connection: blk-redirect, expect_difference: true, expect: {
        contains: "REDIRECT"}}
    - {read: true, node: 0, connection: blk-plain, compare: skip, expect: {contains: "UNBLOCKED"}}
    - {read: true, node: 0, connection: blk-ro, expect_difference: true, expect: {
        equals: []}}
    - {command: [XADD, mystream, "1-1", f, v], node: 1, expect: {equals: "1-1"}}
    - {command: [WAIT, 1, 5000], node: 1, expect: {min: 1}}
    - {read: true, node: 0, connection: blk-ro, expect_difference: true, expect: {
        contains: mystream}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
- use: valkey.action.commands
  id: replicaof
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 15
    commands:
    - {command: [CLIENT, CAPA, REDIRECT], node: 0, connection: blk-redirect, expect: {
        equals: OK}}
    - {raw: "BLPOP mylist 0\r\n", node: 0, connection: blk-redirect}
    - {command: [CLIENT, CAPA, REDIRECT], node: 0, connection: blk-ro, expect: {equals: OK}}
    - {command: [READONLY], node: 0, connection: blk-ro, expect: {equals: OK}}
    - {raw: "XREAD BLOCK 0 STREAMS mystream 0-0\r\n", node: 0, connection: blk-ro}
    - {command: [INFO, clients], node: 0, wait_s: 10, expect: {contains: "blocked_clients:2"},
      compare: skip}
    - {command: [REPLICAOF, "<node.1.host>", "<node.1.port>"], node: 0, expect: {
        equals: OK}}
    - {read: true, node: 0, connection: blk-redirect, expect_difference: true, expect: {
        contains: "REDIRECT"}}
    - {read: true, node: 0, connection: blk-ro, expect_difference: true, expect: {
        equals: []}}
    - {command: [INFO, replication], node: 0, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [XADD, mystream, "1-1", f, v], node: 1, expect: {equals: "1-1"}}
    - {command: [WAIT, 1, 5000], node: 1, expect: {min: 1}}
    - {read: true, node: 0, connection: blk-ro, expect_difference: true, expect: {
        contains: mystream}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [failover.completed, replicaof.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: failover}
- {evidence_id: valkey.command.sequence, source: replicaof}
