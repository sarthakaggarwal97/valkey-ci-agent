extends: [valkey.liveness]
id: proposed.stream-trim-maxlen-split
deployment:
  modes: [standalone]
metadata:
  description: XTRIM across several listpack nodes removes whole front nodes and marks
    entries deleted inside a surviving node, with a tombstone present
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: seq
  config:
    resp: {$ref: inputs.resp}
    timeout_s: 20
    commands:
    - {command: [CONFIG, SET, stream-node-max-entries, "2"], expect: {equals: OK}}
    - {command: [DEL, s], expect: {min: 0}}
    - {command: [XADD, s, 1-0, f, v], expect: {equals: "1-0"}}
    - {command: [XADD, s, 2-0, f, v], expect: {equals: "2-0"}}
    - {command: [XADD, s, 3-0, f, v], expect: {equals: "3-0"}}
    - {command: [XADD, s, 4-0, f, v], expect: {equals: "4-0"}}
    - {command: [XADD, s, 5-0, f, v], expect: {equals: "5-0"}}
    - {command: [XADD, s, 6-0, f, v], expect: {equals: "6-0"}}
    - {command: [XTRIM, s, MINID, "=", 4-0], expect: {equals: 3}}
    - {command: [XLEN, s], expect: {equals: 3}}
    - {command: [XRANGE, s, "-", "+"], expect: {equals: [["4-0", [f, v]], ["5-0",
            [f, v]], ["6-0", [f, v]]]}}
    - {command: [DEL, s], expect: {equals: 1}}
    - {command: [XADD, s, 10-0, f, v], expect: {equals: "10-0"}}
    - {command: [XADD, s, 11-0, f, v], expect: {equals: "11-0"}}
    - {command: [XADD, s, 12-0, f, v], expect: {equals: "12-0"}}
    - {command: [XADD, s, 13-0, f, v], expect: {equals: "13-0"}}
    - {command: [XADD, s, 14-0, f, v], expect: {equals: "14-0"}}
    - {command: [XADD, s, 15-0, f, v], expect: {equals: "15-0"}}
    - {command: [XDEL, s, 11-0], expect: {equals: 1}}
    - {command: [XTRIM, s, MAXLEN, "3"], expect: {equals: 2}}
    - {command: [XLEN, s], expect: {equals: 3}}
    - {command: [XRANGE, s, "-", "+"], expect: {equals: [["13-0", [f, v]], ["14-0",
            [f, v]], ["15-0", [f, v]]]}}
required_events: [seq.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: seq}
