extends: [valkey.liveness]
id: proposed.migrateslots-to-self
deployment:
  modes: [standalone]
metadata:
  description: CLUSTER MIGRATESLOTS rejects the node itself as target and rewords
    the non-owner error; a valid migration still completes
inputs:
  required: [parent]
  properties:
    parent:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "The parent commit's build, {$ref: artifacts.parent.binary}"
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: migrate
  config:
    compare_with: {$ref: inputs.parent}
    cluster: true
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - {command: [SET, foo, bar], node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 0, 50, NODE, "<node.0.id>"], node: 0,
      expect_difference: true, expect: {error: "Target node can not be this node"}}
    - {command: [PING], node: 0, expect: {equals: PONG}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 300, 310, NODE, "<node.0.id>"],
      node: 1, expect_difference: true, expect: {error: "Slots are not served by this\
          \ node"}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 12182, 12182, NODE, "<node.1.id>"],
      node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, COUNTKEYSINSLOT, 12182], node: 1, wait_s: 30, expect: {
        equals: 1}}
    - {command: [GET, foo], node: 1, wait_s: 30, expect: {equals: bar}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 100, 110, NODE, "<node.1.id>",
        SLOTSRANGE, 200, 210, NODE, "<node.0.id>"], node: 0, expect_difference: true,
      expect: {error: "Target node can not be this node"}}
    - {command: [PING], node: 0, expect: {equals: PONG}}
    - {command: [PING], node: 1, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [migrate.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: migrate}
