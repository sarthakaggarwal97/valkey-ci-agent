extends: [valkey.liveness]
id: proposed.failover-redirect-postpone-compare
deployment:
  modes: [standalone]
metadata:
  description: A CLIENT CAPA REDIRECT write during FAILOVER_IN_PROGRESS is parked
    instead of bounced with -REDIRECT, and resumes correctly after the failover aborts
    or completes
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: failover-redirect
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 15
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [INFO, replication], node: 0, wait_s: 30, expect: {contains: "state=online"},
      compare: skip}
    - {command: [SET, foo, bar], node: 0, expect: {equals: OK}}
    - {raw: "DEBUG SLEEP 6\r\n", connection: sleeper, node: 1}
    - {command: [SET, stale, "1"], node: 0, expect: {equals: OK}}
    - {command: [FAILOVER, TO, "<node.1.host>", "<node.1.port>", TIMEOUT, 100, FORCE],
      node: 0, expect: {equals: OK}}
    - {command: [INFO, replication], node: 0, wait_s: 10, expect: {contains: "master_failover_state:failover-in-progress"},
      compare: skip}
    - {command: [CLIENT, CAPA, REDIRECT], node: 0, connection: redir, expect: {equals: OK}}
    - {raw: "SET foo bar2\r\n", node: 0, connection: redir, expect_difference: true,
      expect: {exists: false}}
    - {command: [FAILOVER, ABORT], node: 0, expect: {equals: OK}}
    - {command: [GET, foo], node: 0, wait_s: 5, expect: {equals: bar2}, expect_difference: true}
    - {read: true, node: 0, connection: redir, expect_difference: true, expect: {
        equals: [OK]}}
    - {command: [INFO, replication], node: 0, wait_s: 30, expect: {contains: "role:master"},
      compare: skip}
    - {command: [INFO, replication], node: 0, wait_s: 30, expect: {contains: "state=online"},
      compare: skip}
    - {raw: "DEBUG SLEEP 6\r\n", connection: sleeper2, node: 1}
    - {command: [SET, phase2, "1"], node: 0, expect: {equals: OK}}
    - {command: [FAILOVER, TO, "<node.1.host>", "<node.1.port>", TIMEOUT, 100, FORCE],
      node: 0, expect: {equals: OK}}
    - {command: [INFO, replication], node: 0, wait_s: 10, expect: {contains: "master_failover_state:failover-in-progress"},
      compare: skip}
    - {command: [CLIENT, CAPA, REDIRECT], node: 0, connection: redir2, expect: {equals: OK}}
    - {raw: "SET phase2 2\r\n", node: 0, connection: redir2, expect_difference: true,
      expect: {exists: false}}
    - {command: [INFO, replication], node: 0, wait_s: 30, expect: {contains: "master_failover_state:no-failover"},
      compare: skip}
    - {command: [INFO, replication], node: 0, wait_s: 30, expect: {contains: "role:slave"},
      compare: skip}
    - {read: true, node: 0, connection: redir2, compare: skip}
    - {command: [PING], node: 0, expect: {equals: PONG}}
    - {command: [PING], node: 1, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [failover-redirect.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: failover-redirect}
