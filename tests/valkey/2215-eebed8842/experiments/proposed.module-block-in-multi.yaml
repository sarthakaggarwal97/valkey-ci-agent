extends: [valkey.liveness]
id: proposed.module-block-in-multi
deployment:
  modes: [standalone]
metadata:
  description: BLOCK.DEBUG inside MULTI/EXEC - parent returns NULL from BlockClient
    and crashes on the privdata deref; the change replies with an error
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: blockmulti
  config:
    compare_with: {$ref: artifacts.parent.binary}
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 10
    commands:
    - {command: [MULTI], expect: {equals: OK}}
    - {command: [block.debug, "0", "0"], expect: {equals: QUEUED}}
    - {command: [EXEC], expect_difference: true, expect: {exists: true}}
    - {command: [PING], expect_difference: true, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      variants: true
required_evidence:
- {evidence_id: valkey.command.sequence, source: blockmulti}
