extends: [valkey.liveness]
id: proposed.module-block-in-lua
deployment:
  modes: [standalone]
metadata:
  description: BLOCK.DEBUG inside a Lua script - parent returns NULL from BlockClient
    and crashes on the privdata deref; the change raises a Lua error
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: blocklua
  config:
    compare_with: {$ref: artifacts.parent.binary}
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 10
    commands:
    - {command: [EVAL, "return redis.call('block.debug', '0', '0')", "0"], expect_difference: true,
      expect: {error: "Blocking module command"}}
    - {command: [PING], expect_difference: true, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      variants: true
required_evidence:
- {evidence_id: valkey.command.sequence, source: blocklua}
