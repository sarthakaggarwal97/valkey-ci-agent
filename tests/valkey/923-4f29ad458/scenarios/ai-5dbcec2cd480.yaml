scenario_id: ai-5dbcec2cd480
seed: 103
experiment:
  id: valkey.replication-chaos
  inputs:
    mutation_rate: 800
    mutable_keys: 500
    stable_keys: 2000
    value_size: 40
    command_rate: 300
    waves:
