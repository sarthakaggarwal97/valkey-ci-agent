extends: [valkey.liveness]
id: proposed.check-rdb-stats-empty-highest-db
deployment:
  modes: [standalone]
metadata:
  description: valkey-check-rdb --stats sizes its per-DB stats array for every selected
    DB, even when the highest selected DB has no keys
inputs:
  required: [parent]
  properties:
    parent:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "The parent commit's build, {$ref: artifacts.parent.binary}"
components:
- use: valkey.action.tools
  id: check-rdb
  config:
    compare_with: {$ref: inputs.parent}
    files:
      empty-db2.rdb: !!binary 'UkVESVMwMDA5/gL/AAAAAAAAAAA='
      data-then-empty-db3.rdb: !!binary 'UkVESVMwMDA5/gAAAWsBdv4D/wAAAAAAAAAA'
    ignore: ['^\d+:[A-Z] .*\n']
    runs:
    - {tool: valkey-check-rdb, args: [empty-db2.rdb], expect: {stdout: {contains: RDB
            looks OK}}}
    - {tool: valkey-check-rdb, args: [empty-db2.rdb, --stats, --format, info], expect_difference: true,
      expect: {exit: {equals: 0}, stdout: {contains: "db.2.type.string.keys.total:0"}}}
    - {tool: valkey-check-rdb, args: [data-then-empty-db3.rdb, --stats, --format,
        info], expect_difference: true, expect: {exit: {equals: 0}, stdout: {contains: "db.3.type.string.keys.total:0"}}}
    - {tool: valkey-check-rdb, args: [data-then-empty-db3.rdb, --stats, --format,
        table], expect_difference: true, expect: {exit: {equals: 0}, stdout: {contains: "db.3"}}}
required_evidence:
- {evidence_id: valkey.tool.runs, source: check-rdb}
