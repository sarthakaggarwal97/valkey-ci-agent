extends: [valkey.liveness]
id: proposed.acl-load-replica-no-user
deployment:
  modes: [standalone]
metadata:
  description: ACL LOAD on a replica must not crash on the userless primary-link client
inputs:
  required: [parent]
  properties:
    parent:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "The parent commit's build, {$ref: artifacts.parent.binary}"
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: aclload
  config:
    compare_with: {$ref: inputs.parent}
    resp: {$ref: inputs.resp}
    nodes: 2
    timeout_s: 30
    server_config: {aclfile: users.acl}
    files:
      users.acl: "user default on nopass ~* &* +@all\n"
    commands:
    - {command: [ACL, WHOAMI], node: 0, expect: {equals: default}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [SUBSCRIBE, ch], node: 1, connection: sub, expect: {contains: subscribe}}
    - {command: [ACL, LOAD], node: 1, expect_difference: true, expect: {equals: OK}}
    - {command: [PING], node: 1, expect_difference: true, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_evidence:
- {evidence_id: valkey.command.sequence, source: aclload}
