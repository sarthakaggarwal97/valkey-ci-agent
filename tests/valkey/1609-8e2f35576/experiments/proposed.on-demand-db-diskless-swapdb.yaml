extends: [valkey.liveness]
id: proposed.on-demand-db-diskless-swapdb
deployment:
  modes: [standalone]
metadata:
  description: Diskless full sync with repl-diskless-load swapdb where primary and
    replica hold keys in different sparse DBs, so swapMainDbWithTempDb reconciles
    NULL tempDb and main DB slots; compared with the parent build
inputs:
  properties:
    dual_channel: {type: string, enum: ["yes", "no"], default: "no"}
components:
- use: valkey.action.commands
  id: swapsync
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 120
    server_config:
      repl-diskless-sync: "yes"
      repl-diskless-sync-delay: 0
      repl-diskless-load: swapdb
      dual-channel-replication-enabled: {$ref: inputs.dual_channel}
    commands:
    - {command: [SET, base, b0], node: 0, expect: {equals: OK}}
    - {command: [SELECT, 3], node: 0, expect: {equals: OK}}
    - {command: [MSET, a, 1, b, 2], node: 0, expect: {equals: OK}}
    - {command: [SELECT, 9], node: 0, expect: {equals: OK}}
    - {command: [SET, s9, v9], node: 0, expect: {equals: OK}}
    - {command: [SELECT, 5], node: 1, expect: {equals: OK}}
    - {command: [SET, junk, j1], node: 1, expect: {equals: OK}}
    - {command: [SELECT, 0], node: 1, expect: {equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, compare: skip, wait_s: 60, expect: {
        contains: "master_link_status:up"}}
    - {command: [GET, base], node: 1, expect: {equals: b0}}
    - {command: [SELECT, 3], node: 1, expect: {equals: OK}}
    - {command: [GET, a], node: 1, expect: {equals: "1"}}
    - {command: [SELECT, 9], node: 1, expect: {equals: OK}}
    - {command: [GET, s9], node: 1, expect: {equals: v9}}
    - {command: [SELECT, 5], node: 1, expect: {equals: OK}}
    - {command: [GET, junk], node: 1}
    - {command: [DBSIZE], node: 1, expect: {equals: 0}}
    - {command: [REPLICAOF, NO, ONE], node: 1, expect: {equals: OK}}
    - {command: [SELECT, 2], node: 1, expect: {equals: OK}}
    - {command: [SET, only2, x], node: 1, expect: {equals: OK}}
    - {command: [SELECT, 12], node: 1, expect: {equals: OK}}
    - {command: [SET, only12, y], node: 1, expect: {equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, compare: skip, wait_s: 60, expect: {
        contains: "master_link_status:up"}}
    - {command: [SELECT, 2], node: 1, expect: {equals: OK}}
    - {command: [GET, only2], node: 1}
    - {command: [SELECT, 12], node: 1, expect: {equals: OK}}
    - {command: [GET, only12], node: 1}
    - {command: [SELECT, 3], node: 1, expect: {equals: OK}}
    - {command: [GET, b], node: 1, expect: {equals: "2"}}
    - {command: [SELECT, 0], node: 1, expect: {equals: OK}}
    - {command: [GET, base], node: 1, expect: {equals: b0}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [swapsync.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: swapsync}
