extends: [valkey.liveness]
id: proposed.on-demand-db-replica-expire
deployment:
  modes: [standalone]
metadata:
  description: a writable replica sets keys with short TTLs in a high on-demand database
    and expireReplicaKeys reclaims them
components:
- use: valkey.action.commands
  id: repexp
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 120
    commands:
    - {command: [SET, seed, v], node: 0, expect: {equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [CONFIG, SET, replica-read-only, no], node: 1, expect: {equals: OK}}
    - {command: [SELECT, 4], node: 1, expect: {equals: OK}}
    - {command: [SET, replonly1, tmp, PX, 300], node: 1, expect: {equals: OK}}
    - {command: [SET, replonly2, tmp, PX, 300], node: 1, expect: {equals: OK}}
    - {command: [SET, replonly3, tmp, PX, 300], node: 1, expect: {equals: OK}}
    - {command: [DBSIZE], node: 1, wait_s: 30, expect: {equals: 0}}
    - {command: [SELECT, 0], node: 1, expect: {equals: OK}}
    - {command: [GET, seed], node: 1, wait_s: 15, expect: {equals: v}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [repexp.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repexp}
