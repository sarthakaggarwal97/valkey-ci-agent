extends: [valkey.liveness]
id: proposed.debug-dict-resizing
deployment:
  modes: [standalone]
metadata:
  description: DEBUG DICT-RESIZING 0 blocks main-dict expand under inserts and shrink
    under deletes; 1 re-enables and the cron resize catches up. Parent answers a syntax
    error to the new subcommand and resizes normally.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: seq
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server_config: {enable-debug-command: "yes", save: ""}
    resp: {$ref: inputs.resp}
    timeout_s: 180
    commands:
    - {command: [DEBUG, DICT-RESIZING], expect: {error: true}}
    - {command: [DEBUG, DICT-RESIZING, 0, extra], expect: {error: true}}
    - {command: [DEBUG, DICT-RESIZING, 0], expect_difference: true, expect: {equals: OK}}
    - {command: [DEBUG, POPULATE, 100], expect: {equals: OK}}
    - {command: [DBSIZE], expect: {equals: 100}}
    - {command: [DEBUG, HTSTATS, 0], expect_difference: true, expect: {contains: " table\
          \ size: 4\n"}}
    - {command: [GET, 'key:42'], expect: {equals: 'value:42'}}
    - {command: [DEBUG, DICT-RESIZING, 1], expect_difference: true, expect: {equals: OK}}
    - {command: [DEBUG, HTSTATS, 0], wait_s: 60, compare: skip, expect: {contains: " table\
          \ size: 128"}}
    - {command: [DEBUG, DICT-RESIZING, 0], expect_difference: true, expect: {equals: OK}}
    - {command: [DEL, 'key:0', 'key:1', 'key:2', 'key:3', 'key:4', 'key:5', 'key:6',
        'key:7', 'key:8', 'key:9', 'key:10', 'key:11', 'key:12', 'key:13', 'key:14',
        'key:15', 'key:16', 'key:17', 'key:18', 'key:19', 'key:20', 'key:21', 'key:22',
        'key:23', 'key:24', 'key:25', 'key:26', 'key:27', 'key:28', 'key:29', 'key:30',
        'key:31', 'key:32', 'key:33', 'key:34', 'key:35', 'key:36', 'key:37', 'key:38',
        'key:39', 'key:40', 'key:41', 'key:42', 'key:43', 'key:44', 'key:45', 'key:46',
        'key:47', 'key:48', 'key:49', 'key:50', 'key:51', 'key:52', 'key:53', 'key:54',
        'key:55', 'key:56', 'key:57', 'key:58', 'key:59', 'key:60', 'key:61', 'key:62',
        'key:63', 'key:64', 'key:65', 'key:66', 'key:67', 'key:68', 'key:69', 'key:70',
        'key:71', 'key:72', 'key:73', 'key:74', 'key:75', 'key:76', 'key:77', 'key:78',
        'key:79', 'key:80', 'key:81', 'key:82', 'key:83', 'key:84', 'key:85', 'key:86',
        'key:87', 'key:88', 'key:89', 'key:90', 'key:91', 'key:92', 'key:93', 'key:94'],
      expect: {equals: 95}}
    - {command: [SET, waiter, x, PX, 2500], expect: {equals: OK}}
    - {command: [EXISTS, waiter], wait_s: 30, expect: {equals: 0}}
    - {command: [DEBUG, HTSTATS, 0], expect_difference: true, expect: {contains: " table\
          \ size: 128"}}
    - {command: [DBSIZE], expect: {equals: 5}}
    - {command: [DEBUG, DICT-RESIZING, 1], expect_difference: true, expect: {equals: OK}}
    - {command: [DEBUG, HTSTATS, 0], wait_s: 60, compare: skip, expect: {contains: " table\
          \ size: 8"}}
    - {command: [KEYS, '*'], compare: unordered}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [seq.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: seq}
