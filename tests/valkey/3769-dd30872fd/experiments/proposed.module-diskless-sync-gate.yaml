extends: [valkey.liveness]
id: proposed.module-diskless-sync-gate
deployment:
  modes: [standalone]
metadata:
  description: Full resync with repl-diskless-load swapdb and a module datatype loaded,
    so useDisklessLoad walks moduleAllDatatypesHandleErrors and moduleAllModulesHandleReplAsyncLoad
    over the new modules list
components:
- use: valkey.action.commands
  id: sync
  config:
    compare_with: {$ref: artifacts.parent.binary}
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    nodes: 2
    server_config:
      repl-diskless-sync: "yes"
      repl-diskless-sync-delay: 0
      repl-diskless-load: swapdb
    timeout_s: 20
    commands:
    - {command: [datatype.set, m1, 7, seven], node: 0, expect: {equals: OK}}
    - {command: [datatype.set, m2, 42, answer], node: 0, expect: {equals: OK}}
    - {command: [SET, s1, v1], node: 0, expect: {equals: OK}}
    - {command: [SET, s2, v2], node: 0, expect: {equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 60, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [datatype.get, m1], node: 1, expect: {equals: [7, seven]}}
    - {command: [datatype.get, m2], node: 1, expect: {equals: [42, answer]}}
    - {command: [GET, s1], node: 1, expect: {equals: v1}}
    - {command: [TYPE, m1], node: 1, expect: {equals: test___dt}}
    checks:
      acl: true
      compat: true
      variants: true
required_events: [sync.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: sync}
