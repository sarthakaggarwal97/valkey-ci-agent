extends: [valkey.liveness]
id: proposed.geosearch-option-error-leaks
deployment:
  modes: [standalone]
metadata:
  description: GEOSEARCH option-parsing error paths free the polygon allocation and
    leave the server clean
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: geo
  config:
    resp: {$ref: inputs.resp}
    timeout_s: 10
    commands:
    - {command: [GEOADD, pts, "151.2093", "-33.8688", Sydney], expect: {equals: 1}}
    - {command: [GEOSEARCH, pts, FROMMEMBER, nosuchmember, BYRADIUS, "1", km], expect: {
        error: true}}
    - {command: [GEOSEARCH, pts, FROMLONLAT, notanumber, "1", BYRADIUS, "1", km],
      expect: {error: true}}
    - {command: [GEOSEARCH, pts, FROMLONLAT, "1", "1", BYRADIUS, notanumber, km],
      expect: {error: true}}
    - {command: [GEOSEARCH, pts, FROMLONLAT, "1", "1", BYBOX, notanumber, "1", km],
      expect: {error: true}}
    - {command: [GEOSEARCH, pts, BYPOLYGON, notanumber, "1", "1", "1", "1", "1", "1"],
      expect: {error: "invalid number of vertices"}}
    - {command: [GEOSEARCH, pts, BYPOLYGON, "2", "1", "1", "1", "1"], expect: {error: "at\
          \ least 3 vertices"}}
    - {command: [GEOSEARCH, pts, BYPOLYGON, "3", notanumber, "1", "1", "1", "1", "1"],
      expect: {error: true}}
    - {command: [GEOSEARCH, pts, BYPOLYGON, "4", "151.1", "-33.8", "151.2", "-33.9",
        "151.3", "-33.7", "151.4", notanumber], expect: {error: true}}
    - {command: [GEOSEARCH, pts, FROMLONLAT, "151.2", "-33.8", BYRADIUS, "100", km],
      expect: {equals: [Sydney]}}
required_evidence:
- {evidence_id: valkey.command.sequence, source: geo}
