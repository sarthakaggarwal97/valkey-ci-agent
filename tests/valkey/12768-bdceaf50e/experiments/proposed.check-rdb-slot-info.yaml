extends: [valkey.liveness]
id: proposed.check-rdb-slot-info
deployment:
  modes: [standalone, cluster]
metadata:
  description: valkey-check-rdb parses a cluster-mode RDB containing RDB_OPCODE_SLOT_INFO
    (slot id, key-dict size, and expires-dict size) without misaligning on the third
    length
components:
- use: valkey.action.tools
  id: checkrdb
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server: true
    cluster: true
    ignore: ['^\d+:[A-Z] .*\n', '^\[offset \d+\] .*\n']
    timeout_s: 60
    runs:
    - {tool: valkey-cli, args: [-p, $port, SET, k1, v1], expect: {stdout: {equals: "OK\n"}}}
    - {tool: valkey-cli, args: [-p, $port, SET, k2, v2], expect: {stdout: {equals: "OK\n"}}}
    - {tool: valkey-cli, args: [-p, $port, SET, k3, v3], expect: {stdout: {equals: "OK\n"}}}
    - {tool: valkey-cli, args: [-p, $port, SET, exp1, v, EX, 1000], expect: {stdout: {
          equals: "OK\n"}}}
    - {tool: valkey-cli, args: [-p, $port, SET, exp2, v, EX, 2000], expect: {stdout: {
          equals: "OK\n"}}}
    - {tool: valkey-cli, args: [-p, $port, SAVE], expect: {stdout: {equals: "OK\n"}}}
    - {tool: valkey-check-rdb, args: [dump.rdb], expect_difference: true, expect: {
        exit: {equals: 0}, stdout: {contains: "RDB looks OK"}}}
    - {tool: valkey-check-rdb, args: [dump.rdb, --stats, --format, info], expect_difference: true,
      expect: {exit: {equals: 0}}}
required_evidence:
- {evidence_id: valkey.tool.runs, source: checkrdb}
