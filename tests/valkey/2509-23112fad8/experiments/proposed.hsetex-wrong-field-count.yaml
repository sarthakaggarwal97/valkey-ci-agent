extends: [valkey.liveness]
id: proposed.hsetex-wrong-field-count
deployment:
  modes: [standalone]
metadata:
  description: HSETEX with a field count that truncating division accepted must be
    rejected, not run out of bounds
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: hsetex
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    timeout_s: 10
    commands:
    - {command: [HSETEX, h1, FIELDS, "1", a, b, c], expect_difference: true, expect: {
        error: "numfields should be greater than 0 and match the provided number of\
          \ fields"}}
    - {command: [HLEN, h1], expect_difference: true, expect: {equals: 0}}
    - {command: [EXISTS, h1], expect_difference: true, expect: {equals: 0}}
    - {command: [HSETEX, h2, FIELDS, "2", a, b, c, d, e], expect_difference: true,
      expect: {error: "numfields should be greater than 0 and match the provided number\
          \ of fields"}}
    - {command: [HLEN, h2], expect_difference: true, expect: {equals: 0}}
    - {command: [HSETEX, myhash, PX, "100", FIELDS, "1", field1, val1, extra], expect_difference: true,
      expect: {error: "numfields should be greater than 0 and match the provided number\
          \ of fields"}}
    - {command: [HLEN, myhash], expect_difference: true, expect: {equals: 0}}
    - {command: [HSETEX, h3, FIELDS, "2", a, "1", b, "2"], expect: {equals: 1}}
    - {command: [HLEN, h3], expect: {equals: 2}}
    - {command: [HGET, h3, a], expect: {equals: "1"}}
    - {command: [HGET, h3, b], expect: {equals: "2"}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_evidence:
- {evidence_id: valkey.command.sequence, source: hsetex}
