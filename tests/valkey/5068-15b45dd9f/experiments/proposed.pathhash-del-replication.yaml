extends: [valkey.liveness]
id: proposed.pathhash-del-replication
deployment:
  modes: [standalone]
metadata:
  description: Final PHDEL/PHDELPREFIX propagate so the replica deletes the key and
    its TTL too
components:
- use: valkey.action.commands
  id: repl
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 60
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, compare: skip, wait_s: 30, expect: {
        contains: "master_link_status:up"}}
    - {command: [PHSET, final, p, FIELDS, 1, f, v], expect: {equals: OK}}
    - {command: [PEXPIRE, final, 60000], expect: {equals: 1}}
    - {command: [PHDEL, final, p], expect: {equals: 1}}
    - {command: [WAIT, 1, 5000], expect: {equals: 1}}
    - {command: [EXISTS, final], node: 1, expect_difference: true, expect: {equals: 0}}
    - {command: [PTTL, final], node: 1, expect_difference: true, expect: {equals: -2}}
    - {command: [PHSET, final2, a, FIELDS, 1, f, v], expect: {equals: OK}}
    - {command: [PHSET, final2, ab, FIELDS, 1, f, w], expect: {equals: OK}}
    - {command: [PHDELPREFIX, final2, a], expect: {equals: 2}}
    - {command: [WAIT, 1, 5000], expect: {equals: 1}}
    - {command: [EXISTS, final2], node: 1, expect_difference: true, expect: {equals: 0}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
