extends: [valkey.liveness]
id: proposed.module-setexpire-overflow
deployment:
  modes: [standalone]
metadata:
  description: VM_SetExpire rejects a relative expire that overflows when the base
    time is added
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: modexp
  config:
    compare_with: {$ref: artifacts.parent.binary}
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 10
    commands:
    - {command: [SET, k, v], expect: {equals: OK}}
    - {command: [test.openkey_cross_slot, k, k, expire, 100000000], expect: {equals: OK}}
    - {command: [test.openkey_cross_slot, k, k, expire, 9223372036854775807], expect_difference: true,
      expect: {error: "SetExpire failed"}}
    - {command: [test.openkey_cross_slot, k, k, expire, 9223372036854770000], expect_difference: true,
      expect: {error: "SetExpire failed"}}
    checks:
      acl: true
      compat: true
      variants: true
required_evidence:
- {evidence_id: valkey.command.sequence, source: modexp}
