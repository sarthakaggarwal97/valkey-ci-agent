extends: [valkey.liveness]
id: proposed.commandresult-fresh-unsub-crash
deployment:
  modes: [standalone]
metadata:
  description: cmdresult.unsubscribe on a freshly loaded commandresult module must
    not leave NULL command-result listeners that crash the next command
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: unsub
  config:
    compare_with: {$ref: artifacts.parent.binary}
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 15
    commands:
    - {command: [cmdresult.unsubscribe], expect: {error: "not subscribed"}}
    - {command: [PING], expect_difference: true, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      variants: true
required_events: [unsub.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: unsub}
