extends: [valkey.liveness]
id: proposed.slot-export-fork-fail-pipe-reset
deployment:
  modes: [cluster]
metadata:
  description: A slot export whose snapshot fork fails under a held forkless BGSAVE
    must not leave pipe state behind, so the next export can run
inputs:
  required: [parent]
  properties:
    parent:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "The parent commit's build, {$ref: artifacts.parent.binary}"
components:
- use: valkey.action.commands
  id: export
  config:
    compare_with: {$ref: inputs.parent}
    cluster: true
    nodes: 2
    timeout_s: 120
    server_config:
      forkless-infrastructure-enabled: "yes"
      forkless-policy: prefer-forkless
      save: ""
      repl-diskless-sync: "yes"
      repl-diskless-sync-delay: "0"
    commands:
    - {command: [DEBUG, POPULATE, "100", fk, "10"], node: 0, expect: {equals: OK}}
    - {command: [CONFIG, SET, rdb-key-save-delay, "1000000"], node: 0, expect: {equals: OK}}
    - {command: [BGSAVE], node: 0, expect: {error: false}}
    - {command: [INFO, persistence], node: 0, compare: skip}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, "16383", "16383", NODE, "<node.1.id>"],
      node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], node: 0, wait_s: 60, compare: skip,
      expect: {contains: failed}}
    - {command: [CONFIG, SET, rdb-key-save-delay, "0"], node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, "16383", "16383", NODE, "<node.1.id>"],
      node: 0, expect_difference: true, expect: {equals: OK}}
    - {command: [CLUSTER, COUNTKEYSINSLOT, "16383"], node: 1, wait_s: 60, expect_difference: true,
      expect: {min: 1}}
    - {command: [PING], node: 0, expect_difference: true, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_evidence:
- {evidence_id: valkey.command.sequence, source: export}
