extends: [valkey.liveness]
id: proposed.script-select-replication
deployment:
  modes: [standalone]
metadata:
  description: A write made after an in-script SELECT replicates to the replica's
    matching database, not the caller's
components:
- use: valkey.action.commands
  id: repl
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 60
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [SET, testkey, db0_value], node: 0, expect: {equals: OK}}
    - {command: [EVAL, "local v = server.call('get', KEYS[1]) server.call('select',\
          \ '1') server.call('set', KEYS[1], 'db1_value') return server.call('get',\
          \ KEYS[1])", 1, testkey], node: 0, expect: {equals: db1_value}}
    - {command: [WAIT, 1, 10000], node: 0, expect: {equals: 1}}
    - {command: [GET, testkey], node: 0, expect_difference: true, expect: {equals: db0_value}}
    - {command: [GET, testkey], node: 1, expect_difference: true, expect: {equals: db0_value}}
    - {command: [SELECT, 1], node: 1, expect: {equals: OK}}
    - {command: [GET, testkey], node: 1, wait_s: 10, expect_difference: true, expect: {
        equals: db1_value}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
