scenario_id: ai-ec649f233953
seed: 505
experiment:
  id: valkey.replication-chaos
  inputs:
    mutation_rate: 500
    command_rate: 150
    stable_keys: 5000
    mutable_keys: 500
    value_size: 64
    waves:
    - - op: kill
        target: replica
        signal: SIGKILL
      - op: restart
        target: killed
        delay_s: 1.0
