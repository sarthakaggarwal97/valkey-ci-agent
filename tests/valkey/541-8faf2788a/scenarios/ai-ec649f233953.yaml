        target: replica
        mode: graceful
deployment:
  mode: standalone
  replicas_per_primary: 2
  base_port: 7400
  server_config:
    activedefrag: 'yes'
    active-defrag-ignore-bytes: '1'
    active-defrag-threshold-lower: '0'
    active-defrag-cycle-max: '75'
