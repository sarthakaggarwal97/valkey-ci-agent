id: proposed.hash-field-ttl-replication-fault
deployment:
  modes: [standalone]
  replicas_per_primary: {minimum: 1}
metadata:
  description: Kill a node while hashes with large vsets (two far windows, a short-TTL
    group and a 132-entry same-expiry bucket) replicate and expire; verify TTL metadata
    and field counts after recovery
