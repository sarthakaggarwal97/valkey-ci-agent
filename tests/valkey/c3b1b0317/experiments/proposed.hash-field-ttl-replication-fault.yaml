- use: valkey.fault.process-signal
  id: kill-node
  config:
    when_event: warm-up.completed
    instance: {$ref: inputs.instance}
    signal: SIGKILL
    restart: true
    restart_mode: immediate
- use: valkey.action.sleep
  id: warm-up
  depends_on: [writes, seed, kill-node]
  config: {seconds: 2}
- use: valkey.action.sleep
  id: settle
  depends_on: [warm-up]
  config: {seconds: 5}
- use: valkey.action.commands
  id: verify
  depends_on: [settle]
  config:
    timeout_s: 90
    commands:
    - {command: [HLEN, bighash], wait_s: 60, expect: {equals: 120}}
    - {command: [EXISTS, burst], wait_s: 60, expect: {equals: 0}}
    - {command: [HPEXPIRETIME, bighash, FIELDS, 2, b1, b61], expect: {equals: [4398046511120,
          4398046520104]}}
- use: valkey.oracle.ledger
  id: data
  config: {workload: writes, loss_window_s: 2.5}
required_events: [seed.completed, warm-up.completed, verify.completed]
required_evidence:
- {evidence_id: valkey.fault.injected, source: kill-node}
- {evidence_id: valkey.command.sequence, source: seed}
- {evidence_id: valkey.command.sequence, source: verify}
