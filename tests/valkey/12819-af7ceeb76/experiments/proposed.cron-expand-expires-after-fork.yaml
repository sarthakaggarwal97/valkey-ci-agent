extends: [valkey.liveness]
id: proposed.cron-expand-expires-after-fork
deployment:
  modes: [standalone]
metadata:
  description: The changed cron loop also handles the DB_EXPIRES sub-dict; an expires
    table frozen small during a fork is expanded by cron on the change, never on the
    parent
components:
- use: valkey.action.commands
