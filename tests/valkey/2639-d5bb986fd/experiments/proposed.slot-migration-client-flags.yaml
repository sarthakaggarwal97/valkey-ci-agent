extends: [valkey.liveness]
id: proposed.slot-migration-client-flags
deployment:
  modes: [standalone]
metadata:
  description: New CLIENT LIST/KILL i and E slot migration flag filters, flags= output
    during and after a slot migration, and killing live migration clients through
    the new filters
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: flags
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 2
    resp: {$ref: inputs.resp}
    server_config: {enable-debug-command: "yes"}
    timeout_s: 240
    commands:
    - {command: [CLIENT, LIST, FLAGS, i], node: 0, expect_difference: true, expect: {
        equals: ""}}
    - {command: [CLIENT, LIST, FLAGS, E], node: 0, expect_difference: true, expect: {
        equals: ""}}
    - {command: [CLIENT, LIST, FLAGS, EEEEiiii], node: 0, expect_difference: true,
      expect: {equals: ""}}
    - {command: [CLIENT, LIST, NOT-FLAGS, iE], node: 0, expect_difference: true, expect: {
        error: false}}
    - {command: [CLIENT, LIST, FLAGS, ""], node: 0, compare: skip}
    - {command: [CLIENT, LIST, FLAGS, Z], node: 0, expect: {error: "Unknown flags"}}
    - {command: [CLIENT, KILL, FLAGS, i], node: 0, expect_difference: true, expect: {
        equals: 0}}
    - {command: [DEBUG, SLOTMIGRATION, PREVENT-PAUSE, "1"], node: 0, expect: {equals: OK}}
    - {command: [DEBUG, SLOTMIGRATION, PREVENT-PAUSE, "1"], node: 1, expect: {equals: OK}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, "16383", "16383", NODE, "<node.1.id>"],
      node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], node: 0, wait_s: 30, compare: skip,
      expect: {contains: waiting-to-pause}}
    - {command: [CLIENT, LIST, FLAGS, E], node: 0, expect_difference: true, expect: {
        contains: "flags=E"}}
    - {command: [CLIENT, LIST, FLAGS, i], node: 0, expect_difference: true, expect: {
        equals: ""}}
    - {command: [CLIENT, LIST, FLAGS, i], node: 1, expect_difference: true, expect: {
        contains: "flags=i"}}
    - {command: [CLIENT, LIST, FLAGS, E], node: 1, expect_difference: true, expect: {
        equals: ""}}
    - {command: [CLIENT, LIST], node: 0, expect_difference: true, expect: {contains: "flags=E"}}
    - {command: [CLIENT, LIST, NOT-FLAGS, i], node: 1, expect_difference: true, expect: {
        contains: "id="}}
    - {command: [DEBUG, SLOTMIGRATION, PREVENT-PAUSE, "0"], node: 0, expect: {equals: OK}}
    - {command: [DEBUG, SLOTMIGRATION, PREVENT-PAUSE, "0"], node: 1, expect: {equals: OK}}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], node: 0, wait_s: 60, compare: skip,
      expect: {contains: success}}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], node: 1, wait_s: 60, compare: skip,
      expect: {contains: success}}
    - {command: [CLIENT, LIST, FLAGS, E], node: 0, expect_difference: true, expect: {
        equals: ""}}
    - {command: [CLIENT, LIST, FLAGS, i], node: 1, expect_difference: true, expect: {
        equals: ""}}
    - {command: [DEBUG, SLOTMIGRATION, PREVENT-PAUSE, "1"], node: 0, expect: {equals: OK}}
    - {command: [DEBUG, SLOTMIGRATION, PREVENT-PAUSE, "1"], node: 1, expect: {equals: OK}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, "16382", "16382", NODE, "<node.1.id>"],
      node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], node: 0, wait_s: 30, compare: skip,
      expect: {contains: waiting-to-pause}}
    - {command: [CLIENT, KILL, FLAGS, i], node: 1, expect_difference: true, expect: {
        equals: 1}}
    - {command: [CLIENT, KILL, FLAGS, E], node: 0, expect_difference: true, expect: {
        in: [0, 1]}}
    - {command: [PING], node: 0, expect: {equals: PONG}}
    - {command: [PING], node: 1, expect: {equals: PONG}}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], node: 0, compare: skip}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], node: 1, compare: skip}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [flags.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: flags}
