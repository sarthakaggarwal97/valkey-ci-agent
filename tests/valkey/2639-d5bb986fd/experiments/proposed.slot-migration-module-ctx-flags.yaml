extends: [valkey.liveness]
id: proposed.slot-migration-module-ctx-flags
deployment:
  modes: [standalone]
metadata:
  description: VM_GetContextFlags called from a keyspace notification while the slot
    import client applies streamed commands must report the slot import client flag
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: modctx
  config:
    compare_with: {$ref: artifacts.parent.binary}
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    cluster: true
    nodes: 2
    resp: {$ref: inputs.resp}
    server_config: {enable-debug-command: "yes"}
    timeout_s: 90
    commands:
    - {command: [DEBUG, SLOTMIGRATION, PREVENT-PAUSE, 1], node: 0, expect: {equals: OK}}
    - {command: [SET, count_dels_a, v1], node: 0, expect: {equals: OK}}
    - {command: [SET, plainkey, v2], node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 0, 16383, NODE, "<node.1.id>"],
      node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], node: 0, wait_s: 30, compare: skip,
      expect: {contains: replicating}}
    - {command: [CLIENT, LIST, FLAGS, i], node: 1, expect_difference: true, expect: {
        contains: "flags=i"}}
    - {command: [DEL, count_dels_a], node: 0, expect: {equals: 1}}
    - {command: [DEL, plainkey], node: 0, expect: {equals: 1}}
    - {command: [keyspace.get_dels], node: 1, wait_s: 30, compare: skip, expect: {
        min: 1}}
    - {command: [CLIENT, LIST, FLAGS, E], node: 0, expect_difference: true, expect: {
        contains: "flags=E"}}
    - {command: [DEBUG, SLOTMIGRATION, PREVENT-PAUSE, 0], node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], node: 0, wait_s: 30, compare: skip,
      expect: {contains: success}}
    - {command: [PING], node: 1, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      variants: true
required_events: [modctx.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: modctx}
