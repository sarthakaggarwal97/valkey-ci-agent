extends: [valkey.liveness]
id: proposed.slot-migration-flags-n-filter
deployment:
  modes: [standalone]
metadata:
  description: CLIENT LIST FLAGS N and NOT-FLAGS N must treat live slot migration
    import and export clients as flagged clients
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: flagsn
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 2
    resp: {$ref: inputs.resp}
    server_config: {enable-debug-command: "yes"}
    timeout_s: 90
    commands:
    - {command: [DEBUG, SLOTMIGRATION, PREVENT-PAUSE, 1], node: 0, expect: {equals: OK}}
    - {command: [SET, k1, v1], node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 0, 16383, NODE, "<node.1.id>"],
      node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], node: 0, wait_s: 30, compare: skip,
      expect: {contains: replicating}}
    - {command: [CLIENT, LIST, FLAGS, E], node: 0, expect_difference: true, expect: {
        contains: "flags=E"}}
    - {command: [CLIENT, LIST, FLAGS, i], node: 1, expect_difference: true, expect: {
        contains: "flags=i"}}
    - {command: [CLIENT, LIST, FLAGS, N], node: 0, expect_difference: true, expect: {
        contains: "flags=N"}}
    - {command: [CLIENT, LIST, FLAGS, N], node: 1, expect_difference: true, expect: {
        contains: "flags=N"}}
    - {command: [CLIENT, LIST, NOT-FLAGS, N], node: 1, expect_difference: true, expect: {
        contains: "flags=i"}}
    - {command: [CLIENT, LIST, NOT-FLAGS, N], node: 0, expect_difference: true, expect: {
        contains: "flags=E"}}
    - {command: [DEBUG, SLOTMIGRATION, PREVENT-PAUSE, 0], node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], node: 0, wait_s: 30, compare: skip,
      expect: {contains: success}}
    - {command: [PING], node: 0, expect: {equals: PONG}}
    - {command: [PING], node: 1, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      variants: true
required_events: [flagsn.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: flagsn}
