extends: [valkey.liveness]
id: proposed.migrateslots-locked-down-cluster
deployment:
  modes: [standalone]
metadata:
  description: End-to-end slot migration in a locked-down cluster (admin user, default
    off -@all, primaryuser/primaryauth on the source) exercising the AUTH leg and
    the internal-user export client; the parent's job client stays bound to the disabled
    default user and the migration stalls
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: lockdown
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 120
    commands:
    - {command: [MSET, "{6ZJ}:1", v1, "{6ZJ}:2", v2, "{6ZJ}:3", v3, "{6ZJ}:4", v4,
        "{6ZJ}:5", v5, "{6ZJ}:6", v6, "{6ZJ}:7", v7, "{6ZJ}:8", v8], node: 0, expect: {
        equals: OK}}
    - {command: [ACL, SETUSER, admin, on, ">S3cureAdmin", "~*", "&*", "+@all"], node: 1,
      expect: {equals: OK}}
    - {command: [AUTH, admin, S3cureAdmin], node: 1, expect: {equals: OK}}
    - {command: [ACL, SETUSER, default, off, "-@all"], node: 1, expect: {equals: OK}}
    - {command: [ACL, SETUSER, admin, on, ">S3cureAdmin", "~*", "&*", "+@all"], node: 0,
      expect: {equals: OK}}
    - {command: [AUTH, admin, S3cureAdmin], node: 0, expect: {equals: OK}}
    - {command: [ACL, SETUSER, default, off, "-@all"], node: 0, expect: {equals: OK}}
    - {command: [CONFIG, SET, primaryuser, admin], node: 0, expect: {equals: OK}}
    - {command: [CONFIG, SET, primaryauth, S3cureAdmin], node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 16383, 16383, NODE, "<node.1.id>"],
      node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, COUNTKEYSINSLOT, 16383], node: 0, wait_s: 45, expect_difference: true,
      expect: {equals: 0}}
    - {command: [GET, "{6ZJ}:1"], node: 1, expect_difference: true, expect: {equals: v1}}
    - {command: [CLUSTER, COUNTKEYSINSLOT, 16383], node: 1, compare: skip}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], node: 0, compare: skip}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], node: 1, compare: skip}
    - {command: [PING], node: 0, expect: {equals: PONG}}
    - {command: [PING], node: 1, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [lockdown.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: lockdown}
