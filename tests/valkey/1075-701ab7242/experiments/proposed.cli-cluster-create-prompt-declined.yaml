extends: [valkey.liveness]
id: proposed.cli-cluster-create-prompt-declined
deployment:
  modes: [standalone]
metadata:
  description: valkey-cli --cluster create with one primary and no --cluster-yes now
    prints the new confirmation prompt on the change where the parent printed a hard
    error
inputs:
  required: [parent]
  properties:
    parent:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "The parent commit's build, {$ref: artifacts.parent.binary}"
components:
- use: valkey.action.tools
  id: cli
  config:
    compare_with: {$ref: inputs.parent}
    server: true
    cluster: true
    timeout_s: 60
    runs:
    - {tool: valkey-cli, args: [--cluster, create, "127.0.0.1:$port"], stdin: "no\n",
      expect_difference: true, expect: {exit: {equals: 1}, stdout: {contains: "at\
            \ least 3 primary nodes for automatic failover"}}}
required_evidence:
- {evidence_id: valkey.tool.runs, source: cli}
