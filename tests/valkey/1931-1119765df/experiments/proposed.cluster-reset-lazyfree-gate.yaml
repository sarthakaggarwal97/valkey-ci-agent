extends: [valkey.liveness]
id: proposed.cluster-reset-lazyfree-gate
deployment:
  modes: [standalone]
metadata:
  description: CLUSTER RESET on a replica flushes async per lazyfree-lazy-user-flush,
    not replica-lazy-flush; observed via INFO memory lazyfreed_objects
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: reset-flush
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
    - {command: [CONFIG, SET, lazyfree-lazy-user-flush, no], node: 1, expect: {equals: OK}}
    - {command: [CONFIG, SET, replica-lazy-flush, yes], node: 1, expect: {equals: OK}}
    - {command: [MSET, "{t}1", v, "{t}2", v, "{t}3", v, "{t}4", v, "{t}5", v], node: 0,
      expect: {equals: OK}}
    - {command: [CLUSTER, REPLICATE, "<node.0.id>"], node: 1, expect: {equals: OK}}
    - {command: [DBSIZE], node: 1, wait_s: 25, expect: {equals: 5}}
    - {command: [CLUSTER, RESET, SOFT], node: 1, expect: {equals: OK}}
    - {command: [DEBUG, SLEEP, 1], node: 1, expect: {equals: OK}}
    - {command: [INFO, memory], node: 1, expect_difference: true, expect: {contains: "lazyfreed_objects:0"}}
    - {command: [CONFIG, SET, lazyfree-lazy-user-flush, yes], node: 1, expect: {equals: OK}}
    - {command: [CONFIG, SET, replica-lazy-flush, no], node: 1, expect: {equals: OK}}
    - {command: [MSET, "{t}6", v, "{t}7", v, "{t}8", v, "{t}9", v, "{t}10", v, "{t}11",
        v, "{t}12", v], node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, MEET, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [CLUSTER, REPLICATE, "<node.0.id>"], node: 1, wait_s: 25, expect: {
        equals: OK}}
    - {command: [DBSIZE], node: 1, wait_s: 25, expect: {equals: 12}}
    - {command: [CLUSTER, RESET, HARD], node: 1, expect: {equals: OK}}
    - {command: [DEBUG, SLEEP, 1], node: 1, expect: {equals: OK}}
    - {command: [INFO, memory], node: 1, expect_difference: true, expect: {contains: "lazyfreed_objects:12"}}
    - {command: [PING], node: 1, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [reset-flush.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: reset-flush}
