extends: [valkey.liveness]
id: proposed.script-timeout-paused-primary
deployment:
  modes: [standalone]
metadata:
  description: Killing a busy read-only script on a replica whose primary client is
    postponed by CLIENT PAUSE WRITE must not crash the replica
components:
- use: valkey.action.commands
  id: kill_busy_script
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: 2
    nodes: 2
    timeout_s: 30
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [CLIENT, PAUSE, 100000, WRITE], node: 1, expect: {equals: OK}}
    - {command: [SET, foo3, bar3], node: 0, expect: {equals: OK}}
    - {command: [INFO, clients], node: 1, wait_s: 30, compare: skip, expect: {contains: "blocked_clients:1"}}
    - {command: [CONFIG, SET, busy-reply-threshold, 10], node: 1, expect: {equals: OK}}
    - {raw: "EVAL_RO \"while true do end\" 0\r\n", node: 1, connection: job}
    - {command: [PING], node: 1, wait_s: 30, compare: skip, expect: {error: "BUSY"}}
    - {command: [SCRIPT, KILL], node: 1, expect: {equals: OK}}
    - {command: [PING], node: 1, wait_s: 10, expect_difference: true, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_evidence:
- {evidence_id: valkey.command.sequence, source: kill_busy_script}
