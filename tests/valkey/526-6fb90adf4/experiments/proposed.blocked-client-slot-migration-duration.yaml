extends: [valkey.liveness]
id: proposed.blocked-client-slot-migration-duration
deployment:
  modes: [standalone]
metadata:
  description: A client blocked on XREADGROUP whose stream slot is migrated must not
    crash the server (command duration reset on cluster redirect)
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: migrate
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
    - {command: [XGROUP, CREATE, aga, mygroup, "$", MKSTREAM], node: 0, expect: {
        equals: OK}}
    - {raw: "XREADGROUP GROUP mygroup consumer BLOCK 0 STREAMS aga >\r\n", node: 0,
      connection: blk}
    - {command: [INFO, clients], node: 0, wait_s: 30, compare: skip, expect: {contains: "blocked_clients:1"}}
    - {command: [CLUSTER, SETSLOT, 609, MIGRATING, "<node.1.id>"], node: 0, expect: {
        equals: OK}}
    - {command: [CLUSTER, SETSLOT, 609, IMPORTING, "<node.0.id>"], node: 1, expect: {
        equals: OK}}
    - {command: [MIGRATE, "<node.1.host>", "<node.1.port>", aga, 0, 5000], node: 0,
      expect_difference: true, expect: {equals: OK}}
    - {command: [PING], node: 0, expect_difference: true, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_evidence:
- {evidence_id: valkey.command.sequence, source: migrate}
