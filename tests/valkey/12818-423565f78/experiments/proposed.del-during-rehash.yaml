        "key:280", "key:281", "key:282", "key:283", "key:284", "key:285", "key:286",
        "key:287", "key:288", "key:289", "key:290", "key:291", "key:292", "key:293",
        "key:294", "key:295", "key:296", "key:297", "key:298", "key:299"], expect: {
        equals: 40}}
    - {command: [DEL, "key:10", "key:11", "key:12", "key:13", "key:14", "key:15",
        "key:16", "key:17", "key:18", "key:19", "key:20", "key:21", "key:22", "key:23",
        "key:24", "key:25", "key:26", "key:27", "key:28", "key:29"], expect: {equals: 20}}
    - {command: [DEL, "key:30", "key:31", "key:32", "key:33", "key:34", "key:35",
        "key:36", "key:37", "key:38", "key:39", "key:40", "key:41", "key:42", "key:43",
        "key:44", "key:45", "key:46", "key:47", "key:48", "key:49", "key:50", "key:51",
        "key:52", "key:53", "key:54", "key:55", "key:56", "key:57", "key:58", "key:59"],
      expect: {equals: 30}}
    - {command: [EXISTS, "key:30", "key:31", "key:32", "key:33", "key:34", "key:35",
        "key:36", "key:37", "key:38", "key:39", "key:40", "key:41", "key:42", "key:43",
        "key:44", "key:45", "key:46", "key:47", "key:48", "key:49", "key:50", "key:51",
        "key:52", "key:53", "key:54", "key:55", "key:56", "key:57", "key:58", "key:59"],
      expect: {equals: 0}}
    - {command: [DBSIZE], expect: {equals: 976}}
    - {command: [GET, "key:777"], expect: {equals: "value:777"}}
    - {command: [DEBUG, HTSTATS, 0], compare: skip, expect: {contains: "rehashing\
          \ target"}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [del-rehash.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: del-rehash}
