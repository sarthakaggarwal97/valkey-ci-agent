extends: [valkey.liveness]
id: proposed.del-during-rehash
deployment:
  modes: [standalone]
metadata:
  description: >-
    DEL, UNLINK, GETDEL and lazy expiry while the main db dict is mid-rehash, exercising
    the new rehashidx bucket-skip in dictTwoPhaseUnlinkFind. With activerehashing
    off the 1024->2048 rehash stays open for the whole delete phase; a wrongly skipped
    bucket shows up as a delete that misses a live key.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    lazyfree: {type: string, enum: ["yes", "no"], default: "no"}
components:
- use: valkey.action.commands
  id: del-rehash
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server_config:
      enable-debug-command: "yes"
      activerehashing: "no"
      lazyfree-lazy-user-del: {$ref: inputs.lazyfree}
      lazyfree-lazy-expire: {$ref: inputs.lazyfree}
    resp: {$ref: inputs.resp}
    timeout_s: 20
    commands:
    - {command: [DEBUG, POPULATE, 1016], expect: {equals: OK}}
    - {command: [MSET, g0, x, g1, x, g2, x, g3, x, g4, x, g5, x, g6, x, g7, x, g8,
        x, g9, x, g10, x, g11, x, g12, x, g13, x, g14, x, g15, x], expect: {equals: OK}}
    - {command: [DEBUG, HTSTATS, 0], compare: skip, expect: {contains: "rehashing\
          \ target"}}
    - {command: [GETDEL, "key:0"], expect: {equals: "value:0"}}
    - {command: [DEL, "key:1"], expect: {equals: 1}}
    - {command: [UNLINK, "key:2"], expect: {equals: 1}}
    - {command: [DEL, "key:3", "key:4", "key:5", nosuchkey], expect: {equals: 3}}
    - {command: [EXISTS, "key:0", "key:1", "key:2", "key:3", "key:4", "key:5"], expect: {
        equals: 0}}
    - {command: [DEL, nosuchkey], expect: {equals: 0}}
    - {command: [SET, "key:1", fresh], expect: {equals: OK}}
    - {command: [GETDEL, "key:1"], expect: {equals: fresh}}
    - {command: [EXISTS, "key:1"], expect: {equals: 0}}
    - {command: [SET, "exp:1", v], expect: {equals: OK}}
    - {command: [PEXPIRE, "exp:1", 1], expect: {equals: 1}}
    - {command: [DEBUG, SLEEP, 0.1], expect: {equals: OK}}
    - {command: [EXISTS, "exp:1"], expect: {equals: 0}}
    - {command: [DEL, "exp:1"], expect: {equals: 0}}
    - {command: [EXISTS, "key:100", "key:101", "key:102", "key:103", "key:104", "key:105",
        "key:106", "key:107", "key:108", "key:109", "key:110", "key:111", "key:112",
        "key:113", "key:114", "key:115", "key:116", "key:117", "key:118", "key:119",
        "key:120", "key:121", "key:122", "key:123", "key:124", "key:125", "key:126",
        "key:127", "key:128", "key:129", "key:130", "key:131", "key:132", "key:133",
        "key:134", "key:135", "key:136", "key:137", "key:138", "key:139"], expect: {
        equals: 40}}
    - {command: [EXISTS, "key:140", "key:141", "key:142", "key:143", "key:144", "key:145",
        "key:146", "key:147", "key:148", "key:149", "key:150", "key:151", "key:152",
        "key:153", "key:154", "key:155", "key:156", "key:157", "key:158", "key:159",
        "key:160", "key:161", "key:162", "key:163", "key:164", "key:165", "key:166",
        "key:167", "key:168", "key:169", "key:170", "key:171", "key:172", "key:173",
        "key:174", "key:175", "key:176", "key:177", "key:178", "key:179"], expect: {
        equals: 40}}
    - {command: [EXISTS, "key:180", "key:181", "key:182", "key:183", "key:184", "key:185",
        "key:186", "key:187", "key:188", "key:189", "key:190", "key:191", "key:192",
        "key:193", "key:194", "key:195", "key:196", "key:197", "key:198", "key:199",
        "key:200", "key:201", "key:202", "key:203", "key:204", "key:205", "key:206",
        "key:207", "key:208", "key:209", "key:210", "key:211", "key:212", "key:213",
        "key:214", "key:215", "key:216", "key:217", "key:218", "key:219"], expect: {
        equals: 40}}
    - {command: [EXISTS, "key:220", "key:221", "key:222", "key:223", "key:224", "key:225",
        "key:226", "key:227", "key:228", "key:229", "key:230", "key:231", "key:232",
        "key:233", "key:234", "key:235", "key:236", "key:237", "key:238", "key:239",
        "key:240", "key:241", "key:242", "key:243", "key:244", "key:245", "key:246",
