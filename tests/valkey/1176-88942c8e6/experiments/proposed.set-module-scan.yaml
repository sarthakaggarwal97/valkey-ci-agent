extends: [valkey.liveness]
id: proposed.set-module-scan
deployment:
  modes: [standalone]
metadata:
  description: Module ScanKey over hashtable sets (new callback) and over dict-backed
    hashes and zsets (new panic path), compared across builds
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: modscan
  config:
    compare_with: {$ref: artifacts.parent.binary}
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 30
    server_config: {set-max-listpack-entries: 2, hash-max-listpack-entries: 0, zset-max-listpack-entries: 0}
    commands:
    - {command: [SADD, s, a, b, c, d, e], expect: {equals: 5}}
    - {command: [OBJECT, ENCODING, s], compare: skip, expect: {equals: hashtable}}
    - {command: ["scan.scan_key", s], compare: skip, expect: {error: false}}
    - {command: [EVAL, "for i=1,1000 do server.call('SADD', KEYS[1], 'm:'..i) end\
          \ return server.call('SCARD', KEYS[1])", 1, big], expect: {equals: 1000}}
    - {command: ["scan.scan_key", big], compare: skip, expect: {error: false}}
    - {command: [SREM, big, "m:1", "m:2"], expect: {equals: 2}}
    - {command: ["scan.scan_key", big], compare: skip, expect: {error: false}}
    - {command: [HSET, h, f1, v1, f2, v2], expect: {equals: 2}}
    - {command: ["scan.scan_key", h], compare: skip, expect: {error: false}}
    - {command: [ZADD, z, 1, a, 2, b], expect: {equals: 2}}
    - {command: ["scan.scan_key", z], compare: skip, expect: {error: false}}
    - {command: [DEBUG, HTSTATS-KEY, s], expect_difference: true, expect: {contains: "number\
          \ of entries"}}
    checks:
      acl: true
      compat: true
      variants: true
required_events: [modscan.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: modscan}
