scenario_id: ai-716820fb0183
seed: 100725
experiment:
  id: valkey.replication-chaos
  inputs:
    stable_keys: 1000
    mutable_keys: 500
    mutation_rate: 500
    value_size: 16384
    wait_replicas: 1
    command_rate: 100
    waves:
    - - op: backlog_pressure
        repl_backlog_size: 16384
        output_limit: 65536
        duration_s: 2
      - op: stall
        target: replica
        duration_s: 2
    - - op: kill
        target: replica
        signal: SIGKILL
      - op: restart
        target: killed
        after: 0
    - - op: repoint
        target: replica
        to: replica
      - op: stall
        target: replica
        duration_s: 1
        delay_s: 0.5
deployment:
  mode: standalone
  replicas_per_primary: 2
  base_port: 7200
  server_config:
    repl-diskless-sync: 'yes'
    repl-diskless-sync-delay: '0'
