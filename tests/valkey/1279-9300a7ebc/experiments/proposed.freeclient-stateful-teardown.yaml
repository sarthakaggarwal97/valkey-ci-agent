extends: [valkey.liveness]
id: proposed.freeclient-stateful-teardown
deployment:
  modes: [standalone]
metadata:
  description: Free clients carrying WATCH/MULTI, pubsub, tracking, blocked and replication
    state through CLIENT KILL, protocol errors and REPLICAOF changes; nothing may
    crash and no stale watcher or subscriber may survive
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: teardown
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 90
    commands:
    - {command: [SET, k1, v1], expect: {equals: OK}}
    - {command: [SUBSCRIBE, ch1], connection: victim-pubsub}
    - {command: [PSUBSCRIBE, "news.*"], connection: victim-pubsub}
    - {command: [SSUBSCRIBE, sch1], connection: victim-pubsub}
    - {command: [WATCH, k1, k2, k3], connection: victim-watch, expect: {equals: OK}}
    - {command: [MULTI], connection: victim-watch, expect: {equals: OK}}
    - {command: [SET, k1, v2], connection: victim-watch, expect: {equals: QUEUED}}
    - {command: [BLPOP, nolist, "5"], connection: victim-blocked}
    - {command: [CLIENT, KILL, TYPE, normal, SKIPME, "yes"], expect: {min: 2}}
    - {command: [CLIENT, KILL, TYPE, pubsub], expect: {equals: 1}}
    - {command: [SET, k1, v2], expect: {equals: OK}}
    - {command: [GET, k1], expect: {equals: v2}}
    - {command: [PUBLISH, ch1, hello], expect: {equals: 0}}
    - {command: [SPUBLISH, sch1, hello], expect: {equals: 0}}
    - {command: [CLIENT, TRACKING, "ON", BCAST, PREFIX, "user:"], connection: tracker}
    - {command: [CLIENT, KILL, TYPE, normal, SKIPME, "yes"], expect: {equals: 1}}
    - {raw: "*1\r\n$-2\r\n", connection: bad}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, compare: skip, wait_s: 30, expect: {
        contains: "master_link_status:up"}}
    - {command: [SET, rk, rv], expect: {equals: OK}}
    - {command: [GET, rk], node: 1, wait_s: 30, expect: {equals: rv}}
    - {command: [CLIENT, KILL, TYPE, replica], expect: {min: 1}}
    - {command: [INFO, replication], node: 1, compare: skip, wait_s: 30, expect: {
        contains: "master_link_status:up"}}
    - {command: [CLIENT, KILL, TYPE, master], node: 1, expect: {min: 1}}
    - {command: [INFO, replication], node: 1, compare: skip, wait_s: 30, expect: {
        contains: "master_link_status:up"}}
    - {command: [REPLICAOF, "NO", "ONE"], node: 1, expect: {equals: OK}}
    - {command: [SET, after, done], expect: {equals: OK}}
    - {command: [GET, after], expect: {equals: done}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [teardown.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: teardown}
