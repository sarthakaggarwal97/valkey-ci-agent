extends: [valkey.liveness]
id: proposed.unix-addr-client-info
deployment:
  modes: [standalone]
metadata:
  description: CLIENT INFO / LIST addr and laddr of a unix-socket client, compared
    across builds after the unixsocket truncation fix
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: unix-addr
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    timeout_s: 10
    commands:
    - {command: [PING], expect: {equals: PONG}}
    - {command: [SET, k, v], expect: {equals: OK}}
    - {command: [CLIENT, INFO], expect_difference: true, expect: {contains: "laddr="}}
    - {command: [CLIENT, LIST], expect_difference: true, expect: {contains: "addr="}}
    - {command: [PING], connection: second, expect: {equals: PONG}}
    - {command: [CLIENT, LIST, TYPE, normal], expect_difference: true, expect: {contains: "cmd=client|list"}}
    - {command: [CLIENT, KILL, LADDR, '/nonexistent.sock:0'], expect: {equals: 0}}
    - {command: [GET, k], expect: {equals: v}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [unix-addr.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: unix-addr}
