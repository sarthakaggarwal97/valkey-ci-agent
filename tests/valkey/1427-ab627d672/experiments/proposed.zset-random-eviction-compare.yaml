extends: [valkey.liveness]
id: proposed.zset-random-eviction-compare
deployment:
  modes: [standalone]
metadata:
  description: maxmemory with allkeys-random evicts keys including skiplist zsets,
    exercising kvstoreHashtableRandomEntry and objectGetKey in performEvictions
components:
- use: valkey.action.commands
  id: evict
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: 2
    timeout_s: 90
    commands:
    - {command: [CONFIG, SET, zset-max-listpack-entries, "0"], expect: {equals: OK}}
    - {command: [CONFIG, SET, maxmemory-policy, allkeys-random], expect: {equals: OK}}
    - {command: [DEBUG, POPULATE, 50000], expect: {equals: OK}}
    - {command: [ZADD, evz1, 1, m1, 2, m2, 3, m3, 4, m4, 5, m5], expect: {equals: 5}}
    - {command: [ZADD, evz2, 1, n1, 2, n2, 3, n3, 4, n4, 5, n5], expect: {equals: 5}}
    - {command: [ZADD, evz3, 1, p1, 2, p2, 3, p3, 4, p4, 5, p5], expect: {equals: 5}}
    - {command: [CONFIG, SET, maxmemory, 2mb], expect: {equals: OK}}
    - {command: [SET, trigger, v], wait_s: 20, expect: {equals: OK}}
    - {command: [DBSIZE], wait_s: 20, compare: skip, expect: {max: 45000}}
    - {command: [CONFIG, SET, maxmemory, "0"], expect: {equals: OK}}
    - {command: [INFO, stats], compare: skip}
    checks:
      acl: true
      compat: true
      variants: true
required_events: [evict.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: evict}
