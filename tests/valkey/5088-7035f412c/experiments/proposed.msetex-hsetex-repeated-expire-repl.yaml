extends: [valkey.liveness]
id: proposed.msetex-hsetex-repeated-expire-repl
deployment:
  modes: [standalone]
metadata:
  description: MSETEX/HSETEX with repeated EX/PX/EXAT must propagate a single PXAT;
    on the parent the replica rejects the stream (EX next to PXAT is a syntax error)
    and silently loses the write
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: repl
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [MSETEX, 1, foo, bar, EX, 100, EX, 200], expect: {equals: 1}}
    - {command: [MSETEX, 1, num, 12345, PX, 100000, PX, 200000, PX, 300000], expect: {
        equals: 1}}
    - {command: [MSETEX, 1, ex, ex, EX, 100, EX, 200], expect: {equals: 1}}
    - {command: [MSETEX, 2, k1, v1, k2, v2, NX, EXAT, 33177600000, EXAT, 33177600123],
      expect: {equals: 1}}
    - {command: [MSETEX, 1, ctrl, v, EX, 100], expect: {equals: 1}}
    - {command: [HSETEX, h, PX, 100000, PX, 200000, FIELDS, 1, f, v], expect: {equals: 1}}
    - {command: [HSETEX, px, EX, 100, EX, 200, FIELDS, 1, f, v], expect: {equals: 1}}
    - {command: [HSETEX, fields, EX, 100, EX, 200, FIELDS, 1, f, v], expect: {equals: 1}}
    - {command: [HSETEX, hx, FNX, EXAT, 33177600000, EXAT, 33177600456, FIELDS, 2,
        f1, v1, f2, v2], expect: {equals: 1}}
    - {command: [HSETEX, hf, PX, 100000, PX, 200000, FIELDS, 2, ex, 1, fields, 2],
      expect: {equals: 1}}
    - {command: [HSETEX, hc, EX, 100, FIELDS, 1, f, v], expect: {equals: 1}}
    - {command: [WAIT, 1, 10000], expect: {equals: 1}}
    - {command: [PEXPIRETIME, k1], expect: {equals: 33177600123000}}
    - {command: [HPEXPIRETIME, hx, FIELDS, 1, f1], expect: {equals: [33177600456000]}}
    - {command: [GET, foo], node: 1, expect_difference: true, expect: {equals: bar}}
    - {command: [GET, num], node: 1, expect_difference: true, expect: {equals: "12345"}}
    - {command: [GET, ex], node: 1, expect_difference: true, expect: {equals: ex}}
    - {command: [MGET, k1, k2], node: 1, expect_difference: true, expect: {equals: [
          v1, v2]}}
    - {command: [PEXPIRETIME, k2], node: 1, expect_difference: true, expect: {equals: 33177600123000}}
    - {command: [HGET, h, f], node: 1, expect_difference: true, expect: {equals: v}}
    - {command: [HGET, px, f], node: 1, expect_difference: true, expect: {equals: v}}
    - {command: [HGET, fields, f], node: 1, expect_difference: true, expect: {equals: v}}
    - {command: [HMGET, hx, f1, f2], node: 1, expect_difference: true, expect: {equals: [
          v1, v2]}}
    - {command: [HPEXPIRETIME, hx, FIELDS, 2, f1, f2], node: 1, expect_difference: true,
      expect: {equals: [33177600456000, 33177600456000]}}
    - {command: [HGET, hf, ex], node: 1, expect_difference: true, expect: {equals: "1"}}
    - {command: [GET, ctrl], node: 1, expect: {equals: v}}
    - {command: [HGET, hc, f], node: 1, expect: {equals: v}}
    - {command: [DBSIZE], node: 1, expect_difference: true, expect: {equals: 12}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
