extends: [valkey.liveness]
id: proposed.debranded-error-replies
deployment:
  modes: [standalone]
metadata:
  description: Error replies that dropped the word 'Redis' (ACL LOAD/SAVE without
    aclfile, WAIT on a replica, script arity/unknown-command and Lua argument errors,
    redis.acl_check_cmd) differ from the parent build and keep their meaning
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: errors
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    nodes: 2
    timeout_s: 30
    commands:
    - {command: [ACL, LOAD], expect_difference: true, expect: {error: "This instance\
          \ is not configured to use an ACL file"}}
    - {command: [ACL, SAVE], expect_difference: true, expect: {error: "This instance\
          \ is not configured to use an ACL file"}}
    - {command: [EVAL, "return redis.call('nosuchcommand')", "0"], expect_difference: true,
      expect: {error: "Unknown command called from script"}}
    - {command: [EVAL, "return redis.call('incr')", "0"], expect_difference: true,
      expect: {error: "Wrong number of args calling command from script"}}
    - {command: [EVAL, "return redis.call('set','onlykey')", "0"], expect_difference: true,
      expect: {error: "Wrong number of args calling command from script"}}
    - {command: [EVAL, "return redis.call()", "0"], expect_difference: true, expect: {
        error: "at least one argument for this call"}}
    - {command: [EVAL, "local x={} return redis.call('ping', x)", "0"], expect_difference: true,
      expect: {error: "arguments must be strings or integers"}}
    - {command: [EVAL, "return redis.acl_check_cmd('invalid-cmd','arg')", "0"], expect_difference: true,
      expect: {error: "server.acl_check_cmd"}}
    - {command: [SET, k, v], node: 0, expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [WAIT, "0", "0"], node: 1, expect_difference: true, expect: {error: "WAIT\
          \ cannot be used with replica instances"}}
    - {command: [PING], expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [errors.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: errors}
