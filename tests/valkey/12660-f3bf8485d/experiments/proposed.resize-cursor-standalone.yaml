extends: [valkey.liveness]
id: proposed.resize-cursor-standalone
deployment:
  modes: [standalone]
metadata:
  description: >-
    On the parent, tryResizeHashTables calls dbIteratorNextDict before reading the
    dict, so in standalone mode (one dict, next_slot always -1) it never examines
    any dict at all: a sparse expires table is never shrunk, the active-expire sampling
    callback skips it forever (fill < 1%), and keys with a TTL never actively expire.
    The fix reads the dict at the cursor slot first, shrinks it, and the keys expire.
    70 keys grow the expires dict to 128 buckets; deleting 69 leaves 1 key in 128
    buckets (<1% fill). DBSIZE stays 1 on the parent and reaches 0 on the fixed build.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    hz: {type: integer, enum: [10, 100], default: 10}
components:
- use: valkey.action.commands
  id: seq
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server_config: {appendonly: "no", save: "", hz: {$ref: inputs.hz}}
    resp: {$ref: inputs.resp}
    timeout_s: 120
    commands:
    - {command: [PSETEX, k1, 12000, v], expect: {equals: OK}}
    - {command: [PSETEX, k2, 12000, v], expect: {equals: OK}}
