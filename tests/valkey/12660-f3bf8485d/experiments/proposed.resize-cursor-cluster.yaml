extends: [valkey.liveness]
id: proposed.resize-cursor-cluster
deployment:
  modes: [standalone]
metadata:
  description: >-
    In cluster mode the parent's resize_cursor sticks at the last non-empty slot and
    dbIteratorNextDict always skips the cursor slot itself, so the dict at the stuck
    cursor is never resized again. All TTL keys live in one slot (hash tag {foo},
    slot 12182). A short EXISTS wait on an expiring sentinel key guarantees several
    cron passes so the cursor parks on 12182 on both builds before the deletes make
    the dict sparse (1 key in 128 buckets). The fix re-examines the cursor slot every
    pass, shrinks the dict, and active expire removes the last key; the parent never
    shrinks it and the key never expires, so DBSIZE stays 1.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    hz: {type: integer, enum: [10, 100], default: 10}
components:
- use: valkey.action.commands
  id: cseq
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    server_config: {appendonly: "no", save: "", hz: {$ref: inputs.hz}}
    resp: {$ref: inputs.resp}
    timeout_s: 120
    commands:
    - {command: [PSETEX, "{foo}t", 600, v], expect: {equals: OK}}
    - {command: [PSETEX, "{foo}1", 12000, v], expect: {equals: OK}}
    - {command: [PSETEX, "{foo}2", 12000, v], expect: {equals: OK}}
