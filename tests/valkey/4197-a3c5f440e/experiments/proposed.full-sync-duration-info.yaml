extends: [valkey.liveness]
id: proposed.full-sync-duration-info
deployment:
  modes: [standalone]
metadata:
  description: INFO replication reports last_successful_sync_duration_ms after a full
    sync, shows -1 after replica -> primary -> replica with no successful sync, and
    measures again on a later resync, for both single and dual channel replication
inputs:
  properties:
    dual_channel: {type: string, enum: ["no", "yes"], default: "no"}
components:
- use: valkey.action.commands
  id: sync-duration
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    server_config:
      dual-channel-replication-enabled: {$ref: inputs.dual_channel}
      repl-diskless-sync: "yes"
      repl-diskless-sync-delay: 0
    timeout_s: 60
    commands:
    - {command: [SET, k1, v1], node: 0, expect: {equals: OK}}
    - {command: [RPUSH, biglist, a, b, c, d, e], node: 0, expect: {equals: 5}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [INFO, replication], node: 1, expect_difference: true, expect: {contains: "last_successful_sync_duration_ms:"}}
    - {command: [REPLICAOF, NO, ONE], node: 1, expect: {equals: OK}}
    - {command: [REPLICAOF, 127.0.0.1, 1], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, expect_difference: true, expect: {contains: "last_successful_sync_duration_ms:-1"}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [INFO, replication], node: 1, expect_difference: true, expect: {contains: "last_successful_sync_duration_ms:"}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [sync-duration.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: sync-duration}
