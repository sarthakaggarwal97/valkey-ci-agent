extends: [valkey.liveness]
id: proposed.delifeq-propagation-effects
deployment:
  modes: [standalone]
metadata:
  description: >-
    DELIFEQ now propagates a DEL to replicas, signals the modified key to watchers,
    fires the keyspace del notification, and its key spec drops ACCESS and adds FAST;
    the parent did none of these.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: delifeq
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    server_config: {notify-keyspace-events: gE}
    timeout_s: 15
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [SUBSCRIBE, "__keyevent@0__:del"], connection: sub, expect: {exists: true},
      compare: skip}
    - {command: [SET, wk, wv], expect: {equals: OK}}
    - {command: [WATCH, wk], connection: watcher, expect: {equals: OK}}
    - {command: [SET, foo, bar], expect: {equals: OK}}
    - {command: [DELIFEQ, foo, nomatch], expect: {equals: 0}}
    - {command: [GET, foo], expect: {equals: bar}}
    - {command: [DELIFEQ, missingkey, bar], expect: {equals: 0}}
    - {command: [DELIFEQ, foo, bar], expect: {equals: 1}}
    - {command: [DELIFEQ, wk, wv], expect: {equals: 1}}
    - {command: [MULTI], connection: watcher, expect: {equals: OK}}
    - {command: [SET, tx, "1"], connection: watcher, expect: {equals: QUEUED}}
    - {command: [EXEC], connection: watcher, expect_difference: true, expect: {equals: null}}
    - {read: true, connection: sub, expect_difference: true, expect: {exists: true}}
    - {command: [WAIT, 1, 5000], expect: {equals: 1}}
    - {command: [GET, foo], node: 1, wait_s: 10, expect_difference: true, expect: {
        equals: null}}
    - {command: [ACL, SETUSER, wuser, on, ">pw", "%W~foo2", "+delifeq"], expect: {
        equals: OK}}
    - {command: [SET, foo2, v2], expect: {equals: OK}}
    - {command: [AUTH, wuser, pw], connection: wonly, expect: {equals: OK}}
    - {command: [DELIFEQ, foo2, v2], connection: wonly, expect_difference: true, expect: {
        equals: 1}}
    - {command: [COMMAND, GETKEYSANDFLAGS, DELIFEQ, k, v], expect_difference: true,
      expect: {equals: [["k", ["RM", "delete"]]]}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [delifeq.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: delifeq}
