extends: [valkey.liveness]
id: proposed.geoadd-zadd-replication
deployment:
  modes: [standalone]
metadata:
  description: GEOADD rewritten to the shared ZADD vector propagates correctly over
    a replication link, alone and inside MULTI/EXEC
components:
- use: valkey.action.commands
  id: geoadd-repl
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 60
    commands:
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [GEOADD, geo, "13.361389", "38.115556", Palermo, "15.087269", "37.502669",
        Catania], node: 0, expect: {equals: 2}}
    - {command: [GEOADD, geo, "181", "0", bad], node: 0, expect: {error: "invalid\
          \ longitude"}}
    - {command: [GEOADD, geo, "2.349014", "48.864716", Paris], node: 0, expect: {
        equals: 1}}
    - {command: [ZCARD, geo], node: 1, wait_s: 30, expect: {equals: 3}}
    - {command: [ZSCORE, geo, Palermo], node: 0, expect: {exists: true}}
    - {command: [ZSCORE, geo, Palermo], node: 1, expect: {exists: true}}
    - {command: [MULTI], node: 0, expect: {equals: OK}}
    - {command: [GEOADD, geo, "1", "1", m1], node: 0, expect: {equals: QUEUED}}
    - {command: [GEOADD, geo, "2", "2", m2], node: 0, expect: {equals: QUEUED}}
    - {command: [EXEC], node: 0, expect: {exists: true}}
    - {command: [ZCARD, geo], node: 1, wait_s: 30, expect: {equals: 5}}
    - {command: [ZRANGE, geo, 0, -1], node: 1, expect: {exists: true}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [geoadd-repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: geoadd-repl}
