extends: [valkey.liveness]
id: proposed.watch-expired-key-dirty
deployment:
  modes: [standalone]
metadata:
  description: >-
    A replica must dirty every client WATCHing a logically expired key when the primary's
    overwrite of that key arrives; the parent's stray break in touchWatchedKey skipped
    the expired watcher and every watcher after it.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: watchdirty
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 120
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [SET, x, v1, PX, 5000], node: 0, expect: {equals: OK}}
    - {command: [EXISTS, x], node: 1, wait_s: 15, expect: {equals: 1}}
    - {command: [CLIENT, PAUSE, 60000, WRITE], node: 1, expect: {equals: OK}}
    - {command: [SET, x, v2], node: 0, expect: {equals: OK}}
    - {command: [EXISTS, x], node: 1, wait_s: 15, expect: {equals: 0}}
    - {command: [WATCH, x], node: 1, connection: w1, expect: {equals: OK}}
    - {command: [WATCH, x], node: 1, connection: w2, expect: {equals: OK}}
    - {command: [CLIENT, UNPAUSE], node: 1, expect: {equals: OK}}
    - {command: [GET, x], node: 1, wait_s: 15, expect: {equals: v2}}
    - {command: [MULTI], node: 1, connection: w1, expect: {equals: OK}}
    - {command: [GET, x], node: 1, connection: w1, expect: {equals: QUEUED}}
    - {command: [EXEC], node: 1, connection: w1, expect_difference: true, expect: {
        equals: null}}
    - {command: [MULTI], node: 1, connection: w2, expect: {equals: OK}}
    - {command: [GET, x], node: 1, connection: w2, expect: {equals: QUEUED}}
    - {command: [EXEC], node: 1, connection: w2, expect_difference: true, expect: {
        equals: null}}
    - {command: [SET, y, u1, PX, 5000], node: 0, expect: {equals: OK}}
    - {command: [EXISTS, y], node: 1, wait_s: 15, expect: {equals: 1}}
    - {command: [CLIENT, PAUSE, 60000, WRITE], node: 1, expect: {equals: OK}}
    - {command: [SET, y, u2], node: 0, expect: {equals: OK}}
    - {command: [EXISTS, y], node: 1, wait_s: 15, expect: {equals: 0}}
    - {command: [WATCH, y], node: 1, connection: wa, expect: {equals: OK}}
    - {command: [CLIENT, UNPAUSE], node: 1, expect: {equals: OK}}
    - {command: [GET, y], node: 1, wait_s: 15, expect: {equals: u2}}
    - {command: [WATCH, y], node: 1, connection: wb, expect: {equals: OK}}
    - {command: [SET, y, u3], node: 0, expect: {equals: OK}}
    - {command: [GET, y], node: 1, wait_s: 15, expect: {equals: u3}}
    - {command: [MULTI], node: 1, connection: wb, expect: {equals: OK}}
    - {command: [GET, y], node: 1, connection: wb, expect: {equals: QUEUED}}
    - {command: [EXEC], node: 1, connection: wb, expect_difference: true, expect: {
        equals: null}}
    - {command: [MULTI], node: 1, connection: wa, expect: {equals: OK}}
    - {command: [GET, y], node: 1, connection: wa, expect: {equals: QUEUED}}
    - {command: [EXEC], node: 1, connection: wa, expect_difference: true, expect: {
        equals: null}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [watchdirty.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: watchdirty}
