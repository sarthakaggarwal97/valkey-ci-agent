extends: [valkey.liveness]
id: proposed.dict-resize-avoid-precision
deployment:
  modes: [standalone]
metadata:
  description: Under DICT_RESIZE_AVOID (live BGSAVE child) a dict must expand at used
    >= 5*size; the parent's integer division delays it to 6*size. A 16-bucket hash
    dict filled to 95 fields during a slow BGSAVE expands on the fixed build (DEBUG
    HTSTATS-KEY shows table size 128) and stays at 16 buckets on the parent.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: resize
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server_config:
      enable-debug-command: "yes"
      hash-max-listpack-entries: 0
      save: ""
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - {command: [CONFIG, SET, rdb-key-save-delay, "500000"], expect: {equals: OK}}
    - {command: [MSET, k0, x, k1, x, k2, x, k3, x, k4, x, k5, x, k6, x, k7, x, k8,
        x, k9, x, k10, x, k11, x, k12, x, k13, x, k14, x, k15, x, k16, x, k17, x,
        k18, x, k19, x, k20, x, k21, x, k22, x, k23, x, k24, x, k25, x, k26, x, k27,
        x, k28, x, k29, x, k30, x, k31, x, k32, x, k33, x, k34, x, k35, x, k36, x,
        k37, x, k38, x, k39, x], expect: {equals: OK}}
    - {command: [HSET, h, f0, v], expect: {equals: 1}}
    - {command: [HSET, h, f1, v], expect: {equals: 1}}
    - {command: [HSET, h, f2, v], expect: {equals: 1}}
    - {command: [HSET, h, f3, v], expect: {equals: 1}}
    - {command: [HSET, h, f4, v], expect: {equals: 1}}
    - {command: [HSET, h, f5, v], expect: {equals: 1}}
    - {command: [HSET, h, f6, v], expect: {equals: 1}}
    - {command: [HSET, h, f7, v], expect: {equals: 1}}
    - {command: [HSET, h, f8, v], expect: {equals: 1}}
    - {command: [HSET, h, f9, v], expect: {equals: 1}}
    - {command: [HSET, h, f10, v], expect: {equals: 1}}
    - {command: [HSET, h, f11, v], expect: {equals: 1}}
    - {command: [HSET, h, f12, v], expect: {equals: 1}}
    - {command: [HSET, h, f13, v], expect: {equals: 1}}
    - {command: [HSET, h, f14, v], expect: {equals: 1}}
    - {command: [HSET, h, f15, v], expect: {equals: 1}}
    - {command: [DEBUG, HTSTATS-KEY, h], compare: skip, expect: {contains: "table\
          \ size: 16"}}
    - {command: [BGSAVE], expect: {contains: "Background saving started"}}
    - {command: [INFO, persistence], compare: skip, expect: {contains: "rdb_bgsave_in_progress:1"}}
    - {command: [HSET, h, f16, v], expect: {equals: 1}}
    - {command: [HSET, h, f17, v], expect: {equals: 1}}
