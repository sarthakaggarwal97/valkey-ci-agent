extends: [valkey.liveness]
id: proposed.delex-replication
deployment:
  modes: [standalone]
metadata:
  description: DELEX deletes propagate to a replica as DEL; conditional non-deletes
    propagate nothing
components:
- use: valkey.action.commands
  id: repl
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 120
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [SET, rk, rv], node: 0, expect: {equals: OK}}
    - {command: [SET, rk2, rv2], node: 0, expect: {equals: OK}}
    - {command: [SET, rk3, rv3], node: 0, expect: {equals: OK}}
    - {command: [DELEX, rk, IFEQ, rv], node: 0, expect_difference: true, expect: {
        equals: 1}}
    - {command: [DELEX, rk2, IFNE, other], node: 0, expect_difference: true, expect: {
        equals: 1}}
    - {command: [DELEX, rk3, IFEQ, wrong], node: 0, expect_difference: true, expect: {
        equals: 0}}
    - {command: [EXISTS, rk], node: 1, wait_s: 15, expect_difference: true, expect: {
        equals: 0}}
    - {command: [EXISTS, rk2], node: 1, wait_s: 15, expect_difference: true, expect: {
        equals: 0}}
    - {command: [GET, rk3], node: 1, wait_s: 15, expect: {equals: rv3}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
