extends: [valkey.base]
id: proposed.cluster-sigterm-restart
deployment:
  modes: [cluster]
  replicas_per_primary: {minimum: 1}
metadata:
  description: SIGTERM a cluster node under writes and restart it immediately; shutdown
    must save nodes.conf and release its lock so the node rejoins with role and slots
    intact
inputs:
  properties:
    instance: {type: string, enum: [primary, replica], default: primary}
    restart_delay_s: {type: number, minimum: 0, maximum: 10, default: 0}
components:
- use: valkey.fault.process-signal
  id: sigterm-node
  config:
    when_event: warm-up.completed
    instance: {$ref: inputs.instance}
    signal: SIGTERM
    restart_mode: immediate
    restart_delay_s: {$ref: inputs.restart_delay_s}
    capture_cluster_vars: true
- use: valkey.action.sleep
  id: warm-up
  depends_on: [writes, sigterm-node]
  config: {seconds: 2}
- use: valkey.action.sleep
  id: settle
  depends_on: [warm-up]
  config: {seconds: 8}
required_events: [warm-up.completed]
required_evidence:
- {evidence_id: valkey.fault.injected, source: sigterm-node}
