extends: [valkey.liveness]
id: proposed.cluster-forget-readd-no-crash
deployment:
  modes: [standalone]
metadata:
  description: A forgotten node re-added via MEET while still being gossiped as forgotten
    must not crash the peer when it is added to the blacklist a second time
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: forget-readd
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 3
    resp: {$ref: inputs.resp}
    timeout_s: 20
    commands:
    - {command: [CLUSTER, FORGET, "<node.2.id>"], node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, FORGET, "<node.2.id>"], node: 1, expect: {equals: OK}}
    - {command: [CLUSTER, MEET, "<node.1.host>", "<node.1.port>"], node: 2, expect: {
        equals: OK}}
    - {command: [BLPOP, __fuzzer_absent_key__, 8], node: 1, expect_difference: true,
      expect: {equals: null}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [forget-readd.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: forget-readd}
