extends: [valkey.liveness]
id: proposed.cluster-forgotten-gossip-two-forgetters
deployment:
  modes: [standalone, cluster]
metadata:
  description: Two peers gossiping FORGOTTEN_NODE for a re-known, already-blacklisted
    node must not crash the receiver
inputs:
  required: [parent]
  properties:
    parent:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "The parent commit's build, {$ref: artifacts.parent.binary}"
components:
- use: valkey.action.commands
  id: forget
  config:
    compare_with: {$ref: inputs.parent}
    cluster: true
    nodes: 4
    timeout_s: 60
    commands:
    - {command: [CLUSTER, FORGET, "<node.3.id>"], node: 1, wait_s: 30, expect: {equals: OK}}
    - {command: [CLUSTER, FORGET, "<node.3.id>"], node: 2, wait_s: 30, expect: {equals: OK}}
    - {command: [CLUSTER, FORGET, "<node.3.id>"], node: 0, wait_s: 30, expect: {equals: OK}}
    - {command: [CLUSTER, MEET, "<node.3.host>", "<node.3.port>"], node: 0, expect: {
        equals: OK}}
    - {command: [PING], node: 0, wait_s: 30, expect_difference: true, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_evidence:
- {evidence_id: valkey.command.sequence, source: forget}
