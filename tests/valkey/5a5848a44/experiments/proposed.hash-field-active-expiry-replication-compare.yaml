extends: [valkey.liveness]
id: proposed.hash-field-active-expiry-replication-compare
deployment:
  modes: [standalone]
metadata:
  description: Active expiry of hash fields on a primary propagates HDEL for expired
    fields and DEL for fully-expired keys to its replica
components:
- use: valkey.action.commands
  id: repl
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 150
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [HSET, big, f1, v1, f2, v2, f3, v3, f4, v4], expect: {equals: 4}}
    - {command: [HEXPIREAT, big, 33278400000, FIELDS, 1, f4], expect: {equals: [1]}}
    - {command: [HPEXPIRE, big, 300, FIELDS, 2, f1, f2], expect: {equals: [1, 1]}}
    - {command: [HSETEX, solo, PX, 300, FIELDS, 1, f1, v1], expect: {exists: true}}
    - {command: [EXISTS, solo], wait_s: 30, expect_difference: true, expect: {equals: 0}}
    - {command: [DBSIZE], node: 1, wait_s: 30, expect_difference: true, expect: {
        equals: 1}}
    - {command: [HLEN, big], compare: skip}
    - {command: [HLEN, big], node: 1, compare: skip}
    - {command: [HGET, big, f3], node: 1, expect: {equals: v3}}
    - {command: [HEXPIRETIME, big, FIELDS, 1, f4], node: 1, expect: {equals: [33278400000]}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
