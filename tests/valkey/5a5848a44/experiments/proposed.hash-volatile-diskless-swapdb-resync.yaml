extends: [valkey.liveness]
id: proposed.hash-volatile-diskless-swapdb-resync
deployment:
  modes: [standalone]
metadata:
  description: A full sync with repl-diskless-load swapdb must swap keys_with_volatile_items
    into the active db and discard the old tracking tables, keeping field TTLs intact
    on the replica
components:
- use: valkey.action.commands
  id: swapload
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 120
    commands:
    - {command: [CONFIG, SET, repl-diskless-sync, "yes"], node: 0, expect: {equals: OK}}
    - {command: [CONFIG, SET, repl-diskless-sync-delay, 0], node: 0, expect: {equals: OK}}
    - {command: [CONFIG, SET, repl-diskless-load, swapdb], node: 1, expect: {equals: OK}}
    - {command: [HSET, localh, a, b], node: 1, expect: {equals: 1}}
    - {command: [HPEXPIREAT, localh, 33272455800000, FIELDS, 1, a], node: 1, expect: {
        equals: [1]}}
    - {command: [HSET, bh, f1, v1, f2, v2, f3, v3], node: 0, expect: {equals: 3}}
    - {command: [HPEXPIREAT, bh, 33272455800000, FIELDS, 2, f1, f2], node: 0, expect: {
        equals: [1, 1]}}
    - {command: [SET, s1, v, EX, 10000], node: 0, expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, compare: skip, wait_s: 40, expect: {
        contains: "master_link_status:up"}}
    - {command: [HGETALL, bh], node: 1, compare: unordered-pairs}
    - {command: [HPEXPIRETIME, bh, FIELDS, 3, f1, f2, f3], node: 1, expect: {equals: [
          33272455800000, 33272455800000, -1]}}
    - {command: [EXISTS, localh], node: 1, expect: {equals: 0}}
    - {command: [INFO, keyspace], node: 1, expect_difference: true, expect: {contains: "keys_with_volatile_items=1"}}
    checks:
      acl: true
      compat: true
      variants: true
required_events: [swapload.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: swapload}
