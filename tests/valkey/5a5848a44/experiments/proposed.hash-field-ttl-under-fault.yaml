extends: [valkey.base]
id: proposed.hash-field-ttl-under-fault
deployment:
  modes: [standalone]
  replicas_per_primary: {minimum: 1}
metadata:
  description: Seed hashes with mixed-TTL volatile fields (defrag enabled), let active
    expiry run and propagate HDELs, then kill and restart a node under writes; ledger,
    deployment-state and liveness judge recovery
inputs:
  properties:
    target: {type: string, enum: [primary, replica], default: replica}
    signal: {type: string, enum: [SIGKILL, SIGTERM, SIGSTOP], default: SIGKILL}
components:
- use: valkey.fault.process-signal
  id: kill-node
  config:
    when_event: ripen.completed
    instance: {$ref: inputs.target}
    signal: {$ref: inputs.signal}
    restart_mode: immediate
- use: valkey.action.commands
  id: seed
  depends_on: [writes, kill-node]
  config:
    instances: primaries
    timeout_s: 60
    commands:
    - {command: [CONFIG, SET, activedefrag, "yes"], expect: {exists: true}}
    - {command: [CONFIG, SET, active-defrag-ignore-bytes, "1048576"], expect: {exists: true}}
    - {command: [CONFIG, SET, active-defrag-threshold-lower, "1"], expect: {exists: true}}
    - {command: [HSET, bigh, g1, a1, g2, a2, g3, a3, g4, a4, g5, a5, g6, a6, g7, a7,
        g8, a8, g9, a9, g10, a10, g11, a11, g12, a12, g13, a13, g14, a14, g15, a15,
        g16, a16, g17, a17, g18, a18, g19, a19, g20, a20, g21, a21, g22, a22, g23,
        a23, g24, a24, g25, a25, g26, a26, g27, a27, g28, a28, g29, a29, g30, a30,
        g31, a31, g32, a32], expect: {equals: 32}}
    - {command: [HEXPIREAT, bigh, 33278400000, FIELDS, 8, g1, g2, g3, g4, g5, g6,
        g7, g8], expect: {exists: true}}
    - {command: [HPEXPIRE, bigh, 900, FIELDS, 8, g9, g10, g11, g12, g13, g14, g15,
        g16], expect: {exists: true}}
    - {command: [HDEL, bigh, g29, g30, g31, g32], expect: {equals: 4}}
    - {command: [HSETEX, solo1, PX, 800, FIELDS, 1, f, v], expect: {exists: true}}
    - {command: [HSETEX, solo2, PX, 3500, FIELDS, 1, f, v], expect: {exists: true}}
    - {command: [HSET, keeper, f1, v1, f2, v2], expect: {equals: 2}}
    - {command: [HEXPIRE, keeper, 100, FIELDS, 1, f1], expect: {exists: true}}
    - {command: [BGREWRITEAOF], expect: {exists: true}}
- use: valkey.action.sleep
  id: ripen
  depends_on: [seed]
  config: {seconds: 3}
- use: valkey.action.sleep
  id: settle
  depends_on: [ripen]
  config: {seconds: 6}
- use: valkey.oracle.ledger
  id: data
  config: {workload: writes, loss_window_s: 2.5}
required_events: [seed.completed, ripen.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: seed}
- {evidence_id: valkey.fault.injected, source: kill-node}
