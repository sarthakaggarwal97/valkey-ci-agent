extends: [valkey.base]
id: proposed.cluster-bus-eagain-on-paused-peer
deployment:
  modes: [cluster]
  replicas_per_primary: {minimum: 1}
metadata:
  description: Pause a cluster node with SIGSTOP so its bus socket stops draining
    while every peer keeps gossiping and broadcasting cluster-wide PUBLISH to it,
    filling a peer's bus send buffer until connWrite returns EAGAIN on a still-connected
    link (clusterWriteHandler), then resume it and verify no link teardown, no crash,
    and no acknowledged write lost.
inputs:
  properties:
    pause_s: {type: number, default: 6}
    command_rate: {type: number, default: 5000}
components:
- use: valkey.fault.process-signal
  id: stop-replica
  config:
    when_event: warm-up.completed
    instance: replica
    signal: SIGSTOP
    pause_s: {$ref: inputs.pause_s}
- use: valkey.workload.command-table
  id: buscmds
  config:
    rate: {$ref: inputs.command_rate}
- use: valkey.action.sleep
  id: warm-up
  depends_on: [writes, stop-replica, buscmds]
  config: {seconds: 2}
- use: valkey.action.sleep
  id: settle
  depends_on: [warm-up]
  config: {seconds: 10}
- use: valkey.oracle.ledger
  id: data
  config: {workload: writes}
required_events: [warm-up.completed]
required_evidence:
- {evidence_id: valkey.fault.injected, source: stop-replica}
