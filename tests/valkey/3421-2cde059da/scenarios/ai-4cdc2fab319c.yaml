# Proposed by valkey-ci-agent for valkey-io/valkey cf05c0d28ebe..2cde059da1b7.
# Checked with `valkey-fuzzer validate`; run it with `valkey-fuzzer run`.
scenario_id: ai-4cdc2fab319c
seed: 7000
experiment:
  id: valkey.cluster-chaos
  inputs:
    command_rate: 15000
    keys_per_slot: 20
    waves:
    - - op: kill
        target: any
        signal: SIGKILL
      - op: failover
        shard: 0
        delay_s: 1.0
      - op: failover
        shard: 3
        force: true
        delay_s: 0.5
    - - op: failover
        shard: 1
        force: true
      - op: kill
        target: replica
        after: 0
        delay_s: 0.5
    - - op: failover
        shard: 2
        delay_s: 0.5
      - op: kill
        target: primary
        signal: SIGKILL
deployment:
  mode: cluster
  primaries: 7
  replicas_per_primary: 2
  base_port: 7000
  server_config:
    cluster-ping-interval: 20
