scenario_id: ai-160036234c40
seed: 7100
experiment:
  id: valkey.cluster-chaos
  inputs:
    command_rate: 12000
    keys_per_slot: 30
    waves:
    - - op: failover
        shard: 0
        force: true
        delay_s: 0.5
      - op: kill
        target: replica
        signal: SIGKILL
    - - op: failover
        shard: 1
        force: true
        delay_s: 0.3
      - op: kill
        target: replica
        signal: SIGTERM
