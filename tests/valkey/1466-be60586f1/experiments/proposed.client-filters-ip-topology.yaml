extends: [valkey.liveness]
id: proposed.client-filters-ip-topology
deployment:
  modes: [standalone]
metadata:
  description: IP filter full-match path (IP matched up to the port colon) and FLAGS
    N/S/M matching, against guaranteed-TCP clients made by MIGRATE and REPLICAOF
components:
- use: valkey.action.commands
  id: iptopo
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 90
    commands:
    - {command: [SET, mkey, v], expect: {equals: OK}}
    - {command: [MIGRATE, <node.1.host>, <node.1.port>, mkey, 0, 5000], expect: {
        equals: OK}}
    - {node: 1, command: [GET, mkey], expect: {equals: v}}
    - {node: 1, command: [CLIENT, LIST, FLAGS, N], expect_difference: true, expect: {
        contains: "flags=N"}}
    - {node: 1, command: [CLIENT, LIST, IP, 127.0.0.1], expect_difference: true, expect: {
        contains: "flags=N"}}
    - {node: 1, command: [CLIENT, LIST, FLAGS, N, IP, 127.0.0.1], expect_difference: true,
      expect: {contains: "flags=N"}}
    - {node: 1, command: [CLIENT, LIST, IP, 127.0.0], expect_difference: true, expect: {
        equals: ""}}
    - {node: 1, command: [REPLICAOF, <node.0.host>, <node.0.port>], expect: {equals: OK}}
    - {node: 1, command: [INFO, replication], wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [CLIENT, LIST, TYPE, replica, IP, 127.0.0.1], expect_difference: true,
      expect: {contains: "flags=S"}}
    - {node: 1, command: [CLIENT, LIST, FLAGS, M], expect_difference: true, expect: {
        contains: "flags=M"}}
    - {command: [CLIENT, KILL, TYPE, replica, IP, 127.0.0.1], expect_difference: true,
      expect: {min: 1}}
    - {node: 1, command: [INFO, replication], wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {node: 1, command: [REPLICAOF, NO, ONE], expect: {equals: OK}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [iptopo.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: iptopo}
