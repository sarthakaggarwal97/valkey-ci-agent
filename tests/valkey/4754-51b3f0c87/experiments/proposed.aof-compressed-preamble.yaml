extends: [valkey.liveness]
id: proposed.aof-compressed-preamble
deployment:
  modes: [standalone]
metadata:
  description: >-
    BGREWRITEAOF with rdbcompression lz4 writes a streaming-compressed (VCS) RDB base
    that reloads after a restart, and a disk-based compressed sync RDB is adopted
    as the replica's AOF base (aof_rewrites stays 0) where the parent falls back to
    BGREWRITEAOF; the adopted base plus the incremental AOF reload after a replica
    restart.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: aof-preamble
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 60
    server_config:
      appendonly: "yes"
      aof-use-rdb-preamble: "yes"
      rdbcompression: lz4
      repl-compression: lz4
      repl-diskless-sync: "no"
      save: ""
    commands:
    - {command: [DEBUG, POPULATE, 1000], node: 0, expect: {equals: OK}}
    - {command: [BGREWRITEAOF], node: 0, expect: {contains: "rewriting started"}}
    - {command: [INFO, persistence], node: 0, wait_s: 30, expect: {contains: "aof_rewrite_in_progress:0"},
      compare: skip}
    - {command: [INFO, persistence], node: 0, expect_difference: true, expect: {contains: "aof_rewrites:1"}}
    - {restart: true, node: 0}
    - {command: [DBSIZE], node: 0, expect: {equals: 1000}}
    - {command: [GET, "key:7"], node: 0, expect: {equals: "value:7"}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 60, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [INFO, persistence], node: 1, wait_s: 10, expect_difference: true,
      expect: {contains: "aof_rewrites:0"}}
    - {command: [SET, after-sync, tail], node: 0, expect: {equals: OK}}
    - {command: [GET, after-sync], node: 1, wait_s: 10, expect: {equals: tail}}
    - {restart: true, node: 1}
    - {command: [DBSIZE], node: 1, expect: {equals: 1001}}
    - {command: [GET, after-sync], node: 1, expect: {equals: tail}}
    - {command: [GET, "key:999"], node: 1, expect: {equals: "value:999"}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [aof-preamble.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: aof-preamble}
