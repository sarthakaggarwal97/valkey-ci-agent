extends: [valkey.liveness]
id: proposed.increx-replication
deployment:
  modes: [standalone]
metadata:
  description: INCREX propagation to a live replica (SET PXAT rewrite, BYFLOAT determinism,
    NX/XX no-ops, EXAT delete) and AOF reload across a restart
components:
- use: valkey.action.commands
  id: repl
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 15
    server_config: {appendonly: "yes", appendfsync: always}
    commands:
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [SET, base, 1], expect: {equals: OK}}
    - {command: [INCREX, k1, EX, 100, BYINT, 5], expect_difference: true, expect: {
        equals: [5, 5]}}
    - {command: [INCREX, f1, BYFLOAT, 0.1], expect_difference: true, expect: {error: false}}
    - {command: [INCREX, f1, BYFLOAT, 0.2], expect_difference: true, expect: {error: false}}
    - {command: [SET, nk, 7], expect: {equals: OK}}
    - {command: [INCREX, nk, NX], expect_difference: true, expect: {equals: [7, 0]}}
    - {command: [INCREX, xg, XX, BYINT, 9], expect_difference: true, expect: {equals: [
          0, 0]}}
    - {command: [SET, dk, 5], expect: {equals: OK}}
    - {command: [INCREX, dk, EXAT, 1], expect_difference: true, expect: {equals: [
          6, 1]}}
    - {command: [WAIT, 1, 10000], expect: {equals: 1}}
    - {command: [GET, k1], node: 1, expect_difference: true, expect: {equals: "5"}}
    - {command: [TTL, k1], node: 1, compare: skip, expect: {min: 1, max: 100}}
    - {command: [GET, f1], node: 1, expect_difference: true, expect: {equals: "0.3"}}
    - {command: [GET, nk], node: 1, expect: {equals: "7"}}
    - {command: [EXISTS, xg], node: 1, expect: {equals: 0}}
    - {command: [EXISTS, dk], node: 1, expect_difference: true, expect: {equals: 0}}
    - {restart: true, node: 0}
    - {command: [GET, k1], node: 0, expect_difference: true, expect: {equals: "5"}}
    - {command: [TTL, k1], node: 0, compare: skip, expect: {min: 1, max: 100}}
    - {command: [GET, f1], node: 0, expect_difference: true, expect: {equals: "0.3"}}
    - {command: [GET, nk], node: 0, expect: {equals: "7"}}
    - {command: [EXISTS, dk], node: 0, expect_difference: true, expect: {equals: 0}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
