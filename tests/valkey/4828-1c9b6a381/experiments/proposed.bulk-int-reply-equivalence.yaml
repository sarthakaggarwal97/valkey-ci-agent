extends: [valkey.liveness]
id: proposed.bulk-int-reply-equivalence
deployment:
  modes: [standalone]
metadata:
  description: Bulk integer replies stay byte-identical after the single-buffer rewrite
    of addReplyBulkLongLong, at every digit-count boundary (1, 9, 10, 11, 19 and 20
    digits, INT64_MIN/MAX, 2^31, 2^32) and on every caller path - direct (LINDEX,
    HGET, SMEMBERS, ZRANGE, SCAN cursor), write-prepared (LRANGE on listpack and quicklist),
    deferred (LMPOP), and a MULTI/EXEC reply that crosses the 16KB output buffer into
    the reply list
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    io_threads: {type: integer, enum: [1, 2, 4], default: 1}
components:
- use: valkey.action.commands
  id: bulkint
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server_config:
      list-max-listpack-size: 128
      io-threads: {$ref: inputs.io_threads}
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
    - {command: [RPUSH, small, 0, 9, 10, 99, 100, 999999999, 1000000000, -9, -99999999,
        -999999999, -1000000000, 2147483647, 2147483648, -2147483648, 4294967295,
        4294967296, 9223372036854775807, -9223372036854775808], expect: {equals: 18}}
    - {command: [LRANGE, small, 0, -1], expect: {equals: ["0", "9", "10", "99", "100",
          "999999999", "1000000000", "-9", "-99999999", "-999999999", "-1000000000",
          "2147483647", "2147483648", "-2147483648", "4294967295", "4294967296", "9223372036854775807",
          "-9223372036854775808"]}}
    - {command: [LINDEX, small, 16], expect: {equals: "9223372036854775807"}}
    - {command: [LINDEX, small, 17], expect: {equals: "-9223372036854775808"}}
    - {command: [LPOP, small], expect: {equals: "0"}}
    - {command: [RPOP, small], expect: {equals: "-9223372036854775808"}}
    - {command: [SADD, s, 0, 9, 10, 99, 100, 999999999, 1000000000, -9, -99999999,
        -999999999, -1000000000, 2147483647, 2147483648, -2147483648, 4294967295,
        4294967296, 9223372036854775807, -9223372036854775808], expect: {equals: 18}}
    - {command: [SMEMBERS, s], compare: unordered}
    - {command: [SINTER, s, s], compare: unordered}
    - {command: [HSET, h, f1, 999999999, f2, 1000000000, f3, -9223372036854775808,
        f4, 0], expect: {equals: 4}}
    - {command: [HGET, h, f3], expect: {equals: "-9223372036854775808"}}
    - {command: [HGETALL, h], compare: unordered-pairs}
    - {command: [HVALS, h], compare: unordered}
    - {command: [ZADD, z, 1, 999999999, 2, 1000000000, 3, -9223372036854775808, 4,
        9223372036854775807], expect: {equals: 4}}
    - {command: [ZRANGE, z, 0, -1], expect: {equals: ["999999999", "1000000000", "-9223372036854775808",
          "9223372036854775807"]}}
    - {command: [SCAN, 0, COUNT, 100], compare: skip}
    - {command: [RPUSH, big, 9223372036854775807, -9223372036854775808, 1000000000,
        -999999999, 999999999, 9223372036854775807, -9223372036854775808, 1000000000,
        -999999999, 999999999, 9223372036854775807, -9223372036854775808, 1000000000,
        -999999999, 999999999, 9223372036854775807, -9223372036854775808, 1000000000,
        -999999999, 999999999, 9223372036854775807, -9223372036854775808, 1000000000,
        -999999999, 999999999, 9223372036854775807, -9223372036854775808, 1000000000,
        -999999999, 999999999, 9223372036854775807, -9223372036854775808, 1000000000,
        -999999999, 999999999, 9223372036854775807, -9223372036854775808, 1000000000,
        -999999999, 999999999], expect: {equals: 40}}
    - {command: [RPUSH, big, 9223372036854775807, -9223372036854775808, 1000000000,
        -999999999, 999999999, 9223372036854775807, -9223372036854775808, 1000000000,
        -999999999, 999999999, 9223372036854775807, -9223372036854775808, 1000000000,
        -999999999, 999999999, 9223372036854775807, -9223372036854775808, 1000000000,
        -999999999, 999999999, 9223372036854775807, -9223372036854775808, 1000000000,
        -999999999, 999999999, 9223372036854775807, -9223372036854775808, 1000000000,
        -999999999, 999999999, 9223372036854775807, -9223372036854775808, 1000000000,
        -999999999, 999999999, 9223372036854775807, -9223372036854775808, 1000000000,
        -999999999, 999999999]}
    - {command: [RPUSH, big, 9223372036854775807, -9223372036854775808, 1000000000,
        -999999999, 999999999, 9223372036854775807, -9223372036854775808, 1000000000,
