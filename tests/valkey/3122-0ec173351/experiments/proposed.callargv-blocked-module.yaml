extends: [valkey.liveness]
id: proposed.callargv-blocked-module
deployment:
  modes: [standalone]
metadata:
  description: VM_CallArgv blocking, fire-and-forget, nested-call and reworked promise
    refcount paths via blockedclient.so, with replication of module-call writes to
    a replica, compared with the parent build
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: callargv
  config:
    compare_with: {$ref: artifacts.parent.binary}
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 90
    commands:
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [SET, seed, x], expect: {equals: OK}}
    - {command: [GET, seed], node: 1, wait_s: 30, expect: {equals: x}}
    - {command: [do_rm_call_fire_and_forget, blpop, rl, 0], expect: {equals: Blocked}}
    - {command: [LPUSH, rl, a], expect: {equals: 1}}
    - {command: [LLEN, rl], expect: {equals: 0}}
    - {command: [do_rm_call_async, get, seed], expect: {equals: x}}
    - {command: [do_vm_call_argv_async, acquire_gil], expect_difference: true, expect: {
        equals: OK}}
    - {command: [do_vm_call_argv_async, set, k1, v1], expect_difference: true, expect: {
        equals: OK}}
    - {command: [GET, k1], expect_difference: true, expect: {equals: v1}}
    - {command: [WAIT, 1, 5000], expect: {min: 1}}
    - {command: [GET, k1], node: 1, expect_difference: true, expect: {equals: v1}}
    - {command: [do_vm_call_argv_fire_and_forget, blpop, l2, 0], expect_difference: true,
      expect: {equals: Blocked}}
    - {command: [LPUSH, l2, b], expect: {equals: 1}}
    - {command: [LLEN, l2], expect_difference: true, expect: {equals: 0}}
    - {command: [WAIT, 1, 5000], expect: {min: 1}}
    - {command: [LLEN, l2], node: 1, expect_difference: true, expect: {equals: 0}}
    - {command: [do_vm_call_argv_async_no_replicate, set, k3, v3], expect_difference: true,
      expect: {equals: OK}}
    - {command: [GET, k3], expect_difference: true, expect: {equals: v3}}
    - {command: [WAIT, 1, 5000], expect: {min: 1}}
    - {command: [EXISTS, k3], node: 1, expect: {equals: 0}}
    - {command: [RPUSH, l3, x], expect: {equals: 1}}
    - {command: [do_vm_call_argv_async, blpop, l3, 0], expect_difference: true, expect: {
        equals: [l3, x]}}
    - {command: [do_vm_call_argv_async, nosuchcommand], expect_difference: true, expect: {
        error: true}}
    - {command: [wait_and_do_vm_call_argv, set, wk, wv], expect_difference: true,
      expect: {equals: OK}}
    - {command: [GET, wk], expect_difference: true, expect: {equals: wv}}
    checks:
      acl: true
      compat: true
      variants: true
required_events: [callargv.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: callargv}
