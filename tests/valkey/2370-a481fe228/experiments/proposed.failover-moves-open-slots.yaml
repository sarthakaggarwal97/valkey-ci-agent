extends: [valkey.liveness]
id: proposed.failover-moves-open-slots
deployment:
  modes: [standalone]
metadata:
  description: >-
    After a takeover failover, an observer node that hears of the demotion only from
    the old primary must move its importing and migrating slot markers to the new
    primary (clusterMoveNodeSlots); the parent leaves them pointing at the demoted
    node.
inputs:
  required: [parent]
  properties:
    parent:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "The parent commit's build, {$ref: artifacts.parent.binary}"
components:
- use: valkey.action.commands
  id: moveslots
  config:
    compare_with: {$ref: inputs.parent}
    cluster: true
    nodes: 3
    timeout_s: 60
    commands:
    - {command: [CLUSTER, REPLICATE, "<node.0.id>"], node: 2, wait_s: 30, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 2, compare: skip, wait_s: 30, expect: {
        contains: "master_link_status:up"}}
    - {command: [CLUSTER, SETSLOT, 5462, IMPORTING, "<node.0.id>"], node: 1, expect: {
        equals: OK}}
    - {command: [CLUSTER, SETSLOT, 5462, MIGRATING, "<node.1.id>"], node: 0, expect: {
        equals: OK}}
    - {command: [CLUSTER, SETSLOT, 5462, NODE, "<node.1.id>"], node: 1, expect: {
        equals: OK}}
    - {command: [CLUSTER, SETSLOT, 5462, NODE, "<node.1.id>"], node: 0, expect: {
        equals: OK}}
    - {command: [CLUSTER, NODES], node: 2, compare: skip, wait_s: 30, expect: {contains: "5462"}}
    - {command: [CLUSTER, SETSLOT, 0, IMPORTING, "<node.0.id>"], node: 1, expect: {
        equals: OK}}
    - {command: [CLUSTER, SETSLOT, 0, MIGRATING, "<node.1.id>"], node: 0, expect: {
        equals: OK}}
    - {command: [CLUSTER, SETSLOT, 5462, MIGRATING, "<node.0.id>"], node: 1, expect: {
        equals: OK}}
    - {command: [CLUSTER, SETSLOT, 5462, IMPORTING, "<node.1.id>"], node: 0, expect: {
        equals: OK}}
    - {command: [CLUSTER, NODES], node: 1, compare: skip, expect: {contains: "[0-<-<node.0.id>]"}}
    - {command: [CLUSTER, NODES], node: 1, compare: skip, expect: {contains: "[5462->-<node.0.id>]"}}
    - {command: [DEBUG, DISABLE-CLUSTER-RECONNECTION, 1], node: 1, expect: {equals: OK}}
    - {command: [DEBUG, DISABLE-CLUSTER-RECONNECTION, 1], node: 2, expect: {equals: OK}}
    - {command: [DEBUG, CLUSTERLINK, KILL, ALL, "<node.2.id>"], node: 1, expect: {
        equals: OK}}
    - {command: [DEBUG, CLUSTERLINK, KILL, ALL, "<node.1.id>"], node: 2, expect: {
        equals: OK}}
    - {command: [CLUSTER, FAILOVER, TAKEOVER], node: 2, expect: {equals: OK}}
    - {command: [INFO, replication], node: 0, compare: skip, wait_s: 30, expect: {
        contains: "role:slave"}}
    - {command: [CLUSTER, NODES], node: 1, compare: skip, wait_s: 30, expect: {contains: "slave\
          \ <node.2.id>"}}
    - {command: [CLUSTER, NODES], node: 1, expect_difference: true, expect: {contains: "[0-<-<node.2.id>]"}}
    - {command: [CLUSTER, NODES], node: 1, expect_difference: true, expect: {contains: "[5462->-<node.2.id>]"}}
    - {command: [PING], node: 0, expect: {equals: PONG}}
    - {command: [PING], node: 1, expect: {equals: PONG}}
    - {command: [PING], node: 2, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [moveslots.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: moveslots}
