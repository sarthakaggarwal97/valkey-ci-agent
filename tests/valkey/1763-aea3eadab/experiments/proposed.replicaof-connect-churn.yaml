extends: [valkey.liveness]
id: proposed.replicaof-connect-churn
deployment:
  modes: [standalone]
metadata:
  description: REPLICAOF attach/detach cycles on four private servers drive many outgoing
    loopback connects through anetTcpGenericConnect, which now sets TCP_NODELAY at
    connect time
inputs:
  properties:
    dual_channel: {type: string, enum: ["yes", "no"], default: "no"}
components:
- use: valkey.action.commands
  id: churn
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server_config:
      dual-channel-replication-enabled: {$ref: inputs.dual_channel}
      repl-diskless-sync: "yes"
      repl-diskless-sync-delay: "0"
    nodes: 4
    timeout_s: 240
    commands:
    - {command: [SET, seed-key, v1], expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 2, expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 3, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [INFO, replication], node: 2, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [INFO, replication], node: 3, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [REPLICAOF, NO, ONE], node: 1, expect: {equals: OK}}
    - {command: [REPLICAOF, NO, ONE], node: 2, expect: {equals: OK}}
    - {command: [REPLICAOF, NO, ONE], node: 3, expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
