    - {command: [INFO, replication], node: 2, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [INFO, replication], node: 3, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [REPLICAOF, NO, ONE], node: 1, expect: {equals: OK}}
    - {command: [REPLICAOF, NO, ONE], node: 2, expect: {equals: OK}}
    - {command: [REPLICAOF, NO, ONE], node: 3, expect: {equals: OK}}
