extends: [valkey.liveness]
id: proposed.migrate-cached-socket
deployment:
  modes: [standalone]
metadata:
  description: MIGRATE over the cached blocking socket (migrateGetSocket lost its
    explicit TCP_NODELAY call) still moves keys and replies identically on both builds,
    including a second MIGRATE that reuses the cached socket
components:
- use: valkey.action.commands
  id: migrate
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 2
    timeout_s: 30
    commands:
    - {command: [SET, "{foo}a", v1], node: 0, expect: {equals: OK}}
    - {command: [SET, "{foo}b", v2], node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, SETSLOT, "12182", IMPORTING, "<node.0.id>"], node: 1, expect: {
        equals: OK}}
    - {command: [CLUSTER, SETSLOT, "12182", MIGRATING, "<node.1.id>"], node: 0, expect: {
        equals: OK}}
    - {command: [MIGRATE, "<node.1.host>", "<node.1.port>", "{foo}a", "0", "5000"],
      node: 0, expect: {equals: OK}}
    - {command: [MIGRATE, "<node.1.host>", "<node.1.port>", "", "0", "5000", KEYS,
        "{foo}b"], node: 0, expect: {equals: OK}}
    - {command: [CLUSTER, SETSLOT, "12182", NODE, "<node.1.id>"], node: 1, expect: {
        equals: OK}}
    - {command: [CLUSTER, SETSLOT, "12182", NODE, "<node.1.id>"], node: 0, expect: {
        equals: OK}}
    - {command: [EXISTS, "{foo}a"], node: 0, expect: {equals: 0}}
    - {command: [GET, "{foo}a"], node: 1, expect: {equals: v1}}
    - {command: [GET, "{foo}b"], node: 1, expect: {equals: v2}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [migrate.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: migrate}
