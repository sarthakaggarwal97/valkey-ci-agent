extends: [valkey.liveness]
id: proposed.hashtable-iter-prefetch
deployment:
  modes: [standalone]
metadata:
  description: >-
    Drive hashtableNext's new prefetch path on both builds: full-keyspace iteration
    via SAVE over a large rehashing keyspace, and set iteration (SORT, SMEMBERS) across
    grow and shrink rehash and at small table-boundary sizes, replies compared with
    the parent build.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    activerehashing: {type: string, enum: ["yes", "no"], default: "yes"}
components:
- use: valkey.action.commands
  id: iterate
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server_config:
      set-max-listpack-entries: 4
      activerehashing: {$ref: inputs.activerehashing}
    resp: {$ref: inputs.resp}
    timeout_s: 120
    commands:
    - {command: [DEBUG, POPULATE, 50000], expect: {equals: OK}}
    - {command: [DBSIZE], expect: {equals: 50000}}
    - {command: [SAVE], expect: {equals: OK}}
    - {command: [DEBUG, DIGEST]}
    - {command: [SADD, s1, a, b, c, d, e], expect: {equals: 5}}
    - {command: [SORT, s1, ALPHA], expect: {equals: [a, b, c, d, e]}}
    - {command: [SMEMBERS, s1], compare: unordered}
    - {command: [SADD, s2, a, b, c, d, e, f, g, h], expect: {equals: 8}}
    - {command: [SORT, s2, ALPHA], expect: {equals: [a, b, c, d, e, f, g, h]}}
    - {command: [SMEMBERS, s2], compare: unordered}
    - {command: [SADD, s3, a, b, c, d, e, f, g, h, i, j, k, l, m], expect: {equals: 13}}
    - {command: [SORT, s3, ALPHA], expect: {equals: [a, b, c, d, e, f, g, h, i, j,
          k, l, m]}}
    - {command: [SMEMBERS, s3], compare: unordered}
    - {command: [SADD, big, m100, m101, m102, m103, m104, m105, m106, m107, m108,
        m109, m110, m111, m112, m113, m114, m115, m116, m117, m118, m119, m120, m121,
        m122, m123, m124, m125, m126, m127, m128, m129, m130, m131, m132, m133, m134,
        m135, m136, m137, m138, m139, m140, m141, m142, m143, m144, m145, m146, m147,
        m148, m149, m150, m151, m152, m153, m154, m155, m156, m157, m158, m159], expect: {
        equals: 60}}
    - {command: [SADD, big, m160, m161, m162, m163, m164, m165, m166, m167, m168,
        m169, m170, m171, m172, m173, m174, m175, m176, m177, m178, m179, m180, m181,
        m182, m183, m184, m185, m186, m187, m188, m189, m190, m191, m192, m193, m194,
        m195, m196, m197, m198, m199, m200, m201, m202, m203, m204, m205, m206, m207,
        m208, m209, m210, m211, m212, m213, m214, m215, m216, m217, m218, m219], expect: {
        equals: 60}}
    - {command: [SCARD, big], expect: {equals: 120}}
    - {command: [SORT, big, ALPHA, LIMIT, 0, 10], expect: {equals: [m100, m101, m102,
          m103, m104, m105, m106, m107, m108, m109]}}
    - {command: [SMEMBERS, big], compare: unordered}
    - {command: [SREM, big, m100, m101, m102, m103, m104, m105, m106, m107, m108,
        m109, m110, m111, m112, m113, m114, m115, m116, m117, m118, m119, m120, m121,
        m122, m123, m124, m125, m126, m127, m128, m129, m130, m131, m132, m133, m134,
        m135, m136, m137, m138, m139, m140, m141, m142, m143, m144, m145, m146, m147,
        m148, m149, m150, m151, m152, m153, m154, m155, m156, m157, m158, m159], expect: {
        equals: 60}}
    - {command: [SCARD, big], expect: {equals: 60}}
    - {command: [SORT, big, ALPHA, LIMIT, 0, 10], expect: {equals: [m160, m161, m162,
          m163, m164, m165, m166, m167, m168, m169]}}
    - {command: [SMEMBERS, big], compare: unordered}
    - {command: [DEBUG, POPULATE, 70000], expect: {equals: OK}}
    - {command: [DBSIZE], expect: {equals: 70004}}
    - {command: [SAVE], expect: {equals: OK}}
    - {command: [DEBUG, DIGEST]}
    - {command: [FLUSHALL, SYNC], expect: {equals: OK}}
    - {command: [DBSIZE], expect: {equals: 0}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [iterate.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: iterate}
