extends: [valkey.liveness]
id: proposed.repl-backlog-default
deployment:
  modes: [standalone]
metadata:
  description: Default repl-backlog-size is 10mb, and a replica reconnecting after
    ~2.7mb of writes gets a partial resync where the parent's 1mb default forced a
    full sync
components:
- use: valkey.action.commands
  id: backlog
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: 2
    timeout_s: 60
    commands:
    - {command: [CONFIG, GET, repl-backlog-size], expect_difference: true, expect: {
        equals: [repl-backlog-size, "10485760"]}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [REPLICAOF, NO, ONE], node: 1, expect: {equals: OK}}
    - {command: [EVAL, "for i=1,2600 do redis.call('set', KEYS[1]..i, string.rep('x',1000))\
          \ end return 'OK'", "1", k], expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [INFO, stats], expect_difference: true, expect: {contains: "sync_partial_ok:1"}}
    - {command: [INFO, stats], expect_difference: true, expect: {contains: "sync_full:1"}}
    - {command: [STRLEN, k2600], node: 1, wait_s: 10, expect: {equals: 1000}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [backlog.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: backlog}
