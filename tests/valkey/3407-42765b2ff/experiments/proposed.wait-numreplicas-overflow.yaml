extends: [valkey.liveness]
id: proposed.wait-numreplicas-overflow
deployment:
  modes: [standalone]
metadata:
  description: WAIT and WAITAOF must reject numreplicas outside [0, INT_MAX]; the
    parent truncates it into the int blockingState field
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: waitrange
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    server_config: {appendonly: "yes", appendfsync: always}
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
    - {command: [SET, k, v], expect: {equals: OK}}
    - {command: [WAIT, -1, 0], expect_difference: true, expect: {error: "out of range"}}
    - {command: [WAIT, 2147483648, 100], expect_difference: true, expect: {error: "out\
          \ of range"}}
    - {command: [WAIT, 4294967296, 100], expect_difference: true, expect: {error: "out\
          \ of range"}}
    - {command: [WAIT, 9223372036854775807, 100], expect_difference: true, expect: {
        error: "out of range"}}
    - {command: [WAIT, 9223372036854775808, 0], expect: {error: true}}
    - {command: [WAIT, "", 0], expect: {error: true}}
    - {command: [WAIT, 2147483647, 100], expect: {equals: 0}}
    - {command: [WAITAOF, -1, 0, 0], expect: {error: "out of range"}}
    - {command: [WAITAOF, 2, 0, 0], expect: {error: "out of range"}}
    - {command: [WAITAOF, 0, -1, 0], expect_difference: true, expect: {error: "between\
          \ 0 and 2147483647"}}
    - {command: [WAITAOF, 0, 2147483648, 100], expect_difference: true, expect: {
        error: "out of range"}}
    - {command: [WAITAOF, 0, 9223372036854775807, 100], expect_difference: true, expect: {
        error: "out of range"}}
    - {command: [WAITAOF, 0, 9223372036854775808, 0], expect_difference: true, expect: {
        error: "out of range"}}
    - {command: [WAITAOF, 0, 0, -1], expect: {error: "timeout is negative"}}
    - {command: [WAITAOF, 0, 0, 9223372036854775807], expect: {error: "timeout is\
          \ out of range"}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [WAIT, 1, 500], wait_s: 30, expect: {equals: 1}}
    - {command: [SET, k2, v2], expect: {equals: OK}}
    - {command: [WAIT, 2147483648, 500], expect_difference: true, expect: {error: "out\
          \ of range"}}
    - {command: [WAITAOF, 0, 1, 500], wait_s: 30, expect: {equals: [1, 1]}}
    - {command: [WAITAOF, 0, 4294967296, 500], expect_difference: true, expect: {
        error: "out of range"}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [waitrange.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: waitrange}
