extends: [valkey.liveness]
id: proposed.set-expired-fastpath
deployment:
  modes: [standalone]
metadata:
  description: SET with an already-expired EXAT/PXAT never stores the key, deletes
    an existing one, propagates DEL/UNLINK instead of SET PXAT, emits del instead
    of set+expire, and skips WATCH invalidation for a missing key
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: seq
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server_config: {notify-keyspace-events: "KEA"}
    resp: {$ref: inputs.resp}
    nodes: 2
    timeout_s: 15
    commands:
    - {command: [DEBUG, SET-ACTIVE-EXPIRE, 0], expect: {equals: OK}}
    - {command: [DEBUG, SET-ACTIVE-EXPIRE, 0], node: 1, expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [SUBSCRIBE, "__keyevent@0__:del"], connection: subdel}
    - {command: [SUBSCRIBE, "__keyevent@0__:set"], connection: subset}
    - {command: [SET, e1, v1], expect: {equals: OK}}
    - {command: [SET, e1, v2, EXAT, 1], expect: {equals: OK}}
    - {read: true, connection: subdel, expect_difference: true, expect: {equals: [
          [message, "__keyevent@0__:del", e1]]}}
    - {read: true, connection: subset, expect_difference: true, expect: {equals: [
          [message, "__keyevent@0__:set", e1]]}}
    - {command: [SET, foo, bar], expect: {equals: OK}}
    - {command: [SET, foo, baz, EXAT, 1], expect: {equals: OK}}
    - {command: [DEBUG, OBJECT, foo], expect_difference: true, expect: {error: "no\
          \ such key"}}
    - {command: [WAIT, 1, 5000], expect: {min: 1}}
    - {command: [DEBUG, OBJECT, foo], node: 1, expect_difference: true, expect: {
        error: "no such key"}}
    - {command: [SET, k2, v, PXAT, 1], expect: {equals: OK}}
    - {command: [DEBUG, OBJECT, k2], expect_difference: true, expect: {error: "no\
          \ such key"}}
    - {command: [WAIT, 1, 5000], expect: {min: 1}}
    - {command: [DEBUG, OBJECT, k2], node: 1, expect_difference: true, expect: {error: "no\
          \ such key"}}
    - {command: [SET, g1, old], expect: {equals: OK}}
    - {command: [SET, g1, new, GET, EXAT, 1], expect: {equals: old}}
    - {command: [DEBUG, OBJECT, g1], expect_difference: true, expect: {error: "no\
          \ such key"}}
    - {command: [SET, g2, val, GET, PXAT, 1], expect: {exists: false}}
    - {command: [DEBUG, OBJECT, g2], expect_difference: true, expect: {error: "no\
          \ such key"}}
    - {command: [CONFIG, SET, lazyfree-lazy-expire, yes], expect: {equals: OK}}
    - {command: [SET, x1, v], expect: {equals: OK}}
    - {command: [SET, x1, v2, XX, EXAT, 1], expect: {equals: OK}}
    - {command: [DEBUG, OBJECT, x1], expect_difference: true, expect: {error: "no\
          \ such key"}}
    - {command: [WAIT, 1, 5000], expect: {min: 1}}
    - {command: [DEBUG, OBJECT, x1], node: 1, expect_difference: true, expect: {error: "no\
          \ such key"}}
    - {command: [SET, n1, v, NX, PXAT, 1], expect: {equals: OK}}
    - {command: [DEBUG, OBJECT, n1], expect_difference: true, expect: {error: "no\
          \ such key"}}
    - {command: [SET, n1, v2, NX], expect: {equals: OK}}
    - {command: [GET, n1], expect: {equals: v2}}
    - {command: [MULTI], expect: {equals: OK}}
    - {command: [SET, m1, v, EXAT, 1], expect: {equals: QUEUED}}
    - {command: [EXEC], expect: {equals: [OK]}}
    - {command: [DEBUG, OBJECT, m1], expect_difference: true, expect: {error: "no\
          \ such key"}}
    - {command: [WATCH, w1], expect: {equals: OK}}
    - {command: [SET, w1, v, EXAT, 1], connection: writer, expect: {equals: OK}}
    - {command: [MULTI], expect: {equals: OK}}
    - {command: [GET, w1], expect: {equals: QUEUED}}
    - {command: [EXEC], expect_difference: true, expect: {exists: true}}
    - {command: [SET, b1, v, EXAT, 0], expect: {error: "invalid expire"}}
    - {command: [SET, b1, v, PXAT, -9223372036854775808], expect: {error: "invalid\
          \ expire"}}
    - {command: [SET, b2, v, EXAT, 9223372036854775807], expect: {error: "invalid\
          \ expire"}}
    - {command: [SET, b3, v, PXAT, 9223372036854775807], expect: {equals: OK}}
    - {command: [GET, b3], expect: {equals: v}}
    - {command: [SET, p1, v], expect: {equals: OK}}
    - {command: [EXPIREAT, p1, 1], expect: {equals: 1}}
    - {command: [EXISTS, p1], expect: {equals: 0}}
    - {command: [SET, p2, v], expect: {equals: OK}}
    - {command: [GETEX, p2, EXAT, 1], expect: {equals: v}}
    - {command: [EXISTS, p2], expect: {equals: 0}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [seq.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: seq}
