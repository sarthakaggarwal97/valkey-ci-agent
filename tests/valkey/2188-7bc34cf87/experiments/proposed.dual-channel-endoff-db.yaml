extends: [valkey.liveness]
id: proposed.dual-channel-endoff-db
deployment:
  modes: [standalone]
metadata:
  description: >
    Dual-channel full sync must report the replication stream's last selected db (replicas_eldb)
    in $ENDOFF, not db[0]->id. Otherwise the replica's primary client comes online
    selected on db 0 while the stream context is another db, and a stream write that
    carries no SELECT lands in the wrong database on the replica.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    diskless_load: {type: string, enum: [disabled, on-empty-db, swapdb], default: disabled}
components:
- use: valkey.action.commands
  id: endoff-db
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 60
    server_config:
      dual-channel-replication-enabled: "yes"
      repl-diskless-sync: "yes"
      repl-diskless-sync-delay: "0"
      repl-diskless-load: {$ref: inputs.diskless_load}
    commands:
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 60, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [SELECT, 9], node: 0, expect: {equals: OK}}
    - {command: [SET, seed, v1], node: 0, expect: {equals: OK}}
    - {command: [SELECT, 9], node: 1, expect: {equals: OK}}
    - {command: [GET, seed], node: 1, wait_s: 30, expect: {equals: v1}}
    - {command: [REPLICAOF, NO, ONE], node: 1, expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 60, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [DEBUG, REPLICATE, SET, injected, one], node: 0, expect: {equals: OK}}
    - {command: [GET, injected], node: 1, wait_s: 15, expect_difference: true, expect: {
        equals: one}}
    - {command: [SELECT, 0], node: 1, expect: {equals: OK}}
    - {command: [GET, injected], node: 1, expect_difference: true, expect: {equals: null}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [endoff-db.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: endoff-db}
