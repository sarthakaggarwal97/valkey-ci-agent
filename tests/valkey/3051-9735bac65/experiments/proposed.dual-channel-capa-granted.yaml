extends: [valkey.liveness]
id: proposed.dual-channel-capa-granted
deployment:
  modes: [standalone]
metadata:
  description: With dual-channel-replication-enabled and repl-diskless-sync both on,
    the primary grants REPLICA_CAPA_DUAL_CHANNEL - a real replica completes a dual-channel
    full sync, and a hand-rolled PSYNC handshake is answered +DUALCHANNELSYNC, which
    only happens when the capa bit was set
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: dual-channel
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server_config:
      dual-channel-replication-enabled: "yes"
      repl-diskless-sync: "yes"
      repl-diskless-sync-delay: "0"
    resp: {$ref: inputs.resp}
    timeout_s: 60
    nodes: 2
    commands:
    - {command: [SET, seed-key, seed-value], expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [GET, seed-key], node: 1, expect: {equals: seed-value}}
    - {command: [REPLCONF, capa, eof, capa, psync2, capa, dual-channel], connection: repl,
      expect: {equals: OK}}
    - {command: [PSYNC, "?", "-1"], connection: repl, expect: {equals: DUALCHANNELSYNC}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [dual-channel.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: dual-channel}
