extends: [valkey.liveness]
id: proposed.dual-channel-buffer-async-free
deployment:
  modes: [standalone]
metadata:
  description: >
    Abort a dual-channel full sync while the replica has buffered more than 64 local
    repl-data blocks. The change frees the buffer on the lazyfree thread (lazyfreed_objects
    rises on the replica); the parent frees it synchronously (lazyfreed_objects stays
    0), which is the marked difference.
components:
- use: valkey.action.commands
  id: abort-sync
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 120
    server_config:
      dual-channel-replication-enabled: "yes"
      repl-diskless-sync: "yes"
      repl-diskless-sync-delay: 0
    commands:
    - {command: [DEBUG, POPULATE, "200000"], node: 0, expect: {equals: OK}}
    - {command: [CONFIG, SET, rdb-key-save-delay, "100"], node: 0, expect: {equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 0, wait_s: 30, compare: skip, expect: {
        contains: "type=main-channel"}}
    - {command: [EVAL, "for i=1,100 do redis.call('SET','big'..i,string.rep('x',100000))\
          \ end return redis.call('DBSIZE')", "0"], node: 0, expect: {equals: 200100}}
    - {command: [DEBUG, SLEEP, "1"], node: 0, expect: {equals: OK}}
    - {command: [CLIENT, KILL, TYPE, replica], node: 0, compare: skip, expect: {min: 1}}
    - {command: [EVAL, "return tonumber(string.match(redis.call('INFO','memory'),'lazyfreed_objects:(%d+)'))",
        "0"], node: 1, wait_s: 20, expect_difference: true, expect: {min: 1}}
    - {command: [PING], node: 1, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [abort-sync.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: abort-sync}
