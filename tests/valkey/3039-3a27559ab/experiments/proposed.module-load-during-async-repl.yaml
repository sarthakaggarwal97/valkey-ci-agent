extends: [valkey.liveness]
id: proposed.module-load-during-async-repl
deployment:
  modes: [standalone]
metadata:
  description: MODULE LOAD is refused while a replica async-loads a diskless swapdb
    full sync
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: asyncload
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 120
    server_config:
      enable-module-command: "yes"
      repl-diskless-sync: "yes"
      repl-diskless-sync-delay: "0"
      repl-diskless-load: swapdb
      dual-channel-replication-enabled: "no"
      rdbcompression: "no"
      save: ""
      appendonly: "no"
    commands:
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 60, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [DEBUG, POPULATE, 1000, "bigkey:", 100000], node: 0, expect: {equals: OK}}
    - {command: [CONFIG, SET, rdb-key-save-delay, 10000], node: 0, expect: {equals: OK}}
    - {command: [CLIENT, KILL, TYPE, replica], node: 0, compare: skip, expect: {min: 1}}
    - {command: [INFO, persistence], node: 1, wait_s: 60, compare: skip, expect: {
        contains: "async_loading:1"}}
    - {raw: "MODULE LOAD nosuchmodule.so\r\n", node: 1, connection: mod, expect_difference: true,
      expect: {error: "cannot load module during async replication"}}
    - {command: [PING], node: 1, expect: {equals: PONG}}
    - {command: [CONFIG, SET, rdb-key-save-delay, 0], node: 0, expect: {equals: OK}}
    checks:
      acl: true
      compat: true
      variants: true
required_events: [asyncload.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: asyncload}
