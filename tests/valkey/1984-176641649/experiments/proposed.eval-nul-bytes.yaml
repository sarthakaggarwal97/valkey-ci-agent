extends: [valkey.liveness]
id: proposed.eval-nul-bytes
deployment:
  modes: [standalone]
metadata:
  description: EVAL and SCRIPT LOAD of scripts containing NUL bytes compile the full
    body instead of truncating at the first NUL
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    appendonly: {type: string, enum: ["no", "yes"], default: "no"}
components:
- use: valkey.action.commands
  id: nul-scripts
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server_config: {appendonly: {$ref: inputs.appendonly}}
    resp: {$ref: inputs.resp}
    timeout_s: 15
    commands:
    - {command: [EVAL, !!binary "cmV0dXJuICIAIjs=", 0], expect_difference: true, expect: {
        equals: !!binary "AA=="}}
    - {command: [EVAL, !!binary "cmV0dXJuICJhAGIi", 0], expect_difference: true, expect: {
        equals: !!binary "YQBi"}}
    - {command: [SCRIPT, LOAD, !!binary "cmV0dXJuICJhAGIi"], expect_difference: true,
      expect: {error: false}}
    - {command: [EVAL, !!binary "cmV0dXJuICJhAGIi", 0], expect_difference: true, expect: {
        equals: !!binary "YQBi"}}
    - {command: [EVAL, !!binary "cmV0dXJuIHNlcnZlci5jYWxsKCJTRVQiLCJrIiwieAB5Iik=",
        0], expect_difference: true, expect: {equals: OK}}
    - {command: [GET, k], expect_difference: true, expect: {equals: !!binary "eAB5"}}
    - {command: [EVAL, !!binary "cmV0dXJuIDk5AA==", 0], expect_difference: true, expect: {
        error: "Error compiling"}}
    - {command: [EVAL, !!binary "AA==", 0], expect_difference: true, expect: {error: true}}
    - {command: [EVAL, !!binary "IyFsdWEgZmxhZ3M9bm8td3JpdGVzCnJldHVybiAieAB5Ig==",
        0], expect_difference: true, expect: {equals: !!binary "eAB5"}}
    checks:
      acl: true
      compat: true
      variants: true
required_events: [nul-scripts.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: nul-scripts}
