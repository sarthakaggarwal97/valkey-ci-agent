extends: [valkey.liveness]
id: proposed.hashtable-slotdelete-compare
deployment:
  modes: [standalone]
metadata:
  description: Lose slot ownership while keys remain so delKeysInSlot walks the new
    kvstore hashtable iterator, and shard channels in the slot are dropped
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: slotdel
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 15
    commands:
    - {command: [SET, "{foo}a", v1], expect: {equals: OK}}
    - {command: [SET, "{foo}b", v2, PX, 900000], expect: {equals: OK}}
    - {command: [SET, "{foo}c", v3, EX, 9000], expect: {equals: OK}}
    - {command: [RPUSH, "{foo}l", x, y, z], expect: {equals: 3}}
    - {command: [SSUBSCRIBE, "{foo}ch"], connection: sub, expect: {exists: true}}
    - {command: [CLUSTER, COUNTKEYSINSLOT, 12182], expect: {equals: 4}}
    - {command: [CLUSTER, SETSLOT, 12182, MIGRATING, "<node.1.id>"], expect: {equals: OK}}
    - {command: [CLUSTER, SETSLOT, 12182, IMPORTING, "<node.0.id>"], node: 1, expect: {
        equals: OK}}
    - {command: [CLUSTER, SETSLOT, 12182, NODE, "<node.1.id>"], node: 1, expect: {
        equals: OK}}
    - {command: [CLUSTER, COUNTKEYSINSLOT, 12182], wait_s: 30, expect: {equals: 0}}
    - {command: [DBSIZE], expect: {equals: 0}}
    - {command: [EXISTS, "{foo}a", "{foo}b", "{foo}c", "{foo}l"], node: 1, expect: {
        equals: 0}}
    - {command: [PING], expect: {equals: PONG}}
    - {read: true, connection: sub, expect: {exists: true}}
    checks:
      acl: true
      compat: true
      variants: true
required_events: [slotdel.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: slotdel}
