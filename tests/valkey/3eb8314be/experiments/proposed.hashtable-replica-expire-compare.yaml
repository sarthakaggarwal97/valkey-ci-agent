extends: [valkey.liveness]
id: proposed.hashtable-replica-expire-compare
deployment:
  modes: [standalone]
metadata:
  description: Writable-replica expiry through expireReplicaKeys and the new dbFindExpires,
    plus replica lazy expiry of primary-owned volatile keys
components:
- use: valkey.action.commands
  id: replexp
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 15
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [SET, seed, one], expect: {equals: OK}}
    - {command: [GET, seed], node: 1, wait_s: 30, expect: {equals: one}}
    - {command: [CONFIG, SET, replica-read-only, no], node: 1, expect: {equals: OK}}
    - {command: [SET, volkey, rv, PX, 150], node: 1, expect: {equals: OK}}
    - {command: [EXISTS, volkey], node: 1, wait_s: 30, expect: {equals: 0}}
    - {command: [SET, pvol, pv, PX, 150], expect: {equals: OK}}
    - {command: [GET, pvol], node: 1, wait_s: 30, expect: {exists: false}}
    - {command: [EXISTS, pvol], wait_s: 30, expect: {equals: 0}}
    - {command: [DBSIZE], node: 1, wait_s: 30, expect: {equals: 1}}
    checks:
      acl: true
      compat: true
      variants: true
required_events: [replexp.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: replexp}
