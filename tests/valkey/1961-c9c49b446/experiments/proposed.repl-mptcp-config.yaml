extends: [valkey.liveness]
id: proposed.repl-mptcp-config
deployment:
  modes: [standalone]
metadata:
  description: repl-mptcp config is registered, defaults to no, is immutable, and
    plain-TCP replication through the reworked connect path behaves as on the parent
components:
- use: valkey.action.commands
  id: mptcp-config
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 60
    commands:
    - {command: [CONFIG, GET, repl-mptcp], expect_difference: true, expect: {equals: [
          repl-mptcp, "no"]}}
    - {command: [CONFIG, SET, repl-mptcp, "yes"], expect_difference: true, expect: {
        error: true}}
    - {command: [CONFIG, SET, repl-mptcp, "no"], expect_difference: true, expect: {
        error: true}}
    - {command: [SET, k1, v1], node: 0, expect: {equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [GET, k1], node: 1, wait_s: 10, expect: {equals: v1}}
    - {command: [SET, k2, v2], node: 0, expect: {equals: OK}}
    - {command: [GET, k2], node: 1, wait_s: 10, expect: {equals: v2}}
    - {command: [INFO, replication], node: 0, wait_s: 10, compare: skip, expect: {
        contains: "connected_slaves:1"}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [mptcp-config.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: mptcp-config}
