extends: [valkey.liveness]
id: proposed.hash-expire-replication
deployment:
  modes: [standalone]
metadata:
  description: Field TTLs cross a full sync (RDB_TYPE_HASH_2 over the wire) and live
    replication (HPEXPIREAT and HDEL rewrites); a replica hides expired fields without
    deleting them
components:
- use: valkey.action.commands
  id: repl
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 20
    commands:
    - {command: [HSET, h, f1, v1, f2, v2, f3, v3], expect: {equals: 3}}
    - {command: [HPEXPIREAT, h, 33177702400000, FIELDS, 1, f1], expect_difference: true,
      expect: {equals: [1]}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [HPEXPIRETIME, h, FIELDS, 3, f1, f2, f3], node: 1, wait_s: 10, expect_difference: true,
      expect: {equals: [33177702400000, -1, -1]}}
    - {command: [HEXPIRE, h, 0, FIELDS, 1, f2], expect_difference: true, expect: {
        equals: [2]}}
    - {command: [HEXISTS, h, f2], node: 1, wait_s: 10, expect_difference: true, expect: {
        equals: 0}}
    - {command: [HPEXPIRE, h, 100, FIELDS, 1, f3], expect_difference: true, expect: {
        equals: [1]}}
    - {command: [HGET, h, f3], wait_s: 10, expect_difference: true, expect: {equals: null}}
    - {command: [HGET, h, f3], node: 1, wait_s: 10, expect_difference: true, expect: {
        equals: null}}
    - {command: [HSETEX, h, EX, 100, FIELDS, 1, f4, v4], expect_difference: true,
      expect: {equals: 1}}
    - {command: [HGET, h, f4], node: 1, wait_s: 10, expect_difference: true, expect: {
        equals: v4}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
