extends: [valkey.liveness]
id: proposed.migrateslots-parse-errors
deployment:
  modes: [standalone]
metadata:
  description: CLUSTER MIGRATESLOTS slot-range parse errors, SETSLOT export guard,
    CANCELSLOTMIGRATIONS and GETSLOTMIGRATIONS compared across builds
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: seq
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 3
    resp: {$ref: inputs.resp}
    timeout_s: 180
    commands:
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 100], expect_difference: true,
      expect: {error: "No end slot"}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 100, NODE, "<node.1.id>"], expect_difference: true,
      expect: {error: true}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 200, 100, NODE, "<node.1.id>"],
      expect_difference: true, expect: {error: "greater than end slot"}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 0, 99999, NODE, "<node.1.id>"],
      expect_difference: true, expect: {error: true}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, NODE, "<node.1.id>"], expect_difference: true,
      expect: {error: "No slot ranges specified"}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 0, 100, 50, 150, NODE, "<node.1.id>"],
      expect_difference: true, expect: {error: "overlaps with previous"}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 10, 20, NODE, "<node.1.id>", SLOTSRANGE,
        15, 25, NODE, "<node.2.id>"], expect_difference: true, expect: {error: "migrations\
          \ overlap"}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 10, 20, NODE, shortname], expect_difference: true,
      expect: {error: "Invalid node name"}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 10, 20, NODE, ffffffffffffffffffffffffffffffffffffffff],
      expect_difference: true, expect: {error: "Unknown node name"}}
    - {command: [CLUSTER, DELSLOTS, 16383], expect: {equals: OK}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 16383, 16383, NODE, "<node.1.id>"],
      expect_difference: true, expect: {error: "has no node served"}}
    - {command: [CLUSTER, ADDSLOTS, 16383], expect: {equals: OK}}
    - {command: [CLUSTER, SETSLOT, 300, NODE, "<node.2.id>"], node: 2, expect: {equals: OK}}
    - {command: [CLUSTER, SETSLOT, 300, NODE, "<node.2.id>"], expect: {equals: OK}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 299, 301, NODE, "<node.1.id>"],
      expect_difference: true, expect: {error: "span multiple shards"}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 300, 300, NODE, "<node.1.id>"],
      expect_difference: true, expect: {error: "not served by myself"}}
    - {command: [DEBUG, SLOTMIGRATION, PREVENT-PAUSE, 1], expect_difference: true,
      expect: {equals: OK}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 1000, 1100, 2000, 2100, NODE,
        "<node.1.id>"], expect_difference: true, expect: {equals: OK}}
    - {command: [CLUSTER, SETSLOT, 5, MIGRATING, "<node.1.id>"], expect_difference: true,
      expect: {error: "Slot export in progress"}}
    - {command: [CLUSTER, MIGRATESLOTS, SLOTSRANGE, 1050, 1060, NODE, "<node.2.id>"],
      expect_difference: true, expect: {error: "already migrating slot"}}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], expect_difference: true, expect: {contains: "1000-1100\
          \ 2000-2100"}}
    - {command: [CLUSTER, CANCELSLOTMIGRATIONS], expect_difference: true, expect: {
        equals: OK}}
    - {command: [CLUSTER, GETSLOTMIGRATIONS], expect_difference: true, expect: {contains: cancelled}}
    - {command: [CLUSTER, CANCELSLOTMIGRATIONS], expect_difference: true, expect: {
        error: "No migrations ongoing"}}
    checks:
      acl: true
      compat: true
      variants: true
required_events: [seq.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: seq}
