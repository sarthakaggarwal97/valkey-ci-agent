extends: [valkey.base]
id: proposed.cluster-node-killed-reconnect
deployment:
  modes: [cluster]
  replicas_per_primary: {minimum: 1}
metadata:
  description: Kill a cluster node under writes and restart it; peers reconnect under
    the new per-cron attempt budget and the cluster converges with no acknowledged
    write lost
inputs:
  properties:
    instance: {type: string, enum: [primary, replica], default: replica}
    signal: {type: string, enum: [SIGKILL, SIGTERM], default: SIGKILL}
    restart_delay_s: {type: number, minimum: 0, maximum: 30, default: 0}
    settle_s: {type: number, minimum: 1, maximum: 60, default: 8}
components:
- use: valkey.fault.process-signal
  id: kill-node
  config:
    when_event: warm-up.completed
    instance: {$ref: inputs.instance}
    signal: {$ref: inputs.signal}
    restart: true
    restart_mode: background
    restart_delay_s: {$ref: inputs.restart_delay_s}
- use: valkey.action.sleep
  id: warm-up
  depends_on: [writes, kill-node]
  config: {seconds: 2}
- use: valkey.action.sleep
  id: settle
  depends_on: [warm-up]
  config: {seconds: {$ref: inputs.settle_s}}
- use: valkey.oracle.ledger
  id: data
  config:
    workload: writes
    loss_window_s: 2.5
    loss_window_faults: [kill-node]
required_events: [warm-up.completed, kill-node.recovered]
required_evidence:
- {evidence_id: valkey.fault.injected, source: kill-node}
