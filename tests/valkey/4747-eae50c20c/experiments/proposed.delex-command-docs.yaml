extends: [valkey.liveness]
id: proposed.delex-command-docs
deployment:
  modes: [standalone]
metadata:
  description: COMMAND DOCS for DELEX reports since 9.2.0 and O(1) after the commands.def
    regeneration, while COMMAND INFO and DELEX behaviour stay identical to the parent
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: docs
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    timeout_s: 10
    commands:
    - {command: [COMMAND, DOCS, delex], expect_difference: true, expect: {contains: "9.2.0"}}
    - {command: [COMMAND, INFO, delex], expect: {contains: delex}}
    - {command: [COMMAND, COUNT], expect: {min: 1}}
    - {command: [SET, k, v], expect: {equals: OK}}
    - {command: [DELEX, k, IFEQ, v], expect: {equals: 1}}
    - {command: [EXISTS, k], expect: {equals: 0}}
    - {command: [SET, k, v], expect: {equals: OK}}
    - {command: [DELEX, k, IFEQ, w], expect: {equals: 0}}
    - {command: [DELEX, k, IFNE, v], expect: {equals: 0}}
    - {command: [DELEX, k, IFNE, w], expect: {equals: 1}}
    - {command: [EXISTS, k], expect: {equals: 0}}
    - {command: [DELEX, missing, IFEQ, v], expect: {equals: 0}}
    - {command: [SET, e, ""], expect: {equals: OK}}
    - {command: [DELEX, e, IFEQ, ""], expect: {equals: 1}}
    - {command: [RPUSH, l, a], expect: {equals: 1}}
    - {command: [DELEX, l, IFEQ, a], expect: {error: WRONGTYPE}}
    - {command: [DELEX, k, IFEQ], expect: {error: true}}
    - {command: [DELEX, k, BOGUS, v], expect: {error: true}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [docs.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: docs}
