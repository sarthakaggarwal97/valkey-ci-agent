extends: [valkey.liveness]
id: proposed.info-client-info-format
deployment:
  modes: [standalone]
metadata:
  description: >
    The fmtargs.h rewrite of catClientInfoString and genRedisInfoString must produce
    byte-identical CLIENT INFO/LIST and INFO output. Field names, separators and deterministic
    values are checked with substring expectations on both builds across the Server,
    Clients, Memory, Persistence (incl. the AOF-enabled block), Stats, Replication
    (primary and replica side) and Debug sections.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: infofmt
  config:
    compare_with: {$ref: artifacts.parent.binary}
    resp: {$ref: inputs.resp}
    nodes: 2
    timeout_s: 15
    commands:
    - {command: [CLIENT, SETNAME, fuzzconn], expect: {equals: OK}}
    - {command: [CLIENT, SETINFO, lib-name, fuzzlib], expect: {equals: OK}}
    - {command: [CLIENT, SETINFO, lib-ver, 9.9.9], expect: {equals: OK}}
    - {command: [SELECT, 5], expect: {equals: OK}}
    - {command: [CLIENT, INFO], compare: skip, expect: {contains: " name=fuzzconn\
          \ age="}}
    - {command: [CLIENT, INFO], compare: skip, expect: {contains: " db=5 sub=0 psub=0\
          \ ssub=0 multi=-1 qbuf="}}
    - {command: [CLIENT, INFO], compare: skip, expect: {contains: " events=r cmd=client|info\
          \ user=default redir=-1 resp="}}
    - {command: [CLIENT, INFO], compare: skip, expect: {contains: " lib-name=fuzzlib\
          \ lib-ver=9.9.9"}}
    - {command: [CLIENT, LIST], compare: skip, expect: {contains: " cmd=client|list\
          \ user=default redir=-1 resp="}}
    - {command: [INFO, server], compare: skip, expect: {contains: "redis_mode:standalone\r\
          \n"}}
    - {command: [INFO, server], compare: skip, expect: {contains: "\r\ngcc_version:"}}
    - {command: [INFO, server], compare: skip, expect: {contains: "uptime_in_days:0\r\
          \nhz:"}}
    - {command: [INFO, server], compare: skip, expect: {contains: "configured_hz:10\r\
          \nlru_clock:"}}
    - {command: [INFO, server], compare: skip, expect: {contains: "io_threads_active:0\r\
          \n"}}
    - {command: [INFO, clients], compare: skip, expect: {contains: "cluster_connections:0\r\
          \nmaxclients:"}}
    - {command: [INFO, clients], compare: skip, expect: {contains: "blocked_clients:0\r\
          \ntracking_clients:0\r\nclients_in_timeout_table:0\r\ntotal_blocking_keys:0\r\
          \ntotal_blocking_keys_on_nokey:0\r\n"}}
    - {command: [EVAL, "return 1", 0], expect: {equals: 1}}
    - {command: [INFO, memory], compare: skip, expect: {contains: "number_of_cached_scripts:1\r\
          \nnumber_of_functions:0\r\nnumber_of_libraries:0\r\n"}}
    - {command: [INFO, memory], compare: skip, expect: {contains: "maxmemory:0\r\n\
          maxmemory_human:0B\r\nmaxmemory_policy:noeviction\r\n"}}
    - {command: [CONFIG, SET, maxmemory-policy, allkeys-lru], expect: {equals: OK}}
    - {command: [INFO, memory], compare: skip, expect: {contains: "maxmemory_policy:allkeys-lru\r\
          \n"}}
    - {command: [INFO, memory], compare: skip, expect: {contains: "active_defrag_running:0\r\
          \nlazyfree_pending_objects:0\r\nlazyfreed_objects:0\r\n"}}
    - {command: [INFO, persistence], compare: skip, expect: {contains: "loading:0\r\
          \nasync_loading:0\r\n"}}
    - {command: [INFO, persistence], compare: skip, expect: {contains: "aof_enabled:0\r\
          \naof_rewrite_in_progress:0\r\n"}}
    - {command: [INFO, persistence], compare: skip, expect: {contains: "module_fork_in_progress:0\r\
          \nmodule_fork_last_cow_size:0\r\n"}}
    - {command: [INFO, stats], compare: skip, expect: {contains: "sync_full:0\r\n\
          sync_partial_ok:0\r\nsync_partial_err:0\r\n"}}
    - {command: [INFO, stats], compare: skip, expect: {contains: "dump_payload_sanitizations:0\r\
          \ntotal_reads_processed:"}}
    - {command: [CONFIG, SET, appendonly, yes], expect: {equals: OK}}
    - {command: [INFO, persistence], compare: skip, wait_s: 20, expect: {contains: "aof_enabled:1\r\
          \naof_rewrite_in_progress:0\r\n"}}
    - {command: [INFO, persistence], compare: skip, wait_s: 20, expect: {contains: "aof_pending_rewrite:0\r\
          \naof_buffer_length:0\r\naof_pending_bio_fsync:0\r\naof_delayed_fsync:0\r\
          \n"}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, compare: skip, wait_s: 30, expect: {
        contains: "master_link_status:up"}}
    - {command: [INFO, replication], node: 1, compare: skip, expect: {contains: "master_sync_in_progress:0\r\
          \n"}}
    - {command: [INFO, replication], node: 1, compare: skip, expect: {contains: "slave_priority:100\r\
          \nslave_read_only:1\r\nreplica_announced:1\r\n"}}
    - {command: [INFO, stats], node: 0, compare: skip, wait_s: 30, expect: {contains: "sync_full:1\r\
          \nsync_partial_ok:0\r\n"}}
    - {command: [INFO, replication], node: 0, compare: skip, expect: {contains: "master_failover_state:no-failover\r\
          \nmaster_replid:"}}
    - {command: [INFO, replication], node: 0, compare: skip, expect: {contains: "repl_backlog_active:1\r\
          \nrepl_backlog_size:1048576\r\n"}}
    - {command: [INFO, debug], compare: skip, expect: {contains: "# Debug\r\neventloop_duration_aof_sum:"}}
    - {command: [INFO, debug], compare: skip, expect: {contains: "eventloop_duration_max:"}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [infofmt.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: infofmt}
