extends: [valkey.liveness]
id: proposed.hexpire-gt-past
deployment:
  modes: [standalone]
metadata:
  description: HEXPIRE family with GT and a past expiration must not delete fields
    (valkey#3023); replies, surviving data and replica propagation compared against
    the parent build
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    hash_max_listpack_entries: {type: integer, default: 128}
components:
- use: valkey.action.commands
  id: hexpire-gt
  config:
    compare_with: {$ref: artifacts.parent.binary}
    server_config: {hash-max-listpack-entries: {$ref: inputs.hash_max_listpack_entries}}
    resp: {$ref: inputs.resp}
    nodes: 2
    timeout_s: 60
    commands:
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [HSETEX, h1, EX, 600, FIELDS, 1, f1, v1], expect: {equals: 1}}
    - {command: [HSET, h1, f2, v2], expect: {equals: 1}}
    - {command: [HSET, lp, a, va, b, vb], expect: {equals: 2}}
    - {command: [HLEN, h1], node: 1, wait_s: 15, expect: {equals: 2}}
    - {command: [HEXPIRE, h1, 0, GT, FIELDS, 3, f1, f2, missing], expect_difference: true,
      expect: {equals: [0, 0, -2]}}
    - {command: [HLEN, h1], expect_difference: true, expect: {equals: 2}}
    - {command: [HGET, h1, f1], expect_difference: true, expect: {equals: v1}}
    - {command: [HEXISTS, h1, f2], expect_difference: true, expect: {equals: 1}}
    - {command: [HEXPIREAT, lp, 1, GT, FIELDS, 3, a, b, nofield], expect_difference: true,
      expect: {equals: [0, 0, -2]}}
    - {command: [EXISTS, lp], expect_difference: true, expect: {equals: 1}}
    - {command: [HLEN, lp], expect_difference: true, expect: {equals: 2}}
    - {command: [HSETEX, h2, EX, 600, FIELDS, 1, g1, w1], expect: {equals: 1}}
    - {command: [HEXPIRE, h2, 0, LT, FIELDS, 1, g1], expect: {equals: [2]}}
    - {command: [EXISTS, h2], expect: {equals: 0}}
    - {command: [HPEXPIRE, lp, 0, FIELDS, 1, a], expect_difference: true, expect: {
        equals: [2]}}
    - {command: [HLEN, lp], expect_difference: true, expect: {equals: 1}}
    - {command: [WAIT, 1, 2000], expect: {equals: 1}}
    - {command: [HLEN, h1], node: 1, expect_difference: true, expect: {equals: 2}}
    - {command: [HLEN, lp], node: 1, expect_difference: true, expect: {equals: 1}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [hexpire-gt.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: hexpire-gt}
