extends: [valkey.liveness]
id: proposed.xreadgroup-entries-read-replication
deployment:
  modes: [standalone]
metadata:
  description: XREADGROUP without NOACK must propagate XGROUP SETID with ENTRIESREAD,
    so a replica's XINFO GROUPS entries-read and lag match the primary's; the parent
    leaves them null or stale
components:
- use: valkey.action.commands
  id: entriesread
  config:
    compare_with: {$ref: artifacts.parent.binary}
    nodes: 2
    timeout_s: 30
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [XADD, st, 1-1, f, v], expect: {equals: "1-1"}}
    - {command: [XADD, st, 2-2, f, v], expect: {equals: "2-2"}}
    - {command: [XADD, st, 3-3, f, v], expect: {equals: "3-3"}}
    - {command: [XGROUP, CREATE, st, g, "0"], expect: {equals: OK}}
    - {command: [XREADGROUP, GROUP, g, c1, COUNT, 2, STREAMS, st, ">"], expect: {
        equals: [[st, [["1-1", [f, v]], ["2-2", [f, v]]]]]}}
    - {command: [WAIT, 1, 5000], expect: {equals: 1}}
    - {command: [XINFO, GROUPS, st], node: 1, expect_difference: true, expect: {equals: [
          [name, g, consumers, 1, pending, 2, last-delivered-id, "2-2", entries-read,
            2, lag, 1]]}}
    - {command: [XINFO, GROUPS, st], node: 0, expect: {equals: [[name, g, consumers,
            1, pending, 2, last-delivered-id, "2-2", entries-read, 2, lag, 1]]}}
    - {command: [XREADGROUP, GROUP, g, c1, NOACK, COUNT, 1, STREAMS, st, ">"], expect: {
        equals: [[st, [["3-3", [f, v]]]]]}}
    - {command: [XADD, st, 4-4, f, v], expect: {equals: "4-4"}}
    - {command: [XREADGROUP, GROUP, g, c1, COUNT, 1, STREAMS, st, ">"], expect: {
        equals: [[st, [["4-4", [f, v]]]]]}}
    - {command: [WAIT, 1, 5000], expect: {equals: 1}}
    - {command: [XINFO, GROUPS, st], node: 1, expect_difference: true, expect: {equals: [
          [name, g, consumers, 1, pending, 3, last-delivered-id, "4-4", entries-read,
            4, lag, 0]]}}
    - {command: [XDEL, st, 2-2], expect: {equals: 1}}
    - {command: [XADD, st, 5-5, f, v], expect: {equals: "5-5"}}
    - {command: [XREADGROUP, GROUP, g, c1, COUNT, 1, STREAMS, st, ">"], expect: {
        equals: [[st, [["5-5", [f, v]]]]]}}
    - {command: [WAIT, 1, 5000], expect: {equals: 1}}
    - {command: [XINFO, GROUPS, st], node: 1, expect_difference: true, expect: {equals: [
          [name, g, consumers, 1, pending, 4, last-delivered-id, "5-5", entries-read,
            5, lag, 0]]}}
    - {command: [XINFO, GROUPS, st], node: 0, expect: {equals: [[name, g, consumers,
            1, pending, 4, last-delivered-id, "5-5", entries-read, 5, lag, 0]]}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [entriesread.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: entriesread}
