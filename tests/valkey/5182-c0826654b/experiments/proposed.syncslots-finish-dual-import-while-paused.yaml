extends: [valkey.liveness]
id: proposed.syncslots-finish-dual-import-while-paused
deployment:
  modes: [standalone]
metadata:
  description: Two failed slot imports on a write-paused primary each propagate SYNCSLOTS
    FINISH; the parent trips the write-pause assertion, the change exempts both
components:
- use: valkey.action.commands
  id: finish
  config:
    compare_with: {$ref: artifacts.parent.binary}
    cluster: true
    nodes: 2
    server_config: {appendonly: "yes", appendfsync: "always"}
    timeout_s: 20
    commands:
    - {command: [CLUSTER, SYNCSLOTS, ESTABLISH, SOURCE, "<node.0.id>", NAME, "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
        SLOTSRANGE, 16383, 16383], node: 1, connection: job1, expect: {equals: OK}}
    - {command: [CLUSTER, SYNCSLOTS, ESTABLISH, SOURCE, "<node.0.id>", NAME, "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb",
        SLOTSRANGE, 16382, 16382], node: 1, connection: job2, expect: {equals: OK}}
    - {command: [CLIENT, PAUSE, 100000, WRITE], node: 1, expect: {equals: OK}}
    - {command: [RESET], node: 1, connection: job1, expect: {exists: false}}
    - {command: [RESET], node: 1, connection: job2, expect: {exists: false}}
    - {command: [PING], node: 1, expect_difference: true, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_events: [finish.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: finish}
