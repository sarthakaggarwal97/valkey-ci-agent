extends: [valkey.liveness]
id: proposed.syncslots-finish-aof-write-pause
deployment:
  modes: [standalone, cluster]
metadata:
  description: A failing slot import on a write-paused AOF target primary must not
    crash on the internal SYNCSLOTS FINISH propagation
inputs:
  required: [parent]
  properties:
    parent:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "The parent commit's build, {$ref: artifacts.parent.binary}"
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: finish
  config:
    compare_with: {$ref: inputs.parent}
    cluster: true
    nodes: 2
    resp: {$ref: inputs.resp}
    server_config: {appendonly: "yes"}
    timeout_s: 20
    commands:
    - {command: [CLUSTER, SYNCSLOTS, ESTABLISH, SOURCE, "<node.0.id>", NAME, aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa,
        SLOTSRANGE, 16383, 16383], node: 1, connection: job, expect: {equals: OK}}
    - {command: [CLIENT, PAUSE, 100000, WRITE], node: 1, expect: {equals: OK}}
    - {command: [RESET], node: 1, connection: job, expect: {exists: false}}
    - {command: [PING], node: 1, expect_difference: true, expect: {equals: PONG}}
    checks:
      acl: true
      compat: true
      concurrency: 4
      replica: true
      variants: true
required_evidence:
- {evidence_id: valkey.command.sequence, source: finish}
