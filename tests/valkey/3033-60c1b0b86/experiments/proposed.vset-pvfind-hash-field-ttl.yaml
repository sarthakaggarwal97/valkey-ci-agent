        v, a57, v, a58, v, a59, v, a60, v, a61, v, a62, v, a63, v, a64, v, a65, v,
        a66, v, a67, v, a68, v, a69, v, a70, v], expect: {equals: 70}}
    - {command: [HSET, h4, b1, v, b2, v, b3, v, b4, v, b5, v, b6, v, b7, v, b8, v,
