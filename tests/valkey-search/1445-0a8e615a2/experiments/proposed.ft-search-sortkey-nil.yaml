extends: [valkey.liveness]
id: proposed.ft-search-sortkey-nil
deployment:
  modes: [standalone]
metadata:
  description: FT.SEARCH WITHSORTKEYS replies nil for an absent sort key under emulate-release
    1.3.0, and formats vector distances via expr::FormatDouble
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: sortkeys
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 120
    commands:
    - {command: [FT.CREATE, idx, ON, HASH, PREFIX, "1", "d:", SCHEMA, m, TAG, p, NUMERIC,
        SORTABLE, vec, VECTOR, FLAT, "6", TYPE, FLOAT32, DIM, "2", DISTANCE_METRIC,
        L2], expect: {equals: OK}}
    - {command: [HSET, "d:1", m, "all,solo", p, "10", vec, AAAAAAAA], expect: {equals: 3}}
    - {command: [HSET, "d:2", m, all, p, "20", vec, BBBBBBBB], expect: {equals: 3}}
    - {command: [HSET, "d:3", m, all, vec, CCCCCCCC], expect: {equals: 2}}
    - {command: [HSET, "d:4", m, big, vec, !!binary 'AAAASgAAAAA='], expect: {equals: 2}}
    - {command: [FT.SEARCH, idx, "*", LIMIT, "0", "0", DIALECT, "2"], wait_s: 30,
      expect: {equals: [4]}}
    - {command: [CONFIG, SET, search.emulate-release, 1.2.1], expect: {equals: OK}}
    - {command: [FT.SEARCH, idx, "@m:{all}", SORTBY, p, ASC, WITHSORTKEYS, RETURN,
        "1", m, DIALECT, "2"], expect: {contains: "#"}}
    - {command: [CONFIG, SET, search.emulate-release, 1.3.0], expect: {equals: OK}}
    - {command: [FT.SEARCH, idx, "@m:{all}", SORTBY, p, ASC, WITHSORTKEYS, RETURN,
        "1", m, DIALECT, "2"], expect_difference: true, expect: {contains: "#10"}}
    - {command: [FT.SEARCH, idx, "@m:{solo}", WITHSORTKEYS, RETURN, "1", m, DIALECT,
        "2"], expect_difference: true, expect: {contains: "d:1"}}
    - {command: [FT.SEARCH, idx, "@m:{all}", SORTBY, p, ASC, LIMIT, "1", "2", WITHSORTKEYS,
        RETURN, "1", m, DIALECT, "2"], expect_difference: true, expect: {contains: "#20"}}
    - {command: [FT.SEARCH, idx, "(@m:{all})=>[KNN 3 @vec $B]", PARAMS, "2", B, AAAAAAAA,
        SORTBY, p, ASC, WITHSORTKEYS, RETURN, "1", p, DIALECT, "2"], expect_difference: true,
      expect: {contains: "#10"}}
    - {command: [FT.SEARCH, idx, "(@m:{solo})=>[KNN 1 @vec $B]", PARAMS, "2", B, AAAAAAAA,
        WITHSORTKEYS, RETURN, "1", m, DIALECT, "2"], expect_difference: true, expect: {
        contains: "d:1"}}
    - {command: [FT.SEARCH, idx, "(@m:{big})=>[KNN 1 @vec $B AS dist]", PARAMS, "2",
        B, !!binary 'AAAAAAAAAAA=', SORTBY, dist, WITHSORTKEYS, RETURN, "1", dist,
        DIALECT, "2"], expect_difference: true, expect: {contains: "#4398046511104"}}
    - {command: [FT.SEARCH, idx, "@m:{none}", SORTBY, p, ASC, WITHSORTKEYS, DIALECT,
        "2"], expect: {equals: [0]}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [sortkeys.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: sortkeys}
