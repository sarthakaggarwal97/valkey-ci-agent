extends: [valkey.liveness]
id: proposed.text-stem-prefilter-crash
deployment:
  modes: [standalone]
metadata:
  description: Filtered KNN over a stemmed term where a candidate doc shares a stem
    but not a surface form must not crash
inputs:
  required: [module, module_parent]
  properties:
    module:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "module build under test, {$ref: artifacts.module.path}"
    module_parent:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "parent commit module build, {$ref: artifacts.module_parent.path}"
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: textcrash
  config:
    modules: [{$ref: inputs.module}]
    modules_parent: [{$ref: inputs.module_parent}]
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
    - {command: [FT.CREATE, idx, ON, HASH, PREFIX, 1, "doc:", SCHEMA, content, TEXT,
        category, TAG, embedding, VECTOR, FLAT, 6, TYPE, FLOAT32, DIM, 2, DISTANCE_METRIC,
        COSINE], expect: {equals: OK}}
    - {command: [HSET, "doc:1", content, "connection speed", category, foo, embedding,
        !!binary "AACAPwAAAAA="], expect: {equals: 4}}
    - {command: [HSET, "doc:2", content, "connected users", category, foo, embedding,
        !!binary "AAAAAAAAgD8="], expect: {equals: 4}}
    - {command: [FT.SEARCH, idx, "@category:{foo}", NOCONTENT, DIALECT, 2], wait_s: 30,
      compare: unordered, expect: {contains: "doc:2"}}
    - {command: [FT.SEARCH, idx, "(@content:connection @category:{foo})=>[KNN 10 @embedding\
          \ $q]", PARAMS, 2, q, !!binary "AACAPwAAAAA=", DIALECT, 2, NOCONTENT], expect_difference: true,
      compare: unordered, expect: {contains: "doc:2"}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_evidence:
- {evidence_id: valkey.command.sequence, source: textcrash}
