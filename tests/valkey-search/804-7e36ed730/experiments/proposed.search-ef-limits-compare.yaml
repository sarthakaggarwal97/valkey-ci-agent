extends: [valkey.liveness]
id: proposed.search-ef-limits-compare
deployment:
  modes: [standalone]
metadata:
  description: FT.CREATE and FT.SEARCH EF_CONSTRUCTION/EF_RUNTIME values above the
    old 4096 cap, the raised search.max-vector-ef-* configs, and an RDB reload of
    an index built with EF values at the new 1000000 maximum, compared against the
    parent module build
inputs:
  required: [module, module_parent]
  properties:
    module:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "The module build under test, {$ref: artifacts.module.path}"
    module_parent:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "The parent commit's build of the module, {$ref: artifacts.module_parent.path}"
    resp: {type: integer, enum: [2, 3], default: 2}
    cluster: {type: boolean, default: false}
components:
- use: valkey.action.commands
  id: ef
  config:
    modules: [{$ref: inputs.module}]
    modules_parent: [{$ref: inputs.module_parent}]
    resp: {$ref: inputs.resp}
    cluster: {$ref: inputs.cluster}
    timeout_s: 180
    commands:
    - {command: [CONFIG, SET, search.max-vector-ef-runtime, "1000000"], expect_difference: true,
      expect: {equals: OK}}
    - {command: [CONFIG, SET, search.max-vector-ef-construction, "1000000"], expect_difference: true,
      expect: {equals: OK}}
    - {command: [FT.CREATE, idx1, ON, HASH, PREFIX, 1, "doc:", SCHEMA, v, VECTOR,
        HNSW, 12, TYPE, FLOAT32, DIM, 2, DISTANCE_METRIC, L2, M, 8, EF_CONSTRUCTION,
        4096, EF_RUNTIME, 4096], expect: {equals: OK}}
    - {command: [HSET, "doc:1", v, !!binary 'AACAPwAAAAA='], expect: {equals: 1}}
    - {command: [HSET, "doc:2", v, !!binary 'AAAAAAAAgD8='], expect: {equals: 1}}
    - {command: [HSET, "doc:3", v, !!binary 'AACAPwAAgD8='], expect: {equals: 1}}
    - {command: [FT.INFO, idx1], wait_s: 20, compare: skip, expect: {contains: 3}}
    - {command: [FT.SEARCH, idx1, "*=>[KNN 3 @v $BLOB EF_RUNTIME 4096]", PARAMS, 2,
        BLOB, !!binary 'AACAPwAAAAA=', DIALECT, 2], compare: unordered, expect: {
        contains: "doc:1"}}
    - {command: [FT.SEARCH, idx1, "*=>[KNN 3 @v $BLOB EF_RUNTIME 4097]", PARAMS, 2,
        BLOB, !!binary 'AACAPwAAAAA=', DIALECT, 2], expect_difference: true, compare: unordered,
      expect: {error: false}}
    - {command: [FT.SEARCH, idx1, "*=>[KNN 3 @v $BLOB EF_RUNTIME 1000000]", PARAMS,
        2, BLOB, !!binary 'AACAPwAAAAA=', DIALECT, 2], expect_difference: true, compare: unordered,
      expect: {error: false}}
    - {command: [FT.SEARCH, idx1, "*=>[KNN 3 @v $BLOB EF_RUNTIME 1000001]", PARAMS,
        2, BLOB, !!binary 'AACAPwAAAAA=', DIALECT, 2], expect_difference: true, expect: {
        error: "cannot exceed 1000000"}}
    - {command: [FT.SEARCH, idx1, "*=>[KNN 3 @v $BLOB EF_RUNTIME 0]", PARAMS, 2, BLOB,
        !!binary 'AACAPwAAAAA=', DIALECT, 2], expect_difference: true, expect: {error: "cannot\
          \ exceed 1000000"}}
    - {command: [FT.CREATE, idxbad, ON, HASH, PREFIX, 1, "bad:", SCHEMA, v, VECTOR,
        HNSW, 8, TYPE, FLOAT32, DIM, 2, DISTANCE_METRIC, L2, EF_CONSTRUCTION, 1000001],
      expect_difference: true, expect: {error: "cannot exceed 1000000"}}
    - {command: [FT.CREATE, idx2, ON, HASH, PREFIX, 1, "big:", SCHEMA, v, VECTOR,
        HNSW, 12, TYPE, FLOAT32, DIM, 2, DISTANCE_METRIC, L2, M, 8, EF_CONSTRUCTION,
        1000000, EF_RUNTIME, 1000000], expect_difference: true, expect: {equals: OK}}
    - {command: [HSET, "big:1", v, !!binary 'AACAPwAAAAA='], expect: {equals: 1}}
    - {command: [HSET, "big:2", v, !!binary 'AAAAAAAAgD8='], expect: {equals: 1}}
    - {command: [FT.SEARCH, idx2, "*=>[KNN 2 @v $BLOB EF_RUNTIME 1000000]", PARAMS,
        2, BLOB, !!binary 'AACAPwAAAAA=', DIALECT, 2], wait_s: 20, expect_difference: true,
      compare: unordered, expect: {contains: "big:1"}}
    - {command: [CONFIG, SET, search.max-vector-ef-runtime, "100"], expect: {equals: OK}}
    - {command: [FT.SEARCH, idx1, "*=>[KNN 3 @v $BLOB EF_RUNTIME 200]", PARAMS, 2,
        BLOB, !!binary 'AACAPwAAAAA=', DIALECT, 2], expect: {error: "cannot exceed\
          \ 100"}}
    - {command: [CONFIG, SET, search.max-vector-ef-runtime, "500000"], expect_difference: true,
      expect: {equals: OK}}
    - {command: [FT.SEARCH, idx1, "*=>[KNN 3 @v $BLOB EF_RUNTIME 500001]", PARAMS,
        2, BLOB, !!binary 'AACAPwAAAAA=', DIALECT, 2], expect_difference: true, expect: {
        error: "cannot exceed 500000"}}
    - {command: [CONFIG, SET, search.max-vector-ef-construction, "999999"], expect_difference: true,
      expect: {equals: OK}}
    - {command: [FT.CREATE, idx3, ON, HASH, PREFIX, 1, "c:", SCHEMA, v, VECTOR, HNSW,
        10, TYPE, FLOAT32, DIM, 2, DISTANCE_METRIC, L2, EF_CONSTRUCTION, 999999, EF_RUNTIME,
        50], expect_difference: true, expect: {equals: OK}}
    - {command: [SAVE], expect: {equals: OK}}
    - {restart: true, expect: {equals: OK}}
    - {command: [FT._LIST], expect_difference: true, compare: unordered, expect: {
        contains: idx2}}
    - {command: [FT.SEARCH, idx2, "*=>[KNN 2 @v $BLOB EF_RUNTIME 1000000]", PARAMS,
        2, BLOB, !!binary 'AACAPwAAAAA=', DIALECT, 2], wait_s: 20, expect_difference: true,
      compare: unordered, expect: {contains: "big:1"}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [ef.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: ef}
