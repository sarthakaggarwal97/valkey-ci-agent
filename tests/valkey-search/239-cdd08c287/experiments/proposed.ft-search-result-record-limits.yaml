extends: [valkey.liveness]
id: proposed.ft-search-result-record-limits
deployment:
  modes: [standalone]
metadata:
  description: FT.SEARCH drops result records over the new max-search-result-record-size
    and fields-count limits, compared against the parent module build where no limits
    exist
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    hash_listpack_entries: {type: integer, default: 128}
components:
