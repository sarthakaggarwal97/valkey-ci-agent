extends: [valkey.liveness]
id: proposed.ft-multilang-compare
deployment:
  modes: [standalone]
metadata:
  description: FT.CREATE LANGUAGE FRENCH/RUSSIAN succeeds only on the change; per-language
    stemming, typographic punctuation, Unicode whitespace delimiters, FT.INFO, and
    RDB save/reload of a 1.3.0-stamped index
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: lang
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
    - {command: [FT.CREATE, idxf, ON, HASH, PREFIX, 1, "f:", LANGUAGE, FRENCH, SCHEMA,
        t, TEXT], expect_difference: true, expect: {equals: OK}}
    - {command: [FT.CREATE, idxr, ON, HASH, PREFIX, 1, "r:", LANGUAGE, RUSSIAN, SCHEMA,
        t, TEXT], expect_difference: true, expect: {equals: OK}}
    - {command: [FT.CREATE, idxe, ON, HASH, PREFIX, 1, "f:", SCHEMA, t, TEXT], expect: {
        equals: OK}}
    - {command: [FT.CREATE, bad, ON, HASH, PREFIX, 1, "x:", LANGUAGE, KLINGON, SCHEMA,
        t, TEXT], expect: {error: true}}
    - {command: [HSET, "f:1", t, "Les chats c\xE9l\xE8bres"], expect: {equals: 1}}
    - {command: [HSET, "f:2", t, "chat noir"], expect: {equals: 1}}
    - {command: [HSET, "f:3", t, "rouge\u2014vert"], expect: {equals: 1}}
    - {command: [HSET, "f:4", t, "jaune\_bleu"], expect: {equals: 1}}
    - {command: [HSET, "r:1", t, "\u043A\u043E\u0448\u043A\u0438"], expect: {equals: 1}}
    - {command: [FT.SEARCH, idxe, noir, LIMIT, 0, 0], wait_s: 20, expect: {equals: [
          1]}}
    - {command: [FT.SEARCH, idxf, noir, LIMIT, 0, 0], wait_s: 20, expect_difference: true,
      expect: {equals: [1]}}
    - {command: [FT.SEARCH, idxr, "\u043A\u043E\u0448\u043A\u0438", LIMIT, 0, 0],
      wait_s: 20, expect_difference: true, expect: {equals: [1]}}
    - {command: [FT.SEARCH, idxf, chat, LIMIT, 0, 0], expect_difference: true, expect: {
        equals: [2]}}
    - {command: [FT.SEARCH, idxr, "\u043A\u043E\u0448\u043A\u0430", LIMIT, 0, 0],
      expect_difference: true, expect: {equals: [1]}}
    - {command: [FT.SEARCH, idxf, vert, LIMIT, 0, 0], expect_difference: true, expect: {
        equals: [1]}}
    - {command: [FT.SEARCH, idxe, vert, LIMIT, 0, 0], expect: {equals: [0]}}
    - {command: [FT.SEARCH, idxf, bleu, LIMIT, 0, 0], expect_difference: true, expect: {
        equals: [1]}}
    - {command: [FT.SEARCH, idxe, bleu, LIMIT, 0, 0], expect: {equals: [0]}}
    - {command: [FT.INFO, idxf], expect_difference: true, expect: {error: false}}
    - {command: [SAVE], expect: {equals: OK}}
    - {restart: true, expect: {equals: OK}}
    - {command: [FT.SEARCH, idxe, noir, LIMIT, 0, 0], wait_s: 20, expect: {equals: [
          1]}}
    - {command: [FT.SEARCH, idxf, noir, LIMIT, 0, 0], wait_s: 20, expect_difference: true,
      expect: {equals: [1]}}
    - {command: [FT.SEARCH, idxf, chat, LIMIT, 0, 0], expect_difference: true, expect: {
        equals: [2]}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [lang.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: lang}
