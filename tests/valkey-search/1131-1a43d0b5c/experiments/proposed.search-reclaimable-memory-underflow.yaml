extends: [valkey.liveness]
id: proposed.search-reclaimable-memory-underflow
deployment:
  modes: [standalone]
metadata:
  description: >-
    Concurrent HSET overwrites of indexed vectors, batched in MULTI/EXEC so the writer
    thread pool processes them in parallel, drive hnswlib markDelete (+= vector_size)
    / unmarkDeletedInternal (-= vector_size) cycles on the shared Metrics reclaimable_memory
    counter. On the parent the counter is a plain uint64_t, so racing updates can
    be lost and the counter underflows to a huge value; with the fix it is atomic
    and must settle at its exact deterministic value at every drain checkpoint: 0
    after balanced overwrite churn, deleted_count*vector_size (8 keys x 8 bytes =
    64) after DEL, and 0 again after FT.DROPINDEX, read from INFO SEARCH search_index_reclaimable_memory.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    writer_threads: {type: integer, minimum: 1, maximum: 1024, default: 64}
components:
- use: valkey.action.commands
  id: churn
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - {command: [CONFIG, SET, search.writer-threads, {$ref: inputs.writer_threads}],
      expect: {equals: OK}}
    - {command: [FT.CREATE, idx, SCHEMA, v, VECTOR, HNSW, 6, TYPE, FLOAT32, DIM, 2,
        DISTANCE_METRIC, L2], expect: {equals: OK}}
    - {command: [HSET, a, v, !!binary "AACAPwAAgD8="], expect: {equals: 1}}
    - {command: [HSET, b, v, !!binary "AACAPwAAgD8="], expect: {equals: 1}}
