extends: [valkey.liveness]
id: proposed.hnsw-concurrent-write-compare
deployment:
  modes: [standalone]
metadata:
  description: Concurrent HNSW inserts, updates, deletes and backfill through the
    writer thread pool, replies compared across the addPoint lock-reorder change
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    writer_threads: {type: integer, minimum: 1, maximum: 64, default: 8}
    m: {type: integer, minimum: 2, maximum: 64, default: 16}
components:
- use: valkey.action.commands
  id: hnsw
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - {command: [CONFIG, SET, search.writer-threads, {$ref: inputs.writer_threads}],
      expect: {equals: OK}}
    - {command: [FT.CREATE, idx, ON, HASH, PREFIX, 1, d, SCHEMA, v, VECTOR, HNSW,
        12, TYPE, FLOAT32, DIM, 2, DISTANCE_METRIC, L2, M, {$ref: inputs.m}, EF_CONSTRUCTION,
        64, EF_RUNTIME, 250], expect: {equals: OK}}
    - {command: [HSET, d001, v, v0000001], expect: {equals: 1}}
    - {command: [HSET, d002, v, v0000002], expect: {equals: 1}}
    - {command: [HSET, d003, v, v0000003], expect: {equals: 1}}
    - {command: [HSET, d004, v, v0000004], expect: {equals: 1}}
    - {command: [HSET, d005, v, v0000005], expect: {equals: 1}}
