        12, TYPE, FLOAT32, DIM, 2, DISTANCE_METRIC, L2, M, {$ref: inputs.m}, EF_CONSTRUCTION,
        64, EF_RUNTIME, 250], expect: {equals: OK}}
    - {command: [FT.INFO, idx2], wait_s: 60, compare: skip, expect: {contains: '60'}}
    - {command: [FT.INFO, idx], wait_s: 30, compare: skip, expect: {contains: '60'}}
    - {command: [FT.SEARCH, idx, '*=>[KNN 100 @v $q]', PARAMS, 2, q, v0000050, NOCONTENT,
        LIMIT, 0, 100], compare: unordered, expect: {contains: d011}}
    - {command: [FT.SEARCH, idx2, '*=>[KNN 100 @v $q]', PARAMS, 2, q, v0000050, NOCONTENT,
        LIMIT, 0, 100], compare: unordered, expect: {contains: d050}}
    - {command: [FT.DROPINDEX, idx], expect: {equals: OK}}
    - {command: [FT.SEARCH, idx, '*=>[KNN 1 @v $q]', PARAMS, 2, q, v0000050, NOCONTENT],
      expect: {error: true}}
    checks:
      acl: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [hnsw.completed]
required_evidence:
