extends: [valkey.liveness]
id: proposed.search-dev-config-gating
deployment:
  modes: [standalone]
metadata:
  description: >-
    After the change CONFIG SET of search.prefiltering-threshold-ratio and search.text-rax-target-mutex-pool-size
    is rejected with a debug-mode error and the defaults stay in force, while the
    parent accepts the new values; non-Dev configs and tag-filter search keep working
    on both.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: devcfg
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 15
    commands:
    - {command: [CONFIG, GET, search.prefiltering-threshold-ratio], expect: {contains: "0.001"}}
    - {command: [CONFIG, GET, search.text-rax-target-mutex-pool-size], expect: {contains: "256"}}
    - {command: [CONFIG, SET, search.prefiltering-threshold-ratio, "0.5"], expect_difference: true,
      expect: {error: "debug-mode"}}
    - {command: [CONFIG, GET, search.prefiltering-threshold-ratio], expect_difference: true,
      expect: {contains: "0.001"}}
    - {command: [CONFIG, SET, search.text-rax-target-mutex-pool-size, "65536"], expect_difference: true,
      expect: {error: "debug-mode"}}
    - {command: [CONFIG, GET, search.text-rax-target-mutex-pool-size], expect_difference: true,
      expect: {contains: "256"}}
    - {command: [CONFIG, SET, search.text-rax-target-mutex-pool-size, "1"], expect_difference: true,
      expect: {error: "debug-mode"}}
    - {command: [CONFIG, SET, search.prefiltering-threshold-ratio, not-a-number],
      expect_difference: true, expect: {error: "debug-mode"}}
    - {command: [CONFIG, SET, search.prefiltering-threshold-ratio, "1.5"], expect_difference: true,
      expect: {error: "debug-mode"}}
    - {command: [CONFIG, SET, search.query-string-bytes, "100000"], expect: {equals: OK}}
    - {command: [FT._DEBUG, LIST_CONFIGS, DEV], expect: {error: "unknown command"}}
    - {command: [FT.CREATE, idx, ON, HASH, PREFIX, 1, "item:", SCHEMA, tags, TAG],
      expect: {equals: OK}}
    - {command: [HSET, 'item:1', tags, t1], expect: {equals: 1}}
    - {command: [HSET, 'item:2', tags, t50], expect: {equals: 1}}
    - {command: [HSET, 'item:3', tags, t100], expect: {equals: 1}}
    - {command: [FT.INFO, idx], compare: skip, wait_s: 30, expect: {contains: 3}}
    - {command: [FT.SEARCH, idx, "@tags:{t1|t2|t3|t4|t5|t6|t7|t8|t9|t10|t11|t12|t13|t14|t15|t16|t17|t18|t19|t20|t21|t22|t23|t24|t25|t26|t27|t28|t29|t30|t31|t32|t33|t34|t35|t36|t37|t38|t39|t40|t41|t42|t43|t44|t45|t46|t47|t48|t49|t50|t51|t52|t53|t54|t55|t56|t57|t58|t59|t60|t61|t62|t63|t64|t65|t66|t67|t68|t69|t70|t71|t72|t73|t74|t75|t76|t77|t78|t79|t80|t81|t82|t83|t84|t85|t86|t87|t88|t89|t90|t91|t92|t93|t94|t95|t96|t97|t98|t99|t100}",
        NOCONTENT], compare: unordered, wait_s: 30, expect: {contains: 3}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [devcfg.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: devcfg}
