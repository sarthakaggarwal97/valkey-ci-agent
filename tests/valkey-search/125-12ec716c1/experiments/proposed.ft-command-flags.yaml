extends: [valkey.liveness]
id: proposed.ft-command-flags
deployment:
  modes: [standalone]
metadata:
  description: FT command registration flags changed - FT.SEARCH gains deny-oom, FT.CREATE/FT.DROPINDEX
    lose the write flag (a read-only replica no longer rejects them), and COMMAND
    INFO replies change for all FT commands
inputs:
  required: [module, module_parent]
  properties:
    module:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "The module build under test, {$ref: artifacts.module.path}"
    module_parent:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "The parent commit's build of the module, {$ref: artifacts.module_parent.path}"
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: ftflags
  config:
    modules: [{$ref: inputs.module}]
    modules_parent: [{$ref: inputs.module_parent}]
    resp: {$ref: inputs.resp}
    nodes: 2
    timeout_s: 30
    commands:
    - {command: [FT.CREATE, idx, ON, HASH, PREFIX, 1, 'doc:', SCHEMA, vec, VECTOR,
        FLAT, 6, TYPE, FLOAT32, DIM, 2, DISTANCE_METRIC, L2], expect: {equals: OK}}
    - {command: [HSET, 'doc:1', vec, !!binary 'AACAPwAAAAA='], expect: {equals: 1}}
    - {command: [FT.SEARCH, idx, '*=>[KNN 1 @vec $q]', PARAMS, 2, q, !!binary 'AACAPwAAAAA=',
        NOCONTENT, DIALECT, 2], wait_s: 30, expect: {contains: 'doc:1'}}
    - {command: [COMMAND, INFO, 'ft.search'], expect_difference: true, expect: {exists: true}}
    - {command: [COMMAND, INFO, 'ft.create'], expect_difference: true, expect: {exists: true}}
    - {command: [COMMAND, INFO, 'ft.dropindex'], expect_difference: true, expect: {
        exists: true}}
    - {command: [COMMAND, INFO, 'ft._list'], expect_difference: true, expect: {exists: true}}
    - {node: 1, command: [REPLICAOF, '<node.0.host>', '<node.0.port>'], expect: {
        equals: OK}}
    - {node: 1, command: [INFO, replication], wait_s: 30, expect: {contains: 'master_link_status:up'},
      compare: skip}
    - {node: 1, command: [FT._LIST], wait_s: 30, expect: {contains: idx}, compare: unordered}
    - {node: 1, command: [FT.CREATE, replidx, ON, HASH, PREFIX, 1, 'doc:', SCHEMA,
        v, VECTOR, FLAT, 6, TYPE, FLOAT32, DIM, 2, DISTANCE_METRIC, L2], expect_difference: true,
      expect: {error: false}}
    - {node: 1, command: [FT.DROPINDEX, idx], expect_difference: true, expect: {error: false}}
    - {node: 1, command: [FT._LIST], expect_difference: true, expect: {exists: true},
      compare: unordered}
    - {command: [CONFIG, SET, maxmemory, 1], expect: {equals: OK}}
    - {command: [FT.SEARCH, idx, '*=>[KNN 1 @vec $q]', PARAMS, 2, q, !!binary 'AACAPwAAAAA=',
        NOCONTENT, DIALECT, 2], expect_difference: true, expect: {error: 'OOM'}}
    - {command: [FT.CREATE, oomidx, ON, HASH, PREFIX, 1, 'doc:', SCHEMA, v, VECTOR,
        FLAT, 6, TYPE, FLOAT32, DIM, 2, DISTANCE_METRIC, L2], expect: {error: 'OOM'}}
    - {command: [FT.DROPINDEX, idx], expect: {equals: OK}}
    - {command: [CONFIG, SET, maxmemory, 0], expect: {equals: OK}}
    checks:
      acl: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [ftflags.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: ftflags}
