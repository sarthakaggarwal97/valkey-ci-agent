extends: [valkey.liveness]
id: proposed.untracked-keys-negative-query
deployment:
  modes: [standalone]
metadata:
  description: Keys matching the index prefix but missing the indexed field (untracked)
    counted consistently by match-all and negative queries while ingested concurrently
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: idx
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 30
    checks: {concurrency: 8}
    commands:
    - {command: [FT.CREATE, idx, ON, HASH, PREFIX, 1, 'doc:', SCHEMA, tags, TAG, price,
        NUMERIC], expect: {equals: OK}}
    - {command: [HSET, 'doc:1', tags, footwear, price, '50'], expect: {equals: 2}}
    - {command: [HSET, 'doc:2', tags, clothing, price, '80'], expect: {equals: 2}}
    - {command: [HSET, 'doc:3', tags, footwear, price, '40'], expect: {equals: 2}}
    - {command: [HSET, 'doc:4', other, x], expect: {equals: 1}}
    - {command: [HSET, 'doc:5', other, y], expect: {equals: 1}}
    - {command: [HSET, 'doc:6', other, z], expect: {equals: 1}}
    - {command: [FT.INFO, idx], wait_s: 10, compare: skip, expect: {contains: num_docs}}
    - {command: [FT.SEARCH, idx, '*', NOCONTENT, LIMIT, '0', '0'], expect_difference: true,
      expect: {exists: true}}
    - {command: [FT.SEARCH, idx, '-@tags:{footwear}', NOCONTENT, LIMIT, '0', '0'],
      expect_difference: true, compare: unordered, expect: {exists: true}}
    - {command: [FT.SEARCH, idx, '-@tags:{nonexistent}', NOCONTENT, LIMIT, '0', '0'],
      expect_difference: true, compare: unordered, expect: {exists: true}}
required_evidence:
- {evidence_id: valkey.command.sequence, source: idx}
