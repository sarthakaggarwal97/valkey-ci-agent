    - {command: [HSET, "doc:12", t, "red,green,blue", v1, !!binary "AACAPwAAAEA=",
        v2, !!binary "AACAPwAAAEA="], expect: {equals: 3}}
    - {command: [FT.INFO, idx1], wait_s: 30, expect: {contains: 12}, compare: skip}
    - {command: [HSET, "doc:1", t, "blue,yellow", v1, !!binary "AABAQAAAgEA=", v2,
        !!binary "AABAQAAAgEA="], expect: {equals: 0}}
