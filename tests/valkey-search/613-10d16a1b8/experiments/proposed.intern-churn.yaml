extends: [valkey.liveness]
id: proposed.intern-churn
deployment:
  modes: [standalone]
metadata:
  description: Overlapping FT.CREATE backfills, FT.DROPINDEX mass releases and HSET/DEL
    churn race valkey-search's interned-string refcount 1->0 transition against re-interning
    of the same key, tag and vector strings
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: churn
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 120
    commands:
    - {command: [CONFIG, SET, search.writer-threads, "64"], compare: skip}
    - {command: [CONFIG, SET, search.reader-threads, "64"], compare: skip}
    - {command: [FT.CREATE, idx1, ON, HASH, PREFIX, "1", "doc:", SCHEMA, t, TAG, SEPARATOR,
        ",", v1, VECTOR, FLAT, "6", TYPE, FLOAT32, DIM, "2", DISTANCE_METRIC, L2,
        v2, VECTOR, HNSW, "6", TYPE, FLOAT32, DIM, "2", DISTANCE_METRIC, L2], expect: {
        equals: OK}}
    - {command: [HSET, "doc:1", t, "red,green,blue", v1, !!binary "AACAPwAAAEA=",
        v2, !!binary "AACAPwAAAEA="], expect: {equals: 3}}
    - {command: [HSET, "doc:2", t, "red,green,blue", v1, !!binary "AACAPwAAAEA=",
        v2, !!binary "AACAPwAAAEA="], expect: {equals: 3}}
    - {command: [HSET, "doc:3", t, "red,green,blue", v1, !!binary "AACAPwAAAEA=",
        v2, !!binary "AACAPwAAAEA="], expect: {equals: 3}}
    - {command: [HSET, "doc:4", t, "red,green,blue", v1, !!binary "AACAPwAAAEA=",
        v2, !!binary "AACAPwAAAEA="], expect: {equals: 3}}
    - {command: [HSET, "doc:5", t, "red,green,blue", v1, !!binary "AACAPwAAAEA=",
        v2, !!binary "AACAPwAAAEA="], expect: {equals: 3}}
    - {command: [HSET, "doc:6", t, "red,green,blue", v1, !!binary "AACAPwAAAEA=",
        v2, !!binary "AACAPwAAAEA="], expect: {equals: 3}}
    - {command: [HSET, "doc:7", t, "red,green,blue", v1, !!binary "AACAPwAAAEA=",
        v2, !!binary "AACAPwAAAEA="], expect: {equals: 3}}
    - {command: [HSET, "doc:8", t, "red,green,blue", v1, !!binary "AACAPwAAAEA=",
        v2, !!binary "AACAPwAAAEA="], expect: {equals: 3}}
    - {command: [HSET, "doc:9", t, "red,green,blue", v1, !!binary "AACAPwAAAEA=",
        v2, !!binary "AACAPwAAAEA="], expect: {equals: 3}}
    - {command: [HSET, "doc:10", t, "red,green,blue", v1, !!binary "AACAPwAAAEA=",
        v2, !!binary "AACAPwAAAEA="], expect: {equals: 3}}
    - {command: [HSET, "doc:11", t, "red,green,blue", v1, !!binary "AACAPwAAAEA=",
