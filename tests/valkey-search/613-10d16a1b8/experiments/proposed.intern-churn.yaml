    - {command: [DEL, "doc:7", "doc:8", "doc:9", "doc:10", "doc:11", "doc:12"], expect: {
        equals: 6}}
    - {command: [FT.CREATE, idx2, ON, HASH, PREFIX, "1", "doc:", SCHEMA, t, TAG, SEPARATOR,
