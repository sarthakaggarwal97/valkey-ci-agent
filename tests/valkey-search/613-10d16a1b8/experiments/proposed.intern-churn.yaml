    - {command: [HSET, "doc:3", t, "red,green,blue", v1, !!binary "AACAPwAAAEA=",
        v2, !!binary "AACAPwAAAEA="], expect: {equals: 0}}
    - {command: [FT.CREATE, idx3, ON, HASH, PREFIX, "1", "doc:", SCHEMA, t, TAG, SEPARATOR,
        ",", v1, VECTOR, FLAT, "6", TYPE, FLOAT32, DIM, "2", DISTANCE_METRIC, L2,
