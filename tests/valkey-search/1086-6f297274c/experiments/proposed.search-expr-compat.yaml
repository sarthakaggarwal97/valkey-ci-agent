extends: [valkey.liveness]
id: proposed.search-expr-compat
deployment:
  modes: [standalone]
metadata:
  description: search.emulate-release 1.2.1 switches APPLY to the fixed semantics
    on the change build; the parent (1.2.0) rejects the version and keeps the legacy
    replies
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: expr
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
    - {command: [FT.CREATE, idx, ON, HASH, PREFIX, 1, "doc:", SCHEMA, n, NUMERIC],
      expect: {equals: OK}}
    - {command: [HSET, "doc:1", n, 1], expect: {equals: 1}}
    - {command: [FT.SEARCH, idx, "*", NOCONTENT, LIMIT, 0, 0], wait_s: 20, expect: {
        contains: 1}}
    - {command: [CONFIG, SET, search.emulate-release, "1.2.1"], expect_difference: true,
      expect: {equals: OK}}
    - {command: [FT.AGGREGATE, idx, "*", APPLY, "lower(0)", AS, r, LIMIT, 0, 10, DIALECT,
        2], expect_difference: true, expect: {error: false}}
    - {command: [FT.AGGREGATE, idx, "*", APPLY, "abs('a')", AS, r, LIMIT, 0, 10, DIALECT,
        2], expect_difference: true, expect: {error: false}}
    - {command: [FT.AGGREGATE, idx, "*", APPLY, "timefmt(0,'')", AS, r, LIMIT, 0,
        10, DIALECT, 2], expect_difference: true, expect: {error: false}}
    - {command: [FT.AGGREGATE, idx, "*", APPLY, "month(1739565015)", AS, r, LIMIT,
        0, 10, DIALECT, 2], expect_difference: true, expect: {error: false}}
    - {command: [FT.AGGREGATE, idx, "*", APPLY, "hour(-1)", AS, r, LIMIT, 0, 10, DIALECT,
        2], expect_difference: true, expect: {error: false}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [expr.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: expr}
