extends: [valkey.liveness]
id: proposed.ft-info-reply-types
deployment:
  modes: [standalone]
metadata:
  description: FT.INFO num_docs, num_terms and num_records switch from bulk string
    to RESP integer
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: ftinfo
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - {command: [FT.CREATE, idx, ON, HASH, PREFIX, 1, 'doc:', SCHEMA, v, VECTOR, HNSW,
        6, TYPE, FLOAT32, DIM, 2, DISTANCE_METRIC, L2, t, TAG, n, NUMERIC], expect: {
        equals: OK}}
    - {command: [FT.INFO, idx], wait_s: 30, expect_difference: true, expect: {contains: ready}}
    - {command: [HSET, 'doc:1', v, !!binary 'AACAPwAAAAA=', t, red, n, 1], expect: {
        equals: 3}}
    - {command: [HSET, 'doc:2', v, !!binary 'AAAAAAAAgD8=', t, blue, n, 2], expect: {
        equals: 3}}
    - {command: [HSET, 'doc:3', v, !!binary 'AACAPwAAgD8=', t, red, n, 3], expect: {
        equals: 3}}
    - {command: [FT.INFO, idx], wait_s: 30, expect_difference: true, expect: {contains: 3}}
    - {command: [FT.SEARCH, idx, '@t:{red}', NOCONTENT], compare: unordered}
    checks:
      acl: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [ftinfo.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: ftinfo}
