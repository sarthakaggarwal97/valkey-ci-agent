extends: [valkey.liveness]
id: proposed.ft-score-field-persistence
deployment:
  modes: [standalone]
metadata:
  description: An index with SCORE 0.25 and SCORE_FIELD must survive a SAVE and restart
    (RDB aux or AOF replay) with its score settings intact, compared across module
    builds
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    appendonly: {type: string, enum: ["yes", "no"], default: "no"}
components:
- use: valkey.action.commands
  id: persist
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    server_config: {appendonly: {$ref: inputs.appendonly}}
    timeout_s: 180
    commands:
    - {command: [FT.CREATE, idxp, "ON", HASH, PREFIX, 1, "p:", SCORE, "0.25", SCORE_FIELD,
        w, SCHEMA, tag, TAG, n, NUMERIC], expect_difference: true, expect: {equals: OK}}
    - {command: [FT.CREATE, idxd, "ON", HASH, PREFIX, 1, "q:", SCHEMA, tag, TAG, n,
        NUMERIC], expect: {equals: OK}}
    - {command: [HSET, "p:1", tag, a, n, 1, w, "0.9"], expect: {equals: 3}}
    - {command: [HSET, "p:2", tag, b, n, 2], expect: {equals: 2}}
    - {command: [HSET, "q:1", tag, a, n, 1], expect: {equals: 2}}
    - {command: [FT.SEARCH, idxd, "*", LIMIT, 0, 0], wait_s: 30, expect: {equals: [
          1]}}
    - {command: [FT.SEARCH, idxp, "*", LIMIT, 0, 0], wait_s: 15, expect_difference: true,
      expect: {equals: [2]}}
    - {command: [SAVE], expect: {equals: OK}}
    - {restart: true, expect: {equals: OK}}
    - {command: [FT.INFO, idxp], expect_difference: true, expect: {contains: score_field}}
    - {command: [FT.INFO, idxp], expect_difference: true, expect: {contains: "0.25"}}
    - {command: [FT.INFO, idxd], expect_difference: true, expect: {contains: default_score}}
    - {command: [FT.SEARCH, idxd, "*", LIMIT, 0, 0], wait_s: 60, expect: {equals: [
          1]}}
    - {command: [FT.SEARCH, idxp, "*", LIMIT, 0, 0], wait_s: 20, expect_difference: true,
      expect: {equals: [2]}}
    - {command: [HSET, "p:3", tag, c, n, 3, w, "0.5"], expect: {equals: 3}}
    - {command: [HSET, "p:1", w, bogus], expect: {equals: 0}}
    - {command: [FT.SEARCH, idxp, "*", LIMIT, 0, 0], wait_s: 20, expect_difference: true,
      expect: {equals: [3]}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [persist.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: persist}
