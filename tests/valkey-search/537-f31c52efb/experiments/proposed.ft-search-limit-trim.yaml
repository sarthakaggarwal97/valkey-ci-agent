extends: [valkey.liveness]
id: proposed.ft-search-limit-trim
deployment:
  modes: [standalone]
metadata:
  description: FT.SEARCH LIMIT offset/count windows and the new search-result-buffer-multiplier
    compared across the module change and its parent, standalone trimming path
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: trim
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 180
    commands:
    - {command: [FT.CREATE, bulk, ON, HASH, PREFIX, "1", "b:", SCHEMA, p, NUMERIC,
        c, TAG], expect: {equals: OK}}
    - {command: [HSET, "b:0", p, "0", c, c0], expect: {equals: 2}}
    - {command: [HSET, "b:1", p, "1", c, c1], expect: {equals: 2}}
    - {command: [HSET, "b:2", p, "2", c, c2], expect: {equals: 2}}
    - {command: [HSET, "b:3", p, "3", c, c3], expect: {equals: 2}}
    - {command: [HSET, "b:4", p, "4", c, c0], expect: {equals: 2}}
    - {command: [HSET, "b:5", p, "5", c, c1], expect: {equals: 2}}
    - {command: [HSET, "b:6", p, "6", c, c2], expect: {equals: 2}}
    - {command: [HSET, "b:7", p, "7", c, c3], expect: {equals: 2}}
    - {command: [HSET, "b:8", p, "8", c, c0], expect: {equals: 2}}
    - {command: [HSET, "b:9", p, "9", c, c1], expect: {equals: 2}}
    - {command: [HSET, "b:10", p, "10", c, c2], expect: {equals: 2}}
    - {command: [HSET, "b:11", p, "11", c, c3], expect: {equals: 2}}
    - {command: [HSET, "b:12", p, "12", c, c0], expect: {equals: 2}}
    - {command: [HSET, "b:13", p, "13", c, c1], expect: {equals: 2}}
    - {command: [HSET, "b:14", p, "14", c, c2], expect: {equals: 2}}
    - {command: [HSET, "b:15", p, "15", c, c3], expect: {equals: 2}}
    - {command: [HSET, "b:16", p, "16", c, c0], expect: {equals: 2}}
    - {command: [HSET, "b:17", p, "17", c, c1], expect: {equals: 2}}
    - {command: [HSET, "b:18", p, "18", c, c2], expect: {equals: 2}}
    - {command: [HSET, "b:19", p, "19", c, c3], expect: {equals: 2}}
    - {command: [HSET, "b:20", p, "20", c, c0], expect: {equals: 2}}
    - {command: [HSET, "b:21", p, "21", c, c1], expect: {equals: 2}}
    - {command: [HSET, "b:22", p, "22", c, c2], expect: {equals: 2}}
    - {command: [HSET, "b:23", p, "23", c, c3], expect: {equals: 2}}
    - {command: [HSET, "b:24", p, "24", c, c0], expect: {equals: 2}}
    - {command: [HSET, "b:25", p, "25", c, c1], expect: {equals: 2}}
    - {command: [HSET, "b:26", p, "26", c, c2], expect: {equals: 2}}
    - {command: [HSET, "b:27", p, "27", c, c3], expect: {equals: 2}}
    - {command: [HSET, "b:28", p, "28", c, c0], expect: {equals: 2}}
    - {command: [HSET, "b:29", p, "29", c, c1], expect: {equals: 2}}
    - {command: [HSET, "b:30", p, "30", c, c2], expect: {equals: 2}}
    - {command: [HSET, "b:31", p, "31", c, c3], expect: {equals: 2}}
    - {command: [FT.SEARCH, bulk, "@p:[0 +inf]", LIMIT, "0", "0"], wait_s: 60, expect: {
        equals: [32]}}
    - {command: [FT.SEARCH, bulk, "@p:[0 +inf]", NOCONTENT, LIMIT, "0", "10"], compare: unordered}
    - {command: [FT.SEARCH, bulk, "@p:[0 +inf]", LIMIT, "0", "10"], compare: unordered}
    - {command: [FT.SEARCH, bulk, "@p:[0 +inf]", NOCONTENT, LIMIT, "10", "5"], compare: unordered}
    - {command: [FT.SEARCH, bulk, "@p:[0 +inf]", LIMIT, "10", "5"], compare: unordered}
    - {command: [FT.SEARCH, bulk, "@p:[0 +inf]", NOCONTENT, LIMIT, "30", "10"], compare: unordered}
    - {command: [FT.SEARCH, bulk, "@p:[0 +inf]", NOCONTENT, LIMIT, "31", "1"], compare: unordered}
    - {command: [FT.SEARCH, bulk, "@p:[0 +inf]", NOCONTENT, LIMIT, "32", "5"], expect: {
        equals: [32]}}
    - {command: [FT.SEARCH, bulk, "@p:[0 +inf]", NOCONTENT, LIMIT, "100", "5"], expect: {
        equals: [32]}}
    - {command: [FT.SEARCH, bulk, "@p:[0 +inf]", NOCONTENT, LIMIT, "4294967296", "10"],
      expect: {equals: [32]}}
    - {command: [FT.SEARCH, bulk, "@p:[0 +inf]", NOCONTENT, LIMIT, "18446744073709551615",
        "1"], expect: {equals: [32]}}
    - {command: [FT.SEARCH, bulk, "@p:[0 +inf]", NOCONTENT, LIMIT, "0", "4294967295"],
      compare: unordered}
    - {command: [FT.SEARCH, bulk, "@p:[0 +inf]", NOCONTENT, LIMIT, "0", "18446744073709551615"],
      compare: unordered}
    - {command: [FT.SEARCH, bulk, "@p:[0 +inf]", NOCONTENT, LIMIT, "-1", "5"], expect: {
        error: true}}
    - {command: [FT.SEARCH, bulk, "@c:{c0}", NOCONTENT, LIMIT, "2", "3"], compare: unordered}
    - {command: [FT.SEARCH, bulk, "@c:{c0|c1}", NOCONTENT, LIMIT, "3", "100"], compare: unordered}
    - {command: [FT.SEARCH, bulk, "@p:[5 12]", LIMIT, "1", "3"], compare: unordered}
    - {command: [CONFIG, SET, search.search-result-buffer-multiplier, "2.5"], expect_difference: true,
      expect: {equals: OK}}
    - {command: [CONFIG, GET, search.search-result-buffer-multiplier], expect_difference: true,
      expect: {exists: true}}
    - {command: [CONFIG, SET, search.search-result-buffer-multiplier, "0.5"], expect_difference: true,
      expect: {error: "Buffer multiplier"}}
    - {command: [CONFIG, SET, search.search-result-buffer-multiplier, "1001.0"], expect_difference: true,
      expect: {error: "Buffer multiplier"}}
    - {command: [CONFIG, SET, search.search-result-buffer-multiplier, notanumber],
      expect_difference: true, expect: {error: "valid number"}}
    - {command: [CONFIG, SET, search.search-result-buffer-multiplier, "1.0"], expect_difference: true,
      expect: {equals: OK}}
    - {command: [FT.SEARCH, bulk, "@p:[0 +inf]", NOCONTENT, LIMIT, "0", "10"], compare: unordered}
    - {command: [FT.SEARCH, bulk, "@p:[0 +inf]", NOCONTENT, LIMIT, "10", "5"], compare: unordered}
    - {command: [FT.SEARCH, bulk, "@p:[0 +inf]", NOCONTENT, LIMIT, "30", "10"], compare: unordered}
    - {command: [FT.SEARCH, bulk, "@p:[0 +inf]", LIMIT, "31", "1"], compare: unordered}
    - {command: [CONFIG, SET, search.search-result-buffer-multiplier, "1000.0"], expect_difference: true,
      expect: {equals: OK}}
    - {command: [FT.SEARCH, bulk, "@p:[0 +inf]", NOCONTENT, LIMIT, "5", "20"], compare: unordered}
    - {command: [FT.SEARCH, bulk, "@p:[0 +inf]", LIMIT, "0", "1"], compare: unordered}
    - {command: [FT.AGGREGATE, bulk, "@p:[0 +inf]", LOAD, "1", "@p", SORTBY, "2",
        "@p", ASC, LIMIT, "0", "5"]}
    - {command: [FT.AGGREGATE, bulk, "@p:[0 +inf]", LOAD, "1", "@p", LIMIT, "0", "5"],
      compare: unordered}
    - {command: [MULTI], expect: {equals: OK}}
    - {command: [FT.SEARCH, bulk, "@p:[0 +inf]", LIMIT, "0", "0"], expect: {equals: QUEUED}}
    - {command: [FT.SEARCH, bulk, "@p:[0 +inf]", NOCONTENT, LIMIT, "30", "5"], expect: {
        equals: QUEUED}}
    - {command: [EXEC], expect: {exists: true}}
    - {command: [FT.CREATE, vidx, ON, HASH, PREFIX, "1", "v:", SCHEMA, vec, VECTOR,
        FLAT, "6", TYPE, FLOAT32, DIM, "2", DISTANCE_METRIC, L2], expect: {equals: OK}}
    - {command: [HSET, "v:0", vec, !!binary "AAAAAAAAAAA="], expect: {equals: 1}}
    - {command: [HSET, "v:1", vec, !!binary "AACAPwAAAAA="], expect: {equals: 1}}
    - {command: [HSET, "v:2", vec, !!binary "AAAAQAAAAAA="], expect: {equals: 1}}
    - {command: [HSET, "v:3", vec, !!binary "AABAQAAAAAA="], expect: {equals: 1}}
    - {command: [HSET, "v:4", vec, !!binary "AACAQAAAAAA="], expect: {equals: 1}}
    - {command: [HSET, "v:5", vec, !!binary "AACgQAAAAAA="], expect: {equals: 1}}
    - {command: [HSET, "v:6", vec, !!binary "AADAQAAAAAA="], expect: {equals: 1}}
    - {command: [HSET, "v:7", vec, !!binary "AADgQAAAAAA="], expect: {equals: 1}}
    - {command: [HSET, "v:8", vec, !!binary "AAAAQQAAAAA="], expect: {equals: 1}}
    - {command: [HSET, "v:9", vec, !!binary "AAAQQQAAAAA="], expect: {equals: 1}}
    - {command: [FT.SEARCH, vidx, "*=>[KNN 10 @vec $B]", PARAMS, "2", B, !!binary "AAAAAAAAAAA=",
        DIALECT, "2", NOCONTENT, LIMIT, "0", "0"], wait_s: 60, expect: {equals: [
          10]}}
    - {command: [FT.SEARCH, vidx, "*=>[KNN 5 @vec $B]", PARAMS, "2", B, !!binary "AAAAAAAAAAA=",
        DIALECT, "2", NOCONTENT], compare: unordered}
    - {command: [FT.SEARCH, vidx, "*=>[KNN 5 @vec $B]", PARAMS, "2", B, !!binary "AAAAAAAAAAA=",
        DIALECT, "2", NOCONTENT, LIMIT, "2", "5"], compare: unordered}
    - {command: [FT.SEARCH, vidx, "*=>[KNN 5 @vec $B]", PARAMS, "2", B, !!binary "AAAAAAAAAAA=",
        DIALECT, "2", NOCONTENT, LIMIT, "5", "5"], expect: {equals: [5]}}
    - {command: [FT.SEARCH, vidx, "*=>[KNN 5 @vec $B]", PARAMS, "2", B, !!binary "AAAAAAAAAAA=",
        DIALECT, "2", LIMIT, "1", "2"], compare: unordered}
    - {command: [FT.SEARCH, vidx, "*=>[KNN 5 @vec $B]", PARAMS, "2", B, !!binary "AAAAAAAAAAA=",
        DIALECT, "2", NOCONTENT, LIMIT, "4", "0"], expect: {equals: [5]}}
    checks:
      acl: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [trim.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: trim}
