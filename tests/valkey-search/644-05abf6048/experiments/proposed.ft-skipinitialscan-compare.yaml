extends: [valkey.liveness]
id: proposed.ft-skipinitialscan-compare
deployment:
  modes: [standalone]
metadata:
  description: FT.CREATE SKIPINITIALSCAN parsing and backfill-skip semantics compared
    across the module change and its parent
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: ftskip
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
    - {command: [HSET, "doc:1", tag, red, title, one], expect: {equals: 2}}
    - {command: [HSET, "doc:2", tag, blue, title, two], expect: {equals: 2}}
    - {command: [FT.CREATE, idx_normal, ON, HASH, PREFIX, "1", "doc:", SCHEMA, tag,
        TAG], expect: {equals: OK}}
    - {command: [FT.CREATE, idx_skip, ON, HASH, PREFIX, "1", "doc:", SKIPINITIALSCAN,
        SCHEMA, tag, TAG], expect_difference: true, expect: {equals: OK}}
    - {command: [FT.CREATE, idx_skip2, ON, HASH, skipinitialscan, SCHEMA, tag, TAG],
      expect_difference: true, expect: {equals: OK}}
    - {command: [FT.CREATE, idx_skip3, ON, HASH, SKIPINITIALSCAN, SKIPINITIALSCAN,
        SCHEMA, tag, TAG], expect_difference: true, expect: {equals: OK}}
    - {command: [FT.CREATE, idx_misplaced, SKIPINITIALSCAN, ON, HASH, SCHEMA, tag,
        TAG], expect_difference: true, expect: {error: "Unexpected parameter"}}
    - {command: [FT.CREATE, idx_trailing, ON, HASH, SCHEMA, tag, TAG, SKIPINITIALSCAN],
      expect: {error: true}}
    - {command: [FT.CREATE, idx_field, ON, HASH, SCHEMA, SKIPINITIALSCAN, TAG], expect: {
        equals: OK}}
    - {command: [FT.INFO, idx_normal], wait_s: 30, expect: {contains: ready}, compare: skip}
    - {command: [FT.SEARCH, idx_normal, "@tag:{red | blue}", NOCONTENT], compare: unordered,
      expect: {contains: "doc:1"}}
    - {command: [FT.SEARCH, idx_skip, "@tag:{red | blue}", NOCONTENT], expect_difference: true,
      expect: {equals: [0]}}
    - {command: [HSET, "doc:3", tag, red], expect: {equals: 1}}
    - {command: [HSET, "doc:4", tag, blue], expect: {equals: 1}}
    - {command: [FT.SEARCH, idx_normal, "@tag:{red | blue}", NOCONTENT], wait_s: 30,
      expect: {contains: "doc:3"}, compare: skip}
    - {command: [FT.SEARCH, idx_normal, "@tag:{red | blue}", NOCONTENT], wait_s: 30,
      expect: {contains: "doc:4"}, compare: skip}
    - {command: [FT.SEARCH, idx_normal, "@tag:{red | blue}", NOCONTENT], compare: unordered,
      expect: {contains: "doc:1"}}
    - {command: [FT.SEARCH, idx_skip, "@tag:{red}", NOCONTENT], wait_s: 20, expect_difference: true,
      expect: {equals: [1, "doc:3"]}}
    - {command: [FT.SEARCH, idx_skip, "@tag:{red | blue}", NOCONTENT], expect_difference: true,
      compare: unordered, expect: {contains: "doc:4"}}
    - {command: [FT.INFO, idx_skip], expect_difference: true, expect: {contains: idx_skip}}
    - {command: [FT._LIST], expect_difference: true, compare: unordered, expect: {
        contains: idx_skip}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [ftskip.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: ftskip}
