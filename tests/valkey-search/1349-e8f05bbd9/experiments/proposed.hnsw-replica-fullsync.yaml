extends: [valkey.liveness]
id: proposed.hnsw-replica-fullsync
deployment:
  modes: [standalone]
metadata:
  description: A single-element HNSW index transfers to a replica over full sync;
    the parent replica fails to load it
components:
- use: valkey.action.commands
  id: hnsw
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    nodes: 2
    resp: 2
    timeout_s: 50
    commands:
    - {command: [FT.CREATE, idx, ON, HASH, PREFIX, 1, "doc:", SCHEMA, vec, VECTOR,
        HNSW, 6, TYPE, FLOAT32, DIM, 3, DISTANCE_METRIC, L2], node: 0, expect: {equals: OK}}
    - {command: [HSET, "doc:0", vec, !!binary "AACAPwAAAAAAAAAA"], node: 0, expect: {
        equals: 1}}
    - {command: [FT.SEARCH, idx, "*=>[KNN 10 @vec $q]", PARAMS, 2, q, !!binary "AACAPwAAAAAAAAAA",
        DIALECT, 2, NOCONTENT], node: 0, wait_s: 20, compare: unordered, expect: {
        contains: 1}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [FT.SEARCH, idx, "*=>[KNN 10 @vec $q]", PARAMS, 2, q, !!binary "AACAPwAAAAAAAAAA",
        DIALECT, 2, NOCONTENT], node: 1, wait_s: 30, compare: unordered, expect_difference: true,
      expect: {contains: 1}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [hnsw.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: hnsw}
