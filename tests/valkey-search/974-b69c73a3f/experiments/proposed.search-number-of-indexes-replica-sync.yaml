extends: [valkey.liveness]
id: proposed.search-number-of-indexes-replica-sync
deployment:
  modes: [standalone]
metadata:
  description: search_number_of_indexes on a replica after full sync loads staged
    index sections
inputs:
  required: [module, module_parent]
  properties:
    module:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "The module build under test, {$ref: artifacts.module.path}"
    module_parent:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "The parent commit's build of the module, {$ref: artifacts.module_parent.path}"
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: sync
  config:
    modules: [{$ref: inputs.module}]
    modules_parent: [{$ref: inputs.module_parent}]
    resp: {$ref: inputs.resp}
    nodes: 2
    timeout_s: 60
    commands:
    - {command: [FT.CREATE, idxlocal, ON, HASH, PREFIX, 1, 'c:', SCHEMA, g, TAG],
      node: 1, expect: {equals: OK}}
    - {command: [FT.CREATE, idx0, ON, HASH, PREFIX, 1, 'a:', SCHEMA, t, TAG, n, NUMERIC],
      node: 0, expect: {equals: OK}}
    - {command: [CONFIG, SET, search.info-developer-visible, yes], node: 1, expect: {
        equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [FT._LIST], node: 1, wait_s: 15, compare: unordered, expect: {equals: [
          idx0]}}
    - {command: [INFO, SEARCH], node: 1, expect_difference: true, expect: {contains: "search_rdb_last_restore_aux_load_duration_ms:"}}
    - {command: [INFO, SEARCH], node: 1, compare: skip, expect: {contains: "search_number_of_indexes:1\r"}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [sync.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: sync}
