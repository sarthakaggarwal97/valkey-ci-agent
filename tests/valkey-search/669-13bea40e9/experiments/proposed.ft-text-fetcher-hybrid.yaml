extends: [valkey.liveness]
id: proposed.ft-text-fetcher-hybrid
deployment:
  modes: [standalone]
metadata:
  description: Nested and hybrid FT.SEARCH text queries solved by the new recursive
    entries-fetcher path, replies compared across the change and parent module builds
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: ftsearch
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 120
    commands:
    - command: [CONFIG, GET, search.enable-proximity-prefilter-eval]
      expect_difference: true
      expect: {exists: true}
    - command: [CONFIG, SET, search.enable-proximity-prefilter-eval, "no"]
      expect_difference: true
      expect: {error: true}
    - command: [FT.CREATE, idx, ON, HASH, PREFIX, 1, "hash:", SCHEMA, title, TEXT,
        NOSTEM, body, TEXT, color, TAG, price, NUMERIC]
      expect: {equals: OK}
    - command: [HSET, "hash:00", title, plum, body, "cat slow loud shark ocean eagle\
          \ tomato", color, green, price, 21]
      expect: {equals: 4}
    - command: [HSET, "hash:01", title, "kiwi peach apple chair orange door orange\
          \ melon chair", body, lettuce, color, green, price, 8]
      expect: {equals: 4}
    - command: [HSET, "hash:02", title, plum, body, "river cat slow build eagle fast\
          \ dog", color, brown, price, 40]
      expect: {equals: 4}
    - command: [HSET, "hash:03", title, banana, body, "quick brown fox jumps", color,
        red, price, 15]
      expect: {equals: 4}
    - command: [HSET, "hash:04", title, grape, body, "lazy dog sleeps", color, blue,
        price, 25]
      expect: {equals: 4}
    - command: [FT.INFO, idx]
      wait_s: 30
      expect: {contains: ready}
      compare: skip
    - command: [FT.SEARCH, idx, "@price:[0 100]", LIMIT, 0, 0, DIALECT, 2]
      wait_s: 30
      expect: {equals: [5]}
    - command: [FT.SEARCH, idx, "@color:{green} cat slow loud @price:[10 30] shark",
        NOCONTENT, DIALECT, 2]
      expect: {equals: [1, "hash:00"]}
    - command: [FT.SEARCH, idx, "cat @color:{green} slow loud @price:[10 30] shark",
        NOCONTENT, DIALECT, 2, INORDER]
      expect: {equals: [1, "hash:00"]}
    - command: [FT.SEARCH, idx, "slow @color:{green} cat loud @price:[10 30] shark",
        NOCONTENT, DIALECT, 2, INORDER]
      expect: {equals: [0]}
    - command: [FT.SEARCH, idx, "@color:{green} cat slow @price:[10 30] soft", NOCONTENT,
        DIALECT, 2]
      expect: {equals: [0]}
    - command: [FT.SEARCH, idx, "(cat | dog) @price:[10 30] @color:{green}", NOCONTENT,
        DIALECT, 2]
      expect: {equals: [1, "hash:00"]}
    - command: [FT.SEARCH, idx, "((cat slow) | (quick brown)) @color:{green|red}",
        LIMIT, 0, 0, DIALECT, 2]
      expect: {equals: [2]}
    - command: [FT.SEARCH, idx, "((cat slow) | (quick brown)) @color:{green|red}",
        NOCONTENT, DIALECT, 2]
      compare: unordered
    - command: [FT.SEARCH, idx, "(((cat slow) @price:[10 30]) | (lettuce @color:{green}))",
        LIMIT, 0, 0, DIALECT, 2]
      expect: {equals: [2]}
    - command: [FT.SEARCH, idx, "((cat | river) (slow | fast)) @price:[30 50] @color:{brown}",
        NOCONTENT, DIALECT, 2]
      expect: {equals: [1, "hash:02"]}
    - command: [FT.SEARCH, idx, "((cat slow @color:{green}) | (dog fast @color:{brown})\
          \ | (fox jumps @color:{red}))", LIMIT, 0, 0, DIALECT, 2]
      expect: {equals: [3]}
    - command: [FT.SEARCH, idx, "((cat shark) | (quick fox)) @color:{green|red}",
        SLOP, 3, LIMIT, 0, 0, DIALECT, 2]
      expect: {equals: [2]}
    - command: [FT.SEARCH, idx, "(((cat | shark) | (quick | fox)) @price:[10 30])",
        LIMIT, 0, 0, DIALECT, 2]
      expect: {equals: [2]}
    - command: [FT.SEARCH, idx, "(((((cat | shark) | lettuce) | fox) | dog) @color:{green|red|brown|blue})",
        LIMIT, 0, 0, DIALECT, 2]
      expect: {equals: [5]}
    - command: [FT.SEARCH, idx, "((slow cat) | (brown quick)) @color:{green|red}",
        NOCONTENT, INORDER, DIALECT, 2]
      expect: {equals: [0]}
    - command: [FT.SEARCH, idx, "((cat slow @price:[10 30]) | (lettuce @color:{green}))",
        LIMIT, 0, 0, INORDER, DIALECT, 2]
      expect: {equals: [2]}
    - command: [FT.SEARCH, idx, "cat (dog | @price:[10 30]) shark", NOCONTENT, DIALECT,
        2, INORDER]
      expect: {equals: [1, "hash:00"]}
    - command: [FT.SEARCH, idx, "cat (dog | @price:[100 200]) shark", NOCONTENT, DIALECT,
        2]
      expect: {equals: [0]}
    - command: [FT.SEARCH, idx, "cat (dog | (slow @price:[10 30])) shark", NOCONTENT,
        DIALECT, 2, INORDER]
      expect: {equals: [1, "hash:00"]}
    - command: [FT.SEARCH, idx, "@price:[500 600] | (@price:[0 100] (@price:[99 100]\
          \ | (@price:[10 40] (cat slow shark @price:[20 25]))))", NOCONTENT, DIALECT,
        2, INORDER]
      expect: {equals: [1, "hash:00"]}
    - command: [FT.SEARCH, idx, "(cat (quick | @price:[10 30])) | lettuce", LIMIT,
        0, 0, DIALECT, 2]
      expect: {equals: [2]}
    - command: [FT.SEARCH, idx, "((cat | @price:[10 30]) | (fox | @color:{red}))",
        LIMIT, 0, 0, DIALECT, 2]
      expect: {equals: [4]}
    - command: [FT.SEARCH, idx, "(cat | @price:[10 30]) (fox | @color:{red})", NOCONTENT,
        DIALECT, 2]
      expect: {equals: [1, "hash:03"]}
    - command: [FT.SEARCH, idx, "(cat | shark) (fox | @price:[10 30])", NOCONTENT,
        DIALECT, 2]
      expect: {equals: [1, "hash:00"]}
    - command: [FT.SEARCH, idx, "((cat | (quick | @price:[10 30])) | @color:{green})",
        LIMIT, 0, 0, DIALECT, 2]
      expect: {equals: [5]}
    - command: [FT.SEARCH, idx, '"cat slow"', LIMIT, 0, 0, DIALECT, 2]
      expect: {equals: [2]}
    - command: [FT.SEARCH, idx, '("cat slow" | "quick brown")', LIMIT, 0, 0, DIALECT,
        2]
      expect: {equals: [3]}
    - command: [FT.SEARCH, idx, '("cat slow" | "quick brown")', NOCONTENT, DIALECT,
        2]
      compare: unordered
    - command: [FT.SEARCH, idx, "((cat slow) | (quick brown))", LIMIT, 0, 0, INORDER,
        DIALECT, 2]
      expect: {equals: [3]}
    - command: [FT.SEARCH, idx, "(((cat | shark) | lettuce) | fox)", LIMIT, 0, 0,
        DIALECT, 2]
      expect: {equals: [4]}
    - command: [FT.SEARCH, idx, "(((cat | shark) | lettuce) | fox)", NOCONTENT, DIALECT,
        2]
      compare: unordered
    checks:
      acl: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [ftsearch.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: ftsearch}
