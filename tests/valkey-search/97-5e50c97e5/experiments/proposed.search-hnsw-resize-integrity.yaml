extends: [valkey.liveness]
id: proposed.search-hnsw-resize-integrity
deployment:
  modes: [standalone]
metadata:
  description: HNSW index with a tiny INITIAL_CAP and a configured block size grows
    across the resize and keeps every vector searchable
components:
- use: valkey.action.commands
  id: resize
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: 2
    timeout_s: 30
    commands:
    - {command: [CONFIG, SET, search.hnsw-block-size, 50000], expect_difference: true,
      expect: {equals: OK}}
    - {command: [FT.CREATE, idx, ON, HASH, PREFIX, 1, "doc:", SCHEMA, vec, VECTOR,
        HNSW, 10, TYPE, FLOAT32, DIM, 2, DISTANCE_METRIC, L2, INITIAL_CAP, 2, M, 16],
      expect: {equals: OK}}
    - {command: [HSET, "doc:1", vec, !!binary "AACAPwAAAAA="], expect: {equals: 1}}
    - {command: [HSET, "doc:2", vec, !!binary "AACAPwAAAAA="], expect: {equals: 1}}
    - {command: [HSET, "doc:3", vec, !!binary "AACAPwAAAAA="], expect: {equals: 1}}
    - {command: [HSET, "doc:4", vec, !!binary "AACAPwAAAAA="], expect: {equals: 1}}
    - {command: [HSET, "doc:5", vec, !!binary "AACAPwAAAAA="], expect: {equals: 1}}
    - {command: [HSET, "doc:6", vec, !!binary "AACAPwAAAAA="], expect: {equals: 1}}
    - {command: [HSET, "doc:7", vec, !!binary "AACAPwAAAAA="], expect: {equals: 1}}
    - {command: [FT.INFO, idx], wait_s: 20, compare: skip, expect: {contains: "7"}}
    - {command: [FT.SEARCH, idx, "*=>[KNN 7 @vec $q]", PARAMS, 2, q, !!binary "AACAPwAAAAA="],
      compare: unordered, expect: {contains: "doc:7"}}
    checks:
      acl: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_evidence:
- {evidence_id: valkey.command.sequence, source: resize}
