extends: [valkey.liveness]
id: proposed.search-timeout-compare
deployment:
  modes: [standalone]
metadata:
  description: FT.SEARCH timeout reimplementation compared across module builds -
    forced cancellation of HNSW, flat and prefiltered searches, enable-partial-results
    toggle, TIMEOUT 0 semantics, sync path inside MULTI/EXEC, and the new timeout
    configs
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: seq
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 120
    commands:
    - {command: [FT.CREATE, hnsw, ON, HASH, PREFIX, '0', SCHEMA, v, VECTOR, HNSW,
        '6', TYPE, FLOAT32, DIM, '4', DISTANCE_METRIC, L2, n, NUMERIC], expect: {
        equals: OK}}
    - {command: [FT.CREATE, flat, ON, HASH, PREFIX, '0', SCHEMA, v, VECTOR, FLAT,
        '6', TYPE, FLOAT32, DIM, '4', DISTANCE_METRIC, L2, n, NUMERIC], expect: {
        equals: OK}}
    - {command: [HSET, d1, v, '0000000000000001', n, '1'], expect: {equals: 2}}
    - {command: [HSET, d2, v, '0000000000000002', n, '2'], expect: {equals: 2}}
    - {command: [HSET, d3, v, '0000000000000003', n, '3'], expect: {equals: 2}}
    - {command: [HSET, d4, v, '0000000000000004', n, '4'], expect: {equals: 2}}
    - {command: [HSET, d5, v, '0000000000000005', n, '5'], expect: {equals: 2}}
    - {command: [HSET, d6, v, '0000000000000006', n, '6'], expect: {equals: 2}}
    - {command: [HSET, d7, v, '0000000000000007', n, '7'], expect: {equals: 2}}
    - {command: [HSET, d8, v, '0000000000000008', n, '8'], expect: {equals: 2}}
    - {command: [HSET, d9, v, '0000000000000009', n, '9'], expect: {equals: 2}}
    - {command: [HSET, d10, v, '0000000000000010', n, '10'], expect: {equals: 2}}
    - {command: [HSET, d11, v, '0000000000000011', n, '11'], expect: {equals: 2}}
    - {command: [HSET, d12, v, '0000000000000012', n, '12'], expect: {equals: 2}}
    - {command: [HSET, d13, v, '0000000000000013', n, '13'], expect: {equals: 2}}
    - {command: [HSET, d14, v, '0000000000000014', n, '14'], expect: {equals: 2}}
    - {command: [HSET, d15, v, '0000000000000015', n, '15'], expect: {equals: 2}}
    - {command: [HSET, d16, v, '0000000000000016', n, '16'], expect: {equals: 2}}
    - {command: [HSET, d17, v, '0000000000000017', n, '17'], expect: {equals: 2}}
    - {command: [HSET, d18, v, '0000000000000018', n, '18'], expect: {equals: 2}}
    - {command: [HSET, d19, v, '0000000000000019', n, '19'], expect: {equals: 2}}
    - {command: [HSET, d20, v, '0000000000000020', n, '20'], expect: {equals: 2}}
    - {command: [HSET, d21, v, '0000000000000021', n, '21'], expect: {equals: 2}}
    - {command: [HSET, d22, v, '0000000000000022', n, '22'], expect: {equals: 2}}
    - {command: [HSET, d23, v, '0000000000000023', n, '23'], expect: {equals: 2}}
    - {command: [HSET, d24, v, '0000000000000024', n, '24'], expect: {equals: 2}}
    - {command: [HSET, d25, v, '0000000000000025', n, '25'], expect: {equals: 2}}
    - {command: [HSET, d26, v, '0000000000000026', n, '26'], expect: {equals: 2}}
    - {command: [HSET, d27, v, '0000000000000027', n, '27'], expect: {equals: 2}}
    - {command: [HSET, d28, v, '0000000000000028', n, '28'], expect: {equals: 2}}
    - {command: [HSET, d29, v, '0000000000000029', n, '29'], expect: {equals: 2}}
    - {command: [HSET, d30, v, '0000000000000030', n, '30'], expect: {equals: 2}}
    - {command: [HSET, d31, v, '0000000000000031', n, '31'], expect: {equals: 2}}
    - {command: [HSET, d32, v, '0000000000000032', n, '32'], expect: {equals: 2}}
    - {command: [FT.SEARCH, hnsw, '@n:[0 100]', LIMIT, '0', '0'], wait_s: 60, expect: {
        contains: '32'}}
    - {command: [FT.SEARCH, flat, '@n:[0 100]', LIMIT, '0', '0'], wait_s: 60, expect: {
        contains: '32'}}
    - {command: [CONFIG, SET, search.info-developer-visible, 'yes'], expect: {equals: OK}}
    - {command: [FT.SEARCH, hnsw, '*=>[KNN 10 @v $B]', NOCONTENT, PARAMS, '2', B,
        '0000000000000032'], compare: skip, expect: {contains: d32}}
    - {command: [FT.SEARCH, flat, '*=>[KNN 10 @v $B]', NOCONTENT, PARAMS, '2', B,
        '0000000000000032'], compare: unordered, expect: {contains: d32}}
    - {command: [FT.SEARCH, flat, '(@n:[1 3])=>[KNN 10 @v $B]', NOCONTENT, PARAMS,
        '2', B, '0000000000000032'], compare: unordered, expect: {contains: d3}}
    - {command: [CONFIG, GET, search.default-timeout-ms], expect_difference: true,
      expect: {contains: '50000'}}
    - {command: [CONFIG, GET, search.coordinator-query-timeout-secs], expect_difference: true,
      expect: {contains: '120'}}
    - {command: [CONFIG, SET, search.default-timeout-ms, '60001'], expect_difference: true,
      expect: {error: true}}
    - {command: [CONFIG, SET, search.enable-partial-results, 'no'], expect_difference: true,
      expect: {equals: OK}}
    - {command: [CONFIG, SET, search.test-force-timeout, 'yes'], expect_difference: true,
      expect: {equals: OK}}
    - {command: [CONFIG, SET, search.timeout-poll-frequency, '1'], expect_difference: true,
      expect: {equals: OK}}
    - {command: [FT.SEARCH, hnsw, '*=>[KNN 10 @v $B]', NOCONTENT, PARAMS, '2', B,
        '0000000000000032'], expect_difference: true, expect: {error: 'cancelled due
          to timeout'}}
    - {command: [FT.SEARCH, flat, '*=>[KNN 10 @v $B]', NOCONTENT, PARAMS, '2', B,
        '0000000000000032'], expect_difference: true, expect: {error: 'cancelled due
          to timeout'}}
    - {command: [FT.SEARCH, flat, '(@n:[1 3])=>[KNN 10 @v $B]', NOCONTENT, PARAMS,
        '2', B, '0000000000000032'], expect_difference: true, expect: {error: 'cancelled
          due to timeout'}}
    - {command: [FT.SEARCH, hnsw, '(@n:[1 3])=>[KNN 10 @v $B]', NOCONTENT, PARAMS,
        '2', B, '0000000000000032'], expect_difference: true, expect: {error: 'cancelled
          due to timeout'}}
    - {command: [MULTI], expect: {equals: OK}}
    - {command: [FT.SEARCH, hnsw, '*=>[KNN 10 @v $B]', NOCONTENT, PARAMS, '2', B,
        '0000000000000032'], expect: {equals: QUEUED}}
    - {command: [EXEC], expect_difference: true, expect: {exists: true}}
    - {command: [CONFIG, SET, search.enable-partial-results, 'yes'], expect_difference: true,
      expect: {equals: OK}}
    - {command: [FT.SEARCH, hnsw, '*=>[KNN 10 @v $B]', NOCONTENT, PARAMS, '2', B,
        '0000000000000032'], compare: unordered, expect_difference: true, expect: {
        exists: true}}
    - {command: [FT.SEARCH, flat, '*=>[KNN 10 @v $B]', NOCONTENT, PARAMS, '2', B,
        '0000000000000032'], compare: unordered, expect_difference: true, expect: {
        exists: true}}
    - {command: [CONFIG, SET, search.test-force-timeout, 'no'], expect_difference: true,
      expect: {equals: OK}}
    - {command: [CONFIG, SET, search.enable-partial-results, 'no'], expect_difference: true,
      expect: {equals: OK}}
    - {command: [FT.SEARCH, hnsw, '*=>[KNN 10 @v $B]', NOCONTENT, TIMEOUT, '0', PARAMS,
        '2', B, '0000000000000032'], expect_difference: true, expect: {error: 'cancelled
          due to timeout'}}
    - {command: [FT.SEARCH, flat, '(@n:[1 3])=>[KNN 10 @v $B]', NOCONTENT, TIMEOUT,
        '0', PARAMS, '2', B, '0000000000000032'], expect_difference: true, expect: {
        error: 'cancelled due to timeout'}}
    - {command: [FT.SEARCH, hnsw, '*=>[KNN 10 @v $B]', NOCONTENT, TIMEOUT, '60001',
        PARAMS, '2', B, '0000000000000032'], expect: {error: true}}
    - {command: [INFO, SEARCH], expect_difference: true, expect: {contains: cancel-forced}}
    checks:
      acl: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [seq.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: seq}
