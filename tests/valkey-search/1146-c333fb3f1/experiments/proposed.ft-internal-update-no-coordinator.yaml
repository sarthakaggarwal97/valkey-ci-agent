extends: [valkey.liveness]
id: proposed.ft-internal-update-no-coordinator
deployment:
  modes: [standalone]
metadata:
  description: FT.INTERNAL_UPDATE on a server without the coordinator is rejected
    by the fixed build and leaves the server alive
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: internal_update
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 15
    commands:
    - {command: [FT.INTERNAL_UPDATE, test_id, "", ""], expect_difference: true, expect: {
        error: "coordinator"}}
    - {command: [PING], expect: {equals: PONG}}
    - {command: [FT.INTERNAL_UPDATE, "fields", "", ""], expect_difference: true, expect: {
        error: "coordinator"}}
    - {command: [PING], expect: {equals: PONG}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [internal_update.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: internal_update}
