extends: [valkey.liveness]
id: proposed.search-interning-memory-info
deployment:
  modes: [standalone]
metadata:
  description: New INFO SEARCH string_interning_memory_bytes/human fields; tag and
    key interning without an allocator, dedup, empty and keyword-shaped values, and
    FLUSHALL teardown drive the new IsolatedMemoryScope accounting in Intern and ~InternedString
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: interning
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 120
    commands:
    - {command: [FT.CREATE, idx, ON, HASH, PREFIX, 1, 'doc:', SCHEMA, tag, TAG, num,
        NUMERIC], expect: {equals: OK}}
    - {command: [HSET, 'doc:1', tag, alpha, num, 1], expect: {equals: 2}}
    - {command: [HSET, 'doc:2', tag, alpha, num, 2], expect: {equals: 2}}
    - {command: [HSET, 'doc:3', tag, 'beta,gamma,delta', num, 3], expect: {equals: 2}}
    - {command: [HSET, 'doc:4', tag, '', num, 4], expect: {equals: 2}}
    - {command: [HSET, 'doc:5', tag, fields, num, 5], expect: {equals: 2}}
    - {command: [HSET, 'doc:6', tag, 'interning-long-tag-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-end',
        num, 6], expect: {equals: 2}}
    - {command: [HSET, 'doc:7', tag, alpha, num, 7], expect: {equals: 2}}
    - {command: [INFO, SEARCH], compare: skip, wait_s: 30, expect: {contains: 'search_total_indexed_documents:7'}}
    - {command: [INFO, SEARCH], expect_difference: true, expect: {contains: 'search_string_interning_memory_bytes:'}}
    - {command: [INFO, SEARCH], expect_difference: true, expect: {contains: 'search_string_interning_memory_human:'}}
    - {command: ['FT.SEARCH', idx, '@tag:{alpha}'], compare: unordered}
    - {command: ['FT.SEARCH', idx, '@tag:{delta}'], compare: unordered}
    - {command: [DEL, 'doc:1', 'doc:2', 'doc:7'], expect: {equals: 3}}
    - {command: [INFO, SEARCH], compare: skip, wait_s: 30, expect: {contains: 'search_total_indexed_documents:4'}}
    - {command: [FLUSHALL], expect: {equals: OK}}
    - {command: [INFO, SEARCH], compare: skip, wait_s: 30, expect: {contains: 'search_string_interning_store_size:0'}}
    - {command: [INFO, SEARCH], expect_difference: true, expect: {contains: 'search_string_interning_memory_bytes:'}}
    checks:
      acl: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [interning.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: interning}
