extends: [valkey.liveness]
id: proposed.tag-rescore-inflight-wait
deployment:
  modes: [standalone]
metadata:
  description: >
    Relevance-scored tag queries (plain, aggregate with LOAD, and tag-prefiltered
    KNN) on an index with a TEXT field must wait for an in-flight mutation before
    rescoring (issue 1439); NOCONTENT tag queries must not block. A pausepoint parks
    the mutation; the writer HSET goes as raw bytes on its own connection so its blocked
    client never stalls the sequence.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: tagwait
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
    - {command: [FT.CREATE, idx, ON, HASH, PREFIX, 1, "doc:", SCHEMA, content, TEXT,
        category, TAG, vec, VECTOR, HNSW, 6, TYPE, FLOAT32, DIM, 2, DISTANCE_METRIC,
        L2], expect: {equals: OK}}
    - {command: [HSET, "doc:1", content, "hello world", category, news, vec, !!binary "AAAAAAAAAAA="],
      expect: {equals: 3}}
    - {command: [FT.SEARCH, idx, "@category:{news}", NOCONTENT], wait_s: 20, expect: {
        equals: [1, "doc:1"]}}
    - {command: [FT._DEBUG, PAUSEPOINT, SET, mutation_processing], expect: {equals: OK}}
    - {raw: "HSET doc:1 content updated\r\n", connection: writer, expect: {exists: false}}
    - {command: [FT._DEBUG, PAUSEPOINT, TEST, mutation_processing], wait_s: 20, expect: {
        min: 1}}
    - {command: [FT.SEARCH, idx, "@category:{news}", WITHSCORES, TIMEOUT, 1000], expect_difference: true,
      expect: {error: "timeout"}}
    - {command: [FT.AGGREGATE, idx, "@category:{news}", ADDSCORES, LOAD, 2, __key,
        "@category", TIMEOUT, 1000], expect_difference: true, expect: {error: true}}
    - {command: [FT.SEARCH, idx, "(@category:{news})=>[KNN 1 @vec $BLOB]", PARAMS,
        2, BLOB, !!binary "AAAAAAAAAAA=", DIALECT, 2, TIMEOUT, 1000], expect_difference: true,
      expect: {error: "timeout"}}
    - {command: [FT.SEARCH, idx, "@category:{news}", NOCONTENT, TIMEOUT, 1000], expect: {
        equals: [1, "doc:1"]}}
    - {command: [FT._DEBUG, PAUSEPOINT, RESET, mutation_processing], expect: {equals: OK}}
    - {command: [FT.SEARCH, idx, "@content:updated", NOCONTENT], wait_s: 20, expect: {
        equals: [1, "doc:1"]}}
    - {read: true, connection: writer, expect: {equals: [0]}}
    - {command: [FT._DEBUG, PAUSEPOINT, SET, mutation_processing], expect: {equals: OK}}
    - {raw: "HSET doc:1 content refreshed\r\n", connection: writer2, expect: {exists: false}}
    - {command: [FT._DEBUG, PAUSEPOINT, TEST, mutation_processing], wait_s: 20, expect: {
        min: 1}}
    - {command: [MULTI], expect: {equals: OK}}
    - {command: [FT.SEARCH, idx, "@category:{news}", WITHSCORES, TIMEOUT, 1000], expect: {
        equals: QUEUED}}
    - {command: [EXEC], expect_difference: true, expect: {exists: true}}
    - {command: [FT._DEBUG, PAUSEPOINT, RESET, mutation_processing], expect: {equals: OK}}
    - {command: [FT.SEARCH, idx, "@content:refreshed", NOCONTENT], wait_s: 20, expect: {
        equals: [1, "doc:1"]}}
    - {read: true, connection: writer2, expect: {equals: [0]}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [tagwait.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: tagwait}
