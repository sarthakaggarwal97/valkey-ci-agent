extends: [valkey.liveness]
id: proposed.ft-index-memory-rdb-restart
deployment:
  modes: [standalone]
metadata:
  description: Attribute memory tracking and positions rebuilt across SAVE and restart,
    with AS-aliased identifiers and a save taken while the mutation queue may still
    hold entries
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: reload
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - {command: [FT.CREATE, idxp, ON, HASH, PREFIX, 1, "p:", SCHEMA, h1, AS, alias_one,
        TAG, h2, AS, alias_two, NUMERIC], expect: {equals: OK}}
    - {command: [HSET, "p:1", h1, red, h2, 10], expect: {equals: 2}}
    - {command: [HSET, "p:2", h1, blue, h2, 20], expect: {equals: 2}}
    - {command: [HSET, "p:3", h1, green, h2, 30], expect: {equals: 2}}
    - {command: [SAVE], expect: {equals: OK}}
    - {restart: true, expect: {equals: OK}}
    - {command: [FT.SEARCH, idxp, "*", NOCONTENT, LIMIT, 0, 0], wait_s: 60, expect: {
        equals: [3]}}
    - {command: [FT.INFO, idxp], expect_difference: true, expect: {contains: user_indexed_memory}}
    - {command: [HSET, "p:1", h1, crimson], expect: {equals: 0}}
    - {command: [DEL, "p:2"], expect: {equals: 1}}
    - {command: [FT.SEARCH, idxp, "*", NOCONTENT, LIMIT, 0, 0], wait_s: 30, expect: {
        equals: [2]}}
    - {command: [FT.INFO, idxp], expect_difference: true, expect: {contains: user_indexed_memory}}
    - {command: [SAVE], expect: {equals: OK}}
    - {restart: true, expect: {equals: OK}}
    - {command: [FT.SEARCH, idxp, "*", NOCONTENT, LIMIT, 0, 0], wait_s: 60, expect: {
        equals: [2]}}
    - {command: [FT.INFO, idxp], expect_difference: true, expect: {contains: user_indexed_memory}}
    checks:
      acl: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [reload.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: reload}
