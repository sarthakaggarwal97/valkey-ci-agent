extends: [valkey.liveness]
id: proposed.drain-mutation-queue-on-save
deployment:
  modes: [standalone, cluster]
metadata:
  description: The new search.drain-mutation-queue-on-save config exists only on the
    change build, and a SAVE that drains the mutation queue keeps the index intact
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: drain
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 20
    commands:
    - {command: [CONFIG, SET, search.info-developer-visible, "yes"], expect: {equals: OK}}
    - {command: [FT.CREATE, idx, ON, HASH, PREFIX, 1, "doc:", SCHEMA, n, NUMERIC],
      expect: {equals: OK}}
    - {command: [CONFIG, SET, search.drain-mutation-queue-on-save, "yes"], expect_difference: true,
      expect: {equals: OK}}
    - {command: [CONFIG, GET, search.drain-mutation-queue-on-save], expect_difference: true,
      expect: {equals: [search.drain-mutation-queue-on-save, "yes"]}}
    - {command: [HSET, "doc:1", n, 1], expect: {equals: 1}}
    - {command: [HSET, "doc:2", n, 2], expect: {equals: 1}}
    - {command: [HSET, "doc:3", n, 3], expect: {equals: 1}}
    - {command: [FT.SEARCH, idx, "@n:[1 3]", NOCONTENT], wait_s: 10, compare: unordered,
      expect: {contains: "doc:1"}}
    - {command: [SAVE], expect: {equals: OK}}
    - {command: [FT.SEARCH, idx, "@n:[1 3]", NOCONTENT], wait_s: 10, compare: unordered,
      expect: {contains: "doc:2"}}
    checks:
      acl: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_evidence:
- {evidence_id: valkey.command.sequence, source: drain}
