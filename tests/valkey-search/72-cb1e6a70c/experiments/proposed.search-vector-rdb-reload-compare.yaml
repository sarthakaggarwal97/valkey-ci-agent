extends: [valkey.liveness]
id: proposed.search-vector-rdb-reload-compare
deployment:
  modes: [standalone]
metadata:
  description: Create HNSW and FLAT vector indexes, index documents, SAVE and restart;
    the parent module build crashes loading the RDB (hnswlib allocator mismatch),
    the fixed build reloads and serves queries
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: reload
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
    - {command: [FT.CREATE, idxh, ON, HASH, PREFIX, 1, "h:", SCHEMA, v, VECTOR, HNSW,
        6, TYPE, FLOAT32, DIM, 4, DISTANCE_METRIC, L2], expect: {equals: OK}}
    - {command: [FT.CREATE, idxf, ON, HASH, PREFIX, 1, "f:", SCHEMA, v, VECTOR, FLAT,
        6, TYPE, FLOAT32, DIM, 4, DISTANCE_METRIC, L2], expect: {equals: OK}}
    - {command: [HSET, "h:1", v, !!binary "AACAPwAAAAAAAAAAAAAAAA=="], expect: {equals: 1}}
    - {command: [HSET, "h:2", v, !!binary "AAAAAAAAgD8AAAAAAAAAAA=="], expect: {equals: 1}}
    - {command: [HSET, "h:3", v, !!binary "AAAAAAAAAAAAAIA/AAAAAA=="], expect: {equals: 1}}
    - {command: [HSET, "f:1", v, !!binary "AACAPwAAAAAAAAAAAAAAAA=="], expect: {equals: 1}}
    - {command: [HSET, "f:2", v, !!binary "AAAAAAAAgD8AAAAAAAAAAA=="], expect: {equals: 1}}
    - {command: [FT.SEARCH, idxh, "*=>[KNN 3 @v $B]", PARAMS, 2, B, !!binary "AACAPwAAAAAAAAAAAAAAAA==",
        DIALECT, 2, NOCONTENT], wait_s: 30, expect: {contains: "h:3"}, compare: unordered}
    - {command: [FT.SEARCH, idxf, "*=>[KNN 2 @v $B]", PARAMS, 2, B, !!binary "AACAPwAAAAAAAAAAAAAAAA==",
        DIALECT, 2, NOCONTENT], wait_s: 30, expect: {contains: "f:2"}, compare: unordered}
    - {command: [SAVE], expect: {equals: OK}}
    - {restart: true, expect_difference: true, expect: {equals: OK}}
    - {command: [PING], expect_difference: true, expect: {equals: PONG}}
    - {command: [FT.SEARCH, idxh, "*=>[KNN 3 @v $B]", PARAMS, 2, B, !!binary "AACAPwAAAAAAAAAAAAAAAA==",
        DIALECT, 2, NOCONTENT], wait_s: 15, expect_difference: true, expect: {contains: "h:3"},
      compare: unordered}
    - {command: [FT.SEARCH, idxf, "*=>[KNN 2 @v $B]", PARAMS, 2, B, !!binary "AACAPwAAAAAAAAAAAAAAAA==",
        DIALECT, 2, NOCONTENT], wait_s: 15, expect_difference: true, expect: {contains: "f:2"},
      compare: unordered}
    - {command: [EXISTS, "h:1"], expect_difference: true, expect: {equals: 1}}
    checks:
      acl: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [reload.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: reload}
