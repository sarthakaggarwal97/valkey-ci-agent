extends: [valkey.liveness]
id: proposed.tag-rax-compare
deployment:
  modes: [standalone]
metadata:
  description: TAG index reimplemented on rax - exact, prefix, negated and case-sensitive
    queries plus churn through every bag representation, replies compared against
    the patricia-tree parent
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    cluster: {type: boolean, default: false}
components:
- use: valkey.action.commands
  id: tag
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    cluster: {$ref: inputs.cluster}
    timeout_s: 240
    commands:
    - {command: [FT.CREATE, idx1, ON, HASH, PREFIX, "1", "d:", SCHEMA, tags, TAG,
        SEPARATOR, ","], expect: {equals: OK}}
    - {command: [HSET, "d:1", tags, "red,blue"], expect: {equals: 1}}
    - {command: [HSET, "d:2", tags, "Red, green ,,"], expect: {equals: 1}}
    - {command: [HSET, "d:3", tags, blue], expect: {equals: 1}}
    - {command: [HSET, "d:4", tags, r], expect: {equals: 1}}
    - {command: [HSET, "d:5", other, x], expect: {equals: 1}}
    - {command: [HSET, "d:6", tags, "redish,reddit,red"], expect: {equals: 1}}
    - {command: [HSET, "d:7", tags, 'a\,b'], expect: {equals: 1}}
    - {command: [HSET, "d:8", tags, "\xDCn\xEFcode"], expect: {equals: 1}}
    - {command: [FT.SEARCH, idx1, "@tags:{red}", LIMIT, "0", "0"], wait_s: 30, expect: {
        equals: [3]}}
    - {command: [FT.SEARCH, idx1, "@tags:{blue}", LIMIT, "0", "0"], wait_s: 30, expect: {
        equals: [2]}}
    - {command: [FT.SEARCH, idx1, "@tags:{green}", LIMIT, "0", "0"], wait_s: 30, expect: {
        equals: [1]}}
    - {command: [FT.SEARCH, idx1, "@tags:{r}", LIMIT, "0", "0"], wait_s: 30, expect: {
        equals: [1]}}
    - {command: [FT.SEARCH, idx1, "@tags:{b}", LIMIT, "0", "0"], wait_s: 30, expect: {
        equals: [1]}}
    - {command: [FT.SEARCH, idx1, "@tags:{\xDCn\xEFcode}", LIMIT, "0", "0"], wait_s: 30,
      expect: {equals: [1]}}
    - {command: [FT.SEARCH, idx1, "-@tags:{red}", LIMIT, "0", "0"], wait_s: 30, expect: {
        equals: [5]}}
    - {command: [FT.SEARCH, idx1, "@tags:{red}", NOCONTENT, LIMIT, "0", "20"], compare: unordered}
    - {command: [FT.SEARCH, idx1, "@tags:{red,red}", LIMIT, "0", "0"], expect: {equals: [
          3]}}
    - {command: [FT.SEARCH, idx1, "@tags:{blue,green}", LIMIT, "0", "0"], expect: {
        equals: [3]}}
    - {command: [FT.SEARCH, idx1, "@tags:{blue,green}", NOCONTENT, LIMIT, "0", "20"],
      compare: unordered}
    - {command: [FT.SEARCH, idx1, "@tags:{red*}", NOCONTENT, LIMIT, "0", "20"], compare: unordered}
    - {command: [FT.SEARCH, idx1, "@tags:{re*}", NOCONTENT, LIMIT, "0", "20"], compare: unordered}
    - {command: [FT.SEARCH, idx1, "@tags:{redd*}", LIMIT, "0", "0"], expect: {equals: [
          1]}}
    - {command: [FT.SEARCH, idx1, "@tags:{reddit*}", LIMIT, "0", "0"], expect: {equals: [
          1]}}
    - {command: [FT.SEARCH, idx1, "@tags:{zz*}", LIMIT, "0", "0"], expect: {equals: [
          0]}}
    - {command: [FT.SEARCH, idx1, "@tags:{r*}"], expect: {error: true}}
    - {command: [FT.SEARCH, idx1, "@tags:{*}"], expect: {error: true}}
    - {command: [FT.SEARCH, idx1, '@tags:{a\,b}', LIMIT, "0", "0"]}
    - {command: [FT.SEARCH, idx1, "-@tags:{red}", NOCONTENT, LIMIT, "0", "20"], compare: unordered}
    - {command: [HSET, "d:1", tags, blue], expect: {equals: 0}}
    - {command: [FT.SEARCH, idx1, "@tags:{red}", LIMIT, "0", "0"], wait_s: 30, expect: {
        equals: [2]}}
    - {command: [DEL, "d:2"], expect: {equals: 1}}
    - {command: [FT.SEARCH, idx1, "@tags:{green}", LIMIT, "0", "0"], wait_s: 30, expect: {
        equals: [0]}}
    - {command: [HSET, "d:2", tags, green], expect: {equals: 1}}
    - {command: [FT.SEARCH, idx1, "@tags:{green}", LIMIT, "0", "0"], wait_s: 30, expect: {
        equals: [1]}}
    - {command: [HSET, "d:s1", tags, shared], expect: {equals: 1}}
    - {command: [HSET, "d:s2", tags, shared], expect: {equals: 1}}
    - {command: [HSET, "d:s3", tags, shared], expect: {equals: 1}}
    - {command: [HSET, "d:s4", tags, shared], expect: {equals: 1}}
    - {command: [HSET, "d:s5", tags, shared], expect: {equals: 1}}
    - {command: [HSET, "d:s6", tags, shared], expect: {equals: 1}}
    - {command: [HSET, "d:s7", tags, shared], expect: {equals: 1}}
    - {command: [HSET, "d:s8", tags, shared], expect: {equals: 1}}
    - {command: [HSET, "d:s9", tags, shared], expect: {equals: 1}}
    - {command: [HSET, "d:s10", tags, shared], expect: {equals: 1}}
    - {command: [HSET, "d:s11", tags, shared], expect: {equals: 1}}
    - {command: [HSET, "d:s12", tags, shared], expect: {equals: 1}}
    - {command: [FT.SEARCH, idx1, "@tags:{shared}", LIMIT, "0", "0"], wait_s: 30,
      expect: {equals: [12]}}
    - {command: [FT.SEARCH, idx1, "@tags:{shared}", NOCONTENT, LIMIT, "0", "20"],
      compare: unordered}
    - {command: [DEL, "d:s2"], expect: {equals: 1}}
    - {command: [DEL, "d:s3"], expect: {equals: 1}}
    - {command: [DEL, "d:s4"], expect: {equals: 1}}
    - {command: [DEL, "d:s5"], expect: {equals: 1}}
    - {command: [DEL, "d:s6"], expect: {equals: 1}}
    - {command: [DEL, "d:s7"], expect: {equals: 1}}
    - {command: [DEL, "d:s8"], expect: {equals: 1}}
    - {command: [DEL, "d:s9"], expect: {equals: 1}}
    - {command: [DEL, "d:s10"], expect: {equals: 1}}
    - {command: [DEL, "d:s11"], expect: {equals: 1}}
    - {command: [DEL, "d:s12"], expect: {equals: 1}}
    - {command: [FT.SEARCH, idx1, "@tags:{shared}", LIMIT, "0", "0"], wait_s: 30,
      expect: {equals: [1]}}
    - {command: [DEL, "d:s1"], expect: {equals: 1}}
    - {command: [FT.SEARCH, idx1, "@tags:{shared}", LIMIT, "0", "0"], wait_s: 30,
      expect: {equals: [0]}}
    - {command: [HSET, "d:s1", tags, "shared,red"], expect: {equals: 1}}
    - {command: [FT.SEARCH, idx1, "@tags:{shared}", LIMIT, "0", "0"], wait_s: 30,
      expect: {equals: [1]}}
    - {command: [FT.SEARCH, idx1, "@tags:{red}", LIMIT, "0", "0"], wait_s: 30, expect: {
        equals: [2]}}
    - {command: [HSET, "d:9", tags, "t01,t02,t03,t04,t05,t06,t07,t08,t09,t10,t11,t12,t13,t14,t15,t16,t17,t18,t19,t20"],
      expect: {equals: 1}}
    - {command: [FT.SEARCH, idx1, "@tags:{t20}", LIMIT, "0", "0"], wait_s: 30, expect: {
        equals: [1]}}
    - {command: [DEL, "d:9"], expect: {equals: 1}}
    - {command: [FT.SEARCH, idx1, "@tags:{t20}", LIMIT, "0", "0"], wait_s: 30, expect: {
        equals: [0]}}
    - {command: [HSET, "d:6", tags, "red,reddit"], expect: {equals: 0}}
    - {command: [FT.SEARCH, idx1, "@tags:{redish}", LIMIT, "0", "0"], wait_s: 30,
      expect: {equals: [0]}}
    - {command: [FT.SEARCH, idx1, "@tags:{reddit}", LIMIT, "0", "0"], wait_s: 30,
      expect: {equals: [1]}}
    - {command: [FT.SEARCH, idx1, "-@tags:{red}", LIMIT, "0", "0"], wait_s: 30, expect: {
        equals: [7]}}
    - {command: [FT.SEARCH, idx1, "-@tags:{red}", NOCONTENT, LIMIT, "0", "20"], compare: unordered}
    - {command: [FT.CREATE, idx2, ON, HASH, PREFIX, "1", "c:", SCHEMA, tags, TAG,
        SEPARATOR, ",", CASESENSITIVE], expect: {equals: OK}}
    - {command: [HSET, "c:1", tags, Red], expect: {equals: 1}}
    - {command: [HSET, "c:2", tags, red], expect: {equals: 1}}
    - {command: [HSET, "c:3", tags, "RED,Blue"], expect: {equals: 1}}
    - {command: [FT.SEARCH, idx2, "@tags:{red}", LIMIT, "0", "0"], wait_s: 30, expect: {
        equals: [1]}}
    - {command: [FT.SEARCH, idx2, "@tags:{Red}", LIMIT, "0", "0"], wait_s: 30, expect: {
        equals: [1]}}
    - {command: [FT.SEARCH, idx2, "@tags:{RED}", LIMIT, "0", "0"], wait_s: 30, expect: {
        equals: [1]}}
    - {command: [FT.SEARCH, idx2, "@tags:{Re*}", LIMIT, "0", "0"], expect: {equals: [
          1]}}
    - {command: [FT.SEARCH, idx2, "@tags:{RE*}", LIMIT, "0", "0"], expect: {equals: [
          1]}}
    - {command: [FT.SEARCH, idx2, "@tags:{Bl*}", LIMIT, "0", "0"], expect: {equals: [
          1]}}
    - {command: [FT.SEARCH, idx2, "@tags:{bl*}", LIMIT, "0", "0"], expect: {equals: [
          0]}}
    - {command: [FT.SEARCH, idx2, "-@tags:{red}", LIMIT, "0", "0"], expect: {equals: [
          2]}}
    - {command: [FT.DROPINDEX, idx1], expect: {equals: OK}}
    - {command: [FT.DROPINDEX, idx2], expect: {equals: OK}}
    - {command: [FT.SEARCH, idx1, "@tags:{red}", LIMIT, "0", "0"], expect: {error: true}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [tag.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: tag}
