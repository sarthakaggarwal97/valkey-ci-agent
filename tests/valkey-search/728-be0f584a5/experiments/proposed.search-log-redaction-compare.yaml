extends: [valkey.liveness]
id: proposed.search-log-redaction-compare
deployment:
  modes: [standalone]
metadata:
  description: >-
    The change adds search.hide-user-data-from-log (default yes) and routes index
    names, keys and neighbor IDs through RedactIfNeeded on logging paths. Compare
    the new config's visibility against the parent, then drive every runtime redaction
    call site (backfill, FLAT index resize, search content-limit drops, drop, FLUSHALL,
    missing-index lookups) and check client replies and errors keep the raw names
    on both builds.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    hide: {type: string, enum: ["yes", "no"], default: "yes"}
components:
- use: valkey.action.commands
  id: redact
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - command: [CONFIG, SET, search.hide-user-data-from-log, {$ref: inputs.hide}]
      expect_difference: true
      expect: {equals: OK}
    - command: [FT._DEBUG, LIST_CONFIGS]
      expect_difference: true
      expect: {contains: hide-user-data-from-log}
    - command: [FT.CREATE, idx, ON, HASH, PREFIX, "1", "doc:", SCHEMA, vec, VECTOR,
        FLAT, "10", TYPE, FLOAT32, DIM, "2", DISTANCE_METRIC, L2, INITIAL_CAP, "1",
        BLOCK_SIZE, "1024", tagf, TAG, numf, NUMERIC]
      expect: {equals: OK}
    - command: [HSET, "doc:1", vec, !!binary "AACAPwAAAAA=", tagf, hello, numf, "1"]
      expect: {equals: 3}
    - command: [HSET, "doc:2", vec, !!binary "AAAAAAAAgD8=", tagf, world, numf, "2"]
      expect: {equals: 3}
    - command: [HSET, "doc:3", vec, !!binary "AACAPwAAgD8=", tagf, there, numf, "3"]
      expect: {equals: 3}
    - command: [FT.SEARCH, idx, "@tagf:{hello}", NOCONTENT]
      wait_s: 30
      compare: unordered
      expect: {contains: "doc:1"}
    - command: [FT.SEARCH, idx, "@tagf:{there}", NOCONTENT]
      wait_s: 30
      compare: unordered
      expect: {contains: "doc:3"}
    - command: [CONFIG, SET, search.max-search-result-fields-count, "1"]
      expect: {equals: OK}
    - command: [FT.SEARCH, idx, "*=>[KNN 3 @vec $BLOB]", PARAMS, "2", BLOB, !!binary "AACAPwAAAAA=",
        DIALECT, "2"]
      compare: unordered
    - command: [FT.SEARCH, nosuchindex, "@tagf:{hello}"]
      expect: {error: "nosuchindex"}
    - command: [FT.DROPINDEX, nosuchindex]
      expect: {error: "nosuchindex"}
    - command: [FT.DROPINDEX, idx]
      expect: {equals: OK}
    - command: [FT.CREATE, idx2, ON, HASH, PREFIX, "1", "doc:", SCHEMA, tagf, TAG]
      expect: {equals: OK}
    - command: [FLUSHALL]
      expect: {equals: OK}
    - command: [FT._LIST]
      wait_s: 10
      compare: unordered
      expect: {equals: []}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [redact.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: redact}
