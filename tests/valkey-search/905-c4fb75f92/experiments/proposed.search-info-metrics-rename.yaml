extends: [valkey.liveness]
id: proposed.search-info-metrics-rename
deployment:
  modes: [standalone]
metadata:
  description: INFO SEARCH renames query_prefiltering_requests_cnt to prefiltering_requests_count
    and drops the number_of_active_indexes* metrics; the renamed counter still counts
    pre-filtered hybrid searches
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: metrics
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
    - {command: [FT.CREATE, idx, ON, HASH, PREFIX, 1, 'doc:', SCHEMA, tag, TAG, v,
        VECTOR, FLAT, 6, TYPE, FLOAT32, DIM, 2, DISTANCE_METRIC, L2], expect: {equals: OK}}
    - {command: [HSET, 'doc:1', tag, a, v, !!binary 'AAIAPwAAAAA='], expect: {equals: 2}}
    - {command: [HSET, 'doc:2', tag, b, v, !!binary 'AAAAAAAAgD8='], expect: {equals: 2}}
    - {command: [INFO, search], wait_s: 30, compare: skip, expect: {contains: 'search_total_indexed_documents:2'}}
    - {command: [FT.SEARCH, idx, '(@tag:{a})=>[KNN 1 @v $BLOB]', NOCONTENT, PARAMS,
        2, BLOB, !!binary 'AAIAPwAAAAA=', DIALECT, 2], compare: unordered}
    - command:
      - EVAL
      - "local i = redis.call('INFO','search') local v = string.match(i, 'search_prefiltering_requests_count:(%d+)')\
        \ if v then return tonumber(v) else return -1 end"
      - '0'
      expect_difference: true
      expect: {equals: 1}
    - command:
      - EVAL
      - "local i = redis.call('INFO','search') if string.find(i, 'query_prefiltering_requests_cnt',\
        \ 1, true) then return 1 else return 0 end"
      - '0'
      expect_difference: true
      expect: {equals: 0}
    - command:
      - EVAL
      - "local i = redis.call('INFO','search') if string.find(i, 'number_of_active_indexes',\
        \ 1, true) then return 1 else return 0 end"
      - '0'
      expect_difference: true
      expect: {equals: 0}
    - command:
      - EVAL
      - "local i = redis.call('INFO','search') local n = 0 for _, f in ipairs({'search_number_of_indexes:1',\
        \ 'search_number_of_attributes:2', 'search_total_indexed_documents:2'}) do\
        \ if string.find(i, f, 1, true) then n = n + 1 end end return n"
      - '0'
      expect: {equals: 3}
    - {command: [FT.SEARCH, idx, '(@tag:{b})=>[KNN 1 @v $BLOB]', NOCONTENT, PARAMS,
        2, BLOB, !!binary 'AAAAAAAAgD8=', DIALECT, 2], compare: unordered}
    - command:
      - EVAL
      - "local i = redis.call('INFO','search') local v = string.match(i, 'search_prefiltering_requests_count:(%d+)')\
        \ if v then return tonumber(v) else return -1 end"
      - '0'
      expect_difference: true
      expect: {equals: 2}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [metrics.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: metrics}
