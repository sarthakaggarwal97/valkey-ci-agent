extends: [valkey.liveness]
id: proposed.ft-internal-update-replica
deployment:
  modes: [standalone]
metadata:
  description: A valid FT.INTERNAL_UPDATE on a primary replicates to its replica,
    which dereferences the uninitialized MetadataManager (coordinator off) and crashes
components:
- use: valkey.action.commands
  id: repl
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    nodes: 2
    timeout_s: 40
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 20, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [FT.INTERNAL_UPDATE, idx, "", ""], node: 0, expect_difference: true,
      expect: {equals: OK}}
    - {command: [PING], node: 1, wait_s: 20, expect_difference: true, expect: {exists: false}}
    checks:
      acl: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
