extends: [valkey.liveness]
id: proposed.ft-aggregate-sortby-limit-window
deployment:
  modes: [standalone]
metadata:
  description: FT.AGGREGATE SORTBY retention bound follows an adjacent LIMIT (paging
    past the first page), MAX 0 means unset, and a LIMIT across another stage does
    not raise the bound
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: agg
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 120
    commands:
    - {command: [FT.CREATE, idx1, ON, HASH, PREFIX, 1, "doc:", SCHEMA, n1, NUMERIC],
      expect: {equals: OK}}
    - {command: [HSET, "doc:01", n1, 1], expect: {equals: 1}}
    - {command: [HSET, "doc:02", n1, 2], expect: {equals: 1}}
    - {command: [HSET, "doc:03", n1, 3], expect: {equals: 1}}
    - {command: [HSET, "doc:04", n1, 4], expect: {equals: 1}}
    - {command: [HSET, "doc:05", n1, 5], expect: {equals: 1}}
    - {command: [HSET, "doc:06", n1, 6], expect: {equals: 1}}
    - {command: [HSET, "doc:07", n1, 7], expect: {equals: 1}}
    - {command: [HSET, "doc:08", n1, 8], expect: {equals: 1}}
    - {command: [HSET, "doc:09", n1, 9], expect: {equals: 1}}
    - {command: [HSET, "doc:10", n1, 10], expect: {equals: 1}}
    - {command: [HSET, "doc:11", n1, 11], expect: {equals: 1}}
    - {command: [HSET, "doc:12", n1, 12], expect: {equals: 1}}
    - {command: [HSET, "doc:13", n1, 13], expect: {equals: 1}}
    - {command: [HSET, "doc:14", n1, 14], expect: {equals: 1}}
    - {command: [HSET, "doc:15", n1, 15], expect: {equals: 1}}
    - {command: [FT.SEARCH, idx1, "*", LIMIT, 0, 0], wait_s: 30, expect: {equals: [
          15]}}
    - {command: [FT.AGGREGATE, idx1, "*", LOAD, 1, "@n1", SORTBY, 2, "@n1", ASC, LIMIT,
        0, 15], expect: {equals: [10, [n1, "1"], [n1, "2"], [n1, "3"], [n1, "4"],
          [n1, "5"], [n1, "6"], [n1, "7"], [n1, "8"], [n1, "9"], [n1, "10"]]}}
    - {command: [CONFIG, SET, search.emulate-release, "1.3.0"], expect: {equals: OK}}
    - {command: [FT.AGGREGATE, idx1, "*", LOAD, 1, "@n1", SORTBY, 2, "@n1", ASC, LIMIT,
        0, 15], expect_difference: true, expect: {equals: [15, [n1, "1"], [n1, "2"],
          [n1, "3"], [n1, "4"], [n1, "5"], [n1, "6"], [n1, "7"], [n1, "8"], [n1, "9"],
          [n1, "10"], [n1, "11"], [n1, "12"], [n1, "13"], [n1, "14"], [n1, "15"]]}}
    - {command: [FT.AGGREGATE, idx1, "*", LOAD, 1, "@n1", SORTBY, 2, "@n1", ASC, LIMIT,
        12, 5], expect_difference: true, expect: {equals: [3, [n1, "13"], [n1, "14"],
          [n1, "15"]]}}
    - {command: [FT.AGGREGATE, idx1, "*", LOAD, 1, "@n1", SORTBY, 2, "@n1", ASC, LIMIT,
        20, 5], expect: {equals: [0]}}
    - {command: [FT.AGGREGATE, idx1, "*", LOAD, 1, "@n1", SORTBY, 2, "@n1", DESC,
        LIMIT, 12, 5, DIALECT, 4], expect_difference: true, expect: {equals: [3, [
            n1, "3"], [n1, "2"], [n1, "1"]]}}
    - {command: [FT.AGGREGATE, idx1, "*", LOAD, 1, "@n1", SORTBY, 2, "@n1", ASC, MAX,
        3, LIMIT, 0, 15], expect_difference: true, expect: {equals: [15, [n1, "1"],
          [n1, "2"], [n1, "3"], [n1, "4"], [n1, "5"], [n1, "6"], [n1, "7"], [n1, "8"],
          [n1, "9"], [n1, "10"], [n1, "11"], [n1, "12"], [n1, "13"], [n1, "14"], [
            n1, "15"]]}}
    - {command: [FT.AGGREGATE, idx1, "*", LOAD, 1, "@n1", SORTBY, 2, "@n1", ASC, MAX,
        0], expect_difference: true, expect: {equals: [10, [n1, "1"], [n1, "2"], [
            n1, "3"], [n1, "4"], [n1, "5"], [n1, "6"], [n1, "7"], [n1, "8"], [n1,
            "9"], [n1, "10"]]}}
    - {command: [FT.AGGREGATE, idx1, "*", LOAD, 1, "@n1", SORTBY, 2, "@n1", ASC, MAX,
        0, LIMIT, 0, 15], expect_difference: true, expect: {equals: [15, [n1, "1"],
          [n1, "2"], [n1, "3"], [n1, "4"], [n1, "5"], [n1, "6"], [n1, "7"], [n1, "8"],
          [n1, "9"], [n1, "10"], [n1, "11"], [n1, "12"], [n1, "13"], [n1, "14"], [
            n1, "15"]]}}
    - {command: [FT.AGGREGATE, idx1, "*", LOAD, 1, "@n1", SORTBY, 2, "@n1", ASC, MAX,
        12], expect: {equals: [12, [n1, "1"], [n1, "2"], [n1, "3"], [n1, "4"], [n1,
            "5"], [n1, "6"], [n1, "7"], [n1, "8"], [n1, "9"], [n1, "10"], [n1, "11"],
          [n1, "12"]]}}
    - {command: [FT.AGGREGATE, idx1, "*", LOAD, 1, "@n1", LIMIT, 0, 15, SORTBY, 2,
        "@n1", ASC], expect_difference: true, expect: {equals: [15, [n1, "1"], [n1,
            "2"], [n1, "3"], [n1, "4"], [n1, "5"], [n1, "6"], [n1, "7"], [n1, "8"],
          [n1, "9"], [n1, "10"], [n1, "11"], [n1, "12"], [n1, "13"], [n1, "14"], [
            n1, "15"]]}}
    - {command: [FT.AGGREGATE, idx1, "*", LOAD, 1, "@n1", SORTBY, 2, "@n1", ASC, APPLY,
        "@n1", AS, m, LIMIT, 0, 15], expect: {equals: [10, [n1, "1", m, "1"], [n1,
            "2", m, "2"], [n1, "3", m, "3"], [n1, "4", m, "4"], [n1, "5", m, "5"],
          [n1, "6", m, "6"], [n1, "7", m, "7"], [n1, "8", m, "8"], [n1, "9", m, "9"],
          [n1, "10", m, "10"]]}}
    - {command: [FT.AGGREGATE, idx1, "*", LOAD, 1, "@n1", SORTBY, 2, "@n1", ASC, LIMIT,
        0, 4294967296], expect_difference: true, expect: {equals: [15, [n1, "1"],
          [n1, "2"], [n1, "3"], [n1, "4"], [n1, "5"], [n1, "6"], [n1, "7"], [n1, "8"],
          [n1, "9"], [n1, "10"], [n1, "11"], [n1, "12"], [n1, "13"], [n1, "14"], [
            n1, "15"]]}}
    - {command: [FT.AGGREGATE, idx1, "*", LOAD, 1, "@n1", SORTBY, 2, "@n1", ASC, LIMIT,
        9223372036854775807, 5], expect: {equals: [0]}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [agg.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: agg}
