extends: [valkey.liveness]
id: proposed.search-blocking-replication
deployment:
  modes: [standalone]
metadata:
  description: Replicated keyspace notifications on a replica must not block the apply
    path; replication and both indexes stay live under indexed writes, deletes and
    expiry
inputs:
  required: [module, module_parent]
  properties:
    module:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "The module build under test, {$ref: artifacts.module.path}"
    module_parent:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "The parent commit's build of the module, {$ref: artifacts.module_parent.path}"
components:
- use: valkey.action.commands
  id: repl
  config:
    modules: [{$ref: inputs.module}]
    modules_parent: [{$ref: inputs.module_parent}]
    nodes: 2
    timeout_s: 30
    commands:
    - {command: [FT.CREATE, idx, ON, HASH, PREFIX, 1, "doc:", SCHEMA, vec, VECTOR,
        HNSW, 6, TYPE, FLOAT32, DIM, 2, DISTANCE_METRIC, L2], node: 0, expect: {equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [HSET, "doc:1", vec, !!binary 'AACAPwAAAAA='], node: 0, expect: {
        equals: 1}}
    - {command: [HSET, "doc:2", vec, !!binary 'AAAAAAAAgD8='], node: 0, expect: {
        equals: 1}}
    - {command: [HSET, "doc:1", vec, !!binary 'AACAPwAAgD8='], node: 0, expect: {
        equals: 0}}
    - {command: [DEL, "doc:2"], node: 0, expect: {equals: 1}}
    - {command: [WAIT, 1, 1000], node: 0, wait_s: 30, expect: {equals: 1}}
    - {command: [FT.SEARCH, idx, "*=>[KNN 10 @vec $q]", PARAMS, 2, q, !!binary 'AACAPwAAAAA=',
        DIALECT, 2, LIMIT, 0, 0], node: 0, wait_s: 30, expect: {equals: [1]}}
    - {command: [FT.SEARCH, idx, "*=>[KNN 10 @vec $q]", PARAMS, 2, q, !!binary 'AACAPwAAAAA=',
        DIALECT, 2, LIMIT, 0, 0], node: 1, wait_s: 30, expect: {equals: [1]}}
    - {command: [HSET, "doc:3", vec, !!binary 'AACAPwAAAAA='], node: 1, expect: {
        error: true}}
    - {command: [PEXPIRE, "doc:1", 50], node: 0, expect: {equals: 1}}
    - {command: [FT.SEARCH, idx, "*=>[KNN 10 @vec $q]", PARAMS, 2, q, !!binary 'AACAPwAAAAA=',
        DIALECT, 2, LIMIT, 0, 0], node: 1, wait_s: 30, expect: {equals: [0]}}
    - {command: [PING], node: 1, expect: {equals: PONG}}
    checks:
      acl: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
