extends: [valkey.liveness]
id: proposed.search-partial-ingestion
deployment:
  modes: [standalone]
metadata:
  description: >-
    Hash documents missing some schema attributes must still be indexed on the attributes
    they do have, both on keyspace-notification ingestion and on backfill (ProcessKeyspaceNotification
    continue-vs-return fix, #489)
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: ingest
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 240
    commands:
    - {command: [FT.CREATE, idx1, ON, HASH, PREFIX, 1, "doc:", SCHEMA, price, NUMERIC,
        rating, NUMERIC, ghost1, NUMERIC, category, TAG, ghost2, TAG], expect: {equals: OK}}
    - {command: [HSET, "doc:1", price, "999.99", rating, "4.5", category, electronics],
      expect: {equals: 3}}
    - {command: [HSET, "doc:2", price, "19.99", rating, "4.8", category, books], expect: {
        equals: 3}}
    - {command: [HSET, "doc:4", category, electronics], expect: {equals: 1}}
    - {command: [HSET, "doc:3", price, "500", rating, "4.0", category, electronics,
        ghost1, "7", ghost2, full], expect: {equals: 5}}
    - {command: [FT.INFO, idx1], wait_s: 20, expect_difference: true, expect: {contains: 4}}
    - {command: [FT.SEARCH, idx1, "@price:[300 1000] @rating:[4.4 +inf]"], expect_difference: true,
      expect: {contains: "doc:1"}}
    - {command: [FT.SEARCH, idx1, "@category:{books} @price:[10 30] @rating:[4.7 +inf]"],
      expect_difference: true, expect: {contains: "doc:2"}}
    - {command: [FT.SEARCH, idx1, "@category:{electronics}"], wait_s: 10, expect_difference: true,
      expect: {contains: "doc:4"}}
    - {command: [FT.SEARCH, idx1, "@ghost1:[6 8]", RETURN, 1, ghost1], wait_s: 10,
      expect: {contains: "doc:3"}}
    - {command: [HSET, "item:1", price, "100", rating, "4.9", category, books], expect: {
        equals: 3}}
    - {command: [FT.CREATE, idx2, ON, HASH, PREFIX, 1, "item:", SCHEMA, price, NUMERIC,
        rating, NUMERIC, ghost1, NUMERIC, category, TAG, ghost2, TAG], expect: {equals: OK}}
    - {command: [FT.INFO, idx2], wait_s: 20, expect_difference: true, expect: {contains: 1}}
    - {command: [FT.SEARCH, idx2, "@category:{books} @rating:[4.5 +inf]"], wait_s: 20,
      expect_difference: true, expect: {contains: "item:1"}}
    checks:
      acl: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [ingest.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: ingest}
