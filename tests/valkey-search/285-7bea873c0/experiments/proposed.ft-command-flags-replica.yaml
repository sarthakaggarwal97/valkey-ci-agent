extends: [valkey.liveness]
id: proposed.ft-command-flags-replica
deployment:
  modes: [standalone]
metadata:
  description: FT.CREATE/FT.DROPINDEX now carry the write flag, so a read-only replica,
    min-replicas-to-write and EVAL_RO reject them; on the parent module they run anywhere
    and leave the replica with indexes the primary never had
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: flags
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    nodes: 2
    timeout_s: 60
    commands:
    - {command: [COMMAND, INFO, FT.CREATE, FT.DROPINDEX, FT.SEARCH, FT.INFO, FT._LIST,
        FT._DEBUG], expect_difference: true, expect: {exists: true}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [FT.CREATE, idx_replica, ON, HASH, SCHEMA, embedding, VECTOR, HNSW,
        12, m, 10, TYPE, FLOAT32, DIM, 100, DISTANCE_METRIC, COSINE, EF_CONSTRUCTION,
        5, EF_RUNTIME, 10], node: 1, expect_difference: true, expect: {error: "read\
          \ only replica"}}
    - {command: [FT._LIST], node: 1, expect_difference: true, expect: {equals: []}}
    - {command: [FT.CREATE, idx_primary, ON, HASH, SCHEMA, embedding, VECTOR, HNSW,
        12, m, 10, TYPE, FLOAT32, DIM, 100, DISTANCE_METRIC, COSINE, EF_CONSTRUCTION,
        5, EF_RUNTIME, 10], node: 0, expect: {equals: OK}}
    - {command: [FT.INFO, idx_primary], node: 1, wait_s: 30, compare: skip, expect: {
        error: false}}
    - {command: [FT.DROPINDEX, idx_primary], node: 1, expect_difference: true, expect: {
        error: "read only replica"}}
    - {command: [FT._LIST], node: 1, compare: unordered, expect_difference: true,
      expect: {equals: [idx_primary]}}
    - {command: [CONFIG, SET, min-replicas-to-write, 5], node: 0, expect: {equals: OK}}
    - {command: [FT.CREATE, idx_mrw, ON, HASH, SCHEMA, embedding, VECTOR, HNSW, 12,
        m, 10, TYPE, FLOAT32, DIM, 100, DISTANCE_METRIC, COSINE, EF_CONSTRUCTION,
        5, EF_RUNTIME, 10], node: 0, expect_difference: true, expect: {error: "NOREPLICAS"}}
    - {command: [FT.DROPINDEX, idx_mrw], node: 0, expect_difference: true, expect: {
        error: "NOREPLICAS"}}
    - {command: [CONFIG, SET, min-replicas-to-write, 0], node: 0, expect: {equals: OK}}
    - {command: [EVAL_RO, "return redis.call('FT.CREATE','idx_ro','ON','HASH','SCHEMA','embedding','VECTOR','HNSW','12','m','10','TYPE','FLOAT32','DIM','100','DISTANCE_METRIC','COSINE','EF_CONSTRUCTION','5','EF_RUNTIME','10')",
        0], node: 0, expect_difference: true, expect: {error: true}}
    - {command: [FT._LIST], node: 0, compare: unordered, expect_difference: true,
      expect: {equals: [idx_primary]}}
    checks:
      acl: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [flags.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: flags}
