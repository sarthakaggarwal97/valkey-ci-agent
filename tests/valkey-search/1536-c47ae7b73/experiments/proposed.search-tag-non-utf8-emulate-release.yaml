extends: [valkey.liveness]
id: proposed.search-tag-non-utf8-emulate-release
deployment:
  modes: [standalone]
metadata:
  description: Non-UTF-8 TAG values are indexed again at the default search.emulate-release
    (legacy behavior, counted in a compat counter) and rejected only at 1.3.0; compared
    across the module change and its parent, covering AddRecord, ModifyRecord, and
    backfill
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: tag-utf8
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
    - {command: [FT.CREATE, idxa, ON, HASH, PREFIX, 1, 'a:', SCHEMA, category, TAG,
        price, NUMERIC], expect: {equals: OK}}
    - {command: [HSET, 'a:1', category, !!binary 'aW52YWxpZMM=', price, 5], expect: {
        equals: 2}}
    - {command: [FT.SEARCH, idxa, !!binary 'QGNhdGVnb3J5OntpbnZhbGlkw30=', NOCONTENT],
      wait_s: 15, expect_difference: true, expect: {equals: [1, 'a:1']}}
    - {command: ['FT.SEARCH', idxa, '@price:[5 5]', NOCONTENT], wait_s: 15, expect: {
        equals: [1, 'a:1']}}
    - {command: [HSET, 'a:2', category, !!binary 'Z29vZCxiYWTD', price, 7], expect: {
        equals: 2}}
    - {command: [FT.SEARCH, idxa, '@category:{good}', NOCONTENT], wait_s: 15, expect_difference: true,
      expect: {equals: [1, 'a:2']}}
    - {command: [HSET, 'a:1', category, !!binary 'b3RoZXLD'], expect: {equals: 0}}
    - {command: [FT.SEARCH, idxa, !!binary 'QGNhdGVnb3J5OntvdGhlcsN9', NOCONTENT],
      wait_s: 15, expect_difference: true, expect: {equals: [1, 'a:1']}}
    - {command: [INFO, search], compare: skip, expect: {contains: 'search_compatibility-tag_rejects_non_utf8'}}
    - {command: [CONFIG, SET, search.emulate-release, '1.3.0'], expect: {equals: OK}}
    - {command: [FT.CREATE, idxb, ON, HASH, PREFIX, 1, 'b:', SCHEMA, category, TAG,
        price, NUMERIC], expect: {equals: OK}}
    - {command: [HSET, 'b:1', category, !!binary 'Z29vZCxiYWTD', price, 9], expect: {
        equals: 2}}
    - {command: [HSET, 'b:2', category, marker], expect: {equals: 1}}
    - {command: [FT.SEARCH, idxb, '@category:{marker}', NOCONTENT], wait_s: 15, expect: {
        equals: [1, 'b:2']}}
    - {command: [FT.SEARCH, idxb, '@category:{good}', NOCONTENT], expect: {equals: [
          0]}}
    - {command: ['FT.SEARCH', idxb, '@price:[9 9]', NOCONTENT], expect: {equals: [
          0]}}
    - {command: [CONFIG, SET, search.emulate-release, '1.2.0'], expect: {equals: OK}}
    - {command: [HSET, 'c:1', category, !!binary 'aW52YWxpZMM='], expect: {equals: 1}}
    - {command: [HSET, 'c:2', category, marker2], expect: {equals: 1}}
    - {command: [FT.CREATE, idxc, ON, HASH, PREFIX, 1, 'c:', SCHEMA, category, TAG],
      expect: {equals: OK}}
    - {command: [FT.SEARCH, idxc, '@category:{marker2}', NOCONTENT], wait_s: 15, expect: {
        equals: [1, 'c:2']}}
    - {command: [FT.SEARCH, idxc, !!binary 'QGNhdGVnb3J5OntpbnZhbGlkw30=', NOCONTENT],
      wait_s: 15, expect_difference: true, expect: {equals: [1, 'c:1']}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_evidence:
- {evidence_id: valkey.command.sequence, source: tag-utf8}
