extends: [valkey.liveness]
id: proposed.search-restore-backpressure-replica-sync
deployment:
  modes: [standalone]
metadata:
  description: >-
    A second private node set to search.max-mutation-queue-size-on-restore 1 full-syncs
    from a node holding a 2000-key vector index while the primary keeps writing more
    indexed docs; the replica's module RDB load runs the new backpressure/Yield loop
    while it is a syncing replica. Compared against the parent module build; both
    sides must converge to the same index.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: sync
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    nodes: 2
    timeout_s: 300
    commands:
    - {command: [CONFIG, SET, search.info-developer-visible, "yes"], expect: {equals: OK}}
    - {command: [CONFIG, SET, search.info-developer-visible, "yes"], node: 1, expect: {
        equals: OK}}
    - {command: [CONFIG, SET, search.max-mutation-queue-size-on-restore, 1], node: 1,
      expect_difference: true, expect: {equals: OK}}
    - {command: [FT.CREATE, idx, "ON", HASH, PREFIX, 1, "doc:", SCHEMA, "t", TAG,
        "n", NUMERIC, "v", VECTOR, HNSW, 6, TYPE, FLOAT32, DIM, 8, DISTANCE_METRIC,
        L2], expect: {equals: OK}}
    - command:
      - EVAL
      - "for i=1,2000 do local v=struct.pack('<ffffffff',i,i,i,i,i,i,i,i) redis.call('HSET','doc:'..i,'t','tag'..(i%10),'n',tostring(i),'v',v)\
        \ end return 'OK'"
      - 0
      expect: {equals: OK}
    - command:
      - EVAL
      - "local r=redis.call('FT.SEARCH','idx','@n:[0 +inf]','NOCONTENT','LIMIT','0','0')\
        \ return r[1]"
      - 0
      wait_s: 90
      expect: {equals: 2000}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - command:
      - EVAL
      - "for i=2001,4000 do local v=struct.pack('<ffffffff',i,i,i,i,i,i,i,i) redis.call('HSET','doc:'..i,'t','tag'..(i%10),'n',tostring(i),'v',v)\
        \ end return 'OK'"
      - 0
      expect: {equals: OK}
    - {command: [INFO, replication], node: 1, wait_s: 120, expect: {contains: "master_link_status:up"},
      compare: skip}
    - command:
      - EVAL
      - "local r=redis.call('FT.SEARCH','idx','@n:[0 +inf]','NOCONTENT','LIMIT','0','0')\
        \ return r[1]"
      - 0
      node: 1
      wait_s: 180
      expect: {equals: 4000}
    - command:
      - EVAL
      - "local s=redis.call('INFO','search') local v=string.match(s,'rdb_restore_backpressure_wait_cycles:(%d+)')\
        \ if v==nil then return 'absent' elseif v=='0' then return 'zero' else return\
        \ 'positive' end"
      - 0
      node: 1
      expect_difference: true
      expect: {equals: positive}
    - command:
      - EVAL
      - "local s=redis.call('INFO','search') local v=string.match(s,'rdb_restore_in_progress:(%d+)')\
        \ if v==nil then return 'absent' end return v"
      - 0
      node: 1
      expect_difference: true
      expect: {equals: "0"}
    - command:
      - EVAL
      - "local r=redis.call('FT.SEARCH','idx','@t:{tag5}','NOCONTENT','LIMIT','0','500')\
        \ table.remove(r,1) table.sort(r) return r"
      - 0
      node: 1
      expect: {contains: "doc:5"}
    - command:
      - EVAL
      - "local r=redis.call('FT.SEARCH','idx','@n:[0 +inf]','NOCONTENT','LIMIT','0','0')\
        \ return r[1]"
      - 0
      expect: {equals: 4000}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [sync.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: sync}
