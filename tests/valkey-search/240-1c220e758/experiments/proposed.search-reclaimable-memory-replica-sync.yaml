extends: [valkey.liveness]
id: proposed.search-reclaimable-memory-replica-sync
deployment:
  modes: [standalone]
metadata:
  description: reclaimable_memory is rebuilt on a replica by HNSW LoadIndex during
    full sync, tracks replicated deletes, and returns to 0 on replicated FT.DROPINDEX
    without underflow
components:
- use: valkey.action.commands
  id: repl
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    nodes: 2
    timeout_s: 60
    commands:
    - {command: [FT.CREATE, idx, ON, HASH, PREFIX, 1, "vec:", SCHEMA, vec, VECTOR,
        HNSW, 6, TYPE, FLOAT32, DIM, 3, DISTANCE_METRIC, L2], expect: {equals: OK}}
    - {command: [HSET, "vec:1", vec, !!binary "AACAPwAAAEAAAEBA"], expect: {equals: 1}}
    - {command: [HSET, "vec:2", vec, !!binary "AACAPwAAAEAAAEBA"], expect: {equals: 1}}
    - {command: [HSET, "vec:3", vec, !!binary "AACAPwAAAEAAAEBA"], expect: {equals: 1}}
    - {command: [HSET, "vec:4", vec, !!binary "AACAQAAAAKBAAMBA"], expect: {equals: 1}}
    - {command: [HSET, "vec:5", vec, !!binary "AACAQAAAAKBAAMBA"], expect: {equals: 1}}
    - {command: [INFO, SEARCH], compare: skip, wait_s: 30, expect: {contains: "search_total_indexed_documents:5\r\
          \n"}}
    - {command: [DEL, "vec:1", "vec:2", "vec:3"], expect: {equals: 3}}
    - {command: [INFO, SEARCH], compare: skip, wait_s: 30, expect: {contains: "search_total_indexed_documents:2\r\
          \n"}}
    - {command: [INFO, SEARCH], expect_difference: true, expect: {contains: "search_index_reclaimable_memory:36\r\
          \n"}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, compare: skip, wait_s: 30, expect: {
        contains: "master_link_status:up\r\n"}}
    - {command: [INFO, SEARCH], node: 1, compare: skip, wait_s: 30, expect: {contains: "search_total_indexed_documents:2\r\
          \n"}}
    - {command: [INFO, SEARCH], node: 1, expect_difference: true, wait_s: 10, expect: {
        contains: "search_index_reclaimable_memory:36\r\n"}}
    - {command: [DEL, "vec:4"], expect: {equals: 1}}
    - {command: [INFO, SEARCH], compare: skip, wait_s: 30, expect: {contains: "search_total_indexed_documents:1\r\
          \n"}}
    - {command: [INFO, SEARCH], expect_difference: true, expect: {contains: "search_index_reclaimable_memory:48\r\
          \n"}}
    - {command: [INFO, SEARCH], node: 1, compare: skip, wait_s: 30, expect: {contains: "search_total_indexed_documents:1\r\
          \n"}}
    - {command: [INFO, SEARCH], node: 1, expect_difference: true, wait_s: 10, expect: {
        contains: "search_index_reclaimable_memory:48\r\n"}}
    - {command: [FT.DROPINDEX, idx], expect: {equals: OK}}
    - {command: [INFO, SEARCH], compare: skip, wait_s: 30, expect: {contains: "search_number_of_indexes:0\r\
          \n"}}
    - {command: [INFO, SEARCH], expect_difference: true, wait_s: 15, expect: {contains: "search_index_reclaimable_memory:0\r\
          \n"}}
    - {command: [INFO, SEARCH], node: 1, compare: skip, wait_s: 30, expect: {contains: "search_number_of_indexes:0\r\
          \n"}}
    - {command: [INFO, SEARCH], node: 1, expect_difference: true, wait_s: 15, expect: {
        contains: "search_index_reclaimable_memory:0\r\n"}}
    checks:
      acl: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
