extends: [valkey.liveness]
id: proposed.search-emulate-release-config
deployment:
  modes: [standalone]
metadata:
  description: search.emulate-release registration, parsing and range validation,
    and the String-to-Double conversion of search-result-buffer-multiplier, compared
    against the parent module build
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: compat
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - {command: [CONFIG, GET, search.emulate-release], expect_difference: true, expect: {
        contains: "1.0.0"}}
    - {command: [CONFIG, SET, search.emulate-release, "1.1.0"], expect_difference: true,
      expect: {equals: OK}}
    - {command: [CONFIG, GET, search.emulate-release], expect_difference: true, expect: {
        contains: "1.1.0"}}
    - {command: [CONFIG, SET, search.emulate-release, "1.2.0"], expect_difference: true,
      expect: {equals: OK}}
    - {command: [CONFIG, SET, search.emulate-release, "01.002.000"], expect_difference: true,
      expect: {equals: OK}}
    - {command: [CONFIG, GET, search.emulate-release], expect_difference: true, expect: {
        contains: "1.2.0"}}
    - {command: [CONFIG, SET, search.emulate-release, "1.3.0"], expect_difference: true,
      expect: {error: "must be <="}}
    - {command: [CONFIG, SET, search.emulate-release, "0.9.0"], expect_difference: true,
      expect: {error: "must be"}}
    - {command: [CONFIG, SET, search.emulate-release, "1.2"], expect_difference: true,
      expect: {error: "Invalid version"}}
    - {command: [CONFIG, SET, search.emulate-release, "1.2.3.4"], expect_difference: true,
      expect: {error: "Invalid version"}}
    - {command: [CONFIG, SET, search.emulate-release, ""], expect_difference: true,
      expect: {error: "Invalid version"}}
    - {command: [CONFIG, SET, search.emulate-release, "-1.0.0"], expect_difference: true,
      expect: {error: "not a number"}}
    - {command: [CONFIG, SET, search.emulate-release, "100000.0.0"], expect_difference: true,
      expect: {error: "out of range"}}
    - {command: [CONFIG, SET, search.emulate-release, "1.500.0"], expect_difference: true,
      expect: {error: "out of range"}}
    - {command: [CONFIG, GET, search.emulate-release], expect_difference: true, expect: {
        contains: "1.2.0"}}
    - {command: [CONFIG, GET, search.search-result-buffer-multiplier], expect: {contains: "1.5"}}
    - {command: [CONFIG, SET, search.search-result-buffer-multiplier, "2.50"], expect: {
        equals: OK}}
    - {command: [CONFIG, GET, search.search-result-buffer-multiplier], expect_difference: true,
      expect: {contains: "2.5"}}
    - {command: [CONFIG, SET, search.search-result-buffer-multiplier, "1e2"], expect: {
        equals: OK}}
    - {command: [CONFIG, GET, search.search-result-buffer-multiplier], expect_difference: true,
      expect: {contains: "100"}}
    - {command: [CONFIG, SET, search.search-result-buffer-multiplier, invalid], expect_difference: true,
      expect: {error: "Invalid double value"}}
    - {command: [CONFIG, SET, search.search-result-buffer-multiplier, "1001.0"], expect_difference: true,
      expect: {error: "must be between 1 and 1000"}}
    - {command: [CONFIG, SET, search.search-result-buffer-multiplier, "-1.0"], expect_difference: true,
      expect: {error: "must be between 1 and 1000"}}
    - {command: [CONFIG, SET, search.search-result-buffer-multiplier, "0.5"], expect_difference: true,
      expect: {error: "must be between 1 and 1000"}}
    - {command: [CONFIG, SET, search.search-result-buffer-multiplier, "1.0"], expect: {
        equals: OK}}
    - {command: [CONFIG, SET, search.search-result-buffer-multiplier, "1000.0"], expect: {
        equals: OK}}
    - {command: [CONFIG, SET, search.prefiltering-threshold-ratio, "0.5"], expect: {
        error: "debug-mode"}}
    - {command: [CONFIG, GET, search.prefiltering-threshold-ratio], expect: {contains: "0.001"}}
    - {command: [FT.CREATE, idx, ON, HASH, PREFIX, 1, 'doc:', SCHEMA, tag_field, TAG,
        num, NUMERIC], expect: {equals: OK}}
    - {command: [HSET, 'doc:1', tag_field, red, num, 1], expect: {equals: 2}}
    - {command: [HSET, 'doc:2', tag_field, blue, num, 2], expect: {equals: 2}}
    - {command: [FT.SEARCH, idx, '@tag_field:{red}'], compare: unordered, wait_s: 30,
      expect: {contains: 'doc:1'}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [compat.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: compat}
