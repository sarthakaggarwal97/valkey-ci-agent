extends: [valkey.liveness]
id: proposed.vector-sharing-flat-wrongsize
deployment:
  modes: [standalone]
metadata:
  description: Overwriting a FLAT-indexed vector field with a wrong-size payload must
    not crash the server (untrack reached off the main thread)
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: wrongsize
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    server_config: {hash-max-listpack-entries: 0}
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - {command: [FT.CREATE, fidx, ON, HASH, PREFIX, 1, "fdoc:", SCHEMA, vec, VECTOR,
        FLAT, 6, TYPE, FLOAT32, DIM, 4, DISTANCE_METRIC, L2], expect: {equals: OK}}
    - {command: [HSET, "fdoc:1", vec, !!binary "AACAPwAAAEAAAEBAAACAQA=="], expect: {
        equals: 1}}
    - {command: [FT.SEARCH, fidx, "*"], wait_s: 30, expect: {contains: "fdoc:1"},
      compare: unordered}
    - {command: [FT._DEBUG, VECTOR_SHARING_STATS], expect_difference: true, expect: {
        error: false}}
    - {command: [HSET, "fdoc:1", vec, !!binary "AACAPwAAAEA="], expect: {equals: 0}}
    - {command: [HGET, "fdoc:1", vec], wait_s: 10, expect: {equals: !!binary "AACAPwAAAEA="}}
    - {command: [PING], expect: {equals: PONG}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_evidence:
- {evidence_id: valkey.command.sequence, source: wrongsize}
