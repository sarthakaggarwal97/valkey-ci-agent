extends: [valkey.liveness]
id: proposed.ft-search-nonvector-filter
deployment:
  modes: [standalone]
metadata:
  description: Non-vector FT.SEARCH re-evaluates every clause and deduplicates matches
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: ftsearch
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 20
    commands:
    - {command: [HSET, 'doc:1', n, '5', t, a], expect: {equals: 2}}
    - {command: [HSET, 'doc:2', n, '7', t, b], expect: {equals: 2}}
    - {command: [HSET, 'doc:3', n, '50', t, a], expect: {equals: 2}}
    - {command: [FT.CREATE, idx, ON, HASH, PREFIX, '1', 'doc:', SCHEMA, n, NUMERIC,
        t, TAG], expect: {equals: OK}}
    - {command: [FT.INFO, idx], wait_s: 15, compare: skip, expect: {contains: ready}}
    - {command: [FT.SEARCH, idx, '@n:[1 10] @t:{a}', DIALECT, '2'], compare: unordered,
      expect_difference: true, expect: {contains: 'doc:1'}}
    - {command: [FT.SEARCH, idx, '-@t:{b} @n:[1 10]', DIALECT, '2'], compare: unordered,
      expect_difference: true, expect: {contains: 'doc:1'}}
    - {command: [FT.SEARCH, idx, '@n:[1 10] | @n:[3 8]', DIALECT, '2'], compare: unordered,
      expect_difference: true, expect: {contains: 'doc:2'}}
    checks:
      acl: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [ftsearch.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: ftsearch}
