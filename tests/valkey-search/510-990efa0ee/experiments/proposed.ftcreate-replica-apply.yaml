extends: [valkey.liveness]
id: proposed.ftcreate-replica-apply
deployment:
  modes: [standalone]
metadata:
  description: A replicated FT.CREATE applied on a replica must not crash it
inputs:
  required: [module, module_parent]
  properties:
    module:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "The module build under test, {$ref: artifacts.module.path}"
    module_parent:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "The parent commit's build of the module, {$ref: artifacts.module_parent.path}"
components:
- use: valkey.action.commands
  id: repl
  config:
    modules: [{$ref: inputs.module}]
    modules_parent: [{$ref: inputs.module_parent}]
    nodes: 2
    timeout_s: 30
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [FT.CREATE, idx, ON, HASH, PREFIX, 1, "doc:", SCHEMA, price, NUMERIC,
        tags, TAG], node: 0, expect: {equals: OK}}
    - {command: [FT._LIST], node: 1, wait_s: 30, expect_difference: true, expect: {
        contains: idx}}
    - {command: [PING], node: 1, expect_difference: true, expect: {equals: PONG}}
    checks:
      acl: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
