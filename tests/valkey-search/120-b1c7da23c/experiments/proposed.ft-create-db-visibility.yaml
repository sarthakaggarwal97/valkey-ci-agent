extends: [valkey.liveness]
id: proposed.ft-create-db-visibility
deployment:
  modes: [standalone]
metadata:
  description: FT.CREATE records the selected db; the index is visible, backfilled
    and mutated only in that db, and FT commands in other dbs do not see it
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: ftdb
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
    - {command: [SELECT, 1], expect: {equals: OK}}
    - {command: [HSET, "doc:1", v, !!binary "AACAPwAAAAA=", t, "red,blue", n, 5],
      expect: {equals: 3}}
    - {command: [HSET, "doc:2", v, !!binary "AAAAAAAAgD8=", t, red, n, 7], expect: {
        equals: 3}}
    - {command: [HSET, "doc:3", v, !!binary "AACAPwAAgD8="], expect: {equals: 1}}
    - {command: [FT.CREATE, idx, ON, HASH, PREFIX, 1, "doc:", SCHEMA, v, VECTOR, HNSW,
        6, TYPE, FLOAT32, DIM, 2, DISTANCE_METRIC, L2, t, TAG, n, NUMERIC], expect: {
        equals: OK}}
    - {command: [FT._LIST], expect_difference: true, expect: {equals: [idx]}}
    - {command: [SELECT, 0], expect: {equals: OK}}
    - {command: [FT._LIST], expect_difference: true, expect: {equals: []}}
    - {command: [FT.INFO, idx], expect_difference: true, expect: {error: "not found"}}
    - {command: [SELECT, 1], expect: {equals: OK}}
    - {command: [FT.SEARCH, idx, "*=>[KNN 3 @v $BLOB]", NOCONTENT, PARAMS, 2, BLOB,
        !!binary "AACAPwAAAAA=", DIALECT, 2], wait_s: 20, expect_difference: true,
      expect: {contains: "doc:3"}, compare: unordered}
    - {command: [HSET, "doc:4", v, !!binary "AACAPwAAAAA="], expect: {equals: 1}}
    - {command: [FT.SEARCH, idx, "*=>[KNN 4 @v $BLOB]", NOCONTENT, PARAMS, 2, BLOB,
        !!binary "AACAPwAAAAA=", DIALECT, 2], wait_s: 20, expect_difference: true,
      expect: {contains: "doc:4"}, compare: unordered}
    - {command: [SELECT, 0], expect: {equals: OK}}
    - {command: [HSET, "doc:5", v, !!binary "AAAAAAAAgD8="], expect: {equals: 1}}
    - {command: [FT.SEARCH, idx, "*=>[KNN 5 @v $BLOB]", NOCONTENT, PARAMS, 2, BLOB,
        !!binary "AACAPwAAAAA=", DIALECT, 2], expect_difference: true, expect: {error: "not\
          \ found"}}
    - {command: [SELECT, 1], expect: {equals: OK}}
    - {command: [FT.DROPINDEX, idx], expect_difference: true, expect: {equals: OK}}
    - {command: [FT._LIST], expect: {equals: []}}
    - {command: [SELECT, 0], expect: {equals: OK}}
    - {command: [FT._LIST], expect_difference: true, expect: {equals: []}}
    checks:
      acl: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [ftdb.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: ftdb}
