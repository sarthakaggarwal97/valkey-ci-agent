extends: [valkey.liveness]
id: proposed.ft-tag-separator-replica
deployment:
  modes: [standalone]
metadata:
  description: FT.CREATE with and without SEPARATOR replicated verbatim to a replica
    is re-parsed there; the replica's schema records explicit_separator on the change
    only and tag search on the replica is unchanged
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: repl
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 180
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 60, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [FT.CREATE, idxr, ON, HASH, PREFIX, "1", "r:", SCHEMA, tags, TAG,
        SEPARATOR, "|", CASESENSITIVE], expect: {equals: OK}}
    - {command: [FT.CREATE, idxd, ON, HASH, PREFIX, "1", "s:", SCHEMA, tags, TAG],
      expect: {equals: OK}}
    - {command: [HSET, "r:1", tags, "a|b"], expect: {equals: 1}}
    - {command: [FT.SEARCH, idxr, "@tags:{b}", RETURN, "0"], wait_s: 30, compare: unordered,
      expect: {contains: "r:1"}}
    - {command: [FT.SEARCH, idxr, "@tags:{b}", RETURN, "0"], node: 1, wait_s: 60,
      compare: unordered, expect: {contains: "r:1"}}
    - {command: [FT._DEBUG, SHOW_INDEXSCHEMAS], node: 1, expect_difference: true,
      expect: {contains: "explicit_separator: true"}}
    - {command: [FT._DEBUG, SHOW_INDEXSCHEMAS], node: 1, expect_difference: true,
      expect: {contains: "explicit_separator: false"}}
    - {command: [FT._DEBUG, SHOW_INDEXSCHEMAS], expect_difference: true, expect: {
        contains: "explicit_separator: true"}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
