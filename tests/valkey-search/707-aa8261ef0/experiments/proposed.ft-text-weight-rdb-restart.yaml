extends: [valkey.liveness]
id: proposed.ft-text-weight-rdb-restart
deployment:
  modes: [standalone]
metadata:
  description: Text index weight carried through Text::ToProto into the RDB aux section
    and back across a SAVE and restart, compared across the two module builds
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: reload
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - {command: [FT.CREATE, idx, ON, HASH, PREFIX, 1, "d:", SCHEMA, body, TEXT, NOSTEM],
      expect: {equals: OK}}
    - {command: [FT.CREATE, idxw, ON, HASH, PREFIX, 1, "w:", SCHEMA, body, TEXT, WEIGHT,
        "1.0"], expect_difference: true, expect: {equals: OK}}
    - {command: [HSET, "d:1", body, "alpha beta"], expect: {equals: 1}}
    - {command: [HSET, "d:2", body, "beta gamma"], expect: {equals: 1}}
    - {command: [HSET, "w:1", body, "delta epsilon"], expect: {equals: 1}}
    - {command: [FT.INFO, idx], wait_s: 30, expect_difference: true, expect: {contains: ready}}
    - {command: [SAVE], expect: {equals: OK}}
    - {restart: true, expect: {equals: OK}}
    - {command: [FT._LIST], expect_difference: true, expect: {contains: idx}}
    - {command: [FT.INFO, idx], wait_s: 30, expect_difference: true, expect: {contains: ready}}
    - {command: [FT.SEARCH, idx, beta, NOCONTENT], compare: unordered}
    - {command: [FT.SEARCH, idxw, delta, NOCONTENT], expect_difference: true, expect: {
        error: false}}
    checks:
      acl: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [reload.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: reload}
