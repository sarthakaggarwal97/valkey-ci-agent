extends: [valkey.liveness]
id: proposed.ft-search-sortkey-prefix
deployment:
  modes: [standalone]
metadata:
  description: WITHSORTKEYS sort-key prefix is '#' for NUMERIC SORTBY fields and '$'
    otherwise once search.emulate-release >= 1.3.0, on both the filter and KNN serialization
    paths; legacy '#' everywhere below the gate
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: sortkey
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - {command: [FT.CREATE, idx, ON, HASH, PREFIX, 1, 'd:', SCHEMA, m, TAG, z, TEXT,
        SORTABLE, t, TAG, n, NUMERIC, f, NUMERIC, vec, VECTOR, FLAT, 6, TYPE, FLOAT32,
        DIM, 2, DISTANCE_METRIC, L2], expect: {equals: OK}}
    - {command: [HSET, 'd:1', m, all, z, zebra, t, cat, n, '3', f, '3.5', vec, CCCCCCCC],
      expect: {equals: 6}}
    - {command: [HSET, 'd:2', m, all, z, apple, t, ant, n, '1', f, '1.5', vec, AAAAAAAA],
      expect: {equals: 6}}
    - {command: [HSET, 'd:3', m, all, z, mango, t, bee, n, '2', f, '2.5', vec, BBBBBBBB],
      expect: {equals: 6}}
    - {command: [HSET, 'd:4', m, extra], expect: {equals: 1}}
    - {command: [FT.INFO, idx], compare: skip}
    - {command: [FT.SEARCH, idx, '@m:{all}', LIMIT, 0, 0, DIALECT, 2], wait_s: 30,
      expect: {equals: [3]}}
    - {command: [FT.SEARCH, idx, '@m:{extra}', LIMIT, 0, 0, DIALECT, 2], wait_s: 30,
      expect: {equals: [1]}}
    - {command: [FT.SEARCH, idx, '@m:{all}', SORTBY, z, ASC, WITHSORTKEYS, RETURN,
        1, z, DIALECT, 2], expect: {contains: '#apple'}}
    - {command: [CONFIG, SET, search.emulate-release, 1.3.0], expect: {equals: OK}}
    - {command: [FT.SEARCH, idx, '@m:{all}', SORTBY, z, ASC, WITHSORTKEYS, RETURN,
        1, z, DIALECT, 2], expect_difference: true, expect: {equals: [3, 'd:2', '$apple',
          [z, apple], 'd:3', '$mango', [z, mango], 'd:1', '$zebra', [z, zebra]]}}
    - {command: [FT.SEARCH, idx, '@m:{all}', SORTBY, t, ASC, WITHSORTKEYS, RETURN,
        1, t, DIALECT, 2], expect_difference: true, expect: {equals: [3, 'd:2', '$ant',
          [t, ant], 'd:3', '$bee', [t, bee], 'd:1', '$cat', [t, cat]]}}
    - {command: [FT.SEARCH, idx, '@m:{all}', SORTBY, n, ASC, WITHSORTKEYS, RETURN,
        1, n, DIALECT, 2], expect: {equals: [3, 'd:2', '#1', [n, '1'], 'd:3', '#2',
          [n, '2'], 'd:1', '#3', [n, '3']]}}
    - {command: [FT.SEARCH, idx, '@m:{all}', SORTBY, f, ASC, WITHSORTKEYS, RETURN,
        1, f, DIALECT, 2], expect: {equals: [3, 'd:2', '#1.5', [f, '1.5'], 'd:3',
          '#2.5', [f, '2.5'], 'd:1', '#3.5', [f, '3.5']]}}
    - {command: [FT.SEARCH, idx, '@m:{all}', SORTBY, vec, ASC, WITHSORTKEYS, RETURN,
        1, vec, DIALECT, 2], expect_difference: true, expect: {contains: '$AAAAAAAA'}}
    - {command: [FT.SEARCH, idx, '@m:{extra}', SORTBY, z, ASC, WITHSORTKEYS, RETURN,
        1, z, DIALECT, 2], expect_difference: true, expect: {contains: '$'}}
    - {command: [FT.SEARCH, idx, '@m:{all}=>[KNN 3 @vec $B]', PARAMS, 2, B, AAAAAAAA,
        SORTBY, z, ASC, WITHSORTKEYS, RETURN, 1, z, DIALECT, 2], expect_difference: true,
      expect: {equals: [3, 'd:2', '$apple', [z, apple], 'd:3', '$mango', [z, mango],
          'd:1', '$zebra', [z, zebra]]}}
    - {command: [FT.SEARCH, idx, '@m:{all}=>[KNN 3 @vec $B]', PARAMS, 2, B, AAAAAAAA,
        SORTBY, n, ASC, WITHSORTKEYS, RETURN, 1, n, DIALECT, 2], expect: {equals: [
          3, 'd:2', '#1', [n, '1'], 'd:3', '#2', [n, '2'], 'd:1', '#3', [n, '3']]}}
    - {command: [FT.SEARCH, idx, '@m:{all}=>[KNN 1 @vec $B AS dist]', PARAMS, 2, B,
        AAAAAAAA, SORTBY, dist, ASC, WITHSORTKEYS, RETURN, 1, dist, DIALECT, 2], expect: {
        equals: [1, 'd:2', '#0', [dist, '0']]}}
    - {command: [CONFIG, SET, search.emulate-release, 1.2.1], expect: {equals: OK}}
    - {command: [FT.SEARCH, idx, '@m:{all}', SORTBY, z, ASC, WITHSORTKEYS, RETURN,
        1, z, DIALECT, 2], expect: {contains: '#apple'}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [sortkey.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: sortkey}
