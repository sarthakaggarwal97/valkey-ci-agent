extends: [valkey.liveness]
id: proposed.ft-info-score-field-compat
deployment:
  modes: [standalone]
metadata:
  description: >-
    FT.INFO's index_definition block is gated on search.emulate-release by this change:
    below 1.3.0 (including the 1.0.0 default) it is a 6-element array reporting default_score
    as the bulk string "1" with no score_field, while at 1.3.0+ it is the 8-element
    array with the configured SCORE as a double and the SCORE_FIELD. The parent build
    emits the 8-element block unconditionally (the #1008 breaking change), so FT.INFO
    at the default setting must differ, and after raising emulate-release to 1.3.0
    (which needs search.debug-mode) the two builds must agree again, then differ once
    more when emulate-release drops back to 1.2.1.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: ftinfo
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 120
    commands:
    - {command: [CONFIG, GET, search.emulate-release], expect: {contains: "1.0.0"}}
    - {command: [FT.CREATE, idx1, ON, HASH, PREFIX, 1, "doc:", SCORE, "0.5", SCORE_FIELD,
        myscore, SCHEMA, f1, TAG, n1, NUMERIC], expect: {equals: OK}}
    - {command: [FT.CREATE, idx2, ON, HASH, PREFIX, 1, "none:", SCHEMA, f2, TAG],
      expect: {equals: OK}}
    - {command: [FT.CREATE, idx3, ON, HASH, PREFIX, 1, "zero:", SCORE, "0", SCHEMA,
        f3, NUMERIC], expect: {equals: OK}}
    - {command: [HSET, "doc:1", f1, hello, n1, "42", myscore, "0.7"], expect: {equals: 3}}
    - {command: [FT.SEARCH, idx1, "@f1:{hello}"], wait_s: 30, compare: unordered,
      expect: {contains: "doc:1"}}
    - {command: [FT.INFO, idx1], wait_s: 30, expect: {contains: ready}, expect_difference: true}
    - {command: [FT.INFO, idx2], wait_s: 30, expect: {contains: ready}, expect_difference: true}
    - {command: [FT.INFO, idx3], wait_s: 30, expect: {contains: ready}, expect_difference: true}
    - {command: [CONFIG, SET, search.emulate-release, "1.3.0"], expect: {error: "must\
          \ be"}}
    - {command: [CONFIG, SET, search.debug-mode, "yes"], expect: {equals: OK}}
    - {command: [CONFIG, SET, search.emulate-release, "1.3.0"], expect: {equals: OK}}
    - {command: [FT.INFO, idx1], expect: {contains: myscore}}
    - {command: [FT.INFO, idx3], expect: {contains: ready}}
    - {command: [CONFIG, SET, search.emulate-release, "1.2.1"], expect: {equals: OK}}
    - {command: [FT.INFO, idx1], expect: {contains: ready}, expect_difference: true}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [ftinfo.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: ftinfo}
