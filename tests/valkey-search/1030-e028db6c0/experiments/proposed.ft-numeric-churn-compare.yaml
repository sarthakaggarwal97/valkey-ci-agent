extends: [valkey.liveness]
id: proposed.ft-numeric-churn-compare
deployment:
  modes: [standalone]
metadata:
  description: 72 distinct values inserted ascending then descending (both leaf-split
    branches of the new B+-tree), shared-value bags, then staged multi-key deletions
    that force leaf rotations, merges, and root collapse, range counts checked after
    every stage, compared against the parent build
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: churn
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
