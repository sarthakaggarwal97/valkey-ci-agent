extends: [valkey.liveness]
id: proposed.fulltext-inflight-blocking
deployment:
  modes: [standalone]
metadata:
  description: >-
    Fulltext FT.SEARCH must block on conflicting in-flight key mutations and re-verify
    its results before replying. A single writer thread plus a MULTI/EXEC batch of
    hash updates (MULTI mutations do not block the writing client) leaves a backlog
    of tracked in-flight keys when the next FT.SEARCH runs: the parent replies with
    stale fulltext matches whose fetched content no longer contains the term, the
    change blocks in InFlightRetryContext, retries as mutations drain, re-verifies
    and replies 0. Also covers the hybrid (vector+text) blocking path, prefix and
    fuzzy predicates and NOCONTENT/TAG bypasses under churn, query TIMEOUT cancellation
    while registered as a waiting query, FT.DROPINDEX with waiting queries still registered
    (use-after-free probe), and the new INFO metrics fields.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: ft
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
