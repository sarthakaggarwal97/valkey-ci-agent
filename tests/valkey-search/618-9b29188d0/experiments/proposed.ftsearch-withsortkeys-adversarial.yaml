extends: [valkey.liveness]
id: proposed.ftsearch-withsortkeys-adversarial
deployment:
  modes: [standalone]
metadata:
  description: FT.SEARCH WITHSORTKEYS reply shape, missing-value ordering, a field
    named like a keyword, and SORTBY on an undeclared field
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: wsk
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
    - {command: [FT.CREATE, idx, ON, HASH, PREFIX, 1, "doc:", SCHEMA, fields, NUMERIC,
        t, TAG], expect: {equals: OK}}
    - {command: [HSET, "doc:1", fields, "100", t, "x"], expect: {equals: 2}}
    - {command: [HSET, "doc:2", fields, "50", t, "y"], expect: {equals: 2}}
    - {command: [HSET, "doc:3", t, "z"], expect: {equals: 1}}
    - {command: [FT.INFO, idx], wait_s: 20, expect: {contains: "3"}}
    - {command: [FT.SEARCH, idx, "*", SORTBY, fields, ASC, WITHSORTKEYS, RETURN, 1,
        fields, DIALECT, 2], expect_difference: true, expect: {equals: [3, "doc:2",
          "#50", [fields, "50"], "doc:1", "#100", [fields, "100"], "doc:3", "#", []]}}
    - {command: [FT.SEARCH, idx, "*", SORTBY, fields, DESC, WITHSORTKEYS, NOCONTENT,
        DIALECT, 2], expect_difference: true, expect: {contains: "#100"}}
    - {command: [FT.SEARCH, idx, "*", SORTBY, nonexistent, ASC, DIALECT, 2], expect_difference: true,
      expect: {error: "does not exist"}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [wsk.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: wsk}
