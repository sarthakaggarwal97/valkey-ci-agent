extends: [valkey.liveness]
id: proposed.ft-search-withcursor-compare
deployment:
  modes: [standalone]
metadata:
  description: FT.SEARCH WITHCURSOR reply shapes and bounds, the new cursor configs,
    and the refactored non-cursor FT.SEARCH reply path, compared against the parent
    module build
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: search
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
    - {command: [FT.CREATE, idx, ON, HASH, PREFIX, 1, "h:", SCHEMA, name, TAG, price,
        NUMERIC, vec, VECTOR, FLAT, 6, TYPE, FLOAT32, DIM, 2, DISTANCE_METRIC, L2],
      expect: {equals: OK}}
    - {command: [HSET, "h:1", name, n1, price, "10", vec, !!binary "AACAPwAAAAA="],
      expect: {equals: 3}}
    - {command: [HSET, "h:2", name, n2, price, "20", vec, !!binary "AAAAQAAAAAA="],
      expect: {equals: 3}}
    - {command: [HSET, "h:3", name, n3, price, "30", vec, !!binary "AABAQAAAAAA="],
      expect: {equals: 3}}
    - {command: [HSET, "h:4", name, n4, price, "40", vec, !!binary "AACAQAAAAAA="],
      expect: {equals: 3}}
    - {command: [HSET, "h:5", name, n5, price, "50", vec, !!binary "AACgQAAAAAA="],
      expect: {equals: 3}}
    - {command: [FT.SEARCH, idx, "@price:[-inf inf]", LIMIT, 0, 0], wait_s: 30, expect: {
        equals: [5]}}
    - {command: [FT.SEARCH, idx, "@price:[-inf inf]", SORTBY, price, ASC, RETURN,
        2, price, name], expect: {equals: [5, "h:1", [price, "10", name, n1], "h:2",
          [price, "20", name, n2], "h:3", [price, "30", name, n3], "h:4", [price,
            "40", name, n4], "h:5", [price, "50", name, n5]]}}
    - {command: [FT.SEARCH, idx, "@price:[-inf inf]", NOCONTENT, SORTBY, price, ASC],
      expect: {equals: [5, "h:1", "h:2", "h:3", "h:4", "h:5"]}}
    - {command: [FT.SEARCH, idx, "@price:[-inf inf]", WITHSCORES, WITHSORTKEYS, SORTBY,
        price, ASC, RETURN, 1, price]}
    - {command: [FT.SEARCH, idx, "*=>[KNN 3 @vec $b]", PARAMS, 2, b, !!binary "AAAAAAAAAAA=",
        DIALECT, 2, RETURN, 1, price]}
    - {command: [FT.SEARCH, idx, "*=>[KNN 2 @vec $b]", PARAMS, 2, b, !!binary "AAAAAAAAAAA=",
        DIALECT, 2, NOCONTENT]}
    - {command: [FT.SEARCH, idx, "@price:[-inf inf]", SORTBY, price, ASC, RETURN,
        1, price, LIMIT, 0, 3, WITHCURSOR], expect_difference: true, expect: {equals: [
          5, [["h:1", [price, "10"]], ["h:2", [price, "20"]], ["h:3", [price, "30"]]],
          0]}}
    - {command: [FT.SEARCH, idx, "@price:[-inf inf]", WITHCURSOR, COUNT, 1000, SORTBY,
        price, ASC, RETURN, 1, price, LIMIT, 0, 2], expect_difference: true, expect: {
        equals: [5, [["h:1", [price, "10"]], ["h:2", [price, "20"]]], 0]}}
    - {command: [FT.SEARCH, idx, "@price:[-inf inf]", NOCONTENT, SORTBY, price, ASC,
        WITHCURSOR], expect_difference: true, expect: {equals: [5, [["h:1"], ["h:2"],
            ["h:3"], ["h:4"], ["h:5"]], 0]}}
    - {command: [FT.SEARCH, idx, "@price:[-inf inf]", LIMIT, 0, 0, WITHCURSOR], expect_difference: true,
      expect: {equals: [5, [], 0]}}
    - {command: [FT.SEARCH, idx, "@price:[-inf inf]", SORTBY, price, ASC, RETURN,
        1, price, LIMIT, 1, 3, WITHCURSOR], expect_difference: true, expect: {equals: [
          5, [["h:2", [price, "20"]], ["h:3", [price, "30"]], ["h:4", [price, "40"]]],
          0]}}
    - {command: [FT.SEARCH, idx, "*=>[KNN 3 @vec $b]", PARAMS, 2, b, !!binary "AAAAAAAAAAA=",
        DIALECT, 2, RETURN, 1, price, WITHCURSOR], expect_difference: true, expect: {
        exists: true}}
    - {command: [FT.SEARCH, idx, "@price:[-inf inf]", WITHSCORES, WITHSORTKEYS, SORTBY,
        price, ASC, RETURN, 1, price, WITHCURSOR, COUNT, 2], expect_difference: true,
      expect: {exists: true}}
    - {command: [FT.SEARCH, idx, "@price:[-inf inf]", SORTBY, price, ASC, RETURN,
        1, price, WITHCURSOR, COUNT, 1, MAXIDLE, 9223372036854775807], expect_difference: true,
      expect: {exists: true}}
    - {command: [INFO, SEARCH], compare: skip, expect: {contains: "search_num_cursors:2"}}
    - {command: [FT.SEARCH, idx, "@price:[-inf inf]", WITHCURSOR, COUNT, 0], expect_difference: true,
      expect: {error: "COUNT must be between 1 and"}}
    - {command: [FT.SEARCH, idx, "@price:[-inf inf]", WITHCURSOR, COUNT, 2147483648],
      expect_difference: true, expect: {error: "COUNT must be between 1 and 100000"}}
    - {command: [FT.SEARCH, idx, "@price:[-inf inf]", WITHCURSOR, COUNT, notanumber],
      expect_difference: true, expect: {error: "Bad COUNT value"}}
    - {command: [FT.SEARCH, idx, "@price:[-inf inf]", WITHCURSOR, MAXIDLE, 0], expect_difference: true,
      expect: {error: "MAXIDLE must be between 1 and"}}
    - {command: [FT.SEARCH, idx, "@price:[-inf inf]", WITHCURSOR, MAXIDLE, -1], expect_difference: true,
      expect: {error: "MAXIDLE must be between 1 and"}}
    - {command: [CONFIG, SET, search.cursor-max-count, 3], expect_difference: true,
      expect: {equals: OK}}
    - {command: [FT.SEARCH, idx, "@price:[-inf inf]", WITHCURSOR, COUNT, 4], expect_difference: true,
      expect: {error: "COUNT must be between 1 and 3"}}
    - {command: [FT.CURSOR, READ, idx, 7, COUNT, 4], expect_difference: true, expect: {
        error: "COUNT must be between 1 and 3"}}
    - {command: [CONFIG, SET, search.cursor-max-idle-ms, 1000], expect_difference: true,
      expect: {equals: OK}}
    - {command: [FT.SEARCH, idx, "@price:[-inf inf]", WITHCURSOR, MAXIDLE, 2000],
      expect_difference: true, expect: {error: "MAXIDLE must be between 1 and 1000"}}
    - {command: [FLUSHALL], expect: {equals: OK}}
    - {command: [INFO, SEARCH], compare: skip, expect: {contains: "search_num_cursors:0"}}
    - {command: [PING], expect: {equals: PONG}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [search.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: search}
