extends: [valkey.liveness]
id: proposed.ft-create-hnsw-m-min
deployment:
  modes: [standalone]
metadata:
  description: FT.CREATE HNSW M minimum raised from 1 to 2, and the search.max-vector-m
    config minimum raised to 2, compared across module builds
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: mmin
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - {command: [FT.CREATE, idx_m1, ON, HASH, PREFIX, 1, "m1:", SCHEMA, v, VECTOR,
        HNSW, 8, TYPE, FLOAT32, DIM, 2, DISTANCE_METRIC, L2, M, 1], expect_difference: true,
      expect: {error: "greater than 2"}}
    - {command: [FT.INFO, idx_m1], expect_difference: true, expect: {error: "not found"}}
    - {command: [FT._LIST], expect_difference: true, expect: {equals: []}}
    - {command: [FT.CREATE, idx_m0, ON, HASH, PREFIX, 1, "m0:", SCHEMA, v, VECTOR,
        HNSW, 8, TYPE, FLOAT32, DIM, 2, DISTANCE_METRIC, L2, M, 0], expect_difference: true,
      expect: {error: "greater than 2"}}
    - {command: [FT.CREATE, idx_mbig, ON, HASH, PREFIX, 1, "mb:", SCHEMA, v, VECTOR,
        HNSW, 8, TYPE, FLOAT32, DIM, 2, DISTANCE_METRIC, L2, M, 2000001], expect_difference: true,
      expect: {error: "greater than 2"}}
    - {command: [FT.CREATE, idx_m2, ON, HASH, PREFIX, 1, "doc:", SCHEMA, v, VECTOR,
        HNSW, 8, TYPE, FLOAT32, DIM, 2, DISTANCE_METRIC, L2, M, 2], expect: {equals: OK}}
    - {command: [HSET, "doc:1", v, !!binary "AAAAAAAAAAA="], expect: {equals: 1}}
    - {command: [HSET, "doc:2", v, !!binary "AABAQAAAgEA="], expect: {equals: 1}}
    - {command: [FT.INFO, idx_m2], wait_s: 30, expect: {contains: 2}, compare: skip}
    - {command: [FT.SEARCH, idx_m2, "*=>[KNN 2 @v $BLOB]", NOCONTENT, PARAMS, 2, BLOB,
        !!binary "AAAAAAAAAAA=", DIALECT, 2], compare: unordered, expect: {contains: "doc:1"}}
    - {command: [CONFIG, SET, search.max-vector-m, 1], expect_difference: true, expect: {
        error: true}}
    - {command: [FT.CREATE, idx_c2, ON, HASH, PREFIX, 1, "c2:", SCHEMA, v, VECTOR,
        HNSW, 8, TYPE, FLOAT32, DIM, 2, DISTANCE_METRIC, L2, M, 2], expect_difference: true,
      expect: {equals: OK}}
    - {command: [CONFIG, SET, search.max-vector-m, 2], expect: {equals: OK}}
    - {command: [FT.CREATE, idx_m3, ON, HASH, PREFIX, 1, "m3:", SCHEMA, v, VECTOR,
        HNSW, 8, TYPE, FLOAT32, DIM, 2, DISTANCE_METRIC, L2, M, 3], expect_difference: true,
      expect: {error: "cannot exceed 2"}}
    - {command: [FT.CREATE, idx_b2, ON, HASH, PREFIX, 1, "b2:", SCHEMA, v, VECTOR,
        HNSW, 8, TYPE, FLOAT32, DIM, 2, DISTANCE_METRIC, L2, M, 2], expect: {equals: OK}}
    - {command: [CONFIG, SET, search.max-vector-m, 2000000], expect: {equals: OK}}
    checks:
      acl: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [mmin.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: mmin}
