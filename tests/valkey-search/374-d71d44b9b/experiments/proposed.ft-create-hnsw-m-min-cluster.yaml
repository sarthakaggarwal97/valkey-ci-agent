extends: [valkey.liveness]
id: proposed.ft-create-hnsw-m-min-cluster
deployment:
  modes: [standalone]
metadata:
  description: FT.CREATE HNSW M minimum raised from 1 to 2, validated through the
    cluster-mode index creation path on one-node clusters
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: mminc
  config:
    cluster: true
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - {command: [FT.CREATE, idx_m1, ON, HASH, PREFIX, 1, "m1:", SCHEMA, v, VECTOR,
        HNSW, 8, TYPE, FLOAT32, DIM, 2, DISTANCE_METRIC, L2, M, 1], expect_difference: true,
      expect: {error: "greater than 2"}}
    - {command: [FT._LIST], expect_difference: true, expect: {equals: []}}
    - {command: [FT.CREATE, idx_m0, ON, HASH, PREFIX, 1, "m0:", SCHEMA, v, VECTOR,
        HNSW, 8, TYPE, FLOAT32, DIM, 2, DISTANCE_METRIC, L2, M, 0], expect_difference: true,
      expect: {error: "greater than 2"}}
    - {command: [FT.CREATE, idx_m2, ON, HASH, PREFIX, 1, "doc:", SCHEMA, v, VECTOR,
        HNSW, 8, TYPE, FLOAT32, DIM, 2, DISTANCE_METRIC, L2, M, 2], expect: {equals: OK}}
    - {command: [FT._LIST], compare: unordered}
    - {command: [CONFIG, SET, search.max-vector-m, 1], expect_difference: true, expect: {
        error: true}}
    - {command: [FT.CREATE, idx_c2, ON, HASH, PREFIX, 1, "c2:", SCHEMA, v, VECTOR,
        HNSW, 8, TYPE, FLOAT32, DIM, 2, DISTANCE_METRIC, L2, M, 2], expect_difference: true,
      expect: {equals: OK}}
    checks:
      acl: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [mminc.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: mminc}
