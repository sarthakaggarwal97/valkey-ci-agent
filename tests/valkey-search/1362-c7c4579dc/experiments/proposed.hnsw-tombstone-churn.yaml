    - {command: [HSET, "doc:k026", v, AAAAAAAAAAAAk026], expect: {equals: 1}}
    - {command: [DEL, "doc:t014"], expect: {equals: 1}}
    - {command: [HSET, "doc:t017", v, AAAAAAAAAAAAt017], expect: {equals: 1}}
    - {command: [HSET, "doc:k027", v, AAAAAAAAAAAAk027], expect: {equals: 1}}
    - {command: [DEL, "doc:t015"], expect: {equals: 1}}
    - {command: [HSET, "doc:t018", v, AAAAAAAAAAAAt018], expect: {equals: 1}}
    - {command: [HSET, "doc:k028", v, AAAAAAAAAAAAk028], expect: {equals: 1}}
    - {command: [DEL, "doc:t016"], expect: {equals: 1}}
    - {command: [HSET, "doc:t019", v, AAAAAAAAAAAAt019], expect: {equals: 1}}
    - {command: [HSET, "doc:k029", v, AAAAAAAAAAAAk029], expect: {equals: 1}}
    - {command: [DEL, "doc:t017"], expect: {equals: 1}}
    - {command: [FT.SEARCH, idx, "*", NOCONTENT, LIMIT, 0, 0], wait_s: 60, expect: {
        equals: [32]}}
    - {command: [DEL, "doc:t018"], expect: {equals: 1}}
    - {command: [DEL, "doc:t019"], expect: {equals: 1}}
    - {command: [FT.SEARCH, idx, "*", NOCONTENT, LIMIT, 0, 0], wait_s: 60, expect_difference: true,
      expect: {equals: [30]}}
    - {command: [FT.SEARCH, idx, "*=>[KNN 30 @v $q]", PARAMS, 2, q, AAAAAAAAAAAAk000,
        NOCONTENT], compare: unordered, expect_difference: true, expect: {contains: "doc:k000"}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [churn.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: churn}
