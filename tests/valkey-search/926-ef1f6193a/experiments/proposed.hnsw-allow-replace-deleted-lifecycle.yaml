extends: [valkey.liveness]
id: proposed.hnsw-allow-replace-deleted-lifecycle
deployment:
  modes: [standalone]
metadata:
  description: Dev-gated search.hnsw-allow-replace-deleted config, tombstone slot
    reuse under deletes/re-adds, CONFIG REWRITE persistence and RDB reload with replacement
    enabled, compared across module builds
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: lifecycle
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
    - {command: [CONFIG, SET, search.hnsw-allow-replace-deleted, yes], expect_difference: true,
      expect: {error: true}}
    - {command: [CONFIG, SET, search.debug-mode, yes], expect: {equals: OK}}
    - {command: [CONFIG, SET, search.hnsw-allow-replace-deleted, yes], expect_difference: true,
      expect: {equals: OK}}
    - {command: [FT.CREATE, idx, ON, HASH, PREFIX, 1, "doc:", SCHEMA, v, VECTOR, HNSW,
        6, TYPE, FLOAT32, DIM, 1, DISTANCE_METRIC, L2], expect: {equals: OK}}
    - {command: [HSET, "doc:0", v, !!binary "AAAAAA=="], expect: {equals: 1}}
    - {command: [HSET, "doc:1", v, !!binary "AACAPw=="], expect: {equals: 1}}
    - {command: [HSET, "doc:2", v, !!binary "AAAAQA=="], expect: {equals: 1}}
    - {command: [HSET, "doc:3", v, !!binary "AABAQA=="], expect: {equals: 1}}
    - {command: [HSET, "doc:4", v, !!binary "AACAQA=="], expect: {equals: 1}}
    - {command: [HSET, "doc:5", v, !!binary "AACgQA=="], expect: {equals: 1}}
    - {command: [HSET, "doc:6", v, !!binary "AADAQA=="], expect: {equals: 1}}
    - {command: [HSET, "doc:7", v, !!binary "AADgQA=="], expect: {equals: 1}}
    - {command: [FT.SEARCH, idx, "*=>[KNN 20 @v $q]", PARAMS, 2, q, !!binary "AABIQg==",
        NOCONTENT], wait_s: 30, compare: unordered, expect: {contains: 8}}
    - {command: [HSET, "doc:8", v, !!binary "AAAAQQ=="], expect: {equals: 1}}
    - {command: [HSET, "doc:9", v, !!binary "AAAQQQ=="], expect: {equals: 1}}
    - {command: [FT.SEARCH, idx, "*=>[KNN 20 @v $q]", PARAMS, 2, q, !!binary "AABIQg==",
        NOCONTENT], wait_s: 30, compare: unordered, expect: {contains: 10}}
    - {command: [DEL, "doc:8"], expect: {equals: 1}}
    - {command: [DEL, "doc:9"], expect: {equals: 1}}
    - {command: [FT.SEARCH, idx, "*=>[KNN 20 @v $q]", PARAMS, 2, q, !!binary "AABIQg==",
        NOCONTENT], wait_s: 30, compare: unordered, expect: {contains: 8}}
    - {command: [HSET, "doc:n0", v, !!binary "AADIQg=="], expect: {equals: 1}}
    - {command: [HSET, "doc:n1", v, !!binary "AADKQg=="], expect: {equals: 1}}
    - {command: [HSET, "doc:n2", v, !!binary "AADMQg=="], expect: {equals: 1}}
    - {command: [HSET, "doc:n3", v, !!binary "AADOQg=="], expect: {equals: 1}}
    - {command: [HSET, "doc:n4", v, !!binary "AADQQg=="], expect: {equals: 1}}
    - {command: [FT.SEARCH, idx, "*=>[KNN 20 @v $q]", PARAMS, 2, q, !!binary "AABIQg==",
        NOCONTENT], wait_s: 30, compare: unordered, expect: {contains: 13}}
    - {command: [DEL, "doc:n3"], expect: {equals: 1}}
    - {command: [DEL, "doc:n4"], expect: {equals: 1}}
    - {command: [FT.SEARCH, idx, "*=>[KNN 20 @v $q]", PARAMS, 2, q, !!binary "AABIQg==",
        NOCONTENT], wait_s: 30, compare: unordered, expect: {contains: 11}}
    - {command: [CONFIG, REWRITE], expect: {equals: OK}}
    - {command: [SAVE], expect: {equals: OK}}
    - {restart: true, expect: {equals: OK}}
    - {command: [FT.SEARCH, idx, "*=>[KNN 20 @v $q]", PARAMS, 2, q, !!binary "AABIQg==",
        NOCONTENT], wait_s: 60, compare: unordered, expect: {contains: 11}}
    - {command: [HSET, "doc:m0", v, !!binary "AABIQw=="], expect: {equals: 1}}
    - {command: [HSET, "doc:m1", v, !!binary "AABJQw=="], expect: {equals: 1}}
    - {command: [FT.SEARCH, idx, "*=>[KNN 20 @v $q]", PARAMS, 2, q, !!binary "AABIQg==",
        NOCONTENT], wait_s: 30, compare: unordered, expect: {contains: 13}}
    - {command: [CONFIG, SET, search.hnsw-allow-replace-deleted, no], expect_difference: true,
      expect: {error: true}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [lifecycle.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: lifecycle}
