extends: [valkey.liveness]
id: proposed.search-content-standalone
deployment:
  modes: [standalone]
metadata:
  description: FT.SEARCH content fetch, SORTBY and MULTI sync path compared across
    module builds
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: search
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
    - {command: [FT.CREATE, idx, ON, HASH, PREFIX, 1, "doc:", SCHEMA, content, TEXT,
        n, NUMERIC, SORTABLE], expect: {equals: OK}}
    - {command: [HSET, "doc:1", content, "hello world", n, 1], expect: {equals: 2}}
    - {command: [HSET, "doc:2", content, "hello there", n, 2], expect: {equals: 2}}
    - {command: [HSET, "doc:3", content, "goodbye world", n, 3], expect: {equals: 2}}
    - {command: [FT.SEARCH, idx, "@content:hello", NOCONTENT], wait_s: 30, expect: {
        contains: 2}, compare: unordered}
    - {command: [FT.SEARCH, idx, "@content:hello"], compare: unordered}
    - {command: [FT.SEARCH, idx, "@content:hello", SORTBY, n, ASC], expect: {contains: 2}}
    - {command: [FT.SEARCH, idx, "@content:hello", SORTBY, n, DESC], expect: {contains: 2}}
    - {command: [FT.SEARCH, idx, "@content:goodbye", SORTBY, n, DESC], compare: unordered}
    - {command: [FT.SEARCH, idx, "*", NOCONTENT], compare: unordered}
    - {command: [FT.SEARCH, idx, "@content:hello", LIMIT, 0, 0], expect: {contains: 2}}
    - {command: [MULTI], expect: {equals: OK}}
    - {command: [FT.SEARCH, idx, "@content:hello"], expect: {equals: QUEUED}}
    - {command: [EXEC], compare: unordered}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [search.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: search}
