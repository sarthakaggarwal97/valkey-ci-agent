extends: [valkey.liveness]
id: proposed.text-radix-revert-core
deployment:
  modes: [standalone]
metadata:
  description: Full-text index lifecycle compared across the RadixTree revert and
    the rax parent - ingest, prefix/suffix/stem dumps, every predicate type, overwrite,
    delete, empty-postings cleanup
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: core
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
    - {command: [FT.CREATE, idx, ON, HASH, PREFIX, 1, "doc:", SCHEMA, content, TEXT,
        WITHSUFFIXTRIE], expect: {equals: OK}}
    - {command: [HSET, "doc:1", content, "run runner running"], expect: {equals: 1}}
    - {command: [HSET, "doc:2", content, "wonder wonderful"], expect: {equals: 1}}
    - {command: [HSET, "doc:3", content, "happy"], expect: {equals: 1}}
    - {command: [HSET, "doc:4", content, "zebra"], expect: {equals: 1}}
    - {command: [HSET, "doc:5", content, "great oaks grow"], expect: {equals: 1}}
    - {command: [HSET, "doc:6", content, "grow oaks"], expect: {equals: 1}}
    - {command: [FT._DEBUG, TEXTINFO, idx, PREFIX, ""], wait_s: 30, expect: {equals: [
          great, grow, happy, oaks, run, runner, running, wonder, wonderful, zebra]}}
    - {command: [FT._DEBUG, TEXTINFO, idx, SUFFIX, ""], expect: {equals: [arbez, gninnur,
          lufrednow, nur, rednow, rennur, skao, taerg, worg, yppah]}}
    - {command: [FT._DEBUG, TEXTINFO, idx, STEM, happi], expect: {equals: [[happi,
            [happy]]]}}
    - {command: [FT._DEBUG, TEXTINFO, idx, PREFIX, running, WITHKEYS, WITHPOSITIONS]}
    - {command: [FT.SEARCH, idx, '@content:"running"', NOCONTENT], expect: {equals: [
          1, "doc:1"]}}
    - {command: [FT.SEARCH, idx, "@content:run", NOCONTENT], expect: {equals: [1,
          "doc:1"]}}
    - {command: [FT.SEARCH, idx, "@content:happiness", NOCONTENT], expect: {equals: [
          1, "doc:3"]}}
    - {command: [FT.SEARCH, idx, "@content:wond*", NOCONTENT], expect: {equals: [
          1, "doc:2"]}}
    - {command: [FT.SEARCH, idx, "@content:run*", LIMIT, 0, 0], expect: {equals: [
          1]}}
    - {command: [FT.SEARCH, idx, "@content:*ing", NOCONTENT], expect: {equals: [1,
          "doc:1"]}}
    - {command: [FT.SEARCH, idx, "@content:*nder", NOCONTENT], expect: {equals: [
          1, "doc:2"]}}
    - {command: [FT.SEARCH, idx, "@content:%wander%", NOCONTENT], expect: {equals: [
          1, "doc:2"]}}
    - {command: [FT.SEARCH, idx, "@content:oak", LIMIT, 0, 0], expect: {equals: [
          2]}}
    - {command: [FT.SEARCH, idx, '@content:"great oaks"', NOCONTENT], expect: {equals: [
          1, "doc:5"]}}
    - {command: [FT.SEARCH, idx, '@content:"oaks grow"', NOCONTENT], expect: {equals: [
          1, "doc:5"]}}
    - {command: [FT.SEARCH, idx, '@content:"grow oaks"', NOCONTENT], expect: {equals: [
          1, "doc:6"]}}
    - {command: [FT.SEARCH, idx, "@content:grow @content:oaks", LIMIT, 0, 0], expect: {
        equals: [2]}}
    - {command: [FT.SEARCH, idx, "@content:nomatch", LIMIT, 0, 0], expect: {equals: [
          0]}}
    - {command: [HSET, "doc:2", content, wonder], expect: {equals: 0}}
    - {command: [FT._DEBUG, TEXTINFO, idx, PREFIX, wonder], wait_s: 30, expect: {
        equals: [wonder]}}
    - {command: [FT._DEBUG, TEXTINFO, idx, SUFFIX, lufrednow], expect: {equals: []}}
    - {command: [FT.SEARCH, idx, "@content:wonderful", LIMIT, 0, 0], expect: {equals: [
          0]}}
    - {command: [DEL, "doc:3"], expect: {equals: 1}}
    - {command: [FT._DEBUG, TEXTINFO, idx, PREFIX, happy], wait_s: 30, expect: {equals: []}}
    - {command: [FT._DEBUG, TEXTINFO, idx, STEM, happi], expect: {equals: []}}
    - {command: [FT.SEARCH, idx, "@content:happiness", LIMIT, 0, 0], expect: {equals: [
          0]}}
    - {command: [DEL, "doc:1"], expect: {equals: 1}}
    - {command: [FT._DEBUG, TEXTINFO, idx, PREFIX, run], wait_s: 30, expect: {equals: []}}
    - {command: [FT._DEBUG, TEXTINFO, idx, PREFIX, ""], expect: {equals: [great, grow,
          oaks, wonder, zebra]}}
    - {command: [FT._DEBUG, TEXTINFO, idx, SUFFIX, ""], expect: {equals: [arbez, rednow,
          skao, taerg, worg]}}
    checks:
      acl: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_events: [core.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: core}
