extends: [valkey.liveness]
id: proposed.aggregate-lazy-expire
deployment:
  modes: [standalone]
metadata:
  description: FT.AGGREGATE LOAD fetching fields of a logically-expired but still-indexed
    hash must not crash via lazy expiration
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: agg
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 15
    commands:
    - {command: [FT.CREATE, idx, ON, HASH, PREFIX, 1, "doc:", SCHEMA, price, NUMERIC,
        tags, TAG], expect: {equals: OK}}
    - {command: [HSET, "doc:1", price, "100", tags, a], expect: {equals: 2}}
    - {command: [FT.SEARCH, idx, "@price:[0 1000]", LIMIT, "0", "0"], wait_s: 10,
      expect: {equals: [1]}}
    - {command: [DEBUG, SET-ACTIVE-EXPIRE, "0"], expect: {equals: OK}}
    - {command: [PEXPIRE, "doc:1", "50"], expect: {equals: 1}}
    - {command: [DEBUG, SLEEP, "0.2"], expect: {equals: OK}}
    - {command: [FT.AGGREGATE, idx, "@price:[0 1000]", LOAD, "1", "@price", DIALECT,
        "2"], expect_difference: true, compare: unordered, expect: {equals: [0]}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [agg.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: agg}
