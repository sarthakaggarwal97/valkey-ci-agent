extends: [valkey.liveness]
id: proposed.ft-info-tracked-keys-rdb-reload
deployment:
  modes: [standalone]
metadata:
  description: Tracked text keys rebuilt by backfill after an RDB save and restart;
    OnLoadingEnded's stale-key sweep now iterates a real tracked set for Text attributes
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: reload
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - {command: [HSET, "doc:1", title, "hello world", body, "greetings earth"], expect: {
        equals: 2}}
    - {command: [HSET, "doc:2", title, "valkey rocks"], expect: {equals: 1}}
    - {command: [FT.CREATE, idx, ON, HASH, PREFIX, 1, "doc:", SCHEMA, title, TEXT,
        body, TEXT], expect: {equals: OK}}
    - {command: [FT.INFO, idx], wait_s: 30, expect: {contains: ready}, expect_difference: true}
    - {command: [SAVE], expect: {equals: OK}}
    - {restart: true, expect: {equals: OK}}
    - {command: [FT.INFO, idx], wait_s: 60, expect: {contains: ready}, expect_difference: true}
    - {command: [FT.SEARCH, idx, "@title:hello", NOCONTENT], compare: unordered, wait_s: 15,
      expect: {contains: "doc:1"}}
    - {command: [DEL, "doc:1"], expect: {equals: 1}}
    - {command: [FT.SEARCH, idx, "@title:hello", NOCONTENT], compare: unordered, wait_s: 15,
      expect: {equals: [0]}}
    - {command: [FT.INFO, idx], expect_difference: true, expect: {contains: num_records}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [reload.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: reload}
