extends: [valkey.liveness]
id: proposed.ft-search-empty-knn
deployment:
  modes: [standalone]
metadata:
  description: FT.SEARCH with an empty vector query clause after => returns a clean
    error instead of reading past an empty string
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: ftsearch
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 10
    commands:
    - command: [FT.CREATE, idx, ON, HASH, PREFIX, '1', 'doc:', SCHEMA, v, VECTOR,
        HNSW, '6', TYPE, FLOAT32, DIM, '2', DISTANCE_METRIC, L2]
      expect: {equals: OK}
    - command: [FT.SEARCH, idx, '*=>']
      expect_difference: true
      expect: {error: "Vector query clause is missing"}
    - command: [FT.SEARCH, idx, '*=>   ']
      expect_difference: true
      expect: {error: "Vector query clause is missing"}
    - command: [FT.SEARCH, idx, '*=>[KNN]']
      expect: {error: "KNN argument is missing"}
    checks:
      acl: true
      concurrency: 4
      faults: true
      replica: true
      variants: true
required_evidence:
- {evidence_id: valkey.command.sequence, source: ftsearch}
