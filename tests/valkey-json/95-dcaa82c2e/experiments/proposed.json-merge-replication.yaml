extends: [valkey.liveness]
id: proposed.json-merge-replication
deployment:
  modes: [standalone]
metadata:
  description: JSON.MERGE replicated verbatim from a primary to a replica, including
    null-deletes, new keys and multi-target update-plus-insert merges, compared against
    the parent module build
components:
- use: valkey.action.commands
  id: repl
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    nodes: 2
    timeout_s: 120
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [JSON.SET, rk, ".", '{"a":1,"b":2}'], node: 0, expect: {equals: OK}}
    - {command: [JSON.MERGE, rk, ".", '{"b":null,"c":{"d":4}}'], node: 0, expect_difference: true,
      expect: {equals: OK}}
    - {command: [JSON.GET, rk], node: 0, expect_difference: true, expect: {equals: '{"a":1,"c":{"d":4}}'}}
    - {command: [JSON.GET, rk], node: 1, wait_s: 15, expect_difference: true, expect: {
        equals: '{"a":1,"c":{"d":4}}'}}
    - {command: [JSON.MERGE, rk2, ".", '{"x":null,"y":1}'], node: 0, expect_difference: true,
      expect: {equals: OK}}
    - {command: [JSON.GET, rk2], node: 1, wait_s: 15, expect_difference: true, expect: {
        equals: '{"y":1}'}}
    - {command: [JSON.SET, rk3, ".", '{"u":[{"p":{"e":"a"}},{}]}'], node: 0, expect: {
        equals: OK}}
    - {command: [JSON.MERGE, rk3, "$.u[*].p", '{"ph":"1","tmp":null}'], node: 0, expect_difference: true,
      expect: {equals: OK}}
    - {command: [JSON.GET, rk3], node: 0, expect_difference: true, expect: {equals: '{"u":[{"p":{"e":"a","ph":"1"}},{"p":{"ph":"1"}}]}'}}
    - {command: [JSON.GET, rk3], node: 1, wait_s: 15, expect_difference: true, expect: {
        equals: '{"u":[{"p":{"e":"a","ph":"1"}},{"p":{"ph":"1"}}]}'}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
