extends: [valkey.liveness]
id: proposed.json-module-version-stage
deployment:
  modes: [standalone]
metadata:
  description: The release-stage change registers the json module as version 0 (octal
    000000) instead of 90; INFO modules must report ver=0, the module must still load,
    and JSON commands must behave identically on both builds
inputs:
  required: [module, module_parent]
  properties:
    module:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "The module build under test, {$ref: artifacts.module.path}"
    module_parent:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "The parent commit's build of the module, {$ref: artifacts.module_parent.path}"
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: jsonver
  config:
    modules: [{$ref: inputs.module}]
    modules_parent: [{$ref: inputs.module_parent}]
    resp: {$ref: inputs.resp}
    timeout_s: 10
    commands:
    - {command: [INFO, modules], expect_difference: true, expect: {contains: "name=json,ver=0"}}
    - {command: [MODULE, LIST], compare: skip, expect: {contains: json}}
    - {command: [JSON.SET, doc, $, '{"a":1,"b":[1,2,3],"c":{"d":"x"}}'], expect: {
        equals: OK}}
    - {command: [JSON.GET, doc, $], compare: json}
    - {command: [JSON.TYPE, doc, .b], expect: {equals: array}}
    - {command: [JSON.ARRAPPEND, doc, .b, '4'], expect: {equals: 4}}
    - {command: [JSON.GET, doc], compare: json}
    - {command: [JSON.DEL, doc, $.c], expect: {equals: 1}}
    - {command: [JSON.GET, doc], compare: json}
    - {command: [JSON.SET, empty, $, '{}'], expect: {equals: OK}}
    - {command: [JSON.OBJLEN, empty, .], expect: {equals: 0}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [jsonver.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: jsonver}
