extends: [valkey.liveness]
id: proposed.json-numincrby-underflow-arg
deployment:
  modes: [standalone]
metadata:
  description: JSON.NUMINCRBY with a subnormal increment argument succeeds instead
    of crashing the server
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: numincrby
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 10
    commands:
    - {command: [JSON.SET, doc, $, "1.5"], expect: {equals: OK}}
    - {command: [JSON.NUMINCRBY, doc, $, "1e-308"], expect_difference: true, expect: {
        equals: "[1.5]"}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_evidence:
- {evidence_id: valkey.command.sequence, source: numincrby}
