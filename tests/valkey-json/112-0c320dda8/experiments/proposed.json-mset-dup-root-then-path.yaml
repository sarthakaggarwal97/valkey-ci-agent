extends: [valkey.liveness]
id: proposed.json-mset-dup-root-then-path
deployment:
  modes: [standalone]
metadata:
  description: JSON.MSET replaces a key's root then references a child path of the
    old shape on the same key; parent asserts/crashes, fix returns OK with only the
    root op applied
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: mset
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 10
    commands:
    - {command: [JSON.SET, dk, "$", '{"a":1}'], expect: {equals: OK}}
    - {command: [JSON.MSET, dk, "$", '[1,2,3]', dk, ".a", "99"], expect_difference: true,
      expect: {equals: OK}}
    - {command: [JSON.GET, dk, "."], compare: json, expect_difference: true, expect: {
        contains: "1,2,3"}}
    - {command: [JSON.SET, after, "$", '{"alive":1}'], expect_difference: true, expect: {
        equals: OK}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [mset.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: mset}
