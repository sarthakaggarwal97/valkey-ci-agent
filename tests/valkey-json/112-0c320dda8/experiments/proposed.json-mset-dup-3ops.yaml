extends: [valkey.liveness]
id: proposed.json-mset-dup-3ops
deployment:
  modes: [standalone]
metadata:
  description: JSON.MSET with a duplicate key whose later op conflicts, followed by
    a valid op on another key; parent asserts/crashes, fix skips the conflict and
    still applies the rest
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: mset
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 10
    commands:
    - {command: [JSON.SET, dk, "$", '{"a":1}'], expect: {equals: OK}}
    - {command: [JSON.SET, k, "$", '{"v":0}'], expect: {equals: OK}}
    - {command: [JSON.MSET, dk, "$", '[1,2,3]', dk, ".a", "99", k, ".v", "42"], expect_difference: true,
      expect: {equals: OK}}
    - {command: [JSON.GET, dk, "."], compare: json, expect_difference: true, expect: {
        contains: "1,2,3"}}
    - {command: [JSON.GET, k, "."], compare: json, expect_difference: true, expect: {
        contains: "42"}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [mset.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: mset}
