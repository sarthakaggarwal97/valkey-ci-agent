extends: [valkey.liveness]
id: proposed.bloom-autoscale-rdb-roundtrip
deployment:
  modes: [standalone]
metadata:
  description: Save and restart with a scaled multi-filter bloom, exercising the rewritten
    RDB save/load format; capacity after reload still differs from the never-scaling
    parent
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: reload
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 25
    commands:
    - {command: [BF.RESERVE, k, "0.001", "50", EXPANSION, "2"], expect: {equals: OK}}
    - {command: [BF.MADD, k, item1, item2, item3, item4, item5, item6, item7, item8,
        item9, item10, item11, item12, item13, item14, item15, item16, item17, item18,
        item19, item20, item21, item22, item23, item24, item25, item26, item27, item28,
        item29, item30, item31, item32, item33, item34, item35, item36, item37, item38,
        item39, item40, item41, item42, item43, item44, item45, item46, item47, item48,
        item49, item50, item51, item52, item53, item54, item55, item56, item57, item58,
        item59, item60, item61, item62, item63, item64, item65, item66, item67, item68,
        item69, item70], compare: skip}
    - {command: [SAVE], expect: {equals: OK}}
    - {restart: true, expect: {equals: OK}}
    - {command: [BF.INFO, k, CAPACITY], expect_difference: true, expect: {equals: 150}}
    - {command: [BF.EXISTS, k, item1], expect: {equals: 1}, compare: skip}
    - {command: [BF.CARD, k], expect: {min: 50}, compare: skip}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_evidence:
- {evidence_id: valkey.command.sequence, source: reload}
