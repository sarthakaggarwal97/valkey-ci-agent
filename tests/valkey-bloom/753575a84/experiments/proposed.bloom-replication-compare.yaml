extends: [valkey.liveness]
id: proposed.bloom-replication-compare
deployment:
  modes: [standalone]
metadata:
  description: Bloom filter module payload crosses a full sync to a replica after
    the serialization changes
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: repl
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - {command: [BF.RESERVE, marker, "0.001", "100", EXPANSION, "11"], expect_difference: true,
      expect: {error: "bad expansion"}}
    - {command: [BF.RESERVE, scale, "0.0001", "2", EXPANSION, "3"], expect: {equals: OK}}
    - {command: [BF.MADD, scale, a, b, c, d, e], expect: {equals: [1, 1, 1, 1, 1]}}
    - {command: [BF.RESERVE, ns, "0.001", "100", NONSCALING], expect: {equals: OK}}
    - {command: [BF.ADD, ns, x], expect: {equals: 1}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, compare: skip, wait_s: 30, expect: {
        contains: "master_link_status:up"}}
    - {command: [BF.INFO, scale, ITEMS], node: 1, wait_s: 30, expect: {equals: 5}}
    - {command: [BF.INFO, scale, FILTERS], node: 1, expect: {equals: 2}}
    - {command: [BF.INFO, scale, CAPACITY], node: 1, expect: {equals: 8}}
    - {command: [BF.INFO, scale, EXPANSION], node: 1, expect: {equals: 3}}
    - {command: [BF.MEXISTS, scale, a, b, c, d, e], node: 1, expect: {equals: [1,
          1, 1, 1, 1]}}
    - {command: [BF.INFO, ns, EXPANSION], node: 1, expect: {equals: -1}}
    - {command: [BF.EXISTS, ns, x], node: 1, expect: {equals: 1}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
