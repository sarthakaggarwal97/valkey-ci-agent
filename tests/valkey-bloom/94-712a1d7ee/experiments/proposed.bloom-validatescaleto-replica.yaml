extends: [valkey.liveness]
id: proposed.bloom-validatescaleto-replica
deployment:
  modes: [standalone]
metadata:
  description: BF.INSERT VALIDATESCALETO adding to an existing filter must not be
    re-rejected on a replica whose bloom-memory-usage-limit is tighter than the primary's
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: vst
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    nodes: 2
    timeout_s: 30
    commands:
    - {command: [CONFIG, SET, bf.bloom-memory-usage-limit, "1024"], node: 1, expect: {
        equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 25, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [BF.INSERT, key, CAPACITY, "100", ERROR, "0.01", EXPANSION, "2", VALIDATESCALETO,
        "1000000", ITEMS, a], node: 0, expect: {equals: [1]}}
    - {command: [BF.INSERT, key, CAPACITY, "100", ERROR, "0.01", EXPANSION, "2", VALIDATESCALETO,
        "1000000", ITEMS, b], node: 0, expect: {equals: [1]}}
    - {command: [BF.CARD, key], node: 0, wait_s: 10, expect: {equals: 2}}
    - {command: [BF.CARD, key], node: 1, wait_s: 15, expect_difference: true, expect: {
        equals: 2}}
    - {command: [CONFIG, SET, bf.bloom-memory-usage-limit, "1024"], node: 0, expect: {
        equals: OK}}
    - {command: [BF.INSERT, user_key, CAPACITY, "100", ERROR, "0.01", EXPANSION, "2",
        VALIDATESCALETO, "1000000", ITEMS, x], node: 0, expect: {error: "VALIDATESCALETO"}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [vst.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: vst}
