extends: [valkey.liveness]
id: proposed.bloom-validatescaleto-subreplica
deployment:
  modes: [standalone]
metadata:
  description: The VALIDATESCALETO must-obey skip must hold down a replication chain
    - a sub-replica with a tighter bloom-memory-usage-limit must still apply a verbatim-replicated
    BF.INSERT add
components:
- use: valkey.action.commands
  id: chain
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    nodes: 3
    timeout_s: 30
    commands:
    - {command: [CONFIG, SET, bf.bloom-memory-usage-limit, "1024"], node: 2, expect: {
        equals: OK}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 25, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [REPLICAOF, "<node.1.host>", "<node.1.port>"], node: 2, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 2, wait_s: 25, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [BF.INSERT, key, CAPACITY, "100", ERROR, "0.01", EXPANSION, "2", VALIDATESCALETO,
        "1000000", ITEMS, a], node: 0, expect: {equals: [1]}}
    - {command: [BF.INSERT, key, CAPACITY, "100", ERROR, "0.01", EXPANSION, "2", VALIDATESCALETO,
        "1000000", ITEMS, b], node: 0, expect: {equals: [1]}}
    - {command: [BF.CARD, key], node: 1, wait_s: 15, expect: {equals: 2}}
    - {command: [BF.CARD, key], node: 2, wait_s: 15, expect_difference: true, expect: {
        equals: 2}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [chain.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: chain}
