extends: [valkey.liveness]
id: proposed.bloom-notify-replica
deployment:
  modes: [standalone]
metadata:
  description: Bloom write commands still replicate verbatim after the replicate_and_post_events
    refactor, and the replica fires bloom.add/bloom.reserve notifications when applying
    them
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: repl
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    nodes: 2
    server_config: {notify-keyspace-events: "KEA"}
    timeout_s: 15
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, expect: {contains: "master_link_status:up"},
      compare: skip}
    - {command: [SUBSCRIBE, "__keyevent@0__:bloom.add"], node: 1, connection: rsub}
    - {command: [SUBSCRIBE, "__keyevent@0__:bloom.reserve"], node: 1, connection: rsub}
    - {command: [SUBSCRIBE, marker], node: 1, connection: rsub}
    - {command: [BF.ADD, bf, item1], expect: {equals: 1}}
    - {command: [BF.MADD, bf, item2, item3], expect: {equals: [1, 1]}}
    - {command: [BF.RESERVE, rsv, 0.01, 100], expect: {equals: OK}}
    - {command: [BF.ADD, bf, item1], expect: {equals: 0}}
    - {command: [BF.EXISTS, bf, item1], node: 1, wait_s: 15, expect: {equals: 1}}
    - {command: [BF.CARD, bf], node: 1, wait_s: 15, expect: {equals: 3}}
    - {command: [EXISTS, rsv], node: 1, wait_s: 15, expect: {equals: 1}}
    - {command: [PUBLISH, marker, done], expect: {equals: 0}}
    - {connection: rsub, node: 1, read: true, expect_difference: true, expect: {contains: "bloom.add"}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
