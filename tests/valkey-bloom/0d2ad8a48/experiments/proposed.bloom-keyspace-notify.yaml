extends: [valkey.liveness]
id: proposed.bloom-keyspace-notify
deployment:
  modes: [standalone]
metadata:
  description: BF.ADD/MADD/RESERVE/INSERT fire bloom.add and bloom.reserve keyspace
    notifications, and MADD/INSERT on a full non-scaling filter stop at the first
    error
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: notify
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    server_config: {notify-keyspace-events: "KEA"}
    timeout_s: 10
    commands:
    - {command: [SUBSCRIBE, "__keyevent@0__:bloom.add"], connection: events}
    - {command: [SUBSCRIBE, "__keyevent@0__:bloom.reserve"], connection: events}
    - {command: [SUBSCRIBE, marker], connection: events}
    - {command: [SUBSCRIBE, "__keyspace@0__:bf1"], connection: keyspace}
    - {command: [SUBSCRIBE, marker], connection: keyspace}
    - {command: [BF.ADD, bf1, item1], expect: {equals: 1}}
    - {command: [BF.ADD, bf1, item1], expect: {equals: 0}}
    - {command: [BF.MADD, bf1, item2, item3, item2], expect: {equals: [1, 1, 0]}}
    - {command: [BF.RESERVE, bf2, 0.001, 1000], expect: {equals: OK}}
    - {command: [BF.RESERVE, bf2, 0.001, 1000], expect: {error: "item exists"}}
    - {command: [BF.INSERT, bf3, CAPACITY, 50, ITEMS, a, b, a], expect: {equals: [
          1, 1, 0]}}
    - {command: [BF.INSERT, bf3, NOCREATE, ITEMS, c], expect: {equals: [1]}}
    - {command: [BF.EXISTS, bf1, item1], expect: {equals: 1}}
    - {command: [BF.CARD, bf1], expect: {equals: 3}}
    - {command: [BF.RESERVE, full, 0.01, 1, NONSCALING], expect: {equals: OK}}
    - {command: [BF.ADD, full, only], expect: {equals: 1}}
    - {command: [BF.MADD, full, only, x, y], expect_difference: true, expect: {equals: [
          0, {$error: "ERR non scaling filter is full"}]}}
    - {command: [BF.INSERT, full, ITEMS, z, w], expect_difference: true, expect: {
        equals: [{$error: "ERR non scaling filter is full"}]}}
    - {command: [PUBLISH, marker, done], expect: {equals: 2}}
    - {connection: events, read: true, expect_difference: true, expect: {contains: "bloom.add"}}
    - {connection: keyspace, read: true, expect_difference: true, expect: {contains: "bloom.reserve"}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [notify.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: notify}
