extends: [valkey.liveness]
id: proposed.bloom-replication-skip-validation-compare
deployment:
  modes: [standalone]
metadata:
  description: Replicated BF commands bypass the new per-filter size limit on the
    replica so replication keeps working
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: repl
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 180
    commands:
    - {command: [CONFIG, SET, bf.bloom-memory-limit-per-filter, "100"], node: 1, expect_difference: true,
      expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [BF.RESERVE, f, "0.001", "30", EXPANSION, "10"], expect: {equals: OK}}
    - {command: [BF.ADD, f, item1], expect: {equals: 1}}
    - {command: [BF.EXISTS, f, item1], node: 1, wait_s: 30, expect: {equals: 1}}
    - {command: [BF.MADD, f, s01, s02, s03, s04, s05, s06, s07, s08, s09, s10, s11,
        s12, s13, s14, s15, s16, s17, s18, s19, s20, s21, s22, s23, s24, s25, s26,
        s27, s28, s29, s30]}
    - {command: [BF.ADD, f, ov1]}
    - {command: [BF.ADD, f, ov2]}
    - {command: [BF.ADD, f, ov3]}
    - {command: [BF.INFO, f, FILTERS], expect: {equals: 2}}
    - {command: [BF.INFO, f, FILTERS], node: 1, wait_s: 30, expect: {equals: 2}}
    - {command: [BF.EXISTS, f, ov3], node: 1, wait_s: 30, expect: {equals: 1}}
    - {command: [BF.CARD, f], node: 1, wait_s: 30, expect: {min: 30}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
