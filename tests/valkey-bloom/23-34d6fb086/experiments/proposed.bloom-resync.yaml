extends: [valkey.liveness]
id: proposed.bloom-resync
deployment:
  modes: [standalone]
metadata:
  description: A replica full-syncs a scaled bloom object through the rewritten RDB
    save on the primary and load on the replica; the replica reads added items present
    and BF.INFO SIZE shrinks on the change build
inputs:
  required: [module, module_parent]
  properties:
    module:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "module build under test, {$ref: artifacts.module.path}"
    module_parent:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "parent module build, {$ref: artifacts.module_parent.path}"
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: resync
  config:
    modules: [{$ref: inputs.module}]
    modules_parent: [{$ref: inputs.module_parent}]
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
    - {command: [BF.RESERVE, bf, "0.01", "2", EXPANSION, "2"], node: 0, expect: {
        equals: OK}}
    - {command: [BF.MADD, bf, a, b, c, d, e, f], node: 0, compare: skip}
    - {command: [BF.EXISTS, bf, a], node: 0, expect: {equals: 1}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [BF.EXISTS, bf, a], node: 1, wait_s: 30, expect: {equals: 1}}
    - {command: [BF.EXISTS, bf, f], node: 1, expect: {equals: 1}}
    - {command: [BF.INFO, bf, FILTERS], node: 1, compare: skip}
    - {command: [BF.INFO, bf, SIZE], node: 1, expect_difference: true, expect: {min: 1}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [resync.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: resync}
