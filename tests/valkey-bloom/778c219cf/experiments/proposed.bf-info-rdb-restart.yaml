extends: [valkey.liveness]
id: proposed.bf-info-rdb-restart
deployment:
  modes: [standalone]
metadata:
  description: The new RDB format (capacity and expansion now both saved) round-trips
    across SAVE and restart twice, read back through BF.INFO, BF.CARD and BF.EXISTS
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: bfrdb
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - {command: [BF.RESERVE, f1, "0.01", "10000", EXPANSION, "3"], expect: {equals: OK}}
    - {command: [BF.ADD, f1, a], expect: {equals: 1}}
    - {command: [BF.ADD, f1, b], expect: {equals: 1}}
    - {command: [BF.ADD, f1, a], expect: {equals: 0}}
    - {command: [BF.ADD, plainf, c], expect: {equals: 1}}
    - {command: [SAVE], expect: {equals: OK}}
    - {restart: true, expect: {equals: OK}}
    - {command: [BF.EXISTS, f1, a], expect: {equals: 1}}
    - {command: [BF.EXISTS, f1, b], expect: {equals: 1}}
    - {command: [BF.CARD, f1], expect: {equals: 2}}
    - {command: [BF.INFO, f1, CAPACITY], expect_difference: true, expect: {equals: 10000}}
    - {command: [BF.INFO, f1, EXPANSION], expect_difference: true, expect: {equals: 3}}
    - {command: [BF.INFO, f1, ITEMS], expect_difference: true, expect: {equals: 2}}
    - {command: [BF.INFO, plainf, CAPACITY], expect_difference: true, expect: {equals: 100000}}
    - {command: [BF.INFO, f1], expect_difference: true, expect: {contains: Capacity}}
    - {command: [SAVE], expect: {equals: OK}}
    - {restart: true, expect: {equals: OK}}
    - {command: [BF.CARD, f1], expect: {equals: 2}}
    - {command: [BF.INFO, f1, CAPACITY], expect_difference: true, expect: {equals: 10000}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [bfrdb.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: bfrdb}
