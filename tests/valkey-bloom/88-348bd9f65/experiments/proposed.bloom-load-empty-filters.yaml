extends: [valkey.liveness]
id: proposed.bloom-load-empty-filters
deployment:
  modes: [standalone]
metadata:
  description: BF.LOAD of a bincode payload with zero filters is rejected instead
    of crashing the server
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: load
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 10
    commands:
    - {command: [BF.LOAD, bf, !!binary "AQIAAAB7FK5H4XqEPwAAAAAA4D8AAAAAAAAAAAAA"],
      expect_difference: true, expect: {error: "bloom object decoding failed"}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [load.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: load}
