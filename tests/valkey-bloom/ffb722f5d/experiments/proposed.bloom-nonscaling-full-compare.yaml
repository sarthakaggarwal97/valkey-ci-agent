extends: [valkey.liveness]
id: proposed.bloom-nonscaling-full-compare
deployment:
  modes: [standalone]
metadata:
  description: Non scaling bloom filters filled to capacity refuse adds with a new
    error, capacity 0 gets a dedicated error, and scaled sub filters use a tightened
    fp rate
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: nonscaling
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
    - {command: [BF.RESERVE, cap0, "0.001", 0], expect_difference: true, expect: {
        error: "capacity should be larger than 0"}}
    - {command: [BF.INSERT, cap0i, CAPACITY, 0, ITEMS, x], expect_difference: true,
      expect: {error: "capacity should be larger than 0"}}
    - {command: [BF.RESERVE, capneg, "0.001", -1], expect: {error: "Bad capacity"}}
    - {command: [BF.RESERVE, capmax, "0.001", 4294967295], expect: {error: "Bad capacity"}}
    - {command: [BF.RESERVE, capovf, "0.001", 9223372036854775807], expect: {error: "Bad\
          \ capacity"}}
    - {command: [BF.RESERVE, nsf, "0.000001", 1, NONSCALING], expect: {equals: OK}}
    - {command: [BF.INFO, nsf, EXPANSION], expect: {equals: -1}}
    - {command: [BF.ADD, nsf, item1], expect: {equals: 1}}
    - {command: [BF.ADD, nsf, item2], expect_difference: true, expect: {error: "non\
          \ scaling filter is full"}}
    - {command: [BF.ADD, nsf, ""], expect_difference: true, expect: {error: "non scaling\
          \ filter is full"}}
    - {command: [BF.ADD, nsf, item2], expect_difference: true, expect: {error: "non\
          \ scaling filter is full"}}
    - {command: [BF.CARD, nsf], expect_difference: true, expect: {equals: 1}}
    - {command: [BF.INFO, nsf, ITEMS], expect_difference: true, expect: {equals: 1}}
    - {command: [BF.INFO, nsf, FILTERS], expect: {equals: 1}}
    - {command: [BF.EXISTS, nsf, item1], expect: {equals: 1}}
    - {command: [BF.RESERVE, nsf2, "0.000001", 2, NONSCALING], expect: {equals: OK}}
    - {command: [BF.MADD, nsf2, m1, m2, m3, m4], expect_difference: true, expect: {
        contains: "ERR non scaling filter is full"}}
    - {command: [BF.CARD, nsf2], expect_difference: true, expect: {equals: 2}}
    - {command: [BF.INSERT, nsf2, ITEMS, m5, m6], expect_difference: true, expect: {
        contains: "ERR non scaling filter is full"}}
    - {command: [BF.INSERT, nsf3, CAPACITY, 1, NONSCALING, ITEMS, z1, z2], expect_difference: true,
      expect: {contains: "ERR non scaling filter is full"}}
    - {command: [BF.CARD, nsf3], expect_difference: true, expect: {equals: 1}}
    - {command: [BF.RESERVE, scale, "0.000001", 20, EXPANSION, 2], expect: {equals: OK}}
    - {command: [BF.MADD, scale, s01, s02, s03, s04, s05, s06, s07, s08, s09, s10,
        s11, s12, s13, s14, s15, s16, s17, s18, s19, s20, s21]}
    - {command: [BF.INFO, scale, FILTERS], expect: {equals: 2}}
    - {command: [BF.CARD, scale], expect: {equals: 21}}
    - {command: [BF.INFO, scale, CAPACITY], expect: {equals: 60}}
    - {command: [BF.INFO, scale, SIZE], expect_difference: true, expect: {min: 1}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [nonscaling.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: nonscaling}
