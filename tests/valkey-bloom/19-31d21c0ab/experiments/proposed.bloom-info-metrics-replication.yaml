extends: [valkey.liveness]
id: proposed.bloom-info-metrics-replication
deployment:
  modes: [standalone]
metadata:
  description: replica rebuilds bloom metrics from full sync, drops its pre-sync bloom
    objects with correct accounting, and tracks replicated create and delete
inputs:
  properties:
    repl_diskless_sync: {type: string, enum: ["yes", "no"], default: "no"}
    repl_diskless_load: {type: string, enum: [disabled, on-empty-db, swapdb], default: disabled}
components:
- use: valkey.action.commands
  id: repl
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    nodes: 2
    server_config:
      repl-diskless-sync: {$ref: inputs.repl_diskless_sync}
      repl-diskless-load: {$ref: inputs.repl_diskless_load}
    timeout_s: 120
    commands:
    - {command: [BF.ADD, locally-owned, x], node: 1, expect: {equals: 1}}
    - {command: [INFO, bf], node: 1, expect_difference: true, expect: {contains: "bf_bloom_num_objects:1"}}
    - {command: [BF.ADD, pkey, item1], node: 0, expect: {equals: 1}}
    - {command: [BF.INSERT, skey, CAPACITY, "1", ITEMS, a], node: 0, expect: {equals: [
          1]}}
    - {command: [BF.ADD, skey, b], node: 0, expect: {in: [0, 1]}}
    - {command: [BF.ADD, skey, c], node: 0, expect: {in: [0, 1]}}
    - {command: [BF.INFO, skey, FILTERS], node: 0, expect: {equals: 2}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [BF.EXISTS, pkey, item1], node: 1, wait_s: 15, expect: {equals: 1}}
    - {command: [BF.INFO, skey, FILTERS], node: 1, wait_s: 15, expect: {equals: 2}}
    - {command: [INFO, bf], node: 1, expect_difference: true, expect: {contains: "bf_bloom_num_objects:2"}}
    - {command: [INFO, bf], node: 1, expect_difference: true, expect: {contains: "bf_bloom_num_filters_across_objects:3"}}
    - {command: [BF.RESERVE, rkey, "0.001", "500"], node: 0, expect: {equals: OK}}
    - {command: [BF.INFO, rkey, CAPACITY], node: 1, wait_s: 15, expect: {equals: 500}}
    - {command: [INFO, bf], node: 1, expect_difference: true, expect: {contains: "bf_bloom_num_objects:3"}}
    - {command: [DEL, skey], node: 0, expect: {equals: 1}}
    - {command: [BF.EXISTS, skey, a], node: 1, wait_s: 15, expect: {equals: 0}}
    - {command: [INFO, bf], node: 1, expect_difference: true, expect: {contains: "bf_bloom_num_objects:2"}}
    - {command: [INFO, bf], node: 1, expect_difference: true, expect: {contains: "bf_bloom_num_filters_across_objects:2"}}
    - {command: [FLUSHALL], node: 0, expect: {equals: OK}}
    - {command: [BF.EXISTS, pkey, item1], node: 1, wait_s: 15, expect: {equals: 0}}
    - {command: [INFO, bf], node: 1, expect_difference: true, expect: {contains: "bf_bloom_total_memory_bytes:0"}}
    - {command: [INFO, bf], node: 0, expect_difference: true, expect: {contains: "bf_bloom_total_memory_bytes:0"}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
