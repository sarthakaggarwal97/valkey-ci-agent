extends: [valkey.liveness]
id: proposed.bloom-replication-compare
deployment:
  modes: [standalone]
metadata:
  description: BF.ADD/MADD/INSERT/RESERVE now replicate verbatim; on the parent an
    already-synced replica never sees bloom writes, while a late replica gets them
    via full sync on both builds
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: repl
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    nodes: 3
    timeout_s: 120
    commands:
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [BF.RESERVE, rsv, "0.001", "100"], expect: {equals: OK}}
    - {command: [BF.ADD, single, item1], expect: {equals: 1}}
    - {command: [BF.ADD, single, item1], expect: {equals: 0}}
    - {command: [BF.MADD, multi, m1, m2, m3], expect: {exists: true}}
    - {command: [BF.INSERT, ins, ERROR, "0.00001", CAPACITY, "2", EXPANSION, "2",
        ITEMS, i1, i2, i3, i4, i5], expect: {equals: [1, 1, 1, 1, 1]}}
    - {command: [BF.RESERVE, nsf, "0.00001", "2", NONSCALING], expect: {equals: OK}}
    - {command: [BF.ADD, nsf, na], expect: {equals: 1}}
    - {command: [BF.MADD, nsf, nb, nc, nd], expect_difference: true, expect: {exists: true}}
    - {command: [BF.ADD, e, ""], expect: {equals: 1}}
    - {command: [BF.CARD, single], node: 1, wait_s: 20, expect_difference: true, expect: {
        equals: 1}}
    - {command: [BF.EXISTS, single, item1], node: 1, expect_difference: true, expect: {
        equals: 1}}
    - {command: [BF.MEXISTS, multi, m1, m2, m3], node: 1, expect_difference: true,
      expect: {equals: [1, 1, 1]}}
    - {command: [BF.INFO, rsv, CAPACITY], node: 1, expect_difference: true, expect: {
        equals: 100}}
    - {command: [BF.INFO, ins, ITEMS], node: 1, expect_difference: true, expect: {
        equals: 5}}
    - {command: [BF.INFO, ins, FILTERS], node: 1, expect_difference: true, expect: {
        equals: 2}}
    - {command: [BF.EXISTS, nsf, nb], node: 1, expect_difference: true, expect: {
        equals: 1}}
    - {command: [BF.EXISTS, e, ""], node: 1, expect_difference: true, expect: {equals: 1}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 2, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 2, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [BF.CARD, single], node: 2, wait_s: 20, expect: {equals: 1}}
    - {command: [BF.MEXISTS, multi, m1, m2, m3], node: 2, expect: {equals: [1, 1,
          1]}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
