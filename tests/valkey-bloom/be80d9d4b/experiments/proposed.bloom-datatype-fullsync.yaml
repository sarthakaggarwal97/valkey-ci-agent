extends: [valkey.liveness]
id: proposed.bloom-datatype-fullsync
deployment:
  modes: [standalone]
metadata:
  description: >-
    The module rdb_save/rdb_load callbacks on the replication path: a filter written
    before REPLICAOF reaches the replica through a full sync, the replicated DEL frees
    it on both nodes via the free callback, and the primary stays alive. On the parent
    the fork child crashes serializing the NULL-type value, the replica never syncs
    the key, and DEL kills node 0.
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    diskless: {type: string, enum: ["yes", "no"], default: "yes"}
components:
- use: valkey.action.commands
  id: fullsync
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    nodes: 2
    server_config:
      repl-diskless-sync: {$ref: inputs.diskless}
      repl-diskless-sync-delay: "0"
    timeout_s: 90
    commands:
    - {command: [BF.ADD, filter, item-one], node: 0, expect: {equals: 1}}
    - {command: [BF.ADD, filter, ""], node: 0, expect: {in: [0, 1]}}
    - {command: [BF.ADD, filter, item-two], node: 0, expect: {in: [0, 1]}}
    - {command: [BF.CARD, filter], node: 0, expect: {min: 1, max: 3}}
    - {command: [REPLICAOF, "<node.0.host>", "<node.0.port>"], node: 1, expect: {
        equals: OK}}
    - {command: [BF.EXISTS, filter, item-one], node: 1, wait_s: 30, expect_difference: true,
      expect: {equals: 1}}
    - {command: [BF.EXISTS, filter, item-two], node: 1, expect_difference: true, expect: {
        equals: 1}}
    - {command: [BF.EXISTS, filter, ""], node: 1, expect_difference: true, expect: {
        equals: 1}}
    - {command: [BF.CARD, filter], node: 1, expect_difference: true, expect: {min: 1,
        max: 3}}
    - {command: [TYPE, filter], node: 1, expect_difference: true, expect: {equals: bloomtype}}
    - {command: [DEL, filter], node: 0, expect_difference: true, expect: {equals: 1}}
    - {command: [BF.CARD, filter], node: 1, wait_s: 15, expect: {equals: 0}}
    - {command: [PING], node: 0, expect_difference: true, expect: {equals: PONG}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [fullsync.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: fullsync}
