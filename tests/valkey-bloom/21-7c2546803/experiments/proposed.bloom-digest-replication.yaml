extends: [valkey.liveness]
id: proposed.bloom-digest-replication
deployment:
  modes: [standalone]
metadata:
  description: Bloom objects shipped to a replica by full sync, then DEBUG DIGEST
    and DIGEST-VALUE on primary and replica; the digest callback runs on objects rebuilt
    from the replication RDB on the replica side
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: repl-digest
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    server_config: {enable-debug-command: "yes"}
    resp: {$ref: inputs.resp}
    nodes: 2
    timeout_s: 90
    commands:
    - {command: [BF.RESERVE, scale, "0.01", "20", EXPANSION, "2"], expect: {equals: OK}}
    - {command: [BF.MADD, scale, i1, i2, i3, i4, i5, i6, i7, i8, i9, i10, i11, i12,
        i13, i14, i15, i16, i17, i18, i19, i20, i21, i22, i23, i24, i25, i26, i27,
        i28, i29, i30]}
    - {command: [BF.MADD, scale, j1, j2, j3, j4, j5, j6, j7, j8, j9, j10, j11, j12,
        j13, j14, j15, j16, j17, j18, j19, j20, j21, j22, j23, j24, j25, j26, j27,
        j28, j29, j30]}
    - {command: [BF.INFO, scale, FILTERS], expect: {min: 2}}
    - {command: [BF.INSERT, other, ERROR, "0.001", CAPACITY, "100", ITEMS, a, b, c]}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [BF.ADD, scale, extra]}
    - {command: [WAIT, 1, 1000], expect: {equals: 1}}
    - {command: [DEBUG, DIGEST], node: 0, expect_difference: true, expect: {error: false}}
    - {command: [DEBUG, DIGEST], node: 1, expect_difference: true, expect: {error: false}}
    - {command: [DEBUG, DIGEST-VALUE, scale, other], node: 0, expect_difference: true,
      expect: {error: false}}
    - {command: [DEBUG, DIGEST-VALUE, scale, other], node: 1, expect_difference: true,
      expect: {error: false}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [repl-digest.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl-digest}
