extends: [valkey.liveness]
id: proposed.bloom-size-after-reload
deployment:
  modes: [standalone]
metadata:
  description: A bloom object saved with the new tightening_ratio RDB double reloads
    intact and still reports the 8-byte-larger SIZE
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: reload
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
    - {command: [BF.ADD, key, hello], expect: {equals: 1}}
    - {command: [BF.INFO, key, SIZE], expect_difference: true, expect: {equals: 179960}}
    - {command: [SAVE], expect: {equals: OK}}
    - {restart: true, expect: {equals: OK}}
    - {command: [BF.INFO, key, SIZE], expect_difference: true, expect: {equals: 179960}}
    - {command: [BF.EXISTS, key, hello], expect: {equals: 1}}
    - {command: [BF.CARD, key], expect: {equals: 1}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [reload.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: reload}
