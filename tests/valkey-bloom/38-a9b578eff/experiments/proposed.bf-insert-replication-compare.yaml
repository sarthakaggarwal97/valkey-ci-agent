extends: [valkey.liveness]
id: proposed.bf-insert-replication-compare
deployment:
  modes: [standalone]
metadata:
  description: Newly-valid BF.INSERT without ITEMS replicates bloom object creation
    to a replica; replicated BF.INSERT with SEED/TIGHTENING args still applies
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: repl
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    nodes: 2
    timeout_s: 90
    commands:
    - {command: [CONFIG, SET, bf.bloom-use-random-seed, no], expect: {equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [BF.INSERT, rk], expect_difference: true, expect: {equals: []}}
    - {command: [BF.INSERT, rk2, CAPACITY, "50", ITEMS, a, b, c], expect: {equals: [
          1, 1, 1]}}
    - {command: [WAIT, "1", "5000"], expect: {equals: 1}}
    - {command: [EXISTS, rk], node: 1, wait_s: 15, expect_difference: true, expect: {
        equals: 1}}
    - {command: [BF.EXISTS, rk2, a], node: 1, expect: {equals: 1}}
    - {command: [BF.INFO, rk2, ITEMS], node: 1, expect: {equals: 3}}
    - {command: [BF.INFO, rk, CAPACITY], node: 1, expect_difference: true, expect: {
        equals: 100}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
