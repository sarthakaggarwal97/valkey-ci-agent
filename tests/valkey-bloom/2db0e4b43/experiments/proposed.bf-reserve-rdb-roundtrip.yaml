extends: [valkey.liveness]
id: proposed.bf-reserve-rdb-roundtrip
deployment:
  modes: [standalone]
metadata:
  description: Build a bloom filter, SAVE and restart, then re-read it; the change
    build must survive loading the new RDB layout (the extra expansion word written
    by the save callback and read by the load callback) without crashing or losing
    num_items
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: bf
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
    - {command: [BF.ADD, f, a], expect: {equals: 1}}
    - {command: [BF.ADD, f, b], expect: {equals: 1}}
    - {command: [BF.CARD, f], expect: {equals: 2}}
    - {command: [SAVE], expect: {equals: OK}}
    - {restart: true, expect: {equals: OK}}
    - {command: [BF.CARD, f], expect: {equals: 2}}
    - {command: [BF.EXISTS, f, a], expect: {equals: 1}}
    - {command: [BF.ADD, f, c], expect: {equals: 1}}
    - {command: [BF.CARD, f], expect: {equals: 3}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_evidence:
- {evidence_id: valkey.command.sequence, source: bf}
