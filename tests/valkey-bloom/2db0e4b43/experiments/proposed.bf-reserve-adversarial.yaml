extends: [valkey.liveness]
id: proposed.bf-reserve-adversarial
deployment:
  modes: [standalone]
metadata:
  description: BF.RESERVE with boundary and unvalidated inputs (error_rate 0.0, capacity
    at 2^31/2^32/INT64, EXPANSION 0, empty and keyword key names); each probe is followed
    by a liveness check so a module panic or OOM that kills the server shows as a
    missing reply
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: bf
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 20
    commands:
    - {command: [BF.RESERVE, z1, "0.0", "100"], expect_difference: true, expect: {
        exists: true}}
    - {command: [PING], expect: {equals: PONG}}
    - {command: [BF.RESERVE, z2, "0.0000001", "1000"], expect_difference: true, expect: {
        exists: true}}
    - {command: [PING], expect: {equals: PONG}}
    - {command: [BF.RESERVE, z3, "0.01", "4294967296", EXPANSION, "0"], expect_difference: true,
      expect: {exists: true}}
    - {command: [PING], expect: {equals: PONG}}
    - {command: [BF.RESERVE, z4, "0.01", "2147483648"], expect_difference: true, expect: {
        exists: true}}
    - {command: [PING], expect: {equals: PONG}}
    - {command: [BF.RESERVE, z5, "0.01", "9223372036854775807"], expect_difference: true,
      expect: {exists: true}}
    - {command: [PING], expect: {equals: PONG}}
    - {command: [BF.RESERVE, "", "0.01", "100"], expect_difference: true, expect: {
        exists: true}}
    - {command: [PING], expect: {equals: PONG}}
    - {command: [BF.RESERVE, fields, "0.01", "100", NONSCALING], expect_difference: true,
      expect: {exists: true}}
    - {command: [PING], expect: {equals: PONG}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_evidence:
- {evidence_id: valkey.command.sequence, source: bf}
