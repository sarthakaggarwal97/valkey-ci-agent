extends: [valkey.liveness]
id: proposed.bf-replication-compare
deployment:
  modes: [standalone]
metadata:
  description: Bloom data reaches a replica through full sync (module RDB serialization),
    and BF.ADD after the sync propagates to the replica; the handlers never call ReplicateVerbatim,
    so the propagation reads are unmarked and judged by expect alone
components:
- use: valkey.action.commands
  id: bfrepl
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    nodes: 2
    timeout_s: 120
    commands:
    - {command: [BF.ADD, f, i1], node: 0, expect: {equals: 1}}
    - {command: [BF.ADD, f, i2], node: 0, expect: {equals: 1}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 60, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [BF.EXISTS, f, i1], node: 1, expect_difference: true, expect: {equals: 1}}
    - {command: [BF.EXISTS, f, i2], node: 1, expect_difference: true, expect: {equals: 1}}
    - {command: [BF.CARD, f], node: 1, expect_difference: true, expect: {equals: 2}}
    - {command: [BF.ADD, f, i3], node: 0, expect: {equals: 1}}
    - {command: [BF.EXISTS, f, i3], node: 1, wait_s: 20, expect: {equals: 1}}
    - {command: [BF.CARD, f], node: 1, expect: {equals: 3}}
    - {command: [BF.ADD, f, i4], node: 1, expect: {error: true}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [bfrepl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: bfrepl}
