extends: [valkey.liveness]
id: proposed.bf-add-exists-card-compare
deployment:
  modes: [standalone]
metadata:
  description: BF.ADD/BF.EXISTS/BF.CARD real semantics, dedup counting, arity and
    wrong-type errors, keyspace interplay and the new bloom_max_item_size config,
    compared with the parent's stub replies
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
    cluster: {type: boolean, default: false}
components:
- use: valkey.action.commands
  id: bf
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    cluster: {$ref: inputs.cluster}
    timeout_s: 30
    commands:
    - {command: [BF.EXISTS, filt, item1], expect: {equals: 0}}
    - {command: [BF.CARD, filt], expect: {equals: 0}}
    - {command: [BF.ADD, filt, item1], expect: {equals: 1}}
    - {command: [BF.ADD, filt, item1], expect_difference: true, expect: {equals: 0}}
    - {command: [BF.EXISTS, filt, item1], expect_difference: true, expect: {equals: 1}}
    - {command: [BF.CARD, filt], expect_difference: true, expect: {equals: 1}}
    - {command: [TYPE, filt], expect_difference: true, expect: {equals: bloomtype}}
    - {command: [EXISTS, filt], expect_difference: true, expect: {equals: 1}}
    - {command: [BF.ADD, filt, item2], expect: {equals: 1}}
    - {command: [BF.CARD, filt], expect_difference: true, expect: {equals: 2}}
    - {command: [BF.ADD, filt, ""], expect: {equals: 1}}
    - {command: [BF.EXISTS, filt, ""], expect_difference: true, expect: {equals: 1}}
    - {command: [BF.CARD, filt], expect_difference: true, expect: {equals: 3}}
    - {command: [BF.ADD, filt, !!binary "AAECAwQF/w=="], expect: {equals: 1}}
    - {command: [BF.EXISTS, filt, !!binary "AAECAwQF/w=="], expect_difference: true,
      expect: {equals: 1}}
    - {command: [BF.ADD, filt], expect_difference: true, expect: {error: true}}
    - {command: [BF.ADD, filt, a, b], expect_difference: true, expect: {error: true}}
    - {command: [BF.EXISTS, filt], expect_difference: true, expect: {error: true}}
    - {command: [BF.CARD, filt, extra], expect_difference: true, expect: {error: true}}
    - {command: [SET, str, v], expect: {equals: OK}}
    - {command: [BF.ADD, str, x], expect_difference: true, expect: {error: true}}
    - {command: [BF.EXISTS, str, x], expect_difference: true, expect: {error: true}}
    - {command: [BF.CARD, str], expect_difference: true, expect: {error: true}}
    - {command: [GET, str], expect: {equals: v}}
    - {command: [DEL, filt], expect_difference: true, expect: {equals: 1}}
    - {command: [BF.EXISTS, filt, item1], expect: {equals: 0}}
    - {command: [BF.ADD, filt, item1], expect: {equals: 1}}
    - {command: [MULTI], expect: {equals: OK}}
    - {command: [BF.ADD, txn, x], expect: {equals: QUEUED}}
    - {command: [BF.EXISTS, txn, x], expect: {equals: QUEUED}}
    - {command: [EXEC], expect_difference: true, expect: {equals: [1, 1]}}
    - {command: [CONFIG, SET, bloom.bloom_max_item_size, 100], expect_difference: true,
      expect: {equals: OK}}
    - {command: [BF.ADD, small, i], expect: {equals: 1}}
    - {command: [BF.EXISTS, small, i], expect_difference: true, expect: {equals: 1}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [bf.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: bf}
