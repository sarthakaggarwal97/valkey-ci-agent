extends: [valkey.liveness]
id: proposed.bloom-restore-io-error
deployment:
  modes: [standalone]
metadata:
  description: RESTORE of a checksum-valid but malformed bloom dump is rejected as
    bad data instead of taking the server's fatal I/O-error path
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: restore
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 15
    commands:
    - {command: [BF.ADD, warm, x], expect: {equals: 1}}
    - {command: [BF.EXISTS, warm, x], expect: {equals: 1}}
    - {command: [RESTORE, invalid_restore, 0, !!binary "B4FuWiiZ+W2sAZkBAgIEexCuR+F6hT8EAAAAAAAA4D8CAQJAZAIBBcNAVkClAgF4AIAAAAcgBh/4mdiZCXk+IzsCGn9eAeBEY/aLAFAdkL0+jopziwbexSAi4AIAAIDgAgzgBwAAEOAHEOAGLAFAAeAHIOABAAAgQAoABEAEgAABAAAACwB/VWvTlbA3FA=="],
      expect_difference: true, expect: {error: "Bad data format"}}
    - {command: [EXISTS, invalid_restore], expect: {equals: 0}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [restore.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: restore}
