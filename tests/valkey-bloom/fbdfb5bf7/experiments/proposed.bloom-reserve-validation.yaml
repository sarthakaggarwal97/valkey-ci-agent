extends: [valkey.liveness]
id: proposed.bloom-reserve-validation
deployment:
  modes: [standalone]
metadata:
  description: BF.RESERVE now rejects a non-positive expansion and a capacity of 0
    that the parent accepted, and changed the capacity error message
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: reserve
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 20
    commands:
    - {command: [BF.RESERVE, r1, "0.01", notanum], expect_difference: true, expect: {
        error: "Bad capacity"}}
    - {command: [BF.RESERVE, r2, "0.01", "100", EXPANSION, "0"], expect_difference: true,
      expect: {error: "bad expansion"}}
    - {command: [BF.INFO, r2, EXPANSION], expect_difference: true, expect: {error: "not\
          \ found"}}
    - {command: [BF.RESERVE, r3, "0.01", "0"], expect_difference: true, expect: {
        error: "Bad capacity"}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_evidence:
- {evidence_id: valkey.command.sequence, source: reserve}
