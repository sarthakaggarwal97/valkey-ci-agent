extends: [valkey.liveness]
id: proposed.bloom-fp-rate-config
deployment:
  modes: [standalone]
metadata:
  description: bf.bloom-fp-rate config existence, 0.0-boundary validation, and its
    effect on created bloom objects
inputs:
  required: [module, module_parent]
  properties:
    module:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "The module build under test, {$ref: artifacts.module.path}"
    module_parent:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "The parent commit's build, {$ref: artifacts.module_parent.path}"
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: fp
  config:
    modules: [{$ref: inputs.module}]
    modules_parent: [{$ref: inputs.module_parent}]
    resp: {$ref: inputs.resp}
    timeout_s: 15
    commands:
    - {command: [CONFIG, SET, bf.bloom-use-random-seed, no], expect: {equals: OK}}
    - {command: [CONFIG, GET, bf.bloom-fp-rate], expect_difference: true, expect: {
        exists: true}}
    - {command: [BF.ADD, base, x], expect: {equals: 1}}
    - {command: [CONFIG, SET, bf.bloom-fp-rate, '0.5'], expect_difference: true, expect: {
        equals: OK}}
    - {command: [CONFIG, GET, bf.bloom-fp-rate], expect_difference: true, expect: {
        exists: true}}
    - {command: [BF.ADD, changed, x], expect: {equals: 1}}
    - {command: [DEBUG, DIGEST-VALUE, changed], expect_difference: true, expect: {
        exists: true}}
    - {command: [CONFIG, SET, bf.bloom-fp-rate, '1.1'], expect_difference: true, expect: {
        error: true}}
    - {command: [CONFIG, SET, bf.bloom-fp-rate, '0'], expect_difference: true, expect: {
        equals: OK}}
    - {command: [BF.ADD, zero, y], expect_difference: true, expect: {error: true}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_evidence:
- {evidence_id: valkey.command.sequence, source: fp}
