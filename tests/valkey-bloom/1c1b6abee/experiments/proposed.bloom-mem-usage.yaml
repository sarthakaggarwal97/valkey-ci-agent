extends: [valkey.liveness]
id: proposed.bloom-mem-usage
deployment:
  modes: [standalone]
metadata:
  description: BF.INFO SIZE and the BF.INFO Size field report the fixed per-filter
    mem_usage, compared across the change's bloom build and its parent's
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: meminfo
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 20
    commands:
    - {command: [BF.RESERVE, bigf, "0.001", "1000"], expect: {equals: OK}}
    - {command: [BF.INFO, bigf, SIZE], expect_difference: true, expect: {min: 500}}
    - {command: [BF.INFO, bigf], expect_difference: true, expect: {contains: Capacity}}
    - {command: [BF.RESERVE, tinyf, "0.5", "1"], expect: {equals: OK}}
    - {command: [BF.INFO, tinyf, SIZE], expect_difference: true, expect: {min: 1}}
    - {command: [BF.INFO, tinyf], expect_difference: true, expect: {contains: Size}}
    - {command: [BF.ADD, addf, hello], expect: {equals: 1}}
    - {command: [BF.INFO, addf, SIZE], expect_difference: true, expect: {min: 10000}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [meminfo.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: meminfo}
