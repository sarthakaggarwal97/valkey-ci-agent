extends: [valkey.liveness]
id: proposed.bf-madd-compare
deployment:
  modes: [standalone]
metadata:
  description: BF.MADD replies and filter state on new and existing keys, the changed
    empty-array error shapes, and persistence of MADD-built filters across SAVE and
    restart, compared against the parent module build
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: madd
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 60
    commands:
    - {command: [BF.MADD, filter, a, b, c], expect_difference: true, expect: {equals: [
          1, 1, 1]}}
    - {command: [BF.CARD, filter], expect_difference: true, expect: {equals: 3}}
    - {command: [BF.MEXISTS, filter, a, b, c], expect_difference: true, expect: {
        equals: [1, 1, 1]}}
    - {command: [BF.EXISTS, filter, a], expect_difference: true, expect: {equals: 1}}
    - {command: [BF.INFO, filter, ITEMS], expect_difference: true, expect: {equals: 3}}
    - {command: [BF.INFO, filter, CAPACITY], expect_difference: true, expect: {equals: 100000}}
    - {command: [BF.MADD, dup, x, x, x], expect_difference: true, expect: {equals: [
          1, 0, 0]}}
    - {command: [BF.CARD, dup], expect_difference: true, expect: {equals: 1}}
    - {command: [BF.MADD, adv, "", "", a], expect_difference: true, expect: {equals: [
          1, 0, 1]}}
    - {command: [BF.CARD, adv], expect_difference: true, expect: {equals: 2}}
    - {command: [BF.MADD, single, only], expect_difference: true, expect: {equals: [
          1]}}
    - {command: [BF.RESERVE, r, 0.01, 1000], expect: {equals: OK}}
    - {command: [BF.MADD, r, a, b], expect_difference: true, expect: {equals: [1,
          1]}}
    - {command: [BF.INFO, r, ITEMS], expect_difference: true, expect: {equals: 2}}
    - {command: [BF.ADD, f2, a], expect: {equals: 1}}
    - {command: [BF.MADD, f2, a, b], expect_difference: true, expect: {equals: [0,
          1]}}
    - {command: [BF.CARD, f2], expect_difference: true, expect: {equals: 2}}
    - {command: [BF.EXISTS, f2, a], expect_difference: true, expect: {equals: 1}}
    - {command: [BF.MEXISTS, f2, a, b], expect_difference: true, expect: {equals: [
          1, 1]}}
    - {command: [BF.ADD, f2, a, b], expect_difference: true, expect: {equals: []}}
    - {command: [BF.MADD, f2], expect_difference: true, expect: {equals: []}}
    - {command: [BF.CARD, f2, extra], expect_difference: true, expect: {equals: []}}
    - {command: [BF.INFO, f2, ITEMS, extra], expect_difference: true, expect: {equals: []}}
    - {command: [BF.RESERVE, badrate, 1.5, 100], expect_difference: true, expect: {
        equals: []}}
    - {command: [SET, str, v], expect: {equals: OK}}
    - {command: [BF.MADD, str, a, b], expect_difference: true, expect: {equals: []}}
    - {command: [BF.ADD, str, a], expect_difference: true, expect: {equals: []}}
    - {command: [BF.EXISTS, str, a], expect_difference: true, expect: {equals: []}}
    - {command: [SAVE], expect: {equals: OK}}
    - {restart: true, expect: {equals: OK}}
    - {command: [BF.CARD, filter], expect_difference: true, expect: {equals: 3}}
    - {command: [BF.MEXISTS, filter, a, b, c], expect_difference: true, expect: {
        equals: [1, 1, 1]}}
    - {command: [BF.CARD, f2], expect_difference: true, expect: {equals: 2}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [madd.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: madd}
