extends: [valkey.liveness]
id: proposed.bf-madd-replication-compare
deployment:
  modes: [standalone]
metadata:
  description: A BF.MADD-built filter reaches a replica whole through a full sync,
    and a BF.MADD sent after the sync reaches it too
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: madd-sync
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    nodes: 2
    timeout_s: 90
    commands:
    - {command: [BF.MADD, mf, a, b, c], expect_difference: true, expect: {equals: [
          1, 1, 1]}}
    - {command: [BF.ADD, af, z], expect: {equals: 1}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [BF.CARD, mf], node: 1, expect_difference: true, expect: {equals: 3}}
    - {command: [BF.MEXISTS, mf, a, b, c], node: 1, expect_difference: true, expect: {
        equals: [1, 1, 1]}}
    - {command: [BF.CARD, af], node: 1, expect: {equals: 1}}
    - {command: [BF.MADD, mf, d], expect_difference: true, expect: {equals: [1]}}
    - {command: [BF.CARD, mf], node: 1, wait_s: 15, expect_difference: true, expect: {
        equals: 4}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [madd-sync.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: madd-sync}
