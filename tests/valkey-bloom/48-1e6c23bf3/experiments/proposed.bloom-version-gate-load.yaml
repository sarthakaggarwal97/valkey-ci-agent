extends: [valkey.liveness]
id: proposed.bloom-version-gate-load
deployment:
  modes: [standalone]
metadata:
  description: valkey-bloom with the new server-version validation still initializes
    on a supported server, reloads across a restart, and answers BF commands exactly
    as the parent build does
inputs:
  required: [module, module_parent]
  properties:
    module:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "The module build under test, {$ref: artifacts.module.path}"
    module_parent:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "The parent commit's build of the module, {$ref: artifacts.module_parent.path}"
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: bloom
  config:
    modules: [{$ref: inputs.module}]
    modules_parent: [{$ref: inputs.module_parent}]
    resp: {$ref: inputs.resp}
    server_config: {save: "3600 1"}
    timeout_s: 30
    commands:
    - {command: [CONFIG, SET, bf.bloom-use-random-seed, no], expect: {equals: OK}}
    - {command: [BF.RESERVE, k, "0.001", 1000], expect: {equals: OK}}
    - {command: [BF.ADD, k, item1], expect: {equals: 1}}
    - {command: [BF.ADD, k, item1], expect: {equals: 0}}
    - {command: [BF.MADD, k, a, b, c, ""], expect: {equals: [1, 1, 1, 1]}}
    - {command: [BF.EXISTS, k, ""], expect: {equals: 1}}
    - {command: [BF.CARD, k], expect: {equals: 5}}
    - {command: [BF.INFO, k, CAPACITY], expect: {equals: 1000}}
    - {command: [BF.INSERT, scaled, CAPACITY, 2, EXPANSION, 2, ITEMS, i1, i2, i3,
        i4, i5], compare: skip}
    - {command: [BF.INFO, scaled, FILTERS], expect: {min: 2}}
    - {restart: true, expect: {equals: OK}}
    - {command: [BF.EXISTS, k, item1], expect: {equals: 1}}
    - {command: [BF.EXISTS, k, ""], expect: {equals: 1}}
    - {command: [BF.CARD, k], expect: {equals: 5}}
    - {command: [BF.INFO, k, CAPACITY], expect: {equals: 1000}}
    - {command: [BF.INFO, scaled, FILTERS], expect: {min: 2}}
    - {command: [CONFIG, GET, bf.bloom-capacity], expect: {equals: [bf.bloom-capacity,
          "100"]}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [bloom.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: bloom}
