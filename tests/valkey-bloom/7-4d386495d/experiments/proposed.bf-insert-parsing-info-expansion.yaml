extends: [valkey.liveness]
id: proposed.bf-insert-parsing-info-expansion
deployment:
  modes: [standalone]
metadata:
  description: BF.INSERT argument parsing (missing ITEMS, unknown argument, silent
    filter creation) and BF.INFO EXPANSION nil for non-scaling filters, compared across
    the two module builds
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: bf
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    resp: {$ref: inputs.resp}
    timeout_s: 30
    commands:
    - {command: [BF.INSERT, filt1, CAPACITY, '100'], expect_difference: true, expect: {
        error: "wrong number of arguments"}}
    - {command: [EXISTS, filt1], expect_difference: true, expect: {equals: 0}}
    - {command: [BF.INFO, filt1, CAPACITY], expect_difference: true, expect: {error: "not\
          \ found"}}
    - {command: [BF.INSERT, filt2, NOCREATE, NONSCALING], expect_difference: true,
      expect: {error: "wrong number of arguments"}}
    - {command: [BF.INSERT, filt3, XYZARG, ITEMS, a], expect_difference: true, expect: {
        error: "unknown argument received"}}
    - {command: [EXISTS, filt3], expect: {equals: 0}}
    - {command: [BF.INSERT, filt4, ERROR, '0.01', CAPACITY, '1000', EXPANSION, '2',
        ITEMS, a, b, c], expect: {equals: [1, 1, 1]}}
    - {command: [BF.INSERT, filt4, NOCREATE, ITEMS, d], expect: {equals: [1]}}
    - {command: [BF.INFO, filt4, EXPANSION], expect: {equals: 2}}
    - {command: [BF.INSERT, filt5, CAPACITY, '100', ITEMS], expect: {error: "wrong\
          \ number of arguments"}}
    - {command: [BF.INSERT, filt6, CAPACITY, '50', CAPACITY, '70', ITEMS, x], expect: {
        equals: [1]}}
    - {command: [BF.INFO, filt6, CAPACITY], expect: {equals: 70}}
    - {command: [BF.INSERT, filt7, CAPACITY, '4294967296', ITEMS, x], expect: {error: "bad\
          \ capacity"}}
    - {command: [BF.INSERT, filt7, CAPACITY, '0', ITEMS, x], expect: {error: "capacity\
          \ should be larger than 0"}}
    - {command: [BF.INSERT, filt7, EXPANSION, '11', ITEMS, x], expect: {error: "bad\
          \ expansion"}}
    - {command: [BF.INSERT, filt8, ERROR, '1.0', ITEMS, x], expect: {error: "error\
          \ rate range"}}
    - {command: [BF.INSERT, ITEMS, ITEMS, ITEMS], expect: {equals: [1]}}
    - {command: [BF.INSERT, filt10, ITEMS, ''], expect: {equals: [1]}}
    - {command: [BF.RESERVE, nsf, '0.001', '100', NONSCALING], expect: {equals: OK}}
    - {command: [BF.INFO, nsf, EXPANSION], expect_difference: true, expect: {exists: false}}
    - {command: [BF.INFO, nsf], expect_difference: true, expect: {exists: true}}
    - {command: [BF.INFO, nsf, WRONGVAL], expect_difference: true, expect: {error: "invalid\
          \ information value"}}
    - {command: [BF.RESERVE, sf, '0.001', '100', EXPANSION, '4'], expect: {equals: OK}}
    - {command: [BF.INFO, sf, EXPANSION], expect: {equals: 4}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [bf.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: bf}
