extends: [valkey.liveness]
id: proposed.bloom-repl-digest
deployment:
  modes: [standalone]
metadata:
  description: With a fixed seed, DEBUG DIGEST-VALUE format change (is_seed_random
    hashed in) and primary-property replication observed on primary and replica
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: digest
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    nodes: 2
    resp: {$ref: inputs.resp}
    timeout_s: 60
    server_config: {enable-debug-command: 'yes'}
    commands:
    - {command: [CONFIG, SET, bf.bloom-use-random-seed, 'no'], expect: {equals: OK}}
    - {command: [CONFIG, SET, bf.bloom-use-random-seed, 'no'], node: 1, expect: {
        equals: OK}}
    - {command: [REPLICAOF, '<node.0.host>', '<node.0.port>'], node: 1, expect: {
        equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: 'master_link_status:up'}}
    - {command: [CONFIG, SET, bf.bloom-capacity, 1000], expect: {equals: OK}}
    - {command: [CONFIG, SET, bf.bloom-expansion, 3], expect: {equals: OK}}
    - {command: [BF.ADD, key, item1], expect: {equals: 1}}
    - {command: ['BF.MADD', key, item2, item3], expect: {equals: [1, 1]}}
    - {command: [WAIT, 1, 5000], expect: {equals: 1}}
    - {command: [DEBUG, DIGEST-VALUE, key], expect_difference: true, expect: {exists: true}}
    - {command: [DEBUG, DIGEST-VALUE, key], node: 1, expect_difference: true, expect: {
        exists: true}}
    - {command: ['BF.INFO', key, CAPACITY], node: 1, expect_difference: true, expect: {
        equals: 1000}}
    - {command: ['BF.INFO', key, EXPANSION], node: 1, expect_difference: true, expect: {
        equals: 3}}
    - {command: ['BF.EXISTS', key, item2], node: 1, expect: {equals: 1}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [digest.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: digest}
