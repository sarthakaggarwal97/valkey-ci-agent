extends: [valkey.liveness]
id: proposed.bloom-defrag-metrics
deployment:
  modes: [standalone]
metadata:
  description: Active defrag over bloom objects increments the new bf_bloom_defrag_hits/misses
    INFO fields (absent on the parent); filters stay intact through defrag, SAVE,
    restart and a second defrag of RDB-loaded objects
inputs:
  properties:
    resp: {type: integer, enum: [2, 3], default: 2}
components:
- use: valkey.action.commands
  id: defrag
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    server_config: {active-defrag-ignore-bytes: "1", active-defrag-threshold-lower: "2"}
    resp: {$ref: inputs.resp}
    timeout_s: 300
    commands:
    - {command: [CONFIG, SET, bf.bloom-use-random-seed, no], expect: {equals: OK}}
    - {command: [BF.RESERVE, k00, "0.01", 8000], expect: {equals: OK}}
    - {command: [BF.MADD, k00, a, b, c, d, e], expect: {equals: [1, 1, 1, 1, 1]}}
    - {command: [BF.RESERVE, k01, "0.01", 8000], expect: {equals: OK}}
    - {command: [BF.MADD, k01, a, b, c, d, e], expect: {equals: [1, 1, 1, 1, 1]}}
