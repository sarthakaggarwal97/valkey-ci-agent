extends: [valkey.liveness]
id: proposed.bloom-seed-replication
deployment:
  modes: [standalone]
metadata:
  description: Random-seed bloom objects replicate - full sync carries the new RDB
    format with the seed, verbatim command replication gives the replica its own random
    seed, membership stays consistent
components:
- use: valkey.action.commands
  id: repl
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    nodes: 2
    server_config: {enable-debug-command: "yes"}
    timeout_s: 120
    commands:
    - {command: [CONFIG, SET, bf.bloom-use-random-seed, yes], expect_difference: true,
      expect: {equals: OK}}
    - {command: [CONFIG, SET, bf.bloom-use-random-seed, yes], node: 1, expect_difference: true,
      expect: {equals: OK}}
    - {command: [BF.RESERVE, presync, "0.001", "1000"], expect: {equals: OK}}
    - {command: [BF.MADD, presync, p1, p2, p3], expect: {equals: [1, 1, 1]}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [BF.EXISTS, presync, p1], node: 1, wait_s: 15, expect: {equals: 1}}
    - {command: [BF.CARD, presync], node: 1, expect: {equals: 3}}
    - {command: [DEBUG, DIGEST-VALUE, presync], node: 1, expect_difference: true,
      expect: {exists: true}}
    - {command: [BF.ADD, postsync, q1], expect: {equals: 1}}
    - {command: [BF.MADD, postsync, q2, q3], expect: {equals: [1, 1]}}
    - {command: [BF.EXISTS, postsync, q1], node: 1, wait_s: 15, expect: {equals: 1}}
    - {command: [BF.EXISTS, postsync, q3], node: 1, wait_s: 15, expect: {equals: 1}}
    - {command: [BF.CARD, postsync], node: 1, wait_s: 15, expect: {equals: 3}}
    - {command: [DEBUG, DIGEST-VALUE, postsync], expect_difference: true, expect: {
        exists: true}}
    - {command: [DEBUG, DIGEST-VALUE, postsync], node: 1, expect_difference: true,
      expect: {exists: true}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
