extends: [valkey.liveness]
id: proposed.bloom-partial-replication-replica-crash
deployment:
  modes: [standalone]
metadata:
  description: Partial-success BF.MADD/BF.INSERT must not replicate failing items;
    with propagation-error-behavior panic the parent build's replica crashes, the
    fixed build's replica stays healthy and consistent
components:
- use: valkey.action.commands
  id: repl
  config:
    modules: [{$ref: artifacts.module.path}]
    modules_parent: [{$ref: artifacts.module_parent.path}]
    nodes: 2
    timeout_s: 120
    commands:
    - {command: [CONFIG, SET, bf.bloom-use-random-seed, no], expect: {equals: OK}}
    - {command: [CONFIG, SET, propagation-error-behavior, panic], node: 1, expect: {
        equals: OK}}
    - {command: [REPLICAOF, <node.0.host>, <node.0.port>], node: 1, expect: {equals: OK}}
    - {command: [INFO, replication], node: 1, wait_s: 30, compare: skip, expect: {
        contains: "master_link_status:up"}}
    - {command: [BF.RESERVE, k1, "0.01", "2", NONSCALING], expect: {equals: OK}}
    - {command: [BF.ADD, k1, a1], expect: {equals: 1}}
    - {command: [BF.RESERVE, k2, "0.01", "2", NONSCALING], expect: {equals: OK}}
    - {command: [BF.ADD, k2, a2], expect: {equals: 1}}
    - {command: [BF.EXISTS, k2, a2], node: 1, wait_s: 30, expect: {equals: 1}}
    - {command: [BF.MADD, k1, b1, c1], expect_difference: true, expect: {error: "non\
          \ scaling filter is full"}}
    - {command: [BF.INFO, k1, ITEMS], expect_difference: true, expect: {equals: 1}}
    - {command: [BF.INFO, k1, ITEMS], node: 1, wait_s: 15, expect_difference: true,
      expect: {equals: 1}}
    - {command: [BF.INSERT, k2, NOCREATE, ITEMS, b2, c2], expect_difference: true,
      expect: {error: "non scaling filter is full"}}
    - {command: [BF.INFO, k2, ITEMS], expect_difference: true, expect: {equals: 1}}
    - {command: [BF.INFO, k2, ITEMS], node: 1, wait_s: 15, expect_difference: true,
      expect: {equals: 1}}
    - {command: [PING], node: 1, expect_difference: true, expect: {equals: PONG}}
    checks:
      acl: true
      concurrency: 4
      replica: true
      variants: true
required_events: [repl.completed]
required_evidence:
- {evidence_id: valkey.command.sequence, source: repl}
