    job_id: 129734399755
    job: test-sanitizer-address (clang)
    sha: 533a67f8dc2a060b9f53a3975ad6a08238e2ad45
    base_branch: "8.1"
    pr: 5075
    backport: true
    expect:
      port: c86f6ee511e1a36488feb3b8e62093e69195d332  # Free valkey-cli test hint before exiting (#5274)

