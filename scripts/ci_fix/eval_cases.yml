# Failures whose fix is known, replayed by scripts/ci_fix/eval.py to see what
# the CI fix bot prepares for them. Nothing is published.
#
# Each case is one exact failed job. `expect` names its fix: `port` is the
# upstream commit a backport branch should take; `pull` is the pull request a
# person wrote (merged or still open). `gap` says what the bot lacks for a
# case, so that its result is read with that in mind.
#
# A case on the default branch is replayed as of its failed commit, so the fix
# that landed later is not there to find. A backport case sees the default
# branch as it is now, which is where its port comes from.
#
# A case lasts as long as GitHub keeps its job log (90 days); `plan` says so
# when one has aged out.
cases:
