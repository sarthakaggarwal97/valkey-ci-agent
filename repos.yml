# Backport registry: one entry per repository, one `branches` row per release
# line. A row maps a release branch to its GitHub Project, the board whose
# "To be backported" column feeds the daily sweep.
#
# New release line: add a row at the end of that repository's `branches` list.
# For valkey-io/valkey this happens automatically when X.Y.0 is published: the
# onboarding workflow opens a PR adding the row. Release workflows read their
# branch list from release_policy.yml, which is edited separately.
#
# Omitted settings use their defaults (see scripts/backport/registry.py).
# Keep `branches` last in each entry; onboarding appends rows to it.

repos:
  - repo: valkey-io/valkey
    project_owner: valkey-io
    language: c
    repair_validation_failures: true
    automatic_ci_followup: true

    validation_profile: valkey-core
    validation_setup_commands:
      # clang-format-18 comes from apt.llvm.org, as in upstream clang-format.yml:
      # Ubuntu's 18.1.3 disagrees with upstream's 18.1.8 on braced initializers
      # in macros and rejects lines the branch already has.
      - "wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo tee /usr/share/keyrings/llvm-toolchain.gpg > /dev/null && echo \"deb [signed-by=/usr/share/keyrings/llvm-toolchain.gpg] http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-18 main\" | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null"
      # gtest/gmock: src/unit/Makefile resolves both through pkg-config.
      # tcl-tls: without it tests/unit/tls.tcl silently skips its whole body.
      - "sudo apt-get update && sudo apt-get install -y clang-format-18 libssl-dev libgtest-dev libgmock-dev tcl8.6 tclx tcl-tls"
      - "python3 -m pip install -r utils/req-res-validator/requirements.txt"
      # TLS test certificates, written to the gitignored tests/tls/.
      - "./utils/gen-test-certs.sh"
    build_commands:
      - "make -j$(nproc) BUILD_TLS=yes"
    generated_file_rules:
      - paths:
          - "src/unit/*.c"
          - "utils/generate-unit-test-header.py"
        command: "python3 utils/generate-unit-test-header.py"
        outputs:
          - "src/unit/test_files.h"

    # Actions jobs whose failure never blocks a backport PR. DCO and Codecov
    # report as app check runs, not workflow jobs, so their patterns are only
    # a guard; the rest are daily.yml aggregators and the coverage upload.
    ci_followup_ignored_jobs:
      - "*dco*"
      - "*developer certificate of origin*"
      - "consolidate-test-failures*"
      - "notify-about-job-results*"
      - "code-coverage*"

    branches:
      - branch: "7.2"
        project_number: 1
      - branch: "8.0"
        project_number: 2
      - branch: "8.1"
        project_number: 14
      - branch: "9.0"
        project_number: 18
      - branch: "9.1"
        project_number: 41
      - branch: "9.2"
        project_number: 51

  - repo: valkey-io/valkey-search
    project_owner: valkey-io
    language: c++
    repair_validation_failures: true

    # Build inside the upstream devcontainer image because release branches
    # depend on its system packages; --privileged mirrors upstream CI.
    validation_setup_commands:
      - "docker build -t valkey-search-backport -f .devcontainer/Dockerfile ."
    build_commands:
      - "docker run --privileged --rm -v \"$(pwd):/workspace\" --user \"ubuntu:ubuntu\" valkey-search-backport sudo ci/build_ubuntu.sh"
    test_path_patterns:
      - "testing/*.cc"
      - "vmsdk/testing/*.cc"
      - "integration/test_*.py"

    branches:
      - branch: "1.0"
        project_number: 36
      - branch: "1.1"
        project_number: 34
      - branch: "1.2"
        project_number: 58
