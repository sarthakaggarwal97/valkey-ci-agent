# Fork policy registry: used automatically when the release workflows run in
# a fork (repository owner != valkey-io), so live testing never targets
# valkey-io repositories or requires the App. Authorization uses the explicit
# user: form because a personal fork has no organization teams.
#
# Downstream repos point at same-owner forks; ones that do not exist simply
# report verification errors, which is expected. Public-endpoint fields
# follow one rule so a fork E2E can never false-VERIFY artifacts it did not
# produce: each either names a FORK-OWNED namespace (ghcr_image_repo points
# at the fork owner's GHCR namespace, which only the fork's own builds can
# populate) or is EMPTY where no fork-owned equivalent exists (Docker Hub,
# ECR Public, download.valkey.io, and the valkey.io helm index are upstream
# properties). An empty endpoint renders on the tracker as "Not configured
# for this repository": informational, never VERIFIED, and it never fails
# or blocks the release.
schema_version: 1
repos:
  - repo: sarthakaggarwal97/valkey
    authorized_team: user:sarthakaggarwal97
    checks_workflow: ci.yml
    branches:
      - "7.2"
      - "8.0"
      - "8.1"
      - "9.0"
      - "9.1"
    required_checks:
      # The full ci.yml job set present on every supported release branch
      # (7.2 through 9.1): displayed on the tracker for the candidate SHA.
      # Informational only; the release gates on qualification.
      - test-ubuntu-latest
      - test-sanitizer-address
      - build-32bit
      - build-macos-latest
      - build-debian-old
      - build-libc-malloc
      - build-almalinux8-jemalloc
    check_timeout_minutes: 360
    # daily_workflow / daily_max_age_hours omitted: forks have no scheduled daily runs, so the daily-CI gate is unconfigured.
    downstream:
      automation_repo: sarthakaggarwal97/valkey-release-automation
      build_workflow: build-release.yml
      qualification_workflow: qualify-release.yml
      qualification_x86_archive_jobs: 2
      qualification_arm_archive_jobs: 2
      qualification_rpm_jobs: 30
      qualification_deb_jobs: 10
      # No fork-owned download server exists; empty = not configured.
      downloads_base_url: ""
      tarball_targets:
        - jammy/x86_64
        - noble/x86_64
        - jammy/arm64
        - noble/arm64
      hashes_repo: sarthakaggarwal97/valkey-hashes
      container_repo: sarthakaggarwal97/valkey-container
      doc_repo: sarthakaggarwal97/valkey-doc
      website_repo: sarthakaggarwal97/valkey-io.github.io
      bundle_repo: sarthakaggarwal97/valkey-bundle
      helm_repo: sarthakaggarwal97/valkey-helm
      # No fork-owned Docker Hub or ECR Public namespace exists; empty =
      # not configured (never probe upstream's real registries from a fork).
      dockerhub_repo: ""
      bundle_dockerhub_repo: ""
      # GHCR namespaces mirror GitHub ownership, so this one IS fork-owned:
      # only the fork's own builds can publish under it.
      ghcr_image_repo: sarthakaggarwal97/valkey
      ecr_namespace: ""
      # The public chart index lives on valkey.io (upstream property);
      # empty = not configured for the fork.
      helm_index_url: ""
