name: Refresh Release Progress
run-name: Refresh active release dashboards

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_run:
    workflows: [Prepare Release, Publish Release]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: release-progress
  cancel-in-progress: false

jobs:
  sync:
    name: Refresh dashboards and continue merged releases
    if: github.repository == 'sarthakaggarwal97/valkey-ci-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-control
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: ./.github/actions/setup-agent

      - name: Refresh progress
        env:
          TARGET_GITHUB_TOKEN: ${{ secrets.VALKEY_GITHUB_TOKEN }}
          AGENT_GITHUB_TOKEN: ${{ github.token }}
          AUTOMATION_GITHUB_TOKEN: ${{ secrets.VALKEY_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$TARGET_GITHUB_TOKEN" && -n "$AUTOMATION_GITHUB_TOKEN" ]] || {
            echo "VALKEY_GITHUB_TOKEN is required for fork E2E" >&2
            exit 1
          }
          python -m scripts.release.tracker sync \
            --target-repo sarthakaggarwal97/valkey \
            --agent-repo sarthakaggarwal97/valkey-ci-agent \
            --automation-repo sarthakaggarwal97/valkey-release-automation
