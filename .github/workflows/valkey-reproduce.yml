name: Reproduce a Valkey CI job

# Runs one job of Valkey's Daily or CI workflow, as that branch defines it,
# with only the chosen tests: for example branch=unstable, workflow=daily,
# job=test-sanitizer-address, test_args=--single unit/type/incr --only 'INCREX BYFLOAT overflow' --loops 20.
# It uses the callable copies in valkey-copy-*.yml and needs no secrets.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "unstable or a release branch (9.2, 8.1, ...)"
        required: true
        default: unstable
      workflow:
        description: "daily or ci"
        required: true
        type: choice
        options: [daily, ci]
        default: daily
      job:
        description: "Job id, as in the workflow file (e.g. test-valgrind-test)"
        required: true
      test_args:
        description: "runtest arguments, e.g. --single unit/type/incr --only 'name' --loops 20 --fastfail"
        required: false
        default: ""
      valgrind_test:
        description: "For valgrind jobs: the one test file to run (e.g. unit/type/incr)"
        required: false
        default: ""
      skiptests:
        description: "Suites to skip (valkey,modules,sentinel,cluster,unittest,large-memory)"
        required: false
        default: "modules,sentinel,cluster,unittest,large-memory"
      accurate:
        description: "Pass --accurate, as scheduled runs do"
        type: boolean
        default: true
      use_git_ref:
        description: "Branch or commit to test (default: the branch above)"
        required: false
        default: ""

permissions: {}

jobs:
  reproduce:
    name: "Reproduce ${{ inputs.job }} on ${{ inputs.branch }}"
    permissions:
      contents: read
      # Asked for by the copies' fix mode, which a reproduction never runs.
      id-token: write
    uses: ./.github/workflows/valkey-copy-job.yml
    with:
      branch: ${{ inputs.branch }}
      workflow: ${{ inputs.workflow }}
      job: ${{ inputs.job }}
      use_git_ref: ${{ inputs.use_git_ref || inputs.branch }}
      test_args: ${{ inputs.test_args }}
      valgrind_test: ${{ inputs.valgrind_test }}
      skiptests: ${{ inputs.skiptests }}
      accurate: ${{ inputs.accurate }}
