    - name: Build libbacktrace
      run: |
        dnf -y install epel-release gcc gcc-c++ make procps-ng which git cmake
        cd libbacktrace && ./configure && make && make install
    - name: Checkout Valkey
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: ${{ inputs.use_repo }}
        ref: ${{ inputs.use_git_ref }}
    - name: make
      run: make -j4 SERVER_CFLAGS='-Werror' USE_LIBBACKTRACE=yes
    if: inputs.job == 'build-almalinux8-jemalloc'
    timeout-minutes: 180
  format-yaml:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: ${{ inputs.use_repo }}
        ref: ${{ inputs.use_git_ref }}
    - name: Set up Go
      uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
      with:
        go-version: 1.22.4
    - name: Setup YAML formatter
      run: |
        go install github.com/google/yamlfmt/cmd/yamlfmt@v0.21.0
    - name: Run yamlfmt
      id: yamlfmt
      run: |
        yamlfmt -lint -conf .config/format.yml .
        # Capture the diff output
        DIFF=$(git diff)
        if [ ! -z "$DIFF" ]; then
          # Encode the diff in Base64 to ensure it's handled as a single line
          ENCODED_DIFF=$(echo "$DIFF" | base64 -w 0)
          echo "diff=$ENCODED_DIFF" >> $GITHUB_OUTPUT
        fi
      shell: bash
    - name: Check for formatting changes
      if: ${{ steps.yamlfmt.outputs.diff }}
      run: |
        echo "ERROR: YAML file is not formatted properly. Here is the diff: "
        # Decode the Base64 diff to display it
        echo "${{ steps.clang-format.outputs.diff }}" | base64 --decode
        exit 1
      shell: bash
    if: inputs.job == 'format-yaml'
    timeout-minutes: 180
