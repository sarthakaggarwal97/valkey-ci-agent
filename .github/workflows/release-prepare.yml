name: Prepare Release
run-name: "Prepare ${{ inputs.intent }} release on ${{ inputs.branch }}"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Release line, e.g. 9.1"
        required: true
        type: string
      intent:
        description: "Release kind"
        required: true
        type: choice
        options: [rc, ga, patch]
      urgency:
        description: "Upgrade urgency"
        required: true
        type: choice
        options: [LOW, MODERATE, HIGH, CRITICAL, SECURITY]
      security_fixes:
        description: "Security Fixes entries, separated by ;; (needed when a PR names a CVE)"
        required: false
        type: string
        default: ""
      date:
        description: "Release date YYYY-MM-DD; empty dates the notes today (UTC)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Derive and display the release without opening a PR"
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-prepare-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  derive:
    name: Authorize and derive release
    # The dispatching maintainer is authorized directly: prepare verifies the
    # triggering actor against the policy's authorized teams live, so there is no
    # forwarded-identity input to spoof and no relay workflow to trust.
    if: github.repository == 'sarthakaggarwal97/valkey-ci-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-control
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      stage: ${{ steps.release.outputs.stage }}
      tag: ${{ steps.release.outputs.tag }}
      actor: ${{ steps.release.outputs.actor }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: ./.github/actions/setup-agent

      - name: Create read-only control token
        id: token
        # REHEARSAL: the PAT stands in for the App token. Production requests:
        #   owner: valkey-io; repositories: valkey; permission-contents: read; permission-members: read; permission-metadata: read
        shell: bash
        env:
          PAT: ${{ secrets.REHEARSAL_PAT }}
        run: |
          echo '::notice title=App token scope (production)::owner: valkey-io; repositories: valkey; permission-contents: read; permission-members: read; permission-metadata: read'
          echo "token=${PAT}" >> "$GITHUB_OUTPUT"
          echo "app-slug=sarthakaggarwal97" >> "$GITHUB_OUTPUT"

      - name: Derive release identity
        id: release
        env:
          RELEASE_GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          BRANCH: ${{ inputs.branch }}
          INTENT: ${{ inputs.intent }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          python -m scripts.release.main prepare \
            --branch "$BRANCH" --intent "$INTENT" --actor "$ACTOR"
          # Written only after prepare succeeds, so downstream jobs receive
          # the identity this job actually authorized. A "re-run failed jobs"
          # by a different actor keeps the originally authorized owner.
          echo "actor=$ACTOR" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          TAG: ${{ steps.release.outputs.tag }}
          BRANCH: ${{ inputs.branch }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "## Release preparation"
            echo
            echo "- Release: \`$TAG\`"
            echo "- Branch: \`$BRANCH\`"
            echo "- Dry run: \`$DRY_RUN\`"
          } >> "$GITHUB_STEP_SUMMARY"

  cut-notes:
    name: Open release preparation PR
    needs: derive
    if: ${{ inputs.dry_run != true }}
    permissions:
      contents: read
      id-token: write
      # The cut starts the PR's review watcher in this repository.
      actions: write
    uses: ./.github/workflows/release-notes-cut.yml
    secrets: inherit
    with:
      version: ${{ needs.derive.outputs.version }}
      stage: ${{ needs.derive.outputs.stage }}
      urgency: ${{ inputs.urgency }}
      security_fixes: ${{ inputs.security_fixes }}
      date: ${{ inputs.date }}
      release_owner: ${{ needs.derive.outputs.actor }}
      # A release opened by Prepare is never held as a draft: the flagged
      # items lead the PR body instead, and the tracking issue's next step
      # points the release owner at them before the merge.
      force_ready: true
      dry_run: false

  tracker:
    name: Open release dashboard
    needs: derive
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-control
    permissions:
      contents: read
    outputs:
      issue_url: ${{ steps.tracker.outputs.issue_url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: ./.github/actions/setup-agent

      - name: Create dashboard token
        id: token
        # REHEARSAL: the PAT stands in for the App token. Production requests:
        #   owner: valkey-io; repositories: valkey; permission-issues: write; permission-metadata: read
        shell: bash
        env:
          PAT: ${{ secrets.REHEARSAL_PAT }}
        run: |
          echo '::notice title=App token scope (production)::owner: valkey-io; repositories: valkey; permission-issues: write; permission-metadata: read'
          echo "token=${PAT}" >> "$GITHUB_OUTPUT"
          echo "app-slug=sarthakaggarwal97" >> "$GITHUB_OUTPUT"

      - name: Create or refresh release dashboard
        id: tracker
        env:
          TARGET_GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          BRANCH: ${{ inputs.branch }}
          VERSION: ${{ needs.derive.outputs.version }}
          STAGE: ${{ needs.derive.outputs.stage }}
          TAG: ${{ needs.derive.outputs.tag }}
        run: |
          python -m scripts.release.tracker ensure \
            --repo sarthakaggarwal97/valkey --branch "$BRANCH" \
            --version "$VERSION" --stage "$STAGE" --tag "$TAG" \
            --prep-branch "agent/release-cut/${VERSION}-${STAGE}" \
            --prepare-run-id "$GITHUB_RUN_ID" --agent-repo "$GITHUB_REPOSITORY"

      - name: Link release dashboard
        env:
          ISSUE_URL: ${{ steps.tracker.outputs.issue_url }}
          TAG: ${{ needs.derive.outputs.tag }}
        run: |
          {
            echo "## Maintainer release dashboard"
            echo
            echo "Track **$TAG** at $ISSUE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
