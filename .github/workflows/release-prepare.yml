name: Prepare Release
run-name: "Prepare ${{ github.event.client_payload.intent || inputs.intent }} release on ${{ github.event.client_payload.branch || inputs.branch }}"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Release line, e.g. 9.1"
        required: true
        type: string
      intent:
        description: "Release kind"
        required: true
        type: choice
        options: [rc, ga, patch]
      urgency:
        description: "Upgrade urgency"
        required: true
        type: choice
        options: [LOW, MODERATE, HIGH, CRITICAL, SECURITY]
      dry_run:
        description: "Derive and display the release without opening a PR"
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [release-prepare]

permissions: {}

jobs:
  derive:
    name: Authorize and derive release
    if: github.repository == 'sarthakaggarwal97/valkey-ci-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-control
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      stage: ${{ steps.release.outputs.stage }}
      tag: ${{ steps.release.outputs.tag }}
      branch: ${{ steps.release.outputs.branch }}
      urgency: ${{ steps.release.outputs.urgency }}
      dry_run: ${{ steps.release.outputs.dry_run }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: ./.github/actions/setup-agent

      - name: Derive release identity
        id: release
        env:
          RELEASE_GITHUB_TOKEN: ${{ secrets.VALKEY_GITHUB_TOKEN }}
          BRANCH: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.branch || inputs.branch }}
          INTENT: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.intent || inputs.intent }}
          URGENCY: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.urgency || inputs.urgency }}
          DRY_RUN: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.dry_run == true && 'true' || github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          ACTOR: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.actor || github.triggering_actor }}
          POLICY: release_policy.e2e.yml
        run: |
          set -euo pipefail
          [[ -n "$RELEASE_GITHUB_TOKEN" ]] || {
            echo "VALKEY_GITHUB_TOKEN is required for fork E2E" >&2
            exit 1
          }
          python -m scripts.release.main --policy "$POLICY" prepare \
            --branch "$BRANCH" --intent "$INTENT" --actor "$ACTOR"
          {
            echo "branch=$BRANCH"
            echo "urgency=$URGENCY"
            echo "dry_run=$DRY_RUN"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          TAG: ${{ steps.release.outputs.tag }}
          BRANCH: ${{ steps.release.outputs.branch }}
          DRY_RUN: ${{ steps.release.outputs.dry_run }}
        run: |
          {
            echo "## Release preparation"
            echo
            echo "- Release: \`$TAG\`"
            echo "- Branch: \`$BRANCH\`"
            echo "- Dry run: \`$DRY_RUN\`"
          } >> "$GITHUB_STEP_SUMMARY"

  cut-notes:
    name: Open release preparation PR
    needs: derive
    if: needs.derive.outputs.dry_run != 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-notes-cut.yml
    with:
      version: ${{ needs.derive.outputs.version }}
      stage: ${{ needs.derive.outputs.stage }}
      urgency: ${{ needs.derive.outputs.urgency }}
      dry_run: false
    secrets: inherit

  tracker:
    name: Open release dashboard
    needs: derive
    if: needs.derive.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-control
    permissions:
      contents: read
    outputs:
      issue_url: ${{ steps.tracker.outputs.issue_url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: ./.github/actions/setup-agent

      - name: Create or refresh release dashboard
        id: tracker
        env:
          TARGET_GITHUB_TOKEN: ${{ secrets.VALKEY_GITHUB_TOKEN }}
          BRANCH: ${{ needs.derive.outputs.branch }}
          VERSION: ${{ needs.derive.outputs.version }}
          STAGE: ${{ needs.derive.outputs.stage }}
          TAG: ${{ needs.derive.outputs.tag }}
        run: |
          set -euo pipefail
          [[ -n "$TARGET_GITHUB_TOKEN" ]] || {
            echo "VALKEY_GITHUB_TOKEN is required for fork E2E" >&2
            exit 1
          }
          python -m scripts.release.tracker ensure \
            --repo sarthakaggarwal97/valkey --branch "$BRANCH" \
            --version "$VERSION" --stage "$STAGE" --tag "$TAG" \
            --prep-branch "agent/release-cut/${VERSION}-${STAGE}" \
            --prepare-run-id "$GITHUB_RUN_ID" --agent-repo "$GITHUB_REPOSITORY"

      - name: Link release dashboard
        env:
          ISSUE_URL: ${{ steps.tracker.outputs.issue_url }}
          TAG: ${{ needs.derive.outputs.tag }}
        run: |
          {
            echo "## Maintainer release dashboard"
            echo
            echo "Track **$TAG** at $ISSUE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
