name: Factory Dispatch

# Starts factory.yml once per open issue labelled needs-agent-fix that is
# worth an attempt, keeping at most max_runs of those runs active at once
# (scripts/factory/dispatch.py). It only reads valkey-io/valkey; each
# dispatched run handles one issue.
#
# The schedule runs only while the FACTORY_STEP repository variable is
# "comment" or "draft-pr": unset or "off" is the kill switch. At draft-pr the
# dispatcher also stops when FACTORY_MAX_OPEN_PRS of the bot's pull requests
# are open, when the last three were closed without merging, or when one was
# reverted, until someone has looked at why.
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      max_runs:
        description: "Most factory runs active at once (empty = FACTORY_MAX_RUNS, else 1)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "List what would be dispatched without dispatching"
        required: false
        type: boolean
        default: true

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dispatch:
    name: "Dispatch labelled issue fixes"
    if: >-
      github.repository == 'sarthakaggarwal97/valkey-ci-agent'
      && (github.event_name == 'workflow_dispatch' || vars.FACTORY_STEP == 'comment' || vars.FACTORY_STEP == 'draft-pr')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: factory-dispatch
      cancel-in-progress: false
    permissions:
      contents: read
      # Lists and dispatches factory.yml runs in this repository.
      actions: write
    steps:
      - name: Check out agent repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up agent dependencies
        uses: ./.github/actions/setup-agent

      - name: Generate target repository token
        id: target-token
        # Fork test only, do not merge: the PAT stands in for the App token.
        shell: bash
        env:
          PAT: ${{ secrets.REHEARSAL_PAT }}
        run: echo "token=${PAT}" >> "$GITHUB_OUTPUT"

      - name: Dispatch
        shell: bash
        env:
          TARGET_TOKEN: ${{ steps.target-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          E2E_BOT_LOGIN: sarthakaggarwal97  # Fork test only: the PAT's user stands in for the bot
          MAX_RUNS: ${{ inputs.max_runs || vars.FACTORY_MAX_RUNS || '1' }}
          MAX_OPEN_PRS: ${{ vars.FACTORY_MAX_OPEN_PRS || '5' }}
          # Which step the bot is at; a manual run of a switched-off bot reads it as comment.
          STEP: ${{ vars.FACTORY_STEP == 'draft-pr' && 'draft-pr' || 'comment' }}
          # A scheduled run has no inputs and dispatches for real.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--repo sarthakaggarwal97/valkey --max-runs "${MAX_RUNS}" --max-open-prs "${MAX_OPEN_PRS}" --step "${STEP}")
          if [[ "${DRY_RUN}" == "true" ]]; then
            args+=(--dry-run)
          fi
          python -m scripts.factory.dispatch "${args[@]}" > dispatch.json
          cat dispatch.json
          { echo '```json'; cat dispatch.json; echo '```'; } >> "${GITHUB_STEP_SUMMARY}"
