name: CI Fix Run

# One CI fix, whichever front door asked for it: a Test Failure Detector issue
# (ci-fix-issues.yml), a maintainer's command on a PR (ci-fix.yml), or a
# bot-owned PR's red head (backport-ci-followup.yml).
#
#   plan -> fix-in-job | fix-local -> publish
#
# plan binds the request to one exact failed job, and resolves that job from
# its workflow file at the failed commit (scripts/ci_fix/run.py,
# scripts/ci_fix/ci_job.py). Supported Ubuntu and macOS host jobs run on their
# own runner. Trusted code installs a fixed dependency set, then the target
# workflow's sanitized setup runs as a disposable, uncredentialed account.
# The agent reproduces the failure, fixes it and verifies the fix with the
# job's own build and test commands (scripts/ci_fix/job.sh). Containers and
# setup outside the code-owned profile fall back to the bot's runner
# (fix-local). No target-repository token is passed to setup or model
# processes; plan and publish do the GitHub work with separate App tokens.
on:
  workflow_call:
    inputs:
      front_door:
        description: "issue, pr or follow-up (scripts/ci_fix/models.py FrontDoor)"
        required: true
        type: string
      request:
        description: "The front door's request, as JSON"
        required: true
        type: string
      key:
        description: "Names this fix's artifacts apart from the other fixes in the run"
        required: true
        type: string
      target_owner:
        type: string
        default: valkey-io
      target_repo:
        type: string
        default: valkey
    secrets:
      VALKEYRIE_BOT_APP_ID:
        required: true
      VALKEYRIE_BOT_PRIVATE_KEY:
        required: true
      AWS_ROLE_ARN:
        required: true

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  plan:
    name: "Plan the fix (${{ inputs.key }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      job: ${{ steps.plan.outputs.job }}
      runs_on: ${{ steps.plan.outputs.runs_on }}
      container: ${{ steps.plan.outputs.container }}
      timeout_minutes: ${{ steps.plan.outputs.timeout_minutes }}
      use_repo: ${{ steps.plan.outputs.use_repo }}
      use_git_ref: ${{ steps.plan.outputs.use_git_ref }}
      extra_repository: ${{ steps.plan.outputs.extra_repository }}
      extra_ref: ${{ steps.plan.outputs.extra_ref }}
      extra_path: ${{ steps.plan.outputs.extra_path }}
      ci_changes: ${{ steps.plan.outputs.ci_changes }}
    steps:
      - name: Check out agent repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up agent dependencies
        uses: ./.github/actions/setup-agent

      - name: Generate target repository token
        id: target-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
          private-key: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
          owner: ${{ inputs.target_owner }}
          repositories: ${{ inputs.target_repo }}
          # The plan reads the PR, the run, its log and the workflow file,
          # and answers on the PR or the issue: it writes nothing else.
          permission-members: read
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read
          permission-issues: write
          permission-metadata: read

      - name: Validate the request and plan its fix
        id: plan
        shell: bash
        env:
          TARGET_TOKEN: ${{ steps.target-token.outputs.token }}
          FRONT_DOOR: ${{ inputs.front_door }}
          REQUEST: ${{ inputs.request }}
        run: |
          python -m scripts.ci_fix.run plan --front-door "${FRONT_DOOR}" \
            --request "${REQUEST}" --out ci-fix-plan

      - name: Upload the plan
        if: hashFiles('ci-fix-plan/plan.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-fix-plan-${{ inputs.key }}
          path: ci-fix-plan/
          retention-days: 30
          # A re-run of this run replaces it: an artifact name is unique per run.
          overwrite: true

  # A supported failed host job, on its own runner. Container jobs and host
  # setup outside the code-owned profile are planned as fix-local.
  fix-in-job:
    name: "Fix in ${{ needs.plan.outputs.job }}"
    needs: plan
    if: needs.plan.outputs.mode == 'job' && needs.plan.outputs.container == ''
    runs-on: ${{ needs.plan.outputs.runs_on }}
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout_minutes) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 'CI fix: download the plan'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: ci-fix-plan-${{ inputs.key }}
          path: ${{ runner.temp }}/ci-fix-plan
      - name: 'CI fix: check out the agent'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .ci-fix-agent
          persist-credentials: false
      - name: 'CI fix: set up the agent'
        uses: ./.ci-fix-agent/.github/actions/setup-agent
        with:
          path: .ci-fix-agent
          install-claude: 'true'
      - name: 'CI fix: create the isolated checkout'
        shell: bash
        run: |
          cd .ci-fix-agent
          python -m scripts.ci_fix.prepare_job_workspace \
            create --plan "${RUNNER_TEMP}/ci-fix-plan" \
            --state-file "${RUNNER_TEMP}/ci-fix-sandbox-state"
      - name: 'CI fix: install code-owned target dependencies'
        shell: bash
        run: bash .ci-fix-agent/scripts/ci_fix/bootstrap-job.sh
      - name: 'CI fix: run the job setup without credentials'
        shell: bash
        run: bash .ci-fix-agent/scripts/ci_fix/replay-job-setup.sh
      - name: 'CI fix: seal the checkout before credentials'
        shell: bash
        run: bash .ci-fix-agent/scripts/ci_fix/job.sh prepare
      - name: 'CI fix: configure AWS credentials'
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: ci-fix-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-duration-seconds: 4500
      - name: 'CI fix: prepare the fix in this job'
        shell: bash
        env:
          # Reassert every security-sensitive value after the target setup.
          CI_AGENT_CLAUDE_MODEL: ${{ vars.CI_AGENT_CLAUDE_MODEL }}
          BASH_ENV: ""
          ENV: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
          NODE_OPTIONS: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
        run: bash "${RUNNER_TEMP}/ci-fix-control/job.sh" run
      - name: 'CI fix: clean up the isolated account'
        if: always()
        shell: bash
        run: |
          if [[ -x "${RUNNER_TEMP}/ci-fix-control/job.sh" ]]; then
            bash "${RUNNER_TEMP}/ci-fix-control/job.sh" cleanup
          elif [[ -x .ci-fix-agent/scripts/ci_fix/job.sh ]]; then
            bash .ci-fix-agent/scripts/ci_fix/job.sh cleanup
          fi
      - name: 'CI fix: upload the result'
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-fix-result-${{ inputs.key }}
          path: ${{ runner.temp }}/ci-fix-out/
          if-no-files-found: ignore
          retention-days: 30
          overwrite: true

  fix-local:
    name: "Fix on the bot's runner"
    needs: plan
    if: needs.plan.outputs.mode == 'local'
    runs-on: ubuntu-24.04
    # Includes dependency install and preflight before the 75-minute model
    # credential session begins, plus cleanup and result upload afterwards.
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 'CI fix: download the plan'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: ci-fix-plan-${{ inputs.key }}
          path: ${{ runner.temp }}/ci-fix-plan
      - name: 'CI fix: check out the agent'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .ci-fix-agent
          persist-credentials: false
      - name: 'CI fix: set up the agent'
        uses: ./.ci-fix-agent/.github/actions/setup-agent
        with:
          path: .ci-fix-agent
          install-claude: 'true'
      - name: 'CI fix: create the isolated checkout'
        shell: bash
        run: |
          cd .ci-fix-agent
          python -m scripts.ci_fix.prepare_job_workspace \
            create --plan "${RUNNER_TEMP}/ci-fix-plan" \
            --state-file "${RUNNER_TEMP}/ci-fix-sandbox-state"
      - name: 'CI fix: install code-owned target dependencies'
        shell: bash
        run: bash .ci-fix-agent/scripts/ci_fix/bootstrap-job.sh
      - name: 'CI fix: seal the checkout before credentials'
        shell: bash
        run: bash .ci-fix-agent/scripts/ci_fix/job.sh prepare
      - name: 'CI fix: configure AWS credentials'
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: ci-fix-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-duration-seconds: 4500
      - name: 'CI fix: prepare the fix in this job'
        shell: bash
        env:
          CI_AGENT_CLAUDE_MODEL: ${{ vars.CI_AGENT_CLAUDE_MODEL }}
          BASH_ENV: ""
          ENV: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
          NODE_OPTIONS: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
        run: bash "${RUNNER_TEMP}/ci-fix-control/job.sh" run
      - name: 'CI fix: clean up the isolated account'
        if: always()
        shell: bash
        run: |
          if [[ -x "${RUNNER_TEMP}/ci-fix-control/job.sh" ]]; then
            bash "${RUNNER_TEMP}/ci-fix-control/job.sh" cleanup
          elif [[ -x .ci-fix-agent/scripts/ci_fix/job.sh ]]; then
            bash .ci-fix-agent/scripts/ci_fix/job.sh cleanup
          fi
      - name: 'CI fix: upload the result'
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-fix-result-${{ inputs.key }}
          path: ${{ runner.temp }}/ci-fix-out/
          if-no-files-found: ignore
          retention-days: 30
          overwrite: true

  publish:
    name: "Publish the fix (${{ inputs.key }})"
    needs: [plan, fix-in-job, fix-local]
    if: always() && needs.plan.result == 'success' && (needs.plan.outputs.mode == 'job' || needs.plan.outputs.mode == 'local')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out agent repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up agent dependencies
        uses: ./.github/actions/setup-agent

      - name: Download the plan
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: ci-fix-plan-${{ inputs.key }}
          path: ci-fix-plan

      - name: Download the fix
        # A fix job that crashed uploaded nothing; publish reports that.
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: ci-fix-result-${{ inputs.key }}
          path: ci-fix-result

      - name: Select the publication token scope
        id: publication-scope
        shell: bash
        run: |
          python -m scripts.ci_fix.run publication-scope \
            --plan ci-fix-plan --outcome ci-fix-result

      - name: Generate target repository token
        id: target-token
        if: needs.plan.outputs.ci_changes != 'true' || steps.publication-scope.outputs.workflows != 'true'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
          private-key: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
          owner: ${{ inputs.target_owner }}
          repositories: ${{ inputs.target_repo }}
          permission-actions: read
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-metadata: read

      # Only an exact CI change already merged on the trusted default branch
      # may be ported to a bot-owned backport branch
      # (scripts/ci_fix/policy.py allows_ci_changes). Model-authored patches
      # are comment-only; only this validated port path gets workflows:write.
      - name: Generate target repository token with workflows
        id: ci-token
        if: needs.plan.outputs.ci_changes == 'true' && steps.publication-scope.outputs.workflows == 'true'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
          private-key: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
          owner: ${{ inputs.target_owner }}
          repositories: ${{ inputs.target_repo }}
          permission-actions: read
          permission-contents: write
          permission-workflows: write
          permission-pull-requests: write
          permission-issues: write
          permission-metadata: read

      - name: Publish the fix and report it
        shell: bash
        env:
          TARGET_TOKEN: ${{ steps.ci-token.outputs.token || steps.target-token.outputs.token }}
          # A detector issue's fix: a patch commented on the issue (the
          # default), or 'draft-pr' (scripts/ci_fix/models.py IssuePublication).
          CI_FIX_ISSUES_PUBLISH: ${{ vars.CI_FIX_ISSUES_PUBLISH }}
        run: |
          set -euo pipefail
          python -m scripts.ci_fix.run publish --plan ci-fix-plan --outcome ci-fix-result
