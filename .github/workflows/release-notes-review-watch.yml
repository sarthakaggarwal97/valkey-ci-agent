name: Watch Release PR Reviews
run-name: "${{ inputs.stop && 'Stop watching' || 'Watch' }} ${{ inputs.repo }}#${{ inputs.pr }} reviews"

# One watcher per release PR. The cut starts it when it opens the PR. Each
# run holds one runner for 55 minutes (the App token's lifetime) and checks
# that one PR every five minutes; as soon as it starts it queues the next
# hour's run, which waits on the per-PR concurrency group and takes over the
# moment this one ends, so GitHub's scheduler is never on the critical path.
# The watch ends on its own once the PR is merged or closed. Start it by hand
# to resume a lost watch, or with `stop: true` to cancel it for that PR.
# The run-name must stay in step with watch_run_title() in review_poll.py.
on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repository of the release PR (valkey-io org)"
        required: true
        type: choice
        default: valkey
        options:
          - valkey
          - valkey-search
          - valkey-json
          - valkey-bloom
      pr:
        description: "Release pull request number"
        required: true
        type: string
      stop:
        description: "Stop watching this PR instead of starting"
        required: false
        type: boolean
        default: false

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  stop:
    name: Stop the watcher
    if: >-
      inputs.stop &&
      github.repository == 'valkey-io/valkey-ci-agent' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Cancelling this repository's own watcher runs.
      actions: write
    steps:
      - name: Check out agent repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up agent dependencies
        uses: ./.github/actions/setup-agent

      - name: Cancel every live watcher run for this PR
        env:
          RELEASE_NOTES_REVIEW_TOKEN: ${{ github.token }}
          RELEASE_NOTES_REVIEW_REPO: ${{ inputs.repo }}
          RELEASE_NOTES_REVIEW_PR: ${{ inputs.pr }}
        run: |
          python3 -m scripts.release_notes.review_poll \
            --repo "$RELEASE_NOTES_REVIEW_REPO" --pr "$RELEASE_NOTES_REVIEW_PR" --stop

  watch:
    name: Watch release-note review comments
    if: >-
      !inputs.stop &&
      github.repository == 'valkey-io/valkey-ci-agent' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    concurrency:
      group: release-notes-review-watch-${{ inputs.repo }}-${{ inputs.pr }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check out agent repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up agent dependencies
        uses: ./.github/actions/setup-agent

      # Two tokens, each as narrow as its half of the work: one reads the
      # release PR and posts its status comments, the other starts workflows
      # here (Address Release Note Reviews accepts only the App as its sender,
      # and the next hour's watcher). Neither can touch workflows in the
      # target repository or pull requests in this one.
      - name: Generate target token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
          private-key: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
          owner: valkey-io
          repositories: ${{ inputs.repo }}
          permission-members: read
          permission-pull-requests: write
          permission-metadata: read

      - name: Generate dispatch token
        id: agent-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
          private-key: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
          owner: valkey-io
          repositories: valkey-ci-agent
          permission-actions: write
          permission-metadata: read

      - name: Watch and dispatch
        env:
          RELEASE_NOTES_REVIEW_TOKEN: ${{ steps.token.outputs.token }}
          RELEASE_NOTES_REVIEW_AGENT_TOKEN: ${{ steps.agent-token.outputs.token }}
          RELEASE_NOTES_REVIEW_APP_SLUG: ${{ steps.token.outputs.app-slug }}
          RELEASE_NOTES_REVIEW_REPO: ${{ inputs.repo }}
          RELEASE_NOTES_REVIEW_PR: ${{ inputs.pr }}
          RELEASE_NOTES_REVIEW_POLL_INTERVAL_SECONDS: "300"
          RELEASE_NOTES_REVIEW_POLL_DURATION_SECONDS: "3300"
        run: |
          python3 -m scripts.release_notes.review_poll \
            --repo "$RELEASE_NOTES_REVIEW_REPO" --pr "$RELEASE_NOTES_REVIEW_PR"
