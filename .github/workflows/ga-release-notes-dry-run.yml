name: GA Release Notes Dry Run

on:
  push:
    branches: [agent/ga-release-notes-dry-run]
  workflow_dispatch:

permissions: {}

jobs:
  replay:
    if: github.repository == 'sarthakaggarwal97/valkey-ci-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        model: [fable, opus]
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      CLAUDE_CODE_USE_BEDROCK: "1"
      CI_AGENT_CLAUDE_MODEL: ${{ matrix.model }}
      RELEASE_NOTES_VERDICTS_PATH: ${{ github.workspace }}/ga-dry-run-artifacts/triage-verdicts.json
      REPLAY_ARTIFACT_DIR: ${{ github.workspace }}/ga-dry-run-artifacts
    steps:
      - name: Check out agent change
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up agent
        uses: ./.github/actions/setup-agent
        with:
          install-claude: "true"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: ga-dry-run-${{ github.run_id }}-${{ matrix.model }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Replay the pre-GA release with live AI
        env:
          # This token is scoped to this fork and has no upstream write grant.
          RELEASE_NOTES_GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${REPLAY_ARTIFACT_DIR}"
          python -m rehearsal.ga_release_notes_dry_run \
            2>&1 | tee "${REPLAY_ARTIFACT_DIR}/dry-run.log"

      - name: Upload generated notes and audit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ga-release-notes-dry-run-${{ matrix.model }}
          path: ${{ env.REPLAY_ARTIFACT_DIR }}
          if-no-files-found: ignore
          retention-days: 14
