name: CI Fix Comment Poll

# Scans recent valkey-io/valkey PR comments for "@valkeyrie-ops fix [<ci-link>]"
# and dispatches the ci-fix workflow for each new one. The trigger only; the
# fix itself runs in ci-fix.yml. Idempotency is a reaction marker on the
# comment, so overlapping or replayed ticks never double-dispatch.

on:
  workflow_dispatch:
    inputs:
      lookback_minutes:
        description: "Comment lookback window in minutes (default 180; widen to backfill after an outage, capped at 7 days)"
        required: false
        type: string
        default: "180"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: {}

jobs:
  poll:
    name: "Poll for fix commands"
    if: github.repository == 'valkey-io/valkey-ci-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    concurrency:
      group: ci-fix-comment-poll
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check out agent repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up agent dependencies
        uses: ./.github/actions/setup-agent

      - name: Generate App token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
          private-key: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
          owner: valkey-io
          repositories: valkey
          # Read comments and team membership, claim with a reaction.
          permission-members: read
          permission-issues: write
          permission-pull-requests: read
          permission-metadata: read

      - name: Generate dispatch token
        id: dispatch-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
          private-key: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
          owner: valkey-io
          repositories: valkey-ci-agent
          # Dispatch ci-fix.yml; nothing else on the agent repository.
          permission-actions: write
          permission-metadata: read

      - name: Poll and dispatch
        env:
          CI_FIX_POLL_TOKEN: ${{ steps.token.outputs.token }}
          CI_FIX_POLL_DISPATCH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
          CI_FIX_POLL_APP_SLUG: ${{ steps.token.outputs.app-slug }}
          CI_FIX_POLL_LOOKBACK_MINUTES: ${{ inputs.lookback_minutes || '180' }}
          CI_FIX_POLL_INTERVAL_SECONDS: ${{ github.event_name == 'schedule' && '1800' || '0' }}
          CI_FIX_POLL_DURATION_SECONDS: ${{ github.event_name == 'schedule' && '3300' || '0' }}
        run: python -m scripts.ci_fix.comment_poll
