name: Reconcile Releases
run-name: "${{ inputs.branch && format('Reconcile {0}', inputs.branch) || 'Reconcile all releases' }}"

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Optional release branch"
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-control
    concurrency:
      group: release-reconcile
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-agent
      - name: Mint source observer token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: valkey
          permission-administration: read
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-issues: write
          permission-metadata: read
          permission-pull-requests: read
      - name: Mint qualification token
        id: automation-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: valkey-release-automation
          permission-actions: write
          permission-contents: read
          permission-metadata: read
      - name: Recompute live state
        env:
          SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
          AUTOMATION_TOKEN: ${{ steps.automation-token.outputs.token }}
          AGENT_TOKEN: ${{ github.token }}
          CONTROLLER_APP_ID: ${{ vars.APP_ID }}
          NOTES_APP_ID: ${{ vars.RELEASE_NOTES_APP_ID }}
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          args=(--repo "${{ github.repository_owner }}/valkey" reconcile)
          if [[ -n "$BRANCH" ]]; then
            args+=(--branch "$BRANCH")
          fi
          python -m scripts.release.main "${args[@]}"
