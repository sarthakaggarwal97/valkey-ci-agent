# Reconcile active releases: recompute truth from GitHub and update trackers.
#
# For every policy-configured release branch with an open tracking issue, the
# controller recomputes the release state from live GitHub data: the
# release-notes PR (whose merge commit is the candidate SHA), the branch head
# (movement invalidates the candidate until an owner adopts the exact new
# head), and the required check runs on the exact candidate SHA. It then
# re-renders the issue. Nothing is parsed out of issue text; editing the issue
# changes nothing and is overwritten here.
#
# Short and idempotent: a run that finds no change edits nothing.
name: Release Reconcile

on:
  schedule:
    # Hourly scheduled run that reconciles every 10 minutes INTERNALLY: a
    # single run long-polls via RECONCILE_POLL_* below instead of trusting a
    # `*/10` cron, which GitHub fires unreliably at high frequency.
    # workflow_dispatch runs one immediate pass. Offset from :00 to dodge
    # GitHub's top-of-hour cron congestion.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Reconcile only this release branch (empty = all policy branches)"
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  reconcile:
    name: "Reconcile release trackers"
    # Scheduled runs happen in the canonical repo, or in a fork that has
    # opted in by setting the repository variable RELEASE_POLL_ENABLED to
    # 'true' (unattended end-to-end testing). Manual dispatch works
    # everywhere (against the fork policy registry).
    if: github.event_name == 'workflow_dispatch' || github.repository == 'valkey-io/valkey-ci-agent' || vars.RELEASE_POLL_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 58
    concurrency:
      # cancel-in-progress false: a queued manual dispatch waits for the
      # current (up to ~50 minute) scheduled pass cycle to finish rather
      # than killing it mid-pass; immediate need can cancel the scheduled
      # run from the UI first.
      group: release-reconcile
      cancel-in-progress: false
    permissions:
      contents: read
      # actions:write lets reconcile dispatch the publish pipeline in this
      # repo when a release turns READY (it holds at the approval gate).
      actions: write
    steps:
      - name: Check out agent repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up agent dependencies
        uses: ./.github/actions/setup-agent

      - name: Generate GitHub App token (valkey, read + tracker)
        id: generate-token
        # A fork configured with the App secrets uses them; one without
        # falls through to the AUTOMATION_PAT fallback below.
        # continue-on-error is fork-only: upstream, a missing or rotated
        # App secret fails fast here instead of deep in the run.
        continue-on-error: ${{ github.repository_owner != 'valkey-io' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
          private-key: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Deliberately NOT contents:write: reconciliation runs unattended
          # on a schedule outside the protected environment, so the token
          # that touches valkey must be incapable of creating the release or
          # its tag; publication-only-via-approval is capability-enforced.
          repositories: valkey
          permission-contents: read
          permission-issues: write
          permission-pull-requests: read
          permission-checks: read
          permission-actions: read
          permission-metadata: read

      - name: Generate GitHub App token (downstream, write)
        id: generate-downstream-token
        continue-on-error: ${{ github.repository_owner != 'valkey-io' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
          private-key: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Dispatches the qualification run and the bundle update
          # (actions:write, contents:write) and opens the helm bump PR
          # (contents:write + pull-requests:write). valkey itself is
          # excluded from this token's scope.
          # One mint cannot scope permissions per repository, so the write
          # grants are a union: contents:write is exercised only on
          # valkey-bundle (its update hook is a repository_dispatch) and
          # valkey-helm (bump branch + PR), actions:write only on
          # valkey-release-automation (qualification dispatch); the other
          # four repos are read-only verification targets carrying the
          # write grants as a tradeoff.
          repositories: |
            valkey-release-automation
            valkey-hashes
            valkey-container
            valkey-doc
            valkey-io.github.io
            valkey-bundle
            valkey-helm
          permission-contents: write
          permission-issues: read
          permission-pull-requests: write
          permission-checks: read
          permission-actions: write
          permission-metadata: read

      - name: Reconcile
        shell: bash
        env:
          RELEASE_GITHUB_TOKEN: ${{ steps.generate-token.outputs.token || (github.repository_owner != 'valkey-io' && (secrets.AUTOMATION_PAT || secrets.VALKEY_GITHUB_TOKEN)) || '' }}
          RELEASE_DOWNSTREAM_TOKEN: ${{ steps.generate-downstream-token.outputs.token || (github.repository_owner != 'valkey-io' && (secrets.AUTOMATION_PAT || secrets.VALKEY_GITHUB_TOKEN)) || '' }}
          AGENT_GITHUB_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch || '' }}
          TARGET_REPO: ${{ github.repository_owner }}/valkey
          POLICY: ${{ github.repository_owner == 'valkey-io' && 'release_policy.yml' || 'release_policy.fork.yml' }}
          # Scheduled runs long-poll (a pass every 10 minutes); manual
          # dispatch is one immediate pass, matching backport-poll. The
          # 3000s duration cap keeps every pass inside the 60-minute
          # App-token validity.
          RECONCILE_POLL_INTERVAL_SECONDS: ${{ github.event_name == 'schedule' && '600' || '0' }}
          RECONCILE_POLL_DURATION_SECONDS: ${{ github.event_name == 'schedule' && '3000' || '0' }}
        run: |
          set -euo pipefail
          args=(--policy "${POLICY}" --repo "${TARGET_REPO}" reconcile)
          if [[ -n "${BRANCH}" ]]; then
            args+=(--branch "${BRANCH}")
          fi
          python -m scripts.release.main "${args[@]}"
