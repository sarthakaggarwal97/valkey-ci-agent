name: Test Failure Detector

on:
  schedule:
    # Daily: 23 hours after Valkey's Daily (00:00 UTC) starts.
    - cron: "0 23 * * *"
    # Weekly: Valkey's Weekly starts Sunday 06:00 UTC and runs every release
    # branch two at a time; it has finished as late as 01:42 UTC Monday. A
    # Weekly run older than 7 days is never read, so a run still going at
    # this time is skipped rather than replaced by last week's.
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      workflow:
        description: "Scheduled workflow to analyze"
        required: false
        type: choice
        options:
          - daily
          - weekly
        default: daily
      repo:
        description: "Repository to scan (default: valkey-io/valkey)"
        required: false
        type: string
        default: "valkey-io/valkey"
      run_id:
        description: "Specific workflow run ID to analyze (empty = latest completed run of the workflow)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Parse and report only — don't create/update issues"
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: {}

jobs:
  detect-failures:
    name: "Detect test failures"
    if: >
      (github.event_name == 'workflow_dispatch' ||
      github.repository == 'valkey-io/valkey-ci-agent')
    runs-on: ubuntu-latest
    steps:
      - name: Check out agent repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up agent dependencies
        uses: ./.github/actions/setup-agent

      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
          private-key: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
          owner: valkey-io
          repositories: valkey
          permission-actions: read
          permission-issues: write
          permission-metadata: read

      - name: Run test failure detector
        env:
          TARGET_TOKEN: ${{ steps.generate-token.outputs.token }}
          TARGET_REPO: ${{ inputs.repo || 'valkey-io/valkey' }}
          RUN_ID: ${{ inputs.run_id || '' }}
          WORKFLOW: ${{ inputs.workflow || (github.event.schedule == '0 12 * * 1' && 'weekly') || 'daily' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && 'true' || 'false' }}
        run: |
          set -euo pipefail
          args=(
            -m scripts.test_failure_detector.main
            --token "${TARGET_TOKEN}"
            --repo "${TARGET_REPO}"
            --workflow "${WORKFLOW}"
            --verbose
          )

          if [[ -n "${RUN_ID}" ]]; then
            args+=(--run-id "${RUN_ID}")
          fi

          if [[ "${DRY_RUN}" == "true" ]]; then
            args+=(--dry-run)
          fi

          python "${args[@]}"
