name: Agent Fix Labelled Dispatch

# Starts agent-fix-labelled.yml once per Valkey issue that carries
# `needs-agent-fix` and waits for an answer, bugs first, keeping at most
# max_runs of those runs active at once (scripts/agent_fix/issue_dispatch.py).
# It only reads valkey-io/valkey; each dispatched run answers one issue.
# Then it looks after the pull requests the bot opened for such issues, one
# thing an hour: a merge conflict, a CI failure of its own, or marking one
# whose CI is green ready for review (scripts/agent_fix/upkeep.py).
#
# The schedule runs only while the AGENT_FIX_DISPATCH repository variable is
# "true": that is the switch that turns the label on and off. A change is
# posted on its issue unless AGENT_FIX_PUBLISH asks for a draft PR, so nothing
# is pushed by default.
on:
  # Fork rehearsal only, do not merge: registered for dispatch, never scheduled from main.
  workflow_dispatch:
    inputs:
      max_runs:
        description: "Most agent-fix-labelled runs active at once (empty = AGENT_FIX_MAX_RUNS, else 2)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "List what would be dispatched without dispatching"
        required: false
        type: boolean
        default: true

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dispatch:
    name: "Dispatch labelled issues"
    if: >-
      github.repository == 'sarthakaggarwal97/valkey-ci-agent'
      && (github.event_name == 'workflow_dispatch' || vars.AGENT_FIX_DISPATCH == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: agent-fix-labelled-dispatch
      cancel-in-progress: false
    permissions:
      contents: read
      # Lists and dispatches agent-fix-labelled.yml runs in this repository.
      actions: write
    steps:
      - name: Check out agent repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up agent dependencies
        uses: ./.github/actions/setup-agent

      - name: Generate target repository token
        id: target-token
        # Fork rehearsal only, do not merge: the PAT stands in for the App token.
        shell: bash
        env:
          PAT: ${{ secrets.REHEARSAL_PAT }}
        run: echo "token=${PAT}" >> "$GITHUB_OUTPUT"

      - name: Dispatch
        shell: bash
        env:
          TARGET_TOKEN: ${{ steps.target-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          E2E_BOT_LOGIN: sarthakaggarwal97  # Fork rehearsal only: the PAT's user stands in for the bot
          MAX_RUNS: ${{ inputs.max_runs || vars.AGENT_FIX_MAX_RUNS || '2' }}
          AGENT_FIX_PUBLISH: ${{ vars.AGENT_FIX_PUBLISH }}
          AGENT_FIX_REVIEWED_THROUGH: ${{ vars.AGENT_FIX_REVIEWED_THROUGH }}
          # A scheduled run has no inputs and dispatches for real.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--repo sarthakaggarwal97/valkey --queue labelled --max-runs "${MAX_RUNS}")  # Fork rehearsal only
          if [[ "${DRY_RUN}" == "true" ]]; then
            args+=(--dry-run)
          fi
          python -m scripts.agent_fix.issue_dispatch "${args[@]}" > dispatch.json
          cat dispatch.json
          { echo '```json'; cat dispatch.json; echo '```'; } >> "${GITHUB_STEP_SUMMARY}"

  # The bot's open pull requests exist only while changes are published as
  # draft PRs. One thing is done an hour, like the backport follow-up.
  upkeep:
    name: "Look after the bot's pull requests"
    if: >-
      github.repository == 'sarthakaggarwal97/valkey-ci-agent' && github.event_name == 'schedule'
      && vars.AGENT_FIX_DISPATCH == 'true' && vars.AGENT_FIX_PUBLISH == 'draft-pr'
    concurrency:
      group: agent-fix-labelled-upkeep
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/agent-fix-run.yml
    with:
      front_door: upkeep
      request: '{"repo":"sarthakaggarwal97/valkey"}'  # Fork rehearsal only
      key: upkeep-valkey
    secrets: inherit  # Fork rehearsal only, do not merge: the PAT stands in for the App
