# Registers the fuzzer-run monitor for dispatch and starts it on its schedule.
# The monitor itself is the workflow of the same name on the fuzzer-replay
# branch, which on a fork reads its own valkey-fuzzer's scheduled runs and
# files there: a dispatch with --ref fuzzer-replay runs that version, and the
# schedule here dispatches it. Do not merge.
name: Monitor Valkey Fuzzer Runs

on:
  schedule:
    - cron: "41 */4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List the candidate run without analyzing or filing an issue."
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  start:
    if: github.event_name == 'schedule' && github.repository_owner != 'valkey-io'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start the monitor on fuzzer-replay
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor-fuzzer.yml -R "${GITHUB_REPOSITORY}" --ref fuzzer-replay
