          -e SKIPTESTS \
          -e TEST_ARGS \
          -e CLUSTER_TEST_ARGS \
          i386/alpine:latest \
          sh -euxc '
            apk add --no-cache bash build-base git gtest-dev linux-headers procps python3 tcl tclx

            rm -rf libbacktrace
            git clone https://github.com/ianlancetaylor/libbacktrace.git libbacktrace
            cd libbacktrace
            git checkout b9e40069c0b47a722286b94eb5231f7f05c08713
            ./configure
            make -j$(nproc)
            make install
            cd /src

            make SERVER_CFLAGS="-Werror" USE_LIBBACKTRACE=yes 32bit

            case "${SKIPTESTS:-}" in
              *valkey*) ;;
              *) ./runtest ${RUN_ACCURATE:-} --failures-output test-failures/valkey.json --verbose --dump-logs ${TEST_ARGS:-} ;; ${{ inputs.test_args }}
            esac

            case "${SKIPTESTS:-}" in
              *modules*) ;;
              *)
                make -C tests/modules 32bit
                CFLAGS="-Werror" ./runtest-moduleapi --failures-output test-failures/moduleapi.json --verbose --dump-logs ${TEST_ARGS:-} ${{ inputs.test_args }}
                ;;
            esac

            case "${SKIPTESTS:-}" in
              *sentinel*) ;;
              *) ./runtest-sentinel --failures-output test-failures/sentinel.json ${CLUSTER_TEST_ARGS:-} ;;
            esac
          '
      if: '!contains(inputs.skiptests, ''modules'')'
    - name: Upload test failures
      if: always()
      uses: ./.github/actions/upload-test-failures
      with:
        job-name: ${{ github.job }}
    timeout-minutes: 180
  reply-schemas-validator:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: inputs.job == 'reply-schemas-validator'
    steps:
    - name: prep
      if: true
      run: |
        echo "GITHUB_REPOSITORY=${{inputs.use_repo || inputs.use_repo}}" >> $GITHUB_ENV
        echo "GITHUB_HEAD_REF=${{inputs.use_git_ref || inputs.use_git_ref}}" >> $GITHUB_ENV
        echo "skipjobs: ${{inputs.skipjobs}}"
        echo "skiptests: ${{inputs.skiptests}}"
        echo "test_args: ${{inputs.test_args}}"
        echo "cluster_test_args: ${{inputs.cluster_test_args}}"
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: ${{ inputs.use_repo }}
        ref: ${{ inputs.use_git_ref }}
    - name: Install libbacktrace
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: ianlancetaylor/libbacktrace
        ref: b9e40069c0b47a722286b94eb5231f7f05c08713
        path: libbacktrace
    - run: cd libbacktrace && ./configure && make && sudo make install
    - name: make
      run: make SERVER_CFLAGS='-Werror -DLOG_REQ_RES' USE_LIBBACKTRACE=yes
    - name: testprep
      run: sudo apt-get install tcl8.6 tclx
    - name: test
      if: (true && !contains(inputs.skiptests, 'valkey')) && inputs.fix == ''
      run: ./runtest --failures-output test-failures/valkey.json --log-req-res --no-latency --dont-clean --force-resp3 --tags -slow --verbose --dump-logs ${{inputs.test_args}}
    - name: module api test
      if: (true && !contains(inputs.skiptests, 'modules')) && inputs.fix == ''
      run: CFLAGS='-Werror' ./runtest-moduleapi --failures-output test-failures/moduleapi.json --log-req-res --no-latency --dont-clean --force-resp3 --dont-pre-clean --verbose --dump-logs ${{inputs.test_args}}
    - name: sentinel tests
      if: (true && !contains(inputs.skiptests, 'sentinel')) && inputs.fix == ''
      run: ./runtest-sentinel --failures-output test-failures/sentinel.json --log-req-res --dont-clean --force-resp3 ${{inputs.cluster_test_args}}
    - name: Install Python dependencies
      uses: py-actions/py-dependency-install@30aa0023464ed4b5b116bd9fbdab87acf01a484e
      with:
        path: ./utils/req-res-validator/requirements.txt
      if: inputs.fix == ''
    - name: validator
      run: ./utils/req-res-log-validator.py --verbose --fail-missing-reply-schemas ${{ (!contains(inputs.skiptests, 'valkey') && !contains(inputs.skiptests, 'module') && !contains(inputs.skiptests, 'sentinel') && !contains(inputs.skiptests, 'cluster')) && (inputs.test_args || inputs.test_args || '') == '' && (inputs.cluster_test_args || inputs.cluster_test_args || '') == '' && '--fail-commands-not-all-hit' || '' }}
      if: inputs.fix == ''
    - name: Upload test failures
      if: (always()) && inputs.fix == ''
      uses: ./.github/actions/upload-test-failures
      with:
        job-name: ${{ github.job }}
    - name: 'CI fix: check out the agent'
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.sha }}
        path: .ci-fix-agent
        persist-credentials: false
      if: inputs.fix != ''
    - name: 'CI fix: set up the agent'
      uses: ./.ci-fix-agent/.github/actions/setup-agent
      with:
        path: .ci-fix-agent
        install-claude: 'true'
      if: inputs.fix != ''
    - name: 'CI fix: download the plan'
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
      with:
        name: ci-fix-plan-${{ inputs.fix }}
        path: ${{ runner.temp }}/ci-fix-plan
      if: inputs.fix != ''
    - name: 'CI fix: configure AWS credentials'
      uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        role-session-name: ci-fix-${{ github.run_id }}
        aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
        role-duration-seconds: 4500
      if: inputs.fix != ''
    - name: 'CI fix: prepare the fix in this job'
      shell: bash
      env:
        CI_AGENT_CLAUDE_MODEL: ${{ vars.CI_AGENT_CLAUDE_MODEL }}
        CI_FIX_BUILD: make SERVER_CFLAGS='-Werror -DLOG_REQ_RES' USE_LIBBACKTRACE=yes
        CI_FIX_RUNTEST: ./runtest --log-req-res --no-latency --dont-clean --force-resp3 --tags -slow --verbose --dump-logs
        CI_FIX_RUNTEST_MODULEAPI: CFLAGS='-Werror' ./runtest-moduleapi --log-req-res --no-latency --dont-clean --force-resp3 --dont-pre-clean --verbose --dump-logs
      run: bash .ci-fix-agent/scripts/ci_fix/job.sh
      if: inputs.fix != ''
    - name: 'CI fix: upload the result'
      if: always() && inputs.fix != ''
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ci-fix-result-${{ inputs.fix }}
        path: ${{ runner.temp }}/ci-fix-out/
        if-no-files-found: ignore
        retention-days: 30
