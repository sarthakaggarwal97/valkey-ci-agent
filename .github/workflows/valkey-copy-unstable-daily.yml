        name: ci-fix-plan-${{ inputs.fix }}
        path: ${{ runner.temp }}/ci-fix-plan
    - name: 'CI fix: configure AWS credentials'
      uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        role-session-name: ci-fix-${{ github.run_id }}
        aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
        role-duration-seconds: 4500
    - name: 'CI fix: prepare the fix in this job'
      shell: bash
      env:
        CI_AGENT_CLAUDE_MODEL: ${{ vars.CI_AGENT_CLAUDE_MODEL }}
        CI_FIX_BUILD: make SERVER_CFLAGS='-Werror -DLOG_REQ_RES' USE_LIBBACKTRACE=yes
        CI_FIX_RUNTEST: ./runtest --log-req-res --no-latency --dont-clean --force-resp3 --tags -slow --verbose --dump-logs
        CI_FIX_RUNTEST_MODULEAPI: CFLAGS='-Werror' ./runtest-moduleapi --log-req-res --no-latency --dont-clean --force-resp3 --dont-pre-clean --verbose --dump-logs
      run: bash .ci-fix-agent/scripts/ci_fix/job.sh
    - name: 'CI fix: upload the result'
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ci-fix-result-${{ inputs.fix }}
        path: ${{ runner.temp }}/ci-fix-out/
        if-no-files-found: ignore
        retention-days: 30
