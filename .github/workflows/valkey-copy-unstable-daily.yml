# Generated by scripts/valkey_workflows/sync.py from valkey-io/valkey@b5028fa72f858eec4f2ab6b7df60e6d10a11cee4 (unstable):.github/workflows/daily.yml.
# Do not edit: the weekly sync rewrites it. See scripts/valkey_workflows/normalize.py.
name: 'Valkey copy: valkey-io/valkey@b5028fa72f858eec4f2ab6b7df60e6d10a11cee4 (unstable):.github/workflows/daily.yml'
'on':
  workflow_call:
    inputs:
      job:
        description: The id of the one job to run
        required: true
        type: string
      use_repo:
        description: Repository to check out
        type: string
        default: valkey-io/valkey
      use_git_ref:
        description: Branch or commit to check out
        required: true
        type: string
      skiptests:
        description: Test suites to skip (daily.yml's names)
        type: string
        default: ''
      test_args:
        description: Extra runtest arguments
        type: string
        default: ''
      valgrind_test:
        description: The one test file valgrind jobs run
        type: string
        default: ''
      cluster_test_args:
        description: Extra sentinel/cluster arguments
        type: string
        default: ''
      accurate:
        description: Pass --accurate, as scheduled runs do
        type: boolean
        default: true
      compat:
        description: Run the old-Redis compatibility steps
        type: boolean
        default: false
      fix:
        description: Prepare the fix ci-fix-run.yml planned under this name, instead of testing
        type: string
        default: ''
      fix_matrix:
        description: The matrix value of the one entry that prepares the fix
        type: string
        default: ''
      skipjobs:
        description: Read by the source workflow; empty in a copy
        type: string
        default: ''
    secrets:
      AWS_ROLE_ARN:
        description: The role fix mode assumes for the model
        required: false
permissions:
  contents: read
  id-token: write
jobs:
  test-ubuntu-jemalloc:
    runs-on: ubuntu-latest
    if: inputs.job == 'test-ubuntu-jemalloc'
    timeout-minutes: 180
    steps:
    - name: prep
      if: true
      run: |
        echo "GITHUB_REPOSITORY=${{inputs.use_repo || inputs.use_repo}}" >> $GITHUB_ENV
        echo "GITHUB_HEAD_REF=${{inputs.use_git_ref || inputs.use_git_ref}}" >> $GITHUB_ENV
        echo "skipjobs: ${{inputs.skipjobs}}"
        echo "skiptests: ${{inputs.skiptests}}"
        echo "test_args: ${{inputs.test_args}}"
        echo "cluster_test_args: ${{inputs.cluster_test_args}}"
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: ${{ inputs.use_repo }}
        ref: ${{ inputs.use_git_ref }}
    - name: Install libbacktrace
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: ianlancetaylor/libbacktrace
        ref: b9e40069c0b47a722286b94eb5231f7f05c08713
        path: libbacktrace
    - run: cd libbacktrace && ./configure && make && sudo make install
    - name: Install gtest
      run: sudo apt-get install pkg-config libgtest-dev libgmock-dev
    - name: make
      run: make all-with-unit-tests SERVER_CFLAGS='-Werror' USE_LIBBACKTRACE=yes
    - name: testprep
      run: sudo apt-get install tcl8.6 tclx
    - name: test
      if: (true && !contains(inputs.skiptests, 'valkey')) && inputs.fix == ''
      run: ./runtest ${{ inputs.accurate && '--accurate' || '' }} --failures-output test-failures/valkey.json --verbose --dump-logs ${{inputs.test_args}}
    - name: module api test
      if: (true && !contains(inputs.skiptests, 'modules')) && inputs.fix == ''
      run: CFLAGS='-Werror' ./runtest-moduleapi --failures-output test-failures/moduleapi.json --verbose --dump-logs ${{inputs.test_args}}
    - name: sentinel tests
      if: (true && !contains(inputs.skiptests, 'sentinel')) && inputs.fix == ''
      run: ./runtest-sentinel --failures-output test-failures/sentinel.json ${{inputs.cluster_test_args}}
    - name: unittest
      if: (true && !contains(inputs.skiptests, 'unittest')) && inputs.fix == ''
      run: |
        if [ -f ./src/unit/valkey-unit-gtests ]; then
          make test-unit accurate=1
        elif [ -f ./src/valkey-unit-tests ]; then
          ./src/valkey-unit-tests --accurate
        fi
    - name: install Redis OSS 6.2 server for compatibility testing
      run: |
        cd tests/tmp
        wget https://download.redis.io/releases/redis-6.2.14.tar.gz
        tar -xvf redis-6.2.14.tar.gz
      if: (inputs.compat) && inputs.fix == ''
    - name: make Redis OSS 6.2 server
      run: |
        cd tests/tmp/redis-6.2.14
        make
      if: (inputs.compat) && inputs.fix == ''
    - name: backward compatibility tests with OSS Redis 6.2 setup
      run: sudo apt-get install tcl8.6 tclx
      if: inputs.compat
    - name: backward compatibility tests with OSS Redis 6.2
      run: ./runtest --verbose --tags compatible-redis --dump-logs --other-server-path tests/tmp/redis-6.2.14/src/redis-server
      if: (inputs.compat) && inputs.fix == ''
    - name: install Redis OSS 7.0 server for compatibility testing
      run: |
        cd tests/tmp
        wget https://download.redis.io/releases/redis-7.0.15.tar.gz
        tar -xvf redis-7.0.15.tar.gz
      if: (inputs.compat) && inputs.fix == ''
    - name: make Redis OSS 7.0 server
      run: |
        cd tests/tmp/redis-7.0.15
        make
      if: (inputs.compat) && inputs.fix == ''
    - name: backward compatibility tests with OSS Redis 7.0 setup
      run: sudo apt-get install tcl8.6 tclx
      if: inputs.compat
    - name: backward compatibility tests with OSS Redis 7.0
      run: ./runtest --verbose --tags compatible-redis --dump-logs --other-server-path tests/tmp/redis-7.0.15/src/redis-server
      if: (inputs.compat) && inputs.fix == ''
    - name: Upload test failures
      if: (always()) && inputs.fix == ''
      uses: ./.github/actions/upload-test-failures
      with:
        job-name: ${{ github.job }}
    - name: 'CI fix: check out the agent'
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.sha }}
        path: .ci-fix-agent
        persist-credentials: false
      if: inputs.fix != ''
    - name: 'CI fix: set up the agent'
      uses: ./.ci-fix-agent/.github/actions/setup-agent
      with:
        path: .ci-fix-agent
        install-claude: 'true'
      if: inputs.fix != ''
    - name: 'CI fix: download the plan'
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
      with:
        name: ci-fix-plan-${{ inputs.fix }}
        path: ${{ runner.temp }}/ci-fix-plan
      if: inputs.fix != ''
    - name: 'CI fix: configure AWS credentials'
      uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        role-session-name: ci-fix-${{ github.run_id }}
        aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
        role-duration-seconds: 4500
      if: inputs.fix != ''
    - name: 'CI fix: prepare the fix in this job'
      shell: bash
      env:
        CI_AGENT_CLAUDE_MODEL: ${{ vars.CI_AGENT_CLAUDE_MODEL }}
        CI_FIX_BUILD: make all-with-unit-tests SERVER_CFLAGS='-Werror' USE_LIBBACKTRACE=yes
        CI_FIX_RUNTEST: ./runtest ${{ inputs.accurate && '--accurate' || '' }} --verbose --dump-logs
        CI_FIX_RUNTEST_MODULEAPI: CFLAGS='-Werror' ./runtest-moduleapi --verbose --dump-logs
      run: bash .ci-fix-agent/scripts/ci_fix/job.sh
      if: inputs.fix != ''
    - name: 'CI fix: upload the result'
      if: always() && inputs.fix != ''
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ci-fix-result-${{ inputs.fix }}
        path: ${{ runner.temp }}/ci-fix-out/
        if-no-files-found: ignore
        retention-days: 30
