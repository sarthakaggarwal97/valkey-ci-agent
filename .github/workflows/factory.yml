name: Factory

# One run fixes one issue a committer labelled needs-agent-fix: a test that
# demonstrates the issue first, then a change that makes it pass, as a draft
# PR when FACTORY_STEP is draft-pr and as a patch on the issue before that
# (scripts/factory). The fix runs like every other (ci-fix-run.yml), on the
# bot's own runner. Committers review and merge; this workflow never merges.
# factory-dispatch.yml finds an issue's active runs by this name, and counts
# its failed attempts for a labelling, which are never commented.
run-name: "Factory issue #${{ inputs.issue }}${{ inputs.label_event && format(' (label {0})', inputs.label_event) || '' }}"

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "The labelled issue's number"
        required: true
        type: number
      label_event:
        description: "The labelling this run answers (set by the dispatcher; 0 for a manual run)"
        required: false
        type: number
        default: 0

permissions: {}

concurrency:
  group: factory-issue-${{ inputs.issue }}
  cancel-in-progress: false
  queue: max

jobs:
  fix:
    if: github.repository == 'valkey-io/valkey-ci-agent'
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/ci-fix-run.yml
    with:
      front_door: factory
      # FACTORY_FORK names the fork the branch is pushed to; empty pushes to valkey itself.
      request: ${{ format('{{"repo":"valkey-io/valkey","issue":{0},"push_repo":{1}}}', inputs.issue, toJSON(vars.FACTORY_FORK || '')) }}
      key: factory-${{ inputs.issue }}
    secrets:
      VALKEYRIE_BOT_APP_ID: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
      VALKEYRIE_BOT_PRIVATE_KEY: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
