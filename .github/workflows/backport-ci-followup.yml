name: Backport CI Follow-up

# Find one current-head failure on an open bot-owned PR into each enabled
# branch, and fix it like every other failure (ci-fix-run.yml): prepared
# inside the copied Valkey job that failed when one can host it, pushed to the
# bot's branch, and verified by the target PR's normal CI.
on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Filter to this repository (empty = all enabled repos)"
        required: false
        type: string
        default: ""
      project_number:
        description: "Filter to this project number (empty = all)"
        required: false
        type: string
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: {}

jobs:
  preflight:
    name: Generate matrix
    if: github.repository == 'valkey-io/valkey-ci-agent'
    permissions:
      contents: read
    uses: ./.github/workflows/backport-matrix.yml
    with:
      repo: ${{ inputs.repo || '' }}
      project_number: ${{ inputs.project_number || '' }}
      automatic_ci_followup_only: true

  follow-up:
    name: "follow-up/${{ matrix.repo }}/${{ matrix.branch }}"
    needs: preflight
    if: needs.preflight.outputs.has_entries == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.preflight.outputs.matrix) }}
    concurrency:
      group: backport-branch-mutation-${{ matrix.repo }}-${{ matrix.branch }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ci-fix-run.yml
    with:
      front_door: follow-up
      request: ${{ format('{{"repo":"{0}","branch":"{1}"}}', matrix.repo, matrix.branch) }}
      key: ${{ matrix.repo_slug }}-${{ matrix.branch }}
      target_owner: ${{ matrix.repo_owner }}
      target_repo: ${{ matrix.repo_name }}
    secrets: inherit
