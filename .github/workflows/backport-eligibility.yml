name: Backport Eligibility

# Once a day, look at every PR merged to the development branch on the last
# three UTC days and comment on the ones that look eligible for backport,
# naming the release branches. The overlap re-covers a day a failed or skipped
# run missed; the marker comment keeps a PR from being commented on twice. It
# only suggests: nothing is added to a project.

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: "Repository from repos.yml"
        required: false
        type: string
        default: "valkey-io/valkey"
      date:
        description: "Last UTC merge date YYYY-MM-DD (empty = yesterday)"
        required: false
        type: string
        default: ""
      days:
        description: "UTC dates to cover, ending at date"
        required: false
        type: string
        default: "3"
      dry_run:
        description: "Report verdicts without commenting"
        required: false
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: {}

jobs:
  eligibility:
    name: "eligibility/${{ inputs.repo || 'valkey-io/valkey' }}"
    if: github.repository == 'valkey-io/valkey-ci-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      # Runs for one repo are serialized so two runs over the same date cannot
      # both comment; queue: max keeps every pending dispatch instead of only
      # the latest.
      group: backport-eligibility-${{ inputs.repo || 'valkey-io/valkey' }}
      cancel-in-progress: false
      queue: max
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      CLAUDE_CODE_USE_BEDROCK: "1"
      TARGET_REPO: ${{ inputs.repo || 'valkey-io/valkey' }}
      MERGE_DATE: ${{ inputs.date || '' }}
      MERGE_DAYS: ${{ inputs.days || '3' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out agent repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up agent dependencies
        uses: ./.github/actions/setup-agent
        with:
          install-claude: "true"

      - name: Resolve target repository
        id: target
        shell: bash
        run: |
          set -euo pipefail
          echo "owner=${TARGET_REPO%%/*}" >> "${GITHUB_OUTPUT}"
          echo "name=${TARGET_REPO#*/}" >> "${GITHUB_OUTPUT}"

      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
          private-key: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          permission-contents: read
          # Commenting on a PR needs pull-requests:write; issues:write is not needed.
          permission-pull-requests: write
          permission-organization-projects: read
          permission-metadata: read

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: backport-eligibility-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Evaluate merged PRs
        shell: bash
        env:
          TARGET_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          set -euo pipefail
          args=(--registry repos.yml --repo "${TARGET_REPO}" --days "${MERGE_DAYS}" --verbose)
          if [[ -n "${MERGE_DATE}" ]]; then
            args+=(--date "${MERGE_DATE}")
          fi
          if [[ "${DRY_RUN}" == "true" ]]; then
            args+=(--dry-run)
          fi
          python -m scripts.backport.eligibility "${args[@]}" | tee backport-eligibility-result.json

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backport-eligibility-result-${{ github.run_id }}
          path: backport-eligibility-result.json
          if-no-files-found: ignore
          retention-days: 30
