name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up agent dependencies
        uses: ./.github/actions/setup-agent
        with:
          python-version: ${{ matrix.python-version }}
          install-mode: dev
          # The confinement test drives the pinned CLI the agents run.
          install-claude: ${{ matrix.python-version == '3.11' && 'true' || 'false' }}

      - name: Run ruff lint
        if: matrix.python-version == '3.11'
        run: ruff check scripts/ tests/

      - name: Run pytest
        if: matrix.python-version != '3.11'
        run: pytest -v

      - name: Create an account for the verification isolation tests
        if: matrix.python-version == '3.11'
        run: |
          sudo useradd --create-home --shell /bin/bash ci-fix-verify
          echo "CI_FIX_TEST_VERIFY_USER=ci-fix-verify" >> "${GITHUB_ENV}"

      - name: Run pytest with coverage
        if: matrix.python-version == '3.11'
        env:
          REQUIRE_CLAUDE_CLI: "1"
        run: pytest --cov=scripts --cov-report=term-missing --cov-report=xml --cov-fail-under=60 -v

      - name: Run mypy type checking
        if: matrix.python-version == '3.11'
        run: mypy scripts/
