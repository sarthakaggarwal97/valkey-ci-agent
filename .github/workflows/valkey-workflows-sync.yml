name: Valkey Workflow Copies Sync

# Keeps .github/workflows/valkey-copy-*.yml, the callable copies of Valkey's
# daily.yml and ci.yml for unstable and every release branch, in step with
# valkey-io/valkey. The CI-fix bot prepares a fix inside the copied job that
# failed. A change is proposed as a pull request; a maintainer reviews and
# merges it like any other workflow change.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    name: "Sync Valkey workflow copies"
    if: github.repository == 'valkey-io/valkey-ci-agent'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: valkey-workflows-sync
      cancel-in-progress: false
    steps:
      - name: Check out agent repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up agent dependencies
        uses: ./.github/actions/setup-agent

      - name: Rewrite the copies from valkey-io/valkey
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.valkey_workflows.sync --report "${RUNNER_TEMP}/lost-jobs.md"

      - name: Generate pull request token
        id: token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
          private-key: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
          owner: valkey-io
          repositories: valkey-ci-agent
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          permission-metadata: read

      - name: Open or update the sync pull request
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BRANCH: bot/valkey-workflows-sync
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- .github/workflows scripts/valkey_workflows/manifest.json)" ]]; then
            echo "The copies already match valkey-io/valkey."
            exit 0
          fi
          git config user.name "valkeyrie-ops[bot]"
          git config user.email "valkeyrie-ops[bot]@users.noreply.github.com"
          git switch -C "${BRANCH}"
          git add -A -- .github/workflows scripts/valkey_workflows/manifest.json
          git commit -q -m "Sync the Valkey workflow copies with valkey-io/valkey"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          body="${RUNNER_TEMP}/body.md"
          echo "Generated by valkey-workflows-sync.yml from the current daily.yml and ci.yml of unstable and every release branch. Review the copies' diff like any workflow change: CI-fix prepares fixes inside these jobs." > "${body}"
          if [[ -s "${RUNNER_TEMP}/lost-jobs.md" ]]; then
            printf '\n**These jobs lost their copy;** their failures will be fixed on the bot'"'"'s own runner until the normalizer (scripts/valkey_workflows/normalize.py) understands them again:\n\n' >> "${body}"
            cat "${RUNNER_TEMP}/lost-jobs.md" >> "${body}"
          fi
          pr="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${BRANCH}" --state open --json number --jq '.[].number')"
          if [[ -z "${pr}" ]]; then
            gh pr create --repo "${GITHUB_REPOSITORY}" --head "${BRANCH}" --base main \
              --title "Sync the Valkey workflow copies with valkey-io/valkey" --body-file "${body}"
          else
            gh pr edit "${pr}" --repo "${GITHUB_REPOSITORY}" --body-file "${body}"
          fi
