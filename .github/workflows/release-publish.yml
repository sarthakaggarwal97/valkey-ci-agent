name: Publish Release
run-name: "Publish release on ${{ inputs.branch }} @ ${{ inputs.candidate_sha }}"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Release line, e.g. 9.1"
        required: true
        type: string
      candidate_sha:
        description: "Exact current release-branch commit (full 40-character SHA)"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-publish-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate candidate and render plan
    if: github.repository == 'sarthakaggarwal97/valkey-ci-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-control
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      plan_digest: ${{ steps.plan.outputs.plan_digest }}
    steps:
      - name: Validate SHA shape
        env:
          SHA: ${{ inputs.candidate_sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "candidate_sha must be a full lowercase 40-character SHA" >&2
            exit 1
          }

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: ./.github/actions/setup-agent

      - name: Validate and plan
        id: plan
        env:
          RELEASE_GITHUB_TOKEN: ${{ secrets.VALKEY_GITHUB_TOKEN }}
          BRANCH: ${{ inputs.branch }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          POLICY: release_policy.e2e.yml
        run: |
          set -euo pipefail
          [[ -n "$RELEASE_GITHUB_TOKEN" ]] || {
            echo "VALKEY_GITHUB_TOKEN is required for fork E2E" >&2
            exit 1
          }
          python -m scripts.release.main --policy "$POLICY" plan \
            --branch "$BRANCH" --candidate-sha "$CANDIDATE_SHA"

  qualify:
    name: Qualify exact candidate
    needs: validate
    permissions:
      contents: write
      id-token: write
    uses: sarthakaggarwal97/valkey-release-automation/.github/workflows/qualify-release.yml@e2e/streamlined-release-automation
    with:
      version: ${{ needs.validate.outputs.version }}
      source_sha: ${{ needs.validate.outputs.sha }}
      request_id: ${{ format('{0}-{1}', github.run_id, github.run_attempt) }}
      automation_repo: sarthakaggarwal97/valkey-release-automation
      automation_ref: e2e/streamlined-release-automation

  publish:
    name: Publish approved release
    needs: [validate, qualify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: ./.github/actions/setup-agent

      - name: Resolve approving human
        id: approver
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          APPROVER=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/approvals" \
            --jq '[.[] | select(.state == "approved") | select([.environments[]?.name] | index("release"))] | last.user.login // empty')
          [[ -n "$APPROVER" ]] || {
            echo "No human approval record exists for the release environment" >&2
            exit 1
          }
          [[ "$APPROVER" != "$TRIGGERING_ACTOR" ]] || {
            echo "The workflow dispatcher cannot approve their own release" >&2
            exit 1
          }
          echo "login=$APPROVER" >> "$GITHUB_OUTPUT"

      - name: Revalidate and publish
        env:
          RELEASE_GITHUB_TOKEN: ${{ secrets.VALKEY_GITHUB_TOKEN }}
          BRANCH: ${{ inputs.branch }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          APPROVER: ${{ steps.approver.outputs.login }}
          EXPECTED_DIGEST: ${{ needs.validate.outputs.plan_digest }}
          POLICY: release_policy.e2e.yml
        run: |
          set -euo pipefail
          [[ -n "$RELEASE_GITHUB_TOKEN" ]] || {
            echo "VALKEY_GITHUB_TOKEN is required for fork E2E" >&2
            exit 1
          }
          python -m scripts.release.main --policy "$POLICY" publish \
            --branch "$BRANCH" --candidate-sha "$CANDIDATE_SHA" \
            --actor "$APPROVER" --expected-digest "$EXPECTED_DIGEST"
