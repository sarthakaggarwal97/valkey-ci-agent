name: Publish Release
run-name: "Publish ${{ inputs.identity }}"

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Durable release issue number"
        required: true
        type: string
      identity:
        description: "Immutable v1 release identity"
        required: true
        type: string

permissions: {}
concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-control
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-agent
      - name: Mint read-only source token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: valkey
          permission-administration: read
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-issues: read
          permission-metadata: read
          permission-pull-requests: read
      - name: Mint read-only qualification token
        id: automation-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: valkey-release-automation
          permission-administration: read
          permission-actions: read
          permission-contents: read
          permission-metadata: read
      - name: Revalidate and show approval plan
        env:
          SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
          AUTOMATION_TOKEN: ${{ steps.automation-token.outputs.token }}
          AGENT_TOKEN: ${{ github.token }}
          CONTROLLER_APP_ID: ${{ vars.APP_ID }}
          NOTES_APP_ID: ${{ vars.RELEASE_NOTES_APP_ID }}
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          ISSUE: ${{ inputs.issue }}
          IDENTITY: ${{ inputs.identity }}
        run: |
          set -euo pipefail
          python -m scripts.release.main --repo "${{ github.repository_owner }}/valkey" \
            publish --issue "$ISSUE" --identity "$IDENTITY"

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-agent
      - name: Mint sole source publication token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: valkey
          permission-administration: read
          permission-actions: read
          permission-checks: read
          permission-contents: write
          permission-issues: write
          permission-members: read
          permission-metadata: read
          permission-pull-requests: read
      - name: Mint sole production-dispatch token
        id: automation-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: valkey-release-automation
          permission-administration: read
          permission-actions: write
          permission-contents: write
          permission-metadata: read
      - name: Verify current controller and resolve approver
        id: approver
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)" == "$GITHUB_SHA" ]] || { echo "Controller changed after dispatch" >&2; exit 1; }
          login=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/approvals" \
            --jq '[.[] | select(.state == "approved")] | last.user.login // empty')
          [[ -n "$login" ]] || { echo "No human approval record found" >&2; exit 1; }
          echo "login=$login" >> "$GITHUB_OUTPUT"
      - name: Revalidate, publish, receipt, and dispatch
        env:
          SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
          AUTOMATION_TOKEN: ${{ steps.automation-token.outputs.token }}
          AGENT_TOKEN: ${{ github.token }}
          CONTROLLER_APP_ID: ${{ vars.APP_ID }}
          NOTES_APP_ID: ${{ vars.RELEASE_NOTES_APP_ID }}
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          ISSUE: ${{ inputs.issue }}
          IDENTITY: ${{ inputs.identity }}
          APPROVER: ${{ steps.approver.outputs.login }}
        run: |
          set -euo pipefail
          python -m scripts.release.main --repo "${{ github.repository_owner }}/valkey" \
            publish --issue "$ISSUE" --identity "$IDENTITY" --execute --approver "$APPROVER"
