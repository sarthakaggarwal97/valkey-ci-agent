name: Start Release
run-name: "Start Release on ${{ github.event.client_payload.branch }}"

on:
  repository_dispatch:
    types: [release-start]

permissions: {}

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-control
    concurrency:
      group: release-start-${{ github.event.client_payload.branch }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-agent
      - name: Mint non-publishing controller token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: valkey
          permission-actions: read
          permission-contents: read
          permission-issues: write
          permission-members: read
          permission-metadata: read
      - name: Authenticate source run and start
        env:
          AGENT_TOKEN: ${{ github.token }}
          SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
          CONTROLLER_APP_ID: ${{ vars.APP_ID }}
          NOTES_APP_ID: ${{ vars.RELEASE_NOTES_APP_ID }}
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          START_RELAY_BOT_ID: ${{ vars.START_RELAY_BOT_ID }}
          SOURCE_RUN: ${{ github.event.client_payload.source_run }}
          EVENT_SENDER: ${{ github.event.sender.id }}
          BRANCH: ${{ github.event.client_payload.branch }}
          INTENT: ${{ github.event.client_payload.intent }}
          URGENCY: ${{ github.event.client_payload.urgency }}
        run: |
          set -euo pipefail
          python -m scripts.release.main --repo "${{ github.repository_owner }}/valkey" start \
            --branch "$BRANCH" --intent "$INTENT" --urgency "$URGENCY" \
            --source-run "$SOURCE_RUN" --event-sender "$EVENT_SENDER"
