name: Restart Release PR Watchers
run-name: Restart missing release PR watchers

# Safety net for the per-PR review watchers (release-notes-review-watch.yml):
# start a watcher for every open release PR that has none, whether its chain
# broke on an API error or the PR was already open when the watcher landed.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  restart:
    name: Start watchers for unwatched release PRs
    if: >-
      github.repository == 'valkey-io/valkey-ci-agent' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-notes-review-restart
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check out agent repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up agent dependencies
        uses: ./.github/actions/setup-agent

      - name: Generate App token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
          private-key: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
          owner: valkey-io
          repositories: |
            valkey
            valkey-search
            valkey-json
            valkey-bloom
            valkey-ci-agent
          # actions:write on this repository starts the watcher workflow;
          # pull-requests:read lists the open release PRs.
          permission-actions: write
          permission-pull-requests: read
          permission-metadata: read

      - name: Start a watcher for every unwatched release PR
        env:
          RELEASE_NOTES_REVIEW_TOKEN: ${{ steps.token.outputs.token }}
        run: python3 -m scripts.release_notes.review_poll --restart-missing
