name: CI Fix Bot

# A maintainer comments "@valkeyrie-ops fix [<run-url>] [hint]" on a
# valkey-io/valkey PR; ci-fix-comment-poll.yml dispatches this workflow with
# the verified commenter. It can also be dispatched by hand.
#
# The gate step authorizes the request before any AI or PR code runs and
# decides how it may be published. Prepare diagnoses with a read-only token.
# Publish gets a fresh token (an App token lasts one hour) scoped by the gate's
# decision: push-capable only for a bot-owned agent/... branch of this
# repository, comment-only for any other PR, including forks.
on:
  workflow_dispatch:
    inputs:
      repo:
        description: "PR repository, e.g. valkey-io/valkey"
        required: true
        type: string
      pr:
        description: "PR number"
        required: true
        type: number
      run_url:
        description: "Failed GitHub Actions run URL (empty = the most actionable failed run on the PR head)"
        required: false
        type: string
        default: ""
      hint:
        description: "Optional diagnosis hint"
        required: false
        type: string
      commenter:
        description: "Requesting user (honored only when dispatched by the trusted poller App)"
        required: false
        type: string
      comment_id:
        description: "Triggering comment id, reacted to with the run outcome"
        required: false
        type: string

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    concurrency:
      # Serialize ci-fix runs for the same PR so two dispatches don't push at
      # once. The exact-head lease (see push.py) still guards against any other
      # writer of the same branch.
      group: ci-fix-${{ inputs.pr }}
      cancel-in-progress: false
      # Keep every queued request: the default keeps only one pending run and
      # cancels it when another arrives, dropping a claimed comment silently.
      queue: max
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      CLAUDE_CODE_USE_BEDROCK: "1"
      CI_AGENT_EVIDENCE_DIR: agent-evidence
    steps:
      - name: Check out agent repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up agent dependencies
        uses: ./.github/actions/setup-agent
        with:
          install-claude: "true"

      - name: Validate inputs
        shell: bash
        env:
          CI_FIX_REPO: ${{ inputs.repo }}
          CI_FIX_PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          if [[ "${CI_FIX_REPO}" != "valkey-io/valkey" ]]; then
            echo "ci-fix.yml is currently scoped to valkey-io/valkey (got: ${CI_FIX_REPO})" >&2
            exit 1
          fi
          if [[ ! "${CI_FIX_PR}" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number: ${CI_FIX_PR}" >&2
            exit 1
          fi
          echo "CI_FIX_STATE_FILE=${RUNNER_TEMP}/ci-fix/state.json" >> "${GITHUB_ENV}"

      - name: Generate preparation token
        id: prepare-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
          private-key: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
          owner: valkey-io
          repositories: valkey
          # members:read for the contributors-team check; actions:read for run
          # logs and jobs; read access to the PR. Nothing here can write.
          permission-members: read
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read
          permission-metadata: read

      - name: Gate the request
        id: gate
        shell: bash
        env:
          TARGET_TOKEN: ${{ steps.prepare-token.outputs.token }}
          CI_FIX_REPO: ${{ inputs.repo }}
          CI_FIX_PR: ${{ inputs.pr }}
          CI_FIX_RUN_URL: ${{ inputs.run_url || '' }}
          # The commenter input is honored only when the trusted poller App
          # dispatched this run; any other dispatcher (a human via the Actions
          # UI) falls back to github.actor, so a manual run cannot rewrite the
          # audit attribution. The gate authorizes whichever principal is chosen.
          CI_FIX_COMMENTER: ${{ (github.actor == 'valkeyrie-ops[bot]' && inputs.commenter) || github.actor }}
          CI_FIX_HINT: ${{ inputs.hint || '' }}
          CI_FIX_COMMENT_ID: ${{ inputs.comment_id || '0' }}
        run: |
          set -euo pipefail
          if [[ ! "${CI_FIX_COMMENT_ID}" =~ ^[0-9]+$ ]]; then
            CI_FIX_COMMENT_ID=0
          fi
          python -m scripts.ci_fix.main gate \
            --state "${CI_FIX_STATE_FILE}" \
            --repo "${CI_FIX_REPO}" \
            --pr "${CI_FIX_PR}" \
            --run-url="${CI_FIX_RUN_URL}" \
            --commenter "${CI_FIX_COMMENTER}" \
            --hint="${CI_FIX_HINT}" \
            --comment-id "${CI_FIX_COMMENT_ID}"

      - name: Generate agent-repo token (macOS verify dispatch)
        id: agent-token
        # Only a request whose code may run here can need macOS verification.
        if: steps.gate.outputs.execute == 'true'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
          private-key: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
          owner: valkey-io
          repositories: valkey-ci-agent
          # actions:write to dispatch the verify-macos workflow and read its
          # run status; nothing else on the agent repo.
          permission-actions: write
          permission-metadata: read

      - name: Configure AWS credentials
        if: steps.gate.outputs.publication == 'push' || steps.gate.outputs.publication == 'suggest'
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: valkey-ci-fix-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200

      - name: Prepare the CI fix
        if: steps.gate.outputs.publication == 'push' || steps.gate.outputs.publication == 'suggest'
        # Shorter than the job timeout so publication still reports a timeout.
        timeout-minutes: 100
        shell: bash
        env:
          TARGET_TOKEN: ${{ steps.prepare-token.outputs.token }}
          CI_FIX_MACOS_AGENT_REPO: valkey-io/valkey-ci-agent
          CI_FIX_MACOS_AGENT_REF: main
          CI_FIX_MACOS_TOKEN: ${{ steps.agent-token.outputs.token || '' }}
          CI_FIX_VERIFY_RUNS: ${{ vars.CI_FIX_VERIFY_RUNS || '2' }}
        run: python -m scripts.ci_fix.main prepare --state "${CI_FIX_STATE_FILE}"

      - name: Check for a prepared decision
        id: prepared
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          [[ -f "${CI_FIX_STATE_FILE:-}" ]] && publish=true || publish=false
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"

      - name: Generate publication token
        id: push-token
        if: ${{ !cancelled() && steps.prepared.outputs.publish == 'true' && steps.gate.outputs.publication == 'push' }}
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
          private-key: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
          owner: valkey-io
          repositories: valkey
          # contents:write + workflows:write to push the fix (a CI fix is often
          # a workflow-file change); issues:write + pull-requests:write to
          # comment and react; pull-requests also to revalidate the head.
          permission-contents: write
          permission-workflows: write
          permission-pull-requests: write
          permission-issues: write
          permission-metadata: read

      - name: Generate comment token
        id: comment-token
        if: ${{ !cancelled() && steps.prepared.outputs.publish == 'true' && steps.gate.outputs.publication != 'push' }}
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
          private-key: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
          owner: valkey-io
          repositories: valkey
          # A suggestion or a refusal is only a comment and a reaction.
          permission-issues: write
          permission-pull-requests: write
          permission-metadata: read

      - name: Publish the CI fix
        if: ${{ !cancelled() && steps.prepared.outputs.publish == 'true' }}
        shell: bash
        env:
          TARGET_TOKEN: ${{ steps.push-token.outputs.token || steps.comment-token.outputs.token }}
          PUBLICATION: ${{ steps.gate.outputs.publication }}
        run: |
          python -m scripts.ci_fix.main publish \
            --state "${CI_FIX_STATE_FILE}" --publication "${PUBLICATION:-none}"

      - name: Clean up prepared state
        if: always()
        shell: bash
        run: rm -rf -- "${RUNNER_TEMP}/ci-fix"

      - name: Upload agent evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-fix-agent-evidence-${{ github.run_id }}
          path: agent-evidence
          if-no-files-found: ignore
          retention-days: 30
