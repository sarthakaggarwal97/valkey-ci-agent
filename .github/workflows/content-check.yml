name: Rehearsal notes content check (upstream, dry run)
on:
  push:
    branches: [rehearsal/content-check]
permissions: {}
jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {version: 7.2.15, sweep: "4908", urgency: SECURITY, fix: "(CVE-2026-21863) Validate PUBLISH and MODULE payload lengths against the cluster bus packet size"}
          - {version: 8.0.12, sweep: "4685", urgency: LOW, fix: ""}
          - {version: 8.1.11, sweep: "4687", urgency: LOW, fix: ""}
          - {version: 9.0.7, sweep: "4906", urgency: LOW, fix: ""}
          - {version: 9.1.3, sweep: "4907", urgency: MODERATE, fix: ""}
    env:
      CLAUDE_CODE_USE_BEDROCK: "1"
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: {persist-credentials: false, fetch-depth: 1}
      - uses: ./.github/actions/setup-agent
        with: {install-claude: "true"}
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: content-check-${{ github.run_id }}
          aws-region: us-east-1
      - name: Dry-run cut against valkey-io/valkey
        env:
          RELEASE_NOTES_GITHUB_TOKEN: ${{ secrets.REHEARSAL_PAT }}
          CONTENT_CHECK_SWEEP_PR: ${{ matrix.sweep }}
          VERSION: ${{ matrix.version }}
          URGENCY: ${{ matrix.urgency }}
          FIX: ${{ matrix.fix }}
        run: |
          args=(-m scripts.release_notes.main --repo valkey-io/valkey --version "$VERSION" --stage ga
                --urgency "$URGENCY" --date 2026-10-26 --dry-run --force-ready)
          [[ -n "$FIX" ]] && args+=(--security-fix "$FIX")
          python "${args[@]}" 2>&1 | tee cut.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: {name: "cut-${{ matrix.version }}", path: cut.log}
